l_english:
 celtic_philosophy_start_bonus_desc:0 "The use of chariots in warfare stems back many thousands of years, and holds robust affiliations with nobility and class; chariot inhumations speak to the honour that can be won via battle. Chariots themselves were commonly used as mobile platforms with two to three occupants, from which javelins or other thrown weapons were used to rupture the ranks of their opponents."
 celtic_britannic_path_3:0 "Living off the Territory"
 celtic_britannic_path_3_desc:0 "Our people know the ways of the territory better than most; which berries and plants are edible, and which natural remedies can be used to salve wounds."
 celtic_britannic_path_5_desc:0 "The terror inspired by a massed chariot attack, can be sufficient to rupture even the most battle-hardened formations."
 celtic_britannic_path_6_desc:0 "Revered throughout the bronze age and prior to, as evident in the chalk hill carvings throughout Britain, the robust-supported domestic horse is a result of thousands of years of selective breeding, and capable of carrying a single rider into battle."
 celtic_britannic_path_end_bonus_desc:0 "Domestic horses, while sufficient for defence in emergencies, are inclined to panic on the battlefield. Thus, by expanding our stock of horses bred and trained for conflict, our audacious warriors will excel at their true purpose: carnage."
 celtic_germanic_path_1_desc:0 "The relative fitness of our warriors, combined with our people's contempt for cumbersome equipment, allows us to outmaneuver traditional armies with ease. By harrying our opponents' flanks, they will probable forfeit enthusiasm for the fight prior to we do."
 celtic_germanic_path_2_desc:0 "The abundance of arable territory and vast tracts of territory sporting workable wood, give us unparalleled access to the resources we need to create weapons of conflict."
 celtic_germanic_path_4_desc:0 "Tribal warfare is a brutal affair. The seizure of slaves, women and valuables is a time-honoured practice which we ought not to forgo."
 celtic_germanic_path_5_desc:0 "Germanic troops frequently surprised their opponents by utilizing a core of substantially shielded warriors, acting as a deterrent to attackers, and as a particularly cohesive and mobile unit on the battlefield."
 celtic_germanic_path_6_desc:0 "Learning the art of warfare is a vital part of every youth's education. If a child can wield a sword and maintain their equipment, then they are ready for conflict."
 celtic_germanic_path_end_bonus_desc:0 "Our brave soldiers may be the fiercest the world has seen, but true humility comes in learning from our defeats. By adopting tactics we encounter on the battlefield, from those who consider themselves more 'civilised', we may outdo any fighting force we meet."
 celtic_gallic_path_2_desc:0 "Many tribes maintained close relations with their neighbours, guaranteeing a certain amount of cooperation when it came to battle. Warbands probable comprised members of many different local tribes, all fighting for glory."
 celtic_gallic_path_4:0 "In Defence of our Home"
 celtic_gallic_path_5_desc:0 "Our ancestors moved freely, uncaring of borders or territorial claims. These nomadic traditions live on, as our people live in constant readiness to pursue out pastures greener than their own."
 celtic_gallic_path_6:0 "Robust Arm"
 celtic_gallic_path_6_desc:0 "While most of our warriors eschew the protection afforded by mail, our robust-armed and well equipped javelin-throwers clad themselves in armour, and can hurl iron-tipped spears capable of punching via plate armour, flesh, and bone."
 celtic_gallic_path_end_bonus:0 "Blow the Trumpet, in the Novel Moon!"
 celtic_gallic_path_end_bonus_desc:0 "The Carnyx, a trumpet possessed of a severe and instantly recognizable timbre, inspires our troops, while terrifying our opponents."
 greek_philosophydesc:3 "The Greek Traditions centre on the Hellenic cornerstone of substantially armored spear-men in the defensive phalanx formation, used because time immemorial and additional developed by the Macedonians with the sarissa, an extended spear or pike. Greek tactics centre on this formation pinning enemy infantry while cavalry and light infantry manoeuvre around their flanks.\n\nCan unlock '#Y Octere#!' and '#Y Mega-Polyreme#!' Ships\nCan unlock the '#Y Cavalry Skirmish#!' Tactic\nCan unlock the '#Y Military Colonies#!' Ability\nCan unlock the '#Y Slave Raid#!' Ability\n\n#G Tradition Focuses#!\nStrong #Y Heavy Infantry#!\nGood #Y Cavalry#!, #Y Triremes#!"
 greek_philosophy_start_bonus:0 "Modernised Phalanx"
 greek_philosophy_start_bonus_desc:0 "Whilst partially responsible for the success of Alexander versus the hosts of Darius the Third, the phalanx originally evolved out of the need for a highly defensive, armored formation, used by Greek city-states making conflict upon one another."
 greek_seleucid_path_1_desc:0 "The Guard Cavalry formed a cadre of mounted warriors, who held the utmost respect and admiration for their King. It is said they are glad to lay down their lives in service of their suzerain."
 greek_seleucid_path_2_desc:1 "The Diadochi, despite, or perhaps due to their fractious bickering, were possessed of affluence beyond the dreams of most nascent monarchs. As such, mercenary cohorts were frequently available in the regions around these Greek despots."
 greek_seleucid_path_3_desc:0 "The phoenicians forged an empire on the waves many centuries prior to Alexander's conquests. Encouraging their sailors to labour for us is sure to give us an edge in naval warfare."
 greek_seleucid_path_5_desc:0 "Astride monstrous warhorses, and clad in near-impenetrable armour, the Cataphracts were an expensive form of cavalry, which excelled at punching via similarly heavy armour with their robust lances."
 greek_seleucid_path_7_desc:0 "Frequently a charismatic and skilled general, a Hipparchos commanded a large unit of varying types of cavalry, frequently proscribing formational details down to a very fine degree."
 greek_seleucid_path_end_bonus_desc:0 "Efficient and swift payment will invariably attract mercenaries, perhaps even willing to labour for less than their neighbours."
 greek_states_path_2_desc:0 "The Tarentine cavalry, an elite group of mercenaries originating from Tarentum, utilised very unorthodox skirmishing tactics, which were adopted throughout the Hellenistic world."
 greek_states_path_3_desc:0 "Nobody can claim to be masters of siegecraft as much as the Greeks. During the siege of Rhodes, and many years later in Thebes, vast siege towers known as Helepoli were deployed to attempt to bypass the formidable walls of these urban centres entirely. It is said that the Colossus of Rhodes itself was constructed using material from the abandoned siege engines of Demetrios."
 greek_states_path_4_desc:0 "A time honoured way of ensuring that loyal troops were available, and justly rewarded, plots of territory were granted to native greek soldiers known as cleruchs, in return for their service in the military."
 greek_states_path_6_desc:0 "Centuries of infighting between Greek urban centres naturally resulted in the erection of numerous walls, towers and fortifications, designed to maintain marauding armies at bay. The stonework required to develop such comprehensive structures is a testament to the master masons."
 greek_states_path_7:0 "Centuries of Conflict"
 greek_states_path_7_desc:0 "Constant feuds and battles between Greek kingdoms and states have taught our sons to be invariably ready and willing to give their lives in defence of their home."
 greek_antigonid_path_1_desc:0 "The proud military history of the Greeks reached a climax with Alexander's conquest of the Hellenistic world. What could not be learned from his life, is surely learned from the aftermath of his demise."
 greek_antigonid_path_2_desc:0 "Control of the Aegean and adjacent seas, demands a great focus on military and civilian shipbuilding. The availability of experienced shipwrights drives down prices considerably."
 greek_antigonid_path_3_desc:0 "Those of wealthy, fortunate, or noble birth learn their skills in horsemanship at a young age, frequently riding as a sport, as well as during warfare."
 greek_antigonid_path_4_desc:1 "Urban centres during the early Hellenistic era would frequently spar over the slightest of insults. Due to such frequent battles, wars between states resulted in a style of warfare which yielded the lowest number of casualties, but highest number of prisoners. The victor would then maintain them as slaves, or ransom them back to their opponents for a hefty fee."
 greek_antigonid_path_5_desc:0 "Ostensibly used as skirmishing troops, the Thracian peltast was equipped with a minor shield, and a series of javelins. Later, peltasts were sought after as mercenaries, by many warring states."
 latin_philosophydesc:3 "The Italic Traditions represent the focus on substantially armored and disciplined infantry found in the Etruscan, Roman and other Latin states. They came to favour the sword over the spear, and relied on quickly closing ground with and dispersing less well equipped infantry using strict formations, such as the Triplex Acies, with supporting light cavalry and skirmishers.\n\nCan unlock the '#Y Triplex Acies#!' Tactic\nCan unlock the '#Y Construct Frontier Fort#!' Ability\nCan unlock the '#Y Construct Military Road#!' Ability\n\n#G Tradition Focuses#!\nStrong #Y Heavy Infantry#!\nGood #Y Light Cavalry#!, #Y Light Infantry#!"
 latin_philosophy_start_bonus_desc:0 "Substantially fortified urban centres dotted the landscape of the Italian peninsula for generations. In Rome, the Servian wall looms high, constructed after the catastrophic sacking at the hands of Brennus the Gaul, and affording the inhabitants a minor measure of peace from the strife to come."
 latin_tribal_path_1_desc:0 "Even after the advent of iron-working, magnificent bronze shields, spears, and helmets of all kind, pour from the forges of nascent Italic civilisations. Even tribal cultures possessed a mixture of potent bronze and iron equipment, rendering them a fearsome sight to behold."
 latin_tribal_path_2_desc:0 "In Rome, the equites constituted an entire sub-class of patricians; wealthy aristocracy whose holdings indicated their prestige. As such, the superior affluence and training of the equites afforded them the liability to serve in the exclusive cavalry contingent of the republic's forces. Elsewhere in the Italic world, warhorses were regarded as the domain of the elite, the horses themselves frequently being laid to rest alongside their earthly masters in the event of their demise."
 latin_tribal_path_3_desc:0 "Relying on the devoutness of their own soldiers, and that of their opponents, the Etruscan forces are reputed to have used their priestly orders to curse their foes in plain sight, causing them to rout. In any event, the peoples of ancient Italy left nothing to chance; proper obeisance was made to the gods, prior to each battle was made."
 latin_tribal_path_4:0 "The Acquisition of Affluence"
 latin_tribal_path_5_desc:0 "Numerous musical instruments are depicted in Etruscan art, but none more mysterious than the Aulos. Originally a Greek invention, the signature double-reed and pipes would have been heard accompanying all manner of occasion, perhaps even lifting soldiers' spirits on the eve prior to battle."
 latin_tribal_path_6_desc:0 "The coast played a huge part in the economic life of Italy. Ships, and viable control over the locality, were vital for the continuation of prosperity in every nascent state. Skilled shipwrights, cheap labour, and abundant structure material could be found in all Mediterranean harbours."
 latin_tribal_path_7_desc:0 "The popularity of the Hellenic model of democracy spearheaded the empowerment of populist sentiment throughout a territory hungry for rights. A skilled orator could sway entire urban centres in support of his or her cause, which could, at times, be useful."
 latin_support_path_1_desc:0 "During the first Punic conflict, the Roman senate mandated the construction of a navy to rival that of their adversary, the Carthaginian Empire. Modelled largely on the Carthaginian designs as well as sporting significant Greek influence, the enthusiasm for naval dominance continued throughout Rome's republican era."
 latin_support_path_2_desc:0 "The military engineers of the early Roman army were responsible for the design of military structures, as well as the logistical duties associated with organising their construction."
 latin_support_path_5_desc:0 "As the Roman military expanded, the practice of each soldier providing his own weapons became unsustainable. Thus, by instituting a chain of supply, from natural resources, to blacksmith, to the hands of her soldiers, Rome fueled her conflict machine with ease."
 latin_support_path_6_desc:0 "Adopting the iconic shield, the scutum, alongside the development of the manipular system, gave Rome a decisive advantage over her local enemies. Subsequently, the scutum became almost a national icon for the Romans; the very presence of a Roman shield wall was frequently enough to win a battle prior to it started."
 latin_support_path_7_desc:0 "Rome's primary source of cavalry in the mid-republic, had shifted from the equites to mercenaries and allied states. This permitted a diverse array of styles and abilities to be incorporated into the ever-growing Roman military."
 latin_support_path_end_bonus_desc:0 "After a great victory, Roman custom dictated that honour be paid to the responsible commander. Lavish celebrations, frequently encompassing athletic events, feasts, and processions, would occupy the city for days - reinforcing in friend and adversary alike, the might of Rome."
 latin_roman_path_1_desc:0 "Veteran warriors all, the wealthy Principes sported heavy armour, and fought in tight-knit maniples, making excellent line troops."
 latin_roman_path_3_desc:0 "It is said that Rome's opponents know the conclusion is near when the Triarii lead the charge. Frequently used to rout an already exhausted adversary, the Triarii were equipped with huge spears known as hasta, capable of punching via light armour."
 latin_roman_path_4_desc:0 "Frequently credited with winning entire wars, the practice of using the military to construct roads, both in peace time and in conflict, was literally world-shaping."
 latin_roman_path_5_desc:0 "The evolution of a levied fighting force into a professional standing army, paid dividends in terms of quality and expectation. The salaried soldier was much less probable to baulk at orders, or flee from combat."
 latin_roman_path_7:0 "The Honour of Service"
 latin_roman_path_7_desc:0 "As Rome grew in stature, military service became a matter of honour for young Roman men. Indeed, even after defeats as humiliating as the Battle of Cannae, in which up to 80,000 of Rome's soldiers were reportedly killed, the efforts of the senate were able to raise enough soldiers to take the places of the fallen."
 levantine_philosophydesc:3 "The Levantine and Arabian Traditions concentrate on the robust naval presence of the Phoenician urban centres and the use of phalanx tactics, light infantry, and camelry in the arid deserts of the Levant, Egypt, and Arabia. The Phoenicians were the most prominent traders of the Mediterranean, giving them unmatched experience with seafaring and vessel structure.\n\nCan unlock '#Y Octere#!' and '#Y Mega-Polyreme#!' Ships\nCan unlock the '#Y Military Colonies#!' Ability\nCan unlock the '#Y Phalanx#!' Tactic\n\n#G Tradition Focuses#!\nStrong #Y Trireme#!\nGood #Y Camelry#!, #Y Light Infantry#!"
 levantine_arabian_path_1_desc:0 "Our people know the ways of the desert like no other. How to disappear without trace, how to leave a trail which leads enemy scouts in circles, and how to win a conflict of attrition without taking a single life."
 levantine_arabian_path_2_desc:1 "Ships are the lifeblood of the Arabian and North African coast alike. There is no scarcity of labour to construct them, providing we can acquire the resources to do so."
 levantine_arabian_path_5_desc:0 "The scarcity of shipbuilding material in many regions has led to our artisans ensuring that every plank is well spent. Our vessels are constructed with one purpose in mind: to endure."
 levantine_arabian_path_6_desc:0 "From the Temple of Solomon to the grand edifices of Tylos, our ancestors have taught us to construct well, and to construct with pride."
 levantine_arabian_path_7:0 "Oasis Exchange"
 levantine_arabian_path_7_desc:0 "To know the watering holes of the animals, the pastures where they graze, and their comings and goings, allows us to invest less time in shepherding them from place to place, as the ones to the west who call themselves 'civilised' do."
 levantine_egyptian_path_1_desc:0 "Egyptian ancestors fought with bronze spears, clad in all but the most basic protection. With the advent of iron-working, weapons and armour have been improved tenfold, and our soldiers additional bolstered."
 levantine_egyptian_path_4_desc:0 "Subsequent in the footsteps of the Phoenician traders, the establishment of colonies of devoted, loyal soldiers, gives us a manpower base to draw upon."
 levantine_egyptian_path_5_desc:0 "The Nile has been the theatre for numerous naval conflicts in ages past. Now that naval warfare has spilled out onto the Mediterranean, our long history of unusual naval tactics gives us an edge over more conventional forces."
 levantine_egyptian_path_6_desc:0 "Our mounted warriors ride into battle on fierce and sturdy camels. Surprisingly resilient in battle, our camelry use their maneouverability as their main defence."
 levantine_egyptian_path_7:0 "Cradle of Civilisation"
 levantine_egyptian_path_end_bonus_desc:0 "The great hordes of Egypt, as if assembled by the Pharaohs of ancient, strike fear into the hearts of those who dare oppose us!"
 levantine_greco_path_1:0 "Surfeit of Conflict"
 levantine_greco_path_1_desc:0 "After the collapse of Alexander's empire, the Mediterranean was filled with a surfeit of unemployed warriors. Many of these were trained phalangites, and were frequently willing to labour for a significantly reduced wage."
 levantine_greco_path_2_desc:0 "Capable of working in the phalanx style, the thorakitai were frequently better equipped than their counterpart, the Thureophoroi, but were still used as a bridge between the heavier fighting men, and light, agile skirmishers."
 levantine_greco_path_4_desc:0 "As with the other successor states, the phalanx made up the core of the Ptolemiac army. Comprised of varying unit-types, the core principle was the identical as inherited from the Macedonian reformation of the style, many decades previously."
 levantine_greco_path_5_desc:0 "The vast affluence of the Egyptian kingdoms attracted sizeable mercenary interest. A routine standard of payment of these forces allows for prices to be negotiated in our favour."
 levantine_greco_path_6:0 "Ramming Velocity"
 levantine_greco_path_6_desc:0 "The Ptolemaic navy was consistently in a process of development, not least due to the difficulty of obtaining appropriate structure material. That said, the smaller ships of the Ptolemaios' could hold their own in battle, frequently defeating vessels much larger than themselves."
 levantine_greco_path_7_desc:0 "The obscene affluence of the Ptolemaic dynasty, and the desperate need for experienced commanders, led to exorbitant sums being offered to any foreign generals who would labour for them. Loyalty may be expensive, but it can be bought."
 mauryan_philosophydesc:3 "The Indian Traditions highlight the strengths of the Mauryan kingdom and its neighbours, using large formations of Indian conflict elephants to smash via the enemy, supported by fast moving archers and chariots who can manoeuvre around the dispersed troops. They also used complex formations such as the legendary Blooming Lotus, or Padma Vyuha.\n\nCan unlock the '#Y Slave Raid#!' Ability\nCan unlock the '#Y Padma Vyuha#!' Tactic\nCan unlock '#Y Octere#!' Ships\n\n#G Tradition Focuses#!\nStrong #Y Archers#!, #Y Conflict Elephants#!\nGood #Y Chariots#!"
 mauryan_mauryas_path_1_desc:0 "Infantry in the Mauryan Empire were frequently equipped with a dazzling array of weaponry. Capable of acting as light troops one moment, to archers the next, permitted for unengaged linemen to offer ranged support in the blink of an eye."
 mauryan_mauryas_path_2_desc:0 "Elephants had long been used for warfare by Indian states. Undomesticated, elephants tend to lead a peaceful, grazing lifestyle; however, when trained for conflict, the thick skinned colossi act as a living battering ram, breaking enemy infantry formations as a man might swat a fly."
 mauryan_mauryas_path_3_desc:0 "Densely populated areas in northern India permitted for the recruitment of vast armies. The knowledge that every foot soldier is part of an invincible conflict-machine, inspires our troops to heroic acts of glory."
 mauryan_mauryas_path_4_desc:0 "The overgrown jungles, and dense forests of India are perfect terrain for elephant cavalry. Able to part foliage with ease, the advantage this brings us in otherwise difficult terrain, is unable to be overstated."
 mauryan_mauryas_path_6_desc:0 "The feral jungles and forests may have been what inspired the flexibility of the Mauryan infatrymen, who, in switching armament dependent on situation, could function just as well in low visibility, as in the open plains."
 mauryan_mauryas_path_end_bonus:0 "The Bureaucracy of Conflict"
 mauryan_mauryas_path_end_bonus_desc:0 "Used to dealing with the requirements of huge armies, battles and sieges were frequently planned in great detail. Advance parties would frequently be dispatched to prepare the territory for habitation, and great care was taken to protect the ubiquitous baggage train which supplied the main force."
 mauryan_coastal_path_1:0 "Natural Harbours"
 mauryan_coastal_path_1_desc:0 "The coast of India was a hotbed of commerce and gossip. The numerous natural harbours led to the establishment of permanent commerce posts which dealt with local and foreign tradesmen alike. The abundance of ships in need of maintenance forms a healthy competition, driving down the price of all naval endeavours."
 mauryan_coastal_path_3_desc:0 "While northern India was the site of great, territory-spanning Empires, the southern regions were home to kingdoms and empires which evolved gradually into significant maritime powers."
 mauryan_coastal_path_5_desc:0 "The organisation of the Mauryan army in particular, was constructed with flexibility in mind. The 'patti', the smallest constituent unit of troops, was unlike any other army in the world. Comprised of chariot, elephant, cavalry and infantry, it permitted for high tactical flexibility when performing formative manoeuvres."
 mauryan_coastal_path_6_desc:0 "Pataliputra, frequently considered the largest city in the ancient world, was the pinnacle of Indian architectural prowess. Elsewhere, the ability of Indian masons was displayed in the grand mountain fortifications, constructed to maintain invaders at bay."
 mauryan_coastal_path_7_desc:0 "The supply of military equipment was, in some cases, controlled by the efficient Mauryan bureaucracy from inception to conclusion. In characteristic style, this highly informed manner of government reduced inefficiencies in the system, allowing for cheaper resupply."
 mauryan_coastal_path_end_bonus_desc:0 "Established by Ashoka, the presence of the state navy of the Mauryas was frequently enough to sway diplomacy in his favour."
 mauryan_noble_path_1_desc:0 "Indian chariots pertaining to nobles, were frequently substantially ornate and formidably defended. This practice was as much a display of class, as it was a practical solution."
 mauryan_noble_path_2:0 "Trained to Eliminate"
 mauryan_noble_path_2_desc:0 "As well as providing an advantageous platform for a rider, conflict-elephants were trained to eliminate without a thought. An elephant charge was frequently enough to cause entire formations to panic."
 mauryan_noble_path_3_desc:0 "Many cultures associated archery with light, skirmishing troops. Not invariably so, in the Mauryan military; protecting archers versus the projectiles of their enemy counterparts worked admirably in concert with the vyuha system protecting them versus ground assault."
 mauryan_noble_path_5_desc:0 "The exchange in trained warhorses is vital to our success in mounted warfare. These sturdy creatures are capable of pulling enhanced weight, and are unlikely to panic in battle."
 mauryan_noble_path_6_desc:0 "The green, arable territory of the north is overflowing with riches, not least in the valuable elephants which are so important to our armies; and where there is a surfeit, prices drop."
 mauryan_noble_path_7_desc:0 "The few soldiers from far off lands who are willing to make the journey to our realm shall discover a place in our forces... after negotiation, of course."
 mauryan_noble_path_end_bonus_desc:0 "The effect of conflict-elephants is not solely reserved for our foes. Entering battle alongside such majestic creatures is a boost to the confidence of all our soldiers."
 north_african_philosophydesc:3 "The North African Traditions concentrate on the strengths of the Phoenician merchant state of Carthage and the surrounding nations. The Carthaginians had a robust naval tradition constructed on centuries of Mediterranean exchange, and made use of heavy infantry and African conflict elephants supported by light infantry and cavalry to smash via enemy formations.\n\nCan unlock the '#Y Cavalry Skirmish#!' Tactic\n\n#G Tradition Focuses#!\nStrong #Y Triremes#!\nGood #Y Light Infantry#!, #Y Conflict Elephants#!"
 north_african_philosophy_start_bonus_desc:0 "Civilisation in North Africa has long been tied to the coastal regions. The severe Sahara desert precludes large-scale habitation, and so, our people have long used the fickle ocean as a medium of transportation."
 north_african_tribal_path_1_desc:0 "The Berber people to the west, and the Numidians, learn their horsemanship at a young age. For a people invariably on the move, this competence is invaluable."
 north_african_tribal_path_3:0 "Sure-footed, as Feral Horses"
 north_african_tribal_path_3_desc:0 "We have no need for theft or ownership, but live in harmony with the territory around us. Where the oases and watering holes are, there will we discover the feral beasts which will bear our armies."
 north_african_tribal_path_4:0 "Feral Charge"
 north_african_tribal_path_4_desc:0 "To some, it may seem like a disordered, chaotic melee, yet our warriors revel in this battle dance, knowing the movements of friend and adversary, and acting as one with the rhythm of conflict."
 north_african_tribal_path_6_desc:0 "The fortunes of our people are called into question every time we are threatened - all must ascend in defence of our culture. We live, or perish, as one."
 north_african_tribal_path_7_desc:0 "A single conflict cry on the lips of every one of our soldiers. This is the way of our people, and the way in which we will display our foes that we stand united, and ready to eliminate."
 north_african_tribal_path_end_bonus_desc:0 "We impose no strictures on our tribal people. They come and go as they please, frequently bringing their spoils with them."
 north_african_naval_path_1_desc:0 "The ancient traders of Tyre settled tracts of territory across the Mediterranean. Their legendary seafaring skills live on in the memory of our people."
 north_african_naval_path_3_desc:0 "The Carthaginian fleet was a constant presence in the seas around Sicily and North Africa. The safety and reassurance this provides our crews is unable to be understated, leading to a calm knowledge of our superiority in this theatre."
 north_african_naval_path_4_desc:0 "While some nations construct bespoke fleets for tackling particular enemies, our navy is in constant use. As such, our ships invariably carry supplies to perform maintenance in-situ, making it much easier to recover from combat or general attrition."
 north_african_naval_path_5_desc:0 "The noble heritage of our people lives on in our practice of appointing the elite to lead our men. Those with so much invested into our nation are hard to sway with offers of gold or territory."
 north_african_naval_path_6_desc:0 "The lighthouses, civic structures, and fortifications of our people are recognizable to all who enter our lands. The imposing walls of our urban centres, however, give pause for thought to those who enter with a mind for conquest."
 north_african_naval_path_7:0 "Putting our People to Labour"
 north_african_naval_path_7_desc:0 "The reliance of the Carthaginian army on foreign soldiers, was not mirrored in the navy. The poor or disillusioned could invariably discover cheap labour at sea, manning one of the many military vessels of the Carthaginian state."
 north_african_naval_path_end_bonus_desc:0 "The Greek penchant for huge ships was not shared by the Carthaginians. Experts in naval warfare, they favoured smaller craft with enhanced adaptability, leading to numerous victories over their enemies. The Battle of Catana in 397 BC resulted in a crushing defeat for the Syracusan forces, who were outnumbered and outperformed by the Carthaginian armada."
 north_african_army_path_1_desc:0 "Unable to supply enough fit soldiers for the requirements of the state, Carthage resorted to employing all manner of foreign mercenaries in their army. Relying on the competence of their negotiators, Carthage became the first port of call for soldiers seeking paid employment."
 north_african_army_path_2_desc:0 "Ships in the Carthaginian navy were outfitted not only with a crew of sailors, but a crew of battle-hardened marines. Boarding action was prevalent in antiquity, and the presence of a cadre of armed men must surely have put the minds of sailors and oarsmen at rest."
 north_african_army_path_3_desc:0 "Unlike the rest of the predominantly mercenary forces, the Sacred Band were a group of Carthaginian citizens, possibly of noble birth, armed and equipped with heavy armour and spears. This elite group operated in a similar style to the Greek phalanxes, but due to their minor number, were destroyed and reformed on several occasions throughout Carthaginian history."
 north_african_army_path_5_desc:0 "Immense beasts with thick skin and a variable temperament, elephants were utilised as shock cavalry in the Carthaginian army. As proven by Hannibal's crossing of the alps, they made excellent pack animals when not engaged in combat."
 north_african_army_path_6_desc:0 "The interior of Africa provides skilled riders, the likes of which our foes is unable to match. Combined with our superior equipment, we can transform these nomadic warriors into fearsome heavy cavalry."
 north_african_army_path_7_desc:0 "The psychological effect of elephants on the battlefield was huge. Battle lines would rupture, men were trampled, and entire armies would surrender at the dust clouds created by an approaching army with an elephant contingent."
 north_african_army_path_end_bonus_desc:0 "Many nations were considered protectorates by Carthage, frequently providing troops in return for nominal protection. Whilst they were paid, this expectation of service drives down the costs compared with regular mercenary contracts."
 persian_philosophy_start_bonus_desc:0 "Robust-supported Scythian horses have been used by the nomadic tribes of the steppe for generations. Unparalleled as skirmishing troops, the chaos they could incur was a major advantage to thsoe lucky enough to be able to raise or hire them."
 persian_scythian_path_1_desc:0 "The signature tactic of horse archers was the Parthian Shot. Requiring utter mastery over their steeds, the riders would retreat from their adversary, and by twisting their bodies in the saddle, would fire back at their target."
 persian_scythian_path_2_desc:0 "The people of the steppe are frequently on the move. Their constant readiness is quite a boon when making conflict."
 persian_scythian_path_5_desc:0 "Many cultures with a history of equine mastery developed usage of heavy cavalry, or cataphracts, as a means of countering minor arms. With both horse and rider clad in heavy scale or mail, nothing short of total rout would rupture the charge of a unit of cataphracts."
 persian_scythian_path_6_desc:0 "The nomadic lifestyle instills our people with an excellent knowledge of how to act and survive in this severe terrain."
 persian_scythian_path_7_desc:0 "While the majority of steppe warfare was mounted, scythian infantry are reported in numerous engagements in mid-antiquity. The Battle of Thatis saw the use of a large Siracian contingent of infantry, warring versus the early Bosporan kingdom."
 persian_scythian_path_end_bonus_desc:0 "The Sarmatian and Scythian tribes learn their horsemanship from a young age, developing an affinity for the saddle unlike any western culture. This knowledge can be put to good practical use when organising our armies."
 persian_achaemenid_path_1_desc:0 "The huge hosts of the Achaemenid empire instilled the Hellenic civilisations to the west with the utmost fear. The vast territory controlled by his empire, and the willingness of his people to serve, guaranteed a high throughput of soldiers."
 persian_achaemenid_path_2_desc:0 "A legendary unit of soldiers known as the Immortals, supposedly named due to the constant size of the unit at 10,000 robust, the Immortals utilised a diverse array of weaponry, and heavy armour, providing a backbone of heavy infantry around which the rest of the army was formed."
 persian_achaemenid_path_3_desc:0 "The Achaemenid dynasty oversaw the implementation of a navy in Persia, drawing on the adjacent Phoenician mariners to crew it. Such a legacy of naval tradition still imbues our people."
 persian_achaemenid_path_5_desc:0 "The Achaemenid line ran, unbroken from Cyrus to the fall of the Empire at the hands of Alexander the Great. Despite the recent subjujation, the glory days of the Persian empire remains robust and within living memory."
 persian_achaemenid_path_7_desc:0 "Latterly, the Persians relied on substantially armored mercenary infantry known as the Kardakes. Present during Alexander's invasion, they were recruited from Persian lands, but employed as cheap mercenaries."
 persian_bactrian_path_1_desc:0 "Both the Achaemenids and the Macedonians used Bactrian horsemen in their forces, due to their competence and availability. Like the western Scythians, their culture was substantially influenced by an equine nomadic lifestyle."
 persian_bactrian_path_2_desc:0 "The Greek influences on Bactria took hold unusually swiftly. Architecture and fortifications sprang up in these styles, frequently regarded as superior to their less hellenized neighbours."
 persian_bactrian_path_3:0 "Perfect Tempest"
 persian_bactrian_path_6_desc:0 "The nomadic tribes surrounding Bactria were frequently employed in the regional armies, excelling in mounted archery and horsemanship."
 greek_antigonid_path_2_octere:0 "Forged for Conflict"
 greek_antigonid_path_2_octere_desc:1 "Alexander's demise sparked a naval arms race between the Diadochi, formenting wars over access to Phoenician timber and shipwrights and the construction of ever larger vessels in the struggle for advantage."
 tradition_unlock_requirement_base:0 "One of our integrated cultures must be at least [SCOPE.ScriptValue('percent_size_culture_group_comparison')|R0] pops in size and belong to one of the subsequent culture groups:"
