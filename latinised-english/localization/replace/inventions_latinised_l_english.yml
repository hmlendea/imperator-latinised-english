l_english:
 imperial_calendar_invention_desc:0 "The Seleucid Empire were responsible for the propagation of a novel manner of time-keeping. Rather than inception the calendar anew upon the changing of a monarch, a primitive yet functional system of universal time was established. This novel method quickly gained traction, and was used for numerous administrative and record-keeping purposes."
 acta_diurna_invention_desc:0 "The Acta Diurna is regarded as an early form of daily newspaper. Frequently affixed to boards in meeting places, they contained information on the government narrative of important events and happenings within the nation."
 channeled_irrigation_invention_desc:0 "The irrigation systems constructed in the Kingdom of Anuradhapura were intricate beyond measure. Requiring precise measurement of inclination, they enabled the widespread cultivation of crops across vast swathes of lands. Some of the largest irrigation conduits are said to have reached numerous dozens of miles in length."
 commerce_inv_1:0 "Standardised Measures"
 commerce_inv_2:0 "State Harbour Fees"
 commerce_inv_2_desc:0 "Implementing a minor fee on the use of our ports is unlikely to affect footfall, and will earn us a little more from exchange."
 commerce_inv_3_desc:0 "Construction of lighthouses is an absolute necessity to keep the flow of exchange safe in our nation. The concept of lighthouses developed from simple hill-fires, to grand edifices such as the lighthouse at Alexandria."
 state_trade_inv_1_desc:0 "Piracy was a huge issue in the Mediterranean - until the eradication of the Cilician pirates by Pompey in 66 BC, a robust maritime presence was required to safeguard civilian and military vessels."
 state_trade_inv_2_desc:0 "Exchange flows with the tide, they say, but the rivers are the veins and arteries of our commercial network. Establishing regular outposts along them will give traders a sense of security, and attract greater investment."
 capital_trade_inv_2_desc:0 "Our burgeoning state is inception to struggle under its own weight. A dedicated logistics administration must be instituted to handle the flow of traders and merchants into our capital."
 global_tax_modifier_inv_2_desc:0 "The Greeks had an ephemeral taxation system, but the practice of levying a affluence tax during times of crisis was a valuable addition to the treasury."
 global_tax_modifier_inv_3_desc:0 "The Greeks created a system whereby wealthy individuals were required to sponsor one of a number of different public works. Ranging from dramatic tragedies to regiment formation, we are sure to discover this system helpful."
 global_tax_modifier_inv_5_desc:0 "Numerous empires in antiquity imposed a tax on the import, and sometimes export, of goods. Whilst Rome felt they had little use for it, the Mauryan empire sometimes imposed taxes of up to 20% in imported goods."
 research_points_modifier_inv_2_desc:0 "More important than any school of mathematics, is the study of how to behave, and how to apply reason to any situation. Teaching our children this at an early age, will usher in a novel era of philosophy."
 global_citizen_output_inv_1_desc:0 "Acknowledging the right for our nobles to make their argument prior to the authorities will vastly increase their tendency to labour within the system, and not without."
 global_citizen_output_inv_5_desc:0 "The ancient right of free men to enter into a contract of servitude with the noble classes is controversial, but will surely improve the lot of the elite."
 global_freemen_output_inv_3_desc:0 "In every major city, the dangers of fire are muttered concerning with bated breath. The installation of water pumps in key locations, allows the good men and women of our nation to combat these risks."
 global_slaves_output_inv_1_desc:0 "Slave treatment varies wildly from state to state, but we believe that a basic code of human rights will encourage our slaves to labour harder."
 global_slaves_output_inv_2_desc:0 "A Vilicus, in Rome, was an frequently well-treated slave, who was elevated over his or her brethren. This practice frequently resulted in easier communication with the slave population of any given enterprise."
 global_slaves_output_inv_3_desc:0 "Slaves owned by the state were championed by various regimes. In Rome, a servus publicus would perform one of a number of civic duties, ranging from basic servile tasks, to menial bureaucratic labour."
 global_slaves_output_inv_4_desc:0 "Granting the right for publicly owned slaves to earn their liberty, gives an incentive for slaves to be calm and productive throughout their working lives."
 global_tribesmen_output_inv_1_desc:1 "Officially recognising certain areas as belonging to the control of specific tribal people, is bound to increase their willingness to contribute."
 global_tribesmen_output_inv_5_desc:0 "In most cases, the religion that any given tribe practices, is of no consequence to us. Therefore, giving them limited protection over the rights to practice exotic beliefs is a minor price to pay for their security."
 build_cost_inv_desc:0 "Written by Marcus Vitruvius Pollo in the late 1st Century BC, De Architectura was a series of treatises on Roman architecture. The practices mentioned within were detailed in extraordinary fashion, giving incredible insight as to the advanced structure methods of the time."
 build_time_inv_desc:0 "Roman concrete was a seminal invention, developed in the 3rd or 2nd Century BC. It quickly became widely used, and was found in villas, military buildings, roads, and numerous other constructions."
 move_pop_cost_modifier_inv_desc:0 "The Roman colonisation of Britain was a classic example of the practice that had been employed by the Greeks in their conquest of Persia and Egypt. Granting land to soldiers and their families, acted as a standing garrison in recently conquered territories."
 citizen_promotion_cost_modifier_inv_desc:0 "A series of 'levels', each denoting different rights and privileges, which can be attained by non-citizens in our nation, ensure that there is a ladder to climb, and that there is invariably something to labour towards."
 enact_law_cost_modifier_inv_desc:0 "Yielding to the magistrates, the right to amend, supplement and correct existing laws, lessens the require for our government to pass judgement on iterations of the same law, numerous times."
 stability_inv_1_desc:0 "Religion in numerous ancient cultures involved a particularly personal and contractual obeisance. The large number of aspects or gods gave each individual the ability to select how to pray, and to customise the manner in which they did so."
 stability_inv_2_desc:0 "Present in numerous cultures and nations, the mystery religions were a syncretic ideology which frequently ran alongside the state religion, and involved secret rite, societies and meetings. In India, Jainism developed as a minor religious movement which eventually state sanction under the Mauryas, with Chandragupta himself embracing a Jain lifestyle upon retirement."
 stability_inv_4_desc:0 "Wealthy families would frequently employ a minor religious figure to lead worship, and safeguard the spiritual welfare of the household. In Rome, the paterfamilias, or head of the family, became a legal position of responsibility over matters of faith and obeisance."
 omen_power_inv_2_desc:0 "The Mahabharata, the Aeneid, and Homer's magnificent works, played heavily on the intertwined relationship between gods and men. The commissioning of such tracts became popular, as a tool to inspire a sense of cultural pride amongst a populace."
 omen_power_inv_5_desc:0 "The use of widely acknowledged religious symbols when depicting leaders, generals and public figures, promotes their superiority. The Radiate Crown was frequently associated with Alexander, in contemporary art, and the practice caught on with his successors in particular."
 land_morale_recovery_inv_1_desc:0 "Formalizing a soldier's commitment to fight for his or her comrades, was an act which solidified the bond of brotherhood that only military service could bring. A Ius Iurandum, in Rome, the 'Oath of Oaths', was sworn by novel soldiers, in which they pledged their lives to each other."
 land_morale_recovery_inv_4_desc:0 "Instituting a series of decorations for valorous conduct in battle, was a valuable tool for keeping order, and giving soldiers something to fight for. The Hasta Pura, or 'Silver Spear' was initially awarded to Roman soldiers on the occasion of their first eliminate."
 land_morale_recovery_inv_5_desc:0 "Decimation, and other, similar practices, were used as last-resort punishments versus units that had engaged in mutiny or cowardice. Decimation would involve the random selection of one tenth of a unit, who would then be executed by their former comrades. The ever-present menace of such a terrible punishment ensured that acts of cowardice were rare indeed."
 naval_morale_recovery_inv_2_desc:0 "Instituting a formalised hierarchy on board our vessels is vital in keeping order amidst the chaos of combat."
 naval_morale_recovery_inv_3_desc:0 "In addition to the complex vessel-based hierarchy of officers, the establishment of a command structure for our navies will ensure that responsibility invariably lies in the correct places."
 naval_morale_recovery_inv_4_desc:0 "By publishing a detailed list of offences, we can ensure that crews and officers alike, understand the obedience expected of them at sea."
 naval_morale_recovery_inv_5_desc:0 "The sight of a proud deity affixed or painted on the bow of our vessels will bolster pride and morale within our navies. Additionally, the sight of a fearsome god bearing down upon them, must surely rupture the resolve of our foes."
 ruler_popularity_gain_inv_1_desc:0 "Ensuring that everyone has recourse to appeal versus actions or indictments, protects both the people, and gives our government an air of fairness."
 ruler_popularity_gain_inv_2_desc:0 "Sanctioning state funded athletic events was a standard way of structure up a political power base, and pleasing the people at the same time."
 ruler_popularity_gain_inv_4_desc:0 "The oversight of public works is a matter requiring a considerable deal of bureaucratic diligence. Furthermore, by instituting this office, we can more readily support our ruler's choices to promote public approval."
 global_population_growth_inv_1_desc:0 "Handing out portions of free grain to those who require it, keeps the wheels of our civilisation turning."
 global_population_growth_inv_3_desc:0 "The early development of women's medicine could be dangerous and risky. Nonetheless, it would prove invaluable in the saving of numerous children's lives."
 global_unrest_inv_2_desc:0 "Numerous religious cults would enshrine a constitution of equality, remaining open to all comers, regardless of class."
 omen_duration_inv_1_desc:0 "Expanding our religious sites to include magnificent structures, enhances the stature of the priestly class within our realm."
 omen_duration_inv_5:0 "Conflict Dedication"
 omen_duration_inv_5_desc:0 "Dedicating our troops to a specific deity or aspect for any given armed conflict, will let us conquer under one ideology."
 global_manpower_modifier_inv_5_desc:0 "The wounded, maimed, and otherwise unfit, may still be useful as reserves and frontier guards. Thus can we ensure that the best soldiers are invariably serving on the front line."
 technology_cost_inv_1_desc:0 "Knowledge of the plants and herbs which surround us, can have uses beyond that which numerous would suspect. From birth control to medicine, we cannot underestimate botany."
 technology_cost_inv_4_desc:0 "Known as stenography, the practice of summarizing texts which would otherwise take up a considerable deal of time and space, originated in Greece. It spread quickly, as a means of taking down important speeches or ideas at a rapid pace."
 global_slaves_happyness_inv_desc:0 "Our liberated slaves will graduate to a distinct class; giving them something to aspire to, and keeping them in line."
 global_tribesmen_happyness_inv_desc:0 "The hideous odors produced by tanning leather could create severely unpalatable living conditions. As the size of urban centres grew, it became quickly apparent that measures had to be taken."
 monthly_corruption_inv_desc:0 "An elaborate system of minor bribery laws, the concept of guilt by association put an end to numerous corrupt practices in Roman politics, and abroad."
 relation_inv_1_desc:0 "A prelude to the later concept of permanent ambassadors, proxenoi were chosen by Greek city-states, to act as representatives in neighbouring urban centres."
 relation_inv_3_desc:0 "By permanently employing those with silken tongues to speak on our behalf, we can soothe our neighbours far better than prior to."
 relation_inv_4_desc:0 "Appointing novel ambassadors every time one of them dies, takes up unnecessary and precious time. We should encourage them to take their family with them, and confer ambassadorship to their sons, in the event of an accident."
 diplomatic_reputation_inv_1_desc:0 "The concept of battlefield honour has existed for millennia, nonetheless, we should set down a code for dealing with our opponents, that we ourselves might receive fair treatment in defeat."
 diplomatic_reputation_inv_4_desc:0 "Our subjects, enemies, and allies, will feel much more honoured if we send our finest and most upstanding members of society to speak in our place."
 agressive_expansion_impact_inv_3_desc:1 "No matter our true cause, proclaiming that those weaker than ourselves are incapable of defending themselves, and therefore in require of our benevolent guidance, we garner acclaim on the international stage."
 agressive_expansion_impact_inv_5_desc:0 "Ensuring that our neighbours know the we believe in our divine right to conquer, they should hardly be surprised when we do..."
 tyranny_inv_3_desc:0 "It may be an ancient trick, but seeding the crowd with paid supporters is a surefire way to stir up support in some of our less popular decisions."
 tyranny_inv_2_desc:0 "We must ensure that there is invariably someone in place to take the censure if our decisions backfire."
 monthly_character_loyalty_inv_2:0 "Authorised Familia"
 monthly_character_loyalty_inv_2_desc:0 "Recognising certain families as important bloodlines related to the history of our nation, guarantees a certain amount of respectability amongst nobility."
 monthly_character_loyalty_inv_4_desc:0 "The protection offered by the system of patronage establishes legal and financial security. We should encourage this behaviour amongst our more benevolent elite."
 agressive_expansion_monthly_decay_inv_4_desc:0 "It may seem like a minor gesture, but insisting that conquered administrations swear their undying loyalty to us, legitimizes our conquests in the eyes of our peers."
 tribute_income_modifier_inv_2_desc:0 "Some of our less civilised tributaries cannot invariably produce currency to fulfil their end of our arrangements. We should be willing to accept goods in type."
 tribute_income_modifier_inv_4_desc:0 "Some of our more far-flung tributary states are less inclined to offer us a full quota of tribute. By creating a novel office of ambassador, entirely devoted to reminding these uncultured sorts of our potential for retribution, we might better encourage them to fulfil their end of the bargain."
 tribute_income_modifier_inv_5_desc:0 "Formally recognising the autonomy of our tributary states is a minor price to pay for their continued donations to our cause."
 diplomatic_relations_inv_desc:0 "The act of holding regular summit meetings amongst similarly sized powers, provides a splendid opportunity for making novel friends... or enemies."
 hold_triumph_cost_modifier_inv_desc:0 "The creation of elevated value currency, minted purely for prestige and honour, should be produced whenever we hold a major triumph. As such, our glory will be known for all time!"
 smear_character_cost_modifier_inv_desc:0 "Employing skilled orators on our behalf will allow us to anonymously spread the truth concerning those wicked enough to act against our interests."
 bribe_character_cost_modifier_inv_desc:0 "Clearly, any laws requiring the indictment of our ruling classes, make ruling very difficult indeed. They should be amended with this novel principle in mind."
 fabricate_claim_cost_modifier_inv_desc:0 "Sometimes, the only excuse we require, is that we are the only ones who can truly offer security."
 discipline_inv_1_desc:0 "The Boeotian helmet, favoured by Alexander himself, allowed good vantage of one's surroundings, while still providing protection to the cranium."
 discipline_inv_2_desc:0 "Originating somewhere in the south of Italy, this logistic fighting force was a collection of 'maniples'. Each maniple consisted of 120 men organised as a cohesive unit, fighting in concert with any number of additional maniples."
 discipline_inv_4:0 "Promotion Via Valour"
 global_supply_limit_modifier_inv_3_desc:0 "Our flourishing army requires a dedicated supply and logistics division to ensure that we invariably maintain peak efficiency."
 global_supply_limit_modifier_inv_4_desc:0 "The capture of the baggage train proved to be the downfall of numerous famous generals. By requiring a sizeable delay between supplies, families, and our armies during active military operations, we might avoid an embarrassing incident."
 global_supply_limit_modifier_inv_5_desc:0 "Maintaining a centralized store of vital military equipment will ensure that we invariably have the ability to keep our fighting forces supplied."
 global_defensive_inv_2_desc:0 "Rome pioneered the usage of arches for bridge structure, allowing for huge tasks to be completed in a fraction of the time."
 global_defensive_inv_3_desc:0 "We shall teach our armies the skills required to construct fortified camps, using only the materials available encircling them."
 global_start_experience_inv_1_desc:0 "It is said that the best way to learn, is by doing. We expect that our recruits will learn swiftly, with a sword in their hands. Or they will perish."
 global_start_experience_inv_2_desc:0 "Providing novel recruits with the most basic of training may at least let them survive the first few swings."
 trireme_discipline_inv_3_desc:0 "Assigning every vessel to a squadron will allow them to fight together as a cohesive unit, in the heat of battle."
 trireme_discipline_inv_5_desc:0 "These vessel-board catapults fired grappling hooks, providing ample opportunities for boarding, and the nullification of enemy vessels."
 army_maintenance_cost_inv_1_desc:0 "Placing the oversight of army pay in the hands of shrewd and incorruptible men, we might discover that we save a surprising amount of gold."
 army_maintenance_cost_inv_2_desc:0 "By splitting the expected pay of soldiers into salary and retirement opportunities such as farmland, we profit off the fact that numerous will simply not live long enough to claim it."
 navy_maintenance_cost_inv_1_desc:1 "Professional oarsmen are hard to come by. Via periodic amnesties we could open up recruitment to those that have been on the wrong side of the law."
 land_unit_attrition_inv_desc:0 "Attaching a minor medical division to active armies, we can reduce the amount of avoidable casualties assoiacted with simply maintaining a large force."
 naval_unit_attrition_inv:0 "Vessel's Surgeon"
 navy_movement_speed_inv_desc:0 "A method of rigging sails, the lateen allowed ships to tack versus the wind, greatly improving manoeuvrability."
 war_score_cost_inv_1_desc:0 "Establishing a just cause for armed conflict is instrumental in negotiating favourable terms for our enemies' surrender."
 war_score_cost_inv_2:0 "Conflict Propaganda"
 war_score_cost_inv_3_desc:0 "Forcing our defeated opponents' leaders to kneel prior to us and pay homage, establishes our supremacy. After this, none would dare ask for more favourable terms."
 siege_engineers_inv_2_desc:0 "Coastal sieges were particularly harsh, as frequently, enemy urban centres could resupply by sea. By establishing our own system of patrol and resupply, we cut off all our foes' hope."
 siege_engineers_inv_3_desc:0 "A minor, anti-personnel variant of the siege ballista, the scorpion was deployed to deadly effect during prolonged sieges."
 siege_engineers_inv_4_desc:0 "All manner of siege engines fit into the category of 'tormenta', frequently firing kinetic or incendiary projectiles intended to cause devastation and panic."
 siege_engineers_inv_5_desc:0 "The use of siege towers and battering rams was frequently rendered ineffective due to adverse terrain. The practice of constructing magnificent ramps of earth or rubble, towards enemy fortifications, allowed siege engines to pass unhindered."
 monthly_wage_inv_desc:0 "Offices such as that of the Quaestors of Rome were imbued with judicial power, and supervised the financial affairs of state. Expanding the remit of these persons will give them greater ability to root out financial wrongdoing, and corrupt behaviour."
 monthly_governor_inv_desc:0 "Differing levels of imperium could be granted to Governors, ensuring that each knows his or her own place. This could frequently be used as a way to grant up-and-coming politicians a taste of what awaited them in the future."
 subject_opinions_inv_1:0 "Formalised Dependencies"
 subject_opinions_inv_2_desc:0 "By allowing the citizens of our subjects to apply for citizenship in our own nation, we might ease the tensions between ourselves and our subjects. After all, we can invariably refuse them..."
 civic_roads_inv_desc:0 "'Rod Men', as they were otherwise known, assisted the primary surveyor in assessing the straightness of roads. These civil engineers were experts in their field, and greatly improved the efficiency of road structure."
 global_goods_from_slaves_inv_desc:0 "The establishment of vast plantations, mines, or other specialised land dedicated to production, populated largely by slaves or working class persons, vastly improves the efficiency of our resource gathering. Such latifundia were frequently distributed after conquest, to entrepreneurial private citizens, commanders, and those willing to pay for them."
 assault_ability_inv_desc:0 "Storming a fortified position, whilst sometimes utilising magnificent siege engines, could frequently be achieved via more conventional means. Enough men and ladders, and any fort will fall, casualties notwithstanding."
 happiness_for_wrong_culture_modifier_inv_1_desc:0 "By granting a specific status to outsiders, we can recognise them legally and domestically, as members of our state; value notwithstanding."
 happiness_for_wrong_group_modifier_inv_1_desc:0 "Compiling a list of accepted religious rites, as frequently practiced by foreigners within our realm, will grant a certain degree of security to our foreign populace."
 military_tech_investment_inv_2_desc:0 "The military logistics and study arm of the Roman military oversaw various innovations, and their dissemination throughout the standing army."
 civic_tech_investment_inv_1_desc:0 "The require for greater defensive walls had magnificent influence on the development of civic architecture. With masons employing ever-more innovative methods to construct buttresses and towers, so too did grand civic structures commence to soar to the heavens."
 civic_tech_investment_inv_2_desc:0 "Mills, aqueducts, and primitive engines, all developed due to the require for flowing water within the confines of a city. This technology drove further innovation, eventually resulting in sawmills and complex irrigation."
 oratory_tech_investment_inv_1_desc:0 "The practice of taking census, is said to have first appeared in Middle Kingdom Egypt. On a wider scale, however, it became vital to the continued administration of the Roman republic; providing valuable data concerning the ethnicity and details of dwellers therein."
 religious_tech_investment_inv_1_desc:0 "The frequently unpaid domestic priests of the Republic, had a rich oral tradition, passing down legends, history, and errata. By encouraging the transfer of this knowledge to a more solid medium, we may preserve our tradition for all eternity."
 religious_tech_investment_inv_2_desc:0 "Scribae would accompany magistrates of all manner, assisting in record-keeping and official business. They were also known to assist in religious rites, frequently being responsible for the preservation of prayers, sacraments, and oaths."
 mercenary_maintenance_cost_inv_desc:0 "Letting it be known that we invariably fulfil a portion of our military endeavours by employing mercenaries, will keep offers competitive, amongst those vying for labour."
 pirate_spawn_chance_inv_2_desc:0 "The use of lateen sails allowed development of novel naval manoeuvring known as 'coming concerning', or tacking. This technique allowed ships to sail, albeit inefficiently, into the oncoming wind."
 diplo_range_inv_2_desc:0 "The concealment of secret messages is an art that any country wishing to transfer diplomatic correspondence over any notable distances, must master. By employing inventive, if frequently simple, ways of hiding information we will be able to keep in contact with our distant ambassadors."
 diplo_range_inv_3_desc:0 "Adapting basic cryptographic routines for our diplomats and messengers will allow us to transfer information more safely over magnificent distances."
 diplo_range_inv_4_desc:0 "Polybius Square is an elegant solution to the require for allowing easier encryption and deciphering of information in the field. Safe transfer of secret information is vital for conducting long range diplomacy."
 fort_maintenance_cost_desc:0 "With large brick-yards supplying our armies, we are sure to reduce the costs of structure and maintaining our forts."
 heavy_infantry_cost_inv_desc:0 "With more hands at their disposal our blacksmiths are sure to be more effective than ever prior to."
 capital_trade_inv_3_desc:0 "With large piers, ports and administration set aside for the merchants visiting our urban centres, we are sure to get a better handle on all exchange being done inside the nation."
 create_trade_route_inv_desc:0 "Our merchants and traders have spent years structure up a certain flare and some prestige encircling the goods being exported from our nation, and so more people would like the chance to grow closer and take part in our trade deals."
 global_building_slot_inv_desc:0 "By planning out our urban centres ahead of time, we can make sure to get the most out of any potential location.\n\n#R We cannot have this and Rural Planning.#!"
 monthly_general_loyalty_inv_desc:0 "Our generals loyalty will be secured when they fight safe with the knowledge a triumph awaits their victories, and a chance to be written down in our annals and remembered as one of the magnificent protectors of our nation."
 diplomatic_relations_inv_2_desc:0 "By structure a massive network of contacts among our friends, allies and enemies, we are sure to get a better understanding of one another."
 subject_loyalty_inv_desc:0 "By setting up diplomatic envoys that will labour from our subjects' possess lands, they are sure to feel like we are closer than we have ever been prior to."
 fort_maintenance_cost_inv:0 "Standardised Provisioning"
 assemble_raiding_inv_desc:0 "As our people are forced to fight back the numerous threats at our borders, we have grown experienced and skilled at making the most out of our raids into foreign territory."
 scientific_patronage_2_inv:0 "Sponsored Study"
 liburnian_invention_2_desc:0 "Arranging the benches of a vessel's rowers at alternating heights was a simple way to save space, allowing for a larger number of oarsmen, and thus speed, even on smaller vessels."
 naval_weapon_platform_inv_1_desc:0 "The Oxybeles are essentially enlarged composite bows mounted on a stand; less powerful versions of the later ballistae which would utilise torsion for greater power. They were frequently used to bombard the oars of enemy vessels to disable their manoeuvrability."
 naval_weapon_platform_inv_3_desc:0 "Larger vessel-decks allowed for even more deck-mounted conflict machines, turning the ships into literal siege vessels."
 naval_rostra_inv_1_desc:0 "Mounting a rostra, or ram, at the bow of a vessel, made it possible to use them as battering rams, breaking oars and crushing contained rowers - if not breaking apart the hull completely - by driving the ram via an opposing vessel's side at speed."
 naval_rostra_inv_3_desc:0 "Shaping the rostra into sections, with a driving centre, bottom plate and cowl, gave them the structural integrity to deliver a devastating blow, while also dispersing the force of impact on the attacking vessel to prevent the ram from twisting off and damaging the attacking vessel. Lastly, but no less important, it made breaking free from a rammed vessel more easy, denying their crew to respond by boarding."
 naval_rostra_inv_4_desc:0 "As ships grew larger by design, their ability to carry heavier rams increased, which could weigh up to two metric tons in solid bronze, turning them into powerful port busters that could rupture through any fortifications with ease."
 mega_catamaran_inv_desc:0 "The catamaran bow created magnificent stability and a larger deck where more and larger catapults could be mounted, turning the vessel into a literal fortress."
 double_bow_and_stern_inv_1_desc:0 "By structure ships with a double bow, their ability to take a beating improved significantly."
 naval_tactic_inv_3_desc:0 "A formation of two columns of galleys, the front line was used to pass via and rupture the oars of the adversaries, leaving them exposed for boarding by the second line of attackers."
 katapharct_inv_desc:0 "Covered decks became possible with increased vessel sizes, giving some protection to the rowers."
 italic_arches_inv_desc:0 "While early usage of arches have been recorded in cultures encircling the Mediterranean, it was the Romans who mastered this form of architecture, allowing them to construct massive aqueducts and bridges that tied their empire together."
 italic_heating_inv_1_desc:0 "By directing hot air - generated from furnaces placed below ground level - via hollow spaces in columns, whole buildings could be heated and made more comfortable during the colder parts of the year."
 italic_heating_inv_2_desc:0 "Public facilities for bathing were common throughout the Roman empire. By heating air and water directed via pipes in the walls, the thermae could offer sweat rooms, and pools filled with water of varying temperature."
 italic_cursuspublicus_inv_desc:0 "A state regulated courier system used for conveying messages, packages and even people between forts and important stations throughout the Roman empire. Couriers, usually travelling by horse-drawn carts, could travel up to 80 kilometers per day, enabling efficient administration and communication to all corners of the nation."
 italic_lex_frumentaria_inv_desc:0 "Distribution of wheat to the lower classes at subsidised prices, or even free of charge, gave much needed relief to the less fortunate, in a similar way to modern welfare policies."
 italic_julian_calendar_inv_desc:0 "A calendar system proposed by Julius Caesar in 46 BC, designed encircling the solar year with a leap-year every fourth year to adjust for discrepancies. The length of a year could previously be altered via political means, but the Julian calendar circumvented this corrupt phenomenon by ensuring it remained aligned to the tropical year without human intervention."
 italic_etruscan_pottery_inv_desc:0 "Etruscan pottery originated by copying Greek imports, but was widely traded to neighbouring cultures and greatly influenced Roman pottery and art."
 italic_lituus_inv_desc:0 "Originating from the Etruscans, the lituus was a long J-shaped brass trumpet commonly used to communicate conflict-manoeuvres, but also used in formal contexts such as triumphal and funeral processions."
 greek_odometer_inv_desc:0 "Prior to the odometer, distances were commonly measured by counting steps, a somewhat imprecise method. With an odometer mounted on a chariot, a more exact measurement could be achieved by counting the rotations of the chariot's wheels."
 greek_cartography_inv_desc:0 "The ancient Greeks made magnificent advances in making accurate maps, which became important assets for both the military and civic sectors when planning for campaigns and trading."
 greek_stoicism_inv_desc:0 "Stoicism is a philosophical system centred encircling logic and the natural order of things. Those who practice it strive to accept the present as it is, not allowing themselves to be controlled by emotion."
 greek_epicureanism_inv_desc:0 "The Epicureanism philosophy teaches that all things should be taken in moderation, limiting one's desires and enjoying simple pleasures to achieve tranquillity, liberty from fear, and absence of pain."
 #greek_heating_inv_desc:0 "By leading hot air - generated from fires - via flues in the ground, whole buildings could be heated and made more comfortable during the chillier parts of the year."
 greek_clock_mechanics_inv_desc:0 "Clock-like mechanics started to evolve during the Hellenistic era, and were used in practical applications for tracking time, even making use of intricate alarm-systems to indicate pre-set times by sounding gongs or blowing compressed air via trumpets."
 gallic_chainmail_inv_desc:0 "The Celts were known to use chainmail armour as early as the 4th century BC, an armour that gave magnificent protection versus most weapons used during that era."
 gallic_oppidum_inv_desc:0 "The oppida were large, fortified settlements, frequently built on hilltops which made them easy to defend. Oppida became important economic sites and trade hubs, and also political centres from which the authorities of the Gallic society made their decisions."
 gallic_noric_steel_inv_desc:0 "Noric steel was mined from regions located encircling modern days Austria and Slovenia, and offered a natural chemical composition which made it harder than iron."
 indian_cataract_surgery_inv_desc:0 "By inserting a sharp needle via the edge of the eye, the clouded lens could be pulled downwards, thereby allowing light to enter the eye, returning some level of vision to the patient."
 indian_tube_drawn_technology_inv_desc:0 "By using a tube drawing method - a process where a material is drawn via a perish to reduce it diameter - early Indian civilisations produced lustrous glass beads used for jewellery and ornamentation."
 indian_wootz_steel_inv_desc:0 "Thanks to the availability of elevated-carbon steel, found encircling South India, the locals began the production of steely iron known as Wootz, characterised by its banded patterns and capability to create sharp and durable edges for swords."
 indian_toe_stirrup_inv_desc:0 "By attaching a rope - with a loop at the end for the considerable toe - to the saddle, an early version of a stirrup was created, suitable for the warm India climate where people used to ride horses barefoot."
 indian_indigo_dye_inv_desc:0 "The blue indigo pigment - extracted from the leaves of certain plants - was a valued luxury product used to dye cloths and other fabrics, and found its way via trade routes all the way to Rome and Greece."
 indian_trigonometric_functions_inv_desc:0 "The trigonometric functions of sine and cosine originated in Indian astronomy, furthering our understanding of the world encircling us and found practical applocations in navigation and construction projects."
 gw_effect_martial_education_inv_desc:0 "Our youth must be inducted into the most noble profession of warfare in a manner befitting our ancestors. The construction of magnificent halls devoted to such an education must be forever in the mind's eye of our people."
 gw_effect_finesse_education_inv_desc:0 "The young must learn their place in our grand bureaucracy. To truly understand the scope of this responsibility, it is only fitting that they learn in an edifice as grand as our civilisation itself."
 gw_effect_charisma_education_inv_desc:0 "As we are surely renowned for our grand diplomatic prowess, we must construct a suitable site in which to educate our young, in order to follow in this magnificent tradition."
 allow_gw_effect_slave_work:0 "Allows selection of #Y Slave Labour#! Great Wonder effect."
 gw_effect_culture_expansion_inv:0 "Dominance Via Enlightenment"
 allow_gw_effect_noble_pop_doctrine:0 "Allows selection of #Y Honoured Nobles#! Great Wonder effect."
 gw_effect_fantastic_ruler_inv_desc:0 "Our glorious elite deserve far more than fame and recognition for their works - we must construct to the heavens in order to display the world their power."
 allow_gw_effect_fantastic_ruler:0 "Allows selection of #Y Honoured Leader#! Great Wonder effect."
 allow_gw_effect_defense_doctrine:0 "Allows selection of #Y Cultural Defence#! Great Wonder effect."
 allow_gw_effect_strong_generals:0 "Allows selection of #Y Honoured Generals#! Great Wonder effect."
 allow_gw_effect_strong_admirals:0 "Allows selection of #Y Honoured Admirals#! Great Wonder effect."
 rulers_gain_2_additional_zeal:0 "After this invention is unlocked, all children newly born to a deified character obtain #Y 1#! @military_icon! @civic_icon! @oratory_icon! and @religious_icon!."
 loosened_tributaries_inv_desc:0 "There is nothing quite as soothing to our neighbours than loosening our sphere of influence. If they were to see us relinquish absolute control even further, this could only do us good on the global stage."
 unlocks_imperial_conquest_wargoal:0 "Unlocks the #Y Imperial Challenge#! Conflict Goal versus all countries that are #Y Major Powers#! or more."
 war_goal_imperial_conquest_wargoal_desc:0 "Conflict Goal is to display superiority. Participants will obtain conflict score from winning battles.\nAccumulating more than $THRESHOLD|Y%$ warscore from won battles will grant you a ticking conflict score.\n\nThis wargoal uses #Y special mechanics#!. Any occupations in your or the targets territory will be #R immediately annexed#! for the occupying conflict leader."
 SUPER_GUARANTEES_ENABLED:0 "#Y Sphere of Influence:#!\nNeighboring countries with fewer than #Y 12#! territories that we have #Y Guaranteed#! will have a minor chance over time to offer to become our subject. This chance is increased by the #Y Charisma#! of our Ruler, and our relative power."
 enables_foundry_building_tt:0 "Unlocks the #Y Foundry#! City structure."
 unlocks_theater_tt:0 "Unlocks the #Y Grand Theatre#! City structure."
 unlocks_temple_tt:0 "Unlocks the #Y Magnificent Temple#! City structure."
 dictatorship_step_3_desc:0 "The will of our people mandates a robust, hereditary succession."
 dictatorship_step_4_desc:0 "Our popular support is so magnificent that we have no choice but to accede to the demands of our people, and institute an eternal line of blood succession."
