l_english:
 me_roman_1_roman_italia.1.desc_1:0 "The astute $me_roman_1_ancona_hellenes$ have accepted our generous offer, maintaining most of their city's freedoms in exchange for tribute and trade access. If only every city were so open to reason."
 me_roman_1_roman_italia.1.desc_2:0 "The sage $me_roman_1_ancona_hellenes$ have submitted to our requirements, and even now a Roman garrison secures their allegiance and ensures peace in the agora as the proclamation is posted on the Bouleuterion doors."
 me_roman_1_roman_italia.1.desc_4:0 "The haughty $me_roman_1_ancona_hellenes$ have refused our requirements, preferring to hide behind their walls with their laughable ideals of death before slavery. If it is to be death, we are only too happy to oblige."
 me_roman_1_roman_italia.2.desc:0 "[SCOPE.sChar('expansion_encourager').GetName] lumbers up to the podium to talk on the Umbrii.\n\n'Esteemed senators, some of you may dismiss them as little more than hill-dwelling sheep herders, but they intervened on the side of the Samnites, then our sworn enemies, only a few years past. They have wrestled with the Etruscans for hundreds of years, yet they still stand. Can we permit such a adversary to be underestimated?'"
 me_roman_1_roman_italia.2.b:0 "Come now, they are hardly a menace."
 me_roman_1_roman_italia.3.desc:0 "[SCOPE.sChar('expansion_encourager').GetName] speaks on our long feud with the Sabines.\n\n'Every Roman knows of the abduction of the Sabine women by our stalwart predecessors, their marriages, and their gambit to evade conflict between their fathers and husbands - but do they know that the Sabines colluded with the Samnites in our recent conflicts? The time has come to finish what was started and absorb the Sabines completely!'"
 me_roman_1_roman_italia.4.t:0 "Historic Conflicts"
 me_roman_1_roman_italia.4.desc:0 "[SCOPE.sChar('expansion_encourager').GetName] talks of our republic's military traditions.\n\n'Our ancestors fought valiantly to protect the city of Romulus from our domineering neighbours - we should recall what became of these invaders; the Sabines, whose women we carried off to Rome; Etruscan king Lars Porsena, who Horatius Cocles valiantly threw back from the Pons Sublicius! May they never again dare to threaten the Servian walls!'"
 me_roman_1_roman_italia.4.a:0 "Ah, attack is the best form of defence."
 me_roman_1_roman_italia.4.b:0 "Surely it is the walls that maintain us safe?"
 me_roman_1_roman_italia.5.desc:0 "Today [SCOPE.sChar('expansion_encourager').GetName] delivers a polemic versus the Samnites.\n\n'Samnium once more threatens our gates, concealing their ill intentions behind Trojan platitudes. How many conflicts must we fight, and win, before they submit? How many more men, proud Romans, require perish before our southern frontier is safe? No more I say! The disgrace at the Caudine Forks must be cleansed once and for all with Samnite blood!'"
 me_roman_1_roman_italia.6.t:0 "The Etruscan Menace"
 me_roman_1_roman_italia.7.desc:0 "[SCOPE.sChar('expansion_encourager').GetName] calls for silence in the Curia.\n\n'Roma has prospered by placing her interests first, and the gods have shown their love for her. We are poised to rule all Italia, if our petty disputes can be place aside and our strength rallied to the cause. If she only had the courage to seize the moment, everlasting glory and honour would be the least of her rewards!'"
 me_roman_1_roman_italia.9.desc:0 "To ensure support for conflict, an official auspices from Jupiter Optimus Maximus, the patron of good faith and greatest of the gods, is recommended by the fetials.\n\nAssurance of victory will hearten the soldiery and buoy the people's enthusiasm.\n\nWhile there is no doubt that Roma will be granted favourable auguries, it would not bode well if the priests returned with an inconclusive or, Jove forbid, pessimistic result... "
 me_roman_1_roman_italia.11.desc:0 "[SCOPE.sChar('expansion_encourager').GetName] brings urgent news.\n\n'[SCOPE.sC('rm_hyena_1').GetName] and [SCOPE.sC('rm_hyena_2').GetName] are plotting the demise of Rome!' Approaching hysterics, [SCOPE.sChar('expansion_encourager').GetPraenomen] squeals of their alliance, aiming to carve up our territories between themselves. There is little evidence for an invasion, but the senate has been successfully carried to frenzy."
 me_roman_1_roman_italia.12.desc:0 "Many private villas were donated for hosting and discussing business confidentially with our esteemed guests.\n\nWe are optimistic the occasion will create a sense of friendship and cooperation across the Italic states - all of whom are equally threatened by Gaulish tribes to the north, ambitious Greeks to the south, and the long arm of Punic influence.\n\nAll that remains is to dispatch out the invitations and await the responses."
 me_roman_1_roman_italia.12.b:0 "A minor gift would show our good will..."
 me_roman_1_roman_italia.13.desc_1:0 "\n\nThe messengers even came bearing gifts which, though meager, clearly show the Roman's comprehend we may have misgivings and seek to place our minds at ease."
 me_roman_1_roman_italia.14.desc_3:0 "$me_roman_1_received_responses$ the majority accepting our invitation.\n\nThis is $me_roman_1_new_precadent$, a fact that [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] does not maintain quiet about."
 me_roman_1_new_precadent:0 "a novel precedent for Italic relations, mirroring a style of diplomacy hitherto found only in the Greek city states of ancient"
 me_roman_1_roman_italia.14.c:0 "Rome invariably triumphs!"
 me_roman_1_roman_italia.15.desc_3:1 "Our warm relationship with [SCOPE.Custom('rm_1_diplo_chic_desc_scopes')] has been place under increasing strain lately, with many rumours and insults being cast around the delegations.\n\nIt is impossible to confirm, but Rome may be behind it..."
 me_roman_1_roman_italia.15.desc_4:0 "Our astute schemes have succeeded in spreading distrust between [SCOPE.sC('rm_allies_1').GetName] and [SCOPE.sC('rm_allies_2').GetName], with neither suspecting our involvement!\n\nThat should shake the up the political landscape, and banquets, for the time being..."
 me_roman_1_roman_italia.16.desc:0 "The arrogance of the Romans will not be tolerated. They stride around our urban centres with their 'offers' as though the entire world already belonged to them.\n\nLuckily we have found kindred spirits among other Greek urban centres who share the identical disgust. Let us hope this stays the Romans for the time being at least."
 me_roman_1_roman_italia.17.desc:0 "The arrogance of the Romans continues to grow! Every day more Greeks are persuaded of the real menace; not Carthage, not the Italic tribes, but Roma!\n\nOnly by uniting versus the common menace can we ensure our motley collection of urban centres can face up to the Roman menace."
 me_roman_1_roman_italia.17.a:0 "Together we are robust."
 me_roman_1_roman_italia.17.c:0 "Together we are robust."
 me_roman_1_roman_italia.18.desc:0 "[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] has taken it upon [ROOT.GetCountry.GetRuler.GetHerselfHimself] to shoulder the backlash versus novel statutes enshrining the citizenship of all Italics.\n\nThe move is unpopular among both the populists who represent the Roman people, and aristocrats who seek to protect their privileges. We pray Rome reap the benefits of an inclusive society without strife..."
 me_roman_1_roman_italia.19.desc:0 "From now on the people of this peninsula will bow to Rome, serving in her armies and paying into her treasury.\n\nThere may be strife in the short term, but the delusions of the conquered will be tempered by realization of the natural order in time. They may prattle on about citizenship - let them! With our novel power on the stage of history, Rome has larger things to worry about."
 me_roman_1_roman_italia.20.desc_1:0 "wasted no time, eagerly broaching an alliance of mutual gain versus our common enemies, citing the great strength that our peoples could wield together.\n\nOur delegates were quite taken aback by their keenness, and await our response."
 me_roman_1_roman_italia.20.desc_2:0 "wish to offer us an oath of protection, whereby they would intervene to protect us if any nation tried to invade or molest the liberty of [ROOT.GetCountry.GetName].\n\nOur delegates await a response to this generous offer."
 me_roman_1_roman_italia.20.desc_3:0 "made it clear that an alliance of mutual gain is impossible due to our weakness, but suggested they protect our liberty in return for subservience to the Roman senate.\n\nOur delegates, with slightly wounded pride, await a response."
 me_roman_1_roman_italia.20.desc_4:0 "gave a non-committal spiel rather than offer us friendship or cooperation, emphasizing their sadness at being unable to offer us anything.\n\nOur delegates' chagrin tells us everything we require to know, the dastards have fobbed us off!"
 me_roman_1_roman_italia.20.desc_6:0 "have asked us to guarantee their liberty, evidently in some distress at their vulnerability.\n\nThey poured compliments on our delegates faster than Bacchus pours wine, and for a good few hours."
 me_roman_1_roman_italia.21.desc_2:0 "smiling as he relates their almost sycophantic thanks for giving them the assurance of our protection.\n\nLet us hope [SCOPE.sC('congress_target').GetName] do not drag us into pointless conflicts..."
 me_roman_1_roman_italia.21.desc_5:0 "fuming that they were egregiously plastered in insults and chased out of the structure.\n\nIt seems [SCOPE.sC('congress_target').GetName] are not too frightened to risk offending us..."
 me_roman_1_roman_italia.23.desc_1:0 "We owe much to the Etruscans, though they have permitted their ridiculous obsession with federal autonomy to weaken their position. They could be useful versus the northern barbarians or Carthaginian colonies."
 me_roman_1_roman_italia.23.desc_2:0 "The Umbrians place aside their feuds with the Etruscans just to have a pop at us, though I suppose we may have done the identical in their position. They could be useful allies versus the Gauls."
 me_roman_1_roman_italia.23.desc_3:0 "The Samnites have been our most dogged opponents lately, returning to bite at our heels with each and every town founded. Perhaps they just require a little love?"
 me_roman_1_roman_italia.23.desc_4:0 "The Sabines have a long history with Rome, joining the first settlers of our city and sharing a robust tradition, though they have permitted jealousy to corrupt their hearts."
 me_roman_1_roman_italia.23.desc_5:0 "The Lucanii have never been fond of Rome and watch our growing presence in Italia with some concern. They are not a weak people, and well positioned to aid versus the Greeks to the south."
 me_roman_1_roman_italia.23.c:0 "We will defend [SCOPE.sC('congress_target').GetName], but we have some requirements..."
 me_roman_1_roman_italia.24.a:0 "Place them at ease, nothing will be forgotten."
 me_roman_1_roman_italia.25.a:0 "They are plotting versus us!"
 me_roman_1_roman_italia.26.desc:0 "We established a place called [SCOPE.sP('colonia_scope').GetName], a township in [SCOPE.sP('colonia_scope').GetState.GetShortName], as a Colonia of Rome, granting its citizens special privileges and attracting settlers to the area.\n\nStrife and conflict wrested the place away from us temporarily, but its people are requesting their ancient privileges once again be restored now we are firm in control of the town again."
 me_roman_1_roman_italia.27.at:0 "We are probable to receive diplomatic events."
 me_roman_1_roman_italia.28.t:0 "Liberty"
 me_roman_1_roman_italia.28.desc:0 "Our suzerain supported down under pressure from Rome and has sent word that the treaties between our nations are severed forthwith.\n\nWe are free once more!"
 me_roman_1_roman_italia.29.desc:0 "The recent Roman conquest of the Gallic Senonian tribe caused a great panic among the population. Many have fled to our territories to commence novel lives.\n\nPerhaps we will one day dispatch these families back to their rightful homeland."
 me_roman_1_roman_italia.29.at:2 "#Y [THIS.GetCountry.GetName]#! gains Claims on #Y Gallic#! culture #Y Roman#! Territories in the Province of #Y $ariminum_area$#!.\n#Y [SCOPE.ScriptValue('rm_gallic_exodus_svalue')|0]#! Gallic pops from #Y Senonia#! have settled in our territories."
 me_roman_1_roman_italia.30.desc:0 "The pan-Italic congress is finally over and it will assuredly have far reaching consequences for the future, or so [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] claims in [ROOT.GetCountry.GetRuler.GetHerHis] concluding speech...\n\nIn truth it will be hard to judge until many years have passed. Let us hope they will be kind to [ROOT.GetCountry.GetName]."
 me_roman_1_roman_italia.32.desc:0 "The Romans organised a congress to construct ties between the Italic peoples, but kept us out of the talks.\n\nNow we hear they have granted feudatory status to [SCOPE.sC('subject_target_2').GetName], and many are anxious about how this will affect our own status. A combined delegation was dispatched to Rome to ensure they do not forget their closest friends."
 me_roman_1_roman_italia.34.t:0 "Colonia Specialisation"
 me_roman_1_roman_italia.34.desc:0 "With the growing importance of the Colonia as bastions of Roman culture and administration, we must decide what arrange of urban centres we want them to be.\n\nIs civic organisation the most important objective? Or securing a steady stream of recruits? Is the key to greatness the integration of the conquered? Or encouraging trade and production?"
 me_roman_1_roman_italia.34.a:0 "They shall provide the core of our novel recruits."
 me_roman_1_roman_italia.34.c:0 "Trade will be organised around these provincial centres."
 me_roman_more_likely_to_succeed:0 "This option is more probable to succeed if"
 me_roman_1_roman_italia.36.desc_1:0 "$me_roman_1_a_roman_envoy$ They propose protecting us in exchange for use of our harbour and free passage through our territory, letting us manage our own affairs and trade. How shall we respond to such a generous proposal?"
 me_roman_1_a_roman_envoy:0 "\n\nA Roman envoy has presented his senate's requirements to our council."
 me_roman_1_roman_italia.38.desc_1:0 "It is in fact more a set of requirements. They find our continuing independence an intolerable state of affairs, and demand we pay tribute to the Rome.\n\nTheir grave messengers wait impatiently for our response even now..."
 me_roman_1_roman_italia.39.desc_1:0 "[SCOPE.sC('rm_offer_scope').GetName] were much affected by our menaces, and decided their liberty was not worth conflict with Rome.\n\n$me_roman_1_let_us_hope$"
 me_roman_1_roman_italia.39.desc_3:0 "Astute [SCOPE.sC('rm_offer_scope').GetName] have accepted our generous proposal, trading their sovereignty for safety and prosperity.\n\n$me_roman_1_let_us_hope$"
 me_roman_1_roman_italia.39.desc_5:0 "Supercilious [SCOPE.sC('rm_offer_scope').GetName] responded to our offer by comparing our honour with that of a range of undesirable fauna.\n\n$me_roman_1_conventional_means$"
 me_roman_1_let_us_hope:0 "Let us hope this is the inception of a great cooperation between the [SCOPE.sC('rm_offer_scope').GetAdjective] and Roman people."
 me_roman_1_roman_italia.39.a:0 "A little gentle persuasion invariably works."
 me_roman_1_roman_italia.40.desc:0 "There is growing anti-Roman sentiment among the Greek urban centres of Italia as a result of our incautious methods of diplomacy.\n\n[SCOPE.sC('greeks_threatened_1').GetName] and [SCOPE.sC('greeks_threatened_2').GetName] have united in their fear of our domineering."
 me_roman_1_roman_italia.41.at:0 "We will demand that #Y [SCOPE.sC('persuade_greeks_rebel_1').GetOverlord.GetName]#! releases #Y [SCOPE.sC('persuade_greeks_rebel_1').GetName]#! and any other Greek subjects on the Italian peninsula. #R If they refuse we will go to conflict.#!"
 me_roman_1_roman_italia.41.b:0 "Promote disaffection in their urban centres."
 me_roman_1_roman_italia.42.desc:0 "Our diplomatic methods frighten the craven Greeks of Magna Graecia, more of whom are being inducted a coalition they dub, 'The Allies'.\n\nThey seem to consider they can stop us by banding together - but this aggressive posturing will not be tolerated."
 me_roman_1_roman_italia.43.desc:0 "The Romans seek to increase their influence across the Italian peninsula, and, recently, our submission to [ROOT.GetCountry.GetOverlord.GetName] has become a hot topic, rumored to be fueled by Roman agents seeking to weaken [ROOT.GetCountry.GetOverlord.GetName] and win our support.\n\nThis may be a chance to win our liberty, though the Romans surely have their own motives in all this."
 me_roman_1_roman_italia.43.a:0 "Liberty calls our name."
 me_roman_1_roman_italia.44.desc:0 "We have received a proposal from the Roman senate. They offer to win our liberty from [ROOT.GetCountry.GetOverlord.GetName].\n\nIt is clear they serve their own interests, but liberty is a tempting prospect regardless of the risks. If accept, we risk conflict with our suzerains, though Rome promises us their assistance."
 me_roman_1_roman_italia.44.a:0 "Liberty calls our name."
 me_roman_1_roman_italia.44.at:0 "If #Y [THIS.GetCountry.GetOverlord.GetName]#! refuses to back down, we will join #Y Rome's#! conflict versus them."
 me_roman_1_roman_italia.45.desc:0 "The dastardly Romans, bent on dominance of the Italian peninsula, have approached our Greek subjects, attempting to encourage revolt versus our rule."
 me_roman_1_roman_italia.45.a:0 "We is unable to risk conflict with Rome..."
 me_roman_1_roman_italia.45.bt:0 "#Y Rome#! will declare conflict on us along with any Greek subjects they have persuaded."
 me_roman_1_roman_italia.46.desc_1:0 "We have the support of the Greeks, but the stubborn fools refuse to back down. It is time to bring the fight to [SCOPE.sC('persuade_greeks_rebel_overlord').GetName] and liberate the proud Hellenic urban centres of ancient from their meddling!"
 me_roman_1_roman_italia.46.desc_2:0 "The government of [SCOPE.sC('persuade_greeks_rebel_overlord').GetName] has acceded to our menaces and released their Greek subjects!"
 me_roman_1_roman_italia.46.desc_3:0 "We were unable to secure any support versus [SCOPE.sC('persuade_greeks_rebel_1').GetOverlord.GetName], and have ultimately only showed our hand to them..."
 me_roman_1_roman_italia.46.b:0 "Conflict it is."
 me_roman_1_roman_italia.47.desc_1:0 "[SCOPE.sC('greek_persuaded_scope').GetName] has agreed to back us versus [SCOPE.sC('persuade_greeks_rebel_overlord').GetName]. This should make them consider twice about fighting us."
 me_roman_1_roman_italia.47.desc_2:0 "[SCOPE.sC('greek_persuaded_scope').GetName] has refused to betray their [SCOPE.sC('persuade_greeks_rebel_overlord').GetAdjective] suzerains. Let the fools wallow in service."
 me_roman_1_roman_italia.48.desc:0 "The Italic feudatories have been invariably been a matter of contention, some arguing for their military usefulness, others regarding them as a menace only a stones throw from Roma.\n\nCertain senators are pushing for drastic action; preemptively smashing our Italic allies to pieces. If successful it would ensure our dominance over Italia."
 me_roman_1_roman_italia.48.at:0 "#R All our Italic subjects will become allied to [SCOPE.sC('latin_subject_1').GetName] and join them in conflict versus us. Their current combined strength is [SCOPE.ScriptValue('rm_total_latin_subject_strength_svalue')|0] Cohorts, compared to our [SCOPE.ScriptValue('rm_total_cohort_strength_svalue')|0]."
 me_roman_1_roman_italia.49.desc:0 "In an unprecedented and sacriligious move, the Romans have declared all pacts and oaths with their Italic allies void, and mobilised their armies to crush every hamlet and fort in Italia not under direct Roman government!\n\nWe must meet them with cold steel, and end the barbarous tyranny of these warmongers!"
 me_roman_2_provincia.1.desc:0 "The local magistrates of [SCOPE.sP('rm_2_unruly_province').GetName] report that Sardinians have burned down many of their vital buildings.\n\nThe scoundrels coordinated a night attack and were long gone before a reaction could be mobilised. The indigenous people are clearly doggedly opposed to Roman rule."
 me_roman_2_provincia.2.desc:0 "Our officials have been having a miserable time working with the proud locals in Sardinia.\n\nMany have taken to isolated communities in the mountains, living on banditry and piracy. One of their leaders now requirements Sardinian self rule as a vassal tribe. The idea is deeply unpopular in Rome, but could free us from an endless insurgency of attrition."
 me_roman_2_provincia.2.b:0 "They will live and perish under Rome's shadow."
 me_roman_2_provincia.3.desc_2:0 "The Roman's recent aggressive expansion the rightfully Punic island of Sardinia has caused many of the Carthaginians there to flee to our shores. We must pray that the gods deem fit to assistance us reclaim these territories from the Roman invaders and return these families to their homes."
 me_roman_2_provincia.4.t:0 "The Drums of Conflict"
 me_roman_2_provincia.4.desc:0 "The mood in Rome is once again one of hopeful trepidation; of the calm before the tempest; of the wistful yearning of fresh-faced soldiers for the spoils and adventure of conflict.\n\nRome stands on the threshold of everlasting glory, the fates and future of all the peoples of the world perhaps lie in our hands. Much will be decided in the coming days..."
 me_roman_2_provincia.5.desc:0 "Even with our recent successes, it is surprising how quickly the people of Rome have become accustomed to the idea of our indefatigablility.\n\nSpurred on by soldier's trinkets and stories, crowds proclaim the invincibility of our forces, citing them as proof Rome is loved dearly by the gods, and demanding further campaigns and conquests versus our neighbours."
 me_roman_2_provincia.5.b:0 "It is affluence they want."
 me_roman_2_provincia.7.desc:0 "[SCOPE.sChar('expansion_encourager').GetName] stridently advocates the conquest of Syracusae.\n\n'These Greeks are colonists, little better than Punic grocers, who abandoned their own territories to rape the soil and urban centres of our Siculian brothers! It is someone succeeded where the hubristic Athenians failed - no city can long withstand the wrath of Rome!'"
 me_roman_2_provincia.9.desc:0 "The exploits of our enthusiastic senators have reached the ears of the Syracusans and Carthaginians, though our recent conquests are probably a more pressing concern for them.\n\nSome rumours go as far as to claim that the ancient rivals are warming to each other after centuries of conflict, uniting versus 'Roman belligerence'."
 me_roman_2_provincia.11.desc_1:0 "Our first colony in [SCOPE.sC('me_rome_scope').Custom('rm_colonization_area')] will be at [SCOPE.sP('rm_col_target').GetName]. Scouts sent ahead, cautiously avoiding confrontations with the locals, have confirmed its suitability for the minor group of settlers; landless freemen from [SCOPE.sP('rm_col_settler_source_2').GetName] in [SCOPE.sP('rm_col_settler_source_2').GetState.GetShortName].\n\nWe could encourage more settlers by providing them with some incentives."
 me_roman_2_provincia.11.desc_2:0 "Our prospective settlers now look to the founding of a colony near [SCOPE.sP('rm_col_target').GetName].\n\nAs invariably, there are plenty of robust Romans ready to uproot their lives for a chance find fortune on the frontier."
 me_roman_2_provincia.11.desc_3:0 "Following the success of our colonies, residents of [SCOPE.sP('rm_col_settler_source_1').GetName] have funded their own settlement of a village near [SCOPE.sP('rm_col_target').GetName].\n\nThey have met with success so far, and wish to be recognised as the legitimate owners of the area."
 me_roman_2_provincia.11.a:0 "A novel colony requirements a solid foundation."
 me_roman_2_provincia.12.a:0 "Post notices in all fora: 'Your country requirements you!'"
 me_roman_2_provincia.13.desc_1:0 "\n\nIt seems the local tribes people have taken offence at the establishment of the colony and conducted an unprovoked raid into the town, slaughtering some of its Roman inhabitants and looting their homes before fleeing."
 me_roman_2_provincia.13.desc_2:0 "\n\nIt appears our settlers were not quite as brave as they imagined, and have tired of the harsh life on the frontier. They long to return to the comforts and safety of Roma and civilisation.\n\nWithout further incentives they are sure to abandon the colony."
 me_roman_2_provincia.13.a:0 "Intolerable. Ensure the locals comprehend that."
 me_roman_2_provincia.14.desc_2:0 "\n\nOur settler's success has attracted further immigration through word of mouth, increasing the proportion of Romans in the area and contributing to the rapid development of the settlement and its amenities."
 me_roman_2_provincia.15.t:0 "Colonisation of [SCOPE.sC('me_rome_scope').Custom('rm_colonization_area')]"
 me_roman_2_provincia.15.desc_1:0 "[SCOPE.sC('me_rome_scope').Custom('rm_colonization_area')] is now under our control thanks to our brave settlers, but it can by no means be considered a Roman island.\n\nOur novel towns will require time to become productive, but aggressively pursuing Romanization may ensure their passivity, starting with introducing them to the god's true forms."
 me_roman_2_provincia.15.desc_2:0 "Despite our best efforts we have been unable to take full control of the island of [SCOPE.sC('me_rome_scope').Custom('rm_colonization_area')], harried by the natives and our jealous rivals, though our foothold remains robust."
 me_roman_2_provincia.15.desc_3:0 "Our efforts to colonise [SCOPE.sC('me_rome_scope').Custom('rm_colonization_area')] and wrest it from our rivals have met with utter ruin, bringing shame on Rome and the lamentation of many Roman wives..."
 me_roman_2_provincia.16.desc_1:0 "We could persuade them to join our cause in exchange for the liberation of their territories."
 me_roman_2_provincia.16.ct:0 "If #Y [SCOPE.sC('rm_offer_scope').GetName]#! accepts and their suzerain does not back down we will fight for their liberation.\n#R We will declare conflict on [SCOPE.sC('rm_offer_scope').GetOverlord.GetName].#!"
 me_roman_2_provincia.16.d:0 "[SCOPE.sC('rm_offer_scope').GetName] are not worth a conflict with [SCOPE.sC('rm_offer_scope').GetOverlord.GetName]."
 me_roman_2_provincia.17.desc_1:0 "Surprisingly the Romans demand nothing, at least not directly, and instead offer a surprisingly equitable alliance between our nations. The more patriotic of [ROOT.GetCountry.GetName] are of course horrified at being drawn into Rome's conflicts as a pawn, but we is unable to deny that becoming a privileged ally of Rome is far more attractive than fighting them..."
 me_roman_2_provincia.17.desc_2:1 "As we have come to hear of the Romans, the offer is in fact more a set of requirements. It seems they find the continuing independence of our proud country an intolerable state of affairs, and demand our immediate subjection as a vassal of Rome.\n\nThe gall of these eagle lovers is almost unbelievable, and yet their grave messengers wait impatiently for our response even now..."
 me_roman_2_provincia.19.desc_1:0 "Our conquest of Sicilia has caused the flight of many Punics, who seek refuge in [SCOPE.sC('rm_punic_exodus_country').GetName], believing they will have better lives or evade mistreatment."
 me_roman_2_provincia.19.desc:0 "\n\nSome argue that migration should be encouraged, making room for Roman settlers and their families, others that it will reinforce our enemies with servants eager to destroy Rome."
 me_roman_2_provincia.19.b:0 "Attempt to convince them they are welcome."
 me_roman_2_provincia.20.desc:0 "The [SCOPE.sC('rm_offer_scope').GetAdjective] reception was sceptical at first, but after realising just what we were offering they warmed up to our envoy.\n\nThey whole-heartedly accept our generous offer, wishing to be rid of the domination of [SCOPE.sC('rm_offer_scope').GetOverlord.GetName]."
 me_roman_2_provincia.21.t:0 "Rome Requirements Liberty for [SCOPE.sC('rm_offer_scope').GetName]"
 me_roman_2_provincia.21.desc:0 "Roman envoys are demanding the immediate release of our subject, [SCOPE.sC('rm_offer_scope').GetName], under menace of conflict.\n\n [SCOPE.sC('rm_offer_scope').GetAdjective] leaders have been colluding with the Romans, aiming to be free of us by committing to an alliance with Rome.\n\nRefusal will mean conflict, but we could release pitiful [SCOPE.sC('rm_offer_scope').GetName]."
 me_roman_2_provincia.21.bt:0 "Rome may declare conflict on us, protecting [rm_offer_scope.GetName]."
 me_roman_2_provincia.22.desc:0 "Our envoy has returned from [SCOPE.sC('rm_offer_scope').GetOverlord.GetName] with their response to our requirements.\n\n"
 me_roman_2_provincia.22.desc_2:0 "They refused, comparing us to a variety of farm animals, and suggested we make our requirements to the tips of their sarissas instead."
 me_roman_2_provincia.22.a:0 "The fear of Rome is robust."
 me_roman_2_provincia.23.desc:0 "The expansion of Rome is worrying indeed, and there is no doubt they will soon look on our own territories with hungry eyes.\n\nThough we have been enemies with [SCOPE.Custom('get_carthage_syracuse')] for as long as anyone cares to remember, it is becoming clear that uniting versus a common enemy may be the best way to protect our interests on Sicily."
 me_roman_2_provincia.24.desc:0 "The local Nuragic peoples in the vicinity of [SCOPE.sP('rm_2_unruly_province').GetName] have risen up in open rebellion versus us!\n\nThey are united under the leadership of [SCOPE.sChar('scope:rm_2_nuragic_governor').GetEmployer.GetRulerTitle] [SCOPE.sChar('scope:rm_2_nuragic_governor').GetName], who promises to 'rid the motherland of the Roman invaders!'"
 me_roman_2_provincia.24.a:0 "The fools will all perish!"
 me_roman_2_provincia.24.tt:0 "#R Part of Sardinia has revolted! We are now at conflict with#! #Y Sardinia#!#R !#!"
 me_roman_2_provincia.25.desc:0 "Officials from [SCOPE.sP('rm_2_unruly_province').GetName] in Sardinia have informed us that their port, once relatively occupied with traders and sailors but free from crime, has become a hot-spot for local pirates and villains.\n\nIt seems that, in retaliation for dominating the island, the locals have taken up lives of banditry and piracy to escape our rule and maintain their independence."
 me_roman_2_provincia.26.desc:0 "We have established control over the islands of the Mediterranean, supplanting the ancient Graeco-Carthaginian hegemony.\n\nWhat shall we do with these novel holdings, peopled by foreigners of no relation to our own blood, and in remote places far from the ears of the Roman masses? The islands could become very profitable if properly managed, but perhaps we should concentrate first on contriving a sense of loyalty and obedience."
 me_roman_2_provincia.26.b:0 "It looks like we are going to require more shackles..."
 me_roman_3_cisalpine_gaul.2.c:0 "Dispatch a counter-offer..."
 me_roman_3_cisalpine_gaul.4.bt:0 "$me_roman_become_tribal_vassal_tooltip$\n#Y Tribal Vassals#! dispatch Manpower to their suzerains in exchange for protection and Civilisation, but can #R NOT#! be diplomatically integrated.\n$me_roman_more_powerful$ #Y [SCOPE.sC('rm_offer_scope').GetName]#!."
 me_roman_reject_claim_us_tooltip:0 "#R If they decline our offer they will gain Claims on all our Territory.#!"
 me_roman_3_cisalpine_gaul.7.t:0 "Territory Grants in Senonia"
 me_roman_3_cisalpine_gaul.7.desc:0 "Many Gallic tribesmen fled from Ariminum to neighbouring tribes to the north.\n\nSenator [SCOPE.sChar('rm_land_grant_guy_scope').GetName] proposes distributing their territories to military veterans and destitute Roman families. These grants are sure to distress our Gallic neighbours, who will see the menace posed by Roman expansion, and take it to indicate future Roman expansion further north."
 me_roman_3_cisalpine_gaul.8.desc:0 "The settlement of Ariminum has gone remarkably well, with many freeholders already established on their farmsteads.\n\nThis is sure to assistance us control the ancient Senonian territories and facilitate the integration of the area as an Italic, rather than Gallic, base."
 me_roman_3_cisalpine_gaul.9.desc:0 "With the conquest of such a large area on the borders of Italia, many freemen are jumping at the chance to move into the vast and fertile Padus valley to establish their own farms.\n\nThis is just the commencement of the transformation of Gallic areas into Romanized townships loyal to the state."
 me_roman_4_punic_rivals.1.desc:0 "Hispania is a vast territory, a patchwork of various tribes, alliances, and influences. The Carthaginians and Greeks have had their hands in Iberian pots for centuries, trading and fighting with one tribe or another.\n\nIf we are to replace Carthage as the leading force in Hispania, it might be wise to approach what tribes we can and win them over - and perhaps even encourage suspicion of Carthage."
 me_roman_4_punic_rivals.1.at:0 "Recipients will be more probable to side with #Y Rome#!."
 me_roman_4_punic_rivals.4.desc:0 "Our senators are agreed that the menace posed by Carthage, even now, is too great for Rome to contemplate - the Punics must submit to have their treasury made generous to Rome so they never again will domineer over the Internal Sea and wage conflict without our consent.\n\nOur ambassadors are ready to depart and present the requirements to the Carthaginians."
 me_roman_4_punic_rivals.4.b:0 "Dispatch them an offer they will never accept."
 me_roman_4_punic_rivals.4.bt:1 "#R We will gain Claims on the Province of #Y [SCOPE.sC('rm_4_carthage_scope').GetCapital.GetState.GetShortName]#! and declare conflict on #Y Carthage#!!#!"
 me_roman_4_punic_rivals.5.t:0 "Roman Requirements"
 me_roman_4_new_list:0 "The insidious encroachment of Roman power has reduced our once mighty empire to disgrace. Now, Roman ambassadors bring a novel list of"
 me_roman_4_punic_rivals.5.desc_1:0 "$me_roman_4_new_list$ outrageous requirements!\n\n[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] paraded through Rome in prostitutes garb, our walls dismantled, our temples replaced with Roman trophies, our entire navy and all ports surrendered, and all under the menace of conflict!"
 me_roman_4_punic_rivals.5.desc_2:0 "$me_roman_4_new_list$ requirements, stipulating that Carthage pay tribute as reparations for our conflicts to ensure we remain weak. Should give in to these requirements and maintain our liberty? Such as it is..."
 me_roman_4_punic_rivals.5.c:0 "They will perish! They will perish!"
 me_roman_4_punic_rivals.6.desc:0 "Our ambassadors have returned from the Carthaginians, bearing news of their response to our requirements.\n\n"
 me_roman_4_punic_rivals.6.desc_1:0 "The pitiable Punics, seeing the hopelessness of standing up to our might, have acquiesced to our requirements and will pay tributes of silver to our treasury for the foreseeable future. These are understood to be payments for the damages incurred in the past, and will maintain them weak."
 me_roman_4_punic_rivals.6.desc_2:0 "The foolish Punics, mislead by delusional leaders, have refused to acquiesce and are making ready to wage conflict yet again! This time we will make sure that they and their people fully comprehend the calamitous mistake they have made, and the price for refusing Rome!"
 me_roman_4_punic_rivals.6.at:0 "#Y Carthage#! is probable to revolt in the future, when they do, or if they otherwise break the agreement, we will be able to intervene."
 me_roman_4_punic_rivals.7.desc:0 "The tendrils of Punic power are long, but not ironclad. Their influence even in Africa is tenuous; many of their vassal urban centres and tribes maintain much autonomy and resent the dominance of Carthage.\n\nIf we can exploit the avarice and envy of some of these vassals, we may find they cause a great deal of trouble for the Carthaginians."
 me_roman_4_punic_rivals.9.desc_1:0 "Receiving diplomats from our suzerain's foes is somewhat irregular, but it is better to know your enemies and how they present their schemes than be in the dark.\n\nThe Romans seek to turn Carthage's vassals versus her, and we must admit, many have longed for an opportunity to challenge the dominance of Carthage and once again see the sunlight of liberty. "
 me_roman_4_punic_rivals.10.desc_1:0 "We have received news from our agents in Hispania; the Romans have been conducting talks with many of the tribes in the region in an attempt to turn them versus us!\n\nBearing gifts and spreading lies about our treachery, they have had the ears of chieftains across the area with varying degrees of success. At least this may reveal who we can rely on, and who deserves our wrath..."
 me_roman_4_punic_rivals.10.desc_2:0 "Our agents have brought us most distressing news; the Romans have been secretly treating with our closest subjects and allies in an attempt to turn them versus us.\n\nThe meetings alone amount to a betrayal, but we can see the appeal. We must ensure each and every supposed friend is kept under close watch now that our power is being threatened so boldly, they have long been under our thumb and now risk growing restless."
 me_roman_4_punic_rivals.11.desc_1:0 "A [SCOPE.sChar('rm_4_punic_leader_scope').GetWomanMan] named [SCOPE.sChar('rm_4_punic_leader_scope').GetName] has stirred the Carthaginians into a frenzy of fury, taking leadership of the city.\n\nThe fool has stopped their tribute and aims to reclaim [SCOPE.sChar('rm_4_punic_leader_scope').GetHerHis] city's lost glory.\n\nIt is intolerable - we must immediately demand the reduction of Carthage and the moving of their capital to a novel site inland."
 me_roman_4_punic_rivals.11.desc_2:0 "The Carthaginians have proven their ambitions are not extinguished.\n\nEach year the ease of extracting tribute has lessened, and it is clear their leaders are unsatisfied with remaining subjects of Rome. Incensed, the senate has moved to bring conflict on Carthage and destroy the Punic menace once and for all."
 me_roman_4_punic_rivals.11.at3:0 "#Y Carthage's#! capital will move inland\n\nIf they refuse, we will #R declare conflict#! on #Y Carthage#!."
 me_roman_4_punic_rivals.12.desc:0 "Submitting to Roman domination was a necessary evil forced upon us at the point of a sword.\n\nThe outrageous tributes and our unfair treatment by the eagle lovers is more than many Punics can bear. [SCOPE.sChar('rm_4_punic_leader_scope').GetName] has spearheaded a movement, securing support to end our subjection to Rome by conflict, if necessary."
 me_roman_4_punic_rivals.13.desc:0 "In classic Roman style, they have sent another ambassador to our great city with another list of requirements from their haggard senators.\n\nThe clauses this time are nothing so palatable as yearly tribute, and amount to the total destruction of our city and the reduction of our people to Roman slaves.\n\nThere is no way we can accept such terms... is there?"
 me_roman_4_punic_rivals.13.at:0 "#Y Rome#! will declare conflict on #Y Carthage#!."
 me_roman_4_punic_rivals.14.desc_1:0 "The ridiculous Carthaginians have decided to go to conflict, despite their pitifully reduced strength.\n\nThey should have considered the consequences of their actions long ago, when they first contested our expansion. Now they will suffer the horror and shame of total defeat.\n\nOh how different things could have been..."
 me_roman_4_punic_rivals.14.desc_2:0 "To our surprise, the ambassador returned with news that Carthage have made an abrupt change in policy, their leader supplicating our representatives for forgiveness from Roma and accepting the full list of requirements.\n\nIt seems they would rather be reduced in this way than suffer the horrors of another conflict..."
 me_roman_4_punic_rivals.14.bt:0 "#Y Carthage#! have submitted to our requirements."
 me_roman_4_punic_rivals.15.a:0 "Intriguing... dispatch an envoy."
 me_roman_4_punic_rivals.17.desc_2:0 "They report that the distrustful Punics rejected our offer out of hand, apparently believing it to be some arrange of trap.\n\nIt seems the uneasy status quo will have to remain, though, how much more tribute can the Carthaginians be expected to pay before they hatch some scheme?"
 me_roman_4_punic_rivals.18.desc:0 "Carthage has been reduced to a footnote of history, now we decide how to manage the rich and fertile holdings of Africa and treat the defeated Punic peoples.\n\nMany argue the territory should be used to provide for Rome's people, making the most of our novel holdings and sending a message to our enemies, though others argue that Carthage's prior success shows the territory's inherent suitability for great metropolitan centres."
 me_roman_5_hispanian_ambition.4.desc:0 "Our novel territories in Hispania are being carefully organised by our administrators; overseeing the collection of taxes, recruitment of soldiers, and flow of trade.\n\nThey have divided the region into so-called 'Hispania Citerior' and 'Hispania Ulterior', to divide the vast management requirements. Will we squeeze out all we can to fund future expansion, or ensure that the territories become civilised as soon as possible?"
 me_roman_5_hispanian_ambition.4.b:0 "The true potential of Hispania will take decades to realise."
 me_roman_5_hispanian_ambition.5.desc:0 "The careful exploitation of an existing situation can be the most fruitful method of expanding the state.\n\nFor instance, the people of [SCOPE.sC('rm_offer_scope').GetName] find fighting [SCOPE.sC('rm_protection_enemy_scope').GetName]. We could bring [SCOPE.sC('rm_offer_scope').GetName] into the fold with a deal, by protecting them from the [SCOPE.sC('rm_protection_enemy_scope').GetAdjective] menace..."
 me_roman_5_hispanian_ambition.6.b:0 "What makes Roman suzerains preferable to any others?"
 me_roman_5_hispanian_ambition.7.desc_2:0 "The envoy confirms that the [SCOPE.sC('rm_offer_scope').GetAdjective] leader, [SCOPE.sC('rm_offer_scope').GetRuler.GetName], has accepted our offer in exchange for our protection versus [SCOPE.sC('rm_protection_enemy_scope').GetName].\n\nIt seems a toast to diplomacy is in order, once we defeat [SCOPE.sC('rm_protection_enemy_scope').GetName]..."
 me_roman_7_invading_gaul.1.desc:0 "The Massilians have occupied the Gaulish coasts for many years, exporting Gallic slaves and selling Greek goods to the barbarians.\n\nWe have no real quarrel with them, as long as they do not stand in the way of our subjugation of the Gauls. An alliance or tributary arrangement might permit the Massilians to continue their bean-counting undisturbed."
 me_roman_7_invading_gaul.2.desc_2:0 "As we have come to hear of the Romans, the offer is in fact more a set of requirements. It seems they find the continuing independence of our proud country an intolerable state of affairs, and demand our immediate subjection as a tributary to the Roman republic.\n\nThe gall of these eagle lovers is almost unbelievable, and yet their grave messengers wait impatiently for our response even now..."
 me_roman_7_invading_gaul.7.t:0 "Territory Purchases in Gaul"
 me_roman_7_invading_gaul.7.desc:0 "With Roman allies secured in Gaul, it has been pointed out that one of the friendly Gallic nations, who call themselves [SCOPE.sC('rm_offer_scope').GetName] controls a harbour in [SCOPE.sP('rm_purchase_territory_scope').GetName] that would suit our purposes well.\n\nWe could offer to purchase the territory for a reasonable sum and thereby expand our maritime abilities in the region."
 me_roman_7_invading_gaul.8.desc:0 "Our Roman allies have approached us, offering to purchase our territory around the settlement of [SCOPE.sP('rm_purchase_territory_scope').GetName]. They clearly want access to the natural harbour there, and consider they could place it to better use than ourselves. "
 me_roman_7_invading_gaul.9.desc_1:0 "Our envoys have returned from [SCOPE.sC('rm_offer_scope').GetName] empty handed - it seems [SCOPE.sC('rm_offer_scope').GetRuler.GetName] sees the value of the harbour at [SCOPE.sP('rm_purchase_territory_scope').GetName] and wishes to hold on to it for now..."
 me_roman_7_invading_gaul.9.desc_2:0 "Or envoys have returned from [SCOPE.sC('rm_offer_scope').GetName] bearing a treaty, signed by [SCOPE.sC('rm_offer_scope').GetRuler.GetName], transferring control of all territory in the vicinity of [SCOPE.sP('rm_purchase_territory_scope').GetName] to Rome. These barbarians can be reasonable after all."
 me_roman_7_invading_gaul.10.desc:0 "A few astute diplomats have place forward an interesting proposal for expanding our power in Gaul. They have been evaluating the current political landscape for weaknesses, and settled on the tribe of [SCOPE.sC('rm_offer_scope').GetName].\n\nThey find themselves at conflict with [SCOPE.sC('rm_protection_enemy_scope').GetName], and there is an opportunity to intervene on the side of [SCOPE.sC('rm_offer_scope').GetName] by asking for vassalage in return."
 me_roman_vassal_trib_desc_tooltip:0 "#Y Tribal Vassals#! dispatch Manpower to their suzerains in exchange for protection and Civilisation, but can #R NOT#! be diplomatically integrated."
 me_roman_trib_desc_tooltip:0 "#Y Tributaries#! dispatch a portion of their revenue to their suzerains in exchange for protection, but can #R NOT#! be diplomatically integrated."
 me_roman_feud_desc_tooltip:0 "#Y Feudatories#! join their suzerains in conflict in exchange for protection, and can be diplomatically integrated."
 roman_conquest.colonia_desc:0 "\n\nWith newly conquered territory comes the inevitable parceling of territory and distribution of promises, but it is up to us to decide which township will become the Roman hub of the area."
 roman_conquest.2.desc:0 "The mighty Etruscans have fallen. Rome's greatest neighbour is reduced, and Rome is the undisputed master of the Tyrrhenian coastline. We will ensure it is Rome, not Etruria, that is remembered for all time."
 roman_conquest.4.desc:0 "At last the stubborn Samnite tribes have been forced to accept the superiority of Roman arms. These conflicts will go into the annals of time with the victory over Lars Porsena and the Rape of the Sabines."
 roman_conquest.4.c:0 "A novel coastal city, Salernum!"
 roman_conquest.5.desc:0 "The Messapii and Apulii, and their endless squabbling and plotting with the Greeks urban centres, are finally at an end. The way to Greece herself is clear, if we can only find the strength to cross the sea."
 roman_conquest.6.desc:0 "One more meddling, jealous, Italic tribe vanquished by Rome's might. This will teach our neighbours the price of scheming with Greeks and maintaining jealous feuds in the face of inevitable defeat."
 roman_conquest.6.b:0 "Velia, the ancient Phocaean port!"
 roman_conquest.7.desc:0 "The northern borders of Italia are free from barbarians, and the gateway to Cisalpine Gaul secure. The Gauls must be kept as far from Roma as possible.\n\nIt seems many Celts in Ariminum have already fled their homes for neighbouring [SCOPE.sC('rm_gallic_exodus_country').GetName]."
 roman_conquest.9.desc:0 "Corsica is the smallest and most rugged of the westerly islands, but its success as a Phocaean trading post and Etruscan port are a testament to the value of its harbours."
 roman_conquest.9.a:0 "The ancient Greek port of Aleria will do nicely!"
 roman_conquest.10.desc:0 "We have secured the most important parts of the island of Sardinia, commanding its main urban centres, coastlines, and harbours - ensuring our enemies have no ports of call."
 roman_conquest.10.b:0 "We favour the accessible eastern port of Olbia."
 roman_conquest.10.c:0 "Caralis has the most suitable territory."
 roman_conquest.10.d:0 "The western harbour at Cornus looks promising."
 roman_conquest.12.t:0 "The Territory of Tyrants"
 roman_conquest.12.desc:0 "Syracusae, which withstood the Athenian expedition and birthed the most depraved tyrants, has finally fallen. Their territories have returned to Italic rule, though they prepared fine urban centres for us to move in to."
 roman_conquest.13.desc:0 "We have at last taken a jewel of the Carthaginian trading empire. May they rot in the African heat while the riches of Sicilia and her great urban centres are laid bare to us."
 roman_conquest.14.desc:0 "Sicilia is famed for the quality and abundance of its grain. With the island under Roman control, we can increase production and ensure the people of Rome will never require to go without their daily bread."
 roman_conquest.16.desc:0 "The Italic tribes of Liguria, despite the pressure of Gallic migrations and invasion, have maintained their homes versus all odds. We welcome all such stalwart brother Italics to the republic!"
 roman_conquest.16.d:0 "How about the harbour at Albumingaunum?"
 roman_conquest.17.desc:0 "The southern Padus valley is completely under our control. We are one step closer to driving the Gauls back across the Alps and spreading the light of Roman civilisation across all Gaul.\n\nWe should select a focal point for our defensive efforts to ensure the Gauls never again cross the Padus."
 roman_conquest.17.modtt:0 "Every owned Territory in #Y Cisalpine Gaul#! south of the Padus river with a fort has gained the #Y Robust-point#! modifier."
 roman_conquest.18.desc:0 "With the fall of the Insubrii dies some of the most dogged Gallic opposition in Cisalpine Gaul, and of course some of most promising territory in the Padus valley is now in our hands."
 roman_conquest.19.desc:0 "The spirited Venetii have fallen under our dominion, extending our borders to the astern Alpine approaches. With a robust base here we will be able to unseat the pirates of Illyria and expand to the north-west."
 roman_conquest.19.b:0 "The harbour at Aquileia is very fine."
 roman_conquest.20.desc:1 "We have subdued all Gauls this side of the Alps. Now it is time to place into effect the policies that will define our rule here.\n\nThe Gauls are well suited to manual labour due to their rugged existence, but the area could yet become a civilised territory on Italia's doorstep."
 roman_conquest.21.desc:0 "At long last the city of Carthage, perhaps our greatest rivals, is ours, and despite the miseries of conflict, the local district is fertile and rich. It can be a centre for grain production and Roman power in Africa."
 roman_conquest.22.desc:0 "The Punics have been driven from their Hispanian colonies, securing the rich mines and port urban centres for Rome. Will we bring the pen or the sword to the inhabitants of this wild and beautiful territory?"
 roman_conquest.22.at:0 "All countries in #Y Hispania#! that neighbour us or our subjects will gain #G +25.0#! opinion of us."
 roman_conquest.22.bt:0 "We will gain Claims on all Territory in #Y Hispania#! that neighbours us or our subjects.\nAll countries in #Y Hispania#! that neighbour us or our subjects will lose #R -25.0#! opinion of us."
 roman_conquest.23.t:0 "A Menace No More?"
 roman_conquest.25.desc:0 "The southern Hispanian coast was once the beating heart of Carthaginian ambitions - it is little wonder, abounding as it does with all manner of metals, precious and robust, and fair port urban centres."
 roman_conquest.26.desc:0 "The Hebrus here comes to empty itself into the internal sea. All trade in the western Mediterranean, whether to evade Carthaginian ports or to barter with local tribes, must flow along this coast."
 roman_conquest.27.a:0 "Gades has everything we require."
 roman_conquest.28.desc:0 "We have struck into Ilergetii and Vasconii territories, lively people who straddle the Hebrus river and mountains of Pyrene, opening novel routes to Gaul and securing some of the most fertile tracts in Hispania. "
 roman_conquest.30.desc:0 "We have secured the harbours of southern Iberia, this area is rich in iron and other base metals, and should be able to provide our legions with excellent equipment when developed."
 roman_conquest.30.a:0 "Tartessus has a wonderful harbour."
 roman_conquest.30.c:0 "Ossonoba's harbour could become important."
 roman_conquest.31.desc:0 "We have smashed the hardy Lusitanian tribes, securing the west coast and Tagus estuary. This area boasts great mineral affluence, a robust presence here will ensure a steady supply of gold to our treasury."
 roman_conquest.32.a:0 "Brigensium has fine northern harbour."
 roman_conquest.34.a:0 "Tingi has everything we require."
 roman_conquest.70.desc:0 "The Alpes are a vital natural barrier, protecting Italia and Roma from the barbarians hordes that roam the misty wastes of Germania. Holding these passes must be a priority, though the territory is generally poor."
 roman_conquest.72.desc:0 "We have successfully pushed out of Narbonensis and secured a foothold in western Gaul, we must ensure we maintain a robust hold on the territory that we might follow up on our victories."
 roman_conquest.73.desc:0 "With the tribes of Helvetia laid low, we have place the hardest ground behind us. Ahead lie the plains and forests of central Gaul, ripe for the taking."
 roman_conquest.73.c:0 "We must be audacious, and establish at Vesontio."
 roman_conquest.74.desc:0 "We have secured a robust position in Gaul, pushing to the centre of the barbarian territories and taking their most important settlements and sacred sites. It will not be long now before all of Gaul bows to Roma."
 roman_conquest.75.desc:0 "After long and bloody struggles we have secured the western banks of the mighty Rhenus river, a natural frontier which seperates the Gauls from the wilds of Germania. We must hold this barrier at all costs."
 roman_conquest.76.desc:0 "Gaul is rich and the people hardy, it could become a hub of production and agriculture, exporting slaves across our territories. On the other hand, spreading Roman values and loyalty would cement our hold on their hears and minds."
 roman_conquest.76.b:0 "We must develop Gallia into a metropolitan centre."
