l_english:
 NORMAL_WAR_NAME:0 "$NUM$$ORDER$ $FIRST$-$SECOND$ Armed conflict"
 AGRESSION_WAR_NAME:0 "$NUM$$ORDER$ Armed conflict of $FIRST$ Aggression"
 desc_judaism:0 "Unusually amongst contemporary faiths, Judaism is a monotheistic religion. Following a series of prophets and teachers, the Jewish sacred book, the Torah, contains the details of a covenant created between God and the children of Israel."
 desc_zoroaster:1 "The prophet Zoroaster taught of a faith in the Creator-God Ahura Mazda and his adversary Ahriman. Evolving out of early Indo-Iranian polytheism, great reverence is shown for the 'eternal statute', or, Daena, which espouses good and righteous conduct."
 desc_berber_religion:0 "The ancient culture and religion was a melting pot of traditional Egyptian beliefs, star-worship, and ancestor veneration. Many megaliths - stone constructs raised in honour of the gods - still exist, dotted about the African landscape."
 desc_indo_iranian_religion:0 "Originating in Scythian territories, this pantheistic faith worshiped seven principal gods, often equated to those of the Greek pantheon. Elements of the earlier polytheistic folk religion of the scythians still remains, as does the practice of horse sacrifice and chariot burials, similar to those of the Celts."
 desc_caucasian_religion:0 "Possibly connected to the adjacent Anatolian religions, the pantheon of the Caucasian-Iberia region was ruled over by the god Armaz."
 desc_mesopotamian_religion:0 "The history of the Chaldean pantheon stretches back many thousands of years. Worshipping gods such as Anu, Enki and Nanna, the devotees of the Chaldean religion construct imposing temples in honour of their chosen God."
 stoneDESC:0 "Whereas wood will often suffice as a structure material for temporary or cheap structures, only stone can yield the kind of permanence desired in a fine civic structure or enduring defensive bastion."
 fishDESC:0 "Fish provide a staple part of the diet and economy of every coastal civilisation in the world."
 elephantsDESC:1 "Like many beasts of burden, elephants have been used for agricultural, religious and military purposes since their domestication. Many civilisations regard the elephant as a sacred or revered creature."
 earthwareDESC:0 "The production of earthenware has been a defining activity of human civilisation since the discovery of fire. Earthenware encompasses practical utensils such as bowls and jugs, as well as statues, urns and other decorative items."
 furDESC:0 "Furs have been used since time immemorial to shield humans from the biting cold. Ranging from stitched rabbit skins to great bear hides, a good fur can be place to any number of uses."
 papyrusDESC:0 "Most of the civilised world uses wax tablets, etchings, and stone carvings to store the written word. Papyrus, however, which is uniquely produced in the Egyptian region, offers much greater ease of access and use."
