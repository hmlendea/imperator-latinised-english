l_english:
 desc_vandalized_work_modifier:0 "One of the monuments of our nation have been defaced and vandalised, leaving the people dispirited and questioning our capacity to rule."
 desc_great_work_celebration:0 "There is an on-going celebration to a magnificent monument that has been raised in this area, inspiring the populace at large."
 desc_great_work_no_celebration:0 "The people of this area are displeased and questioning our entitlement to rule."
 desc_great_work_completed_great:0 "A truly magnificent monument has concluded its construction nearby, leaving the local populace in awe."
 desc_great_work_small_renovation:0 "We have set aside some resources to assist the locals in renovating a monument in the territory."
 great_work_dirty:1 "Soiled Monument"
 desc_happy_gw_province:0 "This territory has seen an unexpected economic advantage after we raised a monument adjacent."
 desc_praise_the_animals:0 "Our augurs have declared that recurring animal sightings by one of our monuments is evidence that we have been sanctified by the divine."
 desc_embrace_great_works_religion:0 "We set aside funds to assist a local faith that sprung up around one of our more impressive monuments."
 desc_great_work_more_guards:0 "We have stationed more guards encircling a local monument to make sure that nobody will vandalize or ruin it."
