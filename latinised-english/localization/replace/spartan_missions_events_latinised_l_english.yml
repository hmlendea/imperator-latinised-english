l_english:
 me_spartan_01_laconia.1.desc:0 "The inferior people of Laconia, who have done most of the labour on our farms and in our fields because time immemorial, have a history of being a thorn in our side and trying to upend the social order. After Messenia was forcibly taken from us, these slaves seems to have gotten the misconception that they are somehow our equals, and have proven to be even more difficult to deal with after we recaptured our ancient territories.\n\nWith the menace of rebellion at hand, our people require to look for a solution to the issue that we struggled with for so long."
 me_spartan_01_laconia.2.desc:0 "The way to treat the Helots in Sparta have been discussed at length, and our advisors have ended up divide in two different groups. One is advocating for a more gentle approach to the farmhands, so they can labour without the fear of death or mistreatment.\n\nThe other group thinks even bringing up the Helots suffering is the kind of privilege that makes them hunger for independence in the first place, and that we should make sure any rebellious elements are permanently removed."
 me_spartan_01_laconia.2.b:0 "The privileges of the past encouraged liberty."
 me_spartan_01_laconia.3.desc:0 "Though originally the part of Sparta, Messenia was forcibly taken by the warlord Epaminondas of Thebes, who founded a novel city to attempt to hinder our development.\n\nWith our recapture of the territory and expansion of the local infrastructure, we have turned his ill intentions into a powerful boon for the future of our nation."
 me_spartan_01_laconia.5.desc:0 "The reconstruction of our capital city is the first step in the second rise of Sparta. Though we care little for foreigners finding the city wanting, it is quintessential that it provides the tools we require to restore our great nation once again."
 me_spartan_01_laconia.6.desc:0 "If we are to expand our might beyond the borders of Laconia, we will require soldiers who are well fed and ready to fight our enemies. Though we were hard pressed for food when the Thebans conquered Messenia and released the Helots, we have learned to make the most out of what we have."
 me_spartan_01_laconia.6.a:0 "The territory will provide for our men and women."
 me_spartan_01_laconia.7.desc:0 "The Skiritai were once a people loyal to the Spartan cause, living in the barren hills and mountains in northern Laconia and southern Arkadia, but after our defeat at Theban hands they have chosen to stay out of our conflicts.\n\nThough rural and more akin to our Arkadian neighbours, the Skiritai were valiant warriors and an important pillar of our army. Having them return to us would prove a valuable boon."
 me_spartan_01_laconia.8.desc:0 "After several rounds of discussions, the Skiritai have accepted our deal, and will once again honour the ancient arrangements between our two peoples. Their expertise has been sorely needed, and we hope they will be as useful and loyal as they once were."
 me_spartan_01_laconia.9.desc:0 "Though our nation has faltered under menaces from foreign nations several times these last years, we are slowly restoring Sparta to its former glory. No longer will the Thebans, Macedonians, nor Athenians hinder our rightful rule of Laconia."
 me_spartan_01_laconia.10.desc:0 "The men of Sparta have been raised as warriors because the time of our grandfather's grandfathers, protecting our nation from foreign menaces and bringing us honour on the battlefield. Now a novel generation of Spartans will have to rise to the occasion, as our nation is assailed from every side."
 me_spartan_01_laconia.11.a:0 "Hopefully this will place an end to their rebellious nature."
 me_spartan_01_laconia.12.desc:0 "The Helots have been thoroughly punished for their transgressions, and we have made sure their wishes for independence have been place to an end. We have set aside a group of young soldiers to guard them, and make sure that we will not see another revolt as soon as we turn our gaze to foreign territories."
 me_spartan_01_laconia.13.desc:0 "We have been approached by a local hero of Laconia who is known for his expertise at sea, [new_admiral_scope.GetName]. As our navy is growing, we are going to find good use of his skills.\n\nSparta has often been seen as a landlocked nation, despite our proximity to the sea. It is time to place an end to that myth."
 me_spartan_01_laconia.14.desc:0 "Cynuria has long been a battleground between Argive and Lacedaemonian interests, both feeling that the people and rich territories should be under their rule.\n\nThe Macedonians tried to take the area from us and hand it over to our northern neighbours, but it is now once again under Spartan rule. With the latest fortifications, we have ensured that it will stay that way."
 me_spartan_01_laconia.15.desc:0 "Messenia have been an essential part of Sparta because time immemorial, until the Thebans under the rule of the warlord Epaminondas invaded our territories and forced their independence on us.\n\nSince the city of Messene was founded, it has stood as an affront to Spartan interests, a pathetic attempt at a counterbalance to stop us from rising to power once more."
 me_spartan_01_laconia.17.desc:0 "Messenia has finally returned to the fold, and become part of Laconia proper once more. The arrogant Helots have been place in their place and we can celebrate with the knowledge that the gods sung of our victory from the very commence, proving our cause was a just one."
 me_spartan_01_laconia.18.desc:0 "With our conquest of Lepreon, we have secured Triphylia and the path to Olympia. With the territory under our rule we can ascertain the menace of the Eleans, and control the route from Arcadia and Messenia to the north."
 me_spartan_01_laconia.19.desc:0 "The worship of Artemis Orthia has been an important part of Spartan religious life because the city itself was founded, in times of ancient past. With the restoration of her beautiful sanctuary, we will once again celebrate the owed festivals in her domain."
 me_spartan_01_laconia.20.desc:0 "Sparta has once again reunited with their rightful subjects, and hold all of the territory in Laconia. Sparta was once the hegemon of the Peloponnesian League and Greece, and we aim to achieve that once again."
 me_spartan_01_laconia.21.desc:0 "Despite the troubles of the last century with the appearance of dangerous foreign menaces like Thebes and Macedon, the loss of many of our local subjects, and the independence of Messenia, we have once again risen to prominence. With Laconia thoroughly in our control, and our ancient friends and subjects once again loyal, we commence looking outwards from our local region and towards distant territories.\n\nBe it Athens, Thebes, the Diadochi or any other menace, they will not be able to stand in our way as we look to the future."
 me_spartan_01_laconia.21.a:0 "It is time for Sparta to take the centre stage in regional politics again."
 me_spartan_01_laconia.22.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], the [SCOPE.GetRootScope.GetCountry.GetRulerTitle] of [SCOPE.GetRootScope.GetCountry.GetName], has called for all Lacedaemonians to prepare for a long and arduous campaign to restore the [SCOPE.GetRootScope.GetCountry.GetName] of ancient.\n\nWe have been ravaged by the Thebans, ignored by the Macedonians, and ridiculed by the Diadochi. It is time to place an end to the limits imposed on [SCOPE.GetRootScope.GetCountry.GetName] by others, and once again rise to the position we deserve: the defender of Greece."
 me_spartan_01_laconia.23.desc:0 "As we are negotiating with the Skiritai to return as one of our allies, a minor group of younger Skiritai have abandoned their home to seek us out and request for independent employment in our armies. It seems they feel their clan has been a bit too insular, and not given them enough chances to leave their homes."
 me_spartan_01_laconia.24.t:0 "The Ancient Commander"
 me_spartan_01_laconia.24.a:0 "We are honoured by your offer, [old_commander_scope.GetPraenomen]."
 me_spartan_02_peloponnesus.1.desc:0 "The great temple of Zeus, as well as the athletic festival in his honour, have long been under the thumb of Elean barbarians or one of their suzerains. It is an affront to the deity, as well as to the Greek world at large, that the festival and temple is not under the rulership of someone of true Greek stock. An affront we should place an end to."
 me_spartan_02_peloponnesus.1.a:0 "It is a well known fact that Zeus favours Sparta."
 me_spartan_02_peloponnesus.2.desc:0 "We have received word from the people of [GetProvince('(int32)439').GetName]. Though they are not outright asking us to free them from their current suzerains, we can glean from their latest messenger that it is in fact what they want us to do."
 me_spartan_02_peloponnesus.2.a:0 "If the omens are favouring a Spartan intervention, then we will acquiesce."
 me_spartan_02_peloponnesus.3.desc:0 "As the gods have commanded and our priests have foreseen, we have safely secured the region around [GetProvince('(int32)439').GetName]. Though we have liberated the area from barbarian suzerains, the people seem surprisingly timid about our annexation."
 me_spartan_02_peloponnesus.3.a:0 "They will adjust to the novel rulership in time."
 me_spartan_02_peloponnesus.4.desc:0 "The Olympians plead with us to rule themselves, and apparently have seen signs from the divine that it is the will of the gods. As they are novel to the shackles of our rule, we have promised them safety for now, until things have settled down. It will be an alliance that benefits both of our nations."
 me_spartan_02_peloponnesus.5.desc:0 "The Argives are known for their duplicity, and their tendency to hide behind religious holidays and festivals whenever someone threatens their city. Though we would not dare to insult one of the gods, it is clear the Argives stoop to childish deception to stop our armies from invading their territories.\n\nWe have hatched a plan to request for divine favour from the theocracy in Olympia as well as the oracle in Delphi, leaving the Argive lies hollow and pointless."
 me_spartan_02_peloponnesus.6.t:0 "Favourable Signs from Olympia"
 me_spartan_02_peloponnesus.6.desc:0 "Our first messenger has returned from Olympia, bearing good news. It seems the local priests tire of the Argive lies and irreligious attitude, and have found favourable omens for our claim to the territory. We have tasked the messengers to bring the news to the oracle in Delphi as well, to pressure her into returning the omens we are looking for."
 me_spartan_02_peloponnesus.6.a.tt:0 "With the favourable news from Olympia, we are only waiting for a response from Delphi now."
 me_spartan_02_peloponnesus.7.desc:0 "The oracle of Delphi has clearly stated that the Argive lies have breached all kinds of religious traditions, and support the rulings of Olympia. No longer will the people of Argos claim protection as we approach their territories. With divine favour at our side, we prepare to stoke the flames of conflict."
 me_spartan_02_peloponnesus.8.desc:0 "The Argives are struggling to accept us as their novel rulers. As opposing powers and rivals for centuries, the people of Argos have grown to dislike Lacedaemonians and what we bring. However, their duplicity and irreligious behaviour is at an end; they will have to bend to our will, one way or another."
 me_spartan_02_peloponnesus.9.desc:0 "The Arcadians have long posed a menace to our north, most recently with the founding of the surprisingly urban centre of Megalopolis. Subduing the most urban areas of Arcadia would let us safely focus on matters elsewhere, without worrying about potential raids from our ancient neighbours."
 me_spartan_02_peloponnesus.9.a.tt:0 "We will dispatch our scouts to chart the Arcadian valley."
 me_spartan_02_peloponnesus.10.desc:0 "As our scouts return from Arcadia, they bring information about the valley as well as news about the Arcadians. It seems the Arcadians have started preparing their troops, and might pose a menace to Sparta, though it is unclear what their goals are."
 me_spartan_02_peloponnesus.11.desc:0 "As we have taken control of Arcadia and its many urban centres and villages, it is abundantly clear we are better served by leaving them to govern themselves. It seems they are pleased with our agreement, knowing that as long as they stay loyal to our cause we will leave them alone."
 me_spartan_02_peloponnesus.12.desc:0 "Though Argos was once a robust adversary, fighting us for dominance of the Peloponnesus, we have conquered the city and focused our efforts on rebuilding the infrastructure so it can be a powerful boon to our nation. To our surprise, the Argives seem quite pleased with our effort, and have become more appreciative of our rule."
 me_spartan_02_peloponnesus.13.desc:0 "The great Asklepeion in Epidauros is known far and wide for its healers, who are said to even bring patients back from the brink of death. Donating to their cause will surely improve our standing with the deity, and might prove beneficial if we are ever in require of their assistance."
 me_spartan_02_peloponnesus.14.desc:0 "The region of Achaea has long been the home of a group of independent urban centres who have mostly stayed away from the regional politics of the rest of the peninsula. Under our rule they will continue to grow, and guard the straits to Aetolia, Boeotia, and Phocis."
 me_spartan_02_peloponnesus.15.desc:0 "Arcadia is known for its rural population and lack of major urban centres when compared to most other places in Greece. With a lot of labour, [arcadia_urban_center_province.GetName] is now a novel major city of Greece, well known far and wide. Our people and officers living in the city will provide us with control over the rest of Arcadia."
 me_spartan_02_peloponnesus.16.desc:0 "The acropolis of [GetProvince('(int32)418').GetName] is known as one of the most impressive fortifications in the region, guarding the strait between the Peloponnesus and the rest of Greece. Controlling the city and its acropolis will reinforce our local rule and protect the rest of the peninsula from anyone trying to approach. Under our leadership the acropolis will be expanded upon, and restored to its former glory."
 me_spartan_02_peloponnesus.17.desc:0 "Though badly treated by the Eleans, we have seen the region grow prosperously because annexing it, and the people living there flourish. With the area thriving, we have grown closer to the priesthood around the temple of Zeus, who seem to deeply appreciate our rule compared to that of their previous suzerains."
 me_spartan_02_peloponnesus.17.a:0 "We are honoured by their compliments."
 me_spartan_02_peloponnesus.19.desc:0 "Even after subjugating our Arcadian neighbours, we are still struggling to deal with the infrastructure of the region. We have finally been able to set up some elementary administration across the valley, yet we have to lean on the ancient rulership and let the Arcadians act relatively independently."
 me_spartan_02_peloponnesus.22.desc:0 "We have finally achieved our goal of becoming the hegemon of all of the Peloponnesus, after a defeating each of our ancient rivals. With our local adversaries crushed and subjugated, we must commence looking past our borders at the dangers that may surface. There are those who are jealous of our quick rise to power, and the affluence of the Peloponnesus is sure to attract attention as well."
 me_spartan_02_peloponnesus.23.desc:0 "Though we have been loyal subjects of [mission_country_scope.GetName], it seems they do not trust us entirely, as they have forced [mission_country_scope.GetAdjective] guards on us to oversee our territories, many of them taken from our young men. An unpopular move among the rulership, but our people do not seem to mind too much."
 me_spartan_02_peloponnesus.24.desc:0 "It seems the Spartans believe in us, as they have decided to give us fairly free ties to them, and let us mostly govern our own territories. One of their messengers told us that they comprehend we know the territories of Arcadia better than they do, and would prefer if we continued to rule the territories in their name."
 me_spartan_02_peloponnesus.25.desc:0 "The leadership in [mission_country_scope.GetName] has chosen to release the area around Olympia to rule itself under the priests of the temple of Zeus. As the theocracy in Olympia is getting accustomed to their novel tasks, their ancient suzerain is occupied portraying itself as the protector of Greek faith and culture."
 me_spartan_03_peloponnesian_league.1.desc:0 "As we have taken control of all of the most important urban centres and locations in the Peloponnesus, our people have started talking about resurrecting the ancient Peloponnesian League that was dismantled after the conflicts with Athens. Back then, a large part of the peninsula was under our influence, either directly or through a subject of ours, and our people are making comparisons now that we are a hegemon once more."
 me_spartan_03_peloponnesian_league.2.desc:0 "Even though we are starting to resemble the Sparta of ancient, we still have to establish the diplomatic side of things before we can truly restore the Peloponnesian League. The first step is to gather all the subjects and city-states so we can come to an agreement about our future plans."
 me_spartan_03_peloponnesian_league.2.a.tt:0 "We will invite all city-states and subjects under our rule to [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] to ratify an agreement so we can commence the restoration of the Peloponnesian League."
 me_spartan_03_peloponnesian_league.3.desc:0 "As they have continued to expand their influence across the Peloponnesian peninsula, the Spartans have started to look back at their time as hegemons of the Peloponnesian League.\n\nIt seems they are ambitiously trying to restore the league, as they have sent out messengers to all those under their influence to dispatch envoys to [mission_country.GetCapital.GetName]. Our presence is expected."
 me_spartan_03_peloponnesian_league.3.a.tt:0 "We will dispatch an envoy to hear the Spartans out."
 me_spartan_03_peloponnesian_league.4.desc:0 "An envoy from [subject_scope.GetName] has reached the gates of [ROOT.GetCountry.GetCapital.GetName], and it is customary to hand them some arrange of gift for their troubles. An awkward silence passes through the crowd, as everyone waits for [ROOT.GetCountry.GetRuler.GetPraenomen] to make up [ROOT.GetCountry.GetRuler.GetHerHis] mind on what to give [ROOT.GetCountry.GetRuler.GetHerHis] loyal subject."
 me_spartan_03_peloponnesian_league.4.c:0 "What? Is the honour of visiting [ROOT.GetCountry.GetCapital.GetName] not enough for them?"
 me_spartan_03_peloponnesian_league.5.desc:0 "Our envoys return with news that they were well treated upon reaching [mission_country.GetCapital.GetName], and received a large shipment of silver to bring back to [ROOT.GetCountry.GetCapital.GetName]. [mission_country.GetName] clearly has a vested interest in trying to improve their relations with our nation, a robust bond that will maintain both of us safe in the future."
 me_spartan_03_peloponnesian_league.6.desc:0 "Our envoys return with news that they have been mostly ignored because they reached the gates of [mission_country.GetCapital.GetName]. When they arrived they were handed some minor tokens as gifts, but then packed away in some of the worse to wear areas of the city."
 me_spartan_03_peloponnesian_league.7.desc:0 "Our envoys return with news that they have been mistreated because they reached the gates of [mission_country.GetCapital.GetName]. When they arrived they were, unlike most other envoys, not given any gifts nor assistance, and had to find shelter for themselves."
 me_spartan_03_peloponnesian_league.8.desc:0 "As we continue the preparations for the agreement to be signed and agreed to by all our subjects and allies, an envoy from [subject_city_state_scope.GetName] approaches us with a minor gift. He informs us that his home sends their best wishes, and hope that we can return the favour by easing up on some of the requirements they have met from our overseers lately."
 me_spartan_03_peloponnesian_league.8.a:0 "He assuredly makes a good argument."
 me_spartan_03_peloponnesian_league.9.desc:0 "After a lot of political manoeuvring and negotiations, we have finally managed to force or convince all of our subject urban centres and vassals into accepting the agreement.\n\nAs they are now all officially willing to become members of a novel Peloponnesian League, we have to go through the restoration of the ancient infrastructure of the league and make sure it can be a robust entity that will not fall to foreign might."
 me_spartan_03_peloponnesian_league.10.desc:0 "Though [mission_country.GetName] has a reputation for being somewhat diplomatically inept, they have shown surprising aptitude for forcing all their subjects into agreeing to become members of a novel Peloponnesian League.\n\nBy the time the diplomatic meeting has concluded, every single envoy has signed the pact to take part in the novel league, and the rise of [mission_country.GetName] reflects its influence before the previous league was shattered by Thebes."
 me_spartan_03_peloponnesian_league.11.desc:0 "To ensure our control over all the minor villages and city-states scattered across the hills of the Peloponnesus, we have place a lot of labour into setting up major urban centres that will inspire their neighbours and function as rallying points for them to flock to."
 me_spartan_03_peloponnesian_league.11.a:0 "Let us hope they inspire confidence in their smaller neighbours."
 me_spartan_03_peloponnesian_league.12.desc:0 "As we have focused our efforts on expanding the military surrounding the novel league, we have seen a rise of young volunteers willing and able to fill the roles we require. In particular, a young mastermind named [new_commander_scope.GetName] has impressed all our older officers with his tactics and ideas."
 me_spartan_03_peloponnesian_league.13.desc:0 "With newfound strength and an expanded zone of influence, novel menaces and challenges arise that we require to see to. With a novel league set up to control the Peloponnesus, we have a large sea-zone that requirements protection, and have looked to improve our naval capabilities so we can respond to any potential seaborne menaces."
 me_spartan_03_peloponnesian_league.13.a:0 "One minor step for the league, one giant leap for [ROOT.GetCountry.GetName]."
 me_spartan_03_peloponnesian_league.14.desc:0 "We have a long history of revolts and rebellions racking our homeland at the worst of times, leaving us destitute and weakened. With our recent changes, it seems we have finally secured our homeland and place an end to this misfortune, be it from slaves, helots, or other problematic elements in our society."
 me_spartan_03_peloponnesian_league.15.desc:0 "There are several rich and valuable urban centres on the Peloponnesus, with histories stretching back to time immemorial and founders born from the gods themselves. They play important roles as urban centres and political centres for their minor neighbours, and seem like the perfect choices for our infrastructure efforts."
 me_spartan_03_peloponnesian_league.15.a:0 "They will be the pillars upon which we construct this league."
 me_spartan_03_peloponnesian_league.16.desc:0 "Argos and Corinth were once among of our greatest rivals, regional hegemons and powerful city-states. Now we are using their legacy to utilise these urban centres as stewards of their local regions, and focusing our efforts on improving these urban centres."
 me_spartan_03_peloponnesian_league.17.desc:0 "The western side of the Peloponnesus has long been the home of barbarians, rural city-states, and the helots. Despite their pathetic nature, they have managed to form powerful and worthwhile city-states of some fame, which we have now focused our structure efforts on."
 me_spartan_03_peloponnesian_league.18.desc:0 "No longer are the great urban centres of the Peloponnesus simply the largest of their regional neighbours, but they have become well known centres in their own right, even far beyond our borders. Like Alexandria in distant Egypt, or Babylon in ancient Mesopotamia, people in faraway territories now talk about our great urban centres."
 me_spartan_03_peloponnesian_league.19.a.tt:0 "We will commence preparing our soldiers for the upcoming conflict versus the Macedonian menace."
 me_spartan_03_peloponnesian_league.20.desc:0 "Some question our willingness to fight the Macedonians, masters of warfare and conquerors of the Persian Empire. The Macedonians claim Greek heritage, but we all know those are but deceptions to force upon others their barbarian ways.\n\nWe defended Greece versus Persian menaces and Athenian ambition, why would we stop here?"
 me_spartan_03_peloponnesian_league.20.a:0 "Nothing is impossible for those who will attempt."
 me_spartan_03_peloponnesian_league.21.desc:0 "Finally Greece has been liberated from foreign occupation and annexation, from barbarian warlords and ambitious politicians. No longer will the Greeks suffer foreign intervention in our politics."
 me_spartan_03_peloponnesian_league.21.a:0 "The erroneous has been righted."
 me_spartan_03_peloponnesian_league.22.desc:0 "After years of hard labour, we have finally taken all the steps necessary to restore the ancient Peloponnesian League. Its destruction at the hands of others led to the rise of Thebes and Macedonia, and decades of their terrible rule, but no more.\n\nThe Peloponnesian League has finally returned to right the wrongs of the past."
 me_spartan_03_peloponnesian_league.23.desc:0 "The long Spartan campaign to restore the Peloponnesian League has finally ended, as [ROOT.GetCountry.GetRuler.GetName] holds a speech in front of our subjects and allies about the restoration of the Second Peloponnesian League.\n\nAs the hegemon of Greeks everywhere, we now look to what menaces we might face. It is our duty to protect our homeland and people, even if that means foreign campaigns to quell the barbarians, successor kingdoms, or ambitious Italics invading Magna Graecia."
 me_spartan_04_rivals.2.desc:0 "As we prepare our soldiers for a final confrontation with the remains of Athens, a once great rival, we dispatch a messenger to the Oracle of Delphi to request for her blessing in this endeavour."
 me_spartan_04_rivals.2.a.tt:0 "We will request for the Oracle's blessing in our endeavour to conquer Athens."
 me_spartan_04_rivals.3.desc:0 "Our messenger to the Oracle has finally returned home to Sparta, bringing good news. Though she would not outright bless our endeavour, it was clear she did not oppose our plans to campaign versus Athens either."
 me_spartan_04_rivals.4.desc:0 "As we take the long walls between Athens and Piraeus, the garrison flee back to the city, to little effect. The long walls are leveled once and for all, and the city has been place under the control of a Spartan commander."
 me_spartan_04_rivals.5.desc:0 "We have made significant improvements to the ancient capital of the Athenians, as it was left destitute when we conquered it. It is now starting to look like the impressive city of ancient, and the people have flocked to the city as well as its rural countryside."
 me_spartan_04_rivals.6.desc:0 "Every suzerain who has subjugated Athens has struggled to maintain it under control, as the Athenians are known for their stubborn independent mindset. With the establishment of a large Spartan garrison in the city, we hope to squash any such hopes before they can become problematic."
 me_spartan_04_rivals.6.a:0 "The Athenians only comprehend might."
 me_spartan_04_rivals.7.desc:0 "The Athenians have for centuries travelled to Eleusis to take part in the mysteries surrounding Demeter and her daughter Kore. After offering up charitable donations to the mystery cult, we have finally been permitted to take part in these rites."
 me_spartan_04_rivals.8.desc:0 "We have received messengers from [new_thessaly_country.GetCapital.GetName], the first of the many liberated Thessalian urban centres. Finally the Thessalians will stand up to the Macedonians, like the rest of us, and place an end to barbarian domination of Greek territories."
 me_spartan_04_rivals.9.desc:0 "In our conflicts with [mission_country.GetName], it seems they have managed to convince the urban centres and people of Thessaly to revolt versus our rule.\n\nSince the time of Philip II, Thessaly has been an important part of our kingdom, and if we do not make an example out of these Thessalian urban centres, it might inspire more urban centres under our rule to follow suit."
 me_spartan_04_rivals.9.a:0 "We is unable to afford to fight more conflicts, right now."
 me_spartan_04_rivals.10.desc:0 "Thebes used to be one of our primary rivals, and the ones who dismantled the Peloponnesian League after our defeat at Leuktra. Despite our longtime rivalry, we will treat the city with the care and respect it deserves, as it can play an important role as our political centre for controlling Boeotia and Phocis."
 me_spartan_04_rivals.12.desc:0 "The first temple to receive our donation is the impressive temple to $omen_dionysus$ Lysios in Thebes. Though the wild deity has often been the victim of abject criticism and tendency to chaos, the beautiful temple and willing priesthood stands as a proof that is not invariably the case. Our donations are received with grace, as we leave the temple and prepare our journey to Orchomenos."
 me_spartan_04_rivals.13.desc:0 "Greatest in Orchomenos is the grand temple to the Graces. Beautiful works of art fills the main room, as if the Boeotians tried to supersede the very things they worship, or maybe they were just blessed by the Graces as they created the statues in their honour."
 me_spartan_04_rivals.15.desc:0 "Our final destination is the temple to Themis in Tanagra, at the eastern edge of ancient Boeotia. She is a minor deity devoted to divine order and statute, and in many ways a deity that would fit our own society.\n\nThough less impressive than some of the other sanctuaries we have seen recently, the city houses several noteworthy temples."
 me_spartan_04_rivals.16.desc:0 "Under our auspicious leadership, we have finally managed to secure our control over Thebes and Boeotia once and for all. It will be at the centre of our campaigns to the north, be it versus the Thessalians, Phocians, or Macedonians."
 me_spartan_04_rivals.17.desc:0 "The Macedonians have posed a menace to Greece for ages, because the rise of Philip II and his Corinthian League. If we are to maintain Greece free from Macedonian ambition, we require to place an end to their monarchy once and for all."
 me_spartan_04_rivals.19.desc:0 "Though they were not originally susceptible or agreeable to our rule, they have slowly learned to adjust to it. Though their uncivilized ways have been difficult to govern, but they are finally becoming more akin to proper Greeks, and may serve as a proper bulwark versus the barbarians at their borders."
