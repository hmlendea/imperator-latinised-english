l_english:
 me_syracuse_1_democracy_BUTTON_TOOLTIP:0 "It is time to resurrect back the republic of ancient."
 me_syracuse_1_democracy_DESCRIPTION:0 "Before the tyrants foisted themselves upon our great city and deformed it with their mercenary barracks, opulent palaces, and ruinous conflicts, it was the seat of a proud oligarchic republic for hundreds of years. There are still those who yearn to oust the tyrants and deliver our people from the whims of robust men."
 demo_leader_eligible_tooltip:0 "There is a free adult character who is NOT: of the ruling family, a friend or spouse of the tyrant, a foreigner, or limited by gender statutes."
 me_syr_new_tyrant_tt:0 "A novel tyrant has taken power."
 syracuse_1_2_mercenary_motives_DESC:0 "Because Gelon, the tyrants have made use of Italic mercenaries with no loyalty to the city's people. These hired thugs form the base of tyrannical power - and thus perhaps may be the key to undermining it."
 syracuse_1_3_greek_help_DESC:0 "Timoleon, the tragic fratricidal general, overthrew Dionysios, drafted wise republican statutes, and routed a Carthaginian army despite terrifying odds - but only because brave citizens sailed to Korinthos with a plea for assistance."
 syracuse_1_3_reward_tt:0 "Greek support for a #Y civil conflict#!."
 syracuse_1_4_deal_with_devil_DESC:0 "Syracuse has invariably been at odds with other powers seeking to claim to riches of Sicily, from the cocky Athenians to astute Carthage. There may be those willing to aid the cause of liberty - for a price."
 syracuse_1_4_reward_tt:0 "Foreign support for a #Y civil conflict#!."
 syracuse_1_7_assassinate_DESC:0 "Dionysius was most wise when he showed Damokles' just how fraught a life a king leads. By approaching those closest to the throne, we may fulfil the brutal praxis of his lesson."
 syracuse_1_8_civil_war_DESC:0 "The line of Dionysius clung to power like limpets on their island fortress, and were only cast out at the tip of a spear. With the right support, we can follow in the footsteps of Timoleon and win our liberty with honour."
 syracuse_1_8_reward_tt:0 "A #Y civil conflict#! will commence to oust the tyrant."
 syracuse_1_9_taking_stock_DESC:0 "With the hardest part behind us, we must be vigilant to ensure that our nascent republic is not smothered in its crib. Many are those who would be attempt to be kings - we few must ensure they can never don the crown."
 syracuse_1_9_reward_tt:0 "Any loose ends from the #Y civil conflict#! or #Y coup#! will be tied up."
 me_syracuse_2_sicily_DESCRIPTION:0 "Times are changing fast; the Diadochi scrap over the remains of Alexander's empire in the east; the Punic barbarians greedily eye our island seeking to avenge our failed invasion of Africa in the west, and Italic republics grow stronger by the day in the north - we must ensure our survival by completing the labour of Agathokles and uniting the Siceliotes."
 me_syracuse_2_sicily_REWARD_DESCRIPTION:0 "The development of the city of Syrakousai and integration of her Siceliote neighbours."
 syracuse_2_2_DESC:0 "Italic mercenaries have long made up for the glut of citizen soldiers in the colonial urban centres of Sicily. This tradition must continue if we are to match our enemies in manpower."
 syracuse_2_3_DESC:0 "Destroyed by Timoleon to discourage tyrants, rebuilding the defences of Ortygia is crucial - we must make the island formidable for any who wish to attack the capital by territory."
 syracuse_2_4_DESC:0 "One of our oldest rivals for leadership of the Siceliotes, Akragas must submit to our command and place its affluence at our disposal."
 syracuse_2_6_DESC:0 "Expanding into central Sicily gives us access to abundantly fertile territory, where some of best grain in the Mediterranean is grown. We should make the most of this opportunity."
 syracuse_2_6_allow_tt:1 "[me_syracuse_scope.GetName] owns at least #Y 3#! territories which produce Grain @grain! and have a #Y Farming Settlement#! structure in mainland Sicily. ([SCOPE.Custom('syr_mission_2_6_custom_loc')]/#Y 3#!)"
 syracuse_2_8_DESC:1 "Civil conflicts and invasions have brought misery and destruction to our great city, it is time to clear the last vestiges of past woes and become a forward-looking centre of culture."
 syracuse_2_10_DESC:0 "Grain can do more for us than maintain the granaries stocked - fast growing urban centres across the Mediterranean will come to blows seeking to secure our fine products."
 syracuse_2_11_DESC:0 "Amidst the raging Graeco-Punic and civil conflicts of Sicily, the native Sikeloi have persevered in the interior. They must be brought to heel once and for all."
 me_syracuse_3_punic_BUTTON_TOOLTIP:0 "The interminable conflicts with Carthage must be settled once and for all."
 syracuse_3_1_DESC:0 "Because the defeat of our expedition to Africa, we have permitted our navy to decline despite continued Punic naval dominance. If we are to cut off their access we must contest them where they are strongest: on the waves."
 syracuse_3_1_allow_tt_1:0 "Has at least #Y 16#! Trireme @trireme! class Vessels ([SCOPE.Custom('syr_mission_3_1_1_custom_loc')]/#Y 16#!)"
 syracuse_3_1_allow_tt_2:0 "Has at least #Y 30#! total Vessels ([SCOPE.Custom('syr_mission_3_1_2_custom_loc')]/#Y 30#!)"
 syracuse_3_1_allow_tt_3:0 "Has at least #Y 4#! Hexere @hexere! class Vessels ([SCOPE.Custom('syr_mission_3_1_3_custom_loc')]/#Y 4#!)"
 syracuse_3_2_DESC:0 "Man's reach ever exceeds his grasp, driving him to novel ideas and ever greater feats. Alexander and his successors have changed naval warfare forever with their huge vessels and novel tactics, an example we would do well to heed."
 syracuse_3_2_allow_tt:0 "Has at least #Y 40#! total Vessels ([SCOPE.Custom('syr_mission_3_2_custom_loc')]/#Y 40#!)"
 syracuse_3_2_reward_tt:0 "Receive a naval commander and select between offensive or defensive naval tactics."
 syracuse_3_3_allow_tt:0 "Shares a frontier with Carthage or one of her subjects."
 syracuse_3_4_DESC:0 "There remain free Siceliote urban centres on the island who bow to no masters, whether Syracusan or Punic. We must persuade them that the alternative to Syracusan leadership is domination by Carthaginian or Italic foreginers."
 syracuse_3_5_DESC:0 "When Dionysios I abandoned the western urban centres he did so as a cruel tyrant, desperate to cling on to power at the expense of his fellow Greeks. Our goal is, of course, survival, but this time for all Siceliotes - they may yet see that."
 syracuse_3_6_DESC:0 "Generations ago, Dionysios I lost to the Punics at Kronion and conceded control over the Greek urban centres of Selinous, Herakleia Minoa, and Himera, to their king, Himilkas. It is time we liberated our brothers to the west."
 syracuse_3_9_DESC:0 "We will only be truly safe once the ancient Greek urban centres of Segesta and Panormos are once again in our hands, and the Punic bases of power in Lilybaion and Motye are rendered harmless. Thus will the matter be settled."
 syracuse_3_11_DESC:0 "Carthage's time in Sicily has come to an end, we must drive every last Punic soldier back into the sea and secure Sicania for the Greeks, avenging thousands of fallen brothers in the conflicts over the island."
 syracuse_3_settlers_tooltip:0 "settlers and a bonus to assimilation and pop development."
 syracuse_3_12_DESC:0 "While his original expedition was scuppered, the plan was a audacious and fruitful one until command passed to his sons. By succeeding in sieging Carthage itself, we will place an end to their arrogance."
 me_syracuse_4_magna_BUTTON_TOOLTIP:0 "The bickering Italiote urban centres must be united under our leadership if they are to survive."
 me_syracuse_4_magna_DESCRIPTION:0 "With Sicily secured, we must look across the strait of monsters to the now shabby Italiote urban centres of Magna Graecia. They have fought countless pointless conflicts for supremacy, weakening the Greek presence and allowing Italic tribes to dominate them. Under a robust leader, these urban centres could be united in a common Hellenic cause, and the Italic menace vanquished."
 syracuse_4_1_DESC:0 "The proud urban centres of Magna Graecia must unite if we are to stop the expansion of our Italic neighbours. We must attempt to persuade each of them to set aside their pride for the greater good."
 syracuse_4_1_allow_tt:0 "At least one Hellenic country in Magna Graecia:\n* Has #Y 3#! or less territories\n* Has more than #R -25#! Opinion of [me_syracuse_scope.GetName]\n* Is not allied with [me_syracuse_scope.GetName]\n* Is not at conflict with [me_syracuse_scope.GetName]."
 syracuse_4_2_DESC:0 "Because the rise of the Bruttian and Lucanian tribes, the Italiote urban centres have struggled to maintain their independence. We could approach our subjugated fellow Greeks with an offer of protection."
 syracuse_4_3_allow_tt:0 "[me_syracuse_scope.GetName] or a subject possess:\n#Y [me_syr_rhegion.GetName]#!, #Y [me_syr_lokroi.GetName]#!, and #Y [me_syr_hipponion.GetName]#!."
 syracuse_4_3_reward_tt:1 "Claims on all Italiotian urban centres in the Region of #Y $magna_graecia_region$#!."
 syracuse_4_4_DESC:0 "It has been centuries because Pythagoras of Samos founded his philosophical movement in Kroton, but his doctrine still attract many seeking sagacity, piety, or both. Encouraging learning may provide untold long term benefits."
 syracuse_4_4_reward_tt:0 "#Y [me_syr_kroton.GetName]#! will receive a bonus to study production."
 syracuse_4_6_DESC:0 "The Italiote colonies have remained coastal enclaves, surrounded by the tribesmen of the rugged interior. These tribes have supplied many mercenaries in our times of require, but it is time the arrangement was made permanent."
 syracuse_4_7:0 "The Italiote Urban centres"
 syracuse_4_7_DESC:0 "Only when we have liberated and united all the ancient centres of Hellenic civilisation and culture will Magna Graecia be safe from the Italic menace - leadership has fallen to us."
 syracuse_4_7_reward_tt:0 "The larger valid city will receive settlers and a bonus to pop development and migration attraction."
 syracuse_4_7_allow_tt:0 "[me_syracuse_scope.GetName] or a subject possess all of the following:\n#Y [me_syr_neapolis.GetName]#!, #Y [me_syr_sipious.GetName]#!, #Y [me_syr_poseidoneia.GetName]#!, #Y [me_syr_elea.GetName]#!, #Y [me_syr_herakleia.GetName]#!, #Y [me_syr_metapontion.GetName]#!, #Y [me_syr_taras.GetName]#!, #Y [me_syr_thurioi.GetName]#!, #Y [me_syr_kallipolis.GetName]#!, #Y [me_syr_kroton.GetName]#!, #Y [me_syr_hipponion.GetName]#!, #Y [me_syr_lokroi.GetName]#!, and #Y [me_syr_rhegion.GetName]#!."
 syracuse_4_8_DESC:0 "While some only wish to protect the ancient colonies of our people, others see the possibility of securing Magna Graecia as a second Hellas, with its rich urban centres and fertile territory able to compete with even Athens and Sparta."
 syracuse_4_9_DESC:0 "Between the failed invasion of Alexandros of Epirus and Athenai's abortive expedition versus us, there are many who see the potential of Magna Graecia, and may assistance protect Greek interests on the peninsula."
 syracuse_4_9_allow_tt:0 "There is a Hellenic country in diplomatic range which:\n* Has a higher rank than [me_syracuse_scope.GetName]\n* Is not allied with [me_syracuse_scope.GetName]\n* Is not at conflict with [me_syracuse_scope.GetName]\n* Has greater than #R -25#! opinion of [me_syracuse_scope.GetName]"
 syracuse_4_11_DESC:0 "The urban centres of the Tarentine gulf, Taras itself in particular, were once the most successful urban centres in Italia before their pointless conflicts. We should use them as a Greek base from which to advance north."
