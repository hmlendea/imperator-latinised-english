l_english:
 senate_objective_declare_war_optimates:0 "Declare Conflict"
 senate_objective_declare_war_optimates_DESC:0 "The $optimates_party$ are looking to commence a conflict with our neighbour, [sen_obj_dec_war_target.GetName], where they supposedly have some interests."
 senate_objective_grant_holdings_optimates_DESC:0 "The $optimates_party$ are known for their avarice, and once again they are looking to line their own pockets."
 senate_objective_change_law_optimates:1 "Pass Statute"
 senate_objective_change_law_optimates_DESC:0 "The upper echelons of society are fairly restricted, and the $optimates_party$ would like to maintain it that way. Once again they propose statute changes that would only benefit themselves."
 senate_objective_revoke_office_optimates_DESC:0 "The $optimates_party$ wants to place an end to the career of [revoke_character_optimates.GetName], as they see [revoke_character_optimates.GetHerHim] as a menace to the Republic."
 senate_objective_appoint_member_optimates_DESC:0 "The $optimates_party$ wants to place [appointment_target.GetName] into a novel office position, as they believe [appointment_target.GetSheHe] will be a valuable asset to the republic."
 senate_objective_reduce_citizenship_optimates_DESC:1 "The $optimates_party$ have grown tired of tolerating the integration of outsiders and wish to reinforce their status as a uniquely privileged elite."
 senate_objective_change_law_populares:1 "Pass Statute"
 senate_objective_change_law_populares_DESC:0 "The $populares_party$ have been convinced by yet another demagogue to seek a statute change. It is hard to say who it will benefit the most, the orator who asked for it, or the masses who follow his every whim."
 senate_objective_revoke_holdings_populares_DESC:0 "Reducing the affluence of the elite has been a recurring priority for the $populares_party$, as they seek to even out the rights and affluence of the people of our nation."
 senate_objective_grant_holdings_populares_DESC:0 "The $populares_party$ are not above seeking to line their own pockets, even they so very often criticise the so-called corrupt and rich elite who do the very identical."
 senate_objective_declare_war_populares:0 "Declare Conflict"
 senate_objective_declare_war_populares_DESC:0 "The masses change at the whims of populists and demagogues, and now they have been convinced that [sen_obj_dec_war_target.GetName] is a menace to our society and well-being."
 senate_objective_revoke_office_populares_DESC:1 "The $populares_party$ demand an end to the term of [revoke_character_populares.GetName], as they believe [revoke_character_populares.GetSheHe] is abusing [revoke_character_populares.GetHerHis] position for [revoke_character_populares.GetHerHis] possess personal gain."
 senate_objective_change_law_boni:0 "Pass Statute"
 senate_objective_change_law_boni_DESC:0 "The $boni_party$ are looking to pass a statute, a rare occurence given their admiration for our ancient traditions, seeking to find the best course for our nation's future."
 senate_objective_roman.1.t:0 "$optimates_party$ Agenda - Conflict on [sen_obj_dec_war_target.GetName]"
 senate_objective_roman.1.desc:0 "Under [optimates_party_leader.GetName], the $optimates_party$ have been pushing for a conflict versus our neighbour, [sen_obj_dec_war_target.GetName]. Despite loud protests from the other parties, [optimates_party_leader.GetPraenomen] has a majority in the [ROOT.GetCountry.Custom('get_court_type')|U]. Unless we want to ruin our relationship with the $optimates_party$, we must give in to the clamour for conflict."
 senate_objective_roman.1.b:1 "Let the $optimates_party$ howl - a conflict versus [sen_obj_dec_war_target.GetName] is a bad idea."
 senate_objective_roman.2.t:0 "$optimates_party$ Agenda - Territory for [holding_character.GetName]"
 senate_objective_roman.2.desc:0 "Enriching the elite is, once again, the agenda of the $optimates_party$. This time, they have decided to gather around the head of the [holding_character.GetFamily.GetName] family, [holding_character.GetName]. They claim that [holding_character.GetSheHe] deserves some territory as a repayment for [holding_character.GetHerHis] excellent service to the [ROOT.GetCountry.Custom('get_court_type')|U].\n\nThe $populares_party$ are loudly opposing the legislation, as it looks like it will be public territory that will given to the [holding_character.GetFamily.GetName] family."
 senate_objective_roman.2.a:0 "Not that they require it, but they have our support nonetheless."
 senate_objective_roman.2.b:0 "What is it with 'public' that the $optimates_party$ do not comprehend?"
 senate_objective_roman.3.t:0 "$optimates_party$ Agenda - A Statute for the Rich"
 senate_objective_roman.3.desc:0 "One of the recurring agendas of the $optimates_party$ is the require to pass statutes that will benefit them in one way or another, either ensuring their influence, or else making sure that they do not see more of the Novus Homo in the [ROOT.GetCountry.Custom('get_court_type')|U] than absolutely necessary. The other parties look to [ROOT.GetCountry.GetRuler.GetName] to place an end to this statute, before it makes it to vote."
 senate_objective_roman.3.a:0 "And yet this statute seems fair."
 senate_objective_roman.3.b:0 "And [ROOT.GetCountry.GetRuler.GetSheHe] will place an end to it."
 senate_objective_roman.4.t:0 "$populares_party$ Agenda - A Statute for the Masses"
 senate_objective_roman.4.desc:0 "The $populares_party$ are often taken in by some demagogue or other with ideas for what statutes to pass and what is best for the masses of [ROOT.GetCountry.GetName]. Most of the time, these statutes are for the greater good of the lower classes, but occasionally a charismatic populist manages to persuade the masses of a cause that will only benefit themselves.\n\nThe last of the many $populares_party$ to take this role is [populares_party_leader.GetName], who has now proposed statute changes to the [ROOT.GetCountry.Custom('get_court_type')|U], supported by a large majority."
 senate_objective_roman.4.b:0 "We will not let a populist decide the statutes of [ROOT.GetCountry.GetName]."
 senate_objective_roman.5.t:0 "$populares_party$ Agenda - Restoring Public Territory"
 senate_objective_roman.5.desc:0 "The $populares_party$ have often targeted the richer elements of our society, seeking to claim the affluence of the upper classes for the masses. Their most recent focus is the head of the [holding_character.GetFamily.GetName] family, [holding_character.GetName]. The [ROOT.GetCountry.Custom('get_court_type')|U] floor is abuzz with rumours and accusations of corruption, and the $populares_party$ are demanding that [holding_character.GetPraenomen] return some of their territory to its rightful owner, the Republic."
 senate_objective_roman.5.a:0 "We have invariably suspected [holding_character.GetPraenomen] of abusing [holding_character.GetHerHis] influence."
 senate_objective_roman.6.t:0 "$populares_party$ Agenda - Territory for [holding_character.GetName]"
 senate_objective_roman.6.desc:0 "Though the $populares_party$ despise the richer elements of [ROOT.GetCountry.GetPrimaryCulture.GetName] society, they are not opposed to taking some of that affluence for themselves. Latest in line is [holding_character.GetName], who has convinced the masses that [holding_character.GetSheHe] has the right to some of our public territory. Another corrupt ploy from the $populares_party$ - and one deeply opposed by the $optimates_party$ - who see potential novel rivals rise up in the [ROOT.GetCountry.Custom('get_court_type')|U]."
 senate_objective_roman.8.t:0 "$populares_party$ Agenda - Conflict on [sen_obj_dec_war_target.GetName]"
 senate_objective_roman.8.desc:0 "Lately, [sen_obj_dec_war_target.GetName] has become a hated name on the streets of [ROOT.GetCountry.GetCapital.GetName], with rumours and stories of the horrible [sen_obj_dec_war_target.GetPrimaryCulture.GetName] people spreading like wildfire. It seems the $populares_party$ has actively tried to push the slander and lies this time, and it is only confirmed when [populares_party_leader.GetName] takes centre stage and calls for conflict.\n\nA large majority has been swayed by the $populares_party$ propaganda, and requirements conflict from our [ROOT.GetCountry.GetRulerTitle]."
 senate_objective_roman.8.a:0 "A conflict on [sen_obj_dec_war_target.GetName]? If that is the will of the [ROOT.GetCountry.Custom('get_court_type')|U]."
 senate_objective_roman.9.desc:0 "The $boni_party$ have tried to raise support for a large structure project in [senate_objective_build_buildings_target.GetName], aiming to raise several buildings that will excite the masses and provide stability in the province. It is just the latest in a series of attempts by the $boni_party$ to invest in one of the urban centres in the area - one of their particular focuses as of late - and it seems [boni_party_leader.GetName] has finally managed to secure a majority of the seats in the [ROOT.GetCountry.Custom('get_court_type')|U] for [boni_party_leader.GetHerHis] cause."
 senate_objective_roman.9.b:0 "We is unable to afford a construction project in [senate_objective_build_buildings_target.GetName] right now."
 senate_objective_roman.10.desc:0 "The rich and wealthy $boni_party$ are looking to [senate_objective_state_investment_target.GetState.GetShortName] for their investments these days as they attempt to improve the general area, some say for their own interests' sake. No matter who it is for, [boni_party_leader.GetName] has managed to convince several senators to follow [boni_party_leader.GetHerHis] line on this matter, and are demanding that [ROOT.GetCountry.GetRuler.GetName] takes a personal interest in the matter."
 senate_objective_roman.12.desc:0 "A large majority of the [ROOT.GetCountry.Custom('get_court_type')|U] has gathered around [boni_party_leader.GetName] in asking for the end of the tyrannical tendencies of [ROOT.GetCountry.GetRuler.GetName], and increasing the influence of the [ROOT.GetCountry.Custom('get_court_type')|U]. A move like this will place our [ROOT.GetCountry.GetRulerTitle] in a bad light, but the upper echelons of [ROOT.GetCountry.GetPrimaryCulture.GetName] society would appreciate it."
 senate_objective_roman.12.b:0 "Time to place an end to another $boni_party$ cause."
 senate_objective_roman.13.t:0 "$boni_party$ Agenda - A Traditional Statute"
 senate_objective_roman.13.desc:0 "After a passionate speech held by [boni_party_leader.GetName], the $boni_party$ have started asking for a statute change in the [ROOT.GetCountry.Custom('get_court_type')|U]. It seems the words of [boni_party_leader.GetPraenomen] have even managed to convince several senators who usually disagree with [boni_party_leader.GetHerHim], and now a majority is willing to vote in [boni_party_leader.GetHerHis] favour on this matter."
 senate_objective_roman.13.b:0 "We simply is unable to agree with [boni_party_leader.GetPraenomen] on this matter."
 senate_objective_roman.14.t:0 "$optimates_party$ Agenda - Conclusion the Career of [revoke_character_optimates.GetName]"
 senate_objective_roman.14.desc:0 "The $optimates_party$ have spent a lot of time and resources criticizing [revoke_character_optimates.GetName] as of late, and most recently [optimates_party_leader.GetName] has proposed revoking [revoke_character_optimates.GetHerHis] office entirely. With most of the $optimates_party$ at [optimates_party_leader.GetHerHis] back, as well as other senators [optimates_party_leader.GetSheHe] has convinced, the majority of the voters will agree to dispatch [revoke_character_optimates.GetPraenomen] packing back to [ROOT.GetCountry.GetCapital.GetName]."
 senate_objective_roman.14.a:0 "Dispatch a messenger then, [optimates_party_leader.GetPraenomen]."
 senate_objective_roman.15.desc:0 "Lately the $optimates_party$ have been working to secure an office for one of their members, [appointment_target.GetName]. They have used a lot of their political clout, favours in the [ROOT.GetCountry.Custom('get_court_type')|U], and general influence to make sure that a majority of the seats will support their requirements for the promotion of [appointment_target.GetPraenomen]."
 senate_objective_roman.16.t:0 "$populares_party$ Agenda - Conclusion the Career of [revoke_character_populares.GetName]"
 senate_objective_roman.16.a:0 "Let us dispatch [revoke_character_populares.GetHerHim] a messenger then."
 senate_objective_roman.19.t:0 "$boni_party$ Agenda - Novel [citizenship_culture_target.GetName] Rights"
 senate_objective_roman.19.desc:0 "The $boni_party$, ever looking to maintain the peace of [ROOT.GetCountry.GetName], have become the champions of the [citizenship_culture_target.GetName] people in our nation. They have spent considerable resources promoting the culture, and are now demanding citizen rights for them, to make sure to nip any potential uprising in the bud."
