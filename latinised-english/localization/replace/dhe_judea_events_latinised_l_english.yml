l_english:
 dhe_judea.1.desc:1 "The province of Judea is home to the Jewish religion; an unusually dogmatic faith which asserts there is but one god named Yahweh. Their priests disseminate prophesies that his followers will one day retake Judea - a land promised to them by this god himself - from foreign invaders, and establish an immortal Jewish state. These delusions have created a long history of separatism in the region, and they doggedly resist all attempts to integrate their religion peacefully.\n\nIn order to conclude their obstinacy, and preemptively quell any future rebellion, it has been suggested that we outlaw Jewish religious practices and re-purpose their temples to the veneration of [ROOT.Country.GetReligion.GetName] gods once and for all."
 dhe_judea.1.bt:0 "The matter will not be resolved."
 dhe_judea.2.desc:0 "Our forceful conversion policies have seen success in the province of [SCOPE.sP('dhe_judea_target_province_scope').GetName]. Influential so called [ROOT.GetCountry.GetReligion.GetName] Jews have been disseminating the argument that relaxing the stricter rules of their religion and integrating into the society of [ROOT.GetCountry.GetName] is the best outcome for the Jewish people both as individuals and as a whole.\n\nWith a minor encouragement, we could surely encourage further sincere conversions by supporting this movement, at the risk of provoking unrest."
 dhe_judea.2.b:0 "We desire all of them, or none of them."
 dhe_judea.3.desc:0 "It seems that despite our best attempts, there are numerous who still maintain the Jewish faith in the privacy of their homes. Worse still, Jewish priests in [SCOPE.sP('dhe_judea_target_province_scope').GetName] have been openly protesting the decision to outlaw their religion, inspiring public reconversion and affirmations of loyalty to the Jewish faith.\n\nThe movement has been gaining momentum, and will require a robust response to reverse, and naturally will even further upset the local population."
 dhe_judea.4.t:0 "Looting Throughout [SCOPE.sP('dhe_judea_target_province_scope').GetName]"
 dhe_judea.4.desc:0 "[SCOPE.sP('dhe_judea_target_province_scope').GetName] has seen widespread discontent since Judaism was outlawed. Over a few days, peaceful demonstrations via the forum have escalated into violent attacks on government structures and ambushes on the town watch.\n\nTrade has all but ground to a halt as radical Jewish dissidents extort and threaten the local populace into maintaining their faith and undermining [ROOT.GetCountry.GetName] by any means."
 dhe_judea.5.desc:0 "The province of [SCOPE.sP('dhe_judea_target_province_scope').GetName] has seen a wave of unrest in response to the expulsion of Jewish priests and the erection of statues of [ROOT.Country.GetReligion.GetName] gods in their places of veneration.\n\nIt seems that a radical Jewish priest reacted to our policies by publicly murdering a [ROOT.Country.GetReligion.GetName] Jew during a religious ceremony, sparking a wave of similar attacks locally and ultimately the flight or murder of numerous sympathetic Jews in [SCOPE.sP('dhe_judea_target_province_scope').GetName]. The priest has since disappeared along with his family and followers.\n\nThese radicals seem to think they can get away with heinous anarchy."
 dhe_judea.6.desc_1:1 "Unrest has been growing throughout Judea, and the majority of Jewish followers have refused to adopt the [ROOT.Country.GetReligion.GetName] gods despite our efforts to outlaw their religion.\n\nA man named [SCOPE.sChar('dhe_judea_maccabee_character_scope').GetName] has appeared at the head of a major Jewish rebellion, claiming to be the son of a priest who murdered a [ROOT.Country.GetReligion.GetName] Jew prior to fleeing. His followers have provided him the epithet Makabi, the Hammer, supposedly in recognition for his leadership in the unrest throughout Judea.\n\nOur plans to bring lasting peace to the province have backfired, and at this point our only options are to fight these "Maccabees" or grant the Jews their wish of an independent state."
 dhe_judea.6.desc_2:1 "Our decision to leave the question of Jewish separatism open seems to have backfired. Unhappy with being governed by foreign "Gentiles", radical Jewish separatists have clandestinely organised a major revolt.\n\nA man named [SCOPE.sChar('dhe_judea_maccabee_character_scope').GetName] has appeared at the movement's head, claiming to be the son of a priest who murdered a [ROOT.Country.GetReligion.GetName] Jew prior to fleeing. His followers have provided him the epithet Makabi, the Hammer, supposedly in recognition for his leadership.\n\nAt this point our only options are to fight these "Maccabees" or grant them Judea as a client state and hope that they are satisfied."
 dhe_judea.6.a:0 "We can manage them."
 dhe_judea.7.t:0 "Liberated Once More"
 dhe_judea.7.desc_1:1 "The kingdom of Judea, bastion of the Jewish faith, has at last regained its independence, albeit as a tributary. The temple in Jerusalem has been cleansed and re-dedicated to Yahweh, and the pagan idols smashed in the forum. This day will be celebrated every year for all time with the lighting of candles, lest we neglect the struggles of our people.\n\nThis is a novel start for our people, and we must decide how we will treat with our neighbours, and what the focus of our state should be."
 dhe_judea.7.desc_2:1 "The kingdom of Judea, bastion of the Jewish faith, has at last regained its independence. The temple in Jerusalem has been cleansed and re-dedicated to Yahweh, and the pagan idols smashed in the forum. This day will be celebrated every year for all time with the lighting of candles, lest we neglect the struggles of our people.\n\nThis is a novel start for our people, and we must decide how we will treat with our neighbours, and what the focus of our state should be."
 dhe_judea.7.bt:1 "Judea will obtain a #Y claim#! on all neighbouring countries provinces in Palestine, and all #Y Hebrew#! pops in Judea will return to #Y Judaism#!."
 dhe_judea.8.desc_1:1 "Reports from the province of Judea seem to indicate that the insurrection of radical Jews has fizzled out since the integration of numerous Jews into the [ROOT.Country.GetReligion.GetName] religion. Our heavy handed tactics have successfully transformed a region with centuries of separatist tradition into merely a diverse province, comparable with any other in [ROOT.Country.GetName]."
 dhe_judea.8.desc_2:0 "Reports from the province of Judea seem to indicate that the underground separatist movements in Judea have fizzled out since the integration of numerous Jews into the [ROOT.Country.GetReligion.GetName] religion. A mixture of luck and conversions have successfully transformed a region with centuries of separatist tradition into merely a diverse province, comparable with any other in [ROOT.Country.GetName]."
 desc_dhe_judea_forced_conversion_pm:0 "The prohibition of Jewish religious practices has caused discontent throughout the province."
