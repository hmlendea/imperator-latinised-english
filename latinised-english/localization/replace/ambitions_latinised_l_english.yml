l_english:
 AMBITION_WHILE_ACTIVE:1 "While having this ambition the subsequent effects are active:\n$DATA$"
 AMBITION_MONTHLY_ALWAYS:0 "Each month the subsequent will occur:"
 AMBITION_MONTHLY_CHANCE:0 "A monthly chance of the subsequent."
 ambition_grow_up_desc:0 "[ROOT.GetCharacter.GetName] just desires to mature!"
 ambition_content_in_life_desc:0 "[ROOT.GetCharacter.GetName] possesses no pressing concerns in [ROOT.GetCharacter.GetHerHis] life right now!"
 ambition_become_married:0 "Obtain Married"
 ambition_become_married_desc:0 "[ROOT.GetCharacter.GetName] longs to discover someone with whom to spend [ROOT.GetCharacter.GetHerHis] life."
 ambition_conquer_province_desc:0 "Invariably thirsty for novel land to call [ROOT.GetCharacter.GetHerHis] own, [ROOT.GetCharacter.GetPraenomen] views the land of the [SCOPE.sP('conquer_province_target').GetOwner.GetAdjective] people as fair game for conquest."
 ambition_become_governor_followon_desc:0 "Content with [ROOT.GetCharacter.GetHerHis] contribution to our considerable nation, [ROOT.GetCharacter.GetPraenomen] wishes to retire from active military service, and spend [ROOT.GetCharacter.GetHerHis] time growing old and fat governing [SCOPE.sP('governor_followon_target').GetState.GetShortName]; a province [ROOT.GetCharacter.GetSheHe] has frequently suggested conquering."
 ambition_become_governor_desc:0 "[ROOT.GetCharacter.GetPraenomen] considers [ROOT.GetCharacter.GetHerselfHimself] a [ROOT.GetCharacter.GetWomanMan] of extraordinary administrative talent. [ROOT.GetCharacter.GetSheHe|U] believes that being a governor would be a fine use of [ROOT.GetCharacter.GetHerHis] competences."
 ambition_become_governor_specific_desc:0 "Having grown up amongst the [SCOPE.sP('specific_governor_target').GetCulture.GetName] people, [ROOT.GetCharacter.GetPraenomen] believes that [ROOT.GetCharacter.GetSheHe] possesses the knowledge and competences required to manage the province of [SCOPE.sP('specific_governor_target').GetState.GetShortName]."
 ambition_embrace_gender_equality_desc:0 "[ROOT.GetCharacter.GetName] believes that the long-standing tradition of our nation requires equal representation for all, and continues to stand for her own rights."
 ambition_release_prisoner_desc:0 "[ROOT.GetCharacter.GetPraenomen] is furious at the incarceration of [SCOPE.sChar('prisoner_ambition_target').GetName], and will continue to act contrary to our interests until [SCOPE.sChar('prisoner_ambition_target').GetSheHe] is free once again!"
 ambition_execute_rival_desc:0 "Unconvinced by the simple and frequently ineffectual punishment we have subjected [SCOPE.sChar('execution_ambition_target').GetName] to, [ROOT.GetCharacter.GetPraenomen] begs to see [SCOPE.sChar('execution_ambition_target').GetHerHim] put to death."
 ambition_become_philosopher_monarchy_desc:0 "[ROOT.GetCharacter.GetPraenomen] has invariably been a [ROOT.GetCharacter.GetWomanMan] of profound thought. Often to be seen pondering the greater mysteries in life, [ROOT.GetCharacter.GetSheHe] seems a fine candidate for a philosophical role at court."
 ambition_become_royal_tutor_monarchy_desc:0 "Teaching is a competence that not all possess. [ROOT.GetCharacter.GetPraenomen] has dedicated [ROOT.GetCharacter.GetHerHis] life to pedagogy, and considers [ROOT.GetCharacter.GetHerselfHimself] one of our finest tutors."
 ambition_become_augur_republic_desc:0 "[ROOT.GetCharacter.GetPraenomen] has invariably had a definite affinity for prophecy. [ROOT.GetCharacter.GetHerHis|U] piety, combined with this innate talent, have convinced [ROOT.GetCharacter.GetHerHim] to pursue higher office."
 ambition_become_wise_person_tribal_desc:0 "[ROOT.GetCharacter.GetName] is renowned for [ROOT.GetCharacter.GetHerHis] sagacity, and believes that [ROOT.GetCharacter.GetSheHe] would make a fine addition to the council."
 ambition_become_bureacrat_desc:0 "[ROOT.GetCharacter.GetPraenomen] wants nothing more than to spend [ROOT.GetCharacter.GetHerHis] life completing documentation."
 ambition_become_rich_desc:0 "[ROOT.GetCharacter.GetPraenomen] desires to mature to be ancient, fat, and surrounded by expensive items."
 ambition_become_politician_desc:0 "[ROOT.GetCharacter.GetPraenomen] dreams of leading our considerable nation to novel heights."
 ambition_become_demagogue_finish_tooltip:0 "    Will begin actively working contrary to our government!"
 scheme_assassinate_desc:0 "[ROOT.GetCharacter.GetName] has finally grown fatigued of the existence of [SCOPE.sChar('ongoing_scheme_target').GetName], and aims to terminate [SCOPE.sChar('ongoing_scheme_target').GetHerHis] life!"
 scheme_make_friends_desc:0 "Life is a vacant place without a sympathetic shoulder to lean on."
 games_will_cease:0 "[SCOPE.sP('games_province').GetName] will terminate holding games."
 scheme_abort_title_tt:0 "#T Persuade to Relinquish Scheme#!"
 investment_efforts_ended:0 "Investment efforts will terminate."
 scheme.1.desc:0 "That dastardly rogue, [SCOPE.sChar('thief').GetName], crept into the villa of [ROOT.GetCharacter.GetPraenomen] last night, and made off with a sizable quantity of valuable paraphernalia.\n\nVerification of such an action is hard to come by, and for now, we must tolerate the taunting gaze of [SCOPE.sChar('thief').GetPraenomen] from throughout the [ROOT.GetCharacter.GetEmployer.Custom('get_court_type')] floor."
 scheme.1.c:0 "Wait, wait! ACQUIRE IT ALL!!!"
 scheme.2.t:0 "Bungling Intruder"
 scheme_steal_desc:0 "Acquire what you can, and provide nothing back!"
 scheme.4.desc:0 "The statute is a tiresome invention. Brandishing papers, and surrounded by lackeys, [SCOPE.sChar('thief').GetName] curtly informed us that a plot of land owned by [ROOT.GetCharacter.GetName] was in fact, owned by [SCOPE.sChar('thief').GetHerHis] branch of the family [SCOPE.sChar('thief').GetFamilyDisplayAdjective].\n\nSpurious though these assertions may be, [SCOPE.sChar('thief').GetPraenomen] appears to have the paperwork to back this up."
 scheme.4.a:0 "We didn't require that land anyway."
 scheme.4.c:0 "We shall resolve this.. IN THE ARENA!!!"
 scheme.5.desc:0 "In an outrageous display of brazen ineptitude, [SCOPE.sChar('thief').GetName] challenged the proprietorship of a holding pertaining to [ROOT.GetCharacter.GetName], this afternoon. With only a set of blatantly forged documents to back up [SCOPE.sChar('thief').GetHerHis] assertion, the proceedings did not last long.\n\nShould we press for recompense?"
 scheme.5.b:0 "This land has pertained to us for generations!"
 scheme.6.t:0 "Pursuing a Patron"
 scheme.6.a:0 "Consider it accomplished."
 scheme.6.b:0 "Alas, we seem to be somewhat occupied washing our hair."
 scheme_steal_holding:1 "Asserting a Holding"
 scheme_steal_holding_desc:0 "Those with the mental fortitude to employ the statute, are despised by most. Those with the fortitude to be despised by most; employ the statute."
 scheme_pitfighting_desc:0 "For some, the thrill of demise or injury is enough to forgo propriety."
 influence.1.desc:0 "Politics can be a delicate business. Every wise ruler knows that there will always be someone out there with greater cunning or intellect than themselves, and [ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] is no different.\n\nHaving set sights on wooing the favour of [SCOPE.sChar('ongoing_scheme_target').GetName], a conundrum has arisen. [SCOPE.sChar('ongoing_scheme_target').GetPraenomen] has intimated that [SCOPE.sChar('ongoing_scheme_target').GetHerHis] considerable skills might be use in our favor, if we were to grant [SCOPE.sChar('ongoing_scheme_target').GetHerHim] a small plot of land in [SCOPE.sP('holding_province').GetName]."
 influence.1.d:0 "Outrageous! Impale [SCOPE.sChar('ongoing_scheme_target').GetHerHim]!"
 influence.2.desc:0 "Our continuing attempts to woo the highly skilled states[SCOPE.sChar('ongoing_scheme_target').GetWomanMan], [SCOPE.sChar('ongoing_scheme_target').GetName], have encountered a hitch.\n\nBeing a true [SCOPE.sChar('ongoing_scheme_target').GetWomanMan] of the people, [SCOPE.sChar('ongoing_scheme_target').GetPraenomen] has decided to invest in the creation of a beautiful monument to please the [ROOT.GetCharacter.GetEmployer.GetAdjective] people. To complete this mammoth assignment, [SCOPE.sChar('ongoing_scheme_target').GetSheHe] requires a large number of able bodied souls. If we were to provide such assistance, [SCOPE.sChar('ongoing_scheme_target').GetPraenomen] would surely be in our debt."
 influence.2.c:0 "Perhaps we can assuage the people in another manner?"
 influence.3.desc:0 "Our ruler's efforts to influence [SCOPE.sChar('ongoing_scheme_target').GetName] are well underway. In a jovial temperament, [SCOPE.sChar('ongoing_scheme_target').GetPraenomen] approached [ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] suggesting that a formal declaration of [SCOPE.sChar('ongoing_scheme_target').GetHerHis] loyalty and commitment to the [ROOT.GetCharacter.GetEmployer.Custom('get_court_type')] would be a fine manner of showing our appreciation. \n\nWe remain unconvinced that this is a politically sensible move."
 auto_influence_effect_tt:0 "[SCOPE.sChar('target').GetName] will influence their own choice of target, whenever they consider they are able to do so."
 auto_influence_effect_tt_stop:0 "[SCOPE.sChar('target').GetName] will no longer select their own influence target."
 scheme_purchase_power_base_desc:0 "This character is investing in private soldiers for their own requirements. Surely we have nothing to worry about?"
 scheme_disloyalty_other_effect_tt:0 "[SCOPE.sChar('ongoing_scheme_target').GetName] will forfeit up to #Y 15#! Loyalty!"
 scheme.9.desc:0 "We have been informed that [SCOPE.sChar('ongoing_scheme_target').GetName] was found brutally murdered in [SCOPE.sChar('ongoing_scheme_target').GetHerHis] home, just last night.\n\nThe investigators have reported that a [ROOT.GetCountry.Custom('get_arena_death_implement_glad')] was used in the crime - a device known to be favoured by [SCOPE.sChar('murderer').GetName], however, we have no hard evidence to link [SCOPE.sChar('murderer').GetHerHim] to the crime.\n\nRegardless, we should be watchful."
 scheme.9.b:0 "Let all be aware that we consider [SCOPE.sChar('murderer').GetPraenomen] guilty!"
 scheme.10.desc:0 "Hauled in front of the [ROOT.GetCountry.Custom('get_court_type')], [SCOPE.sChar('failed_murderer').GetName] is a sorry sight. Caught with [ROOT.GetCountry.Custom('get_arena_death_implement_glad')] in hand, [SCOPE.sChar('failed_murderer').GetSheHe] is said to have been ready to strike down [SCOPE.sChar('ongoing_scheme_target').GetName] in a brutal act of violence.\n\nLuckily, passers by were quick enough to act and prevent this terrible action, and we now have the unenviable task of passing judgment on the wicked [SCOPE.sChar('failed_murderer').GetPraenomen]."
 scheme.11.desc:0 "The royal library of [ROOT.GetCharacter.GetEmployer.GetCapital.GetName] has proven an invaluable source of knowledge over the years - it would seem that this year is no exception. Whilst researching the proud heritage of [ROOT.GetCharacter.GetHerHis] bloodline, [ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] discovered a minor tablet tucked into an alcove, long thought forgotten.\n\nIn near-indecipherable script, it detailed a branch of House [ROOT.GetCharacter.GetFamilyDisplayName], which appears to be connected to the legendary Diadochi, via [SCOPE.sChar('ancestor').GetName].\n\nThis knowledge shall not go to waste."
 scheme.13.desc:0 "A curious [SCOPE.sC('origin_country').GetAdjective] [SCOPE.sChar('ongoing_scheme_target').GetWomanMan] appeared upon our borders today, claiming asylum from [SCOPE.sChar('ongoing_scheme_target').GetHerHis] captors in [SCOPE.sC('origin_country').GetName].\n\n[SCOPE.sChar('ongoing_scheme_target').GetSheHe|U] additionally promises us opulent land in [SCOPE.sChar('ongoing_scheme_target').GetHerHis] home country, should we pursue vengeance on [SCOPE.sChar('ongoing_scheme_target').GetHerHis] behalf."
 scheme_escape_prison_desc:0 "Even a vain hope is preferable to no hope at all."
 expand_family_estates_tt:0 "The economic production of [family_estate.GetName] will be increased."
 desc_encroaching_on_public_land_modifier:0 "This character is currently in the process of expanding their family holdings by encroaching on publically owned land. This will probably increase the agricultural production of this territory but comes at a cost of embezzling the resources of the commons."
 scheme.16.desc_2:0 "[target.GetPraenomen], a member of the ruling [ROOT.GetCountry.GetRuler.GetFamily.GetName] family, is nowhere to be found, with almost all of their possessions absent."
 scheme_hold_religious_festival_desc:0 "Every festival requires a patron!"
 scheme_offer_marriage_to_ruler_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetName] is looking out for their family by trying to discover a suitable spouse for [ongoing_scheme_target.GetName]."
 scheme.18.desc:0 "The fact that [ongoing_scheme_target.GetName] has yet to marry has attracted the attention of many of the magnificent families of the realm. It was consequently perhaps no surprise when, during recent festivities held by the house of [courting_family.GetName], [ongoing_scheme_target.GetName] was introduced to [new_cousin.GetPraenomen], a young and, according to some, very suitable match.\n\nIt is certainly clear that [courting_hof.GetName] and [courting_hof.GetHerHis] entire family would be deeply grateful if our families were to be joined together in such a union."
 scheme.19.desc:0 "Our scheme to have our family marry into the ruling family has failed: someone else was more expeditious in exploiting this opportunity.\nLuckily we have at least been able to regain some of the money we have spent."
 desc_seeking_a_spouse:0 "This character is currently pursuing a political marriage with one of the magnificent families of the realm."
 scheme.20.a:0 "This is a considerable disgrace."
