l_english:
 war_council.1.t:0 "Conflict Council Assembles"
 war_council_assembles_monarchy_2:0 "All [ROOT.GetCountry.GetCapital.GetName] sleeps, as the conflict council drags well on into the night.\n\nAssembled, are three brilliant [ROOT.GetCountry.GetAdjective] minds, summoned to provide insight, each determined to convince us of the validity of their argument. [SCOPE.sChar('marshal').GetPraenomen], [SCOPE.sChar('marshal').Custom('get_council_1_descriptor')]; [SCOPE.sChar('guard').GetPraenomen], [SCOPE.sChar('guard').Custom('get_council_2_descriptor')]; and [SCOPE.sChar('third_party').GetPraenomen], [SCOPE.sChar('third_party').Custom('get_council_3_descriptor')]."
 war_council_assembles_tribal:0 "The gruff voices barking over the sound of carousing outside, yields an atmospheric setting for the latest meeting of the [ROOT.GetCountry.GetAdjective] conflict council.\n\nIn attendance, are several of the council's most well respected members; [SCOPE.sChar('marshal').GetPraenomen], [SCOPE.sChar('marshal').Custom('get_council_1_descriptor')]; [SCOPE.sChar('guard').GetPraenomen], [SCOPE.sChar('guard').Custom('get_council_2_descriptor')]; and [SCOPE.sChar('third_party').GetPraenomen], [SCOPE.sChar('third_party').Custom('get_council_3_descriptor')]."
 war_council_assembles_tribal_2:0 "After travelling for numerous days, the proud members of the [ROOT.GetCountry.GetAdjective] conflict council are gathered together in [ROOT.GetCountry.GetCapital.GetName], ready to discuss the waging of conflict on novel adversaries.\n\nHunched over the extensive table, [SCOPE.sChar('marshal').GetPraenomen], [SCOPE.sChar('marshal').Custom('get_council_1_descriptor')]; [SCOPE.sChar('guard').GetPraenomen], [SCOPE.sChar('guard').Custom('get_council_2_descriptor')]; and [SCOPE.sChar('third_party').GetPraenomen], [SCOPE.sChar('third_party').Custom('get_council_3_descriptor')], opine loudly on their chosen course of action."
 get_council_2_descriptor_2:0 "an astute and brilliant advisor"
 get_council_2_descriptor_3:0 "a highly regarded public orator"
 get_council_3_descriptor_4:0 "thought by numerous to speak with the will of the gods"
 war_council_all_three_agree_1:0 "\n\n As debate rages, it becomes apparent that, despite the various personal differences between our emphatic advisors, there is one matter they all agree on. All three of our trusted confidantes turn to face [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen], united in the conviction that [SCOPE.sC('target_country_1').GetName] must fall to the power of [ROOT.GetCountry.GetName]."
 war_council_all_three_agree_2:0 "\n\nThe debate rapidly descends into anarchy, with each party determined to make their feelings known, however, the calm voice of our [ROOT.GetCountry.GetRulerTitle] cuts across the raging argument, with one brief phrase.\n\n"[SCOPE.sC('target_country_1').GetName] must be destroyed".\n\nAs one, the three advisors fall into their seats, unsure of quite how they missed this obvious conclusion, before pledging their swords to [ROOT.GetCountry.GetName], each musing over the brilliance of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen]."
 war_council_1_and_2_agree:0 "\n\nIn fierce competition with each other, our advisors parry and counterattack, engaging in a melee of oratory that would put the ancient bards to shame. As the hours drag on, it becomes clear that [SCOPE.sChar('guard').GetPraenomen] and [SCOPE.sChar('marshal').GetPraenomen] are in agreement that we must look to [SCOPE.sC('target_country_1').GetAdjective] territories for our next campaign. [SCOPE.sChar('third_party').GetPraenomen], however, believes robustly that the territories of [SCOPE.sC('target_country_3').GetName] are much more suitable for [ROOT.GetCountry.GetAdjective] rule."
 war_council_1_and_3_agree:0 "\n\nOver the course of the evening, [SCOPE.sChar('marshal').GetPraenomen] becomes vociferous in [SCOPE.sChar('marshal').GetHerHis] opinion that [SCOPE.sC('target_country_1').GetName] ought to feel the power of the [ROOT.GetCountry.GetAdjective] armies, and to the surprise of numerous, [SCOPE.sChar('third_party').GetPraenomen] has commenced to agree with this method of thinking. [SCOPE.sChar('guard').GetPraenomen] obstinately continues to promote [SCOPE.sChar('guard').GetHerHis] own agenda, insisting that [SCOPE.sC('target_country_2').GetName] is ripe for conquest, citing [SCOPE.sChar('guard').GetHerHis] large network of informants in the [SCOPE.sC('target_country_2').GetAdjective] countryside."
 war_council_2_and_3_agree:0 "\n\nAs promising and flawed arguments are proffered on all sides, the status-quo descends eventually. [SCOPE.sChar('guard').GetPraenomen] and [SCOPE.sChar('third_party').GetPraenomen] agree on the necessity of curbing the [SCOPE.sC('target_country_2').GetAdjective] menace; whereas [SCOPE.sChar('marshal').GetPraenomen] opines that [SCOPE.sChar('marshal').GetHerHis] preference lies in the plenteous territories of [SCOPE.sC('target_country_1').GetName]. It is up to us to determine the best course of action."
 war_council_all_3_different_2:0 "\n\nBarbed insults begin to fly, as our advisors feint and deflect with consummate competence, each showing their prowess in political discourse. Ultimately, no compromise can be made, and we are left with three distinct directions. [SCOPE.sChar('marshal').GetPraenomen] is for conflict with [SCOPE.sC('target_country_1').GetName], [SCOPE.sChar('guard').GetPraenomen] for [SCOPE.sC('target_country_2').GetName], whereas [SCOPE.sChar('third_party').GetPraenomen] advocates a territorial conflict with [SCOPE.sC('target_country_3').GetName].\n\nIt is up to us to discover a course via this mess."
 war_council_target_province_1_area_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] obtains claims on the #Y [SCOPE.sP('target_province_1').GetOwner.GetAdjective]#! Province of #Y [SCOPE.sP('target_province_1').GetArea.GetName]#!."
 war_council_target_province_2_area_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] obtains claims on the #Y [SCOPE.sP('target_province_2').GetOwner.GetAdjective]#! Province of #Y [SCOPE.sP('target_province_2').GetArea.GetName]#!."
 war_council_target_province_3_area_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] obtains claims on the #Y [SCOPE.sP('target_province_3').GetOwner.GetAdjective]#! Province of #Y [SCOPE.sP('target_province_3').GetArea.GetName]#!."
 war_council_one_and_two:1 "Let us wage conflict on [SCOPE.sP('target_province_1').GetOwner.GetName]."
 war_council_two_and_three:1 "A claim on [SCOPE.sC('target_country_2').GetAdjective] territories must be made."
 war_council_one:0 "[SCOPE.sChar('marshal').GetPraenomen] has the truth of it. We must prepare for conflict with [SCOPE.sC('target_country_1').GetName]."
 not_summoned_war_council_recently_tt:0 "You are unable to summon the #Y Conflict Council#! again, until [SCOPE.GetRootScope.GetCountry.GetVariableExpiry('summoned_war_council')|Y]."
 summon_war_council_title_tt:0 "#T Summon Conflict Council#!"
 summon_war_council_desc_tt:1 "#TF Summons a selection of your closest advisors, to determine a good direction for our next conquest, and provide a claim on a neighbouring province every 10 years."
 war_council_assembles_republic:0 "Numerous long hours have passed since the senate hall closed for the day, yet four figures still sit, animated in intense discussion over matters of future conquest. \n\n[SCOPE.sChar('marshal').GetPraenomen], [SCOPE.sChar('marshal').Custom('get_republic_council_descriptor_marshal')]; [SCOPE.sChar('guard').GetPraenomen], [SCOPE.sChar('guard').Custom('get_republic_council_descriptor_guard')]; and [SCOPE.sChar('third_party').GetPraenomen], [SCOPE.sChar('third_party').Custom('get_republic_council_descriptor_third_party')], each argue for their own chosen course of action."
 war_council_assembles_republic_2:0 "The glorious arches of [ROOT.GetCountry.GetCapital.GetName] provide a scenic setting for the continuing planning of future conflicts, held between the chief minds of the republic.\n\n[SCOPE.sChar('marshal').GetPraenomen], [SCOPE.sChar('marshal').Custom('get_republic_council_descriptor_marshal')]; [SCOPE.sChar('guard').GetPraenomen], [SCOPE.sChar('guard').Custom('get_republic_council_descriptor_guard')]; and [SCOPE.sChar('third_party').GetPraenomen], [SCOPE.sChar('third_party').Custom('get_republic_council_descriptor_third_party')]."
 war_council_all_three_agree_republic:0 "\n\nAs debate goes on, it becomes clear that despite the oft-conflicted agendas of the senatorial factions, there is one matter they all agree on. All three of our faction representatives stand suspiciously unanimous, united in the conviction that [SCOPE.sC('target_country_1').GetName] must be the target of the next [ROOT.GetCountry.GetAdjective] campaign."
 war_council_1_and_2_agree_republic:0 "\n\nThe senate hall echoes with the rising choler of red-faced senators, each looking to promote the interests of their own faction. It transpires that [SCOPE.sChar('guard').GetPraenomen] and [SCOPE.sChar('marshal').GetPraenomen] believe robustly that the conquest of [SCOPE.sC('target_country_1').GetAdjective] territories, aligns perfectly with the aims of the [SCOPE.sChar('marshal').GetParty.GetName] and [SCOPE.sChar('guard').GetParty.GetName]. Meanwhile, [SCOPE.sChar('third_party').GetPraenomen] believes that the [SCOPE.sChar('third_party').GetParty.GetName] would benefit from the conquest of rich [SCOPE.sC('target_country_3').GetAdjective] territory."
 assemble_war_council_republic_button_title_tt:0 "#T Summon Senatorial Conflict Council#!"
 get_republic_council_descriptor_marshal_3:0 "a senator known for their magnificent speeches"
 get_republic_council_descriptor_guard_fallback:0 "a senator known for their robust opinions"
 get_republic_council_descriptor_third_party_2:0 "a senator known for their administrative competences"
 enables_war_council_tt:0 "\nWhen Enacted:\nEnables the #Y Senatorial Conflict Council#! Government Interaction.\n\n"
 war_council_one_and_two_republic:1 "[SCOPE.sChar('marshal').GetPraenomen] and [SCOPE.sChar('guard').GetPraenomen] have it; to conflict with [SCOPE.sP('target_province_1').GetOwner.GetName]!"
 war_council_two_and_three_republic:1 "[SCOPE.sChar('guard').GetPraenomen] agrees with [SCOPE.sChar('third_party').GetPraenomen]. We rely upon them implicitly."
 war_council_one_republic:0 "[SCOPE.sChar('marshal').GetPraenomen] of the [SCOPE.sChar('marshal').GetParty.GetName] has the facts. We must make conflict on [SCOPE.sC('target_country_1').GetName]."
 get_council_1_descriptor_10:0 "a governor who has used their time in post to reap magnificent affluence from the provinces"
 get_council_3_descriptor_9:0 "a governor who is sadly deficient in administrative abilities"
 get_council_3_descriptor_10:0 "an individual with immense affluence, presumably as a result of a rich governorship"
