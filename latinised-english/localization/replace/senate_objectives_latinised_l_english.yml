 senate_objective_build_temple_generic:1 "Construct Temple"
 senate_objective_build_temple_generic_DESC:1 "The $traditionalist_party$ wish to ensure the continued reverence and status of our religion by commissioning a novel temple to one of the great gods."
 senate_objective_imprison_head_generic:2 "Commence Trial"
 senate_objective_integrate_culture_generic_DESC:1 "The $democratic_party$ wish to champion the status of the marginalised foreign elements of our country by enshrining their legal status."
 senate_objective_reduce_tyranny_generic_DESC:1 "The $democratic_party$ are tired of the tyrannical behaviour of recent rulers and seek to ensure fair and free government is protected."
 senate_objective_convert_province_generic_DESC:1 "The $traditionalist_party$ seek to ensure that the state religion is not superseded by that of our subjects or neighbours by encouraging its practice."
 senate_objective_state_investment_generic_DESC:0 "The $traditionalist_party$ wish to encourage development and stability, ensuring that our territories are not neglected by self-serving politicians."
 senate_objective_acquire_subject_generic_DESC:0 "The $oligarchic_party$ seek to increase our countries dominance over our weaker neighbours by putting one of them under our thumb."
 senate_objective_appoint_member_generic_DESC:0 "The $oligarchic_party$ place their own interests first, among which ensuring their own influence through lucrative appointments is paramount."
 senate_objective_destroy_shrine_generic_DESC:0 "The $traditionalist_party$ resent the presence of a sacred site to foreign gods in our country, and would see it torn down as an affront to the true gods."
 senate_objective_enemy_shrine_generic_DESC:0 "The $traditionalist_party$ resent the presence of a sacred site to foreign gods in our country, and would see it torn down as an affront to the true gods."
