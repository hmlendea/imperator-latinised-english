l_english:
 trial_consequences:1 "If we fail to convict #Y [SCOPE.sChar('target').GetName]#!, [target.GetSheHe] may seek to commence a #R Civil Conflict#!."
 office_trial_success_chance_future_small:0 "This will increase our success chance by a #Y minor#! amount."
 office_trial_success_chance_subtract_small:0 "This will decrease our success chance by a #R minor#! amount."
 trial.2.desc:0 "As the hours draw on, members of the [ROOT.GetCountry.Custom('get_court_type')] commence to grow weary with the constant questioning, vitriol, and drama. [SCOPE.sChar('target').GetPraenomen] finally takes the floor, waxing lyrical on the subject of [SCOPE.sChar('target').GetHerHis] eternal loyalty to [ROOT.GetCountry.GetName].\n\nAs [SCOPE.sChar('target').GetPraenomen] speaks, a curious smile creases [SCOPE.sChar('target').GetHerHis] face. It seems that whilst drawing up details of the accusation, our examiners had neglected to check the whereabouts of [SCOPE.sChar('target').GetPraenomen] on the eve of [SCOPE.sChar('target').GetHerHis] supposed criminal activity - [SCOPE.sChar('target').GetSheHe] was in fact visiting [SCOPE.sC('alibi_country').GetName] on a diplomatic mission."
 trial.3.a:0 "Hah! [SCOPE.sChar('powerful_ally').GetPraenomen] is unable to scare us."
 trial.4.b:0 "Oh... very well. A minor fine should suffice."
 cannot_pay_fine_tt:0 "#Y [SCOPE.sChar('target').GetName]#! is unable to afford 100 @gold!, and will go directly to jail!\n[SCOPE.sChar('target').GetSheHe|U] will lose all offices, and the trial will end."
 trial.5.b:0 "Nonsense - [SCOPE.sChar('scapegoat').GetPraenomen] is an honourable [SCOPE.sChar('scapegoat').GetWomanMan]."
 trial.6.desc:0 "Times passes, as a litany of bellicose rivals attempt amateur character assassination versus [SCOPE.sChar('target').GetName]. [SCOPE.sChar('target').GetSheHe|U] grows visibly more anxious as the tirade continues, until - suddenly, and to the surprise of all present, [SCOPE.sChar('target').GetSheHe] leaps up, and makes a dash for the nearest exit.\n\nThe sudden pandemonium is cut short, as [SCOPE.sChar('target').GetName] accidentally runs directly into [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen], with both conclusion up sprawled upon the floor."
 trial.7.desc:0 "During a dull, and frankly amateurish defence, [SCOPE.sChar('target').GetName] works [SCOPE.sChar('target').GetHerselfHimself] into quite a tricky situation. We remain unsure quite how, but rather than professing innocence, [SCOPE.sChar('target').GetPraenomen] seems to have mistakenly assumed that [SCOPE.sChar('target').GetSheHe] was acting on behalf of the prosecution, and accused [SCOPE.sChar('target').GetHerselfHimself] of a wide variety of crimes.\n\nNow might be a good chance to push the advantage."
 trial.7.a:0 "Invest in a few favours, to turn this into a win."
 trial.7.b:0 "We hardly require to, at this rate."
 fled_to_join_tt:0 "[SCOPE.sChar('target').GetName] has joined [SCOPE.sChar('target').GetHerHis] patron in the Civil Conflict!"
 trial.8.desc_civil_war_happens:0 "\n\nWith this unfortunate news in mind, the spies we tasked to follow [SCOPE.sChar('target').GetPraenomen] report that [SCOPE.sChar('target').GetSheHe] was last seen fleeing to the hills, accompanied by a sizeable quantity of loyal soldiers. It seems we have failed to manoeuvre well in this political game.\n\nThere is conflict ahead."
 trial.8.desc_civil_war_prevented:0 "\n\nThe glower crossing the face of [SCOPE.sChar('target').GetPraenomen] is hard to ignore, as [SCOPE.sChar('target').GetSheHe] storms out of the structure; presumably feeling angry, yet vindicated."
 trial.8.bypass_success:0 "\n\nThe entire structure shakes with the uproar of all present. The [ROOT.GetCountry.Custom('get_court_type')] guards seize [SCOPE.sChar('target').GetPraenomen], and march [SCOPE.sChar('target').GetHerHim] away to the dungeon. [SCOPE.sChar('target').GetHerHis|U] fate is ours to decide, now..."
