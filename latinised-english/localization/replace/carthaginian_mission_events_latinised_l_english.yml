l_english:
 me_carthage_sicily.1.desc:0 "$dhe_carthage.3.desc$\n\nWe have received news that a local aristocrat of Syracuse looks upon us favourably, and have offered to assist us in putting an end to Syracusan domination of eastern Sicily. With this local benefactor in our service, the Greek threat will be at an end."
 me_carthage_sicily.2.desc:1 "At long last our struggle for the island of Sicily is over, and with it our Mediterranean position is unquestionably secured. We no longer need worry over the threat of Greek interference in our vital trade routes or the ambitions of their tyrants and kings, and the rich Greek urban centres of the Italian peninsula lie open before us.\n\nHowever, Sicily is a populous island with an extended and proud Greek tradition in addition to that of local Latin tribes; these spirited people have had much invested in a Punic defeat, and will doubtless not be immediately content with our rule.\n\nIt has been suggested that a client state be established in order to placate the desire for self-governance, others advocate that this island is no different from any other and must bend to our will."
 me_carthage_sicily.2.a.tt_player:0 "We will release a #Y Subject#! named Epikrateia who will gain control of all our territories in the areas of #Y Sicania#!, #Y Syracuse#! and #Y Siculia#!. As one of our subjects in Sicily is controlled by a player, they will be prioritised to occupy this role."
 me_carthage_sicily.3.desc:2 "After conquering Sicily, the Punics decided to have the whole island govern itself. As staunch loyal supporters of our overlord to the south-west, we have been given the considerable honour of taking on the role of governors in their place.\n\nAs the rulers of the Punic Epikrateia, we are sure to have a bright future ahead of us."
 me_carthage_sicily.4.desc:0 "Long have our ancestors and senators mused upon the Carthaginian threat across the ocean. Recently, however, this threat has moved closer to home; as the city of excess extends insidious tendrils into the heartland of Sicilia.\n\nWhilst we have not always seen eye to eye, an envoy from Syracusae informs us of the likelihood of impending conflict in Sicily once again, and begs our protection that all of Italia might be spared from the terror of foreign rule."
 me_carthage_sicily.4.b:0 "We owe these Greeks no favours."
 me_carthage_sicily.5.desc:1 "Our frontier patrols indicate rumblings of mass mobilisation from Carthaginian ports. As painful as it may be to many of us to admit that we are incapable of dealing with this menace, our cadre of advisors suggest that our rivalry with [SCOPE.sC('target_benefactor').GetName] should be set aside for the moment, and it is advisable to beseech them for aid in the coming conflicts."
 me_carthage_sicily.5.a:0 "Indeed so - dispatch the request."
 me_carthage_sicily.5.b:0 "We remain alone, as we have always done."
 send_request_carthage_mission_tt:0 "A request will be dispatched."
 me_carthage_iberia.1.a.tt_player:0 "We will release a #Y Colony#! named Carthago Nova who will gain control of all our territories in the regions of #Y Contestania#! and #Y Baetica#!. As one of our subjects in Iberia is controlled by a player, they will be prioritised to occupy this role."
 me_carthage_iberia.1.desc:0 "As Carthage was once left on its own to develop into a strong western Mediterranean force by the people of Tyre, we are leaving Carthago Nova and its citizens in charge of our forces in Iberia. With rich lands in their possession, and an independent future, we hope that they will become a powerful ally that we can rely on."
 me_carthage_iberia.2.desc:1 "In a surprising move, the leaders of [SCOPE.sCountry('mission_country').GetName] have decided to provide us with the liberty to govern our own lands, as well as all the territories they held in the area. Not only have they left us free to do as we wish, they have also promised us to defend our lands if necessary, as long as we continue to provide them with some of the silver mined from the rich mines of Mastiania."
 me_carthage_iberia.2.a:0 "It is time to make the most out of the liberty given to us."
 me_carthage_iberia.3.desc:0 "Our efforts to build superior relations with Gymnaesia have started to pay off as they have shown a lot of appreciation for the gifts we have sent them, and our diplomats in the area have informed us that the locals have started talking more positively concerning us these last weeks."
 me_carthage_magna_graecia.1.desc:0 "We have received some traders from [SCOPE.sCountry('greek_country').GetName] in [SCOPE.sP('affected_province').GetName]. Apparently rumours have travelled far and wide concerning the trade opportunities in [ROOT.GetCountry.GetAdjective] lands, and they have come bearing goods and valuables."
 me_carthage_magna_graecia.2.desc:0 "It seems the money we have set aside to assist with our infrastructure, and occasionally bribe merchants and traders passing through, has finally started paying off. A large group of Greek traders have settled down in [SCOPE.sP('affected_province').GetName], bringing wealth and novel ideas to the area."
 me_carthage_phoenicia.1.desc:1 "The people of Phoenicia have been released to rule themselves, with our guidance and protection if it is ever needed. Our foray into Phoenician lands has been a surprisingly popular move, as we have managed to spin it as a liberation of our ancestors and brethren from hostile rule, making us popular at home as well as among our novel subjects in Phoenicia."
 me_carthage_phoenicia.2.desc:0 "The Phoenician cities have finally been united under one hegemon, Carthage. No longer will they be bowing to foreign suzerains, but rather look to us as fellow countrymen."
 me_carthage_africa.1.desc:1 "A messenger, panting from the exertion of unnumbered nights of travel, has arrived at the council chambers. Bringing news from the frontier, he speaks again of our erstwhile overlords, the foul Punics, who are enticing our people to uproot their belongings and locate a home across the frontier."
 me_carthage_africa.3.desc:1 "Our Punic suzerains have treated us with contempt for far too long. It is time now to fight back. To fight for our independence and our liberty."
 me_carthage_africa.4.desc:1 "A messenger arrives, Massylian forces have been spotted raiding our towns and villages. It seems as if the Massylians have shown their true colours. They have no loyalty to [SCOPE.sCountry('mission_country').GetName], and have unsurprisingly declared conflict upon us after a minimum of baiting. [ROOT.GetCountry.GetRuler.GetName] stands up and addresses the senate:\n\n'We shall assemble our might, and we shall crush them beneath our heel. They will know their place prior to the conclusion!'"
 me_carthage_africa.5.desc:1 "[ROOT.GetCountry.GetRuler.GetName] looks out across the landscape from his balcony as the sun sets in the west. He finds the view splendid, knowing as he does that now, as far as the eye can see, in fact, as far as the Pillars of Herakles and beyond, even to the setting sun, the peoples and lands belong or bow to the power of [SCOPE.sCountry('mission_country').GetName].\n\n[ROOT.GetCountry.GetRuler.GetSheHe|U] turns towards the sea, and looks both east, west, and north. Foreign lands lie ahead, ready for conquest or subjugation. "
 me_carthage_africa.7.desc:0 "As our trade empire expands, with more and more colonies and ports abroad, our ambitions in Africa have withered. We must secure our footing at home, protect our backs from uprisings and raids by unruly tribes, prior to turning our gaze across the sea once again."
 me_carthage_africa.9.desc:1 "Our heralds bring us news of conflict in Africa. The Punic senate, known for their vice, greed, and wickedness, have taken it upon themselves to expand their hegemony further.\n\nA lone tribe, the Massylii of Africa Interior, has chosen to stand and fight; perhaps doomed to fail, but showing spirit and determination almost akin to that of our own people."
 me_carthage_africa.10.desc:0 "The [SCOPE.sC('from_country').GetAdjective] people, in their enlightened wisdom, have heard of our plight against our oppressors, and dispatched much-needed gold with which to fuel our righteous conflict of indignation.\n\nLet us hope that we are still present to repay them in kind, once the dust settles."
 me_carthage_africa.11.desc:0 "It seems the emissaries of [SCOPE.sCountry('mission_country').GetName] desires to change our very manner of life, by introducing Punic settlers into our heartland and expanding on our bureaucracy. They have lately discussed making [ROOT.GetCountry.GetRuler.GetName] a king of the [SCOPE.sCountry('new_tribal_vassal').GetAdjective] tribes, unifying them once and for all."
 me_carthage_africa.11.b:0 "Their suggestions are an insult and menace to our traditions."
 me_carthage_africa.12.desc:0 "Via focused effort into expanding and improving the [SCOPE.sCountry('new_tribal_vassal').GetAdjective] bureaucracy, we have seen an increased interest in our civilisation and traditions in the region. We have effectually turned the loose tribes of [SCOPE.sCountry('new_tribal_vassal').GetName] into a proper client of [ROOT.GetCountry.GetName]."
 me_carthage_africa.13.desc:0 "Though we placed considerable efforts into peacefully expanding and improving the bureaucracy of the [SCOPE.sCountry('new_tribal_vassal').GetAdjective] tribes, they have rejected and insulted us every step of the way. Though we expect difficulties, it came to a head when one of our emissaries was killed for suggesting a more centralised rule of the tribes."
 me_carthage_rome.1.desc:0 "It seems that Punic diplomats and silver have convinced some of the locals living in our territory around Cisalpine Gaul to rise up against us, their rightful rulers. Even those who are not interested in this minor revolt are affected by the violence and conflicts, unable to go on with their daily lives."
 me_carthage_rome.2.desc:0 "It seems that Punic diplomats and silver have convinced some of the locals living in our territory around Magna Graecia to rise up against us, their rightful rulers. Even those who are not interested in this minor revolt are affected by the violence and conflicts, unable to go on with their daily lives."
 me_carthage_rome.5.desc:2 "The fire quickly disseminated throughout the entire city, and in the span of a couple of hours the once magnificent city is no more, only ruins littering the barren landscape. Most of the Roman population have fled the city, now trying to locate novel homes for themselves.\n\nFinally the menace of Rome is no more. [SCOPE.sCountry('mission_country').GetName] is the supreme power of the western Mediterranean."
 me_carthage_rome.6.desc:0 "Once the rising power in Italy, the Romans have been entirely placed under our control. With a large part of their population shipped off as slaves, the remaining Romans have become docile and loyal, knowing they no longer have the influence nor power to oppose us."
 me_carthage_naval_dominance.1.desc:0 "The [SCOPE.sCountry('carthage_scope').GetRulerTitle] of [SCOPE.sCountry('carthage_scope').GetName] has dispatched us a large gift of silver and gold, together with [SCOPE.sCountry('carthage_scope').GetRuler.GetHerHis] best wishes for [ROOT.GetCountry.GetName]. It is unclear exactly what the people of [SCOPE.sCountry('carthage_scope').GetName] wanted in return, but their envoys have shown an interest in the magnificent Phoenician cedars."
 me_carthage_naval_dominance.2.b.tt:3 "The #Y 15#! largest Tterritories with a port held by [SCOPE.sCountry('carthage_scope').GetName] in the Regions of #Y Africa#!, #Y Numidia#! and #Y Mauretania#! will gain the modifier #Y Trade Harbour#! until #Y End of Game#!, giving them the following effects"
 me_carthage_naval_dominance.2.c.tt:3 "The #Y 15#! largest Territories with a port held by [SCOPE.sCountry('carthage_scope').GetName] in the Regions of #Y Africa#!, #Y Numidia#! and #Y Mauretania#! will gain the modifier #Y Military Harbour#! until #Y End of Game#!, giving them the following effects"
 me_carthage_naval_dominance.4.desc:0 "We have received envoys from the people of [SCOPE.sCountry('mission_country').GetName], with gifts of gold and silver. They are offering us even more, if we are willing to let them set up a trade station in [SCOPE.sP('north_port_province').GetName].\n\nWe know sufficient concerning the Punics to know this in effect means they will take control over that whole territory, but it could be nice to have such a large trade partner nearby."
 me_carthage_naval_dominance.4.b:0 "We refuse to provide them [SCOPE.sP('north_port_province').GetName]."
 me_carthage_naval_dominance.5.desc:0 "The people of [SCOPE.sCountry('north_port_owner').GetName] were happy to sell us [SCOPE.sP('north_port_province').GetName], given the right price. As a novel city for the [SCOPE.sCountry('mission_country').GetAdjective] people, it will play an important part in entering the markets of the north. The land of Transalpine Gaul used to be closed to us, and exclusively a Greek market, and we will finally change that."
 me_carthage_naval_dominance.6.desc:0 "The uncivilised people of [SCOPE.sCountry('north_port_owner').GetName] have rejected our friendly offer of setting up a trade station in [SCOPE.sP('north_port_province').GetName]. Our envoys tells us of the mocking insults that were thrown their way, as they proposed the deal."
 me_carthage_naval_dominance.7.desc:0 "As we assemble all our officers to discuss our recent military developments, a new face appears among the crowd. There have been stories concerning the achievements of a new admiral, beating back pirates and thieves with only a minor fleet at hand using innovative tactics and ideas. This [SCOPE.sChar('new_admiral').GetPraenomen] seems to have a bright future at hand, and it would be best to make use of [SCOPE.sChar('new_admiral').GetHerHis] numerous talents.\n\nWhen it is finally [SCOPE.sChar('new_admiral').GetHerHis] turn to speak, [SCOPE.sChar('new_admiral').GetSheHe] is happy to report that it seems our recent naval developments have turned out very well, and that there are few to oppose us at sea."
 me_carthage_trade.1.desc:0 "The despicable people of [SCOPE.sCountry('border_conflict_neighbor').GetName] have betrayed us! Instead of dispatching their own envoys to meet ours to discuss a frontier agreement, they have begun colonising the area between our two nations."
 me_carthage_trade.2.desc:0 "In order to come to an agreement on our frontier with [SCOPE.sCountry('border_conflict_neighbor').GetName], it has been decided that each party dispatch envoys from their respective capital, and the point where they meet will be the location of the novel frontier.\n\nOur envoys, the Philaeni brothers, have managed to be much more rapid than those of [SCOPE.sCountry('border_conflict_neighbor').GetName]. The [SCOPE.sCountry('border_conflict_neighbor').GetAdjective] envoys, having been delayed by weather, are displeased, and give the Philaeni a choice. Either they agree to be buried alive in this spot, and that is where the frontier will run, or allow the [SCOPE.sCountry('border_conflict_neighbor').GetAdjective] envoys to travel farther until they agree to have the same done to them..."
 me_carthage_trade.3.desc:0 "Since the Peripli of Hanno and Himilco, more than 200 years ago, we have been lax in our exploration of the lands outside the Mediterranean, while the Greeks have not been so slothful. Certain members of our government have concluded that, in order to cement Carthage's position as the foremost naval power in the world, and the master of all trade, that another expedition is needed to chart novel lands and set up novel trade routes.\n\nAfter several years of searching, we have finally discovered a willing mariner, [SCOPE.sChar('periplus_character').GetName], a daring sea-captain in our trade fleet."
 me_carthage_trade.4.desc:0 "The day has finally arrived, [SCOPE.sChar('periplus_character').GetName] has outfitted a vessel and assembled a crew for the upcoming voyage. After setting sail from [ROOT.GetCountry.GetCapital.GetName], the vessel will resupply in Rutubis prior to disappearing south to explore the lands beyond. [ROOT.GetCountry.GetRuler.GetPraenomen] watches the expedition set sail from the Cothon and disappear westwards towards the Pillars of Melqart, wondering what strange adventures lies ahead for [SCOPE.sChar('periplus_character').GetName], and if [SCOPE.sChar('periplus_character').GetSheHe] will ever return to [ROOT.GetCountry.GetName]."
 me_carthage_trade.5.desc:0 "[SCOPE.sChar('periplus_character')GetName], our brave and daring explorer, has returned from [SCOPE.sChar('periplus_character')GetHerHis] expedition. [SCOPE.sChar('periplus_character')GetHerHis|U] ship comes sailing into the Cothon laden with exotic goods discovered in faraway lands, a periplus mapping out the unknown, and a host of exciting tales from [SCOPE.sChar('periplus_character')GetHerHis] travels.\n\n[SCOPE.sChar('periplus_character')GetName] claims to have met the Gorillai of Hanno, and the sea monsters of Himilco, explored dark forests and open plains, and climbed tall mountains in the distance. [SCOPE.sChar('periplus_character')GetSheHe|U] has exchanged goods with faraway peoples, and ridden the largest elephants he has ever seen.\n\nFurthermore, to the great delight of the Senate, the worth of the exotic goods brought back on board the vessel is sufficient to fund ten such expeditions!"
 me_carthage_trade.5.a:0 "A meritorious investment!"
 me_carthage_trade.6.desc:0 "From the other side of the world, our envoys brought back two elephants from the Indus valley. The calves are now a year old, and growing nicely. We discovered early on, however, that there was some friction between our native elephants and the new Indian ones. We have therefore decided to move them to their own enclave.\n\nAfter much prospecting, we have discovered a plot of land with fertile grazing opportunities in the hills near Carthage itself, where we expect the herd to thrive in the coming years."
 me_carthage_trade.7.desc:0 "Due to our strenuous efforts to expand our trade network, and the subsequent influx of goods into our harbours, the city is flourishing. From sunrise until well after sundown the Cothon is a bustling hub of activity, as citizens, merchants, sailors, and other less savoury occupants of the docks ply their trade. Farther afield the goods are brought to market, and market squares are brimming with commoners and wealthy alike.\n\nFrom all over the known world, Carthage is quickly becoming known as the Metropolis of the West."
 me_carthage_trade.8.desc:0 "Two years have passed, and we have received no news from our expedition since they set sail from Rutubis. We can only assume that [SCOPE.sChar('periplus_character')GetName], our brave and daring explorer, has perished with [SCOPE.sChar('periplus_character')GetHerHis] entire expedition somewhere in the depths of the unknown.\n\nOur country feels the loss keenly, and mourns the loss of such a magnificent figure. We salute the brave seafarers that perished in service to their country."
 me_carthage_bomilcars_revolution.2.desc:1 "The 104 is a council of judges that in numerous methods control the politics of Carthage, behind the scenes. Though they make fewer of the day to day decisions, they have the power to topple any ruler, if need be.\n\nAfter it became apparent we were looking to improve our relations with the council, we were dispatched a messenger working on their behalf named [SCOPE.sChar('oligarchic_character').GetName]. [SCOPE.sChar('oligarchic_character').GetSheHe|U] has already started drafting up plans on how we can provide more power to the few powerful men and women at the top of the Carthaginian hierarchy."
 me_carthage_bomilcars_revolution.3.a:0 "Dispatch the envoy."
 me_carthage_bomilcars_revolution.3.b:0 "Let us tread lightly concerning this particular lion..."
