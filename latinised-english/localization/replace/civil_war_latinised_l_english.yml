l_english:
 civil_war.2.descOpinionBad:0 "\n\nOur advisors are cursing the result of this war, having clearly hoped that our [SCOPE.sC('victorious_side').GetAdjective] enemies would have fallen even further into turmoil. Nevertheless, we should once again be wary of them."
 civil_war.2.descOpinionNeutral:0 "\n\nThe result of this war is largely irrelevant to us, as we do not consider [SCOPE.sC('victorious_side').GetName] as either a friend or enemy. Nevertheless, we ought to be careful, now that their nation is on track to recovery."
 civil_war.4.descOpinionBad:0 "\n\nOur advisors are cursing the result of this war, having clearly hoped that the traitorous [SCOPE.sC('victorious_side').GetAdjective] rebels would fail in their attempts to overthrow their old companions. We should watch this situation carefully."
 civil_war.4.descOpinionNeutral:0 "\n\nThe result of this war is largely irrelevant to us, as we do not consider [SCOPE.sC('victorious_side').GetName] as either a friend or enemy. Nevertheless, we ought to be careful, now that their nation is on track to recovery."
 civil_war.5.desc:1 "At long last, the brutal struggle with our own nation has come to a close. The remains of the armies once commanded by [SCOPE.sChar('target').GetName] lie damaged and demoralized, awaiting our judgement.\n\n[SCOPE.sChar('target').GetPraenomen] [SCOPE.sChar('target').GetHerselfHimself] has been cast in irons, while we decide how we should punish [SCOPE.sChar('target').GetHerHim] and [SCOPE.sChar('target').GetHerHis] co-conspirators for their transgressions against the people of [ROOT.GetCountry.GetName]."
 all_loyalty_civil_war_5:1 "All our own characters acquire #Y 10#! Loyalty."
 civil_war.6.desc:0 "At long last, the brutal struggle with our own nation has come to a close. The remains of the armies once commanded by [SCOPE.sChar('target').GetName], lie damaged and demoralized, awaiting our judgement.\n\n[SCOPE.sChar('target').GetPraenomen] [SCOPE.sChar('target').GetHerselfHimself] has been cast in irons, while we decide how we should punish [SCOPE.sChar('target').GetHerHim] for [SCOPE.sChar('target').GetHerHis] transgressions against the true [ROOT.GetCountry.GetAdjective] people.\n\nThe people have spoken!"
