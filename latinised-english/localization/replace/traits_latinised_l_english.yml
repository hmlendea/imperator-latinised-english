l_english:
 sceptical:0 "Sceptical"
 sceptical_desc:0 "Questioning everything can get tiring, don't you consider?"
 sceptical_bad_tooltip:0 "This option is #Y exclusive#! because your ruler has the #Y Sceptical#! trait."
 poet_desc:0 "[CHARACTER.GetPraenomen] has the gift to express [CHARACTER.GetHerselfHimself] in novel and original ways."
 arbitrary_desc:0 "When it really comes down to it, does anyone really care what is right or erroneous?"
 cruel_desc:1 "Suffering and productivity come hand in hand. That is, according to [CHARACTER.GetPraenomen] at least.\n\nCharacters with this trait will be more probable to #R murder#! their way to the top."
 corrupt_desc:0 "One can go about things in the right way, or the profitable one. [CHARACTER.GetPraenomen] knows the truth of the matter.\n\nCharacters with this trait will be more probable to engage in #R theft#!."
 founder_desc:0 "[CHARACTER.GetPraenomen] has vision the likes of which has not been seen since the days of Solomon, Romulus, or the great Pharaohs of ancient."
 scholar_desc:1 "[CHARACTER.GetPraenomen] simply devours knowledge as it were a hearty meal. It seems to sustain [CHARACTER.GetHerHim] about as much, too.\n\n#G Characters with this trait can generate additional Innovations if assigned to a Study position. This effect can stack.#!"
 lustful_desc:0 "An amorous lifestyle has many benefits, and many drawbacks. [CHARACTER.GetPraenomen] recognises only the former."
 chaste_desc:0 "[CHARACTER.GetPraenomen] considers [CHARACTER.GetHerHis] body an unassailable temple of virtue and honour. So does everyone else."
 proud_desc:0 "Hubris is warned of, in the Greek tales of ancient. It would seem that [CHARACTER.GetPraenomen] never much cared for the theatre."
 humble_desc:0 "A healthy respect for one's possess place in the grand scheme of things, is what keeps [CHARACTER.GetPraenomen] going."
 vengeful_desc:1 "Nothing can stand between [CHARACTER.GetPraenomen] and those that have wronged [CHARACTER.GetHerHim].\n\nCharacters with this trait will be more probable to #R murder#! their way to the top."
 forgiving_desc:0 "No crime, no barbed insult, or any manner of offence, is too great for the clemency of [CHARACTER.GetPraenomen]."
 intelligent_desc:1 "A mind like no other can solve problems beyond our understanding. A mind like no other, can also create them.\n\n#G Characters with this trait can generate additional Innovations if assigned to a Study position. This effect can stack.#!"
 selfish_desc:0 "The most important thing in the world of [CHARACTER.GetName], is [CHARACTER.GetName].\n\nCharacters with this trait will be more probable to engage in #R theft#!."
 deceitful_desc:0 "The truth may be honourable, but, at least according to [CHARACTER.GetPraenomen], it doesn't get you very far.\n\nCharacters with this trait will be more probable to engage in #R theft#!."
 energetic_desc:1 "[CHARACTER.GetPraenomen] invariably puts in double the effort - even when sleeping.\n\nCharacters with this trait will be able to commit certain acts like #R theft#!, #Y gambling#!, and #R murder#!, more frequently."
 reckless_desc:0 "[CHARACTER.GetPraenomen] invariably has a plan. Curiously, it invariably seems to be the same one.\n\nCharacters with this trait will be more probable to engage in #R theft#! or #R pit-fighting#!."
 shrewd:0 "Astute"
 shrewd_tooltip:0 "This option is available because your ruler has the #Y Astute#! trait."
 foolish_desc:0 "The only person unaware of just how gullible [CHARACTER.GetPraenomen] is, seems to be [CHARACTER.GetPraenomen] [CHARACTER.GetHerselfHimself].\n\nCharacters with this trait will be more probable to engage in #R pit-fighting#!."
 gluttonous_desc:1 "Nobody would ever dare accuse [CHARACTER.GetPraenomen] of moderation or self-control.\n\nCharacters with this trait will be more probable to engage in #R theft#!."
 self_controlled_desc:0 "A life of fulfilment, seems to [CHARACTER.GetPraenomen] to lack all sense of purpose."
 loving_desc:0 "A warm heart and kind gaze can invariably be found with [CHARACTER.GetPraenomen]."
 ambitious_desc:1 "Whereas some view the ladder to the top as a challenge, [CHARACTER.GetPraenomen] prefers to see it as firewood.\n\nCharacters with this trait will be more probable to #R murder#! their way to the top."
 suspicious_tooltip:1 "This option is available because your ruler has the #Y Suspicious#! trait.\n\nCharacters with this trait will be much less probable to be #R murdered#! by rivals."
 wise_desc:0 "Simply having knowledge is insufficient; understanding how to apply it, shows true sagacity."
 rash_desc:0 "Choices become a lot less complicated if one rushes blindly past them.\n\nCharacters with this trait will be more probable to engage in #R pit-fighting#!."
 weak_willed_desc:0 "The only thing stopping [CHARACTER.GetPraenomen] from simply laying down to perish, is indecision."
 limp_desc:0 "An ancient pain prevents [CHARACTER.GetPraenomen] from enjoying full mobility."
 invalid_desc:0 "Incapable of more than the most elementary movement, [CHARACTER.GetPraenomen] has to rely on [CHARACTER.GetHerHis] mind for adventure."
 brave_desc:0 "[CHARACTER.GetPraenomen] stares danger in the face, and knows victory.\n\nCharacters with this trait will be more probable to engage in #R pit-fighting#!."
 coward_desc:0 "To [CHARACTER.GetPraenomen], living to fight another day is vastly preferable to death, honourable or otherwise."
 aggressive_desc:0 "Tempered by armed conflict, [CHARACTER.GetPraenomen] sees [CHARACTER.GetHerHis] formations as a shining sword to thrust into the very heart of the enemy."
 miserly_desc:0 "To [CHARACTER.GetPraenomen], affluence is there to be owned; there just invariably seems to be more to collect."
 polymath_desc:1 "There are few subjects upon which [CHARACTER.GetPraenomen] could not wax lyrical.\n\n#G Characters with this trait can generate additional Innovations if assigned to a Study position. This effect can stack.#!"
 obsessive_desc:3 "When [CHARACTER.GetPraenomen] puts [CHARACTER.GetHerHis] mind to a task, [CHARACTER.GetSheHe] could quite forget about anything as trivial as eating, sleeping or at times, breathing.\n\n#G Characters with this trait can generate additional Innovations if assigned to a Study position. This effect can stack.#!"
 harsh_desc:1 "While many would employ a mild punishment to fit a mild crime, [CHARACTER.GetPraenomen] considers mild punishment a crime in itself.\n\nCharacters with this trait will be more probable to #R murder#! their way to the top."
 infection_desc:0 "The early stages of an ailment are the hardest to recognise. Whilst it may prove to be minor, it could also develop into something much more serious."
 blind_desc:0 "Blindness could be inherent at birth, or caused by a number of virulent diseases. In certain cultures, the blind were revered as sacred."
 frail_desc:0 "Frailty could be caused by any number of inherited ailments, and would often affect an individual throughout their life, rendering them weaker than their peers, and often more probable to contract further illnesses."
 depressed_desc:0 "Depression looms like a dark cloud over [CHARACTER.GetPraenomen], even sadness seems to be out of reach. Every action is mechanical; every word uttered, is an act. All [CHARACTER.GetSheHe] recognises, is the emotionless caricature of what it is to live."
 antipatrid_desc:0 "A great friend of Alexander, Antipatros was responsible for safeguarding Macedonia during Alexander's great campaigns. His loyalty to Alexander, and domineering attitude towards the lesser Greek states was tempered by his son, Kassandros, whose contempt of Alexander was no secret, and whose legacy included the founding and restoration of many great urban centres.\n\n#G This trait can be passed on patrilineally.#!"
 argeads_desc:1 "Alexander wept when he heard from Anaxarchos that there was an infinite number of worlds; and when his friends asked him if any accident had befallen him, returned this answer: "Do you not consider it a matter worthy of lamentation that when there is such a vast multitude of them, we have not yet conquered one?"\n\n#G This trait can be passed on matrilineally or patrilineally.#!"
 seleucids_desc:0 "Unlike the other Diadochi, Seleukos was a person of only mediocre importance during Alexander's campaigns. After a string of victories and defeats, Seleukos finally established his domain with the assistance of Ptolemaios Soter, and embarked on a campaign to regain control of the eastern parts of Alexander's empire. Surrounded on every side by titanic powers, Seleukos was, by necessity, a ruthless and cunning leader.\n\n#G This trait can be passed on patrilineally.#!"
 coastal_raider_desc:0 "[CHARACTER.GetPraenomen] shows superlative competence in knowing the ebb and flow of the tide. Such a competence comes in handy when taking advantage of certain underhanded business opportunities."
 seadog_desc:0 "A life at sea is all [CHARACTER.GetPraenomen] longs for. Others may call [CHARACTER.GetHerHim] a buccaneer - but well; they're not far erroneous."
 aeacidae_desc:0 "Aiakos was the grandfather of the greatest Greek hero, Achilles, and king of the island of Aigina in the Saronic Gulf. Neoptolemos, son of Achilles, came to be king of the Molossian Epirotes after he returned from the Trojan Armed conflict, and his descendants have ruled ever since, uniting Epirus and contributing to the legacy of Alexander the Great through his mother Olympias.\n\n#G This trait can be passed on patrilineally.#!"
