l_english:
 party_events_rome.2.t:0 "Elite Requirements"
 party_events_rome.2.desc:0 "The Patricians of the $optimates_party$ faction have become a loud annoying thorn in the side of [ROOT.GetCountry.GetRuler.GetName] lately, as their requirements are often at odds with what is best for the state. Yet again, [optimates_leader.GetName] takes centre stage in the [ROOT.GetCountry.Custom('get_court_type')|U] to hold another droning speech about the requirements of the upper classes of [ROOT.GetCountry.GetName]."
 party_events_rome.2.b:0 "Some steps will be taken to favour the richer citizens in the [ROOT.GetCountry.Custom('get_court_type')|U]."
 party_events_rome.2.c:0 "Hah, let [optimates_leader.GetHerHim] maintain whining."
 party_events_rome.3.desc:0 "Of all the groups in the [ROOT.GetCountry.Custom('get_court_type')|U], the $boni_party$ have a tendency to be stuck in the past, refusing to give up long held rights and traditions unless they are forced to do so. Every now and then [boni_leader.GetName] brings up something novel that is supposedly an affront to [ROOT.GetCountry.GetPrimaryCulture.GetName] traditions, and naturally most of these subjects are at odds with [boni_leader.GetHerHis] personal investments as well.\n\nUnder the leadership of [boni_leader.GetPraenomen] the $boni_party$ faction has come more and more into opposition to the leadership of [ROOT.GetCountry.GetRuler.GetName], and similarly their requirements are growing increasingly more ludicrous."
 party_events_rome.4.a:0 "With their aid, we can mobilise the people of [ROOT.GetCountry.GetName]."
 party_events_rome.5.desc:0 "The Patricians have been fawning over our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName], as [ROOT.GetCountry.GetRuler.GetSheHe] is one of their own and has enacted a lot of [ROOT.GetCountry.Custom('get_court_type')|U] policies favouring them. [ROOT.GetCountry.GetRuler.GetSheHe|U] will be able to make good use of the resources and contacts the $optimates_party$ have built up over generations, to gain more support for our leadership of [ROOT.GetCountry.GetName], and limit some of the more problematic richer elements of our nation."
 party_events_rome.6.desc:0 "As we have cultivated and taken care of our ancient heritage, we have become deeply popular among the members of the $boni_party$ faction. Their appreciation for these ancient traditions run deep, and they quickly turn to support any would-be [ROOT.GetCountry.GetRulerTitle] who can see eye to eye with them.\n\n[boni_leader.GetName] is often found talking to [ROOT.GetCountry.GetRuler.GetName], and the two seem to have a lot in common. Lately, [boni_leader.GetPraenomen] has shown an interest in restoring an ancient festival to the streets of [ROOT.GetCountry.GetCapital.GetName]."
 party_events_rome.6.b:0 "We will request them to share of their affluence for the good of the nation."
 party_events_default.1.desc_1:0 "The [ROOT.GetCountry.GetAdjective] so-called [second_party.GetParty.GetName] are deeply unsettled by the decisions of the current government, who they see as ignoring and even acting versus the best interests of their stratum.\n\nIn order to placate [second_party.GetHerHis] politicians and supporters, [second_party.GetPraenomen] is demanding that we make some concessions as a show of our willingness to heal these divisions."
 party_events_default.1.desc_2:0 "The coalition of [second_party.GetParty.GetName] led by [second_party.GetPraenomen] is at their wits end, and now requirement that the recent direction of [ROOT.GetCountry.GetAdjective] politics be rectified with a hard turn towards the interests of the commoners.\n\nSome concessions would show the people that the government of [ROOT.GetCountry.GetName] has not forgotten them, and go some way to patching the trust of the [second_party.GetParty.GetName]."
 party_events_default.1.desc_3:0 "The [second_party.GetParty.GetName] of the [ROOT.GetCountry.Custom('get_court_type')] have tolerated the novel direction of [ROOT.GetCountry.GetAdjective] politics for some time, but today their leader [second_party.GetPraenomen] at last declared that the contumelious attitude towards the sacred traditions of our ancestors has gone too far.\n\nThey requirement concessions which will undo the worst excesses, restoring and ensuring the proper reverence for our priesthood and ancient customs."
 party_events_default.1.a_3:0 "Look here on these coins, and consider again."
 party_events_default.1.b_1:0 "They do not request so much."
 party_events_default.1.c_3:0 "We will not let reactionary nonsense undo our hard labour."
 party_events_default.4.b:0 "Come now, we must labour together."
 party_events_default.5.desc:0 "The tenure of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] has been marked by the overarching presence of [rulers_party_leader.GetName], the most eminent member of the same [ROOT.GetCountry.GetRuler.GetParty.GetName] party [ROOT.GetCountry.GetRuler.GetPraenomen] represents.\n\nIt seems [rulers_party_leader.GetPraenomen] is unable to bare being obscured, even temporarily, by another member of the [ROOT.GetCountry.GetRuler.GetParty.GetName]. [rulers_party_leader.GetSheHe|U] has approached the [opposition_party.GetParty.GetName], seeking to extinguish the flame of [rulers_party_leader.GetHerHis] peer as revenge for the perceived slight of oneupmanship..."
 party_events_default.7.desc_1:0 "The recent decisions of our government, and [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] in particular, have left the supporters and representatives of the [ROOT.GetCountry.GetRuler.GetParty.GetName] happier than ever; safe in the knowledge that their concerns are being heard and acted upon.\n\nThere are many among the [ROOT.GetCountry.GetRuler.GetParty.GetName] who would now be willing to repay our kindnesses with their own, though it may be more beneficial to use this opportunity to address the most pressing requirements of the other political factions."
 party_events_default.7.desc_2:0 "The tenure of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] has been marked by wide satisfaction among the people and their representatives in the [ROOT.GetCountry.GetRuler.GetParty.GetName].\n\nThis breathing room could be used to ensure good relations with the opposition, though the elation of the [ROOT.GetCountry.GetRuler.GetParty.GetName] might be place to more productive uses..."
 party_events_default.7.desc_3:0 "Though it is hard to believe - given their renown as curmudgeons - the [SCOPE.GetRootScope.GetCountry.GetRuler.GetParty.GetName] of [SCOPE.GetRootScope.GetCountry.GetName] are overwhelmingly content with our government and its preservation of the status quo.\n\nSo content in fact, that many see this is an opportunity to call in some favours while the going is good, though others argue we should ensure the other factions do not resent our successes."
 party_events_default.7.a_1:0 "We request some favours in kind."
 party_events_default.7.a_2:0 "There are some favours we require."
 party_events_default.10.desc:0 "Our current [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetPraenomen], heads both the [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] dynasty and the [ROOT.GetCountry.GetRuler.GetParty.GetName] faction in the [SCOPE.Custom('get_court_type')], garnering [ROOT.GetCountry.GetRuler.GetHerHim.] a reputation for putting [ROOT.GetCountry.GetRuler.GetHerHis] possess family's interests ahead of the state's in important matters.\n\n[party_hof_opposition.GetPraenomen] is an equally prominent politician representing the [party_hof_opposition.GetParty.GetName] clique, and has brought [party_hof_opposition.GetHerHis] accusations of nepotism and corruption involving the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] fold to the floor of the [SCOPE.Custom('get_court_type')], citing their dominance as a menace to the republic."
