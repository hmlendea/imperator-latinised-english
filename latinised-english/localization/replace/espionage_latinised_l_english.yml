l_english:
 country_diplomacy.43.desc:0 "Grinning like a proud lion, a gruff warrior throws a dishevelled [SCOPE.sChar('spy').GetWomanMan] at the feet of our benevolent ruler. Elaborating, he details the manner in which [SCOPE.sChar('spy').GetPraenomen] was found eavesdropping on vital bureaucratic meetings of the utmost secrecy.\nAfter a studious interrogation, it transpires that [SCOPE.sChar('spy').GetPraenomen] was dispatched on a mission of espionage by the wicked [SCOPE.sChar('spier').GetAdjective] elite.\n\nWe are left with a simple choice: evict the culprit with only bruises to show, or dispatch a much more sinister message."
 country_diplomacy.43.b:0 "Demonstrate leniency... this once."
 country_diplomacy.44.desc:0 "In a display of cruel arrogance, the [SCOPE.sC('spied_upon').GetAdjective] elite have put our loyal subject, [SCOPE.sChar('spy').GetName], to death.\n\nPerhaps, ultimately, this was no considerable loss, as [SCOPE.sChar('spy').GetSheHe] does not appear to have been a very good spy anyway."
 country_diplomacy.45.desc:0 "Bedraggled, weary, and spouting all manner of curse, [SCOPE.sChar('spy').GetName] has returned to [ROOT.GetCountry.GetName]. It transpires that [SCOPE.sChar('spy').GetSheHe] was discovered eavesdropping on an important council meeting, attempting to collect information to aid us.\n\nUnfortunately, [SCOPE.sChar('spy').GetHerHis] tale of failure was uttered in front of the collected nobles of our [ROOT.GetCountry.Custom('get_court_type')], resulting in a distinctly unpleasant atmosphere thereafter."
 country_diplomacy.46.desc:0 "News has reached us that our spy in the midst of the [SCOPE.sC('spied_upon').GetAdjective] bureaucracy has mysteriously vanished. We can only presume that we shall not be seeing them again, knowing the reputation of the wicked [SCOPE.sC('spied_upon').GetAdjective] rogues."
 country_diplomacy.48.desc:0 "$espionage_shenanigans_opener$[spy.GetSheHe|U] has stumbled across a chance to disrupt the orders and supplies of the [spied_upon.GetAdjective] [sabotage_army.GetName] via their stylus-pushers - if we can supply the necessary means..."
 country_diplomacy.48.c:0 "How could this occur?!"
 country_diplomacy.49.desc:0 "$espionage_shenanigans_arrest_opener$\n\nUpon being searched it became clear they were planning to disrupt the orders of our armies in the field via false messages and confusion.\n\n$espionage_shenanigans_arrest_closer$"
 country_diplomacy.50.desc:0 "A furor has erupted in the logistical offices, where a series of confusions, contradictory orders, and outright misdirections have disrupted the organisation and thus confidence of the [sabotage_army.GetName].\n\nIt is arduous to fathom that such a disturbance can be lain at incompetence's feet alone; we must consider the possibility of deliberate sabotage by foreign agents, and our [spier.GetAdjective] enemies would appear to be probable culprits."
 country_diplomacy.52.desc:0 "$espionage_shenanigans_opener$[spy.GetSheHe|U] has discovered the whereabouts of secretive documents recording innovative designs and ideas from the most magnificent [spied_upon.GetAdjective] minds, proposing the theft of such knowledge would aid [spier.GetName] considerably. "
 country_diplomacy.53.desc:0 "$espionage_shenanigans_arrest_opener$\n\nThey were accosted mid-somersault, clearly attempting to obtain entrance to the private libraries which store the scribal notes of our most esteemed thinkers and engineers.\n\n$espionage_shenanigans_arrest_closer$"
 desc_espionage_army_sabotage_modifier:0 "Our bureaucratic organisation has been infiltrated by unscrupulous enemies, who have attempted to derail this army's command and control."
 espionage_shenanigans_arrest_closer:0 "Our advisors believe they must have been dispatched by [spier.GetName], but there is no proof."
