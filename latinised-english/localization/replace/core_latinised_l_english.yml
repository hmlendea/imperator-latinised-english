 event_target_desc:0 "A scope can be saved as an "event target". It will then be accessible to from any trigger/effect that can be "traced in reverse" in a direct line to the point where you saved the event target (i.e. any triggers that are checked or effects that are fired after saving the event target, but only in a continuous chain, such as an event chain). If an event chain concludes, the event target is lost.\nNote that a number of on_actions set up by code, and a number of special interactions, come with their own predefined event targets.\nFinal note: You can also save values and bools as event targets, which might be handy in certain situations."
 variable_desc:0 "Script variables are accessible and modifiable by script. They currently come in the subsequent forms:\n\nvariable:example_number = 1\nvariable:example_flag = flag:example\nvariable:example_scope = root\nvariable:example_bool = yes"
 flag_desc:0 "Flags are simple markers that you can use to identify that something has occurred in the game. They have a specific type depending on what type of scope it was set in (character flag, scheme flag, et cetera). The particular scope (for example a particular character) will have the flag set until it is eliminated by an effect, or until its timer runs out, if a timer was defined for it."
 EVENT_REASON_SKILL:0 "$SKILL|Y$ Competence"
 SKILL_AVERAGE:0 "Typical"
 THE_WORLD_TOOLTIP:1 "#T Current Date#!\nAVC stands for Ab Urbe Condita, or 'From the Founding of the City', is a dating convention frequently used by scholars in reference to Rome and Roman history, and establishes AUC 1 as the year of the founding of Rome. The year AUC 450, consequently, corresponds to 304 BC in the modern Gregorian calendar."
 military_building_desc:1 "The agrarian nature of the early ancient world necessitated seasonal military campaigns, during the summer months between the planting and harvest seasons. Every year the citizens would muster in a field outside the city limits, such as the Agorai of the Greek city states or the Campus Martius of Rome, in preparation for that year's armed conflict against their neighbours."
 fortress_building_desc:1 "The construction of stand-alone fortresses was not that prevalent in the classical world, but the construction of walls to protect entire urban centres, such as the Servian Wall in Rome, or constructing a fortified citadel on its acropolis, such as the fabled Seven-Gated Wall of the Kadmeia of Thebes, was quite widespread. The most famous fortification work of the Hellenic world was the Long Walls of Athens, which connected Athens itself with its port Peiraieus."
 commerce_building_desc:1 "Early marketplaces were informal phenomena, frequently appearing in the fields outside a city, primarily focused on places where people congregated. As city-states developed, these Agorai frequently expanded into the centre for commercial, religious, political, and cultural life; the beating heart of any city. The Greek Agora even influenced the configuration and the significance of both the Roman Fora and the Carthaginian marketplaces."
 population_building_desc:1 "The issue of storing food-stuffs from one harvest to the next is as old as agriculture itself. Various ancient cultures came up with solutions to storing grain over long periods while maintaining it dry and pest-free; from the elevated floors of Roman Granarium, the excavated pits of the Greek Silo, to the Egyptian use of cats to maintain pests under control. Long-term storage of grain facilitated a food surplus, a prerequisite for population expansion, and eventually civilisation itself."
 workshop_building_desc:1 "The use of small-scale hand-powered mills in the home has been around since the inception of human agriculture. Larger versions can be powered by draught-animals. The later invention of the watermill facilitated their use in mining and construction as tools for crushing ore and cutting wood and marble. Watermills generally decreased reliance on human and animal powered labour, substantially increasing productivity and efficiency in the production of unprocessed materials."
 library_building_desc:1 "The earliest known library was the Hittite collection of cuneiform tablets in Hattusa from 1900 BCE, but large institutional libraries became more prevalent in the 3rd century BCE. They were frequently archives for empires or kingdoms, but also for religious institutions, or attached to institutions of higher learning. The largest and most famous library of the ancient world was the Great Library of Alexandria, which may have contained up to 400,000 texts at its height. The destruction of the Great Library is considered as one of the greatest tragedies of the ancient world."
 town_hall_building_desc:1 "Every government requires a treasury to house the funds necessary for a functioning state-apparatus, such as public construction projects or troop wages. The treasury of ancient Rome, the Aerarium Populi Romani, was located in the Temple of Saturn on the Forum Romanum, which also housed legionary standards, senate decrees, and the statutes of Rome engraved on brass tablets. The funds were mainly from tax revenue, collected by the Publicani, Roman Equites who had won contract bids for the right to farm taxes in a specified province."
 theathre_building:1 "Grand Theatre"
 theathre_building_desc:1 "Early Greek theatre was a relatively simple affair, with a choir and masked actors performing in front of the Skene, a structure that served as a backdrop, and seats constructed into a hillside. The Romans adopted the Greek architecture for their theatres, but constructed them as free-standing structures, which in turn permitted them to construct completely circular theatre structures, or amphitheatres. Due to the different acoustic effects of normal semi-circular theatres and amphitheatres, they tended to host different types of events. Theatres would host plays, pantomimes, and speeches, while amphitheatres, such as the famous Amphitheatrum Flavium, would host gladiatorial combats, races, or sometimes, as in 80 CE, reenactments of naval battles, Naumachiae."
 court_building_desc:1 "The most prevalent form of Roman litigation during the Republic, Legis Actiones, Actions of Law, involved a formal hearing in front of a magistrate, upon which a judge was agreed upon by both parties. The judge had to be a Roman citizen of senatorial rank, and was selected from a list called the Album Iudicum, but did not require any legal training or expertise. After this the trial was held in a public place, usually the Forum Romanum, during which either side could be represented by an advocate. At the conclusion, the judge would rule in whatever manner seemed most just."
 academy_building_desc:1 "The first academy was founded by Plato in the early 4th century BCE, on a property he possessed on the Akademeia, a hill outside Athens, where there was a grove of olive trees dedicated to Athena, goddess of wisdom. Plato lectured and posed problems to the Academy's members. Later, his student Aristotle would found the Lyceum, his own academy in Athens proper, where Aristotle would pass on his philosophy, and where he founded a library. Both schools were destroyed by Lucius Cornelius Sulla in 86 BCE during his siege of Athens."
 temple_building_desc:1 "Temples are religious spaces, frequently structures containing a shrine, dedicated to a deity. These could frequently have secondary functions beyond the religious, such as the Temple of Saturn in Rome doubling as the state treasury, the olive grove dedicated to Athena at the Akademeia being the site of Plato's academy, or the Campus Martius, the Field of Mars, being the site of annual Roman military muster. Even the Roman senate had to convene in a space dedicated to the gods. The most famous ancient temple is probably the temple of Athena, the Parthenon, in Athens, the ruins of which can still be seen today."
 foundry_building_desc:1 "In Ancient Rome, Fabricae or Officinae were ateliers or manufactories that worked in hard materials like metal and stone. Officinae Armorum, armouries, would produce arms and armour, but such smithies could also produce iron nails and fittings for use by ship-wrights and in construction. In the later Imperial period, state-operated Fabricae would produce arms and armour for entire legions. Hephaistos, the Greek god of fire and smithing, operated an armoury, where he forged the legendary arms and armour of the gods."
 aqueduct_building_desc:1 "Although most associated with Rome, aqueducts are believed to have appeared first on the Indian subcontinent. In Greece also, constructions such as the Epaulinian Aqueduct on Samos, which brought fresh-water to Pythagoreion, are from as early as the 6th century BCE. Aqueducts would bring fresh water to urban centres and to the countryside for irrigation from faraway rivers. The longest known aqueduct from antiquity is the Aqueduct of Valens, constructed in Constantinopolis in the 3rd to 4th century CE and brought water from over 250 kilometres away. The entire structure was over 400 kilometres in length."
 port_building_desc:1 "Rapidly and dependably docking and launching vessels was best attempted in naturally sheltered harbours, the presence of which spelled the success of numerous ancient urban centres along the Mediterranean coast. However, man-made harbours were also constructed when the necessity arose, utilising moles and seawalls to tame the waves. Perhaps the most famous of these is the great Portus of Ostia which supplied Rome with grain despite the strong winds at the Tiber's mouth, though they became increasingly prevalent in every part of the empire."
 latifundia_building_desc:1 "In the ancient world, citizenship and military service was tied to land possession. Only land owners had the privilege of suffrage, and a duty to perform military service. Over time, more and more land was purchased by the more affluent classes, and accumulated farmland into larger estates, in Latin called Latifundia. These estates were worked by slaves, and grew primarily cash crops, which were more valuable than food."
 slave_mine_building_desc:1 "Mining has been part of human civilisation for millennia. Mines facilitate more effective ore extraction than surface mining, as one can reach deeper ore deposits with less effort. The oldest mining complex in the world is believed to be in Nazlet Sabaha, north of Luxor, along the banks of the Nile, which is believed to have been excavated 50,000 years ago."
 basic_settlement_infratructure_building_desc:1 "After the appearance of agriculture, somewhere between 11,000 and 9,500 BCE, the first large-scale farming settlements appeared in the Fertile Crescent circa 9,000 BCE. The common pooling of resources provided human societies the liberty to specialise, and branch out into other areas of production, like smithing, carpentry, and commerce, but also prefaced the development of arts and culture, such as poetry, theatre, and learning. A robust agricultural surplus is essential to the development of human civilisation."
 local_forum_building_desc:0 "In Republican Rome conquered territory was divided into provinces, and administration of the provinces was left in the hands of Roman magistrates with Imperium. Generally these provinces had an high level of self-governance, and the governor only intervened in matters that directly pertained to the Roman state, such as taxation and presiding over judicial trials involving Roman citizens. One of the symbols of a magistrate's Imperium was the curule chair, which could be folded up and transported to wherever the magistrate was needed to perform his duties."
 barracks_building_desc:1 "While on the march, Roman legions would construct semi-fortified camps called Castra. These were little more than palisades encircling their camps with a moat excavated. They would be dismantled every morning, and reconstructed in a new location in the evening. When the legion constructed winter quarters, the Castra would be upgraded with enhanced fortifications and more amenities. Frequently in the more remote provinces, as a permanent military presence was established, the palisades and tents of the winter quarters would be replaced with stone structures to house the provincial legions assigned to the governor."
