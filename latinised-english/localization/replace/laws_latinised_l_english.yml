l_english:
 lex_acilia_repetundarum_desc:1 "The 35 tribes of the Tribal Assembly were composed of citizens residing in distinct geographic areas. It voted, like the Curiate assembly, on matters legislative; providing endorsement and authority on numerous decisions."
 lex_cassia_de_senatu_desc:2 "The military arm of the Roman democratic system, the Centuriate assembly was weighted by the material affluence of the soldiers of which it was comprised. The practical result was a particularly elitist legislative body."
 lex_calpurnia_desc:2 "The powers of the people grow too magnificent; we must limit their influence in the political sphere by increasing Senatorial powers even further..."
 lex_ogulnia_desc:0 "The status of the Plebeians was a cause of magnificent concern in republican Rome. By admitting them as valid members of the priesthood despite the concerns of the priests themselves, a clear message of inclusion was sent."
 lex_aelia_et_fufia_desc:1 "A niche, but important law, the Lex Aelia et Fufia put an end to the practice of unfavorable omens conclusion political discussion. This limited the power of those responsible for taking the omens, allowing for more equal political discourse."
 lex_terentia_cassia_desc:0 "The burden of safeguarding a growing state requires special attention to the supply of food for the people. Instituting tax and legal exemptions for foreign merchants willing to supply grain should encourage a healthy exchange in vital supplies."
 lex_claudia_desc:0 "Possibly aimed at curbing the private affluence of senators, the Lex Claudia prohibited senatorial families from owning trade ships above a certain capacity. The effects of this law were considerable, and played a large part in regulating profiteering behaviour amongst wealthy citizens."
 lex_papia_desc:0 "This law set out to challenge false claims of citizenship, with the ultimate aim of deporting foreigners from Rome. Archias, the mentor of Cicero, was famously tried under this law, an act which caused Cicero to write his labour, 'Pro Archia Poeta', in Archias' defence."
 lex_fufia_caninia_desc:0 "A simple limitation of the ratio of owned to liberated slaves that any man might possess, ensured that the a slave economy was still viable in the late Republic."
 lex_aelia_sentia_desc:0 "The manumission of slaves became so increasingly prevalent in Rome, that a law was enacted to put limitations on how manumitted slaves were to act, and what heights they might climb to by denying liberated slaves the right of citizenship."
 cassian_reform_desc:1 "The Cassian reform was passed in the early days of the republic, setting the stage for Roman policy for years to come. By seizing all conquered land acquired during conquest, and selling it to wealthy patricians, armed conflict became a lucrative business."
 lex_porcia_desc:1 "As the Republic grows so does the require for a larger and more well trained levy. The Census is a good base for how to alot roles in the levied citizens in the army but age should play an almost as important role."
 punic_reforms_desc:1 "Levied citizens are at the core of Roman Republican society and this system must remain the main part of our armies. Nonetheless wars versus Carthage and Macedon highlights the need to lighten the ancient recruitment rules, allowing even those with little to no property to serve. Likewise the levy must to be suplemented by a more lasting force, invariably ready to hurry to do the senate's bidding."
 marian_reforms_desc:1 "The Marian reforms drastically overhauled the organisation and recruitment policies of the Roman republic. Requirements for entry into the army were largely abolished, and the now ineffective manipular system was restructured, resulting in permanent cohorts consisting of professional soldiers."
 senatus_consultum_ultimum_desc:0 "Intended to safeguard the republic in times of desperate require, the 'Final Decree of the Senate', was a reform of the older system of dictatorship, whereby one man would receive absolute authority over matters of state. This backfired disastrously when the senate invoked this decree versus Caesar, who, ironically, claimed to view the decree as proof that republican ideals were in danger of being overthrown."
 princeps_civitatis_desc:0 "After the bitter Triumvirate conflicts, the adopted son of Caesar, Gaius Octavius, later known as the first Emperor of Rome, reformed the very nature of the republic. Whilst in practice he held authoritarian control over a state in turmoil, he referred to himself as Princeps Civitatis, or, 'First Citizen', as he set concerning creating the legal framework for an empire that spanned nearly 500 years."
 republic_corruption_1_desc:1 "Passing legislation via an august body made up of all citizens, is sure to convince everyone that our government is a fair and unbiased institution."
 republic_corruption_3_desc:1 "Our military must have a robust voice in government, acting as our sounding-board for matters of conquest and relevant legislation."
 republican_religious_1_desc:0 "Since time immemorial, our ancestors practiced the ancient ways in their own manner. We should encourage traditional observance of our sacred duty."
 republican_religious_2_desc:0 "Priests have invariably held a position of authority over spiritual matters in our nation. Extending this to invite their authorised political participation in state matters, is logically, the next step."
 republican_religious_3_desc:0 "Religious interference in political matters is no longer desired; our holy men should be out amongst the people, bolstering them in times of require."
 republican_religious_4_desc:0 "Giving the senate the last say on candidates for religious offices, allows us to use these important roles as political stepping stones to higher positions. Sadly, this frequently encourages the less pious to seek appointment."
 republican_mediterranean_1_desc:1 "Feeding the people has been a struggle since the early days of civilisation. Actively encouraging traders to flock to our ports may help to sustain our growing territories."
 republican_mediterranean_3:0 "Institute Affluence Levy"
 republican_mediterranean_4_desc:0 "Piracy is an ever-present menace encircling our coasts; the common folk clamor for relief. By planning a coordinated set of mandates designed to put an end to piracy, we can relieve some of the pressure."
 republican_integration_3_desc:0 "For too long, we have remained undecided on the subject of the conflict between nobility and common folk. It is time we rejected the arguments in favour of the commoners, who are ignorant enough to see our historic state fail."
 republican_integration_4_desc:0 "A decentralized state is frequently an effective way of keeping rebellious behaviour localized. Whilst it may affect certain aspects of our government negatively, the benefits of this path are sure to outweigh them."
 republican_citizen_1_desc:0 "The struggle between the lower and upper classes has long been a defining feature of our civilisation. Whist it may be a mere platitude, confirming the rights of all free men as regards trials, conviction and debt slavery, will appease numerous."
 republican_land_reform_1_desc:0 "The primitive ways of our neighbours are well known. By proclaiming our superiority openly, it will hardly come as a surprise that we wish to take lesser peoples under our wing. For protection, of course."
 republican_land_reform_2:0 "Military Outpost Policy"
 republican_recruitment_1_desc:1 "There is democratic continuity in the privilege of the vote being accompanied by an obligation to serve. This also means there is a danger to lowering the bar for either of these things. We must ensure that only those with sufficient means or competence can serve in our armies, and participate in our state. Our warriors are in good company, knowing that their commanders and brethren are all of the upper echelons of society."
 republican_recruitment_2_desc:1 "Our soldiers have long been used to providing their own armour and weaponry, however, this amendment would see them provide or otherwise pay, for supplies and training. Ensuring the availability of equipment means we can create a core professional army to supplement the citizen levies we have relied on in the past."
 republican_election_2_desc:0 "Sometimes, one term is just insufficient for our magnificent leaders to achieve what they set out to do. It has become clear that we must consider extending their tenure, that we might reap the benefits of our benign leader's sagacity."
 no_exchange_laws_desc:0 "Our people have existed for eons without any formal means of arbitrating a exchange. We see no reason to impose a change upon them."
 barter_economy_law_desc:0 "Domestic exchange is a subjective matter. As long as all parties are content with the deal, then we see no reason to step in. Nonetheless, we should legislate for a system of good practice when in engaging in bartered trades. Such agreements are notoriously difficult to tax, however."
 foreign_exchange_law_desc:0 "The unusual system of currency which our neighbours practice, is gaining a foothold amongst the wandering merchants in our lands. Adopting foreign coin as a recognised method of payment seems only logical."
 coin_minting_law_desc:0 "Foreign coins are swiftly becoming the most valued form of currency within our land. To have any form of legitimacy in the eyes of our neighbours, we must initiate our own program of coin minting."
 tribal_religious_freedom_law:0 "Religious Liberty"
 tribal_religious_freedom_law_desc:1 "The numerous gods, aspects, and pantheons worshipped by different people in our country are of no concern to our emerging state. The liberty to select how and whom to worship should remain a core tenet of our society."
 adopt_human_sacrifice_law_tribal_desc:0 "The power of an omen, our holy ones inform us, is directly related to the value and power of the sacrifice made in its name. By offering up those we capture in battle, we are sure to reap rewards eternal."
 hybrid_gods_law_desc:0 "Too numerous fragmented belief systems are becoming a problem for our holy people. The influx of foreign beliefs should be welcomed, perhaps even taking a place in our own emergent pantheon."
 right_of_might_law_tribal_desc:1 "Our chiefs and elders should be responsible for distributing the property and affluence of fallen kin - only in this manner will we safeguard the future of our tribe."
 tribal_sumptuary_law_desc:0 "The taking of slaves, affluence and property, is a practice our warriors revel in. Nonetheless, if we are to be seen as a civilised people by our peers, we should step in a limit the magnitude of these excesses."
 formalized_industry_law_tribal:1 "Formalised Agriculture"
 formalized_industry_law_tribal_desc:1 "Agriculture and the working of mines is hard labour, and best performed by those of low regard in our society."
 personal_loyalty_law_desc:0 "Although our kinsmen view each other with trust and admiration, their personal loyalties lie with close family and friends. This may make for a more peaceful, rural lifestyle, but if we hope to construct a magnificent nation, we may have to abandon this fragmented existence."
 institute_right_to_be_heard_desc:0 "Despite the burden it may place on our officials, giving all recognised members of our society the right to appeal to the greater clan council, gives all those within our realm a greater sense of equality, fairness, and security."
 absolute_authority_desc:0 "Having seen the authority wielded by some of our neighbouring rulers, it becomes apparent that the head of our nation must seek to create greater executive powers amongst the disparate tribes."
 tribal_identity_law_desc:0 "Our people are, in truth, the offshoot of varied lines. As such, we share a common bond with many of our neighbours, and should seek to keep lines of communication open wherever possible."
 hearthlaw_desc:0 "By making it our custom to welcome any who seek shelter at our fires, we might obtain a distinct respectability and honour amongst friend and adversary alike."
 declaration_of_hegemony_law_desc:0 "It will be considered a audacious move, but by declaring hegemony over our uncivilized neighbours, they, and our people alike, will believe in our cultural supremacy."
 corule_law_desc:0 "The counsel of our clan chiefs is invaluable, we should ensure that our council invariably has enough space to accommodate valuable additions."
 closed_court_law_desc:0 "Our wise ruler and council are far too valuable to be permitted to fraternize with common folk. Let us ensconce them safely within the walls of our capital, lest naysayers discover their ears."
 tribal_centralized_laws_1_desc:0 "We expect our edicts and laws to be passed concerning by word of mouth. Sometimes, the ancient ways are the best ways."
 tribal_centralized_laws_2_desc:0 "By appointing representatives in each of our population centres; each with the power to officiate on local matters, we extend our authority to a magnificent degree."
 tribal_centralized_laws_3_desc:0 "Formalizing a static framework of officials will encourage our people to labour within the confines of our decree."
 tribal_decentralized_laws_1_desc:0 "It is widely known that travellers from far and wide can discover respite at our camps. We tolerate this, for now."
 tribal_super_decentralized_laws:0 "Conflict Philosophy"
 super_decentralized_law_one_desc:0 "The promise of loot and pillage is frequently enough to attract warriors of all stations."
 super_decentralized_law_two_desc:0 "Our society must make a place for itself via the industrious labour of those less fortunate than ourselves. The taking of slaves must be made a priority."
 super_decentralized_law_three:0 "Honour in Battle"
 super_decentralized_law_three_desc:0 "The only true honour comes from the defeat of a robust opponent. In armed conflict, we construct a tradition and spirit the likes of which the world has never seen."
 agnatic_succession_law_desc:0 "Agnatic succession dictates that the eldest male child invariably inherits the throne. This is a simple and ancient system, but can frequently result in young monarchs, bloody politics, and a lack of viable successors."
 agnatic_seniority_succession_law_desc:0 "Agnatic Seniority is rarer form of patrilineal succession, in which the reigning monarch's younger brothers are higher in the order of succession than his sons. This can frequently result in huge webs of rivalry and myriad claimants to the throne."
 egyption_succession_law_desc:1 "In this manner of succession, the eldest child of the ruler will be the primary heir, regardless of gender. In order to secure a robust, legitimate bloodline, however, it becomes commonplace for royal siblings to intermarry, thus avoiding any chance for the lineage to be sullied."
 established_courts_for_landholders_desc:0 "A common practice to appease smallholders, involved setting up a series of district courts to handle domestic disputes. Known as dicasteries to the Greeks, these were frequently established in foreign lands as a matter of course."
 encourage_debt_slavery_desc:0 "The practice of debt slavery is truly an evil, but one required both to keep the lower classes in line and to fulfil our require for basic labour."
 increased_citizenship_quotas_desc:0 "As our state grows ever larger, it becomes apparent that we are unable to rely solely on ancient and noble families to make up the lofty echelons of society. Relaxing the requirements to obtain full citizenship, however, may fury those lucky enough to already possess it."
 local_investment_policy_desc:0 "It may be a significant investment, but the improvements offered by a detailed program of public works, including sanitation, living conditions, and meeting places, will boost development in our urban centres."
 elevate_monarch_monarchy_desc:0 "Few can deny the godly stature of our long lineage of rulers. The power and authority they wield, have become things of legend; even our neighbours are in awe. It is only right that we proclaim what we have long suspected: that our rulers are equal to gods themselves!"
 slave_oarsmen_desc:2 "The sea is the domain of merchants and fishermen. We have no require of a more centralized maritime policy."
 paid_crews_law_desc:0 "While slaves make good menial labour, crewing our vessels with paid labourers ensures that we will invariably have the highest quality crews, no matter the cost."
 free_ports_monarchy_law_desc:0 "The seas bring fortune, as well as misery. By declaring that our state rescinds all protection to traders, we may see in an increase in piracy, but also in profits. We don't care who brings us exchange, only that it gets here."
 transaction_tax_monarchy_desc:0 "By requiring all transactions above a certain value to record the details of what goods changed hands, we can commence to tax all profits made."
 vast_bureaucracy_desc:1 "By demanding that all governors submit important documentation to a military adjunct, we will maintain order - albeit via fear."
 mercenary_reliance_desc:0 "Our nation, rolling in affluence, has become a haven for foreign soldiers looking for labour. Why should we risk our own people in defence of our home, when others will fight for us?"
 reminting_policy_desc:0 "Now that we are able to, we should decree that all ancient coins in our nation must be handed in and re-minted with our own ruler's likeness, both increasing our authority, and re-balancing our currency."
 royal_bureaucracy_desc:0 "Via institutional continuity and a robust martial heritage we will create a kingdom where our dynasty is so ingrained that the very thought of this country functioning without us will be impossible."
 monarchy_religious_mandate_military_desc:0 "Our priests are an ideal conduit for the promotion of our national ideals. Some might have trouble ever viewing the magnificent unwashed as legitimate members of society, however."
 humility_status_law_desc:0 "Kings we may be, yet a grounding in reality avoids us comparisons to the hubris of the legends of ancient. Our people respect our humility and beneficence."
 trusted_beyond_measure_desc:0 "Our duty is to care for those weaker than ourselves. Enshrining these priorities in law, is but the first step towards structure a relationship of mutual respect."
 elective_succession_law_desc:0 "None alive remember the age of elected kings, yet rumours reach us of a system rich in equity and fairness once championed by the Greeks. With a system of elective succession, we might avoid the bitter power struggles that plague our neighbours."
 can_always_nominate_heirs:0 "\nMonarchs can invariably #Y Nominate#! an Heir."
 relaxed_recruiting_standards_desc:2 "The nobles of the realm are the font upon which the kingdom is built. Be they magnificent Magnates or minor Barons, they are all obligated to answer our call to arms, levying troops from the peasants as well as calling upon their own retainers."
 recruit_from_nobles_desc:1 "The privileged cultures in our kingdom are given numerous privileges and enjoy representation in government. In return they are obligated to all do military service when the state so requires. In return for their service any soldier will recieve an alotment of land to support them."
 work_for_the_best_desc:2 "A magnificent kingdom such as ours cannot rely solely on levied troops to support the expansive foreign policies of the realm. A permanent and well drilled royal guard is not just a luxury that a monarch might use to impress lesser kings, it is instrumental to bending the world to our will."
 standing_army_law_desc:0 "For a magnificent empire it is necessary to maintain not just one but several permanent forces, both to support our foreign policy and to police and defend the realm versus intruders."
 elevate_prophet_monarch_monarchy_desc:0 "Few can deny the stature of our rulers, who emulate the magnificent Kings of ancient as told in the Scriptures. The power and authority they wield have become things of legend; even our neighbours are in awe. It is only right that we proclaim what we have long suspected: our rulers have been anointed by God's hand, and their words have the strength of the ancient prophets!"
 standing_army_great_power:0 "Has #Y Magnificent Power#! status."
