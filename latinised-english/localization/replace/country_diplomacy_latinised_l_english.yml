l_english:
 country_diplomacy.1.t:0 "Friends Across Frontiers"
 country_diplomacy.1.desc:0 "Our [SCOPE.sCharacter('friendly_character_root').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('friendly_character_root').GetName] has friends far outside our frontiers, frequently attempting to use [SCOPE.sCharacter('friendly_character_root').GetHerHis] network to the advantage of our nation. [SCOPE.sCharacter('friendly_character_root').GetSheHe|U] believes [SCOPE.sCharacter('friendly_character_root').GetHerHis] friendship with the [SCOPE.sCharacter('friendly_character_foreign').GetOffice.GetCulturalName(SCOPE.sCountry('foreign_country'))] of [SCOPE.sCountry('foreign_country').GetName] could be put into use to increase their opinion of us.\n\nAll we would have to do is to dispatch some of our wealth [SCOPE.sCharacter('friendly_character_foreign').GetHerHis] way, and [SCOPE.sCharacter('friendly_character_foreign').GetSheHe] will attempt to improve our reputation in [SCOPE.sCountry('foreign_country').GetName]."
 country_diplomacy.1.a:0 "All right, let us dispatch [SCOPE.sCharacter('friendly_character_foreign').GetHerHim] the gold."
 country_diplomacy.1.b:0 "We have no concern regarding [SCOPE.sCountry('foreign_country').GetName] or their opinion of us."
 country_diplomacy.2.desc:0 "A group of people originating from [SCOPE.sP('random_overlord_province').GetName] in [SCOPE.sP('random_overlord_province').GetState.GetShortName] has been dispatched by [SCOPE.sCountry('overlord_country').GetRuler.GetName] to settle down in [ROOT.GetCountry.GetCapital.GetName], and [SCOPE.sCountry('overlord_country').GetRuler.GetSheHe] has attempted to convince some of our people to move to [SCOPE.sCountry('overlord_country').GetName]. It seems [SCOPE.sCountry('overlord_country').GetRuler.GetSheHe] is hoping to obtain greater control of our nation by slowly replacing our citizens with [SCOPE.sCountry('overlord_country').GetRuler.GetHerHis] own.\n\nLarge disagreements and conflicts have occurred between the political camps of [SCOPE.sCharacter('random_advisor').GetName] and [SCOPE.sCharacter('overlord_vassal').GetName]. [SCOPE.sCharacter('random_advisor').GetName] has suggested barring the group of people from entering [ROOT.GetCountry.GetCapital.GetName], as well as making sure our own people stay in the city. By limiting what passes between our frontiers, we should be able to reduce the amount of influence [SCOPE.sCountry('overlord_country').GetRuler.GetName] has in the city.\n\n[SCOPE.sCharacter('overlord_vassal').GetName] on the other hand, is a well known supporter of [SCOPE.sCountry('overlord_country').GetName], and [SCOPE.sCharacter('overlord_vassal').GetSheHe] has repeatedly pointed out how we should be careful about doing things that could displease our suzerain. Considering [SCOPE.sCharacter('overlord_vassal').GetHerHis] loyalties, we are convinced this is all but a message from [SCOPE.sCountry('overlord_country').GetRuler.GetName]."
 country_diplomacy.2.a:0 "Let them establish residence in [ROOT.GetCountry.GetCapital.GetName]."
 country_diplomacy.3.desc:0 "We have seen a rise in conflicts and crimes in [SCOPE.sP('troubled_province').GetName], [SCOPE.sP('troubled_province').GetState.GetShortName], after the city had settlers from [SCOPE.sCountry('overlord_country').GetName] introduced to the city. Though the locals desire us to eliminate the problematic elements from the city, our [SCOPE.sCharacter('overlord_vassal').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('overlord_vassal').GetName] points out it might send the wrong signals to [SCOPE.sCountry('overlord_country').GetName].\n\n[SCOPE.sCharacter('overlord_vassal').GetName] is known for [SCOPE.sCharacter('overlord_vassal').GetHerHis] cohesive bonds to [SCOPE.sCountry('overlord_country').GetRuler.GetName], and [SCOPE.sCharacter('overlord_vassal').GetHerHis] words are probably coming directly from [SCOPE.sCountry('overlord_country').GetName]."
 country_diplomacy.3.a:0 "We will attempt to calm the situation, without any excessive measures."
 country_diplomacy.3.b:0 "Place the troublemakers to the sword."
 country_diplomacy.4.desc:0 "While our own nation is struggling to locate the funds we require, our vassal [SCOPE.sCountry('random_vassal').GetName] have a lot of gold to spare. Under the leadership of [SCOPE.sCharacter('random_advisor').GetName] a faction has developed, who propose requiring aid from our vassal.\n\nIt would undoubtedly be an unpopular move among our vassals, but sometimes unpopular actions have to be taken as a leading nation, and it would be popular among our own people."
 country_diplomacy.4.a:0 "[SCOPE.sCharacter('random_advisor').GetName] and [SCOPE.sCharacter('random_advisor').GetHerHis] group is correct."
 country_diplomacy.4.a.tt:0 "We will dispatch a request to our vassal."
 country_diplomacy.4.b:0 "It seems like a poor idea to punish our vassals more than necessary."
 country_diplomacy.4.b.tt:0 "We will locate funds elsewhere."
 country_diplomacy.5.t:0 "Demanding Suzerain"
 country_diplomacy.5.desc:0 "[SCOPE.sCharacter('overlord_vassal').GetName] has brought the requirements of [SCOPE.sCountry('overlord_country').GetName] onto the political agenda, as they desire us to pay them large funds to assist them out of the deficit they are currently experiencing. Though we owe [SCOPE.sCountry('overlord_country').GetName] a lot, this is a ridiculous and unreasonable requirement, and a lot of our people are loudly voicing their opinions.\n\n[SCOPE.sCountry('overlord_country').GetName] and their political puppet, [SCOPE.sCharacter('overlord_vassal').GetName], would undoubtedly be annoyed if we were not to agree to the request, whereas our people would be outraged if we were to acquiesce."
 country_diplomacy.5.b:0 "Their requirements be damned, our fund is not to be shared with a tyrant."
 country_diplomacy.6.desc:0 "Though it seems they had to discuss it at length, we finally received the payment we desired from [SCOPE.sCountry('random_vassal').GetName]. With the aid of [SCOPE.sCharacter('overlord_vassal').GetName], one who has repeatedly shown to be positive to our relationship with [SCOPE.sCountry('random_vassal').GetName], their leader [SCOPE.sCountry('random_vassal').GetRuler.GetName] finally had to yield and dispatch us the funds."
 country_diplomacy.7.desc:0 "After several days of waiting, we finally received a response from [SCOPE.sCountry('random_vassal').GetName] and their leader, [SCOPE.sCountry('random_vassal').GetRuler.GetName]. They have the audacity to refuse our request, and call it a ridiculous and unreasonable requirement of their nation. Our people are, understandably so, disappointed and outraged at this impertinence."
 country_diplomacy.8.desc:1 "Casting away the shackles of our [former_overlord.GetAdjective] masters, all that remains to safeguard our republic and bring closure to the matter of our independence is bring the [SCOPE.GetRootScope.GetCountry.GetAdjective] lackeys of [former_overlord.GetName] to justice for betraying our nation.\n\n[overlord_vassal.GetPraenomen] was the most outspoken of the traitors, enjoying privileges in exchange for retaining [overlord_vassal.GetHerHis] countrymen in chains. How shall we proceed with [SCOPE.GetRootScope.GetCountry.GetAdjective] justice?"
 country_diplomacy.8.a:0 "Eliminate the traitor."
 country_diplomacy.8.b:0 "Dispatch [SCOPE.sCharacter('overlord_vassal').GetHerHim] back to [SCOPE.sCountry('former_overlord').GetName], where [SCOPE.sCharacter('overlord_vassal').GetSheHe] belongs."
 country_diplomacy.9.desc:0 "We have recently seen a large influx of merchants visiting and bartering in [SCOPE.sP('randomized_country_province').GetName]. It is said [SCOPE.sCountry('overlord_country').GetRuler.GetName] [SCOPE.sCountry('overlord_country').GetRuler.GetHerselfHimself] has spoken warmly concerning our nation and the city, and that is partly the reason we have seen such a huge rush of recent arrivals."
 country_diplomacy.9.b:0 "Establish them in [SCOPE.sP('randomized_country_province').GetName]."
 country_diplomacy.10.desc:0 "As one of the nations under the protection of [SCOPE.sCountry('overlord_country').GetRuler.GetName] and [SCOPE.sCountry('overlord_country').GetName], we have recently seen a large influx of traders and merchants visiting our nation. As business is improved in every part of our nation, [SCOPE.sCharacter('random_advisor').GetName] suggests dispatching a lot of the wealth we have obtained back to [SCOPE.sCountry('overlord_country').GetName] as a gift to [SCOPE.sCountry('overlord_country').GetRuler.GetName]. It would surely improve the relationship between our two nations even more."
 country_diplomacy.10.a:0 "We appreciate the benevolence, but we require the gold ourselves."
 country_diplomacy.10.b:0 "Make sure some of the wealth is dispatched back to [SCOPE.sCountry('overlord_country').GetName]."
 country_diplomacy.11.desc:0 "We have received several dignitaries from [SCOPE.sCountry('vassal_country').GetName] bringing gold and valuables. Apparently they believe we have been partly to thank for a recent commercial influx in their nation, and desire to demonstrate their gratitude. Though we are taken somewhat by surprise, we attempt to conceal our bewilderment and receive the recompense with the respect and appreciation that is due.\n\nSurely, if they desire to dispatch their funds our way, we could not possibly say no, could we?"
 country_diplomacy.11.a:0 "The riches of [SCOPE.sCountry('vassal_country').GetName] will be satisfactorily spent."
 country_diplomacy.12.desc:0 "There has recently been a large influx of [SCOPE.sCountry('vassal_country').GetAdjective] merchants and travellers visiting [SCOPE.sP('randomized_country_province').GetName]. As [SCOPE.sCountry('vassal_country').GetName] is under our protection, they have opened up and attempted to become more friendly and well known in every part of our nation. As both sides are starting to see the benefits of this relationship, we should attempt to make a decision on what type of limits we are going to set to their influence in [SCOPE.sP('randomized_country_province').GetName]."
 country_diplomacy.12.b:0 "Let them establish themselves in [SCOPE.sP('randomized_country_province').GetName]."
 country_diplomacy.13.t:0 "Civilised Company"
 country_diplomacy.13.desc:0 "There has been an increase in relations between ourselves and [SCOPE.sCountry('overlord_country').GetName], and in particular there have been more people seen in the [SCOPE.sP('randomized_country_province').GetState.GetName]. Travelling from [SCOPE.sP('overlord_province').GetName], [SCOPE.sP('overlord_province').GetState.GetShortName], they wish to settle down in [SCOPE.sP('randomized_country_province').GetName].\n\nBringing with them their [SCOPE.sCountry('overlord_country').GetAdjective] customs and manners, they are sure to be beneficial in [SCOPE.sP('randomized_country_province').GetName], despite the locals opposition to the foreigners."
 country_diplomacy.13.b:0 "It is only correct that we dispatch some of our own people to [SCOPE.sCountry('overlord_country').GetName] as well."
 country_diplomacy.14.desc:1 "Some of our citizens have left [SCOPE.sP('overlord_province').GetName], [SCOPE.sP('overlord_province').GetState.GetShortName], to settle down in our vassal [SCOPE.sCountry('vassal_country').GetName] [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName], [SCOPE.sP('randomized_country_province').GetState.GetShortName]. As they get more used to our ways, and learn from our citizens, we hope [SCOPE.sCountry('vassal_country').GetName] will be able to advance and become more civilised as well. After all, this is just a part of the agreement we made with the [SCOPE.sCountry('vassal_country').GetGovernment.GetName]."
 country_diplomacy.15.desc:1 "Some of our citizens have left [SCOPE.sP('overlord_province').GetName], [SCOPE.sP('overlord_province').GetState.GetShortName], to settle down in our vassal [SCOPE.sCountry('vassal_country').GetName] [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName], [SCOPE.sP('randomized_country_province').GetState.GetShortName]. To our considerable surprise, a group of freemen was dispatched by [SCOPE.sCountry('vassal_country').GetRuler.GetName] to settle down in [SCOPE.sP('overlord_province').GetName] as well. With our frontiers open to our vassal, we are sure to see more exchanges between our people, so we can become acquainted with one another better than we already do."
 country_diplomacy.15.a:0 "I am curious if we can learn something from their ways?"
 country_diplomacy.16.t:0 "Freemen Freely Recreating Forth"
 country_diplomacy.16.desc:0 "Some of our people have started looking towards [SCOPE.sCountry('overlord_country').GetName] for a future, perceiving the potential for a safer life under the leadership of [SCOPE.sCountry('overlord_country').GetName]. They have begun preparations to depart [SCOPE.sP('vassal_province').GetName], [SCOPE.sP('vassal_province').GetState.GetShortName], to settle down in [SCOPE.sP('overlord_province').GetName], [SCOPE.sP('overlord_province').GetState.GetShortName].\n\nThough it could be an unpopular move, we could set aside some people and resources to convince the people to stay. We will not be able to prosper if all our people depart the nation, after all."
 country_diplomacy.16.a:0 "Let them establish themselves in [SCOPE.sCountry('overlord_country').GetName]."
 country_diplomacy.16.b:0 "Make sure they are not permitted out of [ROOT.GetCountry.GetName]."
 country_diplomacy.17.desc:1 "A large group of freemen have left the [vassal_province.Custom('get_city_type_loc')] of [SCOPE.sP('vassal_province').GetName], [SCOPE.sP('vassal_province').GetState.GetShortName], in [SCOPE.sCountry('vassal_country').GetName] to come settle down in our [overlord_province.Custom('get_city_type_loc')] of [SCOPE.sP('overlord_province').GetName], [SCOPE.sP('overlord_province').GetState.GetShortName]. Though more manpower could do us good, the men and women of [SCOPE.sCountry('vassal_country').GetName] are known for their feral antics, and could cause issues.\n\nWe should make sure we can manage the recent settlers, if we are to accept their desire to settle in [SCOPE.sP('overlord_province').GetName]."
 country_diplomacy.17.a:0 "It will be fine, let them establish themselves among our people."
 country_diplomacy.17.b:0 "Dispatch them back to [SCOPE.sCountry('vassal_country').GetName]."
 country_diplomacy.18.desc:0 "Though some of our freemen up and left [SCOPE.sP('vassal_province').GetName] to settle down in [SCOPE.sCountry('overlord_country').GetName], it seems they were barred from entering the nation and was sent back home. After the ignominy of having to return to the home they dismissed so easily, they are unlikely to depart again anytime soon."
 country_diplomacy.19.desc:0 "[SCOPE.sP('overlord_province').GetName], [SCOPE.sP('overlord_province').GetState.GetShortName], has recently seen issues with the foreign settlers who resides in the city. Though many of them have become used to our way of life, some of them have consistently been more problematic than anything else.\n\nFollowing the most recent conflict between locals and the foreign elements, [SCOPE.sCharacter('random_advisor').GetName] suggests we make an example of the troublemakers. Our tribal vassals might disapprove of their people being mistreated in our lands, but our own people are certain to disapprove if we do not do anything about the problem."
 country_diplomacy.19.a:0 "Let us attempt to assuage the troublemakers."
 country_diplomacy.19.b:0 "Eliminate the troubling elements from [SCOPE.sP('overlord_province').GetName]."
 country_diplomacy.20.desc:0 "If we are ever to become our own people, we will have to step out of the shadow of [SCOPE.sCountry('overlord_country').GetName]. Our advisors are conflicted in how we should attempt to improve our satrapy, we all agree that something needs to be done.\n\nAfter a lot of back and forth, we have worked out three potential routes forward."
 country_diplomacy.20.a:0 "Our soldiers will be as robust as the Argyraspides."
 country_diplomacy.20.b.tt:0 "We will focus our efforts on improving our revenue."
 country_diplomacy.20.c:0 "The bureaucracy required to care for our people."
 country_diplomacy.20.c.tt:0 "We will focus our efforts on pacifying and developing our lands."
 country_diplomacy.22.desc:0 "A large group of bandits have started despoiling and depredating the region in the vicinity of [ROOT.GetCountry.GetCapital.GetName], bringing all our work to a standstill. Though it was only the peasants struggling with these criminals at first, it is getting ever more clear that something needs to be done."
 country_diplomacy.22.b:0 "We will dispatch a minor party to terrify them away."
 country_diplomacy.23.desc:0 "As we continue the work on our venture, it feels like progress slows down for every passing day. We hear less of the preparations, as well as just what occurs in our nation in general.\n\nAfter we start looking into the issue, it comes for a day that one of our bureaucrats has been paid by [SCOPE.sCountry('overlord_country').GetName] to slow down the work on and ruin the effort we have already put into the venture."
 country_diplomacy.23.a:0 "We will locate new bureaucrats to replace this traitor."
 country_diplomacy.23.b:0 "A minor bribe will bring him back on our side."
 country_diplomacy.23.c:0 "Now that we are aware, he will do his job."
 country_diplomacy.24.desc:0 "As part of the work we have been doing on our venture to improve our nation, we sent out a group of bureaucrats and soldiers a month back, but we have yet to hear anything back from them. Their current whereabouts, or what could have happened to them, is indeterminate. Those remaining, are looking to us for guidance in these difficult times."
 country_diplomacy.24.a:0 "A search party as well as finding potential substitutes."
 country_diplomacy.24.b:0 "There will be a minor search party."
 country_diplomacy.25.desc:0 "As our work progresses on the venture to improve our nation continues, our priests and diviners have started demanding more from us to obtain their blessing in the endeavour. Clearly, they are using the situation as an advantage to obtain more funds to their temples and shrines. Though it would be sagacious to convince our people that we have the divine on our side."
 country_diplomacy.25.b:0 "We will demonstrate our participation in some religious rites, to convince the doubters."
 country_diplomacy.25.c:0 "There is no necessity for their blessing."
 country_diplomacy.25.c.tt:0 "Our progress on the venture is considerably hindered."
 country_diplomacy.26.t:0 "Venturing to a Conclusion"
 country_diplomacy.26.desc:0 "After months upon months of labour on concluding the venture we set out to do, for the betterment of our nation, it has finally reached its conclusion.\n\n[ROOT.GetCountry.Custom('get_satrapy_project_outcome_text_type')]"
 country_diplomacy.26.g:0 "History will recall this moment."
 country_diplomacy.27.desc:0 "Despite our efforts, all our labour into the venture has ended up a total failure. Our people have repeatedly fought versus our efforts to improve our nation, and in the end we have nothing to display for it.\n\nMaybe it would have worked out if we had put our best efforts into the endeavour?"
 country_diplomacy.27.a.tt:0 "The venture we have laboured on these last months has concluded as a failure."
 country_diplomacy.28.t:0 "An Offering to the Suzerain"
 country_diplomacy.28.desc:0 "Our suzerain [SCOPE.sCountry('overlord_country').GetName] expects us to occasionally dispatch gifts and servants to serve at their court. Though [SCOPE.sCountry('overlord_country').GetRuler.GetName] will be hard pressed to push [SCOPE.sCountry('overlord_country').GetRuler.GetHerHis] requirements, it will undoubtedly sour our relationship if we do got acquiesce with [SCOPE.sCountry('overlord_country').GetRuler.GetHerHis] requests.\n\nOur advisors have sat down together to try and locate the best potential alternatives we could dispatch to our suzerain. After a lot of talking back and forth, they have finally come to a conclusion."
 country_diplomacy.28.a:0 "We will dispatch [SCOPE.sCharacter('random_advisor').GetName]."
 country_diplomacy.28.c:0 "We require everyone to serve at our own court."
 country_diplomacy.29.desc:0 "[SCOPE.sCountry('vassal_country').GetRuler.GetName] of [SCOPE.sCountry('vassal_country').GetName] has sent us one of [SCOPE.sCountry('vassal_country').GetRuler.GetHerHis] advisors to serve at our court as a gift to show [SCOPE.sCountry('vassal_country').GetRuler.GetHerHis] obedience to [ROOT.GetCountry.GetName], as is customary for some satrapies. Though it will give [SCOPE.sCountry('vassal_country').GetRuler.GetName] some influence on our court, it would be a disgrace to [SCOPE.sCountry('vassal_country').GetRuler.GetHerHis] honour if [SCOPE.sCharacter('sent_advisor').GetName] did not live up to [SCOPE.sCharacter('sent_advisor').GetHerHis] reputation.\n\nWe should find the [SCOPE.sCharacter('sent_advisor').GetWomanMan] some work to do, to keep [SCOPE.sCharacter('sent_advisor').GetHerHim] too busy to start poking around."
 country_diplomacy.29.b:0 "We did not desire this [SCOPE.sCharacter('sent_advisor').GetName] in our court."
 country_diplomacy.30.t:0 "The Gift to Placate the Suzerain"
 country_diplomacy.30.desc:0 "It is expected of the Satraps to offer up gifts to their suzerain occasionally, to show subservience. As we have not provided our suzerain with anything in a while, our relationship are sure to sour if we continue ignoring the issue. We should send [SCOPE.sCountry('overlord_country').GetRuler.GetName] exotic units or a minor gift of gold."
 country_diplomacy.32.t:0 "Unfit Suzerain"
 country_diplomacy.32.desc:0 "It is beyond question that our suzerain [SCOPE.sCountry('overlord_country').GetRuler.GetName] of [SCOPE.sCountry('overlord_country').GetName] is unfit to rule over our people. Though we have followed [SCOPE.sCountry('overlord_country').GetRuler.GetHerHis] whims until now, our people require a conclusion to the rule from [SCOPE.sCountry('overlord_country').GetCapital.GetName]. Going contrary to our people's wishes are sure to make us as unpopular as [SCOPE.sCountry('overlord_country').GetRuler.GetFirstName] is."
 country_diplomacy.33.desc:0 "The people of [SCOPE.sCountry('vassal_country').GetName] has started to grow unruly under the leadership of [SCOPE.sCountry('vassal_country').GetRuler.GetName]. In a dissenting move, [SCOPE.sCountry('vassal_country').GetRuler.GetSheHe] has started muttering about independence from [ROOT.GetCountry.GetName], bringing a conclusion to the agreements between ourselves and the satrapy.\n\nIf we let [SCOPE.sCountry('vassal_country').GetRuler.GetHerHim] continue inciting [SCOPE.sCountry('vassal_country').GetRuler.GetHerHis] people, it is only a matter of time until [SCOPE.sCountry('vassal_country').GetName] breaks free from our control."
 country_diplomacy.33.b.tt:0 "[SCOPE.sCountry('vassal_country').GetName] will be paid off, to temporarily suspend their requirements."
 country_diplomacy.34.t:0 "Desperate Suzerain"
 country_diplomacy.34.desc:0 "In a desperate move to secure our loyalty to [SCOPE.sCountry('overlord_country').GetName], [SCOPE.sCountry('overlord_country').GetRuler.GetName] has sent us a large shipment of gold and silver. Our people seem pleased with the change in how we are being treated, and they have even started to speak more positively about [SCOPE.sCountry('overlord_country').GetName].\n\nWe will put aside our differences with our suzerain, at least until we require more funds."
 country_diplomacy.36.t:0 "Unfit Suzerain"
 country_diplomacy.36.desc:0 "We have long been under the control of [SCOPE.sCountry('overlord_country').GetRuler.GetName] and [SCOPE.sCountry('overlord_country').GetName], but our people have grown restless as our suzerain is growing more unfit to rule by the day. Now a lot of our advisors and peers are asking us to cut the bonds to the leadership [SCOPE.sCountry('overlord_country').GetCapital.GetName] and become independent."
 country_diplomacy.36.a:0 "Our people deserves liberty from [SCOPE.sCountry('overlord_country').GetName]."
 country_diplomacy.37.desc:0 "Under the guidance of [SCOPE.sCountry('vassal_country').GetRuler.GetName], [SCOPE.sCountry('vassal_country').GetName] has commenced questioning our leadership, and they have grown unruly. Now they have officially grown hostile to our rule, and are starting to ask for their and other subjects' leaders to cut the bonds to [ROOT.GetCountry.GetCapital.GetName] and start ruling themselves."
 country_diplomacy.38.desc:0 "Over time the state and the [ROOT.GetCountry.GetAdjective] people have come to be seen not as a tribe but a civilised country, much like [SCOPE.sCountry('overlord_country').GetName]. It is only fitting then that the treaty that our two nations have with each other be re-negotiated.\nWe are no longer expected to send our young men to perish in the conflicts of the [SCOPE.sCountry('overlord_country').GetAdjective], instead a timely payment of monetary tribute will ensure their continued protection of our interests."
 country_diplomacy.38.a:0 "May our friendship endure a thousand years."
 country_diplomacy.39.desc:0 "The protection we have offered [SCOPE.sCountry('tributary_more').GetAdjective] have made a lasting impression on the people. They have approached us requesting to be more closely integrated into our country."
 country_diplomacy.40.t:0 "[SCOPE.sCountry('tributary_enough').GetAdjective] Tribute Terminates"
 country_diplomacy.40.desc:0 "Tribute has stopped coming in from [SCOPE.sCountry('tributary_enough').GetName]. The [SCOPE.sCountry('tributary_enough').GetAdjective] people argue that the arrangement of paying for our protection is no longer serving their interests and that they are better off pursuing protection by other means."
 country_diplomacy.56.desc:0 "The [SCOPE.sC('guarantee_target').GetAdjective] people cry out for firmer leadership than that which their paltry government offers. If we are to truly live up to the standards expected of us as a scion of justice and equity, we must take them into our fold, ensuring safety and equitable treatment for their citizenry."
