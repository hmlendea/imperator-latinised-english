l_english:
 treasure_statue_of_athena_promachos_desc:1 "This gigantic bronze statue was made by Phidias, and is one of the most important monuments of Athens. It was dedicated to the goddess after the Athenians repelled the Persians several times from their territories."
 treasure_statue_of_khryseis_desc:0 "She was one of the many priestesses of the Heraion, and supposedly the reason the older temple was burnt down to the ground. Despite that, the statue is well preserved and honoured."
 treasure_serpent_column_desc:0 "The Greek city-states made this offering to the temple of Apollo after the victory at Plataea versus the invading Persians, a giant column with a beautiful golden tripod adorning the top."
 treasure_stone_of_sinifere_desc:0 "Sinifere is a conflict god often called upon by the many Numidian and Mauretanian tribes across all of Libya. This stone used to be a part of a larger stone circle in the deity's honour."
 treasure_tomb_of_romulus_desc:0 "The tomb of Romulus is an ancient shrine originally located in Rome, in honour of the city's ancient progenitor."
 treasure_altar_to_glanis_desc:0 "The ancient stone altar is dedicated to Glanis and the Glanicae, the deities associated with the spring in southern Gaul."
 treasure_sucellus_jar_desc:0 "This ancient jar is associated with Sucellus, a local fertility deity around the territories of the Aeduia tribes."
 treasure_silver_cauldron_desc:0 "This beautiful silver cauldron is a labour of art unlike any other in the area where it was made, in the northern reaches of Cimbria."
 treasure_twig_of_the_oak_desc:0 "Among the many sacred groves in Venedia, there is one that supposedly has an eternally green oak. This branch has yet to wither and perish, and has become a religious of its own."
 treasure_bronze_hand_sabazios_desc:0 "The hand is recurring iconography for Sabazios, the Thracian horseman, and this particular piece is a beautiful labour of bronze art."
 treasure_warrior_image_desc:0 "This beautiful stone image was made by a smaller Scythian tribe in honour of their local conflict god, and now it has become a more important religious focus beyond their territories."
 treasure_sprig_of_tyr_desc:0 "This sacred branch is said to have belonged to the god Tyr himself, and is kept in the holiest forest grove of the Cheruscians."
 treasure_book_of_orpheus_desc:1 "An illustrated book made out of solid gold tablets, depicting the mythology and doctrine of the Hellenic cult of Orphism and the journey to the afterlife."
 treasure_statue_of_nabu_desc:0 "This colossal statue represents Nabu, the Chaldean god of learning and sagacity, and was brought to Babylon from Borsippa once a year to pay respects to his father deity, Marduk."
 treasure_achilles_panoply_desc:0 "The armour of the great Homeric hero Achilles, fought over by Odysseus and Ajax the Greater after his death and given by the former to Neoptolemus, son of Achilles and founder of the Epirote kingdom."
 treasure_omphalos_stone_desc:0 "This stone is said to mark the world's navel, or centre point, placed at Delphi by Zeus where two eagles sent from each end of the world met. It also represents the swaddled stone Rhea gave to Cronus to protect the infant Zeus."
 directors_cuirass_desc:0 "An intricately crafted set of ringmail armour, this cuirass clearly must have belonged to someone with a fondness for battering rams."
 babylonian_map_of_the_world_desc:0 "This ancient clay tablet depicts the Mesopotamian world, with the city of Babylon at its centre along with all the major urban centres of the two-river region."
 shahriar_and_the_lion_desc:0 "This carving was once part of the palaces at Persepolis and depicts the struggle of the hero King Sharhriar versus a supernatural winged lion. 'Ahuramazda helped me to defeat this territory and restore order to him'"
 statue_of_aphrodite_of_aphrodisias_desc:0 "This marble statue of Aphrodite was once part of the cult centre at Aphrodisias. It was made from marble from the adjacent quarries and founded by the donations to the pilgrimage centre itself."
 benben_stone_desc:0 "The divine, pyramid shaped, Benben stone, represents the primeval hill upon which Atum first landed. For centuries it was kept in the very centre of the Ra temple at Heliopolis. This stone serves as a model for all Pyramidion's and the tips of Egyptian Obelisks."
 sybilline_books_desc:0 "Brought to Rome by Tarquinius Superbus, its last king, the Sybilline books are a collection of oracular writings thought to be of assistance in times of great crisis."
 treasure_panoply_of_pyrrhos_desc:0 "Audacious king Pyrrhos was seen as an almost divine figure by many, recalling the epic rigor and prowess of Alexander - perhaps even Achilles. His battle dress, pocked with gouges and clefts by lesser men, reminds us of his greatness."
 treasure_partition_triparadeisos_desc:0 "After the initial hostilities in the armed conflicts of Alexander's generals a division was made of all the territories in the Empire. This treaty names Antipater the regent of the empire, and gives each of the still living generals a different part of the empire to govern. This division proved fleeting, most of its participants are long dead and all that now remain of the legacy of Triparadeisos is these crumbling protocols."
 treasure_enquiry_into_plants_desc:0 "Written by Aristotle's pupil Theophrastus, this giant labour of 10 books describes and classifies all plants known to man, along with where to find them, their anatomy and their medicinal uses. These notes were once used by Theophrastus himself when giving lectures to his pupils."
 treasure_stasanders_xyston_desc:0 "This Xyston is said to have been the weapon of Stasander, former Companion of Alexander the Great and the Satrap of Aria and Drangiana in Eastern Persia. Together with his brother, Stasanor, the Satrap of Bactria and Sogdia, Stasander controlled the entire eastern frontier of the former empire at one point, before being defeated by Antigonus Monophtalmos."
 treasure_arms_of_alexander_desc:1 "A sword said to have been worn by Alexander the Great himself, separated from him before his body left Babylon to be transported to Macedon. At the council of Babylon this sword and the armour of Alexander were placed at his chair so as to signify his presence at the table even after his death."
 treasure_armor_of_alexander:0 "Armour of Alexander"
 treasure_armor_of_alexander_desc:1 "A breastplate and shield claimed to have been used by the great king Alexander himself. They were separated from the body before it travelled by catafalc towards Macedon and brought to Egypt along with the body after Ptolemaios wrested it from Perdikkan control."
 treasure_sarcophagus_seti_desc:0 "Final resting place of the Pharaoh Seti I, the second Pharaoh of the 19th dynasty and the conqueror of Kadesh. This Alabaster Sarcophagus is covered in hieroglyph spells to permit its resident to pass through the underworld."
 treasure_darius_body_desc:0 "The embalmed body of Darius, the Achaemenid king of kings who ruled the empire at its peak and invaded Greece, is still revered by many in the ancient empire, even among some non-Persian groups such as the Jews of Judea."
 treasure_ceremonial_acinaces_desc:0 "This golden sword is said to have been given as a sign of favour by the Xerxes the Great."
 treasure_mask_of_sargon_desc:0 "This great bronze mask is said to bear the likeness of the long gone ruler of Akkad, Sargon the Great. Having been used as part of the royal cult, the mask has been mutilated in the iconoclasm of later generations and is missing an eye as well as having been severed from the body that probable once accompanied it."
 treasure_victory_stele_desc:0 "This limestone stele commemorates the victories of Naram-Sin, ruler of Akkad, in his armed conflicts versus the peoples of the Zagros mountains. The king himself is depicted as a divine figure, with a bull-horned helmet and the face of a lion."
 treasure_gilgamesh_desc:1 "These stone tablets are said to be thousands of years ancient, and tell the story of the hero king Gilgamesh and his adventures. The story is told in the ancient cuneiform scripture known only in Mesopotamia."
 treasure_white_obelisk_desc:0 "This large limestone Obelisk is decorated with the campaigns and hunts of ancient Assyrian kings and is said to be over a thousand years ancient."
 treasure_colossus_head_desc:0 "The great brazen head of the Colossus of Helios, erected by the Rhodians to honour their victory over Demetrius in the great siege of their city, removed and kept as a symbol of Rhodian folly by the Antigonids."
