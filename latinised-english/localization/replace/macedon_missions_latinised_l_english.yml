l_english:
 macedon_01_legacy_DESCRIPTION:0 "The heirs of wise [GetCharacter('(int32)9').GetPraenomen] are by rights owed this kingdom via the toil and sacrifices [GetCharacter('(int32)9').GetSheHe] spent to hold it together while [GetCharacter('(int32)39').GetPraenomen] chased [GetCharacter('(int32)39').GetHerHis] fantasies eastwards - the Argead heirs of [GetCharacter('(int32)32').GetPraenomen] are merely a capstone."
 macedon_01_legacy_REWARD_DESCRIPTION:0 "Forge a novel Macedon under Antipatrid leadership whose dominance over Greece cannot be questioned."
 macedon_01_legacy_1_DESC:0 "The audacious Epirotes seek to exploit the Diadochi armed conflicts and their links to the Argead dynasty to challenge our power in [GetProvince('(int32)418').GetArea.GetRegion.GetName], something that cannot happen."
 macedon_01_legacy_2_DESC:0 "[GetCharacter('(int32)35').GetPraenomen]' expansion into southern [GetProvince('(int32)4304').GetArea.GetName] was merely the inception. The northern tribes still prefer resent us, so all of Paeonia must be Macedonian."
 macedon_01_legacy_7_allow_tt:0 "The @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] has splintered on [GetCharacter('(int32)37').GetPraenomen]' demise, and fled to [GetProvince('(int32)418').GetArea.GetRegion.GetName]."
 macedon_01_legacy_8:0 "Formalise Monarchy"
 macedon_01_legacy_9_DESC:0 "A novel bastion in Thessaly, betwixt the Macedonian heartland the unruly Greek urban centres, would ensure a robust fallback position in any repeat of the Lamian war, or Diadochi invasion."
 macedon_01_legacy_12_DESC:0 "With [GetCharacter('(int32)39').GetPraenomen]'s sons no longer a menace, the line of [GetCharacter('(int32)287').GetPraenomen], his half-sister, is the closest link to the Argead dynasty and the legitimacy their bloodline bestows."
 macedon_01_legacy_13_DESC:0 "The Taulantians continue to pose a menace on our western frontier, scheming with the Epirotes and Dardanians to avenge their defeats to [GetCharacter('(int32)35').GetPraenomen] and [GetCharacter('(int32)39').GetPraenomen]; they must be brought to heel."
 desc_mac_01_11_pmod:0 "The mines which once funded the mercenaries and pensions of Macedon's magnificent army have been steadily drying up."
 desc_mac_01_13_2_cmod:0 "Mercy is frequently an underestimated course of action, for fear drives men to peace of mind via bloodshed."
 desc_mac_01_5_cmod:0 "We have secured one of the most well defended urban centres in Greece, lending our military a buoyed confidence in their abilities and our leadership."
 macedon_02_mastery_BUTTON_TOOLTIP:0 "Macedon must continue to grow if it is to outdo the Greek urban centres it rules over - both militarily and culturally - thus ensuring a leadership role in the Greek world."
 macedon_02_mastery_CRITERIA_DESCRIPTION:0 "Ensure the primacy of Macedon in the west by developing her infrastructure and extending her scope."
 macedon_02_mastery_1_DESC:0 "The eastern parts of Alexander's empire are famed for the affluence and size of their ancient urban centres; cornucopias of learning and affluence. Macedon require not lack these things herself."
 macedon_02_mastery_1_allow_tt_3:0 "[GetProvince('(int32)373').GetName] has no free structure slots or continuing construction. (Currently [SCOPE.ScriptValue('me_mac_2_1_3_ongoing_svalue')|0R])"
 macedon_02_mastery_1_allow_tt_4:0 "[GetProvince('(int32)379').GetName] has no free structure slots or continuing construction. (Currently [SCOPE.ScriptValue('me_mac_2_1_4_ongoing_svalue')|0R])"
 macedon_02_mastery_2_allow_tt:0 "@[GetCountry('MAC').GetFlag]! [GetCountry('MAC').GetName|Y] possesses the entire mainland Region of [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], excluding [GetProvince('(int32)476').GetArea.GetName|Y], directly or via subjects."
 macedon_02_mastery_5:0 "Urban centres of Greece"
 macedon_02_mastery_5_DESC:0 "The ancient Hellenic urban centres are still famed for their cultural sophistication and affluence, so we should ensure these sites are under our control if we are to truly call ourselves rulers of Hellas."
 macedon_02_mastery_6_DESC:0 "Since [GetCharacter('(int32)35').GetPraenomen] II invited Aristotle to tutor the young [GetCharacter('(int32)39').GetPraenomen], the Diadochi have maintained a tradition of courting philosophers and artists as well as armed conflict."
 macedon_02_mastery_10_DESC:0 "The sanctuary of [GetProvince('(int32)380').GetName] has invariably been the Macedonian's most important religious site - it should be renovated to rival the religious centres elsewhere."
 desc_me_mac_2_cmod:0 "We aspire to the leadership of the southern Greek urban centres and will behave as required to that end."
 desc_me_mac_2_1_smod:0 "The Macedonian urban centres have become the most important in the Greek world, and rival the ancient urban centres of the south. "
 me_mac_2_5_cmod:0 "Hellenic Dialogue"
 desc_me_mac_2_5_cmod:0 "Though the southern Greek urban centres have been defeated by our superior military, they have much to teach us in the workings of the world."
 desc_me_mac_2_2_smod:0 "Macedonian rule over the Greek urban centres becomes more normal to its people by the day."
 desc_me_mac_2_5_2_cmod:0 "The artefacts, scrolls, and trophies of Greece point to a glorious past, but will point us to a even greater future."
 desc_me_mac_2_5_pmod:0 "The removal of cultural artefacts has outraged the educated classes of this urban centre."
 desc_me_mac_2_11_pmod:0 "A true Hellenic capital, this bustling urban centre is renowned throughout the Greek world for its size and grandeur."
 desc_me_mac_2_8_1_cmod:0 "The gods have spoken via their oracular mediums, providing guidance to our people."
 macedon_03_adriatic_BUTTON_TOOLTIP:0 "The chaos of the east left by Alexander's collapsing empire is an unattractive prospect; far better to expand our holdings closer to home and versus weaker adversaries."
 macedon_03_adriatic_DESCRIPTION:0 "Beyond the Illyrian tribes and mountains, the ancient colonies of the Greeks along and across the Adriatic sea lie waiting to be added to our domain, providing avenues of commerce and expansion overlooked under the tenure of the eastward-facing Argeads."
 macedon_03_adriatic_REWARD_DESCRIPTION:0 "Dominate the commerce of the Adriatic sea and establish a Macedonian presence on its shores."
 macedon_03_adriatic_1_DESC:0 "Our western ambitions require a stable base from which our power can be exerted without having to sail encircling the entire Greek peninsula."
 macedon_03_adriatic_2_DESC:0 "The coastal tribes of Illyria terrorise the trade routes of the Adriatic from their sheltered ports along the Dalmatian coast - outposts that will be invaluable in controlling the area."
 macedon_03_adriatic_2_reward_tt:0 "Owned Provinces with ports in the Region of [GetProvince('(int32)422').GetArea.GetRegion.GetName], excluding the Province of [GetProvince('(int32)422').GetArea.GetName], will receive a bonus to commerce value, trade routes, and slave production."
 macedon_03_adriatic_3_DESC:0 "The pirates of [GetProvince('(int32)4054').GetArea.GetName] and [GetProvince('(int32)4084').GetArea.GetRegion.GetName] are a impediment that must be purged if the rule of statute and fruits of commerce are to be vouchsafed in the region."
 macedon_03_adriatic_5_DESC:0 "Let the other Diadochi content themselves in the east; there are expanse of bounteous affluence ripe for the plunder in the west, if we can cross the sea."
 macedon_03_adriatic_6_DESC:0 "Opposite the tribes of the Illyrian littoral lies the Italic peninsula, populated by conflict-like natives and Greek colonists equally open to subjugation."
 macedon_03_adriatic_7_DESC:0 "By carving out a western empire based encircling the Adriatic, we could extract the riches of Illyria without ascending into the barbarous mountains, opening the way to Italia."
 macedon_03_adriatic_11_DESC:0 "If we were to lay claim to the entire Italic coast our position in the region would be as adamant - the foundations of a novel sphere of Macedonian commerce and colonisation."
 macedon_03_adriatic_13_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] has at least twice as numerous vessels as any other country owning an Adriatic port. [SCOPE.Custom('mac_mis_03_13_cus_loc')]"
 macedon_03_adriatic_13_allow_tt1:0 "Any other unallied non-subject country on the Adriatic coast has at least #Y 20#! vessels."
 desc_me_mac_3_cmod:0 "Plans to strike west have given the armies of Macedon a novel purpose versus old enemies."
 desc_me_mac_3_end_cmod:0 "Our conquests in the west have proven the worthiness of our ruling dynasty and created a source of novel recruits."
 desc_me_mac_3_1_pmod:0 "This city is the centre of Macedon's regional expansion, connected to the ancient Macedonian heartland."
 desc_me_mac_3_5_cmod:0 "Our westward expansion has proven our armies can deal with any menace."
 desc_me_mac_3_4_cmod:0 "Though pirates can be a impediment, their competences can be put to good use for the right price."
 desc_me_mac_3_3_cmod:0 "Purging the pirates of the Adriatic Sea has benefited the merchant classes of Macedon and thus our revenues via them."
 desc_me_mac_3_6_pmod:0 "This urban centre has been turned into a local stronghold as a regional capital of Macedon on the Italic peninsula."
