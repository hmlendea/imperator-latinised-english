l_english:
 drill_armydesc:1 "Drilling is the ideal, if expensive, manner to ensure every soldier is fighting fit and knows what requires to be accomplished without risking life and limb. Experience is the best teacher, after all."
 road_building:0 "Construct Military Road"
 road_buildingdesc:0 "The ability to lay down elevated quality roads while on campaign can greatly increase the efficiency of any offensive operation, and was a particular hallmark of the Roman Legions."
 civilian_road_building:0 "Construct Road"
 civilian_road_buildingdesc:0 "From the Persian Royal Roads, to the Grand Trunk Road, road-building is surely the sign of a progressive civilisation."
 border_forts:0 "Construct Frontier Fort"
 force_marchdesc:0 "Although deeply unpopular amongst the rank-and-file, forced marching is a rapid and efficient manner to cover a lot of ground in very brief order."
 cavalry_skirmish_desc:0 "Ordering cavalry to harass and skirmish, rather than remain in formation, can frequently be used as a tool to deny an entire flank to hostile troops."
 greek_phalanx_desc:0 "The Phalanx originated as a highly defensive method of formation fighting, used primarily by Greek city-states. It was further developed by the Macedonian military, who constructed their armies around a heavily armoured Phalanx formation."
 triplex_acies_desc:0 "Like the Hellenistic Phalanx the Roman tactic formation known as the Triplex Acies, or triple lines, is inspired by the Phalanx of the Greek City states. Where the Macedonian or Hellenistic Phalanx has gone for cohesion the Roman Formation instead emphasised flexibility."
 hit_and_run_tactics_desc:0 "In the face of an overwhelming enemy an asymmetric method can frequently be more successful than a head-on one. Ambushes, raids and hit-and-run style tactics were prevalent in ancient warfare, especially in Gaul, Germania and Iberia."
 ramming_speeddesc:0 "Ramming permits rapid and light vessels to decimate much larger vessels. It been a favoured manner to determine naval battles in classical Greece and remains a prevalent tactic, especially in the western Mediterranean."
 boarding_tacticsdesc:0 "For those constructing larger vessels boarding was the preferable alternative to ramming. Naval catapults and archers would attempt to immobilise enemy vessels, permitting large contingents of marines to board and seize them."
 military_coloniesdesc:0 "For numerous centuries, foreign suzerains have embraced the practice of transplanting their own native citizens into the novel, foreign territories. Known as Cleruchs, these citizens were frequently considered as more probable to be loyal soldiers, than the indigenous population."
 leviesdesc:0 "Numerous states, when threatened by foreign powers, would have to rely on citizen militia to bolster their fighting forces."
 desecrate_holysite:1 "Desecrate Sacred Sites"
 desecrate_holysitedesc:1 "The desecration of sacred places is a time honoured manner of demoralising the faithful."
 holy_site_deity_bonus_lost_tt:0 "[shrine_location.GetName|Y] will forfeit Sacred Site $HOLY_SITE_PROVINCE_BENEFITS_TT$\n[provincial_deity.GetName|Y] will forfeit their #G 25%#! bonus to [deity|E] modifiers."
 pillagedesc:0 "The act of looting is a time-honoured tradition - a warrior's spoils are well deserved!"
 settledesc:0 "Discover a place to call our home."
 road_building_invalid_province_tt:0 "The unit is in a territory where it is unable to construct a road."
 shock_action_desc:0 "Sometimes, caution must be thrown to the wind - few adversaries can stand versus a massed charge, though we must be wary of those that can field a staunch defence."
 envelopment_desc:0 "Drawing forth an enemy counterattack, and then plunging into the aspect of their exposed formation can cause massive losses. Versus an enemy who can rapidly martial their men to multiple fronts however, increases the risk of this manoeuvre."
 deception_desc:1 "A staggered assault can wear down an enemy's resolve more rapidly than one might imagine, and permits us to respond to mobile menaces with magnificent ease."
 skirmishing_desc:0 "If the enemy exposes a series of flanks for us to harry, this manoeuvre will surely pay off. We should not employ this tactic versus stalwart offensive lines, however."
 bottleneck_desc:0 "Versus a massed charge, nothing performs superior to a solid defensive line. However, if the enemy is astute enough to select us off one by one, we may encounter problems."
 mobile_defence:0 "Mobile defence"
 mobile_defence_desc:0 "By maintaining our soldiers on the move, we can confuse, disorient, and ultimately neutralise a potential flank thrust. An enemy capable of employing multiple formations could prove more of a challenge."
 unit_levies_effect_tooltip:0 "This army obtains #Y [SCOPE.ScriptValue('levy_amount_svalue')]#! units of Light Infantry."
 unit_levies_effect_tooltip_horses:0 "This army obtains #Y [SCOPE.ScriptValue('levy_amount_svalue')]#! units of Light Cavalry."
 levies_tooltip_info:0 "Your army will receive a morale hit while they reorganise."
 naval_raidingdesc:0 "Though outlawed in numerous states the 'old fashioned manner of life' of piracy and maritime slave raiding, is vital to the economy of other societies."
 naval_raiding_ae_gain_tooltip:1 "We will obtain #R [SCOPE.ScriptValue('naval_raiding_ae_gain_tooltip_svalue')|0]#! Aggressive Expansion."
 raze_citydesc:0 "By razing the infrastructure of a developed city, we may discover it a more suitable place to settle our faithful tribal population."
 frontal_assault_desc:0 "Sometimes the most efficient method is to have a robust centre that ruptures via the enemy line. By concentrating our most robust vessels in such a manner we can rupture apart an enemy fleet rapidly."
 naval_envelopment_desc:0 "Envelopment is an ancient and tried tactic at sea just as it is on territory. Loading one flank with more robust and more numerous vessels can permit us to overcome the enemy's flank and expose their vessels from a sideway attack."
 close_ranks_desc:0 "If all vessels stay as close together as they can it will be harder for the enemy to perform ramming or boarding."
 harassment_desc:0 "A method of constant harassment in an attempt to wear down the enemy fleet via frequent minor attacks."
 probing_attack_desc:0 "An apprehensive method where we isolate and catch single enemy vessels off guard to assist us rupture up their resolve. This is probable to generate more captured vessels."
 port_assaultdesc:0 "Fortified ports are no match for enormous mega-polyremes, purpose constructed for bringing down seaside fortifications."
 capture_portdesc:1 "A fleet of heavy vessels can easily take control of an undefended port, creating a beachhead that territory troops can then exploit."
 capture_port_explain_tt:0 "Navy must include 5 or more Heavy Vessels at 50% health or above."
 port_raiddesc:0 "Heavy vessels can rupture open the fortifications of a port, creating a breach that a besieging force can make use of."
 port_raid_explain_tt:0 "Navy must contain at least 1 Heavy Vessel at 95% Health or more."
 root_out_piratesdesc:0 "Piracy is a scourge upon our territory. We must do our duty for the good of the civilised world, and eradicate this plague upon our coasts."
 neighboring_tribal_province_tt:1 "Territory must be unclaimed, or has a foreign neighbouring territory."
 neighboring_fort_province_tt:1 "Territory has no forts in neighbouring owned territories."
 port_raid_no_valid_port:0 "There are no continuing sieges, without a breach, in enemy ports adjacent to this Fleet."
 naval_raiding_cooldown_tooltip:0 "All proximate ports have recently been raided."
 naval_raiding_only_overlord_ports_tooltip:0 "Proximate ports are owned by the #Y Suzerain#! of this navy's owner."
 sacked_holy_site:0 "Sacked Sacred Site"
 sacked_our_holy_site:0 "Sacked Our Sacred Site"
