l_english:
 roman_1_italia_DESCRIPTION:0 "Because the founding of Roma by Romulus hundreds of years ago, our proud city has skirmished with our Italic neighbours, vying for control of the coasts and urban centres of Latium and Campania. Our recent victories over the Etruscans and Samnites have proved our superiority, and it is clear that it is Rome who is destined to unite the Italic peoples and lead them to glory."
 roman_1_italia_destroy_latins_DESC:0 "The prospect of betraying our Italic feudatories is mad sacrilegious raving, but to some it would represent our total victory over lesser brother nations and maintain them in check."
 roman_1_italia_destroy_latins_tooltip:1 "Any Subject has an #Y Italic#! dominant culture.\n\n#R We will declare conflict on all our #Y Italic#! Subjects.#!\n\nCompleting this task will give a large #R penalty#! to Assimilation Speed and Erroneous Culture Happiness in the Region of #Y $central_italy_region$#! for #Y 75#! years, as well as reduce our Stability @stability! #R -25.00#! and increase our Aggressive Expansion @aggressive_expansion! #R +10.00#!."
 roman_1_italia_latin_congress_DESC:0 "There is a dream of shared nationhood; that we and our Italic brethren can be united under a common cause. Such a audacious and novel move will surely tower over past diplomatic successes."
 roman_1_italia_encourage_expansion_DESC:0 "If we are to inspire in the Roman people a longing for real glory we must commence by convincing them that the conquest of our neighbours is not only expedient, but necessary."
 roman_1_italia_subdue_samnites_DESC:0 "The Samnites scupper our efforts to colonise Campania and rally support versus us. The shame we suffered at the Caudine Forks will be nothing compared to their total subjugation."
 roman_1_italia_lash_lucanians_DESC:0 "The Lucanians are a impediment, friends of the Samnites and ever squabbling with the Greeks. We must succeed where Alexandros I of Epirus failed and subdue them to open the way south."
 roman_1_italia_galvanize_gauls_DESC:0 "Gallic invasions from the north are an ever present menace with the Senones so close to Roma. We must drive these barbarians out to defend the gateway to Cisalpine Gaul."
 roman_2_provincia_BUTTON_TOOLTIP:0 "All great states owe their affluence to a disposable workforce and the exploitation of rich territory. The islands to our south and west hold the potential for both."
 roman_2_provincia_DESCRIPTION:0 "The islands that lay off the Italian peninsula are natural targets for expanding Rome's influence and depriving Punic and Greek colonists of the rich spoils these rugged territories hold."
 roman_2_provincia_CRITERIA_DESCRIPTION:0 "Conquer, subdue, or colonise the islands of Corsica, Sardinia, and Sicily."
 roman_2_provincia_case_for_expansion_DESC:0 "We have triumphed over our Italic brethren and place an end to their schemes. Now the Roman people must be convinced that further conquests are needed to bring glory to Rome."
 roman_2_provincia_conquer_corsica_DESC:0 "Corsica is not rich, nor populous, but must be taken to control the western Mediterranean and maintain its harbours out of the hands of Greek and Punic colonizers."
 roman_2_provincia_conquer_corsica_tooltip:0 "#Y Rome#!, or a Subject, owns every colonised Territory on the island of #Y Corsica#!."
 roman_2_provincia_sweeten_siculians_tooltip_2:0 "#Y Siculia#!, or another #Y Siculian#! nation, can be liberated from a suzerain or offered Subject status."
 roman_2_provincia_grate_greeks:0 "Territory of Tyrants"
 roman_2_provincia_provincia_DESC:0 "Rome will require to direct the administration of overseas holdings.  These foreign territories lie outside the jurisdiction of Roma and can be governed with different motives in mind."
 roman_2_provincia_provincia_tt:0 "Select between a policy of production OR civilisation in the Provincia."
 roman_2_provincia_provincia_claims_tt:0 "#Y Rome#! will gain claims on all Hispanian Territories possess by #Y Carthage#! or her Subjects."
 roman_2_provincia_provincia_tooltip:0 "#Y Rome#! is NOT at conflict with a #Y Nuragic#! nation."
 roman_3_cisalpine_gaul_BUTTON_TOOLTIP:0 "The Gallic territories of the fertile Padus valley lie on our doorstep, protected by the natural boundaries of the Alps. Cisalpine Gaul is the next logical step in expanding our interests to the north."
 roman_3_cisalpine_gaul_DESCRIPTION:0 "The Italic and Gallic tribes to the north hold sway over the fertile Padus valley and block our territory access to the north. We must sweep aside these pitiful tribes and secure the rich territories of Cisalpine Gaul for Rome."
 roman_3_cisalpine_gaul_befriend_gaulish_tribe_tooltip:1 "A #Y Gallic#! nation exists in #Y Cisalpine Gaul#!, neighbours #Y Rome#! or a Subject, is not allied with #Y Rome#!, is not a Subject, has at least #Y 4#! Territories, has greater than #R -50#! opinion of #Y Rome#!, and is a lower Rank than #Y Rome#!."
 roman_3_cisalpine_gaul_befriend_gaulish_tribe_rewtt:0 "$roman_diplo_reward_tt$ a neighbouring #Y Gallic#! tribe."
 roman_3_cisalpine_gaul_land_grants_in_senonia:0 "Territory Grants in Senonia"
 roman_3_cisalpine_gaul_latin_feudatorius_tooltip:1 "#Y Genuatia#!, or another #Y Italic#! nation, exists in #Y Cisalpine Gaul#!, neighbours #Y Rome#! or a Subject, is not allied with #Y Rome#!, is not a Subject, has at least #Y 4#! Territories, has greater than #R -50#! opinion of #Y Rome#!, and is a lower Rank than #Y Rome#!."
 roman_3_cisalpine_gaul_latin_feudatorius_rewtt:0 "$roman_diplo_reward_tt$ a neighbouring #Y Ligurian#! tribe."
 roman_3_cisalpine_gaul_into_po_valley_DESC:0 "The Padus river flows down from the Alpes and into the Adriatic, making the territory fertile and populous. It is time we appropriated these territories and secured the river as a frontier."
 roman_3_cisalpine_gaul_invade_insubria_DESC:0 "Insubrii territories fed by the river Padus are the most fertile in Cisalpine Gaul and should be our one of our main objective in the area."
 roman_3_cisalpine_gaul_vanquish_veneto_DESC:0 "The Venetii occupy the marshy eastern coast between the Gauls and the piratical Illyrians, their territories will be vital for defending Cisalpine Gaul and securing the Adriatic."
 roman_3_cisalpine_gaul_gallia_transpadana_tt:0 "Select between a policy of production OR civilisation in Cisalpine Gaul."
 roman_3_cisalpine_gaul_settle_cisalpine_DESC:0 "A novel territory of opportunity awaits any Romans audacious enough to adopt frontier life in conquered territory. Encouraging settlement will expedite the process of integration."
 roman_4_punic_rivals_BUTTON_TOOLTIP:0 "The Carthaginian trading empire has tried to dominate the coasts and islands of the Internal Sea for too long, we must not permit the Punics to contest our power again."
 roman_4_punic_rivals_DESCRIPTION:0 "Long has the Punic city of Carthage dominated trade in the western Mediterranean, extending their domains across fertile Africa, the populous islands of the Internal Sea, the rich territories of Hispania, and even, it is said, beyond the Pillars of Hercules. If we are to become the foremost power in the area, a reckoning with Carthage is inevitable - they will not readily forgo the trappings of their vast empire."
 roman_4_punic_rivals_REWARD_DESCRIPTION:0 "Carthaginian territories."
 roman_4_punic_rivals_hispania_dominance_DESC:0 "Carthage has been expanding in Hispania, going from trading posts to conquering Iberian tribes. The affluence of Hispania can not be permitted to remain in their hands."
 roman_4_punic_rivals_undermine_allies_DESC:0 "The many urban centres and Subjects who follow Carthage's lead are one of their main strengths, but a weakness if their support can be subverted by appealing to pride and ambition."
 roman_4_punic_rivals_naval_parity_tooltip:0 "#Y Rome#! has at least #Y 20#! more vessels than #Y Carthage#!."
 roman_4_punic_rivals_disarm_carthage_DESC:0 "Carthage has been weakened, but we will not tolerate them trying aid of our enemies or avenging themselves. A yearly tribute will maintain their coffers lean and remind them who is superior."
 roman_4_punic_rivals_disarm_carthage_tooltip2:0 "#Y Carthage#! will be presented with an ultimatum: become a #Y Tributary#! of #Y Rome#!, or go to conflict."
 roman_4_punic_rivals_demand_servitude_DESC:0 "We could make allies of the Punics before their resentment causes conflict. They may maintain their African holdings, as long as they serve Rome and prove their loyalty."
 roman_4_punic_rivals_carthago_delenda_est_DESC:0 "The time for peace is over, the Punics have long because squandered our reserves of goodwill and the only option remaining to us is to take the city of Carthage itself, whatever the cost."
 roman_4_punic_rivals_punic_clients_DESC:0 "With the subjection of the Carthaginians to our leadership, it is time to cultivate the closest thing to a blossoming friendship two ancient enemies, now master and slave, can ever hope to have."
 roman_4_punic_rivals_deter_punic_support_DESC:0 "Punic expansion in Hispania has brought them closer to the Iberians. We should show the peoples of the territory who their true friend is."
 roman_4_punic_rivals_deter_punic_support_tooltip:0 "At least #Y 1#! Hispanian country exists that is not at conflict with or a Subject of #Y Rome#!."
 roman_4_punic_rivals_deter_punic_support_tooltip2:0 "#Y Rome#! will attempt to turn #Y Iberian#! nations versus #Y Carthage#!."
 roman_5_hispanian_ambition_BUTTON_TOOLTIP:0 "Hispania is vast untamed territory of vicious tribes, but rich in many goods and home of fine warriors, we must ensure it is we who dominate its resources."
 roman_5_offer_iberians_protection_tooltip:2 "A #Y $iberia$#!, #Y $celt_iberia$#!, or #Y $proto_european$#! nation exists in the mainland Regions of #Y $tarraconensis_region$#!, #Y $contestania_region$#!, #Y $baetica_region$#!, #Y $lusitania_region$#!, or #Y $gallaecia_region$#!, neighbours #Y Rome#! or a Subject, is not a Subject, is not allied with #Y Rome#!, has greater than #R -50#! opinion of #Y Rome#!, is a lower Rank than #Y Rome#!, and is at conflict with a foreign nation with a greater number of Territories."
 roman_5_offer_iberians_protection_rewtt:0 "Opportunity to receive a #Y Hispanian#! subject by intervening in their conflict."
 roman_7_offer_gauls_protection_rewtt:1 "Opportunity to receive a #Y $gallic$#! subject by intervening in their conflict."
 roman_5_carthaginian_littoral_DESC:0 "Carthage's territories in southern Hispania hold vast mineral deposits and excellent harbour urban centres, they will serve as an excellent foothold in the region."
 roman_5_secure_cantabria_DESC:0 "The mountains of Cantabria make it the most naturally defensible territory of Hispania. If we are to secure the northern coast we must drive the cowards from their peaks."
 roman_5_secure_south_coast_DESC:0 "Beyond the Pillars of Hercules and the river Baetis is the famous port of Tartessus. Securing the surrounding territories will cement our hold on the rich coastal routes of southern Iberia."
 roman_5_befriend_ibero_tribe_DESC:0 "Securing an alliance with a local Hispanian tribe would permit us to exploit their petty strife and disagreements with their neighbours to our own ends. With a little luck they may even be useful."
 roman_5_befriend_ibero_tribe_tooltip:2 "A #Y $iberia$#!, #Y $celt_iberia$#!, or #Y $proto_european$#! nation exists in the mainland Regions of #Y $tarraconensis_region$#!, #Y $contestania_region$#!, #Y $baetica_region$#!, #Y $lusitania_region$#!, or #Y $gallaecia_region$#!, neighbours #Y Rome#! or a Subject, is not allied with #Y Rome#!, is not a Subject, has at least #Y 4#! Territories, has greater than #R -50#! opinion of #Y Rome#!, and is a lower Rank than #Y Rome#!."
 roman_5_befriend_ibero_tribe_rewtt:0 "$roman_diplo_reward_tt$ a neighbouring #Y Hispanian#! tribe."
 roman_5_iberian_dominance_DESC:0 "When our grasp on Hispania is secure the Iberians will realise the extent of Rome's glory and reap the benefits of being subjects of such a mighty state."
 roman_5_hispanian_provincia_tooltip2:0 "Select between a policy of production OR civilisation in Hispania."
 roman_7_invading_gaul_BUTTON_TOOLTIP:0 "The Celt heartlands of Gaul lay waiting for a robust nation to exploit the fractiousness of their many tribes and in doing so win a great territory rich in booty and slaves."
 roman_7_invading_gaul_DESCRIPTION:0 "Athwart the mountains of mythical Pyrene and the mighty Rhenus river lays a patchwork of Celtic tribes who fight petty conflicts over vendettas and women - it is time to expand our borders and bring these vulnerable barbarians under the rule of the Roman state before someone else beats us to it or the Gauls come to their senses and cross the Alpes once more."
 roman_7_secure_allies_tooltip:2 "A #Y $gallic$#!, #Y $belgae_group$#!, #Y $celto_pannonian_group$#! or #Y $proto_european$#! nation exists in the Regions of #Y $transalpine_gaul_region$#!, #Y $aquitaine_region$#!, #Y $central_gaul_region$#!, #Y $armorica_region$#!, or #Y $belgica_region$#!, neighbours #Y Rome#! or a Subject, is not allied with #Y Rome#!, is not a Subject, has at least #Y 4#! Territories, has greater than #R -50#! opinion of #Y Rome#!, is a lower Rank than #Y Rome#!."
 roman_7_secure_allies_rewtt:0 "$roman_diplo_reward_tt$ a neighbouring #Y Gallic#! tribe."
 roman_7_greek_colonies_tooltip:2 "#Y Massilia#!, or another #Y Massalian#! nation, exists in #Y $transalpine_gaul_region$#!, neighbours #Y Rome#! or a Subject, is not a Subject, is not allied with #Y Rome#!, owns #Y Massalia#! OR has at least #Y 3#! Territories including a port, has greater than #R -50#! opinion of #Y Rome#!, is a lower Rank than #Y Rome#!."
 roman_7_greek_colonies_rewtt:0 "$roman_diplo_reward_tt$ a neighbouring #Y Massalian#! state."
 roman_7_land_purchase:0 "Territory Purchases"
 roman_7_offer_gauls_protection_tooltip:2 "A #Y $gallic$#!, #Y $belgae_group$#!, #Y $celto_pannonian_group$#! or #Y $proto_european$#! nation exists in the Regions of #Y $transalpine_gaul_region$#!, #Y $aquitaine_region$#!, #Y $central_gaul_region$#!, #Y $armorica_region$#!, or #Y $belgica_region$#!, neighbours #Y Rome#! or a Subject, is not a Subject, is not allied with #Y Rome#!, has greater than #R -50#! opinion of #Y Rome#!, is a lower Rank than #Y Rome#!, and is at conflict with a foreign nation with a greater number of Territories."
 roman_7_secure_provincia_DESC:0 "Southern Gaul holds the most promising and vulnerable settlements. By crossing the Alpes and securing the important harbours we will be in an excellent position to expand northwards."
 roman_7_to_the_rhine_DESC:0 "The Rhenus river seperates the German wastes from Gaul. We must secure its banks to ensure the Germans do not exploit the weakness of Gaul and demarcate the extent of our novel holdings."
 roman_roman_7_established_in_gaul_tt:0 "Select between a policy of production OR civilisation in Gaul."
 roman_mission_08_greece_DESCRIPTION:0 "The people of Greece were long known for their civilisation, their many city-states and the many wondrous thoughts and ideas that they inspired. After the rise of Alexander, they have been driven apart and fallen upon harsh times, mere specters of the prominent position they once held at the centre of the Mediterranean."
 roman_mission_08_greece_BUTTON_TOOLTIP:0 "The people of Greece have been shattered by the many conflict campaigns in the area by foreign autocrats, it is time for Rome to restore peace in the region once and for all."
 roman_mission_08_greece_task_1_DESC:0 "To navigate the eastern Mediterranean, we will require an efficient quick fleet to scout down enemy movement and strike them where they are weak."
 roman_mission_08_greece_task_1_trigger_tt:0 "#Y [SCOPE.sCountry('mission_country').GetName]#! has #Y [SCOPE.ScriptValue('roman_mission_eastern_strike_fleet_max_svalue')|0]#! or more light vessels (#Y [SCOPE.ScriptValue('roman_mission_eastern_strike_fleet_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('roman_mission_eastern_strike_fleet_max_svalue')|0]#!)"
 roman_mission_08_greece_task_2_DESC:0 "The people of Illyria are infamous pirates and raiders who have brought pain and misery to most urban centres along the Adriatic Sea at one point or another. If we are to bring peace to our territories, we are going to have to come to an agreement with these warlike barbarians."
 roman_mission_08_greece_task_2_trigger_tt:1 "There is a minor #Y Illyrian#! nation with higher than #Y 15#! opinion of #Y Rome#! holding coastal territory in the region of #Y Illyria#!"
 roman_mission_08_greece_task_3_DESC:0 "The first step in securing our territories from foreign menaces are to take control of the other side of the Adriatic so our men have a secure area to territory in and commence their campaigns for pacifying dangerous Illyrian territory."
 roman_mission_08_greece_task_4_DESC:0 "The region of Greece is known for its many islands spread across the Greek sea, and a handful of these would make perfect entry points for our armies so they have a safe haven when they commence spreading the influence of Rome across the rest of the Greek world."
 roman_mission_08_greece_task_5_DESC:0 "With promises of liberation and protection, we will commence securing allies in Greece proper."
 roman_mission_08_greece_task_6_DESC:0 "With our first step into Illyria secured, it is essential that we continue our campaign deeper into Greek and Illyrian territories while we have the initiative."
 roman_mission_08_greece_task_7_DESC:0 "The Dardanian territories to the north have invariably been a thorn in the side for their neighbours as well as any would-be conquerors from the south. It is time to prove that Rome is the exception to that rule."
 roman_mission_08_greece_task_8_DESC:0 "As the liberators of Greek civilisation and culture, we are certain to be recognised by the people of Greece."
 roman_mission_08_greece_task_11:0 "Home of Civilisation"
 roman_mission_08_greece_task_11_DESC:0 "Attica and Boeotia are the homeland of many known philosophers, playwrights and poets, famous from one end of the Mediterranean to the other. Though they have fallen on harsh times lately, the right ruler would make these rich territories flourish once more."
 roman_mission_08_greece_task_12:0 "Liberty First"
 roman_mission_08_greece_task_final_tt:0 "We will be given the option of releasing some of the major urban centres of #Y Greece#! as #Y Client States#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 roman_6_conquest_africa_DESCRIPTION:0 "Now that the Carthaginians have been kicked out of Hispania; and Corsica, Sardinia, Sicily, as well as the once-great city of Carthage, a shadow of her former self, are chained to the Roman yoke, it is time to turn our attention to the rest of Africa. There shall be no peace while the Carthaginian empire could still rise from the ashes. Subdued by Rome shall be her territories, and subdued by Rome her peoples."
 roman_6_conquest_africa_BUTTON_TOOLTIP:0 "The rich and fertile territories of Africa shall feed the people of Rome. The glory that once was Carthage's great empire will be reduced to nothing more than our bread basket."
 roman_6_roman_numidia_tt:1 "Every colonised territory in the Region of #Y $numidia_region$#! is owned by #Y [SCOPE.GetRootScope.GetCountry.GetName]#! or one of their subjects (#Y [SCOPE.ScriptValue('roman_mission_roman_numidia_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('roman_mission_roman_numidia_max_svalue')|0]#!)."
 roman_6_colonize_syrtis:0 "Colonise the Coast of Syrtis"
 roman_6_roman_africa_DESC:0 "The first step in the conquest of Africa is to grab the hinterlands of Carthage and its sister urban centres Utica and Kerkouane."
 roman_6_phoenician_cities:0 "Phoenician Urban centres"
 roman_6_phoenician_cities_DESC:0 "The ancient Phoenician colonies on Africa's eastern coastline, former tributaries of Carthage, are wealthy trading urban centres, and require to be conquered or subjugated, and their affluence redirected to the port at Ostia."
 roman_6_punic_colonies_DESC:0 "The Carthaginians established colonies in favourable port locations along the coastline to the west of Carthage, leaving Punic hot spots amid vast swathes of Massylian and Massaesylian tribes. We must extend our control of the coastline along the Massaesylian coast, all the way to Rusaddir in the West."
 roman_6_integrate_DESC:0 "All of Africa, from Tripolitania to the Pillars of Hercules, and beyond, is under our control. However, our Punic subjects, spread out as they may be, seethe quietly in their homes, just waiting for the chance to rise up versus us. We will focus our efforts on integrating the people of Africa into Rome proper."
 roman_6_integrate_tt:0 "Completing this task will let us decide on how to deal with the inhabitants of ex-Carthaginian territories."
 roman_6_befriend_cyrenaica_tt:0 "We will dispatch emissaries to #Y Cyrenaica#! extending our offer of friendship."
 roman_6_befriend_cyrenaica_tt_2:0 "The Kingdom of #Y Cyrenaica#! must exist, not be Allied to, at Conflict with, or Subject of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! "
 roman_6_befriend_numidia_DESC:0 "At times it is better to look for allies among the locals, rather than simply conquer everything on our own. With some luck, we should be able to rally the local tribes versus Carthage."
 roman_6_befriend_numidia_tt:0 "We will dispatch emissaries to Numidian tribes looking for potential allies among the locals."
 roman_6_befriend_numidia_tt_2:1 "Any Tribes with #Y Numidian#! culture which exist in the Region of #Y $numidia_region$#! must not be Allied to, at Conflict with, or Subject of #Y [SCOPE.GetRootScope.GetCountry.GetName]#!, and must be no larger than a quarter of its size."
 roman_6_unified_numidia_DESC:0 "In order to evade having to govern all of Africa ourselves, the Senate has decided to set up a Client Kingdom in the hills of Numidia. They will govern the area on our behalf, and pay us monthly tribute."
 roman_mission_09_eastern_glory_DESCRIPTION:0 "In the far east, beyond the territories of the Greeks, lies the Anatolian plains, the Syrian desert, and the rich fertile territories of Egypt and Palestine. Because time immemorial it has been the homeland of great kingdoms and empires, stretching from the known world all the way to the distant Indus."
 roman_mission_09_eastern_glory_task_1:0 "The Ionian Urban centres"
 roman_mission_09_eastern_glory_task_1_effect_tt:2 "Attempt to secure #Y Client States#! in the Areas of #Y $ionia_area$#!, #Y $aeolia_area$#! and #Y $coastal_caria_area$#!"
 roman_mission_09_eastern_glory_task_2_DESC:0 "At times it is better to look for allies among the locals, rather than simply conquer everything on our own. With some luck, we should be able to set the local kings up versus one another."
 roman_mission_09_eastern_glory_task_2_effect_tt:0 "We will dispatch emissaries to Anatolian kings looking for potential allies among the locals."
 roman_mission_09_eastern_glory_task_3_DESC:0 "The wild territories of Thrace have slowly become more accustomed to foreign civilised rulership because Lysimachos took control of the region. Rich and fertile, it is a perfect area for our people to settle and create a colony for further eastern campaigns."
 roman_mission_09_eastern_glory_task_4_DESC:0 "As our eastern campaigns continue, and our people grow, we will require more food in our villages and urban centres. Securing a deal with the people of the Nile Delta would ensure that we would fix the shortages we currently have."
 roman_mission_09_eastern_glory_task_4_effect_tt:0 "Dispatch a delegation to a country at peace with #Y [SCOPE.GetRootScope.GetCountry.GetName]#! who holds territory with #Y Grain#! trade good in the #Y Egyptian Delta#!"
 roman_mission_09_eastern_glory_task_7_DESC:0 "After the fall of the Persian empire, the area of Syria became the capital of the Antigonid kingdom when they built the novel city of Antigoneia. At the crossroads between Anatolia, Mesopotamia and Phoenicia, it is an important location for all would-be rulers of the region."
 roman_mission_09_eastern_glory_task_8_DESC:0 "The rich territories of Anatolia have been the home of many nations, be it the ancient kingdoms of the past, the more recent Persian empire or Alexander and his Successors."
 roman_mission_09_eastern_glory_task_9:0 "The Pontic Menace"
 roman_mission_09_eastern_glory_task_10_DESC:0 "The territories of Palestine hold an untold amount of urban centres, towns and villages, with rich and fertile farmland. Often falling to foreign overlordship, the people are notoriously stubborn and refuse the leadership of others."
 roman_mission_09_eastern_glory_task_11_DESC:0 "The mountainous region of Cilicia has often been the home of pirates and raiders who terrorise the eastern Mediterranean. As the area is difficult to navigate, they have been practically impossible to get rid of and the province difficult to control."
 roman_mission_09_eastern_glory_task_12_effect_tt:1 "Release #Y Judea#! as a #Y Client State#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#!\nThe novel #Y Client State#! will be given all non-coastal territories #Y [SCOPE.GetRootScope.GetCountry.GetName]#! owns in the Areas of #Y $judea_area$#!, #Y $peraea_area$#!, #Y $samaria_area$#! and #Y $galilee_area$#!"
 roman_mission_09_eastern_glory_task_13_DESC:0 "These large urban centres in the southern parts of Syria-Coele and northern parts of Judea that have often come together to protect one another from the dangers of the larger nations at the world, and have sometimes been considered a minor league themselves."
 roman_mission_09_eastern_glory_task_13_effect_tt:2 "Release #Y Decapolis#! as a #Y Client State#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#!\nThe novel #Y Client State#! will be given all territories #Y [SCOPE.GetRootScope.GetCountry.GetName]#! owns in the Province of #Y $decapolis_area$#!"
