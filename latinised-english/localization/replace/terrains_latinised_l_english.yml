l_english:
 plains_desc:1 "A sparsely forested place, consisting of sweeping tracts of flat territory."
 farmland_desc:0 "This fine arable territory is dotted with minor clusters of fields, orchards, and grazing livestock."
 coastal_terrain_desc:0 "Along coastlines and in archipelagos the sea is generally more shallow and affords less room for manoeuvre."
 riverine_terrain_desc:0 "Most rivers are not fit to be navigated by vessel but some are wide and deep enough for smaller vessels to navigate them."
