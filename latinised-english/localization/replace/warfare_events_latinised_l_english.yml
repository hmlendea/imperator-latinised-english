l_english:
 warfare.1.desc:1 "[ROOT.GetCharacter.GetName] has led [ROOT.GetCharacter.GetHerHis] men to glorious victory during the siege of [SCOPE.sP('temp_city_scope_warfare_1').GetName]. The enemy flee in disgrace, and all that is left is to decide on how to treat the residents within.\n\nNeedless to say, the spoils of conflict are likely to cause those back in [ROOT.GetCharacter.GetEmployer.GetCapital.GetName] to admire [ROOT.GetCharacter.GetPraenomen] greatly, but leaving such affluence in the hands of one [ROOT.GetCharacter.GetWomanMan] could cause problems in future..."
 warfare.2.desc:1 "After the siege of [SCOPE.sP('temp_city_scope_warfare_1').GetName], [SCOPE.sChar('siege_instigator').GetName] let [SCOPE.sChar('siege_instigator').GetHerHis] troops run riot, resulting in murder, rape, and theft. The affluence that [SCOPE.sChar('siege_instigator').GetPraenomen] has obtained from this malicious act is beyond compare, and our advisors suggest that [SCOPE.sChar('siege_instigator').GetSheHe] is now one of the richest people in our territory. Even deserters previously resident in [SCOPE.sP('temp_city_scope_warfare_1').GetName] are flocking to join [SCOPE.sChar('siege_instigator').GetPraenomen].\n\nDespite [SCOPE.sChar('siege_instigator').GetHerHis] popular acclaim, we should consider punishing [SCOPE.sChar('siege_instigator').GetHerHim] for these dastardly actions."
 warfare.2.c:0 "Require that affluence is divided with the army!"
 returning_merc_first:0 "Numerous long years ago, [SCOPE.sChar('returning_merc').GetName] was dispatched out into the world with an army of [ROOT.GetCountry.GetAdjective] soldiers under [SCOPE.sChar('returning_merc').GetHerHis] command.\n\n"
 returning_merc_siege_yes:0 "Stories have been heard across our realm, of the numerous exploits and successes of [SCOPE.sChar('returning_merc').GetPraenomen]; even the bards still sing of the glorious sacking of [SCOPE.sP('siege_loc').GetName], in which [SCOPE.sChar('returning_merc').GetPraenomen] is said to have routed the defenders almost single-handedly.\n\n"
 returning_merc_siege_no:0 "Sadly, few stories were heard of [SCOPE.sChar('returning_merc').GetPraenomen], during [SCOPE.sChar('returning_merc').GetHerHis] times away - indeed, few even recognised [SCOPE.sChar('returning_merc').GetHerHim] upon [SCOPE.sChar('returning_merc').GetHerHis] appearance at the [ROOT.GetCountry.Custom('get_court_type')], however, [SCOPE.sChar('returning_merc').GetPraenomen] assures us of the recently acquired tenacity of [SCOPE.sChar('returning_merc').GetHerHis] resolve.\n\n"
 returning_merc_success:0 "Tales of feats and misdeed aside, [SCOPE.sChar('returning_merc').GetPraenomen] has returned in good spirits, and with a sizeable quantity of affluence. We ought to be wary of [SCOPE.sChar('returning_merc').GetHerHis] recently acquired standing amongst our [ROOT.GetCountry.Custom('get_court_type')]."
 character_events.44.desc:0 "After numerous long years adventuring, [SCOPE.sChar('returning_merc').GetName] has set foot back on [ROOT.GetCountry.GetAdjective] soil.\n\nMuch to the dismay of our court, it seems that [SCOPE.sChar('returning_merc').GetPraenomen] learned a little more of the methods of intrigue, than we had hoped. Upon crossing the frontier, [SCOPE.sChar('returning_merc').GetSheHe] issued a stark proclamation in support of the vile pretender, [SCOPE.sChar('supported_pretender').GetName].\n\nLet us hope that we are able to soothe the mind of [SCOPE.sChar('returning_merc').GetPraenomen] with honeyed words, or better still: gold."
 character_events.47.desc:0 "Muttered whispers have foretold the return of once-heir, [SCOPE.sChar('returning_merc').GetName]. Numerous years ago, [SCOPE.sChar('returning_merc').GetSheHe] left the [ROOT.GetCountry.GetAdjective] court, intent on forging a destiny in faraway territories, before returning to await the inevitable coronation that awaited [SCOPE.sChar('returning_merc').GetHerHim].\n\nEvents move fast, however, and whilst [SCOPE.sChar('returning_merc').GetPraenomen] was in foreign parts, the beloved monarch [SCOPE.sChar('old_king').GetName] passed away, resulting in the rise of [ROOT.GetCountry.GetRuler.GetName].\n\n[SCOPE.sChar('returning_merc').GetPraenomen] believes that [SCOPE.sChar('returning_merc').GetSheHe] is the only true ruler our country deserves, and many, it seems, are in agreement."
 character_events.48.desc:0 "Envoys delivered the grave news today, that [SCOPE.sChar('dead_merc').GetName] has fallen, while pursuing a life of adventure beyond the frontiers of [ROOT.GetCountry.GetName].\n\nWe are informed that a cairn now lies in [SCOPE.sP('death_location').GetName], where many visit to mourn the fallen warrior."
 character_events.48.desc_successor:0 "\n\nThe mighty [SCOPE.sChar('dead_merc').GetPraenomen] once stood in direct succession to the [ROOT.GetCountry.GetAdjective] throne, and our people cry out in anguish that [SCOPE.sChar('dead_merc').GetSheHe] perished so far from [ROOT.GetCountry.GetAdjective] soil."
 warfare.6.desc:0 "Eager to exploit enemy weaknesses, it seems [ROOT.GetCharacter.GetName] has exposed [ROOT.GetCharacter.GetHerselfHimself] to considerable risks, and now has a novel wound for [ROOT.GetCharacter.GetHerHis] trouble."
 warfare.7.desc:0 "Somehow [ROOT.GetCharacter.GetName] must have gotten separated from the main force.\n\nIn the midst of battle the honourable commander was suddenly nowhere to be found and our forces in [battle_location.GetName] stood without leadership."
 warfare.9.desc:0 "While no one saw exactly what occurred, it seems somehow [ROOT.GetCharacter.GetName] was hit with a piece of flying rubble in the middle of the battle [ROOT.GetCharacter.GetSheHe] was commanding in [battle_location.GetName].\nThe impact must have been lethal, as [ROOT.GetCharacter.GetSheHe] shows no signs of life."
 warfare.17.desc:0 "Surveying the successful siege of Argos, the divine, multitalented Pyrrhos, casts his passionless eyes about the carnage. As he strides with lion-like grace into the city's main square, something glints on a rooftop...\n\nAs he scans the horizon, another movement catches his eye. Fearing an ambush, he signals his loyal males, who fan out into a defensive formation with consummate discipline.\n\nThen - another sound - this time from behind.\n\n'What's that?', he cries..."
