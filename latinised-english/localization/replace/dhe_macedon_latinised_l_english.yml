l_english:
 dhe_macedon.3.desc:0 "[kassandros_scope.GetEmployer.GetRulerTitle] [kassandros_scope.GetPraenomen] has been complaining more and more of terrible pain in his limbs, filling the moonlit corridors of the palace with anguished wailing long into the night.\n\n[kassandros_scope.GetHerHis|U] personal physic, [physician_scope.GetPraenomen], has now confirmed the cause to be the infamous 'disease of kings', most commonly found in those who consume and drink lavishly..."
 dhe_macedon.4.desc:0 "[philip_iv_scope.GetPraenomen], the eldest son of the diadochi Kassandros, has been stricken with a terrible malady that is said to be slowly eating [philip_iv_scope.GetHerHim] away internally, throwing the succession of [philip_iv_scope.GetEmployer.GetName] into disarray.\n\n[physician_scope.GetPraenomen], the court doctor, has seemingly resigned [physician_scope.GetHerselfHimself] to the hopelessness of treating the disease, perhaps encouraged by the waiting pretenders..."
 dhe_macedon.6.desc:0 "More news from Macedon, where now [philip_iv_scope.GetPraenomen], the eldest son of the diadochi Kassandros, has apparently been stricken with a terrible malady that is said to be slowly eating [philip_iv_scope.GetHerHim] away internally, throwing the succession of [philip_iv_scope.GetEmployer.GetName] into disarray..."
 dhe_macedon.7.desc:1 "Spurred by growing ambition and the uncertainty of the times, [antipatros_scope.GetEmployer.GetRulerTitle] [antipatros_scope.GetPraenomen] will endure no pretenders to [antipatros_scope.GetHerHis] claim on [antipatros_scope.GetEmployer.GetName]'s throne, not even his own [alexandros_scope.GetSisterBrother] [alexandros_scope.GetPraenomen].\n\n"
 dhe_macedon.8.b:0 "A surprise, assuredly."
 dhe_macedon.9.desc_1:0 "[dhe_macedon_9_banish.GetPraenomen], the younger, has been forced to take up arms against his elder brother, and has now arrived at our court requesting assistance in the struggle."
 dhe_macedon.9.desc_2:0 "[dhe_macedon_9_banish.GetPraenomen], the eldest, has been forced to take up arms against his younger brother, and has arrived at our court requesting assistance in the struggle."
 dhe_macedon.9.tt:0 "[dhe_macedon_9_banish.GetFullName] has started a civil struggle against his brother, [dhe_macedon_9_ruler.GetFullName]."
 desc_dhe_macedon_transfer_unrest_pmod:0 "The once relatively autonomous citizens of these towns are outraged at having their liberty given up with no say in the matter."
 dhe_macedon.13.desc:0 "The treacherous Antipatrids in Macedon can scarcely govern themselves, let alone their kingdom, fighting brother versus brother and destroying their realm in the process. Interestingly however, [mac_civil_war_scope.GetRuler.GetName] has called on our [mac_civil_war_scope.GetRulerTitle] to visit with [mac_civil_war_scope.GetRuler.GetHerHim], offering friendship and alliance.\n\nThe Antipatrids have proven their reputation for skulduggery, but this may be an opportunity to seize the Macedonian kingdom without undue bloodshed, or simply earn their confidence."
 dhe_macedon.13.at:0 "We will seize the territory of [mac_civil_war_scope.GetRuler.GetName|Y], but may go to armed conflict with [GetCountry('MAC').GetRuler.GetName|Y]."
 dhe_macedon.13.b:0 "We will assist them, and not dishonor ourselves."
 dhe_macedon.13.c:0 "The Antipatrids can go to Hades if they require assistance."
 dhe_macedon.15.b:0 "This means armed conflict."
 dhe_macedon.15.bt:0 "We have obtained claims on all @[antigonids_scope.GetFlag]! [antigonids_scope.GetName|Y] territory."
 dhe_macedon.16.desc:0 "[antipatros_scope.GetPraenomen], the simpering would-be [antipatros_scope.GetEmployer.GetRulerTitle] of [antipatros_scope.GetEmployer.GetName], has come running for assistance versus the Antigonids.\n\nThe strife of the Antipatrids, along with the cruelty of their rule and heinous acts against Alexander's family have made them deeply unpopular in Macedon, and it is minor wonder [antigonids_scope.GetRuler.GetPraenomen] has had no trouble claiming the throne.\n\nOur patience with these fools runs thin, and we must be bold if we are to stop the resurgence of the Antigonid nuisance..."
 dhe_macedon.16.b:0 "Nonsense, we will assist [antipatros_scope.GetPraenomen]."
