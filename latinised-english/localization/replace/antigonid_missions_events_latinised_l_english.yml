l_english:
 me_antigonid_1_vision.1.desc:2 "When he was appointed satrap of [GetProvince('(int32)1936').GetArea.GetRegion.GetName] after the battle of [GetProvince('(int32)796').GetName], no one, least of all [GetCharacter('(int32)37').GetPraenomen] himself, could have foreseen the power and glory that lay in store for him. Silently managing his lands from [GetProvince('(int32)1936').GetName], he retained his satrapy after [GetCharacter('(int32)39').GetPraenomen]'s demise - despite his absence from [GetProvince('(int32)918').GetName] at the time - until the ambitious regent [GetCharacter('(int32)409').GetPraenomen] moved versus him. [GetCharacter('(int32)37').GetPraenomen] was forced to pursue aid from [GetCharacter('(int32)9').GetPraenomen] and [GetCharacter('(int32)16').GetPraenomen].\n\nFrom these lows, he was appointed strategos of [GetProvince('(int32)290').GetArea.GetRegion.GetName] by [GetCharacter('(int32)9').GetPraenomen] at [GetProvince('(int32)761').GetName], defeated the Perdikkan satraps, thwarted [GetCharacter('(int32)9').GetPraenomen]'s heir [GetCharacter('(int32)32').GetPraenomen]' ambitions, chased [GetCharacter('(int32)408').GetPraenomen] - that wily Greek - into [GetProvince('(int32)1595').GetArea.GetRegion.GetName], seized the Achaemenid treasuries, and reversed the land grabs of [GetCharacter('(int32)41').GetPraenomen] and [GetCharacter('(int32)42').GetPraenomen] - ruling [GetCharacter('(int32)39').GetPraenomen]'s empire from [GetProvince('(int32)257').GetName] to [GetProvince('(int32)4799').GetName].\n\nBecause then, [GetCharacter('(int32)24').GetPraenomen] has reclaimed the unruly and irrelevant east, uniting with the other Diadochi versus [GetCharacter('(int32)37').GetPraenomen]' spear-won kingdom, while they fall to all manner of vainglorious excesses; regicide, kin-slaying, wanton apotheosis..."
 me_antigonid_1_vision.1.a:0 "Honour and family will see us through."
 me_antigonid_1_vision.2.desc:0 "The development and expansion of [GetCharacter('(int32)37').GetPraenomen]' realm continues, and there is no longer any doubt that our kingdom, despite the dogged attempts of the other Diadochi to undermine it, has triumphed over the alliance formed against it by his ancient rivals: [GetCharacter('(int32)42').GetPraenomen], [GetCharacter('(int32)32').GetPraenomen], [GetCharacter('(int32)24').GetPraenomen], [GetCharacter('(int32)41').GetPraenomen]..."
 me_antigonid_1_vision.11.desc:1 "The novel city of [GetProvince('(int32)790').GetName] represents not only the development of his realm, but the culmination of Antigonos' life of statecraft and warfare from his time as a general under Philip II to the victory of his son Demetrios over Ptolemaios at Salamis.\n\nAt extended last the eastern capital is approaching completion, and with it the grand festival which has drawn musicians and actors from throughout the Hellenistic world to honour Antigonos' dynasty."
 me_antigonid_1_vision.12.desc:0 "The gods have smiled on our efforts at [GetProvince('(int32)790').GetName], where the administrative and public structures have now been completed, at last. A grand festival and victory parade were held, drawing performers from throughout the Hellenic world for a peerless spectacle, and showing to all the glory and prestige of the Antigonid dynasty.\n\nWatching from the balcony of the palace, its members can be assured that their royalty is now placed beyond doubt, joining the likes of the Argeads as one of the great Macedonian houses of all time."
 me_antigonid_1_vision.13.desc:0 "While we look to civic improvement and the entertainment of the people, our vicious rivals, of course, descend on us once more. The preparations for the completion of [GetProvince('(int32)790').GetName] and grand festival are still in progress, and we can recoup much of the costs if we need these funds to prosecute another armed conflict, sad as it may be to cancel our victory parade."
 me_antigonid_1_vision.14.b:0 "We will withdraw to the ancient capital."
 me_antigonid_1_vision.21.desc:0 "In all subsequent planning for the Antigonid capital, the old port of Myriandros and Antigonos' veteran settlement at Alexandreia kat'Isson were the focus of our maritime efforts, utilising the old Persian road over the Syrian Gates.\n\nThey have served our capital well, but there are suggestions that the settlement of Hydatos - just a brief distance down the Orontes river and already settled by Antigonos with Carian veterans - could be developed into the main port of Antigoneia."
 me_antigonid_1_vision.21.b:0 "Hydatos has a considerable deal of potential."
 me_antigonid_1_vision.22.desc_1:0 "The humble outpost that sprang up around Alexander's trophy after the battle of [GetProvince('(int32)796').GetName] now outshines the old port at Myriandros, attracting merchants and artisans from far and broad. There is minor doubt that this site's importance and suitability have not been overestimated..."
 me_antigonid_1_vision.22.desc_2:0 "The harbormaster of the once humble moorings at Hydatos can now boast of some of the finest facilities in the east, opening the manner for a considerable volume of commerce and a growing district of shipwrights and chandlers.\n\nOur men liken Hydatos' site to the region of Pieria in our old homeland of Macedon - which likewise sits between a considerable mountain and the sea, and is the seat of a considerable port in [GetProvince('(int32)6399').GetName] - and already call it Antigoneia after the capital it serves."
 me_antigonid_1_vision.22.desc_3:0 "Favouring a balanced method, the dual ports of Myriandros and Hydatos will continue to serve the capital as before, with their facilities both receiving some much appreciated accoutrements and investment."
 me_antigonid_1_vision.22.a:0 "Our capital will possess no rivals."
 me_antigonid_1_vision.23.desc:0 "With our grip over Antigoneia and the surrounding area slipping, our plans to develop its ports are among the first to be abandoned. The vicissitudes of history have stolen another Antigonid dream..."
 me_antigonid_1_vision.31.t:0 "$antigonid_01_vision_3$: Maritime Cities"
 me_antigonid_1_vision.31.desc:0 "Our ties in Greece and control over the Mediterranean require a robust navy to maintain, something which the Phoenicians in our service have aided us with greatly.\n\nIf we are to maintain our naval supremacy we must ensure our connections with these maritime cities are renewed and continued."
 me_antigonid_1_vision.31.at:0 "$me_ant_task_start_tt_1$ additional talks with the Phoenician city states."
 me_antigonid_1_vision.32.desc:1 "Our dealings with the Phoenicians have refreshed our long standing relationships, injecting a novel spirit of urgency to the shipyards and midships of our subjects. Let us ensure our naval victories are not renowned for their infrequency, and may the triumph at Salamis mark a novel era of Antigonid dominance in the internal sea."
 me_antigonid_1_vision.33.desc:0 "The loss of the Phoenician cities has upset our maritime ambitions in the region, stealing away the great shipyards and sailors of the antique trading ports..."
 me_antigonid_1_vision.34.desc_1:0 "Our Phoenician subjects have provided a considerable deal of vessels and mariners to our cause, and [philokles_of_sidun.GetPraenomen], a wealthy prince of the city of [GetProvince('(int32)747').GetName], has played a important role in commanding and corralling these naval forces on our behalf.\n\nHowever, it is clear the prince yearns for the throne of his city-kingdom, and considers it is now high time we returned [philokles_of_sidun.GetHerHis] many favours and generous outlays, with the menace of finding employment elsewhere if we refuse..."
 me_antigonid_1_vision.34.desc_2:0 "[philokles_of_sidun.GetPraenomen] of [GetProvince('(int32)747').GetName], a wealthy prince of the city, has aided our cause in the past, particularly with our Phoenician navies. However, [philokles_of_sidun.GetHerHis] ambition to the throne of [philokles_of_sidun.GetHerHis] native city has caused a fracture in our relationship."
 me_antigonid_1_vision.34.b:0 "What a disgrace..."
 me_antigonid_1_vision.35.desc:1 "[philokles_sender.GetAdjective] envoys have arrived in [ROOT.GetCountry.GetCapital.GetName] with [philokles_of_sidun.GetPraenomen] of [GetProvince('(int32)747').GetName], an wealthy noble of the city who has designs on its throne as a recompense for services to the Macedonians.\n\n"
 me_antigonid_1_vision.36.desc_3:0 "[philokles_of_sidun.GetPraenomen] of [GetProvince('(int32)747').GetName] has been proclaimed king of the city with our blessing, taking the throne with minor fanfare or strife."
 me_antigonid_1_vision.37.desc:0 "[philokles_of_sidun.GetPraenomen] of [GetProvince('(int32)747').GetName] has arrived in our court, a disgruntled prince seeking aid in pressing [philokles_of_sidun.GetHerHis] claim to his native city's throne - a recompense denied by the Antigonids despite [philokles_of_sidun.GetHerHis] services to their cause."
 me_antigonid_1_vision.38.desc:0 "The jetties of Phoenicia boast no scarcity of experienced mariners and captains, hardened by decades spent escorting or looting the numerous merchants who seek their cities out.\n\nOne man in particular, a native known as [phoenician_admiral.GetPraenomen], has risen to considerable prominence and renown, and has been recommended to us as a reliable helmsman and squadron commander."
 me_antigonid_1_vision.39.desc:1 "The masterful shipwrights of the Phoenician cities have for centuries been famed for the skill with which they transform the famed cedar trees of Lebanon into ocean-going craft, selling their creations to the highest bidder. We may once again stand in need of naval reinforcement via commerce, if the price is right."
 me_antigonid_1_vision.39.a:1 "There are never sufficient vessels."
 me_antigonid_1_vision.39.b:1 "We can construct our own fleets."
 me_antigonid_1_vision.40.desc:0 "Our requested vessels have arrived off the coast of our port of [port_ship_scope.GetName], where they were handed over by the [sidun_scope.GetAdjective] mariners to our own mariners. These vessels shall be a considerable addition to our naval forces."
 me_antigonid_1_vision.51.desc:0 "After foiling [GetCharacter('(int32)42').GetPraenomen]' grasping attempts to seize [GetProvince('(int32)687').GetArea.GetRegion.GetName], and recovering the strategic city of [GetProvince('(int32)743').GetName], [GetCharacter('(int32)37').GetPraenomen] pledged to defend the liberty of the Greek cities in the name of Macedon.\n\nThough sneered at by some as merely a political expediency, it fostered hope among the Greeks that they will one day govern themselves without Macedonian interference as in the days of ancient; hope that we can employ versus the other Diadochi."
 me_antigonid_1_vision.52.desc:0 "Our envoys scattered throughout the Aegean, attending to boulai from [GetProvince('(int32)290').GetArea.GetName] to [GetProvince('(int32)418').GetArea.GetName] with reassurances and reminders. The Greek world has suffered domination at Macedonian hands since [GetCharacter('(int32)35').GetPraenomen] II's victory over [GetCountry('THE').GetName], and we must ensure their obedience is secured by the promise of minimal domestic interference - treating them as allies rather than subjects - else they will pursue to revive their glorious past at the earliest opportunity."
 me_antigonid_1_vision.53.desc:0 "Encouraged by our continuing diplomatic efforts and [GetCharacter('(int32)37').GetPraenomen]' past involvement in the synoikism, or consolidation, of struggling Greek towns into unified prosperous outposts, our [ant_1_5_synoikism_scope.GetAdjective] subjects have approached us pursuing our aid.\n\nTheir [ant_1_5_synoikism_scope.GetRulerTitle] [ant_1_5_synoikism_scope.GetRuler.GetPraenomen] entreats that we provide our resources and expertise, as their protectors, to the reorganisation of [ant_1_5_synoikism_province_scope.GetName] along similar lines."
 me_antigonid_1_vision.53.b:0 "Our own matters are pressing sufficient."
 me_antigonid_1_vision.54.desc:0 "The magistrates dispatched to aid the [ant_1_5_synoikism_scope.GetAdjective] synoikism of [ant_1_5_synoikism_province_scope.GetName] and its neighbouring townships report their labour is accomplished.\n\nThe organisation of this novel urban centre will hopefully help our subject to assist us, and maintain Greek relations warm for the time being..."
 me_antigonid_1_vision.54.a:0 "That should halt their nagging..."
 me_antigonid_1_vision.56.desc_1:0 "[ant_1_5_dispute_subject_1.GetName] and [ant_1_5_dispute_subject_2.GetName] have a long-standing dispute over the [ant_1_5_dispute_territory_1.GetName]-[ant_1_5_dispute_territory_2.GetName] border, and pursue our opinion to resolve the matter..."
 me_antigonid_1_vision.61.desc:0 "[GetCharacter('(int32)37').GetPraenomen] and [GetCharacter('(int32)38').GetPraenomen] have already been acknowledged, like [GetCharacter('(int32)39').GetPraenomen] the Great himself, as living divinities by some of the Greek cities, but now it is time we officially adopted our royal dynasty into the state pantheon as the Lagids have accomplished, making our rulers equal to the great kings of [GetCountry('MAC').GetName] - [GetCharacter('(int32)35').GetPraenomen] and [GetCharacter('(int32)39').GetPraenomen] - and drawing closer to the religious influences of our eastern lands..."
 me_antigonid_1_vision.62.desc:0 "Our efforts to legitimise the impending deification of our rulers have met with considerable success, even if they may be sneered at by some of the more traditional Greek and Macedonian nobles. Alexander's examples have changed the world, and we must adopt his religious innovations if our rulers are to compete for legitimacy in the east."
 me_antigonid_1_vision.71.c:0 "The northern frontier in [ant_01_frontier_tre_scope.GetShortName] is vulnerable to [GetCountry('TRE').GetName]."
 me_antigonid_1_vision.72.desc:0 "Our military engineers and builders have completed the bastion in [ant_01_frontier_scope.GetName], securing [ant_01_frontier_scope.GetState.GetShortName] versus any direct [ant_01_frontier_owner_scope.GetAdjective] onslaught in [me_antigonids_scope.GetAdjective] [ant_01_frontier_scope.GetArea.GetRegion.GetName] and providing a local centre for our garrisons and patrols to employ."
 me_antigonid_1_vision.81.desc:0 "While our nobility remains Macedonian, a considerable number of our subjects are decidedly foreign in their customs and tongues. Now it has been suggested - both as a method to acquire the goodwill of our subjects and to mark our benevolence in the east over previous Macedonian rulers - that the historic Isaurian city of [GetProvince('(int32)169').GetName], whose occupants set their city ablaze and perished as a desirable alternative to defeat at the hands of the power-hungry regent Perdikkas, be re-founded."
 me_antigonid_1_vision.82.desc:0 "Our reconstruction of the once important city of [GetProvince('(int32)169').GetName], scorched until all that remained was the melted gold of their treasury and temples, is now complete. As intended, the works have pleased the local populace who once pointed to its destruction as an example of defiance versus the cruelty of Macedonian rule."
 me_antigonid_1_vision.91.desc:0 "[GetCharacter('(int32)37').GetPraenomen] has already spent considerable time ensuring the fortitude of his kingdom's manpower and cultural foundations, establishing Macedonians, Cretans, Chalkidians and Hellenised Carians, throughout his urban centres.\n\nThough [GetProvince('(int32)790').GetName], [GetProvince('(int32)782').GetName], [GetProvince('(int32)1986').GetName], and [GetProvince('(int32)258').GetName] are sure to be timeless testaments to his foresight and magnificence, additional colonists can only benefit our diverse kingdom."
 me_antigonid_1_vision.92.t:0 "$antigonid_01_vision_9$: Novel Lives in the East"
 me_antigonid_1_vision.92.desc:0 "Our envoys and magistrates have done their best to drum up enthusiasm for additional Greek colonisation - using whatever means necessary - while our surveyors pored over our holdings looking for the most suitable sites for resettlement.\n\nTheir efforts have not been in vain; evidently, there is a not insignificant number of colonists ready to be establish at our chosen site - which awaits only the final word of our [me_antigonids_scope.GetRulerTitle], who plans to name the colony after [GetCharacter('(int32)37').GetPraenomen] Monophthalmos' father, [GetCharacter('(int32)27').GetPraenomen]."
 me_antigonid_1_vision.92.d:0 "Dispatch them to [ant_01_9_dest_4_scope.GetName] in [ant_01_9_dest_4_scope.GetArea.GetName]!"
 me_antigonid_1_vision.93.desc:0 "Our slipping influence has lost us the necessary base from which to draw colonists to our lands, or a suitable place to establish them..."
 me_antigonid_1_vision.94.desc:1 "[me_antigonids_scope.GetAdjective] representatives have been spinning tales of a novel life in every Greek agora, encouraging our people to venture novel lives in the east. Some call them traitors, others desperate cases, but either way our population has suffered."
 me_antigonid_1_vision.94.a:0 "Good fortune to them..."
 me_antigonid_1_vision.95.desc:0 "Our attempts to attract Greek colonists have found enthusiasm in the agora of [me_ant_01_9_sub_scope.GetCapital.GetName] and beyond, where citizens and subjects of our clients in [me_ant_01_9_sub_scope.GetName] yearn for opportunities of a novel life in the east. However, their government may resent our coaxing, which has not invariably been genial..."
 me_antigonid_1_vision.96.desc:0 "Some Greek denizens in the vicinity of our holdings at [me_ant_01_9_ter_scope.GetName] in [me_ant_01_9_ter_scope.GetArea.GetName] have reported interest, voluntarily or not, in joining a novel eastern Antigonid colony!"
 me_antigonid_1_vision.111.desc:0 "We have at last placed the loathsome Rhodians, who attempted to stay out of the Diadochi conflicts while reaping the benefits of our protection, in their place. [GetCharacter('(int32)38').GetPraenomen]' humiliation has now been satisfied by the fruits of Nike, and the power of the Antigonids placed beyond doubt."
 me_antigonid_1_vision.111.desc_1:0 "\n\nThe pompous Rhodians even erected a vast statue of their patron god, Helios, to commemorate their victorious defence - using the proceeds from selling our abandoned siege engines no less! Though, it is true, no honest man could deny the beauty and quality of Chares' exquisite craftsmanship..."
 me_antigonid_1_vision.111.b:0 "The Rhodians now comprehend their place."
 me_antigonid_1_vision.114.desc:0 "The magnificent city of [GetProvince('(int32)266').GetName], which weathered the siege of [GetCharacter('(int32)38').GetPraenomen] the Besieger, has at last fallen to the Antigonids despite their treaties. In their spite, [me_antigonids_scope.GetRuler.GetPraenomen] has disassembled the wondrous Kolossos of [helios_scope.GetName], erected by the Rhodians to commemorate their victory; a tragic loss for Rhodes and all who appreciate beauty..."
 me_antigonid_1_vision.115.desc_1:0 "The damnable Antigonids, buoyed by their victory and still smarting from the wounds we once inflicted on their pride, have cast down our glorious monument to Helios! The gods will surely never pardon these outrages!"
 me_antigonid_1_vision.115.desc_2:0 "We have finally fallen to Antigonids arms, turning all our hard labour in the heroic defence versus [GetCharacter('(int32)38').GetPraenomen] the Besieger to naught..."
 me_antigonid_1_vision.121.desc:0 "We have at last cast the other Diadochi out of [GetProvince('(int32)418').GetArea.GetRegion.GetName], realising the promises of [GetCharacter('(int32)37').GetPraenomen]' proclamation at [GetProvince('(int32)743').GetName] and our long held ambition for Greek dominion. By carefully treading the line between benefactor and overlord, we may be able to ensure their continued loyalty as part of our realm."
 me_antigonid_1_vision.121.a:0 "A mighty trophy."
 me_antigonid_1_vision.131.desc:0 "With our position as the protector of the Greeks now placed beyond doubt, it is high time we resurrected the ancient administrative organs of [GetCharacter('(int32)35').GetPraenomen] II and thereby safeguard the loyalty and cooperation of the unruly Greek cities.\n\nOnce more, each city's representative will rendezvous at a synedrion in the lofty city of [GetProvince('(int32)418').GetName], with foreign policy being presided over by Macedonians. A common army and network of treaties will bring the fractious townships of Hellas into the novel age of grand states and unity, while preserving their individual autonomy, traditions, and identities."
 me_antigonid_1_vision.131.a:0 "There is no time to forfeit!"
 me_antigonid_1_vision.132.desc:0 "Many Greeks once more find themselves under the benevolent protection of [ROOT.GetCountry.GetName] and the League of [GetProvince('(int32)418').GetName], passing their cities' foreign affairs into the hands of a single body tasked with defending Greece. Let us hope this iteration will be more extended lived than those of the past..."
 me_antigonid_1_vision.132.a:0 "May they have extended lives and much prosperity."
 me_antigonid_1_vision.133.desc:0 "Our declining influence in [GetProvince('(int32)418').GetArea.GetRegion.GetName] has scuppered our attempts to organise a novel League and unite the Greek cities. Perhaps they shall one day unite themselves, and put their advantages to some use."
 me_antigonid_1_vision.133.a:0 "The Greeks must observe to themselves now."
 me_antigonid_1_vision.134_desc_body:0 "envoys have arrived in [ROOT.GetCountry.GetCapital.GetName], they pursue to commence the reorganisation of the League of [GetProvince('(int32)418').GetName], originally established by [GetCharacter('(int32)35').GetPraenomen] II of [GetCountry('MAC').GetName]. Publicly they state their aims are to unite the Greek cities in common defence and cause, though the Macedonian domination of the League suggests otherwise."
 me_antigonid_1_vision.135.desc:0 "Our envoys have been turned away from our Greek subject [ant_01_14_scope.GetName], whose officials have decried our diplomatic efforts as minor more than veiled conquest!"
 me_antigonid_1_vision.136.desc:0 "With the formal organisation of the League of [GetProvince('(int32)418').GetName] complete, the Macedonians have placed the government into the hands of their selected representatives, mainly from our city of [ROOT.GetCountry.GetCapital.GetName]. These are strange times, but perhaps a unified Greece is the change we have required, even if it is delivered by a Macedonian sarissa..."
 me_antigonid_1_vision.141.desc_2:0 "We have at last wrested the coasts of Thrace, and the numerous cities that pock them, from the so-called Lysimachid  kingdom, at the same time quashing Antipatrid ambitions to the Hellespont and Asia."
 me_antigonid_1_vision.141.desc_3:0 "Venturing once more into the east, we have succeeded in reclaiming the expanses of Mesopotamia from the Seleukids so-called kingdom, a necessary buffer zone for the defence of [GetProvince('(int32)790').GetArea.GetRegion.GetName]."
 me_antigonid_1_vision.141.desc:0 "\n\nOur victories will no doubt continue, rolling throughout [GetCharacter('(int32)39').GetPraenomen]'s great empire's core until it is united once more under a legitimate Macedonian monarch."
 me_antigonid_1_vision.151.desc:0 "The armed conflicts over [GetCharacter('(int32)39').GetPraenomen]'s realm continue with no conclusion in sight. With the chapter of the original Diadochi closing, perhaps it is time to accept the status quo and leave any future disagreements to the sons and daughters who will pursue...\n\nA concerted diplomatic effort with another successor may tip the scales and provide a respite for our neonatal kingdom."
 me_antigonid_1_vision.151.e:0 "No, we require no allies!"
 me_antigonid_1_vision.152.desc:0 "An offer of alliance is all well and good, but a lasting connection based on mutual confidence can only be assured by the shared interest of marriage.\n\nThe most obvious match for a royal marriage between our two nations would be for the [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetEmployer.GetAdjective] prince [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetPraenomen] to take the hand of the [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetEmployer.GetAdjective] princess [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetPraenomen], thereby forging a dynastic bond."
 me_antigonid_1_vision.152.a:0 "Dispatch the proposal."
 me_antigonid_1_vision.152.b:0 "We only desire an alliance."
 me_antigonid_1_vision.152.c:0 "On second thought, call the entire thing off!"
 me_antigonid_1_vision.153.desc:0 "Our historic enemies in the struggle for [GetCharacter('(int32)39').GetName]'s empire, the Antigonids, have offered to bury the hatchet for our mutual benefit by securing an alliance. While this would provide us some respite to focus on securing our interests elsewhere, it may benefit the Antigonids more than us."
 me_antigonid_1_vision.154.desc_3:0 "have accepted a pragmatic alliance for the time being, but halted short of accepting our proposal of a royal marriage."
 me_antigonid_1_vision.154.desc_4:0 "have declined our offer out of hand, calling us cowards who must be ripe for conquest to come begging for handouts from a rival."
 me_antigonid_1_vision.154.b:0 "We are unable to complain!"
 me_antigonid_1_vision.158.desc:0 "The treacherous Antigonids have arranged for an alliance with the [ant_01_15_target.GetAdjective] kingdom! This will surely upset the balance of alliances in Antigonid favour..."
 me_antigonid_2_aspiration.2.desc:0 "We have ensured the persistence of the glorious dynasty of Antigonos despite numerous trials; not even the combined power of the successor kingdoms could match the tenacity of the gods favoured sons.\n\nWith the homeland of Macedon secure, our ancient eastern holdings may perhaps one day be reclaimed from the illegitimate eastern kingdoms..."
 me_antigonid_2_aspiration.11.desc:0 "Demetrios and other Antigonid generals' campaigns in Greece were welcomed over the chaos and cruelty of Polyperchon and Kassandros, but with the loss of the east our desperation to secure control has been made plain.\n\nThe Greeks must accept our authority as their 'liberators' and rightful Macedonian sovereigns, or pay the price."
 me_antigonid_2_aspiration.11.a:0 "These Greeks never surrender..."
 me_antigonid_2_aspiration.12.desc:0 "After Alexander's demise, Antipater kept the Greeks in check at Lamia, but since his own demise the peninsula has become ever more chaotic. Now Antigonos' passing may mark a novel era of strife for the region, and we must ensure that we do not permit a resurgent Greek state or another Diadochi to force us out.\n\nGreece must comprehend that Macedonian, Antigonid, leadership is non-negotiable."
 me_antigonid_2_aspiration.31.a:0 "The fates blow hot and frigid."
 me_antigonid_2_aspiration.41.desc_1:0 "Though our kingdom may be splintered, defeated by the alliance of the other Diadochi, the prestige of our dynasty in the wake of Antigonos' victories and years of rule is beyond reproach especially among our eastern subjects.\n\nIn our humbled position, the other Diadochi may be willing to agree friendship by a pact of blood, a now prevalent occurrence among the other successors."
 me_antigonid_2_aspiration.41.a:0 "We pursue with restitution with the [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('ant_2_marriage_country_1').GetCountry.GetName]."
 me_antigonid_2_aspiration.42.desc:0 "The dynasty of Antigonos, though fallen from grace, has made a lasting fame through years of rule in Asia. The so-called [me_antigonids_scope.GetRulerTitle] of their remaining territories, [me_antigonids_scope.GetRuler.GetName], now approaches us with an offer of royal marriage.\n\nSuch a gesture may be beneficial for both sides, burying past rivalries with a novel foundation of blood."
 me_antigonid_2_aspiration.43.desc:0 "Our envoys are pleased to report that the [ant_2_marriage_country_scope.GetAdjective]s have accepted our offer, agreeing to the marriage of [ant_2_marriage_groom_scope.GetName] and [ant_2_marriage_bride_scope.GetName], and with it the joining of our houses!\n\nRich banquets and festivals will accompany the occasion of their union in [ant_2_marriage_groom_scope.GetEmployer.GetCapital.GetName] - let us hope this is the consecrated start of a lasting friendship, whatever our differences may have been in the past."
 me_antigonid_2_aspiration.51.desc:0 "Our soldiers have secured the fortress atop the lofty apex of Akrokorinthos, and with it the most important strategic garrison in Hellas.\n\nWith our losses in the east, control over Greece has become even more important; this fortress should ensure our grip."
 me_antigonid_2_aspiration.61.desc:0 "The cape of Tainaron south of Sparta has become a den of mercenaries, attracting wayward sorts from across the Hellenic world seeking the raucous and dangerous life of a paid soldier.\n\nThere are numerous experienced mercenaries who have served in the armed conflicts of Alexander, or the Diadochi, or petty city-state disputes from Syrakousai to Nikonion, and for a minor gold they may aid our cause."
 me_antigonid_2_aspiration.61.a:0 "We require every advantage in the conflicts to come."
 me_antigonid_2_aspiration.62.desc:0 "We have completed our tours of the camps at Tainaron, but it remains to be decided how best to put the talents of its denizens to use.\n\nSome bribes may provide us greater access to their company's services, but bringing their commanders into our ranks will reduce our reliance on hirelings."
 me_antigonid_2_aspiration.63.desc:0 "Our officers have been scouring the campgrounds and agora of Tainaron pursuing experienced commanders to aid our cause versus the other Diadochi kingdoms.\n\nAmong the knaves and chancers that litter the place, they have found two experienced mercenary commanders who would be willing to serve our [SCOPE.GetRootScope.GetCountry.GetRulerTitle] - for a price."
 me_antigonid_2_aspiration.63.b:0 "Retrieve a horse for [antigonid_general_2.GetPraenomen], he rides for the capital."
 me_antigonid_2_aspiration.63.c:0 "Dispatch them back to their hammocks..."
 me_antigonid_2_aspiration.71.t:0 "$antigonid_02_aspiration_7$: Protector of Urban Centres"
 me_antigonid_2_aspiration.71.desc:0 "Our broad reach and influence over Greece and its many cities has given us considerable experience in the management of diverse interest groups and legal disputes, not to mention the indisputable position as the true leader of the Greek world.\n\nThough the dream of the League of Korinthos may be dead, the management of semi-autonomous Greek states in our service is still an intriguing proposition."
 me_antigonid_2_aspiration.81.t:0 "$antigonid_02_aspiration_8$: Making Increments"
 me_antigonid_2_aspiration.81.desc:0 "With the heart of Lysimachos' ancient satrapy now under our control, along with the trading posts of the Hellespont, our losses in the east are somewhat easier to bear."
 me_antigonid_2_aspiration.91.desc:0 "Our dynasty has succeeded in reclaiming the great capital of the Macedonians and the ancestral tombs of its leaders and combatants from the cursed dynasty of Antipater. The position of the Antigonid dynasty as the rightful kings of Macedon, no longer mere provincial successors of a deceased empire, is now secure."
 me_antigonid_2_aspiration.91.b:0 "This is, and invariably will be, Antigonos' kingdom."
 me_antigonid_2_aspiration.91.c:0 "We rule Macedon, but it is not the Macedon of ancient."
 me_antigonid_2_aspiration.91.d:0 "This is a novel chapter in the history of the Macedonians."
 me_antigonid_2_aspiration.101.desc:0 "Much is said of the strategic Greek cities of Chalkis and Korinthos, and their importance to Macedonian interests, but Thessaly lies on the approach to Greece from Pella, and securing it is invaluable in protecting our interests in both quarters.\n\nIt has been suggested a novel city and stronghold be founded on the Pagasaian Gulf, named after Antigonos' son Demetrios, to defend Thessaly and Greece."
 me_antigonid_2_aspiration.101.a:0 "Ancient Pherai will make way for Demetrias."
 me_antigonid_2_aspiration.102.desc:0 "Our workmen have completed the structures of the novel city of Demetrias near the ancient port town of Pagasai and the historic Thessalian city of Pherai, whose populations have been moved to novel lodgings at the site.\n\nThis novel strategic garrison will surely prosper, lying between Macedon and Greece by land as well as sea..."
 me_antigonid_2_aspiration.102.a:0 "A city meritorious of our kingdom."
 me_antigonid_2_aspiration.103.desc:0 "With [GetProvince('(int32)391').GetName] no longer in our hands, our plans to found the novel city of Demetrias can no longer be pursued..."
 me_antigonid_2_aspiration.111.a:0 "Extended may they reign."
 me_antigonid_2_aspiration.121.desc:1 "The strategic cities of [GetProvince('(int32)407').GetName] and [GetProvince('(int32)418').GetName] have long been garrisoned by Macedonian troops to secure control over central [GetProvince('(int32)418').GetArea.GetRegion.GetName], but beyond the latter the Peloponnesos is entirely deficient insurance versus insurrection.\n\nIf the Spartans are to be kept in check, and ideas kept from the Achaian's heads, a fourth fetter is required, and Mount Ithome, an apex above the city of [GetProvince('(int32)431').GetName] renowned for its temple to Zeus Ithomatas, has clear advantages by virtue of its terrain and position."
 me_antigonid_2_aspiration.131.desc:0 "Every effort is being made to ensure the persistence of the Antigonid dynasty, and our naval dominance over Egypt and the other diadochi is among the most important guarantors of success. Without a robust fleet, we are unable to hope to project power to the east or defend our Greek holdings from Egypt."
 me_antigonid_2_aspiration.132.desc:0 "The learnings of the campaigns of Demetrios at Salamis and Rhodes are still fresh, and many believe grand vessels that can shatter fortifications using new developments in siege artillery are the future.\n\nThere are however those who favour traditional fleet roles, relying on boarding and velocity to dominate the waves while land armies deal with fortifications."
 me_antigonid_2_aspiration.133.desc:0 "Our cause has numerous sympathetic ears among the mariners and pirates of the Mediterranean, the naval efforts of Antigonos having funded many of their careers - legitimate or otherwise.\n\nTwo promising Macedonian commanders have been located who would be willing to serve in our fleets."
 me_antigonid_2_aspiration.134.desc:0 "With no ports left in our hands, our dreams of naval dominance have come to naught. If the Antigonids are to field a robust fleet once more, it will not be any time soon..."
 me_antigonid_2_aspiration.141.desc:0 "The legitimacy of our kingdom comes in large part from the actions of Antigonos the One-Eyed, whose coronation marked the ascend of the dynasty to Macedonian royalty beyond mere conquest and posturing.\n\nWith the crown now having passed to the second-generation of his descendants, we have proved the worthiness of the family as stable rulers of Macedon."
 me_antigonid_2_aspiration.141.b:0 "...and that is sufficient."
 me_antigonid_3_birthright.1.desc:0 "It has been an arduous journey, but the despite the numerous failings of our house and the retreat to the west, we have shown the world that the Antigonid's nobility derives from their natural ability rather than the length their lists of subjects and holdings.\n\nThere is a dream to return to the east, to the magnificent cities and colonies founded by [GetCharacter('(int32)39').GetPraenomen], and thus to eliminate the stain of defeat and acquire the laurels of unparalleled glory."
 me_antigonid_3_birthright.2.desc:0 "The Antigonids have perhaps outdone the Argeads in their tenacity and daring, adding  Macedon, Asia, Phrygia, and Syria to their holdings versus all odds.\n\nWhen the histories are composed of these days, it shall be the Antigonids who are remembered as the greatest of Alexander's successors, and the most deserving heirs of his crown."
 me_antigonid_3_birthright.11.t:0 "$antigonid_03_birthright_1$: Mediterranean Trophy"
 me_antigonid_3_birthright.11.desc:0 "The magnificent island of Kypros is vital to any efforts to control the coasts of Phoenicia and will be a useful springboard in the reconquest of the Syrian heartland. The island must be made into a bristling stronghold, impervious to the ambitions of any would-be invaders.\n\nThis is also an opportunity to expand other facilities that may be useful to our cause, a matter of much interest to [me_antigonids_scope.GetRulerTitle] [me_antigonids_scope.GetRuler.GetPraenomen]."
 me_antigonid_3_birthright.21.a:0 "Access up the treasuries."
 me_antigonid_3_birthright.31.desc:0 "We have secured the majority of the major ports of the Aegean, and with them under our control we may now vouchsafe the passage to Asia by sea, excluding the other Diadochi from the lucrative revenues of tariffs and important havens for any invasion forces."
 me_antigonid_3_birthright.41.desc:0 "Like [GetCharacter('(int32)39').GetPraenomen] himself we have conducted a drive eastward from Macedon, traversing the [GetProvince('(int32)2623').GetName] and establishing ourselves one more on the coasts of [GetProvince('(int32)290').GetArea.GetRegion.GetName].\n\nSoon we shall have reclaimed the lost satrapy and kingdom of [GetCharacter('(int32)37').GetPraenomen], proving the supremacy of the our dynasty among the successors."
 me_antigonid_3_birthright.41.a:0 "Nothing can halt us."
 me_antigonid_3_birthright.51.at:0 "$me_ant_task_start_tt_1$ vying to maintain naval dominance.\n@[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] must maintain at least three quarters (Currently [SCOPE.ScriptValue('antigonid_4_5_bypass_value')|Y0]) as many vessels as the largest other Diadochi $ant_other_diadochi_tooltip$ navy for #Y 2#! years."
 me_antigonid_3_birthright.52.desc:0 "The size of our fleet has not escaped the notice of the other diadochi, and has become a talking point in the harbours and taverns of the internal sea, drawing mariners and shipwrights to our cities pursuing service.\n\nNo doubt we can discover a useful commander to aid in corralling our large navy, but perhaps our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName], would prefer to pursue the examples of the hands-on [GetCharacter('(int32)37').GetPraenomen] and [GetCharacter('(int32)38').GetPraenomen] when it comes to fleet command."
 me_antigonid_3_birthright.52.a:0 "Our kings comprehend the waves well."
 me_antigonid_3_birthright.52.b:0 "Novel commanders are invariably welcome."
 me_antigonid_3_birthright.61.desc:0 "We have at last reclaimed the entirety of [GetCharacter('(int32)37').GetPraenomen]' ancient satrapy of [GetProvince('(int32)1936').GetArea.GetRegion.GetName]; the enduring cities laid low by the hallowed conquerer [GetCharacter('(int32)37').GetPraenomen]; the time-honoured Persian roads leading from [GetProvince('(int32)290').GetArea.GetName] to [GetProvince('(int32)790').GetName], thence to storied [GetProvince('(int32)536').GetName] beyond the great rivers; the expanses of feral land filled with brutes and the temples to their strange gods.\n\n[GetCharacter('(int32)39').GetPraenomen] recognised that his vast empire could not be governed from its fringes back in [GetProvince('(int32)379').GetName], and while our own kingdom is a humble one compared to his boundless empire, returning our administrative functions to [GetCharacter('(int32)37').GetPraenomen]' original capital has been suggested."
 me_antigonid_3_birthright.61.b:0 "Let us take up [GetCharacter('(int32)37').GetPraenomen]' ancient lodgings."
 me_antigonid_3_birthright.71.desc:0 "Control of the crossing between Asia and Europe is vital to the success of an invasion of former, and - if it comes to it - the defence of the latter, a lesson Antigonos himself proved to be an avid student of when he founded the Antigoneias of Mysia and Bithynia.\n\nLet us ensure the forts at the crossings are sturdy bulwarks."
 me_antigonid_3_birthright.71.at:0 "$me_ant_task_start_tt_1$ fortifying our Bosporan defences."
 me_antigonid_3_birthright.72.desc:0 "Our workmen have completed shoring up the defences of key strategic points guarding the Asian approaches and crossings of the Bosporos."
 me_antigonid_3_birthright.73.desc:0 "The loss of the key cities approaching the Bosporan crossing has made our plans to enhance their defences moot..."
 me_antigonid_3_birthright.81.desc:0 "We have not forgotten that it was [GetCharacter('(int32)37').GetPraenomen] who founded the great city on the Orontes, whatever those who later seized it did or do. It has become the most important city in Syria, thanks to its strategic placement near the Syrian Gates, natural defences, and access to the sea, and there can be no doubt that our ancestor had great foresight.\n\nWith the place back under the Antigonid control, it has been suggested that we move our administration to the city. Perhaps in doing so, we will be completing [GetCharacter('(int32)37').GetPraenomen]' vision of a Macedonian kingdom centred at the crossroads of [GetCharacter('(int32)39').GetPraenomen]'s conquests."
 me_antigonid_3_birthright.91.desc:0 "As we stand in the Philistian desert, a stones-throw from the Nile and rich cities of Egypt, let us not forget the folly that befell [GetCharacter('(int32)37').GetPraenomen] and [GetCharacter('(int32)38').GetPraenomen] in their attempts to invade the place, like [GetCharacter('(int32)406').GetPraenomen] anterior to them.\n\nPerhaps Egypt will one day be ours, but let us be ready, and evade the pitfalls which dogged our ancestors."
 me_antigonid_3_birthright.91.a:0 "Shall we assert [GetCharacter('(int32)42').GetPraenomen]' trophy?"
 me_antigonid_3_birthright.101.desc_1:0 "Our [GetCountry('ION').GetAdjective] friends enjoyed considerable autonomy under our yoke, enjoying privileged access to [GetCharacter('(int32)37').GetPraenomen] at the mere cost of aiding in their own defence."
 me_antigonid_3_birthright.111.desc:0 "We have at last proven by sword and stylus, to all who sought to challenge our supremacy over the Macedonians, that the Antigonids are the rightful inheritors of [GetCharacter('(int32)39').GetPraenomen]'s empire, able to unite the east and west, regrouping after every setback, victorious in the conclusion and ever after.\n\nThis marks the dawn of a novel era for the world, ruled justly by a Macedonian kingdom centred where east and west meet, if we can but retain together the kingdom that [GetCharacter('(int32)37').GetPraenomen] lost all those years ago."
 me_antigonid_3_birthright.121.desc:0 "Nowhere else in the entire Mediterranean can such shipwrights and captains be discovered as in the Phoenician cities. Our naval dominance will be assured with by the influx of mariners and artisans to our service from these cities."
