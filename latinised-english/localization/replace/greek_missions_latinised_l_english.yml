l_english:
 greek_1_black_sea_DESCRIPTION:0 "The events of the past 100 years have proven the necessity for the disparate colonies of the Pontos Euxinos to band together, voluntarily or by force, if they are to survive the ascend of the successors, foreign emulators, and barbarians."
 greek_1_4_DESC:0 "While we may not possess direct access to the rich ports of the west, there is still much to obtain by assuring our control over eastern commerce is comprehensive in the Pontos Euxinos."
 greek_1_2_DESC:0 "The myths of Herakles and Jason demonstrate how far these territories have come from the obscure days of the past, we can bring them still further by creating a bastion of culture to rival any western hub."
 greek_1_2_allow_tt:1 "Owns a Black Sea port which:\n * Has #Y City#! status\n * Dominant culture is in the #Y $hellenic$#! group \n * Has at least #Y 40#! Civilization Value\n * Has a #Y Marketplace#!\n * Has no continuing construction\n * Has at least #Y 20#! Pops\n * Ratio of Slave @slaves! Pops is less than #Y 33%#!\n * Ratio of Tribesmen @tribesmen! Pops is less than #Y 33%#!"
 greek_1_3_DESC:0 "Zeus' lover Io, who begat the line of Herakles, here crossed into Asia in bovine form, and thus gave it the name Bosporos. This strait controls much of the commerce in the region, and securing it would be a magnificent boon."
 greek_1_5_DESC:0 "Our fellow Greeks are divided, vying for their petty commercial links and local exports. We must convince them to dream bigger, and aid the cause of all northern Greeks."
 greek_1_7_DESC:0 "We must pursue novel markets and expand our influence to a novel part of the sea if we are to ensure hegemony over our competitors."
 greek_1_13_DESC:0 "Almost the entire Hellenic presence in the Pontos Euxinos stems from hundreds of years of our merchants and colonists. We should reclaim what exists solely via our efforts."
 greek_1_13_reward_tt:0 "Citizens will establish in each of the recovered territories."
 greek_1_11_DESC:0 "If we are to make the most of our commerce in the Pontos Euxinos, we must ensure it is relatively safe for merchants and travellers to traverse its waters."
 greek_1_14_DESC:0 "Peaceful expansion of commercial opportunities is an ancient Greek tradition, and indeed it is not invariably necessary to resort to spear and shield to obtain access to a market."
 greek_1_14_allow_tt_2:1 "Any Black Sea port within control range is owned by a non-#Y $hellenic$#! country who we are at peace with and possesses over #R -50#! opinion of us."
 greek_1_15_DESC:0 "The only method to protect our trade routes and the interests of our citizens is to put a conclusion to the piratical vagabonds who prey on their efforts."
 greek_1_16_DESC:0 "Ridding ourselves of the pirates need not be a bloody chore, they are only after affluence after all, and might be willing to move on with the right incentive."
 greek_1_17_DESC:0 "Our merchants look at the pirates all incorrectly; they would be a fine resource of experienced sailors right on our doorstep, if they could only be harnessed."
 greek_1_19_allow_tt:2 "[gm_1_greek_scope.GetName] owns #Y [GetProvince('(int32)4557').GetName]#! which:\n * Has #Y City#! status\n * Dominant culture is in the #Y $hellenic$#! group \n * Has a #Y $temple_building$#!\n * Has no continuing construction\n * Has at least #Y 10#! Pops\n * Ratio of Slave @slaves! Pops is less than #Y 33%#!\n * Ratio of Tribesmen @tribesmen! Pops is less than #Y 33%#!"
 greek_2_greece_DESCRIPTION:0 "Since the days of the Persian invasion it has become increasingly clear that the strengths of Hellenic civilisation are wasted when division leaves us ripe for foreign invaders to despoil. If Greece is to flourish in these strange times her people must be united under the leadership of a strong figurehead."
 greek_2_1_DESC:0 "The time has come for true Greek leadership of the Hellenic world, uniting the disparate voices of Greece into a novel, powerful unified state - under our leadership."
 greek_2_2_DESC:0 "For an extended period the Hellenes have suffered under forced garrisons imposed by foreign overlords. It is time to reclaim our liberty, and the liberty of all Greece."
 greek_2_4_DESC:0 "The democrats of Hellas have weakened and led astray the Greek people for an extended period; it is time to extend reasonable government over the Hellenic world."
 greek_2_5_DESC:0 "The oligarchs, monarchs, and tyrants of Greece have undermined the liberty of our people for too long; it is time to bring our brothers into liberty and self-government."
 greek_2_6_DESC:0 "There are other Greek states which share our traditions and government, we should attempt to convince them that submitting to our leadership is the only method to ensure our continued liberty."
 greek_2_7_DESC:0 "There have been numerous prestigious and populous urban centres in Greece over the centuries, but if we are to construct a novel state for all Greeks our capital must be up to the task."
 greek_2_8_DESC:0 "To unite the Hellenic people we need to inspire them with the leadership of a heroic figurehead, a unifying symbol they can assemble around against diadochi, reactionaries, and invaders."
 greek_2_9_DESC:0 "While all the Hellenes of Greece have contributed to her magnificence, there are a few urban centres which lie at the heart of her success. These centres must be united under our rule if we are to represent the Hellenic legacy."
 greek_2_10_DESC:0 "The Athenian model for dominating Greece shunned open conflict and violence, focusing on winning over their allies via commerce and uniting against outside threats."
 greek_2_11_DESC:0 "The Spartan model for extending control of Greece shunned diplomacy or commerce, focusing on securing urban centres forcefully and installing friendly governments supported by garrisons."
 greek_2_12_DESC:0 "Only when all the Hellenes of Greece are united under a common government will she be able to properly defend herself from the rising menaces to the west and east."
 greek_2_13_DESC:0 "Only when the frontiers of Greece are secure and her lost possessions recovered can our minds be put to rest. No more will Greeks live in the shadow of Macedon, as the Thessalians long suffered."
 greek_2_14_DESC:0 "The Hellenes have suffered numerous invasions at the hands of the Macedonian savages, it is time we demonstrate to them how it feels to be at the point of our spears for a change."
 greek_2_15_DESC:0 "We will make it clear that, regardless of a soldier's origin city, the armies of [gm_2_greek_scope.GetName] will welcome any Hellenenic volunteers ready to fight versus the adversaries of Greece and protect her borders."
 greek_2_15_reward_tt:1 "All $hellenic$ tributaries with non-Oligarchic Republican government will forfeit revenue and Loyalty to [gm_2_greek_scope.GetName]."
 greek_2_16_DESC:0 "Athens profited greatly from its position as leader of the Delian League, in part by encouraging a standard system of weights and measures to lubricate commerce and increase their influence over their environs."
 greek_2_18_DESC:0 "The vigour of Hellas has invariably been her ready access to the sea, and via it the markets and coasts of the world. Like Athens, we will exploit the strengths of naval power to ensure the protection of Greeks everywhere."
 greek_3_italiote_DESCRIPTION:0 "The Italiote urban centres of Magna Graecia have been squabbling over regional dominance and allowed themselves to fall prey to Italic tribes in the process. In the coming days, our city must take the weight of Italiote leadership if Magna Graecia is to survive."
 greek_3_1_DESC:0 "If we are to throw off the shackles of foreign dominance and reinstate our city's pride we must rally the people to the cause of liberty and stir them to action."
 greek_3_2_DESC:0 "If we are to overcome our relegation to a minor city of little significance, we must take the initiative and obtain the resources of our neighbours. Rallying the city's population is the first step in achieving our ambitions."
 greek_3_4_DESC:0 "In the past the Italiote urban centres banded together in a league, defending each other from Italic invaders and brazen neighbours. We should revive this federation as a means of claiming Italiote leadership."
 greek_3_5_DESC:0 "The ascend of the Bruttian and Lucanian Italic tribes subjected Italiote urban centres to barbarian invasion, rapine pillage, and subjection. We must avenge these slights."
 greek_3_6_DESC:0 "Our city has a prolonged history, and has been drawn into numerous conflicts over the years. These disputes have been put to rest, until now."
 greek_3_7_DESC:0 "If we are to survive the onslaught of our Greek rivals and Italic neighbors we cannot be too proud to request help from those in a position to lend it."
 greek_3_8_DESC:0 "Constant conflict and a general exodus made us rely on Italic mercenaries for much of our defensive needs. They will prove useful in the days ahead."
 greek_3_9_DESC:0 "Our city has faced a decline in the last century, assailed by the development of our neighbours both Greek and foreign. If we are to become the dominant players in the region, we must first restore our capital."
 greek_3_10_DESC:0 "Magna Graecia once boasted the most exquisite urban centres of the Hellenic world, prior to the destruction of Sybaris and the Italic conflicts. We will make it so once more."
 greek_3_11_DESC:0 "The Hellenic urban centres in Magna Graecia have had to put up with Italic subjection for an extended period. The ancient days of Hellenic supremacy must return."
 greek_3_13_DESC:0 "Like all Italiote urban centres, our original settlers came from Greece. Making a demonstration of our historic ties may win us grateful favour with our mother city."
 greek_3_15_DESC:0 "The cycle of bloodshed and tyranny will never conclude; the Siceliotes must come under Italiote leadership."
 greek_3_17_DESC:0 "Only once the majority of the Italiote urban centres are united under common leadership will the legacy of the Greek colonies in the west be safeguarded and its future secured."
 greek_3_18_DESC:0 "There are magnificent opportunities on the frontiers of our territories, and we must take every step to ensure our survival."
 greek_3_19_DESC:0 "The Italiote urban centres were once counted among the leading Greek centres, combining the influences of diverse colonies and becoming rich commercial urban centres with a flourishing philosophical life."
 greek_3_19_reward_tt:0 "Pick a permanent country specialisation."
 greek_4_west_BUTTON_TOOLTIP:0 "The survival of the Phocaean colonies requires robust, energetic leadership."
 greek_4_west_DESCRIPTION:0 "Massalia, Emporion, and the other Phocaean colonies were founded by exiles fleeing from the Persians, who sacked Phocaea in Ionia. They constructed novel lives in the far flung territories of Gaul and Iberia, founding commercial outposts and competing with the Carthaginians. Times are hard, and the survival of the most westerly Greeks hangs in the balance."
 greek_4_2_DESC:0 "The Greek urban centres of the west remain minor enclaves, surrounded on one side by the ocean, and on the other the sea of barbarian tribes. If we are to survive, we must build a strong city capable of sustaining itself."
 greek_4_2_allow_tt:1 "Owns a port in southern Gaul or eastern Iberia which:\n * Has #Y City#! status\n * Dominant culture is in the #Y $hellenic$#! group \n * Dominant religion is #Y $roman_pantheon$#!\n * Has at least #Y 40#! Civilization Value\n * Has a #Y Marketplace#!\n * Has no continuing construction\n * Has at least #Y 20#! Pops\n * Ratio of Slave @slaves! Pops is less than #Y 33%#!\n * Ratio of Tribesmen @tribesmen! Pops is less than #Y 33%#!"
 greek_4_3_DESC:0 "The magnificent Pillars guarding the entrance to the internal sea have been in Punic hands for far too long, barring our merchants access to the commerce of the north and interfering with exploration."
 greek_4_4_DESC:0 "We must continue to expand, bringing more and more urban centres under our influence, if we are to compete with the vast Punic commercial empire and its rivals."
 greek_4_5_DESC:0 "With our recently acquired influence we may be able to convince one of our fellow colonies to unite with us, or at least accept our protection in exchange for tribute."
 greek_4_6_DESC:0 "Numerous Greek colonies in the west have fallen to the barbarians, be they Punic or local tribes. We should return what was lost to its rightful owners."
 greek_4_7_DESC:0 "Our grip on the surrounding area is slipping and already numerous Phocaean trade-posts have fallen or become defunct. We must assert our authority with novel fervour."
 greek_4_11_DESC:0 "Our revenue depends on our maintaining the flow of commerce to our ports, ever disrupted by pirates and the target of jealous rivals. A force must be established to defend the arteries of our treasury."
 greek_4_13_reward_tt_2:0 "#Y $balearides_area$#!, #Y $sardinia_meridionalis$#!, and #Y $sardinia_septentrionalis$#! will receive a bonus to assimilation velocity."
 greek_4_14_DESC:0 "The locals tribes have invariably been willing to permit the settlement of Greeks on the coast as long as they did not interfere in their business, only too willing to obtain access to the rich goods we import from elsewhere."
 greek_4_14_allow_tt_2:1 "Any port within control range in southern Gaul or eastern Iberia is owned by a tribal non-#Y $hellenic$#! country who we are at peace with and possesses over #R -50#! opinion of us."
 greek_4_15_DESC:0 "Carthaginian dominance over western trade routes can no longer be tolerated, we must drive them from their commercial outposts and establish our own commercial empire in their place."
 greek_4_17_DESC:0 "Our people were forced to flee from the Persians, abandoning our city to the flames. With our novel vigour, we could reclaim our homeland and mend the wounds of the past."
 greek_4_18_DESC:0 "We are a seafaring people and look principally to the acquisition of ports and expansion of our commercial interest. We should secure our landward security with an alliance to one of local native tribes."
 greek_4_19_DESC:0 "The legendary commercial outpost of Olisipo is the gateway to the distant trade routes of the north. By taking it for ourselves we will make much of both the prestige of its past and its valuable location."
 greek_4_19_allow_tt:3 "[gm_4_greek_scope.GetName] owns #Y [GetProvince('(int32)1319').GetName]#! which:\n * Has #Y City#! status\n * Dominant culture is in the #Y $hellenic$#! group \n * Has a #Y $temple_building$#!\n * Has no continuing construction\n * Has at least #Y 10#! Pops\n * Ratio of Slave @slaves! Pops is less than #Y 33%#!\n * Ratio of Tribesmen @tribesmen! Pops is less than #Y 33%#!"
