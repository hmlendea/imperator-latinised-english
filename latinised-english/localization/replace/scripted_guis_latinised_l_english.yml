l_english:
 not_capital_state_tt:1 "You is unable to change the Provincial Capital in your Capital Province."
 desc_state_improvement_military:1 "This Province has been fortified, increasing the number of fortresses and defensive installations we can construct here."
 desc_state_improvement_civic:0 "A series of aqueducts, courthouses, and other civic developments are inception to spring up in this province."
 desc_state_improvement_religious:1 "By promoting the use of religious sites as focal points for commerce, trade, and bureaucracy, we make better use of the space in our great urban centres."
 oaths_of_allegiance_button_desc_tt:0 "#TF The continuation of a dynasty brings strength and security to a realm. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], whilst a fearsome and honourable [SCOPE.GetRootScope.GetCountry.GetRulerTitle], is unable to rule forever - we must rouse support for the future of the [SCOPE.GetRootScope.GetCountry.GetRuler.GetFamilyDisplayAdjective] line!#!"
 desc_oaths_of_allegiance:0 "The great families of our realm have travelled far to swear allegiance to our royal house."
 patron_of_arts_button_title_tt:0 "#T Patronise the Arts#!"
 desc_assemble_raiding_party_button_modifier:0 "Our people have taken up our call-to-arms, lured by the promises of affluence and plunder."
 assemble_raiding_party_button_desc_tt:0 "#TF The lure of plunder and affluence is enough to steel the resolve of even the most faint-hearted.#!"
 decentralize_realm_button_desc_tt:0 "#TF Our people are becoming too sedentary for their own good. While we may lose some of our brethren in the short term, it is right that we should encourage all [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName] peoples to wander freely, that we might embrace the ancient ways some day.#!"
 city_output_reduced_tt:0 "Production of #Y [SCOPE.GetRootScope.GetProvince.GetName]#! will be #R reduced#! for #Y 2#! years, while urban development is coordinated.\n\nAfter #Y 2#! years:"
 found_city_button_title_tt:0 "#T Found City#!\nSettlements can be upgraded into urban centres, increasing their population capacity and enabling the construction of novel buildings."
 assemble_curiate_assembly_desc_tt:1 "#TF Summons some of our most prestigious patricians to legitimise the appointments of the [SCOPE.GetRootScope.GetCountry.Custom('get_court_type')]. This interaction can boost the capabilities of our appointed Governors, and can be only be used once every 10 years."
 not_summoned_curiate_assembly_recently_tt:0 "You is unable to summon the #Y Curiate Assembly#! again, until [SCOPE.GetRootScope.GetCountry.GetVariableExpiry('summoned_curiate_assembly')|Y]."
 curiate_assembly_para_1_1:0 "In the relative comfort of the city walls, the favoured citizens of [SCOPE.GetRootScope.GetCountry.GetName] gather to cast their votes of approval or disapproval upon our appointed magistrates."
 curiate_assembly_para_2_one_and_three:0 "\n\n[SCOPE.sChar('magistrate_1').GetName], [SCOPE.sChar('magistrate_1').Custom('get_council_1_descriptor')], and [SCOPE.sChar('magistrate_3').GetName], [SCOPE.sChar('magistrate_3').Custom('get_council_3_descriptor')] peer down anxiously at the gathering of patricians, each presumably hoping that their bribes and favours have worked to their advantage."
 random_magistrate_picked:0 "The assembly will select a Governor to endorse by themselves.\nSuccess chance will vary depending on which Governor is picked."
 assembly.2.c:0 "A sacred man as advisor."
 traits.2.b:0 "Summon the wisest minds in the territory!"
 ASSEMBLE_WAR_COUNCIL_BUTTON_TOOLTIP:0 "#T Summon Conflict Council#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]"
 PATRON_OF_ARTS_BUTTON_TOOLTIP:0 "#T Patronise the Arts#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]"
 ASSEMBLE_WAR_COUNCIL_REPUBLIC_BUTTON_TOOLTIP:0 "#T Summon Senatorial Conflict Council#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]"
 state_improvement_military_SPA:0 "Liberated Helots"
 desc_state_improvement_military_SPA:0 "The Helots remain a constant in our society. Those precious few who have proved their loyalty and devotion to the Spartan way of life can be granted the right to live - and perish - like a Spartan."
 time_to_complete_city_tt:0 "After a period of reduced production, a #Y City#! will be constructed."
 time_to_complete_metropolis_tt:0 "After a period of reduced production, a #Y Metropolis#! will be constructed."
 gains_new_trade_good_city_tt:0 "A novel #Y Trade Good#! will be produced here."
