l_english:
 dhe_rome.1.desc_1:0 "The recent work of plebeian jurist Gnaeus Flavius, his Legis Actiones or Actions in Law, is the first written account of the legal procedures of [ROOT.GetCountry.GetName]. The importance of this work propelled him to the office of Tribune of the Plebs and garnered him broad populist support.\n\nThe full extent and interpretation of our laws has, until now, been a verbal tradition of our judiciary, and Flavius' attempt to codify parts of our legal procedures for a wider audience has not been wholly appreciated.\n\nSome patricians argue a public airing of our sacred laws, by a plebeian no less, threatens their traditional prerogative over government positions and the laws of [ROOT.GetCountry.GetName], while the populists welcome greater rights and participation for the plebs."
 dhe_rome.1.desc_2:0 "The recent work of deceased plebeian jurist Gnaeus Flavius, his Legis Actiones or Actions in Law, is the first written account of the legal procedures of [ROOT.GetCountry.GetName]. The importance of this work propelled him to the office of Tribune of the Plebs and garnered him broad populist support, a legacy which is now being celebrated by politicians like [SCOPE.sChar('dhe_rome_gnaeus_flavius_scope').GetName].\n\nThe full extent and interpretation of our laws has, until now, been a verbal tradition of our judiciary, and Flavius' attempt to codify parts of our legal procedures for a wider audience has not been wholly appreciated.\n\nSome patricians argue a public airing of our sacred laws, by a plebeian no less, threatens their traditional prerogative over government positions and the laws of [ROOT.GetCountry.GetName], while the populists welcome greater rights and participation for the plebs."
 dhe_rome.1.b:0 "We are unable to undo the damage, but we can control it."
 dhe_rome.2.desc:0 "In spite of the rights granted to plebeians since the last Secession in 411, tension between the patrician and plebeian classes of [ROOT.GetCountry.GetName] has been growing lately, partly influenced by the work of Gnaeus Flavius, among others. None of our concessions have dampened the plebeians determination to secure political and legal equality.\n\nHowever, a novel political class made up of both patricians and plebeians has been growing, incorporating the middle income families of the republic. We must decide whether to promote the expansion of this novel Nobilitas as a middle ground, or give in to the populist's demands for reform."
 dhe_rome.2.a:0 "Perhaps encouraging this novel 'middle-class' could be the solution."
 dhe_rome.3.desc_1:0 "The political debate of the patricians and plebeians has once again escalated into a full blown Secession. It seems promoting the new middle-class, while satisfying some of the wealthy plebeians and encouraging social mobility, only ostracized the rest of the population further.\n\nThe city has ground to a halt with myriad freemen leaving the city to occupy the hill of Janiculum across the Tiber. Their leaders are demanding legal and political equality to end the strike."
 dhe_rome.3.desc_2:0 "The political debate of the patricians and plebeians has once again escalated into a full blown Secession. Although prior governments passed the requested reforms, the plebeians claim that the revocation of the Lex Hortensia is a betrayal of the promises of the Senate and require that the laws be reinstated immediately.\n\nThe city has ground to a halt with myriad freemen leaving the city to occupy the hill of Janiculum across the Tiber. Their leaders are demanding legal and political equality to end the strike."
 dhe_rome.3.c:0 "They are external to the pomerium. Let us teach them a lesson."
 dhe_rome.4.desc:0 "Since Romulus founded our magnificent city, its citizens have been divided into the tribes. Originally it was an ethnic distinction but since the Republic was formed the tribes have been divisions of eligible citizens whose local consensus is submitted as a vote in the Tribal Assembly in [ROOT.GetCountry.GetName].\n\nThe number of tribes has fluctuated throughout our history, beginning with merely three, there are now over thirty, added or redrawn as our state has grown. Novel tribes are formed as our citizen population rises to more effectively represent the opinions of the entire Republic.\n\nThere have lately been calls to create two more tribes, to be named Aniensis and Terentina, to ensure votes are fairly distributed."
 dhe_rome.4.b:1 "We have sufficient tribes."
 dhe_rome.5.desc:0 "Today's tribes are much changed from the strict geographic constituencies of the past, now consisting of a vertical slice of citizens from any one of the provinces. Although there are only four tribes within the city of [ROOT.GetCountry.GetCapital.GetName] itself, the rural tribes are a valuable source of political legitimacy and play an important role in organising the bureaucracy of the state, from electing local magistrates to passing motions by the Tribunes of the Plebs.\n\n[ROOT.GetCountry.GetName] has grown far beyond the borders of Latium, and with the large increase in population there are again calls to instantiate more tribes for the Republic. In response, the Senate is debating the commission of two additional tribes, to be named Quirina and Velina respectively."
 dhe_rome.5.b:1 "We have sufficient tribes..."
 dhe_rome.6.desc:0 "Our legal system has grown substantially as it tries to keep pace with the requirements of an expanding population and the evolving social structure of the state. As a result, specialist jurists, frequently plebeians, have become a social caste unto themselves who supplement the work of judges and magistrates.\n\nThe Legis Actiones has been supplemented by the Laws of the Twelve Tables, providing far greater transparency for plebeians, and a more simple and open interpretation of the law is emerging with the introduction of legal precedents, or case law, in determining sentences."
 dhe_rome.7.desc:0 "The expansion of the state has lead to large parcels of private farmland becoming concentrated in enormous provincial estates known as Latifundia. These estates have a reputation for the extensive use of slaves as well as directing their production towards profit oriented export products rather than grain for the population.\n\nWhile these estates make us a considerable deal of money, the owners of smaller farms and some populist politicians who are beginning to feel marginalised by these enterprises have lobbied for the curtailment of the latifundia system."
 dhe_rome.8.desc:0 "As [ROOT.GetCountry.GetName] has grown, our once vitally important permanent allies in Italy, known as the Socii, have become increasingly less important. Their diminishing significance has not been lost on them, with the privileges and attention the Socii formerly received falling into decline.\n\nThey are particularly irritated by the what they see as the encroachment of our citizens into their lands, who they assert are settling unlawfully. Thus they accuse us of favouring newly conquered peoples and citizens while disenfranchising our old and loyal allies who are not classed as citizens of [ROOT.GetCountry.GetName]."
 dhe_rome.8.b:0 "We must not forfeit their support."
 dhe_rome.9.desc:0 "We have been attacked by the powerful commercial empire of [SCOPE.sC('dhe_rome_carthage_scope').GetName]! Numerous predicted this would befall us eventually, but without assistance we have a minor chance of defeating the invaders.\n\nThe predominant mood is that our only hope is send an envoy in supplication to [SCOPE.sC('dhe_rome_rome_scope').GetName], a natural rival of [SCOPE.sC('dhe_rome_carthage_scope').GetName], begging them to intervene on our behalf."
 dhe_rome.9.a:0 "We must dispatch for assistance."
 dhe_rome.10.t:0 "[SCOPE.sC('dhe_rome_aid_caller').GetName] Calls for Aid Versus [SCOPE.sC('dhe_rome_carthage_scope').GetName]"
 dhe_rome.10.desc:1 "We have received an urgent envoy from the minor state of [SCOPE.sC('dhe_rome_aid_caller').GetName]. [SCOPE.sC('dhe_rome_aid_caller').GetRuler.GetTitle] [SCOPE.sC('dhe_rome_aid_caller').GetRuler.GetName] is requesting our immediate assistance against [SCOPE.sC('dhe_rome_carthage_scope').GetName], who [SCOPE.sC('dhe_rome_aid_caller').GetRuler.GetSheHe] claims have treacherously invaded [SCOPE.sC('dhe_rome_aid_caller').GetRuler.GetHerHis] country.\n\nTheir envoy has spent numerous hours in supplication before the Senate, and passionately argued that if we let the cities of [SCOPE.sC('dhe_rome_aid_caller').GetName] fall, it will only be a matter of time before [SCOPE.sC('dhe_rome_carthage_scope').GetName] tries to invade and destroy [SCOPE.sC('dhe_rome_rome_scope').GetName].\n\nGiven our conflicting interests with [SCOPE.sC('dhe_rome_carthage_scope').GetName] in the Mediterranean, and their continued policy of expansion, this could be an opportunity to escalate the situation in our favour. How should we respond?"
 dhe_rome.10.b:0 "We are not ready for armed conflict. Yet."
 dhe_rome.10.bt:0 "We will obtain claims on Carthage."
 dhe_rome.11.desc_1:0 "Our envoy has returned from [SCOPE.sC('dhe_rome_rome_scope').GetName] with the news that they have agreed to assist us and have declared war on [SCOPE.sC('dhe_rome_carthage_scope').GetName]! We may yet be able to maintain our independence with Roman blood.\n\nLet us hope they do not dally..."
 dhe_rome.11.desc_2:0 "Our envoy has returned from [SCOPE.sC('dhe_rome_rome_scope').GetName] with the news that they while they would like to assist us, they are unable to come to our aid at this time. The cowards said they were not ready for an armed conflict with [SCOPE.sC('dhe_rome_carthage_scope').GetName].\n\nLet us hope the gods are kind to us."
 dhe_rome.11.desc_3:0 "Our envoy has returned from [SCOPE.sC('dhe_rome_rome_scope').GetName] with the news that they refused to assist us! The cowards showed no interest in our plight.\n\nMay the gods treat them as kindly as they have treated us."
 dhe_rome.11.b:0 "We should never have placed our faith in [SCOPE.sC('dhe_rome_rome_scope').GetAdjective] cowards..."
 dhe_rome.11.c:0 "We should never have placed our faith in [SCOPE.sC('dhe_rome_rome_scope').GetName]..."
 dhe_rome.12.desc_1:0 "The fractious years of the Conflict of the Orders have finally been placed behind us; the promised legal reforms of populist politicians successfully eased the main grievances of the plebeians, despite attempts by other parties to undo their work. By maintaining their legal rights we have satisfied the main grievances of the plebeians, removing their political incentive to revolt. While some patricians may doubt the course we chose, there is no doubt that the populists ensured stability."
 dhe_rome.12.desc_2:0 "The fractious years of the Conflict of the Orders have finally been placed behind us; the promised legal reforms of populist politicians successfully eased the main grievances of the plebeians, removing their political incentive to revolt. While some patricians may doubt the course we chose, there is no doubt that the populists ensured stability."
 dhe_rome.12.desc_3:0 "The fractious years of the Conflict of the Orders have ended in disaster; the promised legal reforms of populist politicians were constantly rescinded, undermining their efforts to ease the main grievances of the plebeians. The failure to maintain their legal rights and political equality has reinvigorated the plebeians political incentive to revolt.\n\nThey have once again marched in Secession to the hill of Janiculum, this time bearing arms and organised by disgruntled defecting soldiers. They require that the senate be dissolved and replaced with the plebeian assemblies of the city."
 dhe_rome.12.desc_4:0 "The fractious years of the Conflict of the Orders have finally been placed behind us; the encouragement of an aspirational plebeian sub-class combined with greater political participation and equality before the law has satisfied the main grievances of the plebeians, removing their political incentive to revolt."
 dhe_rome.15.desc:0 "After suffering a crushing defeat at the hands of the numerous, and fiercely competent Carthaginian navy, our fleet has slunk back to port with many hands lost.\n\nAll however, is not as devastating as it may appear. Amongst the surviving Roman vessels, a lone Carthaginian quadrireme sits; captured after it strayed too close to the retreating navy. Upon inspection by our shipwrights, a startling discovery was made - the Carthaginians, in a feat of engineering ingenuity, have numbered each plank, rib, and oar that make up the vessel, rendering construction of such majestic warships a matter of almost arbitrary competence.\n\nAdopting such a practice could hugely increase our potential for fielding a vast navy, perhaps even rivalling that of the Phoenicians themselves?"
 dhe_rome.16.desc:0 "The Greek poleis spawned an exodus of art, philosophy, and culture, which shaped the development of Rome since the early days of our existence.\n\nNow, with our hegemony stretching into the very heartlands of their past oppressors, the disparate city states of Greece cry out for an end to tyranny. It is our right - nay; our duty, to liberate the downtrodden people of the Greek peninsula, bringing them under the just rule of Roman law."
 dhe_rome.17.desc:0 "For numerous long years, those in control of the Epirote lands have interfered in the region they call Magna Graecia. Now, with our territory beginning to overlap with their sphere of influence, it has become all too apparent that there is only one solution.\n\nIf we are ever to be free of their meddling, we must take to the sea, and claim their land in order to protect the just citizens of so called 'Magna Graecia', who desire only to lead a peaceful existence under our rule."
 dhe_rome.18.t:0 "Macedonian Menace"
 dhe_rome.18.desc:0 "Our landfall in Greece has raised the eyebrows of many of the kingdoms and successors splintered from the ruination of Alexander's magnificent empire.\n\nThe region of Macedonia, populated by the proud ancestors of Philippos and Alexander, poses a significant menace to Rome, and to the liberty of the numerous cities in our shared spheres of influence.\n\nThe gods themselves augur well for our continued involvement in Macedonia - we must put an end to any interference in our expansion."
 dhe_rome.19.desc:0 "The catastrophic battle of [SCOPE.sP('battle_location').GetName] shall forever go down in the annals of history. In a stunning display of cowardice, [SCOPE.sUnit('legion').GetName] broke on the very field of battle, abandoning their posts, comrades, and ultimately; honour.\n\nTo add to this dark day for the [ROOT.GetCountry.GetAdjective] people, the standard of [SCOPE.sUnit('legion').GetName] was seen being triumphantly borne away by the [SCOPE.sC('antagonist').GetAdjective] barbarians. Even now, one of our proud eagles languishes in their capital of [SCOPE.sC('antagonist').GetCapital.GetName]."
 dhe_rome.19.b:0 "Locate the one responsible for this outrage..."
 eagle_capture_banner_tooltip:0 "An Eagle has been captured! You must conquer the city of #Y [Scope.Province.GetName]#! in order to reclaim the eagle, and the honour of our people!"
 dhe_rome.23.desc:0 "The divisive civil war in [ROOT.GetCountry.GetName] has caused a vast rift in all aspects of [ROOT.GetCountry.GetAdjective] society. The magnitude of the betrayal that [SCOPE.sC('other_romans').GetRuler.GetName] wrought upon our great nation, has led to numerous speaking of the existence of two Romes; the rightful government to the west, and the illegitimate pretenders in the east.\n\nThis eponymous schism serves only to reinforce the severity of the conflict, and we must do all in our power to bring a conclusion to this affair, before the vultures descend."
 dhe_rome.22.desc:1 "After a victorious battle in [SCOPE.sP('battle_location').GetName], our troops have located one of the famous eagles of Rome and brought it home to [ROOT.GetCountry.GetCapital.GetName]. These spoils of war will forever remain as a testament to our triumph over the Latins.\n\nWhen the Romans are informed concerning their loss, they will desperately do everything in their power to get the eagle back. After all, who could live with that kind of shame?"
 desc_dhe_rome_patricio_plebeian_aristocracy_cm:0 "We are encouraging the development of a middle class between patricians and plebeians."
 desc_dhe_rome_populist_reform_cm:0 "Reforms favourable to the plebeians have been pushed through the senate, placating the populists."
 desc_dhe_rome_plebeian_secession_crackdown_cm:0 "A large demonstration of solidarity by plebeians versus an unfair political system has been violently crushed."
 desc_dhe_rome_expansions_tribes_pm:0 "The expansion of the Roman tribes has lead to expansion in the capital."
 desc_dhe_rome_great_transformation_slaves_cm:0 "By supporting the estate farming system, or Latifundia, we have defended the interests of our citizens and upset marginalised small farmers."
 desc_dhe_rome_military_buildup_cm:0 "A substantially investment in the rapid expansion of our military has been authorised, in order to challenge the menace of Carthage."
 desc_dhe_rome_carthaginian_ships:0 "The Carthaginians use an ingenious system of part numbering, rendering vessel building more rapidly than ever previously."
 desc_dhe_rome_angry_shipwrights:0 "Our shipwrights are causing all manner of disquiet in this province, probably due to our adoption of Carthaginian shipbuilding techniques putting them out of work."
 dhe_rome.21.desc:0 "The fate of one of the lost eagles of [ROOT.GetCountry.GetName] has finally come to light. Abandoned in the smoking ruin of [SCOPE.sP('eagle_location').GetName], the tarnished gold and bronze was nearly invisible to our soldiers. Luckily, a passing centurion happened upon the standard; once proudly displayed at the head of our legions, and now rotting in foreign climes.\n\nHonour is finally restored to [ROOT.GetCountry.GetName]."
 desc_captured_roman_eagle:0 "We have defeated the paltry Roman legions, and acquired their eagles for our own!"
 dhe_rome_intervenes_opinion:0 "Intervened Versus Carthage"
 dhe_rome_free_aid_opinion:0 "Assisted Without Requirements"
