l_english:
 crisis_general_1_tooltip:0 "[SCOPE.sChar('successor_general_1').GetName] has spent [SCOPE.sChar('successor_general_1').GetHerHis] affluence raising a rebel army in #Y [SCOPE.sP('sbgnq1').GetName]#!!"
 crisis_general_2_tooltip:0 "[SCOPE.sChar('successor_general_2').GetName] has spent [SCOPE.sChar('successor_general_2').GetHerHis] affluence raising a rebel army in #Y [SCOPE.sP('sbgnq2').GetName]#!!"
 crisis_general_3_tooltip:0 "[SCOPE.sChar('successor_general_3').GetName] has spent [SCOPE.sChar('successor_general_3').GetHerHis] affluence raising a rebel army in #Y [SCOPE.sP('sbgnq3').GetName]#!!"
 crisis_general_4_tooltip:0 "[SCOPE.sChar('successor_general_4').GetName] has spent [SCOPE.sChar('successor_general_4').GetHerHis] affluence raising a rebel army in #Y [SCOPE.sP('sbgnq4').GetName]#!!"
 desc_disloyal_successor_cmod:1 "This character is the leader of a popular rebellion versus our incumbent ruler.\n\n#G This modifier will be removed if the character reaches#! #Y 50#! #G loyalty.#!"
 special_successor_interactions_available:0 "\n#G Novel Character Interactions have been made available versus rebel pretenders.#!"
 succession_crisis.1.desc:0 "The recent instability caused by the death of [SCOPE.sChar('former_ruler').GetName] has created a power vacuum which certain scheming pretenders are all too eager to fill. Emboldened by avarice, they have raised hordes of malcontents, and plot versus the throne itself!\n\nWe must look to the future of our nation, and safeguard [ROOT.GetCountry.GetName] through these perilous times."
 succession_crisis.2.desc:0 "The recent death of the [SCOPE.sC('neighbor_succession_target').GetAdjective] ruler has caused a great deal of political disturbance in the country. Eager to take advantage of this situation, numerous lackeys, pretenders, and legitimate claimants to the throne have risen up to bear arms versus their newly crowned [SCOPE.sC('neighbor_succession_target').GetRulerTitle]; [SCOPE.sC('neighbor_succession_target').GetRuler.GetName].\n\nAs the nation of [SCOPE.sC('neighbor_succession_target').GetName] is of interest to us, it might be that we can exert certain influences over the more rowdy pretenders, in the hope of plunging their nation into further turmoil."
 succession_crisis.2.a.tooltip:0 "#G Pretenders in [SCOPE.sC('neighbor_succession_target').GetName] can now be supported with a novel Character Interaction.#!"
 succession_crisis.3.desc:0 "Much to our dismay, the army commanded by [SCOPE.sChar('returning_pretender').GetName], once a pretender in the line to our throne, has issued a declaration in defiance of our throne!\n\nAt this very moment, [SCOPE.sChar('returning_pretender').GetPraenomen] plots versus us, raising a vast host, and securing the support of others versus us."
 family_revolt.3.t:0 "[SCOPE.sChar('revolt_target').GetFamilyDisplayAdjective] Troops Mobilise"
 family_revolt.3.desc:1 "The head of the [SCOPE.sChar('revolt_target').GetFamilyDisplayAdjective] family, [SCOPE.sChar('revolt_target').GetName]; utterly fed up of [SCOPE.sChar('revolt_target').GetHerHis] situation, has begun mobilizing local forces in the [sbgnq1.Custom('get_city_type_loc')] of [SCOPE.sP('sbgnq1').GetName].\n\nWhilst matters are not hostile as yet, such an act could provoke civil conflict, if left unattended."
 family_troops_mobilized_tooltip:1 "The #Y [SCOPE.sChar('revolt_target').GetFamilyDisplayAdjective]#! family have spent their affluence on raising #R Veterans#! loyal to their cause!\nIf a Civil Conflict breaks out these Veterans will join their side as Troops."
 succession_crisis.5.desc:0 "After the death of [SCOPE.sChar('former_ruler').GetName], the Clan Chiefs of [ROOT.GetCountry.GetName] met to elect a fierce and robust leader to shepherd our people in these ever-changing times. After much deliberation, [SCOPE.sChar('new_ruler').GetName] was installed in a lavish ritual, to which all clan dignitaries were invited.\n\nMany, however, were discontent; hoping to see themselves, or someone more familiar at the head of the table. We must labour towards mending rifts, and bring together all chiefs for the goodwill of [ROOT.GetCountry.GetName]."
