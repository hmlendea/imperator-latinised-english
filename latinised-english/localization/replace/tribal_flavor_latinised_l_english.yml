l_english:
 tribal_flavour_event.1.desc:0 "Two of our tribesmen have come forward today to request for assistance settling ownership over a gold [ROOT.GetCountry.Custom('get_found_treasure')] they found. [SCOPE.sChar('duelist_1').GetName] believes it belongs to [SCOPE.sChar('duelist_1').GetHerHim] as [SCOPE.sChar('duelist_1').GetSheHe] was the one to find it, whereas [SCOPE.sChar('duelist_2').GetName] says it belongs to [SCOPE.sChar('duelist_2').GetHerHim] as it was discovered on [SCOPE.sChar('duelist_2').GetHerHis] territory."
 tribal_flavour_events.3.desc:0 "News has reached us by word of mouth, that the once-powerful [SCOPE.sC('origin_crisis').GetAdjective] have fallen to internal bickering, strife, and wanton power struggles.\n\nNumerous local chiefdoms have arisen from the ashes of the crisis, perhaps affording an opportunity to their watchful neighbours. The [SCOPE.sC('origin_crisis').GetAdjective] still retain a nominal leadership of some of the disparate clans, desperately clinging to their laughable hegemony."
