l_english:
 generic_mission_conquer_region_BUTTON_TOOLTIP:0 "[ROOT.GetCountry.GetName] must develop her interests."
 generic_mission_conquer_region_DESCRIPTION:0 "Our fortunes await in foreign lands; the [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName] region has been considered part of our frontiers, yet much of it remains beyond our control - make sure that it is brought under our influence one way or another."
 generic_mission.1.desc:0 "The region of [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName] has remained a valuable source of trade and commerce for our nation for numerous extended years. Numerous amongst the [ROOT.GetCountry.Custom('get_court_type')] insist that such a bountiful land would serve much better purpose if fully integrated under the [ROOT.GetCountry.GetAdjective] banner.\n\nOf course, as with all matters of state, numerous are in opposition, claiming that a healthy relationship with our neighbours is considerably more important than a wanton land-grab. The leaders of each side have presented their arguments and ask for an arbitration as to which method would be preferable in our dealings with the various states resident in [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName]."
 peaceful_weight_up_tt:0 "We will shift in the direction of a more #Y Peaceful#! method for our dealings in #Y [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName]#!."
 warlike_weight_up_tt:0 "We will shift in the direction of a more #Y Warlike#! method for our dealings in #Y [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName]#!."
 generic_mission.2.desc:0 "Debate has raged for numerous years, over our rocky relationship with the nation-states resident in [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName]. [SCOPE.sC('friendly_neighbor_target').GetName], a nation many in [ROOT.GetCountry.GetName] call a friend, remains well-placed to provide us with assistance in our endeavours to control [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName].\n\nNumerous of our more warlike advisors, however, seem intent on burning all bridges and laying waste to [SCOPE.sC('friendly_neighbor_target').GetAdjective] lands in an effort to additionally advance our cause."
 generic_mission.2.b:0 "Let them be aware that their territory is in our sights!"
 generic_mission_conquer_region_branch_develop_owned:0 "Establish [SCOPE.sArea('development_branch_area').GetName]"
 generic_mission.3.a:1 ""[SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName] must pertain to [ROOT.GetCountry.GetName]!""
 governor_exists_and_is_ours_tt:0 "#Y [SCOPE.sP('conquer_region_target').GetArea.GetRegion.GetName]#! possesses a Governor employed by [SCOPE.GetRootScope.GetCountry.GetName]."
 generic_mission_conquer_region_branch_develop_owned_follow_1_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! possesses #Y 3#! or more urban centres with no free structure slots in the Province of #Y [SCOPE.sArea('development_branch_area').GetName]#! (#Y [SCOPE.ScriptValue('generic_mission_expansion_development_no_free_building_slots_svalue')|0]#!/#Y 3#!)"
 generic_mission_conquer_region_branch_develop_owned_tt:1 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! possesses #Y 3#! or more urban centres in the Province of #Y [SCOPE.sArea('development_branch_area').GetName]#! (#Y [SCOPE.ScriptValue('generic_mission_expansion_development_city_status_svalue')|0]#!/#Y 3#!)"
 generic_mission_conquer_region_branch_develop_owned_follow_2_tt:0 "Import #Y 2#! or more of the subsequent trade resources to the #Y Province of [SCOPE.sArea('development_branch_area').GetName]#! (#Y [SCOPE.ScriptValue('generic_mission_expansion_development_importing_svalue')|0]#!/#Y 2#!)\n @grain! Grain \n @vegetables! Vegetables\n @salt! Salt\n @fish! Fish\n @cattle! Livestock"
 generic_mission_conquer_region_branch_1_h_tt:0 "The #Y Province of [SCOPE.sArea('first').GetName]#! possesses #Y 90#! or higher province loyalty"
 generic_mission_conquer_region_branch_1_h_tt_2:0 "Every subject holding territory in the #Y Province of [SCOPE.sArea('first').GetName]#! possesses #Y 90#! or higher loyalty to #Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 generic_mission_conquer_region_branch_1_i_tt:0 "The #Y Province of [SCOPE.sArea('second').GetName]#! possesses #Y 90#! or higher province loyalty"
 generic_mission_conquer_region_branch_1_i_tt_2:0 "Every subject holding territory in the #Y Province of [SCOPE.sArea('second').GetName]#! possesses #Y 90#! or higher loyalty to #Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 generic_mission_conquer_region_branch_1_j_tt:0 "The #Y Province of [SCOPE.sArea('third').GetName]#! possesses #Y 90#! or higher province loyalty"
 generic_mission_conquer_region_branch_1_j_tt_2:0 "Every subject holding territory in the #Y Province of [SCOPE.sArea('third').GetName]#! possesses #Y 90#! or higher loyalty to #Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 generic_mission_conquer_region_branch_defend_area_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! possesses #Y 3#! or more territories in #Y [SCOPE.sState('defend_target').GetName]#! with a fort structure (#Y [SCOPE.ScriptValue('generic_mission_expansion_defend_area_svalue')|0]#!/#Y 3#!)"
