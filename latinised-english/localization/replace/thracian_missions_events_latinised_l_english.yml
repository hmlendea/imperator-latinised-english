l_english:
 me_thracian_01_hellespont.1.desc:0 "Our neighbouring urban centres beyond the Hellespont have paid dearly their decision to join forces with the [GetCountry('PRY').GetName]. \n\nEven by calling in their powerful ally, they were no match for our troops, which rooted their armies and laid waste to their urban centres. The other Greeks of the area will probably be intimidated and refuse to help us, but what really matters is that we sent a clear signal to our neighbours and set our first bases in Asia."
 me_thracian_01_hellespont.1.a.tt:0 "All our neighbours of [hellenic_culture_scope.GetName|Y] culture will lose faith in us."
 me_thracian_01_hellespont.1.b.tt:0 "This will harm our Greek neighbours' opinion of us."
 me_thracian_01_hellespont.2.desc:0 "[GetCharacter('(int32)37').GetName]'s mastery in swaying the Greeks through his promises has long been unmatched, but our Basileus [ROOT.GetCountry.GetRuler.GetName] can be just as persuasive. \n\nOur ambassadors should attempt to gain the favour of some of the [GetCountry('PRY').GetName]'s allies around the Hellespont. Through a mix of diplomacy, bribery, and intimidation, they could become willing to hear our offers and, if pleased, abandon their current suzerain and side with us!"
 me_thracian_01_hellespont.2.b.tt.2:0 "We will dispatch a bribe of #Y 125#! gold to each country."
 me_thracian_01_hellespont.3.desc:0 "Emissaries from [GetCountry('TRE').GetName] have recently arrived to our city. \n\nThey bring a considerable sum of gold as a gift from their Basileus, and an interesting offer. [GetCountry('TRE').GetRuler.GetName] is a generous and benevolent man, and he is willing to protect and benefit us greatly, if we only accept to betray our suzerain, [GetCountry('PRY').GetRuler.GetName], and switch sides. \n\nSuch a proposal should be outrageous, but [GetCountry('PRY').GetRuler.GetName] is invariably far away fighting his armed conflicts, and [GetCountry('TRE').GetRuler.GetName] is so dangerously close to our borders..."
 me_thracian_01_hellespont.5.desc.1:0 "[GetCountry('CDD').GetName] has accepted our offer! \n\nWhether they were seduced by our promises, bought by our gold, or frightened by the closeness of our mighty armies, they decided to betray their suzerain, the accursed [GetCountry('PRY').GetName], and chose to be our subjects! We must expect a swift retribution from [GetCountry('PRY').GetRuler.GetName] but, in the meanwhile, we shall celebrate the accomplishments of our skillful diplomacy!"
 me_thracian_01_hellespont.5.desc.2:0 "[GetCountry('AST').GetName] has accepted our offer! \n\nWhether they were seduced by our promises, bought by our gold, or frightened by the closeness of our mighty armies, they decided to betray their suzerain, the accursed [GetCountry('PRY').GetName], and chose to be our subjects! We must expect a swift retribution from [GetCountry('PRY').GetRuler.GetName] but, in the meanwhile, we shall celebrate the accomplishments of our skillful diplomacy!"
 me_thracian_01_hellespont.5.desc.3:1 "[kio_tag_scope.GetName] has accepted our offer! \n\nWhether they were seduced by our promises, bought by our gold, or frightened by the closeness of our mighty armies, they decided to betray their suzerain, the accursed [GetCountry('PRY').GetName], and chose to be our subjects! We must expect a swift retribution from [GetCountry('PRY').GetRuler.GetName] but, in the meanwhile, we shall celebrate the accomplishments of our skillful diplomacy!"
 me_thracian_01_hellespont.5.desc.4:0 "[GetCountry('KZK').GetName] has accepted our offer! \n\nWhether they were seduced by our promises, bought by our gold, or frightened by the closeness of our mighty armies, they decided to betray their suzerain, the accursed [GetCountry('PRY').GetName], and chose to be our subjects! We must expect a swift retribution from [GetCountry('PRY').GetRuler.GetName] but, in the meanwhile, we shall celebrate the accomplishments of our skillful diplomacy!"
 me_thracian_01_hellespont.6.desc:0 "We have now received an answer from all the countries we have contacted. Whether the results met our expectations or not, our ambassadors have done everything they could, and the arts of diplomacy have spoken. The [GetCountry('PRY').GetName]'s stand among their allies and subjects is less robust than they would like to convey; if we managed to obtain some important victories on the battlefield, [GetCountry('PRY').GetRuler.GetPraenomen]'s might crumble.\n\nIt is time to press on with our armies!"
 me_thracian_01_hellespont.7.desc:0 "The friction along the frontier between the [GetCountry('PRY').GetName] and our own has come to a breaking point. It is clear that [GetCountry('PRY').GetRuler.GetName] will not stop at anything to prove the legitimacy of his claim to Alexander's empire, and we are all obstacles in his path. If we permit the Antigonids to bring the armed conflict across the Hellespont, we will be isolated and weak; however, if we take the armed conflict to them, we can join forces with the other Diadochi and pressure [GetCountry('PRY').GetRuler.GetPraenomen] from every side!"
 me_thracian_01_hellespont.8.t:0 "Fund the Conflict Chest: Discontent"
 me_thracian_01_hellespont.8.desc:0 "The numerous armed conflicts both among Diadochi and versus the barbarians from the North are draining our finances. Novel taxes are never popular, but they are a quick and convenient fix for any emergency. \n\nWhile our representatives return from our subjects along the coasts of the [GetProvince('(int32)2770').GetArea.GetName] bearing chests of gold, we are cognisant that we are fostering their resentment and counting too much on their already wavering loyalty. However, exploiting is in the nature of subject-suzerain relationships - if they are unable to accept it, they will deal with the consequences. We are invariably ready to repress any revolt and, now that our coffers are fuller, more so than ever."
 me_thracian_01_hellespont.9.t:0 "Taxes for the Conflict Chest"
 me_thracian_01_hellespont.9.desc:0 "Our suzerain, [GetCountry('TRE').GetName], is invariably occupied in many armed conflicts, squandering money at every turn. We do our part, paying taxes, sending manpower, and even taking up arms ourselves to help them, but it seems it's never enough. \n\nNow, they have the audacity of coming to us and expecting us to pay a special tax to fund their conflict chest. Sadly, we currently lack the power to rebel, so we can only lower our heads and accept the request. For now."
 me_thracian_01_hellespont.10.desc:0 "After years of Antigonid misgovernment, one the most celebrated sites of the [hellenic_scope.GetName] world is finally back under the control of a respectful leader. \n\nAlexander, a true hero among men and now a god among the gods, came to [GetProvince('(int32)257').GetName] as soon as he set foot in Asia to pay his respects to Achilles' grave. Our Basileus [GetCountry('TRE').GetRuler.GetName] has decided to follow his illustrious example: great celebrations and sacrifices were offered to the site by the Basileus himself upon his arrival. Let it be known that [GetCountry('TRE').GetRuler.GetName] respects the heroes of ancient, first and foremost Achilles, and strives to imitated their glorious deeds!"
 me_thracian_01_hellespont.10.a:0 "The heroes of ancient guide us to greatness!"
 me_thracian_01_hellespont.10.a.tt:0 "Every country of [hellenic_scope.GetName|Y] culture will appreciate our efforts to honour the memory of the Trojan Armed conflict."
 me_thracian_01_hellespont.10.b.tt:0 "Every country of Hellenistic culture will appreciate our efforts to honour the memory of the Trojan Armed conflict."
 me_thracian_01_hellespont.12.desc:0 "The despotate of [GetCountry('HCP').GetName] lies in the path of future expansion into Bithynia and would make a useful staging point in our conflict with the [GetCountry('PRY').GetName] to the south.\n\nThe kingdom, ruled by relatives of the defeated Darius III of Persia, is powerless in the power struggle just outside its borders, and might be interested in gaining a protector. Also, these territories were once under the influence of Alexander's empire, and it will be a worthy cause to bring them back under Macedonian guidance."
 me_thracian_01_hellespont.12.a:0 "Let us dispatch our ambassadors."
 me_thracian_01_hellespont.13.desc:0 "Ambassadors from [GetCountry('TRE').GetName] stand in front of [GetCountry('HCP').GetRuler.GetName] with the arrogance of a victorious conqueror. They bear their Basileus [GetCountry('TRE').GetRuler.GetPraenomen]'s friendship, gold, and an offer that reeks of veiled menaces. \n\nThey point out that we are a minor, defenceless country in the middle of wrestling giants. By renouncing our liberty and independence and becoming their subjects, we shall gain a powerful ally and protector - one that could as easily become a mortal enemy if rejected."
 me_thracian_01_hellespont.14.desc:0 "[GetCountry('HCP').GetRuler.GetName] has seen reason and chosen the safest path for the people of [GetCountry('HCP').GetName]. Our ambassadors return home satisfied. \n\n[GetCountry('HCP').GetName] is now our tributary and will contribute to our military efforts on the Anatolian front. Despite being a very minor country, [GetCountry('HCP').GetName] was an influent player in Anatolia. We did well in preventing them from falling under the influence of our rivals. \n\nAnother success for our diplomacy!"
 me_thracian_01_hellespont.15.desc:0 "[GetCountry('HCP').GetRuler.GetName] has not seen reason, and chose the most dangerous path for the people of [GetCountry('HCP').GetName]. \n\nOur ambassadors return home disappointed; [GetCountry('HCP').GetName] has rejected our offer to become our subject. \n\nWhereas diplomacy has failed, our armies shall succeed. Despite being a very minor country, [GetCountry('HCP').GetName] is, in fact, an influent player in Anatolia, and we is unable to permit them to fall under the influence of our rivals!"
 me_thracian_01_hellespont.16.desc:0 "Despite our best efforts, we is unable to compete with the vessel production of giants such as the [GetCountry('PRY').GetName] and [GetCountry('EGY').GetName]. However, the armed conflict has moved to the sea, too, and we must maintain up with our rivals if we want to survive and prosper. \n\nOur neighbour, [GetCountry('BYZ').GetName], is renowned for their shipbuilding experience and fleet size; if we could get hold of their ports and fleet, we could change the tide of any armed conflict among the Successors. We should extend them our friendship and protection, as long as they offer us their powerful fleet."
 me_thracian_01_hellespont.16.a:0 "Let us dispatch our offer."
 me_thracian_01_hellespont.17.desc:0 "Ambassadors from [GetCountry('TRE').GetName] stand in front of [GetCountry('BYZ').GetRuler.GetName] with the arrogance of a victorious conqueror. They bear their Basileus [GetCountry('TRE').GetRuler.GetPraenomen]'s friendship, gold, and an offer that reeks of veiled menaces. \n\nThey point out that we are a minor country in the middle of wrestling giants. By renouncing our liberty, independence, and fleet, and becoming their subjects, we shall gain a powerful ally and protector - one that could as easily become a mortal enemy if rejected."
 me_thracian_01_hellespont.19.desc:0 "[GetCountry('BYZ').GetRuler.GetName] has foolishly chosen the most dangerous path for the people of [GetCountry('BYZ').GetName]. \n\nOur ambassadors return home disappointed; [GetCountry('BYZ').GetName] has rejected our offer to become our subject. \n\nWhereas diplomacy has failed, however, our armies shall succeed. We is unable to permit the [GetCountry('BYZ').GetAdjective] fleet and their extensive shipyards to fall in the hands of our rivals. If we can't control them peacefully, we should rather destroy them."
 me_thracian_01_hellespont.19.a:0 "To armed conflict!"
 me_thracian_01_hellespont.24.desc:0 "Not so long ago, we struck a pact with the Epirotes: since both of us distrust [GetCountry('MAC').GetName] and aspire to her throne, we decided to join forces and wage a joint armed conflict against [GetCountry('MAC').GetName] by attacking her on both fronts. \n\nThe armed conflict has started, and we are counting on [GetCountry('EPI').GetRuler.GetName|Y] to maintain his promise and do his part. [GetCountry('MAC').GetName] is sure to fall before the combined might of our armies, and our only worry will be how to share the spoils!"
 me_thracian_01_hellespont.24.a:0 "It is time for them to honour their promise."
 me_thracian_01_hellespont.24.a.tt:0 "We request [GetCountry('EPI').GetName|Y] to join our armed conflict."
 me_thracian_01_hellespont.25.t:0 "The Matter of Macedon: A Novel Basileus"
 me_thracian_01_hellespont.25.desc:0 "[GetCountry('MAC').GetName] has become torn, chaotic and weak since [GetCharacter('(int32)32').GetPraenomen]'s death. The throne of Alexander has been sullied, but we have the chance to restore it to its legitimate greatness. \n\nOur armed conflict with [GetCountry('MAC').GetName] must continue until our Basileus [GetCountry('TRE').GetRuler.GetName|Y] has pacified the whole area and can proudly sit where Alexander did!"
 me_thracian_01_hellespont.26.desc:0 "Not so long ago, we struck a pact with [GetCountry('TRE').GetName]: since both of us distrust [GetCountry('MAC').GetName] and aspire to her throne, we decided to join forces and wage a joint armed conflict to [GetCountry('MAC').GetName] by attacking her on both fronts. \n\nThe armed conflict has started, and [GetCountry('TRE').GetRuler.GetName] is counting on us to maintain our promise and do our part. [GetCountry('MAC').GetName] is sure to fall before the combined might of our armies, and breaking our word now would damage our relations with [GetCountry('TRE').GetName] beyond repair; however, we might also want to wait this armed conflict out, let our rivals wear each other down, and only then swoop in for the take..."
 me_thracian_01_hellespont.27.t:0 "The Matter of Macedon: Assistance Incoming"
 me_thracian_01_hellespont.27.desc:0 "The Epirotes kept their promise and are joining the armed conflict. We can place pressure on [GetCountry('MAC').GetName] from both sides in a pincer manoeuvre that will leave them nowhere to run. \n\nSoon our armies will march victorious over [GetCountry('MAC').GetName]! While victory is almost assured, we should also consider the possible consequences of our joint venture: how will we divide the remains of the [GetCountry('MAC').GetName] kingdom with our ally?\n\nAre we ready to betray them or be betrayed?"
 me_thracian_01_hellespont.28.desc:0 "We have been betrayed! Those shameless dogs from [GetCountry('EPI').GetName] have changed their minds and will not join us in our armed conflict against [GetCountry('MAC').GetName]! \n\nIt seems that [GetCountry('EPI').GetRuler.GetPraenomen]'s word is wortheless nowadays; we shall never trust them again. Also, we didn't even require their assistance. [GetCountry('MAC').GetName] will still be ours."
 me_thracian_01_hellespont.29.desc:0 "Our march over Asia is unstoppable: we have consolidated our position beyond the Hellespont and all the way down to the Taurus Mountains, while our rivals grow weaker by the day. \n\nWhile the Hellespont remains our final line of defence, our expansion in [GetProvince('(int32)257').GetArea.GetRegion.GetName] and [GetProvince('(int32)1941').GetArea.GetRegion.GetName] has almost redoubled the size of our kingdom and, in particular, moved the ever-hot Asian frontier far away from our capital. If we manage to maintain control over these highly-contested areas, our possibilities to defeat our rivals will grow exponentially."
 me_thracian_01_hellespont.30.desc:0 "The Asian hinterland has invariably been inhabited by [anatolian_scope.GetName] people. \n\nWhile they do not speak Greek and don't dress like us, the influence of neighbouring Greek urban centres and their culture on them is robust. They admire us - rightfully so - and, with some extra efforts and investments, they could be convinced to adapt our ways. This should make it easier for us to control the area, and they should participate more enthusiastically in our endeavours."
 me_thracian_01_hellespont.31.desc:0 "After the first year of our novel policy, we commence seeing the first results. \n\nThe [anatolian_scope.GetName] people of [GetProvince('(int32)257').GetArea.GetRegion.GetName] and [GetProvince('(int32)1941').GetArea.GetRegion.GetName] are becoming more [hellenic_scope.GetName] by the day, learning our language, adopting our customs and taking their place in our bureaucracy. While this process can be incouraged and supported, it is unable to be forced, and it will take generations to be completed."
 me_thracian_01_hellespont.31.a:0 "In the meanwhile, we toast to a good commencement!"
 me_thracian_01_hellespont.32.desc:0 "We have secured our first territory in [GetProvince('(int32)1951').GetArea.GetRegion.GetName], but this is nothing more than the first step in our plan. \n\nTaking advantage of the lack of resistance from the weakened neighbouring countries, we should advance into Cappadocia and extend our dominion to the whole range of the Taurus Mountains - a naturally safe frontier versus invaders from South and East."
 me_thracian_01_hellespont.33.t:0 "Asian Autonomy: A Novel Kingdom"
 me_thracian_01_hellespont.34.t:0 "Contesting the Aegean: Vessels of War"
 me_thracian_01_hellespont.34.desc:0 "Since the foundation of our kingdom, our maritime interests have lied in the [GetProvince('(int32)2770').GetArea.GetName]. Despite our position straddling two seas, our recent expansion has been mostly addressed towards inland areas of Asia. \n\nHowever, we do control several ports along the coasts of the Aegean Sea now, and we should not let their potential go to waste. Other Diadochi, in fact, are greatly interested in the area and are ready to take advantage of our distraction. If we don't control the sea, they will be free to vessel straight to the doors of our capital!"
 me_thracian_01_hellespont.36.desc:0 "Due to the position of the original satrapy assigned to our founder [GetCharacter('(int32)41').GetName], our country has invariably considered the [GetProvince('(int32)2770').GetArea.GetName] an area of our exclusive interest. \n\n[GetProvince('(int32)350').GetArea.GetRegion.GetName] is not rich; the urban centres are few, but they are all ancient Greek colonies that survived for centuries, in a far-away territory populated by warlike barbarians, through their commercial skills. In particular, the grain traded from the [GetProvince('(int32)2770').GetArea.GetName] has long supported the development of great urban centres such as [GetProvince('(int32)416').GetName]. By cutting out our rivals from this area, we have ensured a strategic advantage for ourselves in food provisioning."
 me_thracian_01_hellespont.37.desc:0 "Apparently, we were erroneous. Our contacts at the [GetCountry('EPI').GetAdjective] court had led us to believe that [GetCountry('EPI').GetRuler.GetName] was about to make us an interesting offer to attack [GetCountry('MAC').GetName] together.\n\nThe silence coming from the Epirotes, however, is deafening, and we must assume that they changed their mind and decided to fight their armed conflicts on their own.\n\nWe shall meet them on the battlefield."
 me_thracian_01_hellespont.39.a:0 "It is a brave and worthy endeavour."
 me_thracian_01_hellespont.40.desc:0 "Securing our position on the Pontus Euxinus and on the other side of the Hellespont was only the first step.\n\nThe beating heart of our kingdom is safe and our borders have grown far and robust, but we must not grow complacent. Our rival Diadochi have learned to fear and respect us, and [ROOT.GetCountry.GetRuler.GetName] is finally a real contender in the struggle to unify Alexander's empire once again and to become his true Successor. Onward to greater glory!"
 me_thrace_2_paper_kingdom.1.desc:0 "Upon Alexander's death and the division of his empire, Lysimachos was granted the Satrapy of Thrace. This was a poisoned gift, for while a wealthy and robust region on paper, the Macedonians' hold on it was never more than tenuous at best.\n\nThe Thracian tribes that had once been subdued by Philip II, and which are nominally subjects of Thrace's ruler, have time and again shown their disloyalty and treachery. Still further north, across the protective breadth of the great river Istros, lie the territories of the Getae, sending their raids over the river's fords to ravage the territories of the Greek colonies on the western shore of the Pontus Euxinus - urban centres that are the very treasury of the satrapy. And all the while, to the south, as Thrace bridges the Greek and Asian worlds through control of the Hellespont, it is only a matter of time before one will seek to invade the other and dispatch an army through Thrace to do it.\n\nFor decades Lysimachos, through cunning, diplomacy, and sheer military genius, managed to maintain out of these Successor Armed conflicts, while countering each and every menace presented to him by the barbarians to his north - defying all the odds by maintaining the integrity of the satrapy. Now, with the impossible already achieved, what remains to be done is easy. If [ROOT.GetCountry.GetRuler.GetName] is to match the power of the other Diadochi and earn [ROOT.GetCountry.GetRuler.GetHerHis] self-proclaimed title of [ROOT.GetCountry.GetRulerTitle], this "Paper Kingdom" must be converted into a kingdom as powerful and stable in reality as it is nominally held to be - for, in the words of the wise, "Thracians, united, would be invincible and the strongest nation on Earth.""
 me_thrace_2_paper_kingdom.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName] has, at long last, united the nominal territories of the Thracian satrapy under [ROOT.GetCountry.GetRuler.GetHerHis] name, succeeding in the impossible task initially set out by those who granted our family this poisoned gift. Though it has taken its time, surely those who yearned to see us fail laugh no longer. Let our enemies tremble as the very peoples whose divisiveness was intended to break us are now hurled in their direction, united and robust, as an unbeatable army."
 me_thrace_2_paper_kingdom.3.desc:0 "Our cursed suzerain, [ROOT.GetOverlord.GetRuler.GetPraenomen], has stumbled into armed conflict with [ODR_thracian_enemy.GetName]. While their attention is focused on the armed conflict with their fellow Diadoch, perhaps we might take advantage of the situation for our own gains..."
 me_thrace_2_paper_kingdom.3.b:0 "It would be unwise to fury our suzerain."
 me_thrace_2_paper_kingdom.4.desc:0 "The ever-deceitful Odrysi have chosen the time of their latest revolt with great cunning. With our forces occupied with the armed conflict with [ODR_thracian_enemy.GetName], [GetCountry('ODR').GetRuler.GetName] has seen [GetCountry('ODR').GetRuler.GetHerHis] chance to secure [GetCountry('ODR').GetAdjective] independence, and [GetCountry('ODR').GetRuler.GetHerHis] forces are presently preparing to plunge a dagger into our backs."
 me_thrace_2_paper_kingdom.5.desc_2:0 "Due to how sudden the attack was, the raiders fell upon the fleeing inhabitants before they could reach the relative safety of the city, and many were enslaved and taken back across the Istros into Getian territory."
 me_thrace_2_paper_kingdom.8.desc:0 "With menaces on every side, we is unable to afford to have a disloyal subject that would stab us in the back. We would do well to offer an enticing incentive and obtain [GetCountry('ODR').GetAdjective] loyalty."
 me_thrace_2_paper_kingdom.9.b:0 "[ROOT.GetCountry.GetAdjective] liberty will not be sold so easily!"
 me_thrace_2_paper_kingdom.14.desc:0 "The diplomatic charm offensive started by [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen] has now undeniably bore fruit. Public opinion within [GetCountry('ODR').GetName] has now swayed so decisively in favour of [GetCountry('TRE').GetRuler.GetPraenomen] that it is highly unlikely [GetCountry('ODR').GetRulerTitle] [GetCountry('ODR').GetRuler.GetPraenomen] would be able to rally the people for future armed conflicts versus our suzerains as easily as [GetCountry('ODR').GetRuler.GetSheHe] has hitherto been able to."
 me_thrace_2_paper_kingdom.15.t:0 "[GetCountry('TRE').GetName] Prepares Punitive Armed conflict"
 me_thrace_2_paper_kingdom.24.desc:0 "At long last! Our policy of tolerance, acceptance, and the offering of some measure of autonomy have born fruit, and our opinion in the eyes of the Odrysi has never been higher. Even should [GetCountry('ODR').GetRulerTitle] [GetCountry('ODR').GetRuler.GetPraenomen] wish to assert [GetCountry('ODR').GetRuler.GetHerHis] independence, the will of [GetCountry('ODR').GetRuler.GetHerHis] is versus [GetCountry('ODR').GetRuler.GetHerHim]."
 me_thrace_2_paper_kingdom.19.t:0 "[GetCountry('TRE').GetName] Requirements Submission"
 me_thrace_2_paper_kingdom.19.desc:0 "Envoys from [GetCountry('TRE').GetName] have arrived demanding that [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] pledges allegiance to [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetName]. If we refuse, there will probable be armed conflict."
 me_thrace_2_paper_kingdom.19.b:0 "We will not surrender our liberty so easily!"
 me_thrace_2_paper_kingdom.20.a:0 "The commencement of a fine working relationship."
 me_thrace_2_paper_kingdom.22.desc:0 "Today [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] has achieved what not even Philip II nor Alexander himself could - the entirety of Thrace's theoretical borders lie firmly under [ROOT.GetCountry.GetRuler.GetHerHis] control. With the Thracian tribes pacified, the mighty Istros may serve as a natural barrier versus would-be enemies from the north, allowing us to, at long last, redirect our focus elsewhere."
 me_thrace_2_paper_kingdom.23.desc:0 "The expansion of the fortifications in [GetProvince('(int32)350').GetName] has concluded admirably, with imposing walls and novel towers dominating the coastal road leading from the Thracian Chersonese into Thrace proper. The city should hold out better versus any would-be invader crossing the Hellespont, while also making their passage more difficult."
 me_thrace_2_paper_kingdom.23.a:0 "Let our enemies attempt to pass now."
 me_thrace_2_paper_kingdom.25.t:0 "Territory of the Thracians"
 me_thrace_2_paper_kingdom.25.desc:0 "The strength of Thrace lies in its people, and to that end arrangements have been made for those of Thracian descent to be permitted to contribute more fully to the vitality of the nation. Where they were once looked down upon and derided, they now bear their heads high and proudly. Those who still resist this change will eventually come round when they witness what this stalwart and hardy people can contribute."
 me_thrace_2_paper_kingdom.25.a:0 "We are honoured to count them among us."
 me_thrace_2_paper_kingdom.26.t:0 "Menace of the Getae"
 me_thrace_2_paper_kingdom.27.desc:0 "The proposed military camps along the fords most used by Getian raiders have been established, and the men are already patrolling the area. With luck, this should substantially reduce the frequency of these audacious raids."
 me_thrace_2_paper_kingdom.28.desc:0 "All known fords across the mighty Istros, from the shore of the Pontus Euxinus in the east, to the furthest reaches of Saldensia in the west, are now firmly in our hands. Short of a full-fledged invasion force, no raids will be able to pass into the territories south of the river."
 me_thrace_2_paper_kingdom.30.desc:1 "Our armed conflict with [GetCountry('TRE').GetName] grows ever more dire, and the odds stack versus us. If we seek peace now, before our situation grows still worse, we may well gain [GetCountry('TRE').GetAdjective] acceptance for a return to the status quo ante bellum, thereby avoiding greater loss of territory and affluence."
 me_thrace_2_paper_kingdom.30.b:0 "This time we gain our liberty, or perish!"
 me_thrace_2_paper_kingdom.31.desc:0 "[GetCountry('ODR').GetRuler.GetPraenomen] has recognised his dire plight, and has sent envoys seeking peace. They offer a return to the status quo ante bellum, in return for an immediate cessation of hostilities."
 me_thrace_2_paper_kingdom.33.desc:0 "We have inflicted a major defeat upon [GetCountry('GTE').GetName]! Though complete control of their territories still eludes us and they still have a path into our territory, this setback should make them consider twice about sending future raids."
 me_thrace_2_paper_kingdom.33.a:0 "They know what will happen should they attempt again."
 me_thrace_2_paper_kingdom.34.desc:0 "Our investments in the city of [GetProvince('(int32)350').GetName] have paid of handsomely. With the construction of larger docks more trade routes can be accommodated, while novel aqueducts nourish a growing population, and squalor has been cleared to make way for novel houses."
 me_thrace_2_paper_kingdom.36.desc:0 "We rule over territories that are neither Greek nor Macedonian, and if we are to maintain the unruly barbarians of Thrace in check we must ensure their placation through enfranchisement in our kingdom."
 me_thrace_2_paper_kingdom.37.desc:0 "[GetCharacter('(int32)41').GetPraenomen] founded his own great city in the vain of Alexander, a centre for his court and bulwark versus the Antigonid menace, but there is still much labour to be done if the place is to live up to the capitals of the other successors."
 me_thrace_2_paper_kingdom.39.desc:0 "Across the mighty Istros river, the warlike Getae hide, raiding their southern neighbours and the Pontic urban centres for slaves and plunder. Their natural defence is also ours however, if we can ensure control of the few fords which span the waterway."
 me_thrace_2_paper_kingdom.40.desc:0 "We must continue to hinder the insidious Getae by ensuring our complete control over the vital fords of the great Istros river, guaranteeing that any raiding or warring bands overcome our defences to gain access to the interior of Thrace."
 me_thrace_2_paper_kingdom.41.desc:0 "Though subject to the raids of the barbarians, the Pontic urban centres to the north remain vital trade hubs, connecting Europe with the Greeks across the Pontos Euxinos and the tribes they frontier. We will encourage the flow of goods and peoples that these networks engender."
 me_thrace_2_paper_kingdom.42.at:0 "$me_thrace_start_tt$ dialogue with our #Y odrysi#! population."
 me_thrace_2_paper_kingdom.43.desc:0 "Beyond the Odrysians and mighty Haimos mountains lay the great expanses of the Moesian plain, occupied by Dacian tribes less civilised than their southern neighbours. They must accept our dominance in the region and pay tribute to the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] kingdom."
 me_thrace_2_paper_kingdom.43.a:0 "Let us place their sagacity to the test."
 me_thrace_2_paper_kingdom.44.at:0 "$me_thrace_start_tt$ preparations for armed conflict with @[GetCountry('ODR').GetFlag]! [GetCountry('ODR').GetName]."
 me_thrace_2_paper_kingdom.45.desc:0 "The Thracians are renowned for their bravery; the worship of the conflict-like horseman and their native Ares being the most important of all of their gods. It is time we used their martial tendencies to our advantage, and inducted them into the ranks of the phalanx."
 me_thrace_2_paper_kingdom.46.desc:0 "We must provide leadership to the Pontic urban centres if they are to remain loyal; protecting them from the northern Getae will ensure they respect the value of our protection and lengths we go to in order to fulfil our obligations."
 me_thrace_2_paper_kingdom.47.desc:0 "Though it rankles at the heart of any proud Macedonian, the governance of Thrace requires we place aside our pride and treat the Thracians with a respect usually reserved only for Greeks. By this course, we may safeguard the peace with the Odrysi and save our soldiers for more pressing menaces."
 me_thrace_2_paper_kingdom.50.desc:0 "Our fulminous march north must continue if we are to chase the vision of a north united under our rule; a [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] kingdom stretching from Lysimacheia to the distant colonies across the Pontos Euxinos and encompassing the diverse peoples betwixt - the brave Scythians are our next labour."
 me_thrace_2_paper_kingdom.51.desc:0 "Our cursed suzerain [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] has not given us any good opportunities to take advantage of, but we can wait no longer. We must rise up and assert our independence!"
 me_thrace_2_paper_kingdom.53.desc:0 "Our ally, [GetCountry('ODR').GetName], whom we have gone to armed conflict for, has been heavily hit in the current armed conflict with [GetCountry('TRE').GetName]. Rather than risk disaster, [GetCountry('ODR').GetRulerTitle] [GetCountry('ODR').GetRuler.GetPraenomen] has now sued for peace with [GetCountry('ODR').GetRuler.GetHerHis] [GetCountry('TRE').GetAdjective] suzerains, accepting a return to the status quo ante bellum.\n\nAs a result, the armed conflict has ended."
 me_thrace_2_paper_kingdom.53.a_tt:0 "Our armed conflict with @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y] has ended."
 me_thrace_2_paper_kingdom.54.desc:0 "Our enemy, [GetCountry('ODR').GetName], whom we have gone to armed conflict with on the side of our ally, [GetCountry('TRE').GetName], has been heavily hit in the current armed conflict. Rather than risk disaster, [GetCountry('ODR').GetRulerTitle] [GetCountry('ODR').GetRuler.GetPraenomen] has now sued for peace with [GetCountry('ODR').GetRuler.GetHerHis] [GetCountry('TRE').GetAdjective] suzerains, accepting a return to the status quo ante bellum.\n\nAs a result, the armed conflict has ended."
 me_thrace_2_paper_kingdom.54.a_tt:0 "Our armed conflict with @[GetCountry('ODR').GetFlag]! [GetCountry('ODR').GetName|Y] has ended."
 me_thrace_3_new_philhellene_policy.1.desc:0 "For centuries the Greeks, petty rulers of their myriads of city-states, have squabbled amongst themselves on a scale scarcely worthy of notice by a [ROOT.GetCountry.GetRulerTitle]. All attempts to bring unity to the region, by Philip II and Alexander, have been repaid in disloyalty and treachery. For decades now, the Greeks have been a thorn squarely in the side of the Macedonians, and even the example made with the fate of Thebes does not dissuade them from their self-destructive behaviour.\n\nThe time has come to accept that our customary ways of dealing with the Greeks no longer labour, and indeed possibly never have. Instead, we shall pander to their egos and treat them with respect and dignity, pay lip service to their 'democracy', shower them in gifts and privileges, and thereby unite them under our guidance without needing as much as a single soldier."
 me_thrace_3_new_philhellene_policy.11.desc:0 "The West-Pontic Greek urban centres, once mere colonies, have grown and prospered since those distant days. Their political influence reaches far, and indeed five of these Poleis have loosely affiliated themselves in a 'Pentapolis of the Pontic', under the leadership of Kallatis. Previous rebellions, while unsuccessful, have shown the power of this alliance, and their will to act to defend their interests.\n\nEven so, deal with them we must, for their economic affluence is the source of a large portion of our tax revenue, and the key to funding our armies. We must show them that we have not forgotten their importance, nor their past transgressions. A audacious project of infrastructure improvements will do all these things, while the benefits of these will also ultimately filter back to us through taxation."
 me_thrace_3_new_philhellene_policy.11.at:0 "$me_tre_task_start_tt_1$ encouraging Pontic colonisation."
 me_thrace_3_new_philhellene_policy.12.desc:0 "The project of rejuvenation and improvement of the West-Pontic urban centres have succeeded marvellously. Ancient and decrepit housing has been cleared, novel buildings constructed, and aqueducts and infrastructure have been built, all serving to help them absorb their increasing populations. Our investments in these works have not gone unnoticed, and have served as a useful reminder that [ROOT.GetCountry.GetName] remembers."
 me_thrace_3_new_philhellene_policy.13.desc:0 "In their sagacity, [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen] has seen fit to invest in our city!"
 me_thrace_3_new_philhellene_policy.14.desc:0 "Our efforts to maintain the thriving West-Pontic urban centres under our control and protection have failed. With their influence within [ROOT.GetCountry.GetName] waning, local governments struggling, mints shutting down, and the economic returns on our investments in the region uncertain, it is no longer advantageous to continue with our plans."
 me_thrace_3_new_philhellene_policy.21.desc:0 "In the spirit of generosity and as a token of our respect, and accompanied with the necessary pomp and ceremony, all Greek states shall enjoy a gift of a portion of the bountiful affluence of the [ROOT.GetCountry.GetRulerTitle], to be used to the benefit of the public. Let all Greeks share in the good fortunes of [ROOT.GetCountry.GetName]!"
 me_thrace_3_new_philhellene_policy.22.desc:0 "[GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen] has graced us with a lavish gift, claiming to wish to let all Greeks share in the affluence of [GetCountry('TRE').GetName]. While without question a theatrical move to sway the mood of our people and our leaders in favour of [GetCountry('TRE').GetAdjective] interests, the silver delivered to our coffers nevertheless makes a powerful argument..."
 me_thrace_3_new_philhellene_policy.31.desc:1 "A ruler whose influence reaches on a scale nigh incomprehensible to a commoner, and whose each and every action affects the lives of every subject, [me_thrace_scope.GetRuler.GetPraenomen], and indeed the entire [me_thrace_scope.GetRuler.GetFamilyDisplayName] family warrant a reverence that goes beyond mere obedience and obeisance. There are those who already comprehend this, and who extol [me_thrace_scope.GetRuler.GetHerHis] deeds far and wide. With the support of the [me_thrace_scope.GetAdjective] state and priesthood, this ardent core of devotees has been turned into the nucleus of a fully-fledged state cult of worship."
 me_thrace_3_new_philhellene_policy.41.desc:1 "Founding a city that turned into a thriving metropolis within the span of but a few years, toppling an age-ancient empire side-by-side with Alexander himself, and leading his army from place to place faster than is humanly possible to defeat the rebellious Greeks, Odrysians, and Antigonids in detail: these are the actions of no mortal man. Each of these actions, and still many more, display a vision, ability, and fortitude of personality that rivals that of the mighty Olympians, themselves. Who could disagree these are the deeds of legend?\n\nFrom now on, [deified_char.GetPraenomen] will take his rightful place among the gods of [ROOT.GetCountry.GetName]."
 me_thrace_3_new_philhellene_policy.51.desc:0 "The great city of [GetCountry('ATH').GetName] has a leading role among the city-states of Greece. Having their support is integral to any hopes we might have to ingratiate ourselves with the other Greeks, as many are probable to follow the example the Athenians set.\n\nTo this end, we have already for decades offered our benefactions to the Athenians, and with a final redoubling of our efforts we may now well earn the friendship - perhaps even loyalty - of the Athenians."
 me_thrace_3_new_philhellene_policy.52.desc_1:0 "They would even be most willing to lend military support in securing our liberty from [athens_overlord_scope.GetCountry.GetName]."
 me_thrace_3_new_philhellene_policy.52.b:0 "We is unable to commit to anything, but their gifts are welcome."
 me_thrace_3_new_philhellene_policy.52.c:0 "We consider not."
 me_thrace_3_new_philhellene_policy.53.desc_3:0 "The discussions appear to have fallen flat, and [GetCountry('ATH').GetAdjective] diplomats assure us their loyalty is unable to so easily be subverted."
 me_thrace_3_new_philhellene_policy.53.b:0 "They consider it is so easy?"
 me_thrace_3_new_philhellene_policy.54.b:0 "Not what we hoped for, but it is a commencement."
 me_thrace_3_new_philhellene_policy.61.a:0 "Their glory would legitimise our cause."
 me_thrace_3_new_philhellene_policy.62.desc_1:0 "They would even fight alongside us to win our liberty from [athens_overlord_scope.GetCountry.GetName]!"
 me_thrace_3_new_philhellene_policy.62.c:0 "[GetCountry('SPA').GetName] has no require of [GetCountry('TRE').GetAdjective] friendship."
 me_thrace_3_new_philhellene_policy.63.desc_1:0 "It seems they were successful, and the Spartans have rejected their obligations to us, and instead have allied themselves with [GetCountry('TRE').GetName], versus us!"
 me_thrace_3_new_philhellene_policy.63.desc_3:0 "They clearly did not succeed, as we have been assured by Spartan envoys that their loyalty is unable to so easily be bought."
 me_thrace_3_new_philhellene_policy.64.desc_2:0 "The Spartans have most graciously accepted our contributions to their conflict chest, but they feel a more formalised alliance is currently not in their interests."
 me_thrace_3_new_philhellene_policy.71.desc:0 "The right to mint one's possess currency, a sign of great prestige, and which is usually reserved to only the more powerful of independent states, has nevertheless long been exercised by the West-Pontic city-states.\n\nDespite their nominal obedience to the [GetCountry('TRE').GetAdjective] throne, it would go a long way to earning the goodwill of these Poleis if we were to permit them continue their practice of minting their own coins."
 me_thrace_3_new_philhellene_policy.71.a:0 "It is a minor price to pay."
 me_thrace_3_new_philhellene_policy.72.at:0 "Our Pontic city subjects will be #G -50.0%#! less probable to revolt against us when incited."
 me_thrace_3_new_philhellene_policy.73.desc:0 "[GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen] has seen fit to relax requirements on the royal privilege of minting. Rather than insist we desist from minting our own coins, we have been awarded with special dispensation to continue this labour, and reap the economic benefits from it."
 me_thrace_3_new_philhellene_policy.81.t:0 "$thrace_03_philhellene_8$: A Novel Protector"
 me_thrace_3_new_philhellene_policy.81.desc:0 "Our efforts in Greece are paying off. Our position gets stronger by the day, and the Greeks have started looking to us as their protector and champion of their interests.\n\nWhile our victory over the other Successors in Greece is not certain yet, we have made great strides in securing our presence, challenging our rivals, and forming alliances. We should take a moment to celebrate our successes so far and formalise our position."
 me_thrace_3_new_philhellene_policy.91.desc:0 "Showing our presence by means of a robust contingent of our soldiers stationed within the Greek city-states should be a constant reminder to the Poleis' authorities of who they owe their loyalty to.\n\nOur troops are garrisoned in each of the urban centres and our commanders are entrusted with dealing with any signs of organised resistance as the first line of defence."
 me_thrace_3_new_philhellene_policy.91.a:0 "Dispatch the troops."
 me_thrace_3_new_philhellene_policy.91.at:0 "$me_tre_task_start_tt_1$ garrisoning the Pontic urban centres."
 me_thrace_3_new_philhellene_policy.92.desc:0 "The garrisons have been established, and contingents of our men patrol the streets of the Poleis. The people may be safe in the knowledge that we protect them from menaces from without - and from within.\n\nWould-be rebellious action should be stifled at the mere sight of the walled and fortified barracks looming over the urban centres, within which our men are safely ensconced versus any attempts at a surprise insurgency."
 me_thrace_3_new_philhellene_policy.102.a:0 "We shall place it to good use."
 me_thrace_3_new_philhellene_policy.111.desc:0 "The people of [GetCountry('BOE').GetName] are proud and stubborn, and have invariably been hostile to Macedonians. As soon as Alexander ascended to the throne, [GetProvince('(int32)426').GetName] rebelled in such a clamorous way that Alexander razed the city to the ground. Now, however, we have a chance to extend an olive branch to them, forget past conflicts and, perhaps, make a novel friend in this difficult times and in such a turbulent area as Greece."
 me_thrace_3_new_philhellene_policy.111.a:0 "Let us dispatch our emissaries."
 me_thrace_3_new_philhellene_policy.112.desc:0 "Our relations with the Macedonians in general, and Alexander's Successors in particular, have invariably been checkered. Our loyalty is hard to obtain and even harder to maintain, because we are a proud and stubborn people. Therefore, the Thracian ambassadors appearing in front of our assembly with an offer of friendship came as a bit of a surprise.\n\nWhile acknowledging our previous differences, they are ready to make the first step in the reconciliation process by offering us their hand (accompanied by a little bribe). Is it enough for us to call them friends?"
 me_thrace_3_new_philhellene_policy.112.b:0 "We recognise their good intentions; not their friendship."
 me_thrace_3_new_philhellene_policy.113.desc_1:0 "Those treacherous, untrustworthy Boeotians have accepted a [GetCountry('TRE').GetAdjective] bribe and declared themselves independent! To add offence to the injury, they have also accepted their fiendship and proclaimed their countries allied. While their betrayal does not come as completely unexpected, they will pay dearly for it!"
 me_thrace_3_new_philhellene_policy.113.desc_3:0 "Luckily, the trust we place in them was well-deserved; they refused the offer and stayed loyal to us."
 me_thrace_3_new_philhellene_policy.114.desc_1:0 "They accepted our offer enthusiastically! Not only have they proclaimed their independence from their suzerain, but they have also joined us in an alliance. This is truly an impressive success for our diplomacy, which will make our position in Greece more secure and our future advance in the area easier."
 me_thrace_3_new_philhellene_policy.114.desc_2:0 "They accepted our offer with some reserves. They did proclaim their independence from their suzerain, but refused to commit to a long-term friendship. While this result is still a success for our diplomacy, the isolated position of [GetCountry('BOE').GetName] on the political scene will leave her at the mercy of any larger power of the area. We'd better make sure it is us."
 me_thrace_3_new_philhellene_policy.114.desc_3:0 "Sadly, they bring bad news. The Boetians laughed at our offer and sent our ambassadors back with only a message full of disdain. If we want their urban centres, we will have to take them by force!"
 me_thrace_3_new_philhellene_policy.114.b:0 "We will maintain an eye on their situation."
 me_thrace_3_new_philhellene_policy.121.desc:0 "The Greeks are, notoriously, an unruly bunch. They don't like to renounce their famed 'autonomy and liberty', except in the most desperate situations, in which they band together in leagues. Greek leagues are a powerful tool in the hands of whomever control them - as shown by the Athenian hegemony after the Persian Armed conflicts, and Philip's control of Greek matters through the League of Corinth.\n\nIf we managed to organise our scattered allies and the minor, independent factions currently in Greece into a league, our influence on the area would be indisputable."
 me_thrace_3_new_philhellene_policy.122.desc:0 "Ambassadors from [GetCountry('TRE').GetName] have come to us with an offer. The Greek free poleis are weak while standing alone, and Greece has been the Diadochi's battlefield for too long. The Thracian ruler, [GetCountry('TRE').GetRuler.GetName], suggests that we join a league of free urban centres under his protection, for there is strength in number.\n\nThe proposal is outrageous, but we might not have a choice. The perpetual state of conflict and uncertainty caused by the Successors' neverending fights has greatly empoverished Greece, and a robust league under the protection of one of the contenders might be our only chance of survival."
 me_thrace_3_new_philhellene_policy.122.at:0 "@[THIS.GetCountry.GetFlag]! [THIS.GetCountry.GetName] will lead the novel state."
 me_thrace_3_new_philhellene_policy.123.desc_1:0 "An healthy number of states have accepted!\n\n[GetCountry('TRE').GetRuler.GetPraenomen] is humbled and honoured by the trust the Greeks have place in [GetCountry('TRE').GetRuler.GetHerHim]. Our ruler proclaims the rebirth of the Hellenic League, tasked with defending Greek 'autonomia kai eleutheria' under the benevolent and protective eye of [GetCountry('TRE').GetName]."
 me_thrace_3_new_philhellene_policy.123.at:0 "[THIS.GetCountry.MakeScope.GetVariable('league_counter_var').GetValue|0Y] Greek states have accepted and been combined as our novel feudatory subject the @[league_head_scope.GetFlag]! [league_head_scope.GetName]"
 me_thrace_3_new_philhellene_policy.131.desc:0 "We shall set aside a large sum of the treasury to fund large-scale projects in the Poleis, to the benefit of their inhabitants. This will ensure that they shall see the hand of [GetCountry('TRE').GetName] at labour in their every-day lives, shaping their city and their fortunes, and playing a key role in their economic prosperity."
 me_thrace_3_new_philhellene_policy.132.desc:0 "Our investments have paid off handsomely, and not only have the peoples of the Poleis been shown [GetCountry('TRE').GetName] is never far away and is deeply concerned with their well-being, but the economies of the urban centres have also been measurably - and, more importantly to their inhabitants, visibly - improved."
 me_thrace_3_new_philhellene_policy.133.desc:0 "Gold from the [GetCountry('TRE').GetAdjective] treasury has recently flowed into [ROOT.GetCountry.GetName], with the construction of novel infrastructure, aqueducts, and housing, but also the support of key business ventures. Our people see the hand of [GetCountry('TRE').GetName] at labour in improving their lives, and creating prosperity for all.\n\nPerhaps the protection of [GetCountry('TRE').GetName] does indeed carry benefits..."
 me_thrace_3_new_philhellene_policy.141.desc:0 "The time of continued autonomy of the Poleis is nearing its end. Our bureaucrats stand ready to assume control over all decision-making organs, while local council sessions will only be held under our direction.\n\nAs resistance is to be expected, our soldiers are given free hands to dissolve any unauthorised gatherings until the people become accustomed to the novel status quo."
 me_thrace_3_new_philhellene_policy.142.desc:0 "The bureaucracies of the Poleis have been integrated into our own, though with the expected resistance. To lessen the blow, the customary democratic council sessions will be permitted to continue to give the citizens a chance to voice their opinions, but the decisions of these bodies are considered to be 'advisory' from this point onwards. In time, they will learn the superiority of our tried-and-true governing methods."
 me_thrace_3_new_philhellene_policy.151.desc:0 "The recent goodwill we have acquired with the governments of the Poleis, and indeed their peoples, have given us a strengthened position at the negotiating table. It may be possible to obtain the support of enough elements of the elites of these urban centres, if we provide the right incentives, to virtually eliminate any chance of further rebellions on their part."
 me_thrace_3_new_philhellene_policy.152.desc:0 "As we had hoped, our previous goodwill, coupled with promises of autonomy and showing some leniency in matters of the nominal rights of a city, has permitted us to weaken the rebellious factions of the leadership of the Poleis sufficiently to make further rebellions very unlikely. An agreement has now been signed formalizing many of their rights, fully pacifying the more moderate parts of their citizenry.\n\nOver time, however, they may well feel less insistent upon even these guarantees of autonomy than they do now."
 me_thrace_3_new_philhellene_policy.201.desc:0 "[GetCountry('TRE').GetName]'s control of the area of the Greek colonies on the western shore of the Pontux Euxinus is not total. In previous decades, the Pontic Poleis have already repeatedly shown their disloyalty and their desire for a democratic existence, free from the clutches of [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetName].\n\nIt may be worthwhile to dispatch our envoys to these proud city-states and make a case for what we could offer them in their pursuit of liberty. Were we to fan the flames but a little, and offer material and military aid along with a promise of independence, we may well find ourselves with allies in the region, and give the [GetCountry('TRE').GetAdjective] [GetCountry('TRE').GetRulerTitle] something else to focus [GetCountry('TRE').GetRuler.GetHerHis] military attention on."
 me_thrace_3_new_philhellene_policy.201.a:0 "A audacious plan - exactly what we require."
 me_thrace_3_new_philhellene_policy.201.at:0 "Our support will greatly increase the odds of open dissent on the part of the Pontic urban centres."
 me_thrace_3_new_philhellene_policy.201.bt:0 "The Pontic urban centres may still select to rebel without our support, but it is far less probable."
 me_thrace_3_new_philhellene_policy.202.desc_1:0 "In light of their current armed conflict with [GetCountry('TRE').GetName], envoys from [black_sea_revolt_supporter.GetCountry.GetName] have arrived to seek an audience with [ROOT.GetCountry.GetRuler.GetName] and the [ROOT.GetCountry.GetAdjective] elite.\n\nPassionately, they have made a case for the menace the tyrannical [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetName] poses to the integrity of the region, and indeed to our very values, themselves. The [black_sea_revolt_supporter.GetCountry.GetAdjective] envoys claim that they have been given the authority by [black_sea_revolt_supporter.GetCountry.GetRulerTitle] [black_sea_revolt_supporter.GetCountry.GetRuler.GetName] to offer us a large contribution to our conflict chest, in addition to the promise of military support, should we join them in their armed conflict with [GetCountry('TRE').GetName]."
 me_thrace_3_new_philhellene_policy.202.desc_2:0 "The continued armed conflict of our suzerain [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen] with their enemies provides us an opportunity to make another bid for our liberty. With their armies distracted, we have both the element of surprise and a superior military position in the region.\n\nEnvoys have already been sent to our fellow city-states, and with luck we may coordinate our actions to win our liberty, all of us."
 me_thrace_3_new_philhellene_policy.202.at:0 "We will launch our armed conflict of independence soon, along with any other West-Pontic city-states that share our determination to achieve liberty."
 me_thrace_3_new_philhellene_policy.203.desc_1:0 "[black_sea_revolt_leader.GetName] has taken up arms versus [GetCountry('TRE').GetName] and the tyranny of [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen]! While they stand alone among their peers in their resistance to their suzerain, this novel development should provide a welcome diversion for the [GetCountry('TRE').GetAdjective] armies."
 me_thrace_3_new_philhellene_policy.203.desc_2:0 "[black_sea_revolt_leader.GetName] has taken up arms versus [GetCountry('TRE').GetName] and the tyranny of [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen]! Inspired their example, other urban centres have followed suit, and the flames of rebellion are spreading rapidly across the region. This should serve as a major distraction for [GetCountry('TRE').GetAdjective] armies."
 me_thrace_3_new_philhellene_policy.203.desc_3:0 "Not a single of the Pontic Poleis have taken the opportunity to rise up against their suzerain! It appears they would rather sit and watch their hopes of liberty evaporate rather than stand alongside us and fight."
 me_thrace_3_new_philhellene_policy.204.desc_1:0 "[black_sea_revolt_leader.GetName] has risen up against our rule, evidently seeking to take advantage of our preoccupation with our current armed conflict! Luckily, this rebellion has not spread beyond their territories, and with some luck it should be able to be quickly stifled.\n\n"
 me_thrace_3_new_philhellene_policy.204.desc_2:0 "[black_sea_revolt_leader.GetName] has risen up against our rule, and their example has been quickly followed by others in the region! They assuredly mean to seize the opportunity while we are distracted with our current armed conflict.\n\n"
 me_thrace_3_new_philhellene_policy.204.desc_3:0 "Our present armed conflict has left us vulnerable in dealing with potential disloyalty from the West-Pontic urban centres. It could have been easy for one of our enemies to incite a rebellion and drastically alter the strategic situation in the region.\n\nHowever, for whatever reason - whether our enemies did not even attempt it or whether the loyalty of the Poleis has prevailed - it appears we shall not have to worry about their disloyalty at this time."
 me_thrace_3_new_philhellene_policy.204.desc_5:0 "It appears that the meddling of [black_sea_revolt_supporter.GetName] is to censure for this uprising."
