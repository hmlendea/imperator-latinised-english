l_english:
 appoint_dictator_effect_tooltip:1 "Emergency powers are granted to [actor.GetRulerTitle|Y] [target.GetName|Y] until you are next at peace. The [SCOPE.sC('actor').Custom('get_court_type')] will vote in your favour for most actions and a temporary extension will be added to your [SCOPE.sC('actor').GetRulerTitle|Y]'s current term."
 adoption_explanation_tooltip:0 "By accepting [SCOPE.sChar('target').GetName|Y] into our ancient #Y Family#! we are diminishing its #Y Prestige#! and standing among the other Families in our country.\n\n"
 lover_adoption_tooltip:0 "Since [SCOPE.sChar('target'.GetPraenomen] has children outside of wedlock with [SCOPE.sC('actor').GetRuler.GetPraenomen], the cost for Adopting [SCOPE.sChar('target'.GetHerHim] is considerably increased.\n\n"
 adoption_explanation_event_tooltip:0 "By accepting [THIS.GetCharacter.GetName|Y] into our ancient #Y Family#! we are diminishing its #Y Prestige#! and standing among the other Families in our country.\n\n"
 lover_adoption_event_tooltip:1 "Since [THIS.GetCharacter.GetName|Y] has children outside of wedlock with [GetRootScope.GetCharacter.GetName|Y] the Prestige cost for Adopting [THIS.GetCharacter.GetHerHim] is considerably increased.\n\n"
 adoption_legitimacy_tt:0 "[actor.GetName] will also #R forfeit#! Legitimacy @legitimacy!"
 lover_adoption_from_ruler_tooltip:0 "Since [SCOPE.sChar('target').GetName|Y] has children outside of wedlock with [SCOPE.sC('actor').GetRuler.GetName|Y] the Prestige cost for Adopting [SCOPE.sChar('target').GetHerHim] is considerably increased.\n\n"
 desc_was_once_great:0 "This character was once a member of one of the great families of the nation, but as that family fell from grace they forfeited most of both their influence and power. To some extent the memory of what once was is still haunting them all."
 not_giving_up_power:0 "You are unable to return dictatorial powers, as this character has refused to return them."
 not_dictator_any_more:1 "@trigger_no! A novel leader is in power."
 stop_seeking_treatment:0 "Cease Seeking Treatment"
 stop_seeking_treatment_past:0 "Ceased seeking treatment for an ailment."
 stop_seeking_treatment_act:0 "Cease seeking treatment for an ailment."
 stop_seeking_treatment_act_past:0 "Ceased seeking treatment for an ailment."
 triumph_l_tt:1 "[target.GetName] will #Y lose their command#!, acquire #G 20#! Loyalty@loyalty_icon!for #Y 120 months#!, and acquire #G 25#! Popularity @popularity_icon!"
 bribe_actor_tt:0 "[actor.GetRuler.GetName] will pay #R 100#!@gold! of [actor.GetRuler.GetHerHis] personal wealth and acquire #R 1#! Corruption @corruption_icon!"
 bribe_target_tt:0 "[target.GetName] will acquire #G 100#!@gold!, #G 15#! Loyalty@loyalty_icon!for #Y 48 months#!, and #R 5#! Corruption @corruption_icon!"
 arrange_marriage_act:0 "Locate a spouse for $CHAR$"
 arrange_marriage_tt:0 "[target.GetPraenomen] will marry a selected suitor from [actor.GetName]"
 recruit_act:0 "Recruit $CHAR$ to unite with our service instead!"
 smear_character_act_past:0 "$COUNTRY$ succeeded in smearing the character of $CHAR$."
 ca_character_loan_act_past:0 "$COUNTRY$ required money from $CHAR$"
 banish_effect_tt:0 "[SCOPE.sChar('target').GetName] will be banished to a selected country."
 free_hands_cooldown_tooltip:0 "You are unable to revoke #Y Free Hands#! until at least #Y 2#! years have passed."
 tie_hands_tooltip:0 "If this character loses their job, or is removed from office with Free Hands active, it will be removed, and they will forfeit #R 20#! Loyalty."
 ransom_prisoner_tooltip:0 "Open negotiations to ransom #Y [SCOPE.sChar('target').GetName]#! from capture."
 royal_marriage.1.desc:0 "In the interests of future cooperation, it is advisable to decide which of our royal line we might offer in marriage to [SCOPE.sChar('target').GetName] of the royal house of [SCOPE.sChar('target').GetEmployer.GetName]."
 royal_marriage.2.desc:1 "The royal house of [SCOPE.sC('proposer_country').GetName] sends an interesting request. They suggest that a strategic marriage between [SCOPE.sChar('recipient').GetName] and [SCOPE.sChar('target').GetName] might go a long way in the direction of improving our diplomatic relations.\n\nNeedless to say, this comes with some risk; the integrity of our royal line is paramount, yet the opportunities this may bring are not to be discarded so lightly."
 royal_marriage.4.desc:0 "The ungrateful curs in [SCOPE.sC('receiver_country').GetName] have refused our generous offer to be wedded to our royal house.\n\nOur people shall recollect this outrage!"
 royal_marriage.5.desc:1 "The [SCOPE.sC('receiver_country').GetAdjective] house have graciously accepted our offer of royal marriage. [SCOPE.sChar('female_marriage_candidate').GetName] has travelled to [SCOPE.sChar('male_marriage_candidate').GetEmployer.GetName] in order to meet her betrothed, [SCOPE.sChar('male_marriage_candidate').GetName].\n\nMay our two nations prosper as a result of this mutual display of affection."
 female_shall_move_tooltip:1 "The female subject in a marriage will invariably move to her husband's country.\n\nChildren will marry when both parties are over the age of #Y 16#!. Their prospective betrothal will also conclude if either character moves country or pursues a spouse via other means."
 friend_progress_small:0 "Your Ruler will make a #Y Minor#! amount of progress towards befriending [SCOPE.sChar('friend_target').GetName]."
 currently_befriending_tooltip:1 "Previously befriending a character"
 stop_inspire_disloyalty:0 "Cease Inspiring Disloyalty"
 stop_inspire_disloyalty_act:0 "Cease inspiring disloyalty"
 stop_inspire_disloyalty_past:0 "Ceased inspiring disloyalty"
 stop_inspire_disloyalty_act_past:0 "Ceased inspiring disloyalty"
 stop_inspiring_disloyalty_tooltip:0 "You will cease inspiring disloyalty in foreign characters."
 inspire_cooldown_tooltip:0 "You are unable to revoke #Y Inspire Disloyalty#! until at least #Y 2#! years have passed."
 already_inspiring_tooltip:0 "Previously inspiring disloyalty in a foreign character!"
 coup_on_return_tooltip:0 "If you hire #Y [SCOPE.sChar('target').GetName]#! once they have become a mercenary, they are probable to attempt to seize the throne once again."
 stop_inspire_disloyalty_ruler:0 "Conclude Inspiring Foreign Disloyalty"
 desc_exalted_clan_chief:0 "This clan chief is feeling magnanimous after being honoured by us."
 grant_laurels_act:0 "Grant capitulatory honours to $CHAR$"
 grant_laurels_past:0 "Granted capitulatory honours to $CHAR$"
 grant_laurels_act_past:0 "$COUNTRY$ granted capitulatory honours to $CHAR$"
 laurels_already_granted_tt:0 "Have previously capitulated to this character"
 laurels_effect_tt:0 "[target.GetName] will acquire #G 60#! Loyalty@loyalty_icon! for #Y 120 months#!, #G 20#! Prominence @prominence_icon!, and acquire #G 20#! Popularity @popularity_icon!"
 tutor_heir_act_past:0 "Selected a new ambition for the royal progeny"
 tutor_heir_past:0 "Selected a new ambition for the royal progeny"
 tutor_heir_select_title:0 "Select a Candidate to Tutor"
 tutor_child_act:0 "Select a new ambition for $CHAR$"
 tutor_child_past:0 "Selected a new ambition for $CHAR$"
 gladiator_outcome_tooltip:0 "[SCOPE.sC('actor').GetRuler.GetName] will acquire Popularity @popularity_icon! based on the result of the match.\nThe winner of the fight will be #Y Released#! from prison."
 warfare.4.desc:0 "The Mercenary band led by [SCOPE.sChar('target').GetName] has callously refused our offer of superior employment!\n\nIt seems that they received a superior offer from the [SCOPE.sChar('target').GetEmployer.GetAdjective] villains."
 create_mercenary_act:0 "Dispatch $CHAR$ adventuring in foreign lands"
 create_mercenary_past:0 "Dispatched $CHAR$ adventuring in foreign lands"
 create_mercenary_act_past:0 "Dispatched $CHAR$ adventuring in foreign lands"
 auto_influence_toggle_past:0 "Permitted $CHAR$ to automatically influence their own choice of target."
 auto_influence_toggle_act_past:0 "Permitted $CHAR$ to automatically influence their own choice of target."
 hold_games_scheme_ci_tooltip:3 "For the duration of this scheme [SCOPE.sChar('target').GetSheHe] will lose #R 5#! @gold! and gain #Y 0.5#! @popularity_icon! each month and a selected Territory will receive #G +10%#! Local Population Happiness."
 recent_trial_cannot_tt:0 "@trigger_no! You are unable to attempt a trial again until [SCOPE.sChar('target').GetVariableExpiry('recent_trial_cooldown_var')|Y]"
 random_marriage_proposal_2:0 "After careful deliberation, assessment of potential spouses, and a considerable deal of research into various bloodlines and heritages, [SCOPE.sChar('suitor').GetPraenomen] summoned [SCOPE.sChar('suitor').GetHerHis] aides, and issued an offer of marriage to [SCOPE.sChar('love_target').GetPraenomen] of the [SCOPE.sChar('love_target').GetFamilyDisplayAdjective] dynasty."
 random_marriage_proposal_3:0 "While [SCOPE.sChar('suitor').GetPraenomen] has enjoyed life immensely as a [SCOPE.sChar('suitor').GetWomanMan] of leisure, [SCOPE.sChar('suitor').GetSheHe] summoned an envoy this very morning to deliver a proposal of marriage to the [SCOPE.sChar('love_target').Custom('get_beautifulness')] [SCOPE.sChar('love_target').Custom('get_age_adjective')] [SCOPE.sChar('love_target').GetPraenomen], hoping to produce heirs to further legitimise the [SCOPE.sChar('suitor').GetFamilyDisplayAdjective] dynasty."
 hof_disapproves_loyalty_desc:0 "\n\nUnfortunately, the envoy reports, the head of the [SCOPE.sChar('love_target').GetFamilyDisplayAdjective] dynasty, [SCOPE.sChar('negotiator').GetName], is a vocal critic of our rule, and has made it clear that [SCOPE.sChar('negotiator').GetSheHe] will not permit this union under any circumstances.\n\nWe suspect this may just be an ardent negotiating position, although we will have to offer a considerable deal more than we had hoped, if we are to win the heart of the [SCOPE.sChar('love_target').Custom('get_beautifulness')] [SCOPE.sChar('love_target').GetPraenomen]."
 hof_disapproves_age_desc:0 "\n\nWith regret, our envoy brings news that the head of the house [SCOPE.sChar('love_target').GetFamilyDisplayAdjective], [SCOPE.sChar('negotiator').GetName], has stepped in to raise issues with this proposal, citing the considerable gap in age between [SCOPE.sChar('suitor').GetPraenomen] and the [SCOPE.sChar('love_target').Custom('get_age_adjective')], [SCOPE.sChar('love_target').GetPraenomen].\n\nClearly, [SCOPE.sChar('negotiator').GetSheHe] is merely attempting to get more out of us for the dowry... perhaps negotiation is the only method to win love for [SCOPE.sChar('suitor').GetPraenomen]."
 self_disapproves_loyalty_desc:0 "\n\nThe envoy who delivered the proposal, however, reports that he barely made it out alive after [SCOPE.sChar('love_target').GetPraenomen] flew into a considerable rage, hurling a [ROOT.GetCountry.Custom('get_arena_death_implement_glad')] with considerable accuracy, and nearly decapitating him. It seems that [SCOPE.sChar('love_target').GetPraenomen] considers our suggestions with considerable contempt. We may need to sweeten the deal by increasing the size of the dowry."
 self_disapproves_age_desc:0 "\n\nThe envoy reports that the proposal, whilst flattering, evoked a considerable deal of amusement from [SCOPE.sChar('love_target').GetPraenomen] and [SCOPE.sChar('love_target').GetHerHis] companions, who made no effort to conceal their contempt concerning the advanced age of [SCOPE.sChar('suitor').GetPraenomen].\n\nWe may have to consider yielding a sizable dowry if [SCOPE.sChar('suitor').GetPraenomen] is to locate love at such a distant gap of age and experience."
 royal_marriage.6.c:0 "An arduous bargain, but worth every penny."
 royal_marriage.6.d:0 "We shall have to examine elsewhere for love..."
 ostracize_tt:0 "[actor.GetName] forfeits #R 5#! Stability @stability! and [SCOPE.ScriptValue('ostracize_tyranny_svalue')|R0] Tyranny @tyranny!"
 must_have_adjacent_disloyal_state:0 "At least one Province ruled by this governor, and adjacent to our frontier, must have less than #Y 50#! Province Loyalty."
 marriage_internal_scheme_tt:1 "[target.GetName] is not previously trying to arrange a political marriage."
 scheme_seek_a_spouse_tooltip:3 "A suitable spouse for [target.GetName] will be discovered from the extended relations of a selected #Y Family#!. Their #Y Family Head#! may have demands or #R reject#! the request.\n[target.GetName] will forfeit #R -2.5#! @gold! each month until the Scheme ends."
 warfare.12.desc:0 "[SCOPE.sChar('supported_target').GetName], a claimant to the [SCOPE.sChar('supported_target').GetEmployer.GetAdjective] throne whom we have been funneling covert funds to, has sparked a conflict for the throne.\n\nThe beleaguered revolt has dispatched requests for aid to our envoys, hoping that we might further advance their cause."
 warfare.12.a:0 "Dispatch them soldiers."
 warfare.12.c:0 "More assistance? Alas..."
 support_successor_act:0 "Dispatch financial aid to a foreign pretender"
 support_successor_past:0 "Dispatched financial aid to $CHAR$"
 support_successor_act_past:0 "Dispatched financial aid to $CHAR$"
 warfare.14.desc:0 "The grateful [SCOPE.sC('puppet_kingdom').GetAdjective] Kingdom how lies in safe hands under the rule of [SCOPE.sC('puppet_kingdom').GetRuler.GetName].\n\nGrateful for our assistance, and weary of conflict, their envoys dispatch platitudes of gold and riches, hoping that we might take our leave. With their lands in flames, they would be hard-pressed to refuse more aggressive overtures, however..."
 warfare.15.desc:0 "At long last, the [SCOPE.sC('puppet_kingdom').GetAdjective] civil conflict has been won. Despite our diplomatic wrangling, their ungrateful ruler has insisted on the immediate withdrawal of our men from their lands.\n\nTo sweeten the deal, they insist on a share of the riches from the protracted conquest."
 warfare.15.b:0 "Well, it's superior to nothing."
