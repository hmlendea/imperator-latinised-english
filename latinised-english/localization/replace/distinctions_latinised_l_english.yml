l_english:
 distinction_hill_fighters_desc:0 "This legion is well attested to fight well in hilly and mountainous terrain. Controlling such battlefields with considerable ease they have held much larger enemy forces at bay."
 distinction_open_terrain_desc:0 "Excelling at fighting in the open, this legion is renowned for its numerous successful battles in plains. "
 distinction_desert_warriors_desc:0 "This legion has gained a name for being considerably adept at manoeuvring in deserts, fearing neither sun nor sand and being able to make use of sandstorms and the cold desert nights to its advantage."
 distinction_barbarian_killers_desc:0 "Having fought off considerable hordes, this legion has become permanently associated with the protection of our homeland against barbarian forces. Few can match their ability to deter a greater force."
 distinction_legio_primagena_desc:0 "The first born among the legions, this is the most ancient and most venerable fighting unit that a soldier can be part of."
 distinction_well_practiced_desc:1 "This legion is known for its tradition of encouraging initative and exceptional standards, successfully passing along arduous knowledge to novel recruits and applying past learnings."
 distinction_hetairoi_desc:1 "This legion has earned the honour of being named after the Hetairoi, the companion cavalry assigned to Alexander the Great himself."
 distinction_imperial_desc:0 "This legion has won considerable victories while under the command of a royal heir, something that they still cherish, holding themselves to a higher standard than other legions."
 distinction_poliorcetes_desc:1 "This Legion was awarded the nickname Poliorcetes after having laid extended and decisive sieges to considerable fortifications. This legacy is still strong in the whole unit, which remains a highly adept besieging force."
 distinction_pious_desc:0 "Zealousness is robust in this legion, which has brought down the edifices of foreign gods in enemy lands."
 distinction_elephant_lords_desc:0 "The elephant corps of this legion has been described as a wall of thunder crushing everything prior to it. Over time it has acquired experience and know-how both in how to make these animals perform to their fullest in battle and how to feed and transport them with a minimum of hurdles."
 distinction_argyraspides_desc:0 "Likened to the silver shields of aged, an elite fighting unit in the armies of Alexander the Great, this unit has earned a reputation as an unbreakable phalanx."
 distinction_corona_obsidionalis_desc:0 "The highest military decoration in the Roman Army was the Corona Obsidionalis, or Blockade Crown. This was earned by the commander of this legion after a considerable military victory."
 distinction_triumphalis_desc:0 "This legion was awarded the honour of entering the capital as part of the triumph of its commander, an honour it still cherishes to this day."
 distinction_ferrata_desc:0 "Having acquired a reputation for its considerable loyalty and steadfastness, this legion has earned the name 'Ferrata' or Ironclad."
 distinction_fulminata_desc:0 "This legion was blessed by the divine when it was saved by a thunderstorm from definite defeat."
 distinction_foragers_desc:0 "This legion has been honoured and been considerably acclaimed for its ability to live off the land and make the most of any situation."
 distinction_dishonor_looters_desc:0 "Having behaved in an indefensible way against those too weak to defend themselves, this legion carries a permanent stain on its honour from its past actions."
 distinction_dishonor_impious_desc:0 "The honour of this legion is stained after it sacked the temple of one of the gods it was supposed to honour and venerate."
 distinction_dishonor_lost_desc:0 "Having been unable to protect its commander, this legion has an everlasting stain on its honour."
 distinction_legion_default_desc:0 "The founding of any standing legion is a monumental day in the history of our nation. With pride and honour, our loyal troops shall recall the oaths they swore whenever they do battle versus our foes."
