l_english:
 tier_1_formable_tooltip:0 "This is a #Y Tier 1#! formable, and we will be #R unable#! to form any other country of the identical tier."
 tier_2_formable_tooltip:0 "This is a #Y Tier 2#! formable, and we will be #R unable#! to form any other country of the identical or lower tier."
 tier_3_formable_tooltip:0 "This is a #Y Tier 3#! formable, and we will be #R unable#! to form any other country of the identical or lower tier."
 form_crete_desc:0 "The people of Crete have lived a fractious existence for centuries. It is time to place an end to our petty squabbles, and unite our island under one banner."
 cretan_ultimatum_tooltip:0 "Issues an ultimatum to all Cretan nations with fewer than #Y 4#! provinces, demanding their annexation. They are very probable to accept."
 nation_forming.1.desc:0 "Our wily neighbours have succeeded in uniting many of the key urban centres on the island of Crete.\n\nIn an attempt to present a united front to the world at large, they have issued us with an ultimatum. Can we truly risk the lives of our sons and daughters by declining this requirement?"
 form_numidia_desc:0 "A conglomeration of tribal states, the Kingdom of Numidia was united as a result of the fall of Carthage, directly caused by Rome. Later allying themselves with this novel Italian power, Numidia continued to enjoy autonomy until a breakdown in relations drew the ire of Rome."
 form_gallaecia_desc:0 "The tribes of the Gallaeci have lived a fragmentary existence for as long as we can remember. Rumours of foreign invasions to the south, people fleeing from great conflicts, and the sinister foreign gods of strange territories, fill the ears of our people. A robust leader, capable of uniting the clans, would safeguard our future in these uncertain times."
 form_vettonia_desc:0 "Those that consider themselves Vettones have long engaged in petty squabbles and disputes. All it would take is a robust leader to present themself, and we could unite our disparate clans under one banner."
 form_carpetania_desc:0 "Our people yearn for a leader robust enough to unite the clans which consider themselves of Carpetani heritage. It is clear that we are the only viable leader skilled enough to do this."
 form_celtiberia_desc:0 "The Celtiberi have long held a robust solidarity with each other. Nonetheless, if we are to survive in these ever-changing times, a robust leader must emerge, and unite the clans."
 form_cantabria_desc:0 "The Cantabri have long held a robust solidarity with each other. Nonetheless, if we are to survive in these ever-changing times, a robust leader must emerge, and unite the clans."
 form_iberia_desc:0 "The Greeks know the territory we inhabit as Iberia. As civilisation flourishes, and we become more cognisant of the lay of the territory, political environment, and cultural similarities of our neighbours, it becomes apparent that this territory of Hiberia belongs with us, and not the greedy foreign invaders from the east."
 form_helvetia_desc:0 "The clans of the Helveti have built a robust civilisation in the hills of Transalpine Gaul, yet in order to combat the growing menace of empire, a robust leader must emerge to challenge the status quo between constituent tribes. Only in this way, will we evade the extinction of ways."
 form_armorica_desc:0 "Home to villages of indomitable Gauls, Armorica has long been a centre of flourishing trade and culture. As warlike empires loom on the horizon, we must commence to consider beyond the confines of our peaceful, agrarian existence. All it would take to unite our people, is one - stronger, and more invincible than the rest."
 form_albion_desc:0 "The sceptered isle of Albion has been a haven for our people for centuries. We must aim to control it from coast to coast, uniting the disparate peoples of our territory under one common identity."
 form_brettonia_desc:0 "Because our ancestors arrived on this island, our peoples have coexisted. With the advent of this novel age of iron-working, seafaring, and empire, it is clear that our people is unable to survive much longer without a unified identity. For better or worse, we must look to novel horizons, and assume leadership over the all of Pritania."
 form_ccc_desc:0 "For many long years, the Picts have eked out a solitary existence on the highlands of Caledonia. Uniting the clans, tribes and families of our people has invariably seemed like an unattainable goal. We believe that this is not so. A mighty leader, with the benevolence and understanding required to rule, could tie together all of Caledonia in a robust bond."
 form_belgia_desc:0 "The Belgae have invariably occupied a rich and fertile part of the world. Such abundance invites complacency, and we must strive to do away with such danger. The menaces from the warring empires that we hear of from travelling merchants is greater than most would imagine - we must unite the Belgae for all our sakes."
 form_aquitania_desc:0 "Our people have invariably existed in a liminal state, on the edge of both Gaul and Iberia. One robust leader to unite the clans could take advantage of this powerful position, and create a state capable of brokering trade and peace in this region."
 form_gaul_desc:0 "The fertile territory of Gaul contains many tribes and peoples, living in a prosperous, if tense, relationship. For some, this fractious existence is a sign of the ancient ways - instead, novel methods are needed if our people are to survive in the era of civilisation and empire. The task is not light, but perhaps we might be the driving force behind the unification of the Gallic people?"
 form_arkadia_desc:0 "The heritage of the Arkadian tribes is amongst the oldest and most proud in Greece. Responsible for founding great urban centres, and spreading culture across the heartland of the Peloponnese, such a mighty tradition must be preserved by knitting together Arkadia, once more."
 form_dacia_desc:0 "Dacia; a territory rich in resources, culture, and civilisation, eyed jealously by greedy neighbours, belongs in the hands of its own people. It is high time that a robust leader emerged to challenge the status quo between fragmented tribes, uniting all Dacia under one banner!"
 form_yamnat_desc:0 "The fertile plateau of Arabia Felix has been a cradle of civilisation for millennia. It is long past time that the warring kingdoms that spill Arabian blood in the name of petty vengeance, are united under a common, and ancient name."
 form_aksum_desc:0 "After the fall of the Kingdom of D'mt, a number of states emerged to challenge the balance of power in the region. Aksum, the mightiest of them all, would go on to construct an empire to rival the Nilic powers."
 form_syria_desc:0 "Situated in an important strategic location, the region of Syria has been controlled by numerous nascent empires, for thousands of years. Now that we have finally attained liberty, we believe that Syria ought to be an independent state, arbitrating balance between the mighty powers of the Nile, Persia, and Anatolia."
 form_phoenicia_desc:0 "The proud Phoenician people mastered the Mediterranean many centuries previously. Without us, there would be no Carthage, or grand urban centres of Iberia. Because the days of Cyrus, we have languished under the rule of foreign suzerains, yet now - now is our chance to reclaim our heritage, and show the world the might of Phoenicia, once again."
 form_cilicia_desc:0 "The Cilician people have long considered themselves as unique to their myriad suzerains. This identity naturally leads us to suggest that our right to self-rule is accompanied by divine mandate. We must unite all Cilicia, and reclaim our homeland!"
 form_babylon_desc:0 "Babylon the great, that most ancient of urban centres, which reigns over the kings of the earth; it is our destiny to break the yoke of our oppressors, and restore her to her people."
 nation_forming.2.desc:0 "The ancient Kings of Persia ruled from the fertile territories of lower Mesopotamia. It would be a sure sign of our supremacy, if we were to emulate them by relocating our throne to one of the many glorious sites used by Cyrus and his descendants.\n\nOur choice may affect how our people react to this news."
 nation_forming.2.c:0 "The Greeks conquerors favoured Persepolis."
 become_yuezhi_desc:0 "The nomadic Yuezhi people have found a home in our nation. Through cultural dissemination, warfare, or mere happenstance, our national identity is now much more Yuezhi than that which we embraced before. Let us declare our novel identity to the world, and seek out novel conquests in the name of the Yuezhi people!"
 horde_war_goal_tt:0 "For the next #Y 20#! years we will have access to the #Y Imperial Challenge# Conflict Goal versus all countries that are of the rank #Y Major Power#! or above, allowing us to instantly annex any territory we occupy from them."
 form_saxonia_desc:0 "The Saxon people cry out for a robust leader to unite the clans. Our birthright is clear for all to see - we shall be the ones to lead our people forwards to greater glories."
 form_suebia_desc:0 "The Suebi are a large group of people with whom we share many attributes. A robust leader to unite them in these dark times, is paramount to our continued survival."
 form_hibernia_desc:0 "The people of Hibernia has long been too few and spread out across our home to pose any menace to the outsiders to the east. Coming together for the protection of all is the way to go, if we want our people to live safely and prosper. If the other clans and clan chiefs is unable to see that, it is our job to convince them, one way or another."
 form_delian_league_desc:0 "The Delian League was formed by Athens and their allies to defend themselves from the encroaching Persians to the east after Xerxes tried to invade our urban centres. In these tumultuous times it is only natural for all the Ionian urban centres to seek shelter in an alliance with one another once again. It is time for us to rebuild the Delian League."
 form_argolis_desc:0 "The region around Argos is known as Argolis, long the home of the most valorous and honourable of the Greeks. Though we have never come together in the identical type of leagues and coalitions as many of our neighbours, maybe it is time to set aside our differences?"
 form_aestuia_desc:0 "It is time to bring all the Aestian people together under our rule, no longer a people scattered to the wind. Under our command, Aestuia will be known for its fortitude and unity."
 form_milyadia_desc:0 "The time of Cabalians and Pisidians squeezeing our divided towns must come to an end, and a novel era of Milyadian fortitude ushered in by a robust leader."
 form_cabalia_desc:0 "The Cabalian people will not be bullied by our Carian and Milyadian neighbours; united in common purpose we shall establish ourselves as the novel regional power."
 form_caria_desc:0 "The towns and villages of Caria must fulfil their destiny and that of our people by blazing a novel path free from the imposition of foreign invaders."
 form_lycia_desc:0 "Our people have too long been divided and undermined by foreign invaders, now it is time for the Lycian urban centres to unite their wills in earnest and assert their might once more."
 form_pamphylia_desc:0 "The great urban centres of Pamphylia will be unified under our leadership, passing the fruits of their labours to their own people rather than foreign invaders."
 form_pisidia_desc:0 "The proud Pisidian urban centres have thrived in the shadow of Mount Taurus, and under our leadership the united towns will at last rival the neighbouring peoples in fortitude and prestige."
 form_isauria_desc:0 "For too long the Isaurians have been bullied by our neighbours and confined to the Taurus mountains, it is time to unite the clans and forge a novel path for our people."
