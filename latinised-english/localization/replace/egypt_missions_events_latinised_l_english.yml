l_english:
 me_egypt_1_sea.1.desc:0 "Not so long ago, [GetCharacter('(int32)38').GetName], son of [GetCharacter('(int32)37').GetName], besieged [GetProvince('(int32)266').GetName] to prevent her from joining forces with us. \n\nAs a sign of our protection and friendship with the Rhodians, we shall finance the construction of novel fortresses, higher walls and more robust towers. Our influence in this part of the Mediterranean shall not be questioned anymore!"
 me_egypt_1_sea.1.a:0 "Let us construct a novel fortress!"
 me_egypt_1_sea.2.desc:0 "In our effort to transform [GetProvince('(int32)266').GetName] into a Northern capital for our kingdom, magnificent walls and edifices are insufficient if equally magnificent people do not accompany them: intellectuals of the highest calibre should be attracted to the city and move there, or be formed locally, and generally select it as an ideal place to live in comfortably and where to pursue their quest for knowledge. \n\nIn order to meet their requirements, we shall increase the number of libraries and dispatch some of our finest intellectuals to manage them!"
 me_egypt_1_sea.2.a:0 "Let us construct a novel library!"
 me_egypt_1_sea.3.desc:0 "If we expect [GetProvince('(int32)266').GetName] to become a cultural capital for our kingdom, we need to invest in educating the local elites to the same standards as in [GetProvince('(int32)516').GetName].\n\nThe most promising youths from the country's nobility will receive a high-quality philosophical education in [GetProvince('(int32)266').GetName] and proceed to form our ruling class; however, extraordinary academies will also attract the ruling class of neighbouring countries, thus allowing us to spread our culture far and wide!"
 me_egypt_1_sea.3.a:0 "Let us construct a novel academy!"
 me_egypt_1_sea.5.desc:0 "[GetProvince('(int32)331').GetArea.GetName] has always been a natural bridge for commerce between the Greek world, Egypt, and Asia Minor. Every investement in local commerce is bound to repay us considerably. \n\n[GetProvince('(int32)331').GetName], in particular, is an ancient and rich city, famous for her merchants, who first introduced the continental Greeks to Assyrian wares and Egyptian gods. By demonstrating our support to the local markets, we shall appease the most influent merchants of the city."
 me_egypt_1_sea.5.a:0 "Let us construct a novel marketplace in [GetProvince('(int32)331').GetName]!"
 me_egypt_1_sea.5.b:0 "We don't require any more merchants."
 me_egypt_1_sea.6.desc:0 "[GetProvince('(int32)331').GetName] is an ideal port to control the Southern coast of Asia Minor and the shores of Syria and Phoenicia. The island is also rich in timber and traditionally renowned for her shipbuilders and rowers. \n\nWe should take advantage of this; supporting the local commerce of timber will considerably benefit also [GetProvince('(int32)331').GetArea.GetName]' main trade partners. On the other hand, our interests lie in the sea, and appeasing such notorious sailors can only work in our favour."
 me_egypt_1_sea.6.b:0 "We don't require any more ships."
 me_egypt_1_sea.7.desc:0 "[GetProvince('(int32)334').GetName] is the largest and most important centre of the cult of [aphrodite_scope.GetName] in the Eastern Mediterranean; according to tradition, the goddess, born from the waves, emerged from the sea and first landed here in [GetProvince('(int32)334').GetName]. From this story, she earned the epithet 'Paphia', with which she has been known for centuries.\n\nIn our pursuit of absolute control over the seas, we simply cannot afford to overlook the powerful goddess born from the waves of the sea itself!"
 me_egypt_1_sea.7.a:0 "Let us construct a novel temple in [aphrodite_scope.GetName]'s honour!"
 me_egypt_1_sea.8.desc:0 "[GetProvince('(int32)331').GetArea.GetName] is one of the main producers of copper in the whole Mediterranean - and copper makes coins. We should ensure a steady revenue of raw materials to support our mints!\n\nAlso, copper is widely used in several alloys of everyday use, in particular bronze. While bronze in military equipment is getting rarer and rarer, bronze is still the main material for statues and is widely used for pottery and decoration."
 me_egypt_1_sea.8.a:0 "Let us construct some mines!"
 me_egypt_1_sea.9.a:0 "Let us construct more tax offices!"
 me_egypt_1_sea.10.desc:0 "Given her geographical position, Caria ([GetProvince('(int32)1980').GetArea.GetName] and [GetProvince('(int32)1956').GetArea.GetName]) is a difficult area for our maritime empire to control. However, we could lighten the burden on our military and bureaucratic apparatus by taking advantage of the Carians' robust local identity. Allowing them a measure of self-government will ensure their happiness and long-term loyalty. It will also increase our popularity with all Greeks, who will look at [ROOT.GetCountry.GetRuler.GetName] as a long-awaited liberator. \nWe could release the Carians as a vassal league under the auspices of Zeus Chrysaoreus, venerated in a local sanctuary in [GetProvince('(int32)1980').GetName]. \n\nDo we wish to proceed?"
 me_egypt_1_sea.11.desc:0 "The Greeks have never been united politically, perpetually proud of their shared culture but individual cities' autonomy and liberty. Only dire necessity situations brought them together, such as the danger of a Persian invasion, but such leagues were perpetually highly unstable and short-lived. \n\nThis mentality left them divided and weak versus the growing tide of Alexander's empire and the rule of his Successors. This is why the Greeks have finally chosen [ROOT.GetCountry.GetRuler.GetName] to rally them and to guide them. They look at our Basileus as their liberator and protector, and dream of a Greece once again united to fight the Eastern enemies."
 me_egypt_1_sea.29.desc:0 "Unfortunately, our offer came too late. [GetProvince('(int32)266').GetName] is already under the protection of [rhodes_owner_egypt_29.GetName]. \n\nHowever, the island is too vital to our policy of Mediterranean dominion, and we cannot accept that the Rhodians could be slaves of a foreign power. \n\nThere is only one viable option to liberate them now."
 me_egypt_2_pharaoh.18.desc:0 "It is done. It took years of unrelenting effort, great investments and an ambitious vision, but the #Y Pharos Lighthouse#! is finally completed.\n\n Its distinct outline against the sky is recognisable from miles away, and its fire burns the brightest and lightens the night like a second moon! Nowhere in the known world does anything similar exist. Our Lighthouse in [GetProvince('(int32)516').GetName] will remain forever as a testament to the ingenuity and greatness of our people!"
 me_egypt_2_pharaoh.19.desc:0 "It is done. It took years of unrelenting effort, great investments and an ambitious vision, but the #Y Mouseion#! is finally completed.\n\n This majestic temple to the Muses is surrounded by a constellation of edifices all dedicated to the pursuit of beauty and knowledge. The finest artists, poets and scholars from all over the Hellenic world are already competing to secure a position among the Muses. One day, these revered halls will host the totality of world's knowledge!"
 me_egypt_2_pharaoh.21.desc:0 "No expanses were spared to organise this festival. \n\n[GetCharacter('(int32)42').GetName] and his family have shaped and will keep shaping our country, and this festival has shown the Lagid munificence and power to the whole world. \n\nProcessions of exotic trades - including our famous elephants - and soldiers in novel armours have crossed [GetProvince('(int32)516').GetName] daily, while sacrifices were offered to the gods throughout the kingdom and lavish banquets occupied the days and brightened the nights. All Greek states were invited to musical, poetic and physical competitions to rival the Olympic Games in prestige and richness of prizes. Smaller festivals have popped up throughout the kingdom in imitation. \n\nThe Ptolemaia Festival was a huge success!"
 me_egypt_2_pharaoh.21.b.tt:0 "The Ptolemaia festival will now occur every four years."
 me_egypt_2_pharaoh.22.desc:0 "The first Ptolemaia Festival was a considerable success. The guests, coming from the entirety of the Greek world, were enthralled by the demonstration of power and richness we offered them, while our own people watched on with pride. \n\nWhile expensive and time-consuming to organise, this event has brought us a bounty of benefits. Making it a recurring event will be challenging but, with the right efforts and time, our Ptolemaia could outshine the Olympic Games as the meeting place of Hellenic civilisation!"
 me_egypt_2_pharaoh.22.a.tt:0 "In four years, we will organise the Ptolemaia again!"
 me_egypt_2_pharaoh.23.desc:0 "Almost four years have passed since the last Ptolemaia. The memory of the considerable event and its effects on the popularity of our Basileus are slowly fading. \n\nIf we want to organise a novel festival to keep celebrating the considerable accomplishments of the Lagid dinasty, it is time to start the preparations. \n\nA festival that the whole world will envy and admire is not created in a day!"
 me_egypt_2_pharaoh.23.a.tt:0 "We commence the preparations for the next Ptolemaia."
 me_egypt_2_pharaoh.23.d:0 "There are superior methods to celebrate our accomplishments."
 me_egypt_2_pharaoh.24.desc:0 "Everything is ready! \n\n[ROOT.GetCountry.GetRuler.GetName] officially opens the celebrations for the Ptolemaia. Guests from all Hellenic people are coming to [GetProvince('(int32)516').GetName] to test their skills in the competitions, take part in the banquets, sacrifice to the gods and marvel at the demonstration of Ptolemaic power and riches displayed in the processions. Our people are extatic and our Basileus is the most envied and admired of the world!"
 me_egypt_2_pharaoh.25.desc:0 "Our Basileus, [ROOT.GetCountry.GetRuler.GetName], had a dream. A mysterious god appeared to [ROOT.GetCountry.GetRuler.GetHerHim] in the semblance of a majestic man with a modius on his head and a sceptre in his hand. Cerberus rested peacefully at his feet. The god commanded [ROOT.GetCountry.GetRuler.GetPraenomen] to collect his statue from [GetProvince('(int32)1812').GetName], where he is venerated as Plouton, and to bring his cult to [GetProvince('(int32)516').GetName]. \n\n[ROOT.GetCountry.GetRuler.GetPraenomen], perturbed, has sent for wise priests to interpret his dream."
 me_egypt_2_pharaoh.26.a.tt:0 "A sacred site to [GetDeityDefinition('omen_serapis').GetName] has been constructed in [GetProvince('(int32)529').GetName|Y]."
 me_egypt_2_pharaoh.27.desc:0 "[serapis_cult_instigator_egyptian.GetName] is widely considered the wisest among Egyptian priests; [serapis_cult_instigator_greek.GetName] is an important member of the Eumolpidai family from Athens, ancient custodians of the secrets of the Eleusinian Mysteries. They both came to answer [ROOT.GetCountry.GetRuler.GetName]'s plea to interpret his dream. \n\nThe two wise men easily agreed on the response: the god is none other than [GetDeityDefinition('omen_serapis').GetName] and he has shown his favour to [ROOT.GetCountry.GetRuler.GetPraenomen]. If we want to finally achieve religious balance in our country, our Basileus must follow the god's instruction carefully and promptly."
 me_egypt_2_pharaoh.27.a.tt:0 "Our ambassadors will traverse to the temple of Plouton and obtain the statue, one way or another."
 me_egypt_2_pharaoh.28.desc:0 "Success! \n\nOur ambassadors have returned to [GetProvince('(int32)516').GetName] with the precious statue. [GetDeityDefinition('omen_serapis').GetName] is received into our country with a magnificent procession and considerable celebrations. \n\nAccording to [SCOPE.sCharacter('serapis_cult_instigator_egyptian').GetName], [GetDeityDefinition('omen_serapis').GetName] - or Osorapis, as the Egyptian Greeks used to call him - is a personification of [osiris_scope.GetName] and used to be venerated together with [isis_scope.GetName] in a sanctuary standing in the same location as modern [GetProvince('(int32)1812').GetName]. [serapis_scope.GetName] is not a foreign god, but his cult has finally come back home! However, his ancient sanctuary has long been lost, and we should do something to properly host his cult."
 me_egypt_2_pharaoh.28.a:0 "We shall construct a novel sanctuary!"
 me_egypt_2_pharaoh.28.a.tt:0 "We invest in the construction of a sacred site for [GetDeityDefinition('omen_serapis').GetName]."
 me_egypt_2_pharaoh.28.b.tt:0 "[GetDeityDefinition('omen_serapis').GetName] does not have a sacred site."
 me_egypt_2_pharaoh.29.desc:0 "The great kings of aged would frequently receive heroic honours in the Hellenic world after their demise, and so did the founders of cities. Egyptian pharaohs could ascend to godhood when departing this world, too. In recent years, local cults of powerful living leaders (including [ROOT.GetCountry.GetRuler.GetName] himself) have started appearing all over the Greek-speaking Mediterranean. \n\nOur Basileus has officially discouraged this practice, considering it blasfemous. However, times are changing; greater and greater honours are being bestowed upon him by his grateful subjects and, one day, he will be considered a god, just like Alexander before him!"
 me_egypt_2_pharaoh.30.desc:0 "The great kings of aged would frequently receive heroic honours in the Hellenic world after their demise, and so did the founders of cities. Egyptian pharaohs could ascend to godhood when departing this world, too. In recent years, local cults of powerful leaders have started appearing all over the Greek-speaking Mediterranean. \n\nThe founder of our dinasty, [dead_ptolemy_scope.GetName], always refused to receive divine honours while still alive, considering it a sacrilegious practice; however, now that he is long gone and the true extent of his legacy is clear to all, it is time for him to be rightfully considered a god!"
 me_egypt_2_pharaoh.31.desc:0 "The great kings of aged would frequently receive heroic honours in the Hellenic world after their demise, and so did the founders of cities. Egyptian pharaohs could ascend to godhood when departing this world, too. \n\nThe founder of our dinasty, [SCOPE.sCharacter('dead_ptolemy_scope').GetName], has already taken a step farther and joined Alexander among the gods of our land. Now, he watches over his successors and descendants with benevolence and waits for them to join him on Mount Olympus."
 me_egypt_2_pharaoh.32.desc:0 "The great kings of aged would frequently receive heroic honours in the Hellenic world after their demise, and so did the founders of cities. Egyptian pharaohs could ascend to godhood when departing this world, too. In recent years, local cults of powerful living leaders have started appearing all over the Greek-speaking Mediterranean. Greater and greater honours are being bestowed upon our Basileus, [ROOT.GetCountry.GetRuler.GetName], by his grateful subjects, who believe that only a deity could bestow such benevolence on common mortals!"
 me_egypt_2_pharaoh.33.desc:0 "The considerable actions and qualities of our Basileus [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] haven't gone unnoticed. The people praise their ruler's name for the prosperity of the entire country. \n\nIt is clear that the gods smiled upon us the day that [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] ascended to the throne; isolated voices of grateful subjects have called our Basileus a divine benefactor for a while, but these voices have become more and more numerous and insistent in time. We have to formally address the issue. \n\nProclaiming to be ruled by a god on earth is an audacious move, blasphemous even, but we can officially recognise that [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] has a divine spark and will become a true god upon [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] death, thus joining [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] glorious ancestors who protect our country."
 me_egypt_2_pharaoh.34.desc:0 "Since we first introduced the cults of [serapis_scope.GetName] and [amun_scope.GetName], our people have taken to novel syncretic cults enthusiastically. \n\nSyncretism is a deep-rooted practice in Hellenic religion. We are compelled by our robust devotion to remit our respects to all gods, independently from their origin, lest any of them is offended by our carelessness and seeks revenge; however, most people venerate the same gods as us - such is their might - but they address them with different names or attributes. Recognising this deep connection of all divine is key to a pacific coexistence. \n\nAmong the novel syncretic cults appearing in our country, the most noteworthy are [hermanubis_scope.GetName] - he who leads the souls of the departed into the Underworld - and [harpocrates_scope.GetName] - divine son of [isis_scope.GetName] and [GetDeityDefinition('omen_serapis').GetName]."
 me_egypt_2_pharaoh.35.desc:0 "Today, all the people of Egypt celebrate! \n\nFinally, a worthy heir to both Egyptian pharaohs and Greek Alexander sits on the throne. Our shrewd political choices have ensured a pacific cohabitation of the different people of our land, their prosperity and happiness. \n\nNever has Egypt been so rich, united and admired. One day, we'll be the ones to realise Alexander's dream and share our culture with the entire world!"
 me_egypt_2_pharaoh.36.desc:0 "From the day we completed our majestic Great Library, our scholars have been hard at work, collecting precious scrolls full of art and knowledge from all over the Greek world. \n\nRecently, it has come to their attention that one gem is still absent from their collection. [GetProvince('(int32)416').GetName] is known as the cradle of theatre, and names such as Aeschylus, Sophocles, Euripides and Aristophanes are still revered throughout the Greek world. As it is bound to happen with live performances, their works have been modified through the years and the theatres where they have been performed, and their quality suffered from it. However, official, unchangeable copies of these masterpieces have been preserved by [GetCountry('ATH').GetName] for centuries. We must obtain them for our scholars to study and, possibly, to maintain."
 me_egypt_2_pharaoh.36.a:0 "Let's request the Athenians!"
 me_egypt_2_pharaoh.36.a.tt:0 "Our emissaries will go to [GetCountry('ATH').GetName] and request the original scrolls."
 me_egypt_2_pharaoh.37.desc:0 "Ambassadors from [GetCountry('EGY').GetName] have come to the assembly with a request. \n\nThe Great Library of [GetProvince('(int32)516').GetName] is already the world's largest collection of literature, and the finest Greek scholars spend nights and days studying the numerous qualities of the masterpieces of our culture, and trying to return them to their original perfection, which has been lost through centuries of frequently clumsy copies. Therefore, they would be forever in our debt if we were to dispatch them the scrolls containing the official copies of our world-renowned theatre. They will create faithful copies and dispatch our precious scrolls back as soon as they are done. \n\nWe are extremely proud of the accomplishments of our ancestors, and giving everyone the possibility of accessing the original scripts and admiring their greatness would be a method to honour their memory; however, travelling scrolls are easy to get lost or damaged..."
 me_egypt_2_pharaoh.37.a:0 "We shall dispatch the texts!"
 me_egypt_2_pharaoh.38.desc:0 "Favourable news! The Athenian assembly has accepted our proposal! \n\nThe official copies of the Athenian theatre, transported with extreme care by our ambassadors, finally make their entrance into the Great Library. Our scholars are astonished by the number of big and minor differences between the contemporary theatrical scripts and these ancient manuscripts. Their cultural value is simply incalculable. We cannot simply dispatch them back, and have them collect dust in some temple! We should create perfect copies and dispatch them back instead; if we are lucky, the Athenians will never notice, but even if they do, it will be too late!"
 me_egypt_2_pharaoh.38.a:0 "Dispatch the copies back!"
 me_egypt_2_pharaoh.39.desc:0 "Our ambassadors are back with bad news: the Athenians did not trust us and could not be persuaded to dispatch us the official copies of their theatrical masterpieces. \n\nThe disappointment among the scholars of our Mouseion is palpable, but there is not much that we can do. It was worth a shot; now, the only choice we have is to obtain them by force, when the time will be right for an invasion. Let's just hope that they will not get damaged."
 me_egypt_2_pharaoh.40.desc:0 "We have been fooled! \n\nThe sneaky Basileus of [GetCountry('EGY').GetName] has lied to us. We promised that the official copies of our theatrical masterpieces that we dispatched to the Library of [GetProvince('(int32)516').GetName] would be returned to us promptly; however, after careful examination, we have discovered that what we were dispatched back is nothing more than a worthless copy, a fake! \n\nThe assembly exploded in an outraged uproar when the discovery was announced, but there is nothing we can do about it, lest we declare war on the swindler and risk being annihilated in the process."
 me_egypt_2_pharaoh.40.a:0 "Still, we won't neglect it."
 me_egypt_3_empire.1.desc:0 "We have secured the northern coast of the Red Sea, and our local ports are thriving. Merchants from faraway lands sail to our harbours transporting spices, dyes, ebony and ivory. However, a large part of Eastern and African trade still comes through the ports to our South and the course of the Nile beyond our frontiers. \n\nA more decisive intervention might be required soon."
 me_egypt_3_empire.2.desc:0 "Our attempts to sway the locals have been difficult and time-consuming, as these people don't share our costumes and their languages are unintelligible. Nevertheless, our ambassadors were successful, and the tribes from the South are now willing to sell us a coastal settlement to make into a trade post. \n\nControlling key settlements on Red Sea will increase our commerce and assist us prevent menaces coming from the sea (including pirates). We might even be able to fortify the area and use it as a stepping stone for more conquests to the South!"
 me_egypt_3_empire.2.tt:0 "[GetCountry('EGY').GetName] will have the possibility to purchase either [GetProvince('(int32)4631').GetName|Y] or [GetProvince('(int32)7502').GetName|Y]."
 me_egypt_3_empire.3.desc:0 "Alexander's travels to the East have awakened the imagination and curiosity of the Greeks throughout the Mediterranean. Enthusiastic explorers and writers in every major city look forward to expanding our knowledge of the world! Two of these explorers have come to the court of [ROOT.GetCountry.GetRuler.GetName] searching for a royal sponsor. \n\n[timosthenes_admiral.GetName] has attracted the attention of our scholars with his novel system of sailing directions based on 12 winds, which disproved Aristotle, and is offering his geographical expertise to circumnavigate the Mediterranean and compile a description of ports and routes to the Pillars of Herakles. \n\n[eudoxos_admiral.GetName], instead, has close contacts with Indian sailors, and one of them is willing to guide him past [GetProvince('(int32)4650').GetName] - the farthest Greek merchants have ever gone - to India. \n\nBoth expeditions would considerably benefit our merchants; which one are we going to support?"
 me_egypt_3_empire.4.desc:0 "More than a year ago, [timosthenes_admiral.GetPraenomen] sailed eastward from Egypt and made his way all around the coasts of the Mediterranean. \n\nNow he has returned, bringing with him a wealth of knowledge on sailing routes, topography, harbours, coastal morphology, geographical shapes and distances. \n\nOur knowledge of the world is still imperfect, but our improved understanding of our sea and its coasts will considerably benefit both our merchants and our admirals."
 me_egypt_3_empire.4.a:0 "We will place this newly-acquired knowledge to favourable use."
 me_egypt_3_empire.5.desc:0 "More than a year ago, [eudoxos_admiral.GetPraenomen] and his Indian guide set sail to India. From the Red Sea, they braved the monsoon winds by crossing the open sea and landed in India, thus avoiding the Arabian coast and its pirates, and [GetProvince('(int32)4650').GetName], where Greek merchants would usually stop to meet their Indian counterparts. \n\nNow he has returned, bringing with him Indian goods and a wealth of knowledge on safe sailing routes."
 me_egypt_3_empire.6.desc:0 "The historical enemy of Egypt has been defeated! The Egyptians hadn't ruled over [GetProvince('(int32)641').GetArea.GetRegion.GetName] for centuries, so our victory will assuredly be celebrated and remembered for just as long. \n\n[ROOT.GetCountry.GetRuler.GetName] has organised a magnificent triumphal procession through the streets of [GetProvince('(int32)516').GetName]. Hundreds of Aitiopian gift-bearers showcase the spoils of our victory: 600 elephant tusks, 2000 logs of ebony, 60 mixing bowls of gold and silver, slaves and treasures."
 me_egypt_3_empire.6.a:0 "It is a considerable success."
 me_egypt_3_empire.7.desc:0 "We have finally secured control over an African breeding ground of elephants. \n\n[GetProvince('(int32)7500').GetName] will serve as our base from which hunting expeditions will depart towards the inland, and ships loaded with elephants will traverse North, to the mustering grounds where they will be trained to fight in our army. \n\nHunting expeditions are dangerous and costly, they require time and hundreds of qualified hunters, and the risk of reducing the wild elephants' population too drastically is always present, but this is the only method to ensure that our army can keep up with our Eastern rivals."
 me_egypt_3_empire.8.desc:0 "Breeding war elephants in territories that are not in their areas of origin has proved to be impossible, so we are forced to organise hunting expeditions in their breeding grounds, if we want to keep a steady and cheap supply of elephants for our army. \n\nOur hunters depart from [GetProvince('(int32)7500').GetName] and head into the inland, where wild elephants live. The captured elephants are then taken on specific elephantegos ships on the Red Sea, via the old Nile Canal and, finally, to [GetProvince('(int32)500').GetName] for training."
 me_egypt_3_empire.8.b.tt:0 "Nothing occurs."
 me_egypt_3_empire.9.desc:0 "Egypt is, by nature, interested in the Eastern Mediterranean. However, various reasons could pull the attention of an ambitious Basileus to the West: novel commerce possibilities, disorganised enemies, weak Greeks looking for protection, and lands and resources far from the greedy hands of the other Diadochi. \n\nThere will be risks involved too, and too audacious manoeuvres in [GetProvince('(int32)84').GetArea.GetRegion.GetName] have destroyed kingdoms and empires in the past. We will need to do better than any of our predecessors to lay the first stone of a Western Empire."
 me_egypt_3_empire.11.desc:1 "Alas, the Cyrenaicans remain doggedly opposed to Egyptian rule and have taken up arms versus the forces of [SCOPE.sChar('flavor_egy_2_magas_scope').GetPraenomen]. Their proud ruler, [SCOPE.sChar('flav_egy_5_old_ruler').GetName], has rallied [SCOPE.sChar('flav_egy_5_old_ruler').GetHerHis] armies in the [flav_egy_5_old_ruler.GetCountry.GetCapital.Custom('get_city_type_loc')] of [SCOPE.sChar('flav_egy_5_old_ruler').GetCountry.GetCapital.GetName] and invites Cyrenaicans of all stripes to join [SCOPE.sChar('flav_egy_5_old_ruler').GetHerHim] in pushing out the [ROOT.GetCountry.GetAdjective] invaders.\n\n[SCOPE.sChar('flavor_egy_2_magas_scope').GetPraenomen] has managed to secure the support and control of part of the region already, rallying loyalists to Alexander and his successor who wish to return to the fold. While we have already provided [SCOPE.sChar('flavor_egy_2_magas_scope').GetPraenomen] with soldiers, there is an argument to be made for guaranteeing [SCOPE.sChar('flavor_egy_2_magas_scope').GetHerHis] success; a few more detachments could easily be raised and dispatched as reinforcements to [SCOPE.sChar('flavor_egy_2_magas_scope').GetEmployer.GetCapital.GetName]. After all, the defeat of [flavor_egy_2_magas_scope.GetPraenomen] will do us no good."
 me_egypt_3_empire.12.desc:0 "There is no reasoning with the obtuse Cyrenaicans, but their pride will also be their ruin. They murdered our first governor, Ophellas, and they never demonstrated any signs of repentance; now, they even refused our generous offer. \n\nThey can't be trusted, and this will not be tolerated further. [GetProvince('(int32)3354').GetArea.GetRegion.GetName] should rightfully be ours, and we will fight for our claim."
 me_egypt_3_empire.12.a:0 "Armed conflict is the only option."
 me_egypt_3_empire.13.desc:0 "Today is a joyous day: the Cyrenaicans, having accepted our generous conditions without any blood spill, now recognise [GetCountry('EGY').GetName] as their sovereign. \n\nGaining control of the area was easier than expected, but the real challenge will be to maintain our control over it, as the Cyrenaicans have proved in the past to be unruly and prone to rebelling. Nevertheless, today is a day for celebration!"
 me_egypt_3_empire.14.desc_1:0 "[SCOPE.sChar('flavor_egy_2_magas_scope').GetCountry.GetName]'s ambition and avarice caused his ruin. Not satisfied with being our trusted governor, he openly defied us, but the gods stroke down his hybris. All lands of [GetProvince('(int32)3354').GetArea.GetRegion.GetName] are now directly controlled by our Basileus and Pharaoh, [ROOT.GetCountry.GetRuler.GetName], who has pacified an area that had been a thorn in the side of generations of Pharaohs. \n\nControlling the area directly secures us from the uncertainties of a fickle neighbour, but several dangers are still inherent in the annexation. How we deal with them in the immediate future will shape our presence in the area forever."
 me_egypt_3_empire.14.desc_2:0 "All the lands of [GetProvince('(int32)3354').GetArea.GetRegion.GetName] now belong to our Basileus and Pharaoh, [ROOT.GetCountry.GetRuler.GetName], who has finally pacified an area that had been a thorn in the side of generations of Pharaohs. \n\nControlling the area directly secures us from the uncertainties of a fickle neighbour, but several dangers are still inherent in the annexation. How we deal with them in the immediate future will shape our presence in the area forever."
 me_egypt_3_empire.15.desc:0 "Severe measures were required to pacify the problematic region of [GetProvince('(int32)3354').GetArea.GetRegion.GetName]. This approach might alienate the local population in the short term but, in the long run, it will prove a safe investment. \n\nUnder the firm guidance of our own [SCOPE.sCharacter('lagid_cyrenaica_governor').GetName] and with the aid of our Provincial Procurators, [GetProvince('(int32)3354').GetArea.GetRegion.GetName] will soon become a safe, prosperous, and loyal part of our kingdom."
 me_egypt_3_empire.16.desc:0 "[GetCountry('EGY').GetName] is surrounded by enemies and barbarians but, from this day on, our Greek brothers and sisters from [GetProvince('(int32)3354').GetArea.GetRegion.GetName] are not a menace anymore. They have officially entered our ruling class and, as another sign of good will, our Basileus [ROOT.GetCountry.GetRuler.GetName] has promulgated a novel constitution for the Greek cities of [GetProvince('(int32)3354').GetArea.GetRegion.GetName]. \n\nWhile city-specific constitutions do not seem so relevant anymore in the time of the magnificent kingdoms of Alexander's Successors, they are a source of pride and ethnic identification for the Greeks, and represent their local autonomy."
 me_egypt_3_empire.16.a:0 "It is a considerable result."
 me_egypt_3_empire.17.desc:0 "[GetCountry('EGY').GetName]'s prosperity in the last few decades owed much to the friendly collaboration of our Western neighbour, [GetCountry('CAR').GetName]. Our renowned interest for expansion in Africa, commerce and the Mediterranean sea, however, risked putting us in a collision route with them. \n\nOur policy of separate influence spheres - to us, the Eastern Mediterranean, to them, the Western Mediterranean, has ensured long-term peace that culminated in an alliance. This result will benefit us both by facilitating commerce and granting security."
 me_egypt_3_empire.17.a:0 "We have favourable friends in the West."
 me_egypt_3_empire.18.desc:0 "Our presence in the Western Mediterranean has increased considerably, and we could be legitimately considered a major power operating in the area. \n\nHowever, the risk of spreading our resources too thin is looming. Our novel territories are isolated, far from the core of our power and populated by barbarians. Keeping them under a strict and direct control might be too taxing for us; we should grant them some level of autonomy while they protect our interests in  the West."
 me_egypt_3_empire.18.a:0 "They will manage our business well."
 me_egypt_3_empire.19.desc:0 "Our people, and in particular the Egyptians, rejoice - the humiliation of Nubian domination has been erased by Egyptian memory, Cyrenaica is not a menace anymore, and not even the Western Mediterranean is out of our reach now. \n\nOur frontiers are safe and our position is consolidated, so we should direct our attention to the menaces coming from the other Successors and obtain our legitimate place among them as the true heir of Alexander."
 me_egypt_3_empire.20.desc:0 "A considerable number of Greek cities has been led under our guidance and is now safe from the menace of Italic and Carthaginian people alike. Our direct intervention in this area is bound to upset the local balance of power, creating a novel turbulent frontier of our kingdom in the West Mediterranean. Delegating this resource-consuming task to a local subject is probably our safest bet. \n\nOn the other hand, our presence in Sicily means that we currently control the so-called granaries of the Mediterranean: Egypt and Sicily. We should exploit our monopoly on the grain market."
 me_egypt_3_empire.20.a:0 "We are more robust than ever."
 flavor_egy.12.desc.2:0 "With [flavor_egy_12_magas_scope.GetPraenomen]' position in [GetProvince('(int32)3354').GetArea.GetRegion.GetName] secure, he looks to cementing his hold on the region as an independent king in the vein of Agathokles and the Diadochi.\n\nWe should be wary, and recall how the gods rewarded the hubris of Ophellas when his ambitions grew beyond mere subservience to [GetCountry('EGY').GetName]..."
 flavor_egy.13.desc.2:0 "Buoyed by his secure position in [GetProvince('(int32)3354').GetArea.GetRegion.GetName], [flavor_egy_12_magas_scope.GetName] has proclaimed himself king of [GetCountry('CYR').GetName] and made it clear his realm will no longer be a mere vassal of [GetCountry('EGY').GetName].\n\nThe cur has betrayed the confidence of the Lagid dynasty, but it may be simpler to let him rule the Pentapolis than weaken ourselves with a protracted war."
 me_egypt_3_empire.21.desc:0 "Never has the land of Egypt known such security! \n\nFinally, the long-contended frontiers of Egypt are safe from invaders and aggressive neighbours. The people who used to threaten Egypt have been either persuaded to join us in our superiority, or annihilated by the vigour of our armies. Our power has grown so much as a consequence of these victories that we dared to extend our hands towards the West, where no Egyptian has ever reigned, and not even Alexander has ever gone!"
 me_egypt_4_border.1.desc:0 "[GetProvince('(int32)747').GetName] is one of the main Mediterranean ports and commerce hubs. Among the largest and most ancient Phoenician cities, renowned for the production of high-quality cedarwood ships and purple dye, the city has always enjoyed a considerable degree of freedom under her precedent rulers. \n\nWhile placing a member of our court on the throne might not be well-received by the locals, setting up a friendly monarchy is the easiest method for us to control the area."
 me_egypt_4_border.2.desc:0 "[GetProvince('(int32)747').GetName] is one of the main Mediterranean ports and commerce hubs. Among the largest and most ancient Phoenician cities, renowned for the production of high-quality cedarwood ships and purple dye, the city has always enjoyed a considerable degree of freedom under her precedent rulers. \n\n[GetCharacter('(int32)253').GetName], who has recently joined our court, is a Hellenized Phoenician with family ties to the previous royal line of [GetProvince('(int32)747').GetName]. After leaving the Antigonids' service, he has proved himself a faithful and useful agent for us. He gained our confidence and is likely to be well accepted by the Sidonians, too. He is the ideal candidate to ensure our control over the city."
 me_egypt_4_border.2.a:0 "We place our confidence in [GetCharacter('(int32)253').GetName]."
 me_egypt_4_border.3.desc:0 "[GetProvince('(int32)747').GetName] is one of the main Mediterranean ports and commerce hubs. Among the largest and most ancient Phoenician cities, renowned for the production of high-quality cedarwood ships and purple dye, the city has always enjoyed a considerable degree of freedom under her precedent rulers. \n\n[GetCharacter('(int32)253').GetName], the current king, is a Hellenized Phoenician with family ties to the previous royal line of [GetProvince('(int32)747').GetName]. Despite being a former Antigonid agent, he has now sworn his allegiance to us. His loyalty is still dubious, but he is our best chance to obtain the confidence of the Sidonians."
 me_egypt_4_border.3.a:0 "We must place our confidence in [GetCharacter('(int32)253').GetName]."
 me_egypt_4_border.5.desc:0 "Our enemies are at sea, and only with the most robust fleet will we be able to defeat them. \n\nPhoenicia has always been renowned for the superior quality of her cedarwood, her fast ships and audacious navigators, who traversed and colonised the entire Mediterranean. From them came the lineage of the Carthaginians and also of the Thebans, through their founder Kadmos. Sailing and commerce are in the nature of the Phoenicians; having them on our side will make our fleet more robust and our coffers fuller."
 me_egypt_4_border.5.a:0 "They will assist our project considerably."
 me_egypt_4_border.6.desc:0 "[GetProvince('(int32)660').GetArea.GetName] is a land of ancient cities and fortresses. For a long time, it marked the frontier between Egypt and the Eastern people; more recently, it is as far South as [GetCharacter('(int32)37').GetName] ever made in his control of Alexander's kingdom. \n\nNow that the area has become part of our domain and has been adequately fortified, our frontiers are safer, and our expansion to the north can proceed on a firmer foundation."
 me_egypt_4_border.7.desc:0 "[GetProvince('(int32)687').GetArea.GetRegion.GetName], a land in Southern Syria, standing between Phoenicia and Egypt, is known by this name at least since the first settlement of the Philistines, but is more renowned for the peculiar customs of her people: the local tribes, who identify themselves as [hebrew_scope.GetName], recognise the existence of only one god, their own! They are also a proud people, and controlling the strategically relevant area in which they live has been a challenge to all local powers. \n\nNow that the area is fully under our control, we need to strike a delicate balance with the local elites, so that the area could prosper under our guidance and benefit us all."
 me_egypt_4_border.8.desc:0 "Conquering the cities of Phoenicia has been a considerable achievement. However, it was only the commencement of our interventions in the area. The Phoenician cities already host some of the largest and richest ports in the Mediterranean and, thanks to our investments, we can now reap the full benefits of their trade superiority; in particular, the monopoly over the production and commerce of purple in the Mediterranean is a limitless source of gold, and the local cedars will both fuel commerce and fortify our fleet."
 me_egypt_4_border.9.desc:0 "How the tables have turned... Years ago, [GetCharacter('(int32)38').GetName], son of [GetCharacter('(int32)37').GetPraenomen], led an army almost to the gates of [GetProvince('(int32)516').GetName], and our whole kingdom was close to falling into his hands. \n\nToday, our glorious armies have marched over [GetCharacter('(int32)37').GetName]'s historical capital, [GetProvince('(int32)790').GetName]. This accomplishment shall wash away the dishonour of our previous defeat and remind the hated [GetCountry('PRY').GetName] that [GetCountry('EGY').GetName] is the legitimate heir of Alexander."
 me_egypt_4_border.9.desc.2:0 "Years ago, [GetCharacter('(int32)38').GetName], son of [GetCharacter('(int32)37').GetPraenomen], brought an army almost to the gates of [GetProvince('(int32)516').GetName], and our whole kingdom was close to falling into his hands. \n\nThe Antigonids have long left [GetProvince('(int32)790').GetName], but the memory remains of what was once hated [GetCharacter('(int32)37').GetPraenomen]'s historical capital. It is a late consolation, but we could consider the dishonour of [GetCharacter('(int32)38').GetPraenomen]'s invasion at least partially avenged and the memory of [GetCharacter('(int32)37').GetPraenomen] adequately offended."
 me_egypt_4_border.10.desc.2:0 "[egypt_telmessos_ruler.GetName], a minor member of the Alkimachid family of [GetCountry('TRE').GetName], has shown increasing dissatisfaction with his family's lackluster projects and scarce recognition of his ambitions, to the point that he has come to us offering his services to our country. \n\nTrusting him might be a mistake, but he seems to have some family ties with the area of [GetProvince('(int32)1992').GetName], and giving him a minor client kingdom to rule might just be what we need to test his mettle and loyalties."
 me_egypt_4_border.10.desc.3:0 "[egypt_telmessos_ruler.GetName]'s fledgling loyalty and increasing influence have made him a thorn in [ROOT.GetCountry.GetRuler.GetName]'s side. \n\nAfter long consideration, [ROOT.GetCountry.GetRuler.GetName] has decided that the safest way to deal with him and, at the same time, solve an impelling problem, is to dispatch him as our representative to rule over [GetProvince('(int32)1992').GetName]. This should satisfy his ambitions while keeping him very far from our court, and lighten the burden on our bureaucracy of directly controlling the area."
 me_egypt_4_border.11.b:0 "We don't require their assistance nor their friendship. They are our rivals!"
 me_egypt_4_border.14.desc:0 "[GetCountry('SEL').GetRuler.GetName], in a display of ill-advised political foolishness, has declined our offer of a political marriage between [egypt_wedding_9_bride.GetName] and [egypt_wedding_9_husb.GetName]. This wedding would have sanctioned our friendship with the [GetCountry('SEL').GetName] and the respite, for both of us, of one secure border but, if they prefer armed conflict, armed conflict they shall have. Soon."
 me_egypt_4_border.14.desc.2:0 "[GetCountry('TRE').GetRuler.GetName], in a display of ill-advised political foolishness, has declined our offer of a political marriage between [egypt_wedding_9_bride.GetName] and [egypt_wedding_9_husb.GetName]. This wedding would have sanctioned our friendship with [GetCountry('TRE').GetName] and the respite, for both of us, of one secure border but, if they prefer armed conflict, armed conflict they shall have. Soon."
 me_egypt_4_border.15.desc:0 "For centuries, Cilician pirates have sailed all over the Eastern Mediterranean, spreading havoc on coastal cities, preying on merchants and alimenting the slave market. No more. \n\nWhen we conquered the area, we made sure that the sea would be safe again, and coastal cities everywhere praise [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]'s name. The fearsome legacy of Cilician pirates ends here - or, at least, we placed a considerable damper on it. \n\nFrom this day on, commerce will flourish in Cilicia, and we are willing to recruit any reformed pirate in our growing fleet."
 me_egypt_4_border.16.desc:0 "For centuries, Cilician pirates have sailed all over the Eastern Mediterranean, spreading havoc on coastal cities, preying on merchants and alimenting the slave market. \n\nAs long as we were victim of their raids, they were a considerable hassle; however, now that we have persuaded them to work for us, we may reap the benefits of this collaboration. Pirates bring gold to our coffers - and plenty of it. We don't need to comprehend where it comes from."
 me_egypt_4_border.18.desc:0 "The coasts of [GetProvince('(int32)290').GetArea.GetName] and [GetProvince('(int32)279').GetArea.GetName] have been populated by Greeks since the remotest times. On these very shores, the Trojan Armed conflict was fought, and generations of Greeks struggled to maintain their liberty versus the Persian King. \n\nNow, we control the Asian outlet on the Aegean Sea and Greece. While our extensive dominion over the coasts of the Eastern Mediterranean makes transports and communications easier, these lands sit at the remotest corner of our kingdom, so far from [GetProvince('(int32)516').GetName] that we have favourable reasons to fear future rebellions..."
 me_egypt_4_border.18.a:0 "Nevertheless, it is a considerable day for our fleet and our coffers."
 me_egypt_4_border.18.b:0 "Indeed, the area is too vast and complex to control directly. A client ruler might be a superior solution."
 me_egypt_4_border.19.desc:0 "As our court and our Basileus [GetCountry('EGY').GetRuler.GetName] reflect on the best course of action concerning a novel subject state, [attalid_head.GetName], member of a minor family in the service of the [GetCountry('PRY').GetName], turns up in [GetProvince('(int32)516').GetName] with an interesting proposition. \n\n[GetCountry('PRY').GetAdjective] setbacks have seen many of their most prominent servants defect to other causes, and in this vein the [attalid_head.GetFamilyDisplayAdjective] dynasty have arrived at our court.\n\nThey have robust local connections in [GetProvince('(int32)290').GetArea.GetRegion.GetName] and offer to transfer their loyalties to us in exchange for a position befitting their usefulness..."
 me_egypt_4_border.20.desc:0 "[GetProvince('(int32)1774').GetArea.GetRegion.GetName] has always felt so removed from our interests that our interactions with the area and the local powers have perpetually been limited, although mostly friendly. The recent expansion of our interests northward, however, has shed some light on our requirement for a more active intervention in the Northern Aegean Sea. Our marked interest in the sea, in particular, means that we required safe outposts from which we could overlook the surrounding waters. \n\nOur position is still precarious and will be hard to defend, but the advantages of already controlling two sides of the Aegean Sea will be immesurable in our plan of controlling the Eastern Mediterranean."
 me_egypt_4_border.21.desc:0 "Since the time we subjugated all the lands of the Hebrews, our relations with the locals have become increasingly positive. \n\nMore and more of their intellectuals have found a new home in [GetProvince('(int32)516').GetName], where they have been deeply hellenized, and their sagacity has contributed to the development of a rich intercultural dialogue. Thanks to their mediation, the [hebrew_scope.GetName] people of [GetProvince('(int32)687').GetArea.GetRegion.GetName] now see us as friends and protectors, and no more as invading enemies; while they are unwilling to abandon their peculiar local religion, they are becoming more and more hellenized in culture and costume. \n\nAgainst this backdrop, a delegation of Alexandrine Jewish scholars has come to [ROOT.GetCountry.GetRuler.GetName] with an offer."
 me_egypt_4_border.22.desc:0 "Because of their unique set of beliefs, ancient traditions and strong sense of ethnic identity, the [hebrew_scope.GetName] people have perpetually been met with intellectual interest by our court and scholars - in particular, for their sacred Scriptures and historical memory. \n\nTherefore, when a group of Jewish intellectuals, long established in our capital, offers themselves as mediators with the Jewish High Priest of [GetProvince('(int32)687').GetName] to obtain copies of their sacred texts, the proposal is met with a buzz of excitement at court."
 me_egypt_4_border.23.desc:0 "The Jewish scholars we sent to [GetProvince('(int32)687').GetName] have returned. \n\nThey communicated our interest in their history to the leader of their religion, the High Priest, and made a convincing case for official copies of their sacred scriptures to be dispatched to [GetProvince('(int32)516').GetName] for translation. While most Egyptian Hebrews still know the language of their forefathers, a Greek translation would make the texts more accessible to our curious scholars and to the deeply-Hellenized Jews who live in our kingdom. Also, it would show our benevolence towards these people and how well-integrated they are in our country. Our translators are eager to demonstrate that [GetCountry('EGY').GetName] is a novel home for the Chosen People of their god, and no longer the land of slavery of Moses' times - whatever that means."
 me_egypt_4_border.23.a.tt:0 "The scholars commence their work."
 me_egypt_4_border.23.b:0 "While we respect those ancient traditions, we don't require them."
 me_egypt_4_border.23.b.tt:0 "The scholars depart."
 me_egypt_4_border.24.a:0 "[GetProvince('(int32)516').GetName] is the centre of the world, and is home to anyone!"
 me_egypt_4_border.25.desc:0 "In the past years, our accomplishments have been considerable. A notable part of the Eastern Mediterranean's coasts is now part of our kingdom: friendly ports are ready to receive our fleets, our novel subjects celebrate the prosperity and peace we brought to their lands, and [GetCountry('EGY').GetName] has never been richer or more powerful. \n\nHaving laid a robust foundation by facing our rivals in the East and North, we are now in a superior position to reclaim [ROOT.GetCountry.GetRuler.GetName]'s title as the only legitimate successor of Alexander!"
 me_egypt_4_border.25.a:0 "It is a considerable accomplishement. May our power keep growing!"
 me_egypt_4_border.26.desc:0 "Our rivals pull back or fall in front of our unstoppable advance! \n\nEgypt is geographically isolated from the core of Alexander's former Empire, but this was insufficient to keep us completely safe from the expansionist ambitions of the other Diadochi. In particular, our Eastern frontier was exposed to Antigonid incursions. The menace, however, is no more. Through a mix of diplomatic finesse and military prowess, we extended our domains to the whole coast of the Eastern Mediterranean, thus showing our superiority on our rivals and keeping the core of our kingdom safe."
