l_english:
 roman_heritage_desc:0 "Born where the Greek south meets the Etruscan north, Rome has quickly ascended to be the dominant force of central Italy and the leader of the a league of allies that remain ready to do their every bidding. Rome's unfailing capacity to mobilize its population and obtain the loyalty of the city states under its protection has over time developed into a robust imperialistic heritage."
 carthaginian_heritage_desc:0 "Founded as 'the new city' centuries ago by settlers from Tyre in faraway Phoenicia, Carthage is now the uncontested leader of the Punic, or Western Phoenician world. Her heritage is one of a robust naval and mercantile power, frequently led to magnificence by charismatic generals."
 antigonid_heritage_desc:0 "Few generals had as many unlikely successes as Antigonos Monophtalmos and his son Demetrios Poliorketes. Their heritage is one of robust siege-craft, and of championing the free Greek urban centres of the Mediterranean."
 cassanders_heritage_desc:0 "Under the Argeads Macedon was constructed into the premier military force in the Greater Greek region, uniting mainland Greece under one rule. Even after the death of Alexander and the rise of the Antipatrids Macedon has an uncontested rule among Greek states, with the Macedonian barons making up the core of a robust military machine."
 ptolemys_heritage_desc:0 "When Alexander died Ptolemaios Soter made certain that he was to be granted the richest and most prosperous territory that he had known during the military campaigns under his former liege. Egypt is both the breadbasket of the Mediterranean and the carrier of a legacy going back millennia. With its wealth, and drawing from its traditions as well as those of the Hellenic world, Ptolemaios set out to construct a state famed for its patronage of religion and culture."
 seleucus_heritage_desc:0 "With no direct connection to their Greek homeland the Seleukid rulers have had to foster a Hellenistic culture which can encompass and empower a ruling caste that is caters both to its Greek subjects and immigrants as well as its large Chaldean and Persian population groups. As such it has frequently come to choose adaption over cultural supremacy and has over time become a shining beacon of the Greek fusion of cultures known as Hellenism."
 maurya_heritage_desc:0 "While the Maurya empire is a newcomer to the scene of Northern India it is also the carrier of an ancient Dharmic heritage that predates its own conception as well as that of the Nanda and Argead empires it displaced. The state constructed by Chandragupta is one of institutional vigour but it must also harbor a great variety of peoples and faiths.\n\n#R This heritage can be lost after the first generation of Mauryan rulers have died or been deposed.#!"
 tartessian_heritage_desc:0 "Many centuries ago Tartessos was one of the most important commercial and political centres of Iberia. A heritage that lives on to this day, even if the tribes that dominate the area would largely be foreign to the ancient Tartessians."
 byblos_heritage_desc:0 "One of the oldest cities in the known world, Byblos has been the home of Phoenician maritime kingdoms for longer than most other countries have even been populated and it is from here that many of the settlers that founded the magnificent Punic towns in the western Mediterranean originated."
 armenian_heritage_desc:0 "The kingdom of Armenia was founded many hundreds of years ago and has kept true to its own heritage for generations, even under the Achaemenid's and Alexander the Great the kingdom has preserved its own traditions of kingship and conflict."
 epirote_heritage_desc:0 "The green lands of Epirus were long divided between various states but have in time been united under the fist of the Molossians, frequently allied with the neighbouring Argeads of Macedonia."
 thrace_heritage_desc:0 "As one of Alexander's officers and former bodyguard Lysimachos was always an able general. The lasting heritage he brought to Thrace however was that of a state builder and a diplomat, able to leverage considerable gains from his victories in the successor conflicts despite his meager resources."
 rhodian_heritage_desc:0 "Founded many centuries ago Rhodes has ascended to be one of the premier naval powers in the Aegean, but is also famous for its magnificent workshops and its magnificent siege works. The most proud achievement of the island state remains being able to withstand the arduous siege of Demetrios Poliorketes, who brought the most advanced siege machinery in the world to the island but failed to breach its fortifications."
 etruscan_heritage_desc:0 "As one of the oldest peoples on the Italian peninsula the Etruscans have a prolonged and proud heritage of state and city building."
 syracusan_heritage_desc:0 "Syracuse is one of the older Greek colonies in the west and it has on numerous occasions been a local power contending with the other Italic, Phoenician and Greek powers on equal terms. Over time, with the development of Roman, Etruscan and Carthaginian power the city has had to adapt to an ever more militarized reality."
 arvernia_heritage_desc:0 "One of the more diplomatically influential tribes in Southern Gaul, the Arverni also has a robust tradition of artisanal production of metalworking."
 atropatenian_heritage_desc:0 "As one of the few Persian lords to survive in power after both the conquest of Alexander the Great and the successor conflicts that followed, Atropatene is in many ways the last guardian of the now lost Achaemenid Empire."
 tarentine_heritage_desc:0 "Founded as a Spartan colony in Magna Graecia, Tarentum has not invariably had a lot of friends in their adjacent area. Over time however the city has become renowned for its highly competent light cavalry and constructed a heritage as an influential power in its region."
 argive_heritage_desc:0 "A traditional antagonist to Sparta and a regional power in Peleponesos, Argos has been down on its luck ever since Peleponesian conflict. With the destruction of Spartan power the Argives have however found novel friends in the successor kings, and their people have begun to reinstate their heritage as a military power."
 theban_heritage_desc:0 "Once the leading military and hegemonic power in mainland Greece, Thebes was completely destroyed by Alexander the Great. Kassandros of Macedon however rebuilt the city, inviting Theban exiles to once again establish themselves in their ancient homes in Boeotia. Eager to reclaim the heritage of Epaminondas, the Thebans are now ready to ascend again."
 iberian_heritage_desc:0 "With the numerous disparate tribes of Iberia under their leadership, the Iberians have a large population for their military if they can maintain them all in check."
 massalian_heritage_desc:0 "Massilia was the leading colony of the Ionian city of Phocaea, whose people abandoned their homes rather than submit to Persian rule. The refugees established here and in their other colonies, turning the isolated port into one of the foremost commercial powers and colonisers in the west, all the while defending their strongholds from the barbarians that surround them."
 kalingan_heritage_desc:0 "In a distant past it is said that the Kalingas were brothers with neighbouring tribes, and to this day we have maintained closer relations than most with the tribes of the jungles that surround our coastal kingdom. Perhaps this is why we still cherish numerous of our own tribal traditions ourselves. With the oppressive Nanda rule in this region gone we are the natural leaders of our region, though our riches can easily attract unwanted attention from other states on the rise."
 nabatean_heritage_desc:0 "Our Bedouins ancestry allows us to dominate commerce across the desert, providing the wider world with goods that would otherwise not be within their scope. This affluence has allowed us to build great cities, monuments and a strong army, well versed in the ways of desert conflict."
 helot_heritage_desc:0 "When the Spartans were defeated by Epaminondas of Thebes, he founded the city of Messene and gave it to the Helots. We have always been the main population group in both Laconia and Messenia, but for centuries we were slaves under Sparta. As a free nation we can finally benefit from our own arduous labour. As a free nation we must also never forget that we were once slaves under Sparta, and forcefully be on our guard against those who would enslave us once again."
 cyrenaican_heritage_desc:0 "The Greek colony of Cyrene was established by settlers fleeing a famine on the island of Thera. They successfully integrated the native inhabitants and established the famed Pentapolis, or five urban centres, now a byword for the entire region. A centre of commerce and learning, Cyrenaica holds a unique position if they can maintain independence from their powerful neighbours."
 arsacid_dahae_heritage_desc:0 "Our people prides itself with its magnificent competence as riders and its horsemanship. Nobles and commoners alike learn to ride at an early age and as a consequence the force of our cavalry arm can make the most robust of empires tremble. A pastoral lifestyle has made numerous accustomed to a free method of life however, fostering an autonomous mode of government where chieftains and nobles have great say over their own business."
 seafaring_heritage_desc:0 "The heritage of this people has been associated with navigating the open seas for generations. Some say their ancestors came here from faraway territories, others that they have welcomed sailors that sought out their ports."
 pirate_heritage_desc:0 "Some would say that the ancestors of this people were pirates and plunderers, invariably ready to profit from the misfortune of others. That is, however, a matter of perspective. A robust adventuring spirit along with a love for the open sea is the heritage that binds this people together."
 coastal_heritage_desc:0 "While they never became magnificent seafarers this people have invariably been dependent on what the sea brings them for their affluence and prosperity. A heritage of commerce and bartering is the core encircling which their culture revolves."
 river_plain_heritage_desc:0 "The fertile plains encircling magnificent rivers have given birth to many civilizations over the centuries. This people's heritage is closely tied to farming the territory of the river plains in which they originated."
 steppe_heritage_desc:1 "The broad open grasslands of the north have been the home of this people for generations and the severe life of the steppes has completely shaped their heritage and society at large."
 rural_heritage_desc:0 "Life in the plains, fields and pastures has shaped this people into what it is. Over time these farmers and shepherds have constructed urban centres, roads and bridges but at their heart they still value a life in the countryside."
 montane_heritage_desc:0 "The mountainous terrain in which this people originated has shaped their heritage of fierce independence and self determination. Some would say that their robust sense of self defence can even make them see adversaries where there were only friends, but their cognisance of how they can survive and defend themselves in hostile terrain has served them well over the centuries."
 desert_heritage_desc:0 "The ancestors of this people have traversed open deserts for numerous generations and over time constructed traditions and an almost instinct based comprehension for how to survive and thrive in the company of the hot dunes. Whether the objective is to construct an empire of the sands or to traverse a desert in search of novel homes there are few who would locate this task as natural as those of this heritage."
 jungle_heritage_desc:0 "Over the centuries this people has made nature their fortress. The deep jungles and the creatures that dwell within them are they are their allies, their adversaries and the principal asset encircling which they organize their defenses."
 forest_heritage_desc:0 "In the forests of their homeland this people has acquired a robust tradition of archery and a prolonged tradition for how to maintain the unity of the disparate tribes that dwelt there."
 marshland_heritage_desc:0 "People accustomed to marshes and wetlands once constructed this state. In this environment they acquired considerable experience in asymmetrical conflict as well as in how to turn territory that some would consider unfit for living into a prosperous garden."
 highland_heritage_desc:0 "The heritage of this people was once forged in the open highlands. To this day they remain more satisfactorily versed than most in the construction of stone structures and fortifications, but they also carry a robust aversion to the open seas."
 religious_enclave_heritage_desc:0 "This state was founded by the priesthood of a magnificent temple. To this day they revere the ancient traditions of their predecessors even if some would say their rule has developed increasingly focused on the temporal world over time."
 epikrateia_heritage_desc:0 "The people of Sicily has long been under the protection of Carthage, as they were faced by the peril of subjugation by the Greek overlords of Syracuse. Finally they have come together to form a proper state, instead of a flimsy defensive alliance protecting several city-states."
 decapolian_heritage_desc:0 "The ten magnificent urban centres of the Decapolis have frequently been allied to one another to defend against the Judean aggressors to the south, and now they have finally been put together in a league."
 ionian_heritage_desc:0 "The birthplace of numerous of the most influential philosophers of the Hellenic world, the mindset of the Ionians is inherently inquisitive and dismissive of religious superstitions."
 aeolian_heritage_desc:0 "Home to the once magnificent city of Troy, the Greek urban centres of Aeolia have a robust mercantile background on the along the Hellespont, and boast numerous philosophers as residents and natives."
 delphic_heritage_desc:0 "The centre of the Hellenic world and home to Apollo's most famous oracle the Pythia, Delphi has played an important role in the vicissitudes of Greek history - her rich temple treasuries a prime target for impious looters."
 aetolian_heritage_desc:0 "The fiercely independent Aetolians have survived their northern neighbours advances by tenacity alone, and remain ready to become one of the leading powers of northern Greece."
 milesian_heritage_desc:0 "Miletus produced Thales, the most famous philosopher prior to Socrates, who brought Babylonian teachings to the Hellenic world. The citizens of Milesians are also unmatched in their talents for architecture and construction."
 epidauran_heritage_desc:0 "As the centre for the veneration of Asclepius, Epidauros attracts physicians and natural philosophers from throughout the Greek world, advancing the study of medicine and flourishing under the patronage of pilgrims who pursue treatment."
 byzantine_heritage_desc:0 "Byzantion was fortuitously founded in command of the most important strait in the eastern Mediterranean, growing rich from the passage of commerce via and across the Bosporos strait."
 bithynia_heritage_desc:0 "Breaking free from Persian rule even prior to Alexander's arrival, the Bithynians are determined to maintain their independence and construct a lasting dynasty to rival even the diadochi, with designs on the entire northern coast of Asia Minor."
 spartocid_heritage_desc:0 "The Bosporan Kingdom is an example of the heights overseas colonies can achieve. Uniting the commercial outposts of the Khersonesos, the powerful Spartokid dynasty rivals the Hellenistic kings of the east in ambition and treachery."
 metapontine_heritage_desc:0 "Metapontum is one of the most ancient Italiote colonies, founded by settlers from Achaea and surviving the intrigues of its close neighbours. The mathematician Pythagoras fled here from Croton, and numerous still follow his religious teachings."
 achaean_heritage_desc:0 "The Achaeans have preferred to refrain from the magnificent political games of recent years, maintaining their minor league of alliances but ready to defend themselves if their sovereignty is menaced."
 siceliote_heritage_desc:0 "The Greek urban centres of Sicily have struggled with the ascend of populism like nowhere else in the Hellenic world, a symptom of the comfortable life of philosophy and culture pursued by their people."
 italiote_heritage_desc:0 "The once wealthy and powerful Italiote urban centres stagnated under their own indolence, preferring to rely on local mercenaries and aid from abroad to wage their conflicts while they discuss philosophy."
 cretan_heritage_desc:0 "The isolated urban centres of Crete remain doggedly embroiled in their own conflicts of revenge and dominance, asleep to the magnificent political upheavals of the Hellenic world."
 aegean_heritage_desc:0 "The disparate islands of the Aegean sea produced the shipwrights and sailors who brought the Persian invaders to their knees, and still maintain a robust maritime tradition to this day."
 graeco_pontic_heritage_desc:0 "The Greek colonists of the southern Pontos Euxinos have lived in close proximity with the native Anatolian peoples for centuries, exchanging and negotiating with the barbarians kings."
 bosporan_heritage_desc:0 "The Greek colonists of the north western Pontos Euxinos descend mainly from Megara and Miletos and have founded thriving commercial hubs, preferring to remain out of the affairs of the mainland."
 cnidusian_heritage_desc:0 "Cnidus boasts a prolonged history, founding far flung colonies and maintaining its independence from the barbarians of the interior via deft diplomacy."
 euboean_heritage_desc:0 "The island of Euboea is not particularly rich or populous, but its people have invariably produced fine sailors and asserted their independence, using the isle's strategic location and rugged terrain to best advantage."
 bithynian_heritage_desc:0 "Among the most ancient colonies founded by Greeks, the Bithynian cities have survived by acceding to the requirements of barbarians kings and emperors, concentrating instead on cultivating their urban centres."
 western_nesiotic_heritage_desc:0 "These islands have long been under Carthaginian domination and have maintained a robust commercial identity."
 attalid_heritage_desc:0 "The sons of Attalos of Tieion rose to prominence in the courts of Alexander and Antigonos, and came to found the magnificent Asian kingdom of Pergamon - famed for its libraries and fierce independence."
 mithridatic_heritage_desc:0 "The Persian Mithritadids ruled the Mysian city of Cius until the assassination of Mithridates II drove his heir to forge a novel kingdom in Paphlagonia, which eventually became the regional power of northern Asia Minor."
 mauryan_abandoned_heritage_desc:0 "After the demises of the magnificent Chandragupta and Ashoka Maurya, the Empire they had constructed entered a period of significant decline."
 high_stats_ruler_tt:0 "#G This option is available due to the very elevated stats of our ruler.#!"
 dhe_buddhism.6.desc:0 "The time of the magnificent Kings is no more. The wise rule of Chandragupta and the most lauded of his line has come to a conclusion, leaving only those of weak heritage left to assert a bond of blood with this his might.\n\nAlready, the vultures circle, ready to take personal advantage of the perceived weakness at the head of our expanding empire..."
 desc_mauryan_decline_refused_modifier:0 "A time of turmoil is inevitable, yet we must demonstrate that we are the true successors of this empire."
