l_english:
 senate_objectives.1.desc:0 "The [sen_obj_cha_law_oli_party.GetName] have come to dominate the [ROOT.GetCountry.GetAdjective] [SCOPE.Custom('get_court_type')] for the moment, and now boldly demand that a statute benefiting their supporters be authorised. Only the veto of our [ROOT.GetCountry.GetRulerTitle] could confound their legislative efforts."
 senate_objectives.3.desc:0 "The [SCOPE.Custom('get_court_type')] of [ROOT.GetCountry.GetName] is for once stacked with members and allies of the [sen_obj_cha_law_tra_party.GetName], who are using this rare opportunity to enshrine statutes protecting their interests. They are sure to succeed, unless our [ROOT.GetCountry.GetRulerTitle] uses their power of veto."
 senate_objectives.4.desc:0 "The warmongers of the [SCOPE.Custom('get_court_type')], draped in the colours of the [sen_obj_dec_war_party.GetName], have found themselves in majority government and are rabid to bring [ROOT.GetCountry.GetName] into conflict with [sen_obj_dec_war_target.GetName]. Unless our [ROOT.GetCountry.GetRulerTitle] vetoes the motion, armed conflict is sure to ensue directly."
 senate_objectives.5.desc:1 "The fatted [sen_obj_gra_hol_party.GetName] dominate the [ROOT.GetCountry.GetAdjective] [SCOPE.Custom('get_court_type')], and now move to bring a motion that will see public territories granted to the most notable members of the nobility - as if the benches did not already creak under the weight of their avarice. Only our [ROOT.GetCountry.GetRulerTitle] has the power to block the bill, by invoking [ROOT.GetCountry.GetRuler.GetHerHis] power of veto."
 senate_objectives.5.b:0 "These territories belong to the people!"
 senate_objectives.6.t:0 "Redistribution of Affluence"
 senate_objectives.6.desc:0 "With the benches of the [SCOPE.Custom('get_court_type')] overflowing with populists it was only a matter of time before the [sen_obj_rev_hol_party.GetName] tried to strip the [ROOT.GetCountry.GetAdjective] privileged of their 'illegitimate' affluence. The mob will have no trouble passing this bill, that is unless our [ROOT.GetCountry.GetRulerTitle] decides to veto it..."
 senate_objectives.7.desc:0 "Ever eager to tighten their grip on the [ROOT.GetCountry.GetAdjective] vessel of state, the [sen_obj_len_ter_gen_party.GetName] have brought a bill to the [SCOPE.Custom('get_court_type')] which will extend the term of the sitting [ROOT.GetCountry.GetRulerTitle], thereby putting hands in the power of one [ROOT.GetCountry.GetWomanMan] for longer. Their majority is sure to pass the motion, unless the sitting [ROOT.GetCountry.GetRulerTitle] has any objections."
 senate_objectives.9.t:0 "Honouring the Gods"
 senate_objectives.9.desc:0 "The pious [sen_obj_bui_tem_gen_party.GetName] have decided to use their numerical superiority in the [SCOPE.Custom('get_court_type')] to ensure the commission of a novel temple complex in [sen_obj_bui_tem_gen_target.GetName], pleasing the gods with statues and their egos with inscriptions. Such spending, whether frivolous or sanctified, could only be countered by invoking the veto of our humble [ROOT.GetCountry.GetRulerTitle]..."
 senate_objectives.10.desc:0 "The [sen_obj_imp_hea_gen_party.GetName] have shabbily, some might say, decided to use their working majority in the [SCOPE.Custom('get_court_type')] to bring a bill versus a particular politician. [sen_obj_imp_hea_gen_party.GetName] is accused of personifying the corruption and elitism the populists seek to eradicate from the [ROOT.GetCountry.GetAdjective] government, and demand that [sen_obj_imp_hea_gen_target.GetSheHe] be brought to trial immediately. The fate of [sen_obj_imp_hea_gen_target.GetPraenomen] is now in the hands of our [ROOT.GetCountry.GetRulerTitle] and [ROOT.GetCountry.GetRuler.GetHerHis] veto..."
 senate_objectives.12.t:0 "Aims of [party_obj_complete_scope.GetName] Realised"
 senate_objectives.14.desc:0 "The [sen_obj_inv_gen_party.GetName] have used their time in control of the [ROOT.GetCountry.GetAdjective] [SCOPE.Custom('get_court_type')] to demand investment in part of our country, specifically the [sen_obj_inv_gen_target.GetState.GetName]. Such investment would be a boon to its people as well as the territory owners, though it would limit our ability to pursue other goals in the near future. The matter rests with our [ROOT.GetCountry.GetRulerTitle], who has the final say..."
 senate_objectives.15.desc:0 "The [SCOPE.Custom('get_court_type')] is dominated by the [sen_obj_acq_sub_party.GetName] and it is no secret they wish to expand our influence over the neighbouring state of [sen_obj_acq_sub_target.GetName]. Using their influence, they have formally moved that we demand [sen_obj_acq_sub_target.GetAdjective] tribute under menace of war, else our country is looked on as weak. Only our [ROOT.GetCountry.GetRulerTitle] can stay the scribes from penning the requirements..."
 senate_objectives.15.tt:0 "#Y [sen_obj_acq_sub_target.GetName]#! will receive a demand to become our Tributary under menace of war."
 senate_objectives.16.desc:0 "The [sen_obj_app_mem_gen_party.GetName] are known for looking after themselves and their friends, so it came as no surprise when the council of appointments in the [SCOPE.Custom('get_court_type')] place forward one of their number for a prominent position in government. Clearly [appointment_target.GetPraenomen] feels entitled to this honour by the statute of nepotism, and only our [ROOT.GetCountry.GetRulerTitle] could place [appointment_target.GetHerHim] right..."
 senate_objectives.17.desc:0 "We have received a formal demand for tribute from the republican assembly of [sen_obj_acq_sub_party.GetCountry.GetName]. Their stern messenger makes it clear that our refusal will leave his nation no choice but to bring armed conflict on [ROOT.GetCountry.GetName]..."
 senate_objectives.17.a:0 "We must purchase our liberty..."
 senate_objectives.18.desc_1:0 "They wisely accepted our generous requirements and will commence payments of tribute in exchange for our protection."
 senate_objectives.18.desc_2:0 "They foolishly rejected our generous requirements and have opted to fight us instead."
 senate_objectives.20.b:0 "...but our men require not perish to prove it."
 senate_objectives.21.desc:0 "The [sen_obj_pro_cit_party.GetName] are tired of seeing the people of [sen_obj_pro_cit_target.GetState.GetShortName] living without the necessities and luxuries that urban dwelling brings, and are using their majority in the [SCOPE.Custom('get_court_type')] to ensure a proper centre is constructed in the province, around the already populous settlement of [city_target.GetName]. They are sure to secure the funds unless [ROOT.GetCountry.GetRulerTitle] overrules their votes..."
 senate_objectives.21.a:0 "[sen_obj_pro_cit_target.GetState.GetShortName] requirements a city."
