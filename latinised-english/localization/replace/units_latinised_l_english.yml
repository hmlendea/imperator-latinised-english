 objective_reserve:0 "Maintain in Reserve"
 objective_reserve_desc:0 "Units stay behind and unless superior evade the enemy."
 objective_defend_borders:0 "Defend Frontiers"
 objective_fight_rebels_desc:0 "This can be useful during Great Conquest Armed conflicts and Civil Wars."
 objective_blockade_desc:0 "Blockade hostile controlled coasts, dividing as necessary."
 warelephant:0 "Conflict Elephants"
 liburnian_desc:0 "These light uncovered vessels with two rows of rowers, were considerably faster and more manoeuvrable than Trieres or even larger vessels. Small and nimble this vessel type is popular for exchange as well as among numerous Pirates. While few vessels would have anything to fear in one-on-one confrontations their manoeuvrability make this vessel potentially dangerous if present in large numbers."
 trireme_desc:1 "For a long time Triremes were the most popular type of warship in the Mediterranean, with the Athenian empire especially coming to perfect their construction and use. Triremes remain a light vessel with manoeuvrability, making them adept at ramming. Trirmes were frequently Cataphract, covered, to protect the people on board."
 tetrere_desc:0 "First employed by the Carthaginians the Tetreres, or fours, are heavier, somewhat slower, vessels than the Triremes and invariably Cataphract. Thanks to their heavier composition Tetreres can carry much larger rams and are used in the front of the battle and regularly participate in prow-to-prow attacks that would severely injure lighter vessels."
 hexere_desc:0 "Hexeres or galleys with six rowers per side, are even larger than the tetreres and trieres. This increased size lessens their manoeuvrability but permits them to carry an even larger ram, making the vessel even more suited for full frontal ramming of other vessels."
 octere_desc:0 "First employed by Alexander the Great, Octerees, or vessels with eight rowers per side, carried larger rams than any class prior to them, they were also purposebuilt to be able to assist in siege warfare, both by supporting an attack on a fortified port with their ram and by acting as a landing vessel and mobile platform for siege artilery."
 mega_galley_desc:0 "Vessels with ten rowers or more per side were supposedly first used by Alexander the Great but became even more commonplace after the Antigonid navies used them in the siege of Tyre and beyond. As the successor states grew in power they would experiment with ever increasing sizes of Elevens, Thirtheens, Sixteens and more. Such a vessel will invariably have an extremely limited manoeuvrability in a pitched naval battle. For siege warfare however these 'Mega Polyremes' are ideal as they are able to rupture open seaside walls and then act as platforms for artillery while also permitting great number of troops to land."
 light_infantry_desc:0 "Lightly armed and armoured"
 camels_desc:0 "Camel riders frequently fight with spear and bow, and are adept at manoeuvring in harsh environments."
 heavy_infantry_desc:0 "With good armour and weapons these troops formed the backbone of the Mediterranean world's armies. Either forming a base around other units manoeuvred or as the main assault option"
 archers_desc:0 "Armed with bow and light armour these units were not very effective on their own. However when deployed in support of heavy infantry they could add extra punch to an infantry assault."
 engineer_cohort_desc:0 "Engineers are specialised regiments for construction in the field. They speed up sieges, construct roads more cheaply and in sufficient numbers they permit armies to bypass the penalties for crossing rivers, landing from vessels or crossing straits."
 NO_MERGE_LEGION_LOCKED:0 "Unable to merge [Unit.GetName|Y] AND [TargetUnit.GetName|Y]. A [unit|E] is unable to leave its [legion|E]."
