 FAMILY_PRESTIGE_DESC:1 "Prestige is a measure of how involved a Family has been with the running of the state for the duration of its history. The higher a Family's prestige is compared to the other Families in the same country, the higher #Y Power Base#! the #Y Head of Family#! can command.\nCharacters from prestigious families are also more likely to become rulers in Republics."
 ADD_OBJECTIVE_EFFECT:0 "$CHAR$ obtains the ambition #Y $OBJECTIVE$#! \n"
 obj_become_pontifix_desc:0 "It is a rather shocking state of affairs that a candidate of the quality of $CHARACTERNAME$ is not a pontifex. $PRONOUN$ hopes this will be solved in a moment."
 obj_become_plebeian_aedile_desc:0 "$CHARACTERNAME$ feels that $OBJECT$ political career is a bit in the doldrums. So $PRONOUN$ thinks that the Plebeian Aedileship would be the perfect method to obtain the voter's attention"
 obj_become_tribune_of_the_treasury_desc:0 "$CHARACTERNAME$ feels that $PRONOUN$ possesses a natural aptitude for managing money. Being appointed Tribune of the Treasury would provide $OBJECT$ a chance to prove this to the electors. "
 obj_become_title_physician_desc:0 "Ever since $PRONOUN$ saw that bearded sacred man lay hands on people and cure them"
 obj_become_title_bodyguard_desc:0 "$CHARACTERNAME$ desperately seeks the honour of being the chief's personal bodyguard"
 obj_exile_rival_desc:0 "$CHARACTERNAME$ is pure malevolence. For the benefit of the state"
 encourage_piracy_desc:0 "To ensure our merchants maximise our commerce opportunities we must trade with other countries vessels even prior to reaching our shores"
 debt_slavery_desc:0 "Poor people who can't pay their debt are just a burden to society and also undermine the entire principal of a loan. The answer is to sell these people into slavery. Not only will this meet the cost of their debt"
 citizenship_for_sale_desc:0 "It is only right and proper that people of a superior class should become citizens of our nation. The obvious choice here are the wealthy"
 service_gaurnatees_citizenship_desc:0 "Our citizens have grown complacent and no longer comprehend what citizenship really means. We must remind them by encouraging them to serve in the army or navy. Once they have fought for the state they will comprehend their duty!"
 omens_are_fairly_accurate:0 "Conviction in Omens"
 omens_are_fairly_accurate_desc:0 "We must convince people in the fact that omens do come true. The goal here is to order our priest to champion the small scale omens that everyone sees as evidence that omens are indeed correct. This may reduce the power of omens in the eyes of the people"
 cnn_is_already_calling_this_omen_successful_desc:0 "By ordering our priests to emphasise the real power that Omens possess we can ensure that people feel the power of the omens"
 lex_gellia_et_cornelia_desc:0 "We should empower our governors to select those who are meritorious in our provinces to join the ranks of our citizens. After all our governors will know best."
 lex_civitas_deses_desc:0 "Our Citizens are becoming lazy and complacent. We must ensure they comprehend the importance of service by getting them into the army."
 faith_of_magna_graecia_desc:0 "The urban centres of Magna Graecia have become a real thorn in our side. It just might be preferable to incorporate those Greek urban centres into the Roman Realm."
 break_the_carthaginians_desc:0 "The conflict with the Carthaginians has been dragging on for an extended period"
 take_control_of_macedonia_title:0 "Acquire Control of Macedonia"
 invasion_of_gaul_desc:0 "The Gallic tribes won't pose a menace to us much longer. Mount a large scale invasion to bring those barbarian hordes under Roman rule."
 the_end_of_pontus_title:0 "Terminate the Pontic Kingdom"
 take_control_of_saguntum_title:0 "Acquire Control of Saguntum"
 carthaginian_numidian_relations_desc:0 "Considering the constant menace of the Romans"
 reclaim_cyrenaica_desc:0 "Our magnificent kingdom seems to be falling apart. With Cyrenaica declaring independence"
 defend_the_egyptian_border_title:0 "Defend the Egyptian Frontier"
 defend_the_egyptian_border_desc:0 "The Egyptian frontier has to be defended"
 the_end_of_armenia_title:0 "Terminate the Kingdom of Armenia"
 push_back_the_parthians_desc:0 "We have had several reports of Parthians harassing our frontier provinces"
 colonies_in_the_north_desc:0 "Our kingdom is far from the magnificent empire it once was. It's about time we demonstrate to the world that we're still a power to be reckoned with. Let us start with those barbarian hordes up in the north"
 defend_the_macedonian_border_title:0 "Defend the Macedonian Frontier"
 macedonian_achaean_relations_desc:0 "We're not the magnificent empire we once was"
 gallic_nation_desc:0 "If we are ever to have a chance of resisting foreign incursions"
 alert_available_decision_delayed:0 "The subsequent decisions are available:\n$LIST$"
 via_aurelia_desc:0 "By constructing a novel road between Rome and Portus Pisanus we will be able to improve both army movements and communication between our colonies."
