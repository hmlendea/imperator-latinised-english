l_english:
 pbc_event.1.desc:0 "It seems [SCOPE.sChar('power_character').GetName] has gotten [SCOPE.sChar('power_character').GetHerHis] hands on a lot of affluence, as [SCOPE.sChar('power_character').GetSheHe] has started investing a great deal of silver into structure a reputation for [SCOPE.sChar('power_character').GetHerselfHimself] lately. Though it is unclear exactly where [SCOPE.sChar('power_character').GetSheHe] found these riches, [SCOPE.sChar('power_character').GetHerHis] efforts are surprisingly effective.\n\nWith [SCOPE.sChar('power_character').GetHerHis] increased popularity, [SCOPE.sChar('power_character').GetPraenomen] has started vying for a more powerful position in [ROOT.GetCountry.GetName], shamelessly comparing [SCOPE.sChar('power_character').GetHerselfHimself] to our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName]."
 pbc_event.2.desc:1 "A few months have passed because [SCOPE.sChar('power_character').GetPraenomen] came into a tidy sum of gold, and the first time we heard about [SCOPE.sChar('power_character').GetHerHis] insults to our rulership of [ROOT.GetCountry.GetName]. \n\nNow, during a large gathering at one of [SCOPE.sChar('power_character').GetHerHis] villas just outside of [ROOT.GetCountry.GetCapital.GetName], [SCOPE.sChar('power_character').GetSheHe] has apparently compared [ROOT.GetCountry.GetRuler.GetName] to an incapable farm animal, and called the [ROOT.GetCountry.GetCapital.Custom('get_city_type_loc')] of [ROOT.GetCountry.GetCapital.GetName] a ruined husk of a capital."
 pbc_event.3.desc:0 "As there have been no repercussions to [SCOPE.sChar('power_character').GetHerHis] insults so far, [SCOPE.sChar('power_character').GetPraenomen] has continued mocking [ROOT.GetCountry.GetRuler.GetPraenomen] for the last couple of months.\n\nIn the latest barrage of deeply insulting descriptions of [ROOT.GetCountry.GetRuler.GetName], a man suddenly charged forward and attacked [SCOPE.sChar('power_character').GetHerHim]. Somehow this man disappeared into the audience in the chaos that ensued, though it was supposedly heard that he felt he had to place an end to the arrogance of [SCOPE.sChar('power_character').GetPraenomen], because nobody else would."
 pbc_event.4.t:0 "Novel Military Structure"
 pbc_event.4.b:0 "It is time to intervene and place an end to this nonsense."
 pbc_event.5.desc:0 "It seems the governor of [SCOPE.sGovernorship('affected_governorship').GetName] has been taking advantage of [SCOPE.sChar('power_character').GetHerHis] position to such a degree that [SCOPE.sChar('power_character').GetSheHe] has left the people of [SCOPE.sState('affected_province').GetShortName] destitute. Some of our confidants who have passed through the province talks of desperate situations of unfortunate souls who barely cling to life.\n\nNot only has [SCOPE.sChar('power_character').GetName] not taken care of those under [SCOPE.sChar('power_character').GetHerHis] rule, but [SCOPE.sChar('power_character').GetSheHe] has taken advantage of the situation for the sake of personal affluence."
 pbc_event.5.b:0 "Outrageous! Let us dispatch some administrators to fix up [SCOPE.sChar('power_character').GetHerHis] mess."
 pbc_event.5.c:0 "Let us dispatch the people of [SCOPE.sState('affected_province').GetShortName] what they require."
 pbc_event.6.desc:0 "Lately, our [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] has come into conflict with [SCOPE.sChar('power_character').GetName] at every turn and decision, their opinions persistently clashing. If one of them says south, the other will promptly say north. If one wants to trade with a neighbour, the other will argue for conflict.\n\nThis constant bickering is ruining whatever authority [ROOT.GetCountry.GetRuler.GetPraenomen] used to have, and the atmosphere in [ROOT.GetCountry.GetCapital.GetName] is at a breaking point."
 pbc_event.10.desc.a:0 "The [SCOPE.sChar('power_character').GetFamilyDisplayName] have long been proponents of reducing the central authority of [ROOT.GetCountry.GetName]. They argue that, for far too long, our people have moved to our larger villages and urban centres, like [ROOT.GetCountry.GetCapital.GetName], forsaking our ancient ways and smaller towns.\n\n[SCOPE.sChar('power_character').GetName] argues that we require to repopulate all the territory we have left behind, as our traditions are closely connected to these tracts and villages. Many have already started backing [SCOPE.sChar('power_character').GetHerHis] thoughts."
 pbc_event.10.desc.b:0 "The [SCOPE.sChar('power_character').GetFamilyDisplayName] have long been proponents of increasing the central authority of [ROOT.GetCountry.GetName]. They argue that we have waited far too long, and that to construct a stronger country we have to leave some of our tribal roots behind.\n\nSpeaking at length of all the great things we can do together, if we are only willing to band together in larger urban centres, [SCOPE.sChar('power_character').GetName] has collected quite an impressive group of supporters backing [SCOPE.sChar('power_character').GetHerHim]. Now they are demanding that we commence working on the infrastructure needed to support such an undertaking."
 pbc_event.11.desc:1 "One of our researchers, [SCOPE.sChar('power_character').GetName], thinks [SCOPE.sChar('power_character').GetSheHe] is just about to make a notable scientific breakthrough in the study [SCOPE.sChar('power_character').GetSheHe] is currently working on. All that is needed is some more supplies and funds for the next couple of years.\n\nTo be able to get [SCOPE.sChar('power_character').GetHerHis] hands on some of these [SCOPE.sChar('power_character').GetSheHe] has personally asked our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName], if [SCOPE.sChar('power_character').GetSheHe] can be given access to them. The rest of our researchers would assuredly suffer if we were to make this move, but maybe it is worth it after all?"
 pbc_event.11.a:0 "[SCOPE.sChar('power_character').GetPraenomen] will get everything he requirements."
 pbc_event.11.c:0 "We can set aside some novel funds for [SCOPE.sChar('power_character').GetPraenomen]."
 pbc_event.12.desc:0 "Recently we have seen that our [SCOPE.sChar('power_character').GetOffice.GetName], [SCOPE.sChar('power_character').GetName], as well as those under [SCOPE.sChar('power_character').GetHerHis] charge, have been doing a disappointing job. It seems people having issues with them maintain reporting back to us how difficult they are to labour with.\n\nWhen talking to the [SCOPE.sChar('power_character').GetWomanMan], [SCOPE.sChar('power_character').GetSheHe] claims it is simply a matter of bureaucracy being difficult, and that the funds for [SCOPE.sChar('power_character').GetHerHis] office has been deficient lately. [SCOPE.sChar('power_character').GetSheHe|U] makes sure to mention repeatedly that it would most probable labour out, if only they were given more funds to labour with."
