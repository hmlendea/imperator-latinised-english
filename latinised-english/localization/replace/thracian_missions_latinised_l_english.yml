l_english:
 thracian_01_hellespont_DESCRIPTION:0 "Since Alexander's death, [GetCharacter('(int32)41').GetName] - our first ruler - has maintained a marginal position in the power struggles of the Diadochi, too occupied ensuring the safety of the whole Greek world from the barbarian menace from the North. \n\nIn recent years, however, it has become clear that the former satrapy of Thrace, now a kingdom, is in a dangerous position and is unable to survive without taking a robust stand in the perpetual conflict that is raging around her among the other Diadochi. In particular, the explosive expansion of the kingdom led by [GetCharacter('(int32)37').GetName] threatens our very borders. The only way to ensure our safety is to take the offensive first, taking the armed conflict to Asia Minor and away from our territory."
 thracian_01_hellespont_BUTTON_TOOLTIP:0 "By taking the offensive versus our rivals, we shall ensure our position in Asia Minor."
 thracian_01_hellespont_task_1_DESC:0 "A good part of [GetCharacter('(int32)37').GetPraenomen]' power has invariably come from his ability to draw allies to his cause. Some of these allies are located at the doors of our kingdom; this is a dangerous betrayal that we is unable to condone."
 thracian_01_hellespont_task_2_DESC:0 "[GetCharacter('(int32)37').GetPraenomen] has invariably been a master at enthralling allies, and his guiles extended the borders of his influence up to our neighbours. It is time to repay him in kind."
 thracian_01_hellespont_task_3_DESC:0 "The [GetCountry('PRY').GetName] is a constant source of danger and worries for us; their uncheckered ambition could swipe all the Diadochi away. We need to take the initiative, bring the armed conflict to them and attack where they are the weakest!"
 thracian_01_hellespont_task_4:0 "Fund the Conflict Chest"
 thracian_01_hellespont_task_4_DESC:0 "Harsh times require harsh measures. Our subjects on the [GetProvince('(int32)2770').GetArea.GetRegion.GetName] are rich, but they haven't been pulling their weight in the recent armed conflicts. The maneuvre won't be popular with them, but we can extort a special tax from them to finance our conflict chest."
 thracian_01_hellespont_task_5_DESC:0 "While the Asian front remains our first priority, we should not forget that we frontier with a rival Successor also on the West. [GetCountry('MAC').GetName], however, is weak; if we join forces with their other neighbour, [GetCountry('EPI')GetName], we can overwhelm them and share the spoils."
 thracian_01_hellespont_task_5.tt:1 "We attempt to reach an agreement with [GetCountry('EPI')GetName|Y] versus [GetCountry('MAC').GetName|Y]."
 thracian_01_hellespont_task_6_DESC:0 "The [GetCountry('PRY').GetName] controlled - more or less directly - [GetProvince('(int32)257').GetName] for several years, yet they failed to honour the monumental legacy of the Trojan Armed conflict that took place on this very shore. We shall not make the same mistake."
 thracian_01_hellespont_task_7_DESC:0 "[GetCountry('HCP').GetName] is a neighbouring country of limited military power but extremely rich due to her access to fish, fertile territories and trade routes across the [GetProvince('(int32)2770').GetArea.GetRegion.GetName]. We should attempt to gain control over it."
 thracian_01_hellespont_task_7.tt:1 "We will attempt to gain control over [GetCountry('HCP').GetName|Y] through diplomatic means."
 thracian_01_hellespont_task_8_DESC:0 "The power of [GetCountry('PRY').GetRuler.GetName] and [GetCountry('EGY').GetRuler.GetName] will go unchallenged as long as their fleets are unmatched. If we want to maintain being relevant in the struggle for Alexander's empire, we need to grow our fleet, and a push in the right direction might come from [GetCountry('BYZ')GetName]."
 thracian_01_hellespont_task_8.tt.1:0 "Have at least [SCOPE.ScriptValue('thracian_01_hellespont_task_8_ship_total')|0] vessels. [SCOPE.GetRootScope.GetCountry.Custom('thracian_01_hellespont_task_8_ship_counter')]"
 thracian_01_hellespont_task_8.tt.2:1 "We will attempt to gain control over [GetCountry('BYZ').GetName|Y] through diplomatic means."
 thracian_01_hellespont_task_9.tt.1:0 "We dispatch an ambassy to [GetCountry('EPI').GetName], asking them to join our armed conflict as agreed."
 thracian_01_hellespont_task_10_DESC:0 "We have established our presence on the other side of the Hellespont, but our isolated possessions on the dangerous Asian frontier are insufficient. We need to take advantage of our neighbours' weakness to expand decisively in Asia!"
 thracian_01_hellespont_task_11_DESC:0 "The Greeks have colonised the Western coasts of Asia Minor for centuries, so much that many local urban centres have assurged to the role of true Hellenic centres of culture. However, we will need to hellenize the hinterland too, if we wish to integrate these areas into our dominion."
 thracian_01_hellespont_task_12_DESC:0 "Conquering [GetProvince('(int32)1941').GetArea.GetRegion.GetName] has opened up the doors to [GetProvince('(int32)1932').GetArea.GetRegion.GetName] for us. If we managed to make our Southern frontier overlap the whole range of the Taurus Mountains, we should not fear any invader from South anymore!"
 thracian_01_hellespont_task_13_DESC:0 "The north-western side of Asia Minor, just beyond the Hellespont from our capital, is a rich, deeply-Hellenised area. By trusting them with their autonomy, we shall obtain a faithful subject and lighten the burden of local administration on our bureaucracy."
 thracian_01_hellespont_task_14_DESC:0 "While we consolidated our power in Asia, our enemies became stronger on the Aegean Sea. Our fleet might not be the largest in the Mediterranean, and most of our interests might lie in the [GetProvince('(int32)2770').GetArea.GetRegion.GetName], but the Aegean is our backyard and we is unable to permit other powers to dominate it."
 thracian_01_hellespont_task_15_DESC:0 "[GetCharacter('(int32)38').GetPraenomen] has invariably been a rival of our founder [GetCharacter('(int32)41').GetPraenomen], and offended him greatly by calling him a simple Treasurer. The Antigonids are the bane of our existence, and someone will have to pay for this offence."
 thracian_01_hellespont_task_final_DESC:0 "The [GetProvince('(int32)2770').GetArea.GetRegion.GetName] is the backyard of [GetCountry('TRE').GetName] and the main source of our commercial revenue. We is unable to tolerate to share it with our rivals."
 thracian_02_paper_kingdom_BUTTON_TOOLTIP:0 "Through adversity unknown to any other diadoch Lysimachos has persevered, for decades fending off all menaces to his dominion of Thrace. Now, as more direct involvement in the Successor Armed conflicts becomes all but unavoidable, [ROOT.GetCountry.GetRuler.GetName] must rid [ROOT.GetCountry.GetRuler.GetHerselfHimself] decisively of these menaces to [ROOT.GetCountry.GetRuler.GetHerHis] northern flank."
 thracian_02_paper_kingdom_DESCRIPTION:0 "The Armed conflicts of the Successors rage all around the Kingdom of Thrace, but 'ere [ROOT.GetCountry.GetRuler.GetName] can fully commit [ROOT.GetCountry.GetRuler.GetHerHis] resources to the pursuit of Alexander's legacy, Thrace, so long beset by disloyal subjects from within and barbaric raiders from without, must have its northern borders secured definitively."
 thracian_02_paper_kingdom_CRITERIA_DESCRIPTION:0 "Deal with the Odrysian and Getian menaces, and unify the Thracian tribal territories south of the great river Istros."
 thracian_02_paper_kingdom_3_completion_tt:0 "@[GetCountry('ODR').GetFlag]! [GetCountry('ODR').GetName|Y] will not be able to commence further rebellions."
 thracian_02_paper_kingdom_4_DESC:0 "Our patience with the Odrysi wears thin, and if they are unable to be brought to heel then they must be destroyed. Previous armed conflicts have been fought on their terms - the next one will be fought on ours."
 thracian_02_paper_kingdom_5_DESC:0 "Founded by Seuthes III in a vainglorious attempt to match the power and civilisation of the Greek world, the Odrysi capital of Seuthopolis has become a symbol of their resistance and their pride. And as this symbol it must be destroyed; its structures toppled, its riches looted, and its people scattered to the winds. Only then shall their spirit be truly broken."
 thracian_02_paper_kingdom_6_DESC:0 "Now that the Odrysi have been dealt with, we must look to their brethren to the north. All territories south of the Istros belong to Thrace, and if they will not submit to us willingly then we shall take them by force."
 thracian_02_paper_kingdom_7_DESC:0 "The nominal extent of the Satrapy of Thrace - from the Hellespont to the Ostros - has been turned into a reality. The disloyal tribes have been pacified and brought into the fold, allowing us to refocus our resources on the menaces to our south."
 thracian_02_paper_kingdom_7_allow_tt:0 "The nominal extent of the Satrapy of Thrace is owned by us or our vassals.\nThis is the area delineated by:\n- [GetProvince('(int32)349').GetName|Y], and the frontier with Byzantine [GetProvince('(int32)1453').GetArea.GetName|Y] in the south.\n- The river #Y Istros#! in the north.\n- The frontier with the province of [GetProvince('(int32)365').GetArea.GetName|Y], and the territories of [GetProvince('(int32)4115').GetName|Y], [GetProvince('(int32)4217').GetName|Y], and [GetProvince('(int32)477').GetName|Y] in the west.\n- The shores of the #Y Pontus Euxinus#! in the east."
 thracian_02_paper_kingdom_8:0 "Territory of the Thracians"
 thracian_02_paper_kingdom_9_DESC:0 "Within only a few years of its founding Lysimacheia has grown to one of the largest urban centres in the region. We should stimulate its trade still further, and ensure we exploit the affluence of its inhabitants as best we can, to fund our future military endeavours."
 thracian_02_paper_kingdom_10_DESC:0 "The location of Lysimacheia was purposefully chosen: able to block any army crossing the Hellespont from entering mainland Thrace and Macedonia, while also serving as a bulwark versus the Odrysian menace to the north. While a flourishing trading port, this defensive purpose should not be forgotten. The city's fortifications must hold up to any attack the enemy can throw at it."
 thracian_02_paper_kingdom_12:0 "The Menace of the Getae"
 thracian_02_paper_kingdom_13_DESC:0 "The Istros is wide and deep, serving as a natural barrier to invaders. We must augment these natural defences by establishing fortified military camps near the crossings used by the Getae, from which we can more easily deter them from invading our territories."
 thracian_02_paper_kingdom_14_DESC:0 "The river Istros is our shield versus invaders from the north. Total control of all the river's crossings from the Pontus Euxinus to Saldensia should yield an impenetrable barrier - completely preventing further raids from crossing into our territory."
 thracian_02_paper_kingdom_16:0 "Conclusion the Raids"
 thracian_02_paper_kingdom_16_DESC:0 "Barbarians such as the Getae comprehend no language but that of force. We shall assemble a punitive expedition to crush the Getae and forever dissuade them from raiding our territories."
 tre_land_of_the_thracians_culture_mod:0 "Territory of the Thracians"
 tre_ending_the_raids:0 "Conclusion the Raids"
 thrace_03_philhellene:0 "A Novel Philhellenic Policy"
 thrace_03_philhellene_DESCRIPTION:0 "Our ways of deriding and sidelining the Greeks and treating them as second-rate citizens have only fostered resentment and hostility, thwarting at every turn our efforts of establishing our hegemony over the Greek states and their colonies. Perhaps it is time for a novel policy - one of respect and reverence to the Greeks and their culture; of cooperation and generosity rather than antagonism and avarice."
 thrace_03_philhellene_BUTTON_TOOLTIP:0 "Macedonians have long insisted upon their superiority over the Greeks, and as a result we are faced with rebellion after rebellion of our Greek subjects. A novel path of treating the Greeks, if not as equals, then at least as worthy and respectable peoples, might foster better results."
 thrace_03_philhellene_1_DESC:0 "The wealthy Greek colonies on the western shores of the Pontus Euxinus, some of them founded by urban centres that themselves once were Greek colonies, are of critical importance to the health of our nation. We must do whatever we can to stimulate their economic development."
 thrace_03_philhellene_1_allow_tt:0 "@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName] has at least [SCOPE.ScriptValue('tre_mis_3_1_target')|Y0] of the Pontic urban centres on the western coast of the Black Sea as subjects. ([SCOPE.Custom('tre_mis_03_1_cus_loc')]/[SCOPE.ScriptValue('tre_mis_3_1_target')|0Y])"
 thrace_03_philhellene_2_DESC:0 "Euergetism, or "doing good deeds", is the expected practice of the wealthy in society to distribute their affluence to the community. [ROOT.GetCountry.GetRuler.GetName] will not be taken seriously by [ROOT.GetCountry.GetRuler.GetHerHis] Greek subjects unless [ROOT.GetCountry.GetRuler.GetSheHe] leads by example and spends some part of [ROOT.GetCountry.GetRuler.GetHerHis] riches on the betterment of all Greek states."
 thrace_03_philhellene_3_DESC:0 "As one who treads in Alexander's footsteps, it is only appropriate that [ROOT.GetCountry.GetRuler.GetName] should be extolled and worshiped as Alexander once was. Those most fanatical in their veneration of [ROOT.GetCountry.GetRuler.GetFirstName] should be encouraged and given the means to become the nucleus of a true cult in the honour of [ROOT.GetCountry.GetRuler.GetFirstName]."
 thrace_03_philhellene_6_DESC:0 "The dominant power of the Peloponnese, [GetCountry('SPA').GetName], may well be swayed to our cause with the careful application of affluence and promises."
 thrace_03_philhellene_7_DESC:0 "Allowing the Greek colonies to do their own minting will go a long way to displaying our respect, while also strengthening their ability to develop their urban centres."
 thrace_03_philhellene_8_DESC:0 "With our achievements and our continued support of the Greeks versus their enemies, we may well rightfully style ourselves as the "Champion of all Greeks"."
 thrace_03_philhellene_9_DESC:0 "Future disloyalty of the Greek colonies must be dissuaded, if necessary by force. We will station a robust contingent of men in each of the urban centres, to nip any attempts at rebellion in the bud."
 thrace_03_philhellene_12_DESC:0 "A great many of our troubles could be solved if the Greeks would handle themselves in our stead. Perhaps, rather than ourselves attempting to be everywhere at once, we may leave Greek matters in the hands of Greeks by organising them into a powerful league under our guidance."
 thrace_03_philhellene_12_reward_tt:0 "Every free Greek state in mainland [GetProvince('(int32)418').GetArea.GetRegion.GetName] which is at peace will receive an offer to join a combined Hellenic subject of @[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName].\nChance of acceptance is increased by good relations and existing alliances.\nCurrent subjects will invariably accept."
 thrace_03_philhellene_13_DESC:0 "We will show our support of the Greek colonies by investing heavily into the development of the urban centres. Their good fortunes, after all, are ours."
 thrace_03_philhellene_15:0 "Formalise Autonomy"
 thrace_03_philhellene_15_DESC:0 "We will enter into a formal agreement respecting the autonomy and nominal sovereignty of the Greek Pontic colonies, while also allowing them to contribute to the defence of their homelands as a part of the [GetCountry('TRE').GetAdjective] military."
 thrace_03_philhellene_black_sea_war_trigger:0 "@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName] is not at war with any of the Pontic urban centres on the western coast of the Black Sea."
 desc_me_tre_3_15_cmod:0 "By tying the citizienship of the Pontic urban centres to the defence of our realm as whole, we have ensured a steady stream of recruits."
 desc_me_tre_3_9_cmod:0 "Garrisoning the urban centres more directly allows us to further insinuate ourselves into the government of the Pontic urban centres, to our benefit."
 desc_me_tre_3_8_cmod:0 "Our glorious successes in Greece and protection we grant its urban centres in our service have made us the undeniable heros of its people."
