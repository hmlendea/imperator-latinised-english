 CHANGE_CIVIC_RIGHTS_INTEGRATED_CONFIRMATION:1 "Change the Civic Right for [COUNTRYCULTURE.GetCulture.GetName|Y] pops to [POPTYPE.GetName|Y],\ncosting $COST$?\n\nThis will commence an integration process, which when complete will give them equal rights to our Primary Culture and protect them from assimilation.\n\nOnce started the integration process cannot be stoppped. While the integration is continuing your Country will have the following penalty to Stability for each continuing integration\n$STABILITY$\n\nEach integrated culture reduces Integrated Culture happiness by \n$HAPPINESS$."
 CHANGE_CIVIC_RIGHTS_INTEGRATED_CONFIRMATION_FOR_NOBLES:0 "Since you are promoting a novel Culture to [POPTYPE.GetName|Y] rights this will reduce the happiness for both your Primary Culture and all Integrated Cultures by another\n$HAPPINESS$."
