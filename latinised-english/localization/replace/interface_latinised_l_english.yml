 FAMILY_NOT_SCORNED:5 "#T Content Family#!\nAll Families in our country expect to hold a total of $VAL|Y$ Jobs and Offices in order to be #Y Content#!. This is dependent on the total number of jobs in our country and may change.\n\nIf at any time a family has less than the expected number of jobs will become #R Scorned#!, lowering the loyalty of all of that Family's members.\n\nA Family that holds twice as numerous jobs as it expects will become #G Grateful#!, increasing the loyalty of all of that Family's members."
 FAMILY_GRATEFUL:1 "#T Grateful Family#!\nAll Families in our country expect to hold a total of $VAL|Y$ Jobs and Offices in order to be #Y Content#!. This is dependent on the total number of jobs in our country and may change.\n\nIf at any time a family has less than the expected number of jobs will become #R Scorned#!, lowering the loyalty of all of that Family's members.\n\nSince this family holds twice as numerous jobs as it expects it is #G Grateful#!, increasing the loyalty of all of that Family's members:\n  $IMPACT$"
 FAMILY_NOT_SCORNED_ENOUGH_WAGE:1 "#T Respected Family#!\nA #Y Respected#! family must earn at least $VAL|G%$ of the state revenue between its employed members. If all of its eligible adults are employed by the state, they will also consider themselves #Y Respected#!.\n\n$WHY$"
 LOYAL_COHORTS:4 "#T Size of Retinue#!\nThis Clan Chief has [ClanLeaderItem.GetCharacter.GetNumberOfLoyalCohorts|V] loyal Cohorts.\nEach Clan Chief has their own retinue that they will maintain, and increase if they can afford to. The maximum size of a retinue is dictated by your national Manpower pool and Centralisation."
