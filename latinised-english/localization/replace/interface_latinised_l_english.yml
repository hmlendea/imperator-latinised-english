 cool_map_effect_MAPMODE_DESC:1 "#T Atlas Map Mapmode#!\nThis mapmode is provided as a flavorful way of displaying your national situation, and is inspired by the appearance of 19th century cartography. As your important urban centres and locations grow, they will take on a more prominent appearance."
 EPIINTRO:1 "#T Epirus#!\nDifficulty: #Y Medium#!\n\nThe kingdom of Epirus occupies a unique position, protected from the Macedonian kingdom by geography, dominating the Ionian coast, and a stones throw from the rich lands of Magna Graecia. However, if the westward ambitions of Alexandros of Epirus, uncle of Alexander the Magnificent, are to be realised, Molossian disputes concerning the Epirote succession must be settled, and the power of Macedon, Aetolia, and the Illyrian tribes checked in the fallout of the Diadochi wars."
 SPAINTRO:1 "#T Sparta#!\nDifficulty: #Y Hard#!\n\nThough the heady glories of Thermopylai and the Peloponnesian war are now half-remembered dreams, the Spartan kingdom looks to the collapse of Alexander's Macedonian empire as an opportunity to reignite the flame of Laconian supremacy by dominating the Peloponnese once more. This may be more difficult than it sounds; Sparta's neighbours and old enemies in Messenia and Arcadia fraternize in a cowardly alliance out of fear for sight of our hoplites on the horizon."
 SYRINTRO:1 "#T Syracuse#!\nDifficulty: #Y Hard#!\n\nThe city of Syracuse now totally dominates the other towns of eastern Sicily, an island which has been ravaged by centuries of war between Punic and the Greek interests, and the rise and fall of brutal tyrant kings. The city of Arethousa must recover her former glory while defending versus Carthaginian and nascent Italic threats if the island's Hellenic urban centres are to survive the coming decades and honour their ancestor's victory over Athen's Sicilian expedition."
 ATHINTRO:1 "#T Athens#!\nDifficulty: #Y Hard#!\n\nThe glorious days of Marathon, Pericles, and the Delian League are but a distant memory to the citizens of the once mighty city of Athenai, which along with much of Greece now endures under the Macedonian yoke. Viewed as the most important city of the Hellenes by all but the Dorians, Athens must display leadership if she is to survive the ravages of the Diadochi wars and aspire to her former greatness as the liberator and protector of Greece."
 MASINTRO:1 "#T Massilia#!\nDifficulty: #Y Hard#!\n\nMassilia is the most successful of the Greek urban centres of the western Mediterranean, and the main city of the Phocaean colonists, founding the trading posts of Emporion and Hemeroskopeion in Iberia to profit from the flow of exchange between the Greek world and the barbarian tribes of this untamed region. The city's survival will depend on a shrewd mixture of diplomacy and opportunism, ensuring the natives are unable to overrun this Hellenic bastion in Gaul."
 UNOWNED_DLC_STRING_PUNIC_WARS:0 "There is additional content available for this nation in the #Y Punic Wars#! Content Pack. The #Y Punic Wars#! pack is free to all owners of Imperator: Rome, and can be acquired via your chosen storefront."
 INNOVATIONS_TOOLTIP:0 "#T Innovations#!\nInnovations are accumulated when our technology increases. They allow us to adopt novel inventions via the zeitgeist of our nation, without having to invest gold."
 SHOW_SUBUNITS:0 "Display Subunits"
 LEGION_REINFORCE_TO_OWNED_AND_CONTROLLED_ONLY:0 "@trigger_no! You can only edit [UNIT.GetName] if it is standing in a [territory|E] that you both possess and control."
 LEVY_EXPLANATION:0 "#T Levies#!\n\nLevies are raised from [governorships|E], and are composed of [subunits|E] appropriate to the culture of the [pops|E] within them. A governorship with a large Scythian population, for example, might raise a significant number of cavalry units.\n\nLevies can only be raised from [integrated_cultures|E], however, so consider this when planning your military capability.\n\nLevied pops will not produce flat resources while they are raised; going to armed conflict can be a costly affair. Additionally, when a levied subunit is destroyed in combat or overrun, there is a chance that an associated pop will be too damaged to recover, and be destroyed."
 settlement_desc:0 "Settlements are the most common [province_rank|E], representing the villages and minor towns that make up most the world.\n\nFood [tradegoods|E] as well as specialised production [buildings|E], such as mines, slave estates, and farms, can only be produced or constructed in Settlements, but they can not house as numerous pops as a [GetProvinceRank('city').GetName|E] or [GetProvinceRank('city_metropolis').GetName|E]."
 city_desc:1 "Urban centres are the main population centres and second most common [province_rank|E], enjoying greater privileges and able to house numerous more [pops|E] than a [GetProvinceRank('settlement').GetName|E], though not as numerous as a [GetProvinceRank('city_metropolis').GetName|E].\n\nUrban [buildings|E] may be constructed here, but Urban centres may not produce Food [tradegoods|E]."
 city_metropolis_desc:1 "Metropolises are the very largest of the world's urban centres, representing the greatest urban centres of the ancient world, and the rarest [province_rank|E].\n\nMetropolises are more productive and can house numerous more [pops|E] than a [GetProvinceRank('city').GetName|E] or [GetProvinceRank('settlement').GetName|E], but care must be taken to ensure they are fed."
 create_high_martial_rising_star:0 "A character with exceptionally elevated @military_icon! is promoted from the ranks."
 BUILDING_ITEM_WITH_INSTRUCTIONS:2 "#T Construct [BuildingItem.GetName]#!\n[BuildingItem.GetEffectInfo]\n\n[BuildingItem.GetBuildInfo]\n#G Left-Click#! will construct a structure.\n#G Right-Click#! will cancel a queued structure, or destroy a structure if there are none queued. "
 HISTORY_T:0 "Honours"
 LEGIONS_INFODUMP:2 "When the correct [laws|E] have been enabled, you will be able to raise [legions|E] from the various [regions|E] under your control.\n\nUnlike Levies, Legions allow you much greater control over the composition of your army [units|E], and can benefit from the use of Siege Engineers - highly specialised infantry, capable of bringing fortresses and city walls to ruins in short order.\n\nLegions also have a series of subcommanders which take to the field in the event that a Legion is divide into multiple units.\n\nThey are capable of earning distinctions or dishonors based upon their conduct in battle, as well as tracking their various achievements and conquests over the course of a campaign."
