 NOBLES_DESC:0 "Nobles represent the highest elite of a country, the patrician class. There is no one with the influence, affluence and status of the nobles. When they labour for the best of the state nobles can be a magnificent boon for any ruler, but their expensive habbits and robust opinions can make them hard to please."
