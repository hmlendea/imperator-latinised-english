 ATTRITION_WEIGHT_DIF:0 "#T Attrition Weight#!\nSome types of units weigh more and some less when it comes to how numerous you can have at the same location. Light Infantry weigh less and can be stacked more, while Conflict Elephants require far more resources."
 HAPPY_IN_POP:0 "#T $NAME$ Pops Satisfied#!\nThe $NAME|Y$ Pops in $WHERE$ have an average Happiness of $VAL|%G$. This is above their Base Happiness. If a Pop falls below #v 50%#! Happiness, they will commence generating Unrest.\n\nThe Base Happiness of a $NAME$ is $BASE|%Y$."
