l_english:
 gw_completed.1.desc:2 "Behold! [SCOPE.sGreatWork('target').GetName] is completed, at last! Our arduous labour has finally come to fruition. A construction of this magnitude is an achievement in itself, but also the interior is decorated with the finest artwork produced by our people. It truly represents our nation's grandeur and might in a way nothing else could. It is truly a glorious sight!"
 gw_completed_flavor.1.a:2 "Our leader's vigour led us to this accomplishment!"
 gw_completed_flavor.1.c:1 "The arduous toil of our people perfected this colossal labour!"
 gw_completed.2.desc:1 "Few believed this day would come, but at last construction on [SCOPE.sGreatWork('target').GetName] has concluded. Of all the achievements [ROOT.GetCountry.GetName] has accomplished, surely there is none greater than this. Few nations in the history of the civilised world have known anything as flawless. Surely this will reveal our true potential!"
 gw_completed_flavor.2.b:1 "All efforts should go in the direction of maintaining this winning momentum!"
 gw_completed.3.desc:1 "[SCOPE.sGreatWork('target').GetName] has finally been completed! It took a tremendous amount of time and effort, but this only speaks to the unrelenting ambition of the nation. The magnitude of the monument alone attests to our abilities. Rarely, if ever, has humanity created anything like this: the architecture and execution quality alone is second to none. The terrain seems different, and the very air feels different: a novel era of prosperity for [ROOT.GetCountry.GetName] has commenced."
 gw_completed_flavor.3.c:1 "Our united efforts and sacrifices have made this occur."
 gw_existing.1.desc:0 "Yesterday during a scheduled night patrol guards found writing on [SCOPE.sP('province').GetGreatWork.GetName]. On additional inspection the leader of the patrol noticed that not only was it unsolicited, but it was also provocative and misspelt."
 gw_existing.flavor.1.b:0 "Dispatch the labourers to clean up this mess and assign more guards."
 gw_existing.flavor.1.c:0 "We must locate who did this and make an example out of them!"
 gw_existing.flavor.2.b:1 "Our efforts and resources are more effectively spent elsewhere."
 gw_existing.flavor.3.b:1 "Our efforts and resources are more effectively spent elsewhere."
 gw_existing.4.desc:0 "Another five years have passed since the creation of [SCOPE.sP('province').GetGreatWork.GetName]. Last year we focused resources on other matters; perhaps this year official festivities should be organised?"
 gw_existing.flavor.4.a:0 "This is a magnificent opportunity to have a celebration!"
 gw_existing.flavor.5.a:1 "Our people are free to discuss whatever they consider is relevant."
 gw_existing.flavor.5.c:0 "This is magnificent, we should embrace this behaviour."
 gw_existing.6.desc:0 "The sheer grandeur of [SCOPE.sP('province').GetGreatWork.GetName] attracts travellers from all over the region; it is not uncommon that they vacation in the area and that large numbers use this as their destination to revel in the glory of our wonder."
 gw_existing.flavor.6.b:2 "There must be a monetary profit in this kind of exposure."
 gw_existing.7.desc:0 "Guards and visitors have pointed out for quite some time that [SCOPE.sP('province').GetGreatWork.GetName] has started to deteriorate. Now, a very prominent visitor from our foreign ally pointed out that our once-proudest landmark is decayed and at places damaged. Not only is this affecting the morale of our nation, but it also reduces how we portray ourselves to other nations."
 gw_existing.flavor.7.a:1 "We must reinstate our monument to its former glory."
 gw_existing.flavor.7.b:2 "There's some allure in letting nature and time take their course."
 gw_existing.flavor.7.c:0 "Examine our finances and see if we can afford the reparations."
 gw_existing.8.desc:0 "There is a robust religious following practicing near [SCOPE.sP('province').GetGreatWork.GetName] gathered by [religious_activist.GetName]. Followers are holding their own ceremonies in front of large gatherings of people upon the steps of the colossal entryway. There is no evidence that ceremonies of this kind have any benefits, but there is also no evidence that the contrary is true..."
 gw_existing.flavor.8.b:0 "There are benefits to fortify our religious stance."
 gw_existing.9.desc:0 "Our colossal construct had unexpected benefits in [province.GetName]; it is now pure euphoria to traverse the market district and see delighted citizens prosper. We anticipated that morale would be reinforced in the region but to this extent no one imagined! This gives us a magnificent opportunity to capitalise on the momentum we now possess."
 gw_existing.flavor.9.b:1 "Our Ruler is the reason for this and the people must be aware!"
 gw_existing.flavor.9.c:1 "This is a beacon for our nation, who will look here for instruction."
 gw_existing.10.desc:0 "The strangest thing is happening in [province.GetName]. Animals have assembled around [SCOPE.sP('province').GetGreatWork.GetName] in what is quite a peculiar sight!"
 gw_not_existing.2.desc:0 "Our neighbour's wonder is the object of envy and awe of our populace. The people speak of the superiority of [interesting_province.GetOwner.GetName]. Dangerous talk! We would do well to heed the mood of the people and refocus their efforts on creating our own monumental work. Or, if all else fails, we could always acquire [interesting_province.GetName] from our neighbour instead."
 gw_not_existing.flavor.2.a:0 "We have other priorities, this is not deserving of our attention!"
