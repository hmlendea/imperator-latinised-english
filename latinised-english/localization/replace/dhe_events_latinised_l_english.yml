l_english:
 dhe_pharos_lighthouse.2.desc:0 "A sudden drought has hit Alexandria, and with it, the work we have been doing on the Pharos Lighthouse. Unless we invest a lot of money into transferring food and assistance from elsewhere, the building progress will assuredly be hindered. [SCOPE.sCharacter('random_advisor').GetName] point out we could focus on those working on the lighthouse, to save some of our resources."
 dhe_pharos_lighthouse.2.a:0 "We will assist all of Alexandria."
 dhe_pharos_lighthouse.2.c:0 "We are unable to afford to assist either."
 dhe_pharos_lighthouse.3.desc:0 "A large crash followed by the panic of our workers happen as some of the lighthouse falls out in the middle of construction. It seems some of the materials received are barely usable, and unsafe to keep at best.\n\nOur foremen ask for the funds necessary to purchase replacements, while [SCOPE.sCharacter('random_advisor').GetName] point out we have materials in other nearby cities we could use."
 dhe_pharos_lighthouse.3.a:0 "We will purchase some replacements."
 dhe_pharos_lighthouse.3.c:0 "We will just reduce the height of the lighthouse slightly."
 dhe_pharos_lighthouse.4.desc:0 "As work progresses on the Pharos Lighthouse, we have seen a lot of workers disappearing over time. Some have quit their job, some have died and some have simply disappeared. Without a proper workforce to work on the lighthouse, the progress will lag behind and we might not obtain the result we desire."
 dhe_pharos_lighthouse.4.a:0 "New workers will be located."
 dhe_pharos_lighthouse.4.b:0 "Our soldiers will occupy the role."
 dhe_pharos_lighthouse.5.desc:0 "A minor earthquake rocks the Pharos Lighthouse and all of those who are working inside, causing some minor injuries and some damage to the work that has been done in the last months.\n\nIf the work is to continue unhindered, a substantial amount of funds needs to be set aside to clean up the area and replace some of the things that was destroyed."
 dhe_pharos_lighthouse.6.desc:0 "As our progress on the Pharos Lighthouse continues, it seems we received an extra shipment of materials that was of a higher quality than expected. We could use the extra materials to make the lighthouse superior than we originally planned to, or we could sell it and stick to our original plans, with some extra funds in case anything else unexpected should occur."
 dhe_pharos_lighthouse.6.a:0 "Bigger and superior!"
 dhe_pharos_lighthouse.10.desc:0 "We have sent for workers to assist in the building of the Pharos Lighthouse from far and wide. As the largest building known to man, we hope this will become the shining beacon of the civilised world.\n\nIn just a few weeks, the progress of the lighthouse will commence properly. We expect a few complications as the development unfolds, but hopefully we will see the lighthouse raised soon enough."
 dhe_pharos_lighthouse.10.a:0 "It will be our shining illumination."
 dhe_pharos_lighthouse.12.desc:0 "The building of the Pharos Lighthouse has finally been completed, and it stands as a testament to our rule, power and importance. For generations to come, this lighthouse will be a beacon leading to Alexandria, one of the greatest cities the world has ever seen.\n\nThough numerous criticized us for our grandiose and impossible plans, the lighthouse has somehow managed to live up to our expectations. Never again will anyone doubt the importance of our city and nation, as we have built an unparalleled monument."
 dhe_pharos_lighthouse.13.desc:0 "The building of the Pharos Lighthouse has finally been completed, and it stands as a testament to our rule, power and importance. For generations to come, this lighthouse will be a beacon leading to Alexandria, one of the greatest cities the world has ever seen.\n\nThe gargantuan monument far exceeded our expectations beyond all hope, piercing the skies and reaching into the realms above. Never before has such a monument been built by mortal hands, and some assert we must have received divine guidance in this endeavour.\n\nThe Pharos Lighthouse will forever remain in memory of our nation."
 dhe_museion.2.desc:1 "As progress on the Mouseion continues, our search for academics and scholars to occupy the halls has begun. Several minor scholars from the local area has come to offer their service, though [SCOPE.sCharacter('random_advisor').GetName] recommend that we search for some foreigners to put forward their views on the matter of academics also.\n\nAfter a lot of searching, they have come up with three good alternatives: [SCOPE.sCharacter('scholar_character').GetName] of [SCOPE.sCharacter('scholar_character').GetEmployer.GetName], [SCOPE.sCharacter('scholar_character_2').GetName] of [SCOPE.sCharacter('scholar_character_2').GetEmployer.GetName] and [SCOPE.sCharacter('scholar_character_3').GetName] of [SCOPE.sCharacter('scholar_character_3').GetEmployer.GetName]."
 dhe_museion.2.a:0 "[SCOPE.sCharacter('scholar_character').GetName] seems like the correct choice."
 dhe_museion.2.b:0 "Maybe we should select [SCOPE.sCharacter('scholar_character_2').GetName]?"
 dhe_museion.3.desc:1 "We have sent out envoys to the whole known world to collect together all the scrolls, texts and tablets we can locate, to occupy our upcoming Mouseion. Our scholars have found a particular interesting copy of [ROOT.GetCountry.Custom('get_random_ancient_text')] in [SCOPE.sCountry('randomized_country').GetName], though it would cost us a significant amount of funds to back this endeavour.\n\nOur scholars assure us this is necessary to complete our collection, and it would benefit our study greatly."
 dhe_museion.4.desc:1 "What would a temple to the Muses be without poets to occupy it? We have had a lot of lesser known poets and writers take part in the work that has been done to construct the Mouseion into a proper temple of knowledge, but we still lack someone who has the correct characteristics.\n\nAfter an extended search, we have found two worthwhile candidates in [SCOPE.sCharacter('poet_character').GetName] of [SCOPE.sCharacter('poet_character').GetEmployer.GetName] and [SCOPE.sCharacter('poet_character_2').GetName] of [SCOPE.sCharacter('poet_character_2').GetEmployer.GetName]. Though the Mouseion might not be big enough for the both of them, so we should dispatch an invitation to one of them for now."
 dhe_museion.5.desc:0 "One of the scholars we sent out to locate texts and scrolls to occupy our libraries, has returned with [ROOT.GetCountry.Custom('get_random_ancient_text_keyword')] [ROOT.GetCountry.Custom('get_random_ancient_text')]. Though it has cost us a noticeable amount of funds, it is definite that this work will be a large boon to our study over the coming years."
 dhe_museion.5.a:0 "Marvellous news!"
 dhe_museion.10.desc:1 "We have sent out scholars and envoys to every corner of the world, to locate texts, sources and codices to occupy the magnificent Mouseion. It will truly be the centre of all our knowledge, and at the forefront of cultural life among the Hellenics.\n\nIt will be proven once and for all that Alexandria is truly one of the most magnificent cities, no matter if one looks for culture, technology or knowledge. This will be memorialized as the moment when [ROOT.GetCountry.GetName] became one of the magnificent nations in the world."
 dhe_museion.11.desc:1 "The labour on the Mouseion is finally complete, and the great majestic edifice is one that will be forever remembered, as will our rule. Academics, scholars, poets, writers and musicians from all across the known world has assembled together at the doorstep of Alexandria to share their knowledge and skills, to the considerable benefit of our people.\n\nWith all these people gathered under our fold, Alexandria has truly become the gem of our nation. All that remains is to locate a direction for all of this potential."
 dhe_museion.12.desc:1 "In the middle of the chaos as Alexandria is besieged by enemies, the night sky is lit up by a massive blaze. All of the Mouseion is on fire, buildings with scrolls, texts and all. Few have the time to react to this tragedy, before it is too late to save the edifice, much less what is preserved inside.\n\nThis can only be considered a massive tragedy to the [ROOT.GetCountry.GetAdjective] people, as the memory of our once magnificent Temple is all that is left."
 dhe_museion.12.a:0 "How could this occur?"
 dhe_museion.20.desc:1 "As we continue to attempt and maintain the Mouseion up to date on all the latest writings and ideas, we have come across a couple of texts that might be of interest to us.\n\nOne of them is a copy of [ROOT.GetCountry.Custom('get_random_ancient_text')] we have been attempting to collect for quite a while, whereas the other one is [ROOT.GetCountry.Custom('get_random_ancient_text_keyword')] [ROOT.GetCountry.Custom('get_random_ancient_text')], a rare and valuable text."
 dhe_museion.20.a:0 "Our original goal is sufficient in this case."
 dhe_museion.21.t:0 "Musing Concerning Our Options"
 dhe_museion.21.desc:1 "We have some open positions at the Mouseion, and our academics have started searching for someone to occupy the vacant rooms. They have come up with a couple of interesting options, and would appreciate our take on the alternatives at hand."
 dhe_museion.21.b:0 "We have heard some good things concerning [SCOPE.sCharacter('random_character_2').GetName]."
 dhe_museion.22.desc:1 "Though building the Mouseion has been proven to be an undeniable boon to [ROOT.GetCountry.GetName], it has cost us a lot of money to maintain everything working. The price of making sure the edifice is intact, and to take care of all the scrolls, texts and people working inside is noticeable as time passes."
 dhe_colossus_of_rhodes.2.desc:0 "We receive news that one of the shipments with materials for the Colossus has been sunk by pirates outside the shores of [SCOPE.sP('randomized_country_province').GetName]. Without all the materials we require for the statue, we will have to dispatch for a new shipment or reorganize the planned size of the statue."
 dhe_colossus_of_rhodes.3.desc:0 "A lot of the work that has been done on the Colossus has been with the good will of the people of Rhodes, but it seems a lot of them have become demotivated as the progress has not been as rapid as they hoped for.\n\nWe could pay to obtain new workers to arrive in Rhodes to take on the rest of the work, attempt to motivate those we already have, or change some of our plans in order to reduce the remaining labour load."
 dhe_colossus_of_rhodes.3.a:0 "Some new hands will complete the labour."
 dhe_colossus_of_rhodes.3.b:0 "A motivational speech is just the correct thing."
 dhe_colossus_of_rhodes.4.desc:0 "There have recently been issues with theft and sabotage around the Colossus, as jealous nations dispatch their spies to infiltrate and ruin our work of art. Though the issues have been relatively minor so far, we fear it might just be the taste of what is to come.\n\n[SCOPE.sCharacter('random_advisor').GetName] recommend setting soldiers aside to guard the construction of the Colossus better. Alternatively we could use some of our funds to replace the ruined parts, or ignore the matter all together."
 dhe_colossus_of_rhodes.10.desc:0 "With all the resources, equipment and materials left behind by Demetrios' army, we start crafting our colossal statue in honour of Helios. For the remainder of the things we require, we start sending out emissaries to the major powers of the Mediterranean.\n\nWe are expecting it will take quite a while to complete this enormous endeavour, but that is the price one will have to pay for the grace of the gods. With the helping hands of the people of Rhodes, the building of the colossus begins."
 dhe_colossus_of_rhodes.11.desc:0 "The great Colossus of Rhodes has been completed, now to forever protect the island of Rhodes from hostilities and attacks. A grand statue in pure bronze unlike anything ever seen previously, it is truly a magnificent honour to Helios, the patron god of Rhodes.\n\nThe statue is almost exactly as we originally planned, a shining monument forever memorializing our rule of Rhodes. We are hopeful Helios will observe Rhodes with pride, continuing to protect the city."
 dhe_colossus_of_rhodes.12.desc:0 "The great Colossus of Rhodes has been completed, now to forever protect the island of Rhodes from hostilities and attacks. A grand statue in pure bronze unlike anything seen previously, it is truly a magnificent honour to Helios, the patron god of Rhodes.\n\nThe result of our arduous work is greater than our architects had ever imagined, the colossus larger and more adorned than our plans originally stated. We are definite Helios will observe Rhodes with pride, forever holding his protecting hand over the city."
 dhe_colossus_of_rhodes.13.desc:0 "The great Colossus of Rhodes has seen many a battle, but it finally falls as the city is taken by hostile forces. It is unclear how it happened in the chaos of the siege, but the magnificent bronze statue has broken apart, pieces lying all around the harbour and port.\n\nBeyond repair, it is truly a blow to the moral of our people."
 dhe_earthquake.1.desc:0 "There has been a massive earthquake centred upon [SCOPE.sP('randomized_country_province').GetName], with a large amount of casualties and some significant damage upon the city itself. The nearby cities and areas have also seen some issues, though nowhere near the deafening issues caused in [SCOPE.sP('randomized_country_province').GetName].\n\nOur people are looking for us to set aside some of our funds to attempt and assist those in need, to make the best out of the situation."
 dhe_earthquake.2.desc:1 "There has been a massive earthquake centred upon the territory of [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetOwner.GetName]. Most of our cities in that region are largely unaffected, with the exception of [SCOPE.sP('randomized_earthquake_province').GetName], and there are only some casualties and minor damages to the area.\n\nThe people of [SCOPE.sP('randomized_earthquake_province').GetName] are looking for us to assist and speed up the recovery process."
 dhe_earthquake.2.a:0 "Some funds will be set aside to assist them."
 dhe_earthquake.3.desc:0 "The earth itself has opened up to swallow [SCOPE.sP('randomized_country_province').GetName], leaving destruction and casualties behind. The quakes has reached far and wide, sowing chaos in its wake. Our people look to us for leadership in this tragedy, and demand action to resolve the crisis.\n\nIf we do not demonstrate a stable rule in these troubled times, we are assured to have a lot of angry peasants in our lands. For who else will save them, unless we do so?"
 dhe_earthquake.3.a:0 "We have to assist those left behind."
 dhe_earthquake.4.desc:1 "The earth has swallowed the territory of [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetOwner.GetName]. Though most of the destruction is outside of our borders, it seems [SCOPE.sP('randomized_earthquake_province').GetName] as one of the neighbours of the region has taken a brunt of the damage as well, leaving casualties and damage behind.\n\nOur people look to us for guidance in these troubled times. Though it is only a minor region of our nation that has been struggling."
 dhe_earthquake.4.a:0 "We will assist those in [SCOPE.sP('randomized_country_province').GetName]."
 dhe_earthquake.6.desc:0 "Several years has passed since the destructive earthquake swallowed large parts of [SCOPE.sP('randomized_country_province').GetName] brutally, and left our nation with the tragedy. Though a lot of nations would have let the crisis bring them down, the catastrophe ended up as a moment for all of [ROOT.GetCountry.GetName] to come together and construct a novel future. Our leadership through the arduous times is still remembered well, and few question it these days."
 dhe_volcano.1.desc:0 "A large rumbling sound is the only warning our people receive before [ROOT.GetCountry.Custom('get_nearby_volcano')] erupts, spouting large amounts of ash and lava throughout [SCOPE.sP('volcano_city').GetName] and the nearby provinces. Most of those living in the area have little to no time to prepare themselves for the danger, and there is a large number of casualties and destruction across the area.\n\n[SCOPE.sP('volcano_city').GetName] gets entirely buried by the volcanic ash and lava from [ROOT.GetCountry.Custom('get_nearby_volcano')], leaving the area almost uninhabitable. Some people have started wondering if this is some sort of punishment sent by the gods, if we have offended or insulted them in one way or another."
 dhe_volcano.2.desc:1 "A large rumbling sound is the only warning our people receive before [ROOT.GetCountry.Custom('get_nearby_volcano')] erupts, spouting large amounts of ash and lava throughout the nearby [volcano_city.Custom('get_city_type_loc')] of [SCOPE.sP('volcano_city').GetName] in [SCOPE.sP('volcano_city').GetOwner.GetName]. Several of our cities in the vicinity of the volcano are ruined and damaged by the eruption, and we are given a report of a huge number of casualties.\n\nWith [SCOPE.sP('volcano_city').GetName] almost entirely buried by volcanic ash and lava, some have started wondering if this is a punishment sent by the gods to discipline [SCOPE.sP('volcano_city').GetOwner.GetName]."
 dhe_volcano.2.a:0 "We need to assist these survivors."
 dhe_fortune_cult.1.desc:0 "Lately we have seen growing numbers of people following [ROOT.GetCountry.Custom('get_fortune_goddess')], searching for the fortune of the gods. A priest and [SCOPE.sCharacter('fortuna_character').GetHerHis] minor group of followers have arrived in [SCOPE.sP('randomized_country_province').GetName], looking for a new home for their cult.\n\nThey promise good fortune and that our people will be effectively taken care of, if they are given some sizeable funds and assistance in getting started."
 dhe_fortune_cult.1.a:0 "The assistance of [ROOT.GetCountry.Custom('get_fortune_goddess')] and her followers is appreciated."
 dhe_fortune_cult.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName] has been offered a position among the followers of [ROOT.GetCountry.Custom('get_fortune_goddess')], in return for a larger degree of religious independence among our people.\n\nThere has been a massive growing support for the Cult of Fortune since it was introduced to [ROOT.GetCountry.GetName], and it would assuredly be seen as a popular move to take part in the rites and ceremonies."
 dhe_fortune_cult.3.desc:1 "Some of the followers of [ROOT.GetCountry.Custom('get_fortune_goddess')] are asking us for funds to construct a shrine to their goddess in the territory of [SCOPE.sP('randomized_country_province').GetName], [SCOPE.sP('randomized_country_province').GetState.GetShortName]. It would assuredly be a blessing to the city, as well as a new shrine and area for the people to congregate.\n\nThough it is not stated outright, it is implied that a lack of reverence and assistance would turn [ROOT.GetCountry.Custom('get_fortune_goddess')] against our nation."
 dhe_fortune_cult.3.b:0 "We wish them fortune finding funds in another location."
 dhe_fortune_cult.4.desc:0 "The priests and members of the Cult of Fortune has started planning a grand project just outside our capital city, [ROOT.GetCountry.GetCapital.GetName]. Their goal is to create a novel sacred site for the Cult of Fortune, a place to assemble all their resources and leaders, as well as attract novel members and interest in their rites and celebrations.\n\nNow they are asking us for the rights and assistance in funding the project. Assuredly, such an edifice would attract followers from far and wide to see the spectacle, and it would place us in the Goddess' good graces."
 dhe_fortune_cult.4.b:0 "[ROOT.GetCountry.GetCapital.GetName] do not require such a temple, nor will we permit it."
 dhe_isis_cult.1.desc:1 "An Egyptian ship has docked at the port in our [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName], carrying a priest of the Isis cult amongst its cargo. The Egyptian goddess has seen a growing cult in her honour, with all the rites and celebrations one usually sees among the mystery cults of the Greek pantheon.\n\nThe cult is certain to set their sights on [ROOT.GetCountry.GetName] if we let them, and start sharing their teachings among our locals, though we have heard a lot of good things concerning this cult. Maybe it is for the better?"
 dhe_isis_cult.1.b:0 "There is no necessity for an Egyptian goddess in [SCOPE.sP('randomized_country_province').GetName]."
 dhe_isis_cult.2.desc:1 "The cult of Isis has started spreading and making their way into our [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetState.GetShortName]. They are looking for our aid in securing a position among the populace, and will happily pay for our assistance.\n\nOpening up the city to these foreign elements would limit our religious authority, and we should consider carefully if the money is worth that price."
 dhe_isis_cult.2.b:0 "We do not desire these cultists to ruin [SCOPE.sP('randomized_country_province').GetName]."
 dhe_isis_cult.3.a:0 "We will protect and assist the Isis followers."
 dhe_isis_cult.3.b:0 "There must be a method to appease both sides."
 dhe_isis_cult.4.desc:1 "The locals and the cult of Isis has clashed through the streets of the [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetState.GetShortName] numerous times in recent months. It finally came to a head recently, with the murder of a local peasant by an Isis cultist.\n\nBefore our soldiers managed to calm the locals, all the members of the Isis cult in the area were murdered and the cult entirely wiped out."
 dhe_isis_cult.5.desc:0 "A group of families have left [SCOPE.sP('randomized_egyptian_province').GetName] in [SCOPE.sP('randomized_egyptian_province').GetOwner.GetName] to come to [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetState.GetShortName], supposedly being directed by Isis herself to search for the local Isis Cult and to take part in their rites and ceremonies. As compensation, the local cult has decided to offer us some compensation for taking in the families and giving them a place to stay and live."
 dhe_isis_cult.5.a:0 "That seems... just?"
 dhe_isis_cult.6.desc:1 "The local cult of Isis in the territory of [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetState.GetShortName] has offered us a small sum of gold in return for supporting the building of a shrine to their goddess in the city. The cult has become ever more popular in the city as time has passed, and they want to celebrate it with a shrine for the followers and cultists.\n\nGiving the cult even more room would assuredly expose even more of our people up for their beliefs, and would lessen our religious authority in [SCOPE.sP('randomized_country_province').GetName]. Declining this request might bring more of our people back to our own beliefs."
 isis_cult_major_crisis.tt:0 "The entire #Y Kemetic#! population in #Y [THIS.GetProvince.GetName]#! has been murdered."
 dhe_roman_warm_period.1.desc:0 "Our people, farmers and nobles alike, assert the weather has gotten warmer and the growth has improved these last years. At first it seemed like a random happenstance, but the more we consider the fact, we must assuredly have been blessed by one of the gods or goddesses.\n\nBlessed or not, our people are happy about the changes."
 dhe_buddhism.1.desc:1 "A well known Buddhist teacher has travelled through our [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName] in [SCOPE.sP('randomized_country_province').GetState.GetShortName] and the area in the vicinity of the province. We have seen a large group of people who has converted to the male's beliefs, changing their ways to pursue the teachings of this Gautama Buddha of theirs.\n\nThough we originally worried this would cause trouble, they seem peaceful and helpful even to those not following their own teachings. Maybe this Buddha is not completely in the wrong after all?"
 dhe_buddhism.2.t:0 "The Magnificent Buddhist Monks"
 dhe_buddhism.2.desc:0 "Several monks of the Buddhist faith has played an important role in telling our people concerning the Buddha's teachings. In certain cities, like [SCOPE.sP('buddhist_province_1').GetName], a movement has grown around the monks and become a notable political force. Though the monks have not explicitly asked for our assistance, this could be a chance for us to demonstrate our faith and start converting our people properly."
 dhe_buddhism.2.b:0 "Things are already going satisfactorily for them, without our assistance."
 dhe_buddhism.3.desc:0 "After the monks received our aid some years back, we saw several groups turn to Buddhism. However, now the Buddhist elders have started a council to start rooting all the fakes among their ranks. It seems our intention to assist backfired, and had a lot of people pretend to be Buddhist only to take advantage of the real faithful and our gifts of gold.\n\nNow these elders are looking to us to for our assistance in fixing these issues, as we are partly to blame in the first place."
 dhe_buddhism.4.desc:0 "As the Buddhist Council ended, and the disagreements and issues were solved, we have ended up with a large group of loyal Buddhist monks at our hands. We could either have them direct and teach our people, or dispatch them out to start teaching other nations concerning our faith."
 dhe_buddhism.4.a:0 "Dispatch them out."
 dhe_buddhism.4.b:0 "Have them direct our people."
 dhe_buddhism.5.desc:0 "We have received an emissary from [SCOPE.sCountry('original_country').GetName], a monk named [SCOPE.sCharacter('buddhist_monk').GetName]. Apparently a Buddhist scholar, he has been dispatched to teach our people concerning the [SCOPE.sCountry('original_country').GetAdjective] culture and faith, as well as to improve the relations between our two nations."
 dhe_buddhism.5.b:0 "Dispatch him back to [SCOPE.sCountry('original_country').GetName]."
 dhe_jainism.1.desc:0 "A known Jain ascetic has travelled through our territory of [SCOPE.sP('randomized_country_province').GetName], [SCOPE.sP('randomized_country_province').GetState.GetShortName], and the nearby area. His talks, ramblings and speeches usually bring out a lot of people who seem interested in what he has to offer.\n\nThough some attempt to disseminate negative rumours concerning him in the city, he has not done anything specifically for us to disallow people to see him."
 dhe_jainism.1.b:1 "They will not be permitted to pursue this stranger's teachings."
 dhe_city_fall.2.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\nThe city was the home and centre of the budding Roman Republic, known for their ruthless and impressive warfare prowess. Rapidly expanding outwards from their home, they became a major player in the politics of the peninsula, and started interacting with the nations all across the Mediterranean. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.3.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\nSettled by Alexander the Great himself in the middle of his campaign, it is said he foreshadowed the city to become one of the capital cities of his newfound empire. After his demise, the city's importance only grew and it became a home to centre and learning for all Hellenic culture under Ptolemaic leadership. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.3.a:0 "This marvellous city will be protected."
 dhe_city_fall.3.b:0 "We will acquire some of their most impressive artistry with us back home."
 dhe_city_fall.4.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was the ancient capital of the Egyptians, an important centre for commerce and religion. Throughout most of Egyptian history it has played an important role between upper and lower Egypt. Severing that link is only the first of many steps in taking control of the area. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.4.a:0 "We will make sure to preserve this ancient city untouched."
 dhe_city_fall.4.b:0 "Let us acquire some of their awe-inspiring artefacts with us back home."
 dhe_city_fall.5.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] has been the home of the Phoenician merchants since time immemorial. For numerous centuries the merchants of the Phoenician cities travelled as far as Hispania far to the east, and everywhere between the two areas. It was one of the final cities of the region to fall to Alexander when he campaigned via Persia, razing parts of the city for its defiance.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.6.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] has stood at the forefront of the Israelite culture and people for centuries. At the centre of the city stands a grand temple to their god, an impressive edifice unlike any other. The city has roots deep into the past, once the capital of the Israelite Kingdom of Judah, prior to its capture by the Egyptians. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.6.a:1 "We will provide the people of [SCOPE.sP('special_province').GetName] a protecting hand."
 dhe_city_fall.7.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\nThe city was built close to a shrine to Zeus Bottiaaeus, supposedly dedicated by Alexander himself. After the Conqueror's fall, the city was settled by Antigonos Monophthalmos as the sight for his capital. It remains at the crossroads between Anatolia, Syria and Armenia, and plays an important role in the regional politics of the area.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.7.b:1 "Our men will only acquire some of their artistry back home."
 dhe_city_fall.7.c:0 "We will make sure our people acquire everything."
 dhe_city_fall.8.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\nBabylon was built by the Euphrates and was an important city-state and kingdom, being one of the major players of the regional politics of Mesopotamia. With the fall of its independence, it has become one of the more important cities of the Persian Empire, and later on one of the key cities of Alexander the Great. The very same also fell ill and perished in Babylon, commencing the shattering of his own short-lived empire.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.9.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was settled by Seleukos Nikator as his new capital city, lying the very centre of his enormous empire. Standing at the banks of Tigris and close to one of the canals from the Euphrates, it truly is at the crossroads of all the most important trade routes of the region. As a home for a large number of Greeks and Macedonians, it has played an important role in Hellenizing Mesopotamia, in numerous ways being quite similar to the Seleukid Empire itself.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.10.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was for a long time one of the capital cities of the Persian empire, and not only did it play an important role in the nearby region, but it was also a religious centre for the Persian empire as a whole. After being taken by Alexander, huge swaths was burnt to the ground in a drunken revel, supposedly as revenge for the Persian burning of the Acropolis of Athens.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.10.a:0 "We will make sure to preserve the magnificent city untouched."
 dhe_city_fall.10.b:0 "Our soldiers will only acquire a couple of monuments back home."
 dhe_city_fall.11.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] has played an important role in the regional politics for a long time, being both the capital of the Shishunaga and Nanda empires before it was captured by the Mauryans, and eventually became the capital of their empire as well. Being at the centre of several empires and for the commerce of the region has turned [SCOPE.sP('special_province').GetName] into a marvellous city to behold, one that other cities and nations could only hope to copy.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.11.a:0 "[SCOPE.sP('special_province').GetName] will remain untouched."
 dhe_city_fall.12.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] has been the capital of the Syracusan despots for a long time, a centre of learning and technology in Magna Graecia. The city saw a lot of struggles with their Carthaginian neighbours to the south-west, as well as several conflicts with the other Greek city-states in the region.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.12.a:0 "The marvellous city will become a new essential part of [ROOT.GetProvince.GetOwner.GetName]."
 dhe_city_fall.12.b:0 "We will take the most important artefacts, but preserve the city otherwise unharmed."
 dhe_city_fall.13.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was one of the two major actors in the Peloponnesian War, as well as at the head of the Athenian League and one of those who struggled against Persian oppression. It was known as a centre for philosophers from all around Greece, and for their particular democratic process in how their city-state should proceed. After the Macedonians came to the stage in regional politics, Athens has frequently sought to regain their power and independence.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.13.b:0 "We will only acquire some cultural artefacts back home."
 dhe_city_fall.13.c:0 "Acquire everything, leave nothing of value behind."
 dhe_city_fall.14.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was one of the two major actors in the Peloponnesian War, as well as one of the city-states who struggled against Persian oppression. The Lacedaemonians are almost mythical for their undeniable warfare prowess and army vigour, despite their minor population numbers. After the Macedonians came to the stage in regional politics, Sparta lost most of its importance, in huge part because of a declining population.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.14.c:0 "These petty hovels will be ripped apart, if needed, to locate anything of value."
 dhe_city_fall.15.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was a relatively minor city compared to its southern neighbours, until the sudden rise of Macedonian power. After the hegemony of Philip II and the magnificent campaigns of his son, Alexander, the city became one of the richest and most important Greek trade ports, and home to the Macedonian culture that spread all via Persia. \n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.16.desc:2 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] was settled as the capital of Lysimachos, Alexander's only non-Macedonian successor to endure so long. Situated at the Thracian Chersonese, it has played an important role since its founding, both as a major trade port and as a regional centre of administrative power.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.17.desc:1 "The [special_province.Custom('get_city_type_loc')] of [SCOPE.sP('special_province').GetName] has finally fallen to our troops, and is now in our hands.\n\n[SCOPE.sP('special_province').GetName] is well known throughout the Mediterranean for their independent streak as well as their magnificent craftsmen. Though several kings and rulers have temporarily taken control of the island, it has fought back its independence at every turn. Most impressive was a hard fought victory versus Antigonos Monophthalmos and his son Demetrios.\n\nWith the city under our control, our men and advisors wonder how we should treat our old enemy. There have been people asking for us to sack the city to the ground, and bring everything valuable back home to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_city_fall.17.a:0 "The magnificent workers of Rhodes will be left alone."
 dhe_city_fall.17.b:0 "Some of their magnificent glass works will be brought back to [ROOT.GetProvince.GetOwner.GetCapital.GetName]."
 dhe_bactria.1.desc:0 "The Macedonian mayor of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetName], has sent us a messenger asking for assistance in assimilating some of those living in the city. Not only would he like us to teach some of the locals in the city about our culture, but he also desires us to dispatch more people to [SCOPE.sP('country_province').GetName] so they could go forward as an example to the others.\n\nAs the local Bactrians and our own people have had certain issues coming to terms with one another, it would probably lead to conflicts and disagreements if we select not to do anything about the issue."
 dhe_bactria.1.a:0 "We will dispatch some of our men to assist him out."
 dhe_bactria.2.desc:0 "Though the Greeks ruled Bactria for a while, now it is under the auspicious leadership of [ROOT.GetCountry.GetRuler.GetName], a man of Bactrian origin and Greek education. With a leader that can be accepted by both of the groups, it might be time to explore the origins of our culture and region.\n\nWe have been a satrapy under the Achaemenid Empire, Alexander, Antigonos and Seleukos, it is time for us to locate our own route without an overlord."
 dhe_bactria.2.c:0 "And yet our [ROOT.GetCountry.Custom('get_base_government_type')] will perpetually be Greek."
 dhe_bactria.3.desc:0 "A minor noble named Diodotus has become the talk of the [ROOT.GetCountry.Custom('get_base_government_type')] lately, as he seems to take part in everything important that has happened. Be it civic matters, military or to the contrary, he has played an important role in making everything turn out for the better.\n\nIt did not take long until he was invited to our court, to play a more direct role in our government."
 dhe_bactria.4.b:0 "No, we require [ROOT.GetCountry.GetRuler.GetName]."
 dhe_bactria.6.desc:0 "In the far-flung lands where the wild Scythians ride, there are rumours of war. A bright star has appeared, promising the Dahae a novel home amongst the lands to the south, and messengers from all around bring word of preparations in the steppe.\n\nWe would be wise to consider our situation - even the stoic Greek kings should fear this menace, and an invasion of the promised magnitude has the potential to destabilize the world as we know it."
 dhe_slave.1.desc:1 "A hot-headed slave with a talent for oration, by the name of [SCOPE.sChar('incendiary_slave_scope').GetPraenomen], has been stirring up his fellow bondsmen in the [incendiary_slave_city_scope.Custom('get_city_type_loc')] of [SCOPE.sP('incendiary_slave_city_scope').GetName]. The local authorities have so far managed to maintain the situation under control, but the brazen fool continues to hold forth on the corruption and unfairness of the political system, with [SCOPE.sChar('incendiary_slave_ruler').GetName] receiving honourable mentions...\n\nThe slave population of the entire province of [SCOPE.sP('incendiary_slave_city_scope').GetState.GetShortName] has by now heard of his exploits, and the city elites and slave owners are demanding immediate action to ensure the status quo is not disturbed further and any slave rebellion is crushed before it can be allowed to foment..."
 dhe_slave.2.desc:1 "Whether by happy coincidence, the blessings of [ROOT.GetCountry.Custom('get_fortune_goddess')], or just diligent management, for the past year production in the [excellent_conditions_city_scope.Custom('get_city_type_loc')] of [SCOPE.sP('excellent_conditions_city_scope').GetName] has far surpassed the predictions of local bureaucrats and administrators.\n\nWhile we could simply exploit these boons for short term benefit, some have suggested that this is an opportunity to study the organisation of slaves in [SCOPE.sP('excellent_conditions_city_scope').GetName], who by all accounts are an unusually satisfied and productive bunch, and attempt to apply the lessons across the province of [SCOPE.sP('excellent_conditions_city_scope').GetState.GetShortName]. Alternatively, we could naturally simply permit whatever fortune [SCOPE.sP('excellent_conditions_city_scope').GetName] enjoys to run its natural course without interference."
 dhe_slave.2.b:0 "We can apply these lessons throughout the province."
 dhe_slave.3.desc:0 "For the last few days the dark corners of the senate house have been abuzz with the whispers of huddled relics resembling senators. An ambitious freedman of the Libertini has managed to make his way from the alleys of [SCOPE.sP('dhe_slave_politician_birthplace_scope').GetName] to the assembly in [ROOT.GetCountry.GetCapital.GetName], winning local elections with broad popular support.\n\nWhether [SCOPE.sChar('dhe_slave_politician_scope').GetHerHis] success can be attributed to merit or more nefarious means has been a hot topic among his detractors, but in any case, [SCOPE.sChar('dhe_slave_politician_scope').GetPraenomen] and [SCOPE.sChar('dhe_slave_politician_scope').GetHerHis] supporters are demanding [SCOPE.sChar('dhe_slave_politician_scope').GetSheHe] be granted an office befitting [SCOPE.sChar('dhe_slave_politician_scope').GetHerHis] talents.\n\nNaturally, the more traditional members of the house are loath to tolerate his presence at all, and believe the promotion of former slaves demeans their nobility, such as it is..."
 dhe_slave.3.ct:0 "[SCOPE.sChar('dhe_slave_politician_scope').GetName] has a chance to obtain an #Y Office#! suiting [SCOPE.sChar('dhe_slave_politician_scope').GetHerHis] abilities."
 dhe_slave.4.desc:1 "We have been told of a major industrial accident at the extensive works in the vicinity of [SCOPE.sP('dhe_slave_accident_city_scope').GetName], in [SCOPE.sP('dhe_slave_accident_city_scope').GetState.GetShortName]. [SCOPE.sP('dhe_slave_accident_city_scope').GetTradeGoods.GetName] is the main export of the city, and it seems the knuckleheads in charge of the site permitted parts of the structural supports to fall into neglect as they attempted to maintain up with high demand.\n\nA huge collapse all but wiped out the working shift of slaves, and the owners have come groveling to the provincial authorities for compensation to assist with re-establishing production. The slaves themselves are none too happy with the loss of their friends and family, and naturally cagey about returning to work in such conditions.\n\nWithout significant repairs there is no way production can be maintained at anywhere near the previous levels, and the slaves are bound to cause problems without a show of good will."
 dhe_slave.5.desc:1 "The [dhe_slave_harsh_treatment_city_scope.Custom('get_city_type_loc')] of [SCOPE.sP('dhe_slave_harsh_treatment_city_scope').GetName] has been at the centre of growing tensions throughout the province of [SCOPE.sP('dhe_slave_harsh_treatment_city_scope').GetState.GetShortName] caused by the harsh treatment of slaves in pursuit of higher profits. There are reports of pitiful living standards with workers commonly provided with only the bare minimum of food and shelter to ensure their survival and productivity, and unduly harsh treatment and punishments at the slightest excuse of their masters.\n\nTo add injury, members of the senate led by [SCOPE.sChar('dhe_slave_populist_politican').GetName] have taken this issue up as a personal campaign for slave treatment reform, seeking to win the approval of freedmen and pass legislation that will upset the slave owners across the country.\n\nThe balance between populism and sound government is a route that must be walked most carefully..."
 dhe_slave.5.a:0 "This must not be permitted to continue."
 dhe_slave.5.b:0 "They will get used to the method the world works..."
 dhe_slave.6.desc:0 "While slaves are an important part of the economy and social structure of [ROOT.GetCountry.GetName], the sheer number of slaves as a proportion of society has become something of a concern. Some argue that the number of bondsmen, bolstered by our strict manumission policies and the growing practice of debt bondage, must be countered to ensure there are sufficient freedmen to support our military and minor holdings.\n\n[SCOPE.sChar('debt_reformer_scope').GetName] has been in favour of debt bondage reform for some time, no doubt for [SCOPE.sChar('debt_reformer_scope').GetHerHis] own political motives. [SCOPE.sChar('debt_supporter_scope').GetName], on the other hand, is a particularly outspoken supporter of debt bondage, arguing that debtors must not be permitted to escape repaying what is owed nor become a drain on the state through imprisonment.\n\nWe can either exploit this opportunity to redress the increase of the slave population or support the interests of slave holders."
 dhe_slave.6.a:0 "We have sufficient slaves, we require freemen!"
 dhe_slave.6.c:0 "There is no necessity to interfere."
 dhe_slave.7.desc:1 "An impressively hard-working and talented slave named [SCOPE.sChar('slave_family_1').GetName] has climbed to the top of the social ladder against all odds. Born in a stable outside [SCOPE.sP('slave_family_birthplace_scope').GetName], he was educated by his kindly master, worked his way to the head of the household, and was eventually freed. He came to [ROOT.GetCountry.GetCapital.GetName] and profited via some shrewd business deals or other before serving a while as a local magistrate, and has now won election to the [ROOT.GetCountry.Custom('get_court_type')].\n\nThe noble class is predictably ruffled concerning sharing the air they breath, let alone the benches of the [ROOT.GetCountry.Custom('get_court_type')], with a former slave, and the stink has drawn into question our policies on senatorial appointments and the manumission of slaves.\n\nWhile not a patrician by blood, [SCOPE.sChar('slave_family_1').GetPraenomen] is assuredly a well to do man with some influence in the [ROOT.GetCountry.GetName], and no doubt his children, [SCOPE.sChar('slave_family_2').GetPraenomen] and [SCOPE.sChar('slave_family_3').GetPraenomen], have inherited his determination..."
 dhe_slave.7.a:0 "We could do with some novel blood in the senate..."
 dhe_slave.7.b:0 "Ensure they comprehend they are not welcome."
 dhe_slave.7.ct:0 "[SCOPE.sChar('slave_family_1').GetName] and his children will depart for [SCOPE.sC('dhe_slave_family_country').GetName]."
 dhe_slave.8.desc:0 "While the occasionally rakish and louche tendencies of [SCOPE.sChar('unethical_dominus_scope').GetName] are well known throughout the higher circles of [ROOT.GetCountry.GetCapital.GetName], no one was quite prepared for the appalling slew of allegations levelled at [SCOPE.sChar('unethical_dominus_scope').GetHerHim] of late.\n\nThere are growing rumours of terrible indecencies perpetrated on slaves at debauched gatherings honouring [ROOT.GetCountry.Custom('get_wine_god')], where [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] and [SCOPE.sChar('unethical_dominus_scope').GetHerHis] lewd entourage exhibit and debase their latest acquisitions from the emporia of [SCOPE.sP('dhe_slave_scandal_market_flavor_scope').GetName]. [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] denies everything in the most stringent terms, claiming the tales to be lies engineered by [SCOPE.sChar('unethical_dominus_scope').GetHerHis] political opponents.\n\nThe gossip is backed by several witnesses who claim to have been besmirched by [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] personally, slaves and virtuous citizens across [ROOT.GetCountry.GetCapital.GetState.GetShortName] are demanding government sanctioned justice to deter these excesses, and we can no longer ignore the situation."
 dhe_slave.8.a:0 "We will conduct a full and just investigation into this matter."
 dhe_slave.8.ct:0 "Every member of the [SCOPE.sChar('unethical_dominus_scope').GetFamilyDisplayName] family obtains #G 10#! Loyalty@loyalty_icon!"
 dhe_slave.9.desc_1:0 "Although there is still much labour to be done gathering testimony and exploring the specific crimes, both religious and temporal, that [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] may have committed, preliminary findings point heavily to [SCOPE.sChar('unethical_dominus_scope').GetHerHis] guilt.\n\nWhile the investigation is not complete, some have suggested that [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] be prematurely detained in order to ensure [SCOPE.sChar('unethical_dominus_scope').GetSheHe] does not attempt to escape justice, although this will undoubtedly distress the [SCOPE.sChar('unethical_dominus_scope').GetFamilyDisplayName] family even further."
 dhe_slave.9.desc_2:0 "While the investigation into [SCOPE.sChar('unethical_dominus_scope').GetName] was mainly intended as a symbolic gesture to ease tensions, it is clear after some preliminary groundwork by jurists that the accused is essentially guilty beyond all doubt. It is a minor miracle that this did not come to light sooner; the unspeakable goings on at the [SCOPE.sChar('unethical_dominus_scope').GetFamilyDisplayName] villa scarcely bear thinking about.\n\nIt is, however, very arduous to ignore just how much situations like these lend themselves to those less scrupulous and willing to earn the debt and gratitude of their colleagues in need..."
 dhe_slave.9.desc_3:0 "Although there is still much labour to be done gathering testimony and exploring the specific crimes, both religious and temporal, that [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] may have committed, preliminary findings would seem to suggest that the entire corpus of accusations is an elaborate, but baseless, political slander.\n\nWe have not been able to ascertain the source of the calumny; many of the witnesses who came forward have seemingly disappeared, lending credence to the theory that the perpetrator's aim was merely a character assassination. Regardless, it will be a while prior to the investigation is completely wrapped up."
 dhe_slave.9.d:0 "I'm sure we can locate some more witnesses..."
 dhe_slave.10.desc_1:0 "Our messenger has brought word that [SCOPE.sChar('unethical_dominus_scope').GetName] has refused our generous offer. It seems [SCOPE.sChar('unethical_dominus_scope').GetSheHe] puts minor stock in the importance of reputation, or the power of the state."
 dhe_slave.10.a:0 "We will 'ensure a full and just trial'."
 dhe_slave.11.desc_1:0 "It has come to our attention that, earlier today, the city guards sent to arrest [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] at [SCOPE.sChar('unethical_dominus_scope').GetHerHis] villa outside [ROOT.GetCountry.GetCapital.GetName] and bring [SCOPE.sChar('unethical_dominus_scope').GetHerHim] to court found the place deserted. It would seem the coward fled [ROOT.GetCountry.GetName] at dawn with the majority of [SCOPE.sChar('unethical_dominus_scope').GetHerHis] wealth, and pursues refuge with friends abroad.\n\nWhile the investigation succeeded in rooting out and ending [SCOPE.sChar('unethical_dominus_scope').GetHerHis] reign of profligacy, the slaves will no doubt resent our having permitted [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] to escape justice. The guards did, however, fortunately come across a portion of wealth left behind..."
 dhe_slave.11.desc_2:0 "After several weeks of collecting testimony it has become clear that the wild rumours circulating [ROOT.GetCountry.GetCapital.GetName] were merely a farce, engineered to destroy the reputation of a relatively upstanding citizen. More witnesses came forward to defend [SCOPE.sChar('unethical_dominus_scope').GetHerHim], ultimately, than did to corroborate the accusations.\n\n[SCOPE.sChar('unethical_dominus_scope').GetPraenomen] can rest easy, as time repairs the damage done to [SCOPE.sChar('unethical_dominus_scope').GetHerHis] and [SCOPE.sChar('unethical_dominus_scope').GetHerHis] family's reputation. The honourable and transparent conduct of the trial has also found us favour, not only with the slaves angered at the proposed excesses of the wealthy, but with citizens who are satisfied with the impartiality and veracity of our justice system."
 dhe_slave.11.desc_3:0 "The investigation into the accusations versus [SCOPE.sChar('unethical_dominus_scope').GetName] can finally be brought to a close, having well established [SCOPE.sChar('unethical_dominus_scope').GetHerHis] innocence in the matter. A public apology and repudiation of slander has been issued, though the identity of the libels originator remains indeterminate.\n\nWhile the citizens are pleased that their reputations are in safe hands with our justice system, the slaves found the seriousness with which the trial was approached somewhat lacking..."
 dhe_slave.11.desc_4:0 "Despite an earlier lack of evidence versus [SCOPE.sChar('unethical_dominus_scope').GetName], the diligent labour of jurists and the testimony of certain witnesses who are unable to be named has revealed the immorality and culpability of the accused, much to [SCOPE.sChar('unethical_dominus_scope').GetHerHis] shock. No doubt [SCOPE.sChar('unethical_dominus_scope').GetSheHe] thought [SCOPE.sChar('unethical_dominus_scope').GetSheHe] could get away with [SCOPE.sChar('unethical_dominus_scope').GetHerHis] perverse behaviour as a highly respected personage.\n\nThe court is agreed that the accused should pay a reasonable fine as amends for [SCOPE.sChar('unethical_dominus_scope').GetHerHis] misdeeds. Let this be a lesson to any vain degenerates who think they are above the laws of the gods."
 dhe_slave.11.desc_5:0 "A full and just inquiry into the allegations versus [SCOPE.sChar('unethical_dominus_scope').GetName] has found that many of the litigants and witnesses who came forward were merely liars out to defame the good character of a respected citizen.\n\nThe court was satisfied that the pertinence of definite documents and testimonies destroyed due to a leaky roof were of minor importance to the case as an entire, and have confirmed the full exoneration of [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] of any wrong doing in the eyes of the state.\n\nThis is truly a magnificent day for justice and a sound lesson to anyone who wishes to mislead the public or cast aspersions on the good names of the most valuable members of our society. Praise [ROOT.GetCountry.Custom('get_sky_god')]."
 dhe_slave.11.desc_6:0 "The investigation into the accusations versus [SCOPE.sChar('unethical_dominus_scope').GetName] can finally be brought to a close, and has established [SCOPE.sChar('unethical_dominus_scope').GetHerHis] innocence in the matter to the satisfaction of the court. The numerous concerned parties and witnesses have largely been dismissed as disruptive slanderers seeking to undermine the reputation of an important member of society for their own nefarious aims.\n\nWhile there may be some minor backlash over the seriousness with which the trial was conducted, we have at least staved off a major crisis among the slaves while protecting our interests..."
 dhe_slave.11.desc_7:0 "After several weeks of collecting testimony it has become clear that even the wildest rumours circulating [ROOT.GetCountry.GetCapital.GetName] hardly scratched the surface of the wickedness perpetrated by [SCOPE.sChar('unethical_dominus_scope').GetPraenomen], who has committed unspeakable horrors in the name [ROOT.GetCountry.Custom('get_god_of_dead')]. Countless witnesses have come forward, from household slaves to catamites, and the mountain of evidence is unable to be dismissed as mere calumny.\n\nHaving consulted with the most senior religious and juridical experts, there is no doubt that [SCOPE.sChar('unethical_dominus_scope').GetPraenomen] is heinously guilty, in the eyes of the law and [ROOT.GetCountry.Custom('get_sky_god')] both. Yesterday, the high priests joined near all else in baying for [SCOPE.sChar('unethical_dominus_scope').GetHerHis] blood.\n\nWe must now decide what to do with [SCOPE.sChar('unethical_dominus_scope').GetPraenomen]; a lenient punishment will not be viewed favourably by the slaves, but if we are too harsh we risk alienating the entire [SCOPE.sChar('unethical_dominus_scope').GetFamilyDisplayName] family."
 dhe_slave.11.b:0 "A minor fine is all [SCOPE.sChar('unethical_dominus_scope').GetSheHe] deserves."
 dhe_slave.11.g:0 "Free [SCOPE.sChar('unethical_dominus_scope').GetHerHis] slaves and provide them the money."
 dhe_slave.11.it:0 "Every member of the [SCOPE.sChar('unethical_dominus_scope').GetFamilyDisplayName] obtains #G 5#! Loyalty@loyalty_icon!"
 comet.1.desc:1 "A terrifying thunderclap over the skies of [ROOT.GetCountry.GetCapital.GetName] last night heralded a terrifying, awe-inspiring sight. The very fabric of creation seemed rent asunder by flame and smoke as if by [ROOT.GetCountry.Custom('get_sky_god')] himself; people cowered in their homes, seeking to avoid the certainty of the imminent wrath of the divine.\n\nAlmost as soon as this manifestation had appeared, however, it crept away over the horizon, seeming to establish in the territory of our neighbour, [SCOPE.sP('target').GetOwner.GetName].\n\nIn haste, the resident expert in matters of faith was summoned to explain this mystery. According to [SCOPE.sChar('priest').GetPraenomen], this event can only have been a message dispatched by [ROOT.GetCountry.Custom('get_sky_god')], intended to legitimize our position as the chosen people.\n\n[SCOPE.sChar('priest').GetPraenomen] insists that [ROOT.GetCountry.Custom('get_sky_god')] must have made a minor miscalculation when he dispatched this message into the lands of our [SCOPE.sP('target').GetOwner.GetAdjective] neighbours, and that we must do all in our power to possess the [target.Custom('get_city_type_loc')] of [SCOPE.sP('target').GetName], where the divine communique must have landed."
 comet.3.desc:0 "In a ramshackle farm on the outskirts of [SCOPE.sP('target').GetName], a considerable depression in the ground mars the serene terrain. In the midst of this crater, a considerable, immovable rock lies dormant. It is unlike anything our advisors have seen, and a scribe mentions a near-forgotten prophecy of a message sent to our people by [ROOT.GetCountry.Custom('get_sky_god')] himself.\n\nWithin days, multitudes of people have flocked to see this unnatural edifice, many of them in fervent prayer. Truly, it seems that the prophecy was true, and that [ROOT.GetCountry.GetName] has been chosen by [ROOT.GetCountry.Custom('get_sky_god')], to fulfil his bidding."
 comet.4.desc:0 "In the years since our people located the considerable rock of the heavens, the local administration in [SCOPE.sP('target').GetName] has created a shrine about the stone. The rock itself was carved into an imposing idol, and provides our people with comfort and respite in trying times.\n\nOur state of war however, has convinced our chiefest advisors that the security of this divine messenger is at risk, and they advise us to relocate the shrine to [ROOT.GetCountry.GetCapital.GetName]: regardless of the huge effort and cost.\n\nOur military command even believe it will act as a figurehead in this bitter conflict."
 dhe_mithridates.2.desc:1 "[GetCountry('KIO').GetRuler.GetPraenomen], the prince of [GetProvince('(int32)245').GetName], has appeared in [ROOT.GetCountry.GetCapital.GetName] pursuing refuge from the wrath of [mithridates_overlord.GetRuler.GetPraenomen], the ruler of [mithridates_overlord.GetName] who they suspect covets their realm. The aristocrat apparently has wealth to spare, and has promised us gifts if we are willing to assist [mithridates_pontus.GetHerHim].\n\nTaking [mithridates_pontus.GetHerHim] in would assuredly not make us particularly popular in [mithridates_overlord.GetName], but when did we ever really care what they thought of us anyway? These are [ROOT.GetCountry.GetAdjective] lands, and we will decide what will be done here."
 dhe_mithridates.3.desc_1:0 "$dhe_mithridates.3.desc_intro$ has accused us of pretensions to their lands and organising the assassination of their king!"
 dhe_mithridates.3.desc_2:0 "$dhe_mithridates.3.desc_intro$ has been stirred versus their [mithridates_overlord.GetAdjective] overlords by their novel ruler [mithridates_pontus.GetName]!"
 dhe_mithridates.3.desc_3:0 "\n\n[mithridates_pontus.GetName] now leads [mithridates_pontus.GetHerHis] armies versus us, pursuing to carve out a novel realm in Paphlagonia"
 dhe_mithridates.3.desc_5:0 "\n\nThey have now cut all diplomatic ties, refusing to fulfil their promises of tribute and friendship!"
 dhe_mithridates.3.desc_6:0 "$dhe_mithridates.3.desc_intro$ has, under the leadership of their novel ruler [mithridates_pontus.GetName], decided to abandon the city to carve out a novel realm in Paphlagonia!"
 dhe_mithridates.3.desc_8:0 "\n\n[mithridates_pontus.GetName] now leads [mithridates_pontus.GetHerHis] armies versus [mithridates_refuge.GetRuler.GetPraenomen]."
 dhe_mithridates.3.bt:0 "[mithridates_pontus.GetName|Y] has abandoned [GetProvince('(int32)245').GetName|Y] to carve out a novel realm in Paphlagonia."
 dhe_mithridates.3.bt2:0 "[GetProvince('(int32)245').GetName|Y] is now ruled by a novel dynasty as our subject."
 dhe_mithridates.3.ct:0 "We will obtain claims on [mithridates_pontus.GetEmployer.GetAdjective|Y] territory."
 dhe_mithridates.4.desc:0 "Apparently the traitorous snake Mithridates planned to flee to Paphlagonia, though it is somewhat unclear exactly why [SCOPE.sChar('mithridates').GetSheHe] wanted to do so. Some rumours claim [SCOPE.sChar('mithridates').GetSheHe] wanted to conspire with Paphlagonia to improve [SCOPE.sChar('mithridates').GetHerHis] position at court.\n\nIn any case, the Paphlagonians promptly declined [SCOPE.sChar('mithridates').GetHerHis] offers, and returned [SCOPE.sChar('mithridates').GetHerHim] to our court, with apologies for the misunderstanding."
 dhe_mithridates.5.desc:1 "Since our arrival in Paphlagonia, it has become clear that the petty states of northern Asia, which have gone unchecked in the vacuum left by Alexander's demise and the Diadochi armed conflicts, are weak and divided.\n\nThe nobility of Pontus are not convinced by their current leadership, and may willingly accept [mithridates_pontus.GetPraenomen] as their king, especially given [mithridates_pontus.GetHerHis] noble Persian pedigree."
 dhe_mithridates.5.at:0 "We will offer to take over #Y [GetCountry('PON').GetName]#!, absorbing their realm, or we will go to armed conflict with them."
 dhe_mithridates.6.desc:1 "The novel realm [mithridates_pontus.GetPraenomen] has carved out in Paphlagonia has perpetually been seen as menace, but the weakness of our leadership has called into question the value this Persian noble could have to our people as a unifying and resolute ruler of Pontus.\n\nThe fractious bickering since the fall of the Persian empire could at last be behind us..."
 dhe_mithridates.6.a:1 "Novel leadership is warranted."
 dhe_mithridates.7.desc_1:0 "As it happens, they have seen the usefulness of a dynamic and prestigious ruler and agreed to place Pontus into the hands of [mithridates_pontus.GetPraenomen] in a bloodless coup..."
 dhe_mithridates.7.desc_2:0 "Whether cowardly or haughty, they have refused to accept our reasonable terms, favouring their current leadership over the risks associated with upheaval..."
 dhe_mithridates.7.a:1 "Pontus shall be our novel home."
 dhe_mithridates.7.b:0 "The arduous way, then."
 dhe_mithridates.8.desc:1 "[ROOT.GetCountry.GetName] has long been split between the Pontic people of the highlands, and the Greeks living along the coastline. Despite fairly different traditions, they have so far co-existed peacefully, but it is still more difficult to form our administration with the governance of both in mind.\n\nWith the powerful successor kingdoms of Alexander, Greek language and customs have become more widespread, from Magna Graecia all the way to the lands of India in the far east. Maybe it is time we start looking towards a more Hellenistic solution for ourselves as well?"
 dhe_mithridates.8.a.tt:0 "This option will unlock a novel decision: #Y Pontic Capital of Sinope#!."
 dhe_mithridates.8.a.tt.2:0 "This option will unlock a novel decision: #Y Embrace Greco-Pontic Omens#!."
 pontic_decision_sinope_capital_desc:0 "It is time to leave our ancient capital behind, and move our administration to Sinope. Settled at a defensive position of the northern Anatolian coastline, it is the perfect location from which to rule our nation."
 pontic_decision_hellenistic_omens_desc:0 "Our people look to numerous different deities, be it Zoroastrian, Cybelene or Hellenic. It is time for us to start celebrating and venerating these gods and goddesses as well, rather than limiting ourselves to only those of our ancient past."
 dhe_iberia.1.desc:0 "As one of the remnants of our past deeds, Pharnavaz has long been a thorn in our side. Now some of our people have started gathering around him, asserting he has more rights to the throne than [ROOT.GetCountry.GetRuler.GetName].\n\nWith their aid, he has raised an army of loyalists ready to serve him, if need arises. Now he looks towards the throne of Iberia, with ambition and avarice."
 dhe_iberia.2.desc:0 "An emissary from Pharnavaz arrives in [ROOT.GetCountry.GetCapital.GetName], demanding that we abdicate the throne and open our doors to the novel king of [ROOT.GetCountry.GetName]. All our advisors, those with dubious loyalties as well as those who advocated armed conflict with Pharnavaz, seem to have disappeared in this hour of necessity.\n\n[ROOT.GetCountry.GetRuler.GetName] spends quite some time considering the demands of the pretender, then he announces his decision with a loud sigh."
 dhe_iberia.2.a:0 "Let us provide [SCOPE.sChar('pharnavaz').GetHerHim] the armed conflict [SCOPE.sChar('pharnavaz').GetSheHe] desires."
 dhe_iberia.2.b:0 "[ROOT.GetCountry.GetName] will not survive a civil war. We would rather provide [SCOPE.sChar('pharnavaz').GetHerHim] the throne."
 dhe_iberia.4.desc:0 "With [SCOPE.sChar('former_ruler').GetName] out of the picture, we have finally obtained our long sought after goal, the throne of Iberia. No longer will it be ruled by the tyrants of the past, now there will be a novel generation of enlightened rulers.\n\n[ROOT.GetCountry.GetRuler.GetName] already has plans for [ROOT.GetCountry.GetCapital.GetName], and how we can make it one of the most magnificent cities of the known world. In time, it will become the jewel of Iberia, a city of the ages."
 dhe_iberia.4.a:0 "It is the beginning of a novel era for [ROOT.GetCountry.GetName]."
 dhe_iberia.5.desc:0 "With the conclusion to the menace posed by Pharnavaz, we can finally place these troubles behind us. With the ambitious prince out of the picture, Iberia will finally have the time to shine and become greater than ever."
 dhe_iberia.5.a:0 "Finally a conclusion to the pretender."
 dhe_iberia.6.t:0 "Constructing [ROOT.GetCountry.GetCapital.GetName]"
 dhe_iberia.6.desc:0 "Since he took the throne of Iberia, [SCOPE.sChar('pharnavaz').GetName] has created extensive plans on how to expand and administer [SCOPE.sP('pharnavaz_capital').GetName] more effectively. To create it the shining capital of his magnificent empire, [SCOPE.sChar('pharnavaz').GetPraenomen] is willing to take considerable steps in rebuilding everything from the bottom up.\n\nSome of his advisors have suggested we might have more important matters to attend to right now, however, and that the plans should be set aside for now. Pharnavaz points out that it would be more expensive to pick up these plans again at a later point though, particularly now that everyone has prepared for the reconstruction."
 dhe_iberia.6.b.tt:0 "[SCOPE.sChar('pharnavaz').GetName] will set aside these plans for now. This will unlock a novel decision so the construction can continue at a later point."
 dhe_iberia.7.desc:0 "Though it seemed Pharnavaz had prepared everything for the reconstruction of [SCOPE.sP('pharnavaz_capital').GetName], a lot of the workers complain concerning the lack of materials at hand. It is unclear if they are doing more than was originally asked of them, or if some of the materials have been lost or disappeared, but it is clear we need to get our hands on more.\n\nA couple of merchants have dropped by to peddle their goods while we work on the reconstruction, or we could have our slaves take care of the issue."
 dhe_iberia.8.desc:0 "As our labour on the reconstruction of [SCOPE.sP('pharnavaz_capital').GetName] continues, we have seen a large influx of merchants looking for opportunities to peddle their wares in the region.\n\nWe could look to establish them in the area, as we are already reconstructing parts of the city, or we could use this chance to sell them some of our unnecessary goods."
 dhe_iberia.8.b:0 "They are free to do some exchange with us."
 dhe_iberia.9.t:0 "The Magnificent Capital of [ROOT.GetCountry.GetName]"
 dhe_iberia.9.desc:0 "After a lot of labour over the last couple of months, the city has finally been completed. The large streets, the newly founded administration, and the numerous housing sections, it was all as Pharnavaz had planned from the start.\n\nAlready the stories of [SCOPE.sP('pharnavaz_capital').GetName] have disseminated far and wide, and we have started receiving emissaries from distant nations coming to look at our marvellous city."
 dhe_iberia.10.desc:0 "Our [SCOPE.sChar('high_priest').GetOffice.GetCulturalName(ROOT.GetCountry)], [SCOPE.sChar('high_priest').GetName] has been in talks with several other notable priests and priestesses of the local faiths here in [ROOT.GetCountry.GetCapital.GetName]. As our people are all under different deities, traditions and celebrations, it is arduous to have them come together to agree on any kind of doctrine for our people to pursue.\n\nThe priests think it might be time to attempt to create a novel public monument the people can assemble around. It would be a wise move to start looking to centralize the faith our people pursue."
 dhe_iberia.10.a.tt:0 "[SCOPE.sChar('pharnavaz').GetName] commences the labour on the Armazi Idol in [SCOPE.sP('armazi_idol_province').GetName]"
 dhe_iberia.10.b:0 "We would rather spend our funds in another location."
 dhe_iberia.11.desc:0 "Our labour on the Armazi Idol has started attracting unwelcome elements of our society, that harasses our workers and prove difficult to deal with. After a particularly nasty case where several of the locals were harmed, it is clear something needs to be done to conclude these troubles."
 dhe_iberia.12.desc:0 "As our labour on the Armazi Idol progresses, we see a lot of people from the outskirts of the country are starting to make trips to [SCOPE.sP('armazi_idol_province').GetName] to see how it is turning out. Already it has started having a positive effect on the faith of our people.\n\nIf this trend continues, we are sure to be able to reap the benefits of our arduous labour shortly."
 dhe_iberia.12.a:0 "It is all the labour of Pharnavaz."
 dhe_iberia.13.desc:0 "After months of working tirelessly to elevate the idol in [SCOPE.sP('armazi_idol_province').GetName], we are finally ready to reveal the completed version. People from all throughout the region assemble in the streets to attempt and catch a glimpse of it, most of them in awe at the large bronze work. If their belief in our gods was ever in doubt, that will not be the case from now on."
 dhe_iberia.13.a:0 "It will remain as a testament to our faith."
 iberia_improving_capital_decision_desc:0 "Pharnavaz have long had several ideas on how to improve the capital, and it is time to place them into motion now that he is in charge of Iberia. No longer will foreigners look at us as some backwater region, but with envy."
 pharnavaz_capital_improvement_begins_tt:0 "Labour on the improvements commences"
 dhe_iberia.14.desc:0 "Our [SCOPE.sChar('high_priest').GetOffice.GetCulturalName(ROOT.GetCountry)], [SCOPE.sChar('high_priest').GetName], have looked into a novel cult that has arisen in [ROOT.GetCountry.GetName], to a pair of goddesses called Ainina and Danina.\n\nAfter observing their rituals and ceremonies for some weeks, [SCOPE.sChar('high_priest').GetPraenomen] not only accepts the cults in [ROOT.GetCountry.GetName], but [SCOPE.sChar('high_priest').GetSheHe] thinks we should introduce them into our pantheon proper."
 dhe_iberia.14.a:0 "Let us bring in these novel goddesses then."
 dhe_massalia.1.desc:0 "For hundreds of years we have held our trade outposts along the Mediterranean coast and prospered, profiting from trade with the barbarians and founding novel cities ever further from Greece. Even that most famed city Carthage learned to tolerate our co-existence and compete with our merchants, unable to defeat us despite their power.\n\nHowever, the honey tinted days of our fathers are becoming a distant memory. The savages which surround us have benefited from the spread of technology and ideas that came with our arrival. Now their leaders conspire each day to locate methods to unite their people versus the lyre playing wine drinkers who sell them trinkets.\n\n[SCOPE.sChar('dhe_massalia_slv_ruler').Custom('get_salyes_desc')]"
 dhe_massilia.1.at:0 "Massilia (@[THIS.GetCountry.GetFlag]!) will obtain Claims on all neighbouring cities owned by [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetName] (@[SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetFlag]!)"
 dhe_massalia.1.b:0 "Demonstrate them we are better off co-existing."
 dhe_massalia.1.bt:0 "[SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetName] will receive an envoy extolling the virtues of our peaceful merchants and our willingness to adopt greater parity in exchange, if they accept:"
 dhe_massalia.2.desc:0 "The pompous foreign merchants of Massalia have approached [ROOT.GetCountry.GetRulerTitle] [SCOPE.sChar('dhe_massalia_slv_ruler').GetName] with an envoy. It seems those lyre players are growing to fear our gathering strength, and bring honeyed words and trinkets to woo us.\n\nWe have remained relatively peaceful with the Greeks since they arrived on our shores with exquisite goods and novel traditions. We learned to create wine, to mint coins, to create offerings in the Greek manner, but we now see we were being swindled by these peddlers with their stone walls and brazen shields.\n\nNumerous believe it is time we demonstrated the Greeks just how valuable they really are to us and pushed them back into the sea..."
 dhe_massalia.2.bt:0 "#R We will demand Massalia become our tributary under menace of war.#!"
 dhe_massalia.2.c:0 "Dispatch these cowards back to their theatres."
 dhe_massalia.2.ct:0 "[SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetName] (@[SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetFlag]!) will obtain Claims on all neighbouring cities owned by Massilia (@[SCOPE.sChar('dhe_massalia_mas_ruler').GetEmployer.GetFlag]!)"
 dhe_massalia.3.desc_1:0 "The sceptical [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetAdjective]s dispatch disappointing words with our returning envoy, who report that the [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetAdjective] [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetRulerTitle] spurned our gifts and diplomacy, and asking the envoys to depart immediately.\n\nThe assembly is naturally uneasy, the house divided those who see this is an insult or provocation to armed conflict and those who argue the status quo remains unchanged as yet.\n\nIn any case the future of proud [ROOT.GetCountry.GetName] hangs in the balance and we must prepared to defend ourselves."
 dhe_massalia.3.desc_2:0 "The unwashed dogs of [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetName] dispatch galling words with our returning envoy, who report that the [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetAdjective] [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetRulerTitle] spurned our gifts and diplomacy, demanding that we 'bow down or die.'\n\nAll the assembly is in a uproar, with numerous calling for an inquiry to be held into how our requests for friendship could be either so incompetent as to provoke this response or so out of the question that any effort was ever wasted on preparing them.\n\nThe future of proud [ROOT.GetCountry.GetName] hangs in the balance. Will we go to armed conflict, or accept subjugation?"
 dhe_massalia.3.desc_3:0 "The wise [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetAdjective]s dispatch joyous words with our returning envoy, who report that the [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetAdjective] [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetRulerTitle] acceded to our requests for friendship in return for greater commercial co-operation.\n\nThe assembly is surprised to say the least, with the sceptics unhappy that armed conflict has been averted and the proponents of peace celebrating the victory of pen over sword.\n\nThis agreement may damage our prosperity in the short term, but with fortune it has spared our independence in the long."
 dhe_massalia.3.b:0 "If it will provide us peace..."
 dhe_massalia.3.ct:0 "#R [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetName] may declare war on us.#!\nMassilia (@[THIS.GetCountry.GetFlag]!) will obtain Claims on all neighbouring cities owned by [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetName] (@[SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetFlag]!)"
 dhe_massalia.4.desc_1:0 "Our envoy returns from [SCOPE.sChar('dhe_massalia_mas_ruler').GetEmployer.GetName] with the news that [SCOPE.sChar('dhe_massalia_mas_ruler').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_massalia_mas_ruler').GetName] and the pathetic [SCOPE.sChar('dhe_massalia_mas_ruler').GetEmployer.GetAdjective] senate have foolishly refused to accept our generous demand for tribute and are preparing for armed conflict.\n\nAll look with bated breath to [SCOPE.sChar('dhe_massalia_slv_ruler').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_massalia_slv_ruler').GetName] for our next move."
 dhe_massalia.5.desc_1:0 "The travels of our renowned explorer and researcher Pytheas to mythical Bretannike and beyond met with equal portions of derision and wonder when he returned, but there is no denying that the expedition awakened a novel curiosity for the lands that lay beyond the edges of our maps in the [ROOT.GetCountry.GetAdjective] and wider Hellenistic world.\n\nWhile expensive, there are advocates in the government for further expeditions, this time crewed by the capable [SCOPE.sChar('pytheas_scope').GetName]. However, numerous more distrust the wild claims of Pytheas as self-aggrandizing prevarications. They argue the money would be better spent on focusing our existing commercial and study efforts using what we have already learned - if it is at all useful."
 dhe_massalia.5.desc_2:0 "The travels of our renowned explorer and researcher [SCOPE.sChar('pytheas_scope').GetPraenomen] to mythical Bretannike and beyond met with equal portions of derision and wonder when [SCOPE.sChar('pytheas_scope').GetSheHe] returned, but there is no denying that the expedition awakened a novel curiosity for the lands that lay beyond the edges of our maps in the [ROOT.GetCountry.GetAdjective] and wider Hellenistic world.\n\nWhile expensive, there are advocates in the government for further expeditions, crewed once again by the experienced [SCOPE.sChar('pytheas_scope').GetPraenomen]. However, numerous more distrust the wild claims of Pytheas as self-aggrandizing prevarications. They argue the money would be better spent on focusing our existing commercial and study efforts using what we have already learned - if it is at all useful."
 dhe_massalia.5.a:0 "Encourage commercial adventures."
 dhe_massalia.5.c:0 "There is perpetually more to learn!"
 dhe_massalia.6.desc:0 "[SCOPE.sChar('pytheas_scope').Custom('get_massalia_6_desc')], hoping to discover the source of barbarian tin and other valuable commercial goods. He allegedly passed Galatia and rounded a vast island named Bretannike prior to navigating to Thule itself, the frigid edge of this world, returning with beautiful electrum gems that shine like the sun - there may yet be more to discover to the north.\n\nThen again, hundreds of years ago another of our explorers, Euthymenes, navigated south after the Pillars of Heracles and discovered a considerable river so vast it made the ocean brackish, perhaps even surpassing the Nile in size, prior to turning home.\n\nStrange Bretannike seems the safest option; the logs and experiences of some of the crew of the first expedition are still fairly fresh. However, [SCOPE.sChar('pytheas_scope').GetPraenomen] [SCOPE.sChar('pytheas_scope').GetHerselfHimself] obstinately lobbies to navigate to wholly new lands that lie to the west, full of curious notions of a land across the encircling sea - no doubt allured by tales of Atlantis..."
 dhe_massalia.6.ct:0 "[SCOPE.sChar('pytheas_scope').GetPraenomen] will navigate around Libya and the Atlas Mountains heading south, a journey of hazard."
 dhe_massalia.6.d:0 "West, throughout vast Okeanos himself!"
 dhe_massalia.6.dt:0 "[SCOPE.sChar('pytheas_scope').GetPraenomen] will attempt to reach the edge of the world-encircling ocean, a nigh impossible insanity."
 dhe_massalia.7.desc:0 "The departure of the expedition [ROOT.GetCountry.Custom('get_pytheas_destination')] is nigh. The vessel is provisioned, the sailors have said their goodbyes, and a suitable captain by the name of [SCOPE.sChar('massilia_captain_name_scope').GetPraenomen] waits on deck for [SCOPE.sChar('pytheas_scope').GetPraenomen] to say the word.\n\nExcited children and wailing women wave from the jetty as the vessel passes from the harbour and unfurls its sails...\n\nIt may be some time before we hear of [SCOPE.sChar('pytheas_scope').GetPraenomen] again."
 dhe_massalia.7.a:0 "May [ROOT.GetCountry.Custom('get_sea_god')] assist [SCOPE.sChar('pytheas_scope').GetHerHim], and [ROOT.GetCountry.Custom('get_commerce_god')] direct [SCOPE.sChar('pytheas_scope').GetHerHim]."
 dhe_massalia.8.desc_opener:0 "The vessel of our renowned explorer [SCOPE.sChar('pytheas_scope').GetPraenomen] returned to port in [ROOT.GetCountry.GetCapital.GetName] today. Citizens assemble at the theatre to hear the account of [SCOPE.sChar('pytheas_scope').GetHerHis] travels [ROOT.GetCountry.Custom('get_pytheas_destination')]."
 dhe_massalia.8.desc_closer_fail:0 "We have nothing to demonstrate for our investment in [SCOPE.sChar('pytheas_scope').GetPraenomen]..."
 dhe_massalia.8.desc_1:0 "$dhe_massalia.8.desc_opener_fail$\n\n[SCOPE.sChar('pytheas_scope').GetSheHe|U] asserts that a cascade of pirates descended on their vessel in such a manner that there was no hope of escape. The crew were held captive while the brigands navigated from port to port selling their loot, eventually escaping and buying passage home on credit...\n\n$dhe_massalia.8.desc_closer_fail$"
 dhe_massalia.8.desc_2:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetSheHe|U] first speaks of a terrible tempest that all but sank the expedition, explaining that the northern waters are mercilessly treacherous.\n\nUpon reaching the island, [SCOPE.sChar('pytheas_scope').GetPraenomen] went inland to collect supplies for repairs and was welcomed at the court of [SCOPE.sChar('dhe_massalia_brit_scope').GetEmployer.GetName]. Now fearing the ocean, some sailors decided to stay while [SCOPE.sChar('pytheas_scope').GetPraenomen] explored and collected information for a treatise on [ROOT.GetCountry.Custom('get_pytheas_study_subject')]. Alas, when [SCOPE.sChar('pytheas_scope').GetSheHe] returned they had adopted local wives and abandoned [SCOPE.sChar('pytheas_scope').GetHerHim] entirely.\n\nThankfully the return journey was far less dramatic, and we have learned much of the peoples and geography of the island."
 dhe_massalia.8.desc_4:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] descends into a deeply disturbing and puzzling account commencing with a meeting with some locals of a place called [SCOPE.sChar('dhe_massalia_brit_scope').GetEmployer.GetName]. Their seers spun tales of magnificent riches held by a chief at the conclusion of a considerable river - perhaps the island's largest.\n\nOvertaken with avarice, the crew navigated for the accursed treasure. Heedless desire took the lives of half the crew by blade and water before [SCOPE.sChar('pytheas_scope').GetPraenomen] could convince the rest to head home and depart the wretched waterway and island for good.\n\nThankfully, all the while [SCOPE.sChar('pytheas_scope').GetPraenomen] had been taking notes and emerged unscathed - [SCOPE.sChar('pytheas_scope').GetSheHe] now prepares to compile a detailed account of the voyage, focusing on [ROOT.GetCountry.Custom('get_pytheas_study_subject')]."
 dhe_massalia.8.desc_5:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] asserts to have discovered further lands beyond the island of Bretannike while searching for the mythical land of Thule. Sailing due east they followed the coast of Galatia past numerous rivers, and turned north. They came upon a considerable channel separating an island even greater in size than Bretannike but far less temperate.\n\nLanding along the coast in a place called [SCOPE.sCountry('dhe_massalia_thule_scope')], they conversed with the peoples of this strange land who wear orange jewels and live in magnificent wooden halls like overturned vessels. The days are drag long in summer and disconcertingly brief in winter, which brings miserable snow and ice to the land and sea."
 dhe_massalia.8.desc_6:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] brings word of a flat sandy land beyond Bretanikke which dwarfs it in size and is carpeted with endless pine forests, broken by lakes and streams. The weather is temperate in summer but bitterly cold in winter, a time when the locals retreat to their wooden houses and feast on honey wine and roasted boar.\n\nA vast channel weaves its way between this land and ours, and though the near side must be across from Massalia, it bears no resemblance to our home. The lands here are feral and uncultivated, the people rough and given to martial rituals and hunting above all else. The crew were keen to depart the place, though [SCOPE.sChar('pytheas_scope').GetPraenomen] collected some useful insights into [ROOT.GetCountry.Custom('get_pytheas_study_subject')] prior to returning."
 dhe_massalia.8.desc_7:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] describes a bizarre land at the edge of the world, where the chilling ocean cuts snaking channels through a mountainous bleak coastline. The misty peaks shelter a hardy race of pale barbarians who hunt strange over-sized wildlife and for their thick hides, the land being unsuitable for farming and the weather severe. In winter the sun hardly rises, the night and day battling through the seasons for dominance over the skies.\n\nBeyond this land is a quagmire of tiny islands of ice drifting across an empty sea. [SCOPE.sChar('pytheas_scope').GetPraenomen] asserts to have discovered the limit of the world, as well as much useful information pertaining to [ROOT.GetCountry.Custom('get_pytheas_study_subject')]"
 dhe_massalia.8.desc_8:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetSheHe|U] first talks at length of the strange coast beyond the Pillars of Heracles, passing from scrub to the harshest desert imaginable, then to forests and the lush estuary of a vast river. The people are dark skinned and rich with sailing vessels and cities built of brick. The tides are much greater than in the internal sea, and the winds from the considerable ocean hamper sailing efforts considerably.\n\nIt seems Euthymenes was telling the truth, though it is doubtful that this river could be one and same as the Nile of Egypt. The crew navigated as far they as dared but there was no end to the land in sight, the encircling sea rounding the sun-baked coast far into the distance. [SCOPE.sChar('pytheas_scope').GetPraenomen] is extremely pleased, and has collected much insight into [ROOT.GetCountry.Custom('get_pytheas_study_subject')]."
 dhe_massalia.8.desc_9:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] tells us of expansive lands south of the considerable desert, peopled with strange animals and dark skinned merchants. The vast river of Euthymenes is no myth and extends far inland, though it is surely not the Nile of Egypt, a land which the people don't seem familiar with. [SCOPE.sChar('pytheas_scope').GetPraenomen] and [SCOPE.sChar('pytheas_scope').GetHerHis] crew enjoyed considerable hospitality at the hands of the natives, who are not poor but are familiar with little of Homer and maintain a strange faith.\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] learned much of the differing climate and customs, though [SCOPE.sChar('pytheas_scope').GetHerHis] main focus seems to have been [ROOT.GetCountry.Custom('get_pytheas_study_subject')]. The journey to this place is long and grueling, and the lush estuary quickly gives on to arid scrub-land and forests with no conclusion in sight. Ultimately, despite wishing to continue, [SCOPE.sChar('pytheas_scope').GetPraenomen] gauged the disposition of the crew and turned home, content with [SCOPE.sChar('pytheas_scope').GetHerHis] discoveries."
 dhe_massalia.8.desc_10:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] holds forth on the difficulty of sailing beyond the Pillars of Heracles, where the waves can be large enough to drown vessels and the tides make a mockery of our methods of beaching. A considerable sandstorm enveloped the vessel weeks into their journey, near dispatching them into jagged rocks and definite death. There followed a considerable calm where the vessel drifted for days before a southerly breeze brought them straight to the considerable river of which Euthymenes spake.\n\nThe river lies far across the southern deserts, and the crew were loath to continue when they may encounter a similar desert with no promise of another river beyond it. Ultimately [SCOPE.sChar('pytheas_scope').GetPraenomen] hurriedly completed [SCOPE.sChar('pytheas_scope').GetHerHis] investigation into [ROOT.GetCountry.Custom('get_pytheas_study_subject')] and turned back home, successful at least in proving Euthymenes right."
 dhe_massalia.8.desc_11:0 "$dhe_massalia.8.desc_opener$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] commences a babbling account of a vast continent at the edge of the world. [SCOPE.sChar('pytheas_scope').GetSheHe|U] raves at length of the arduous round trip, hopping westward along a string of islands, each revealed by the gods at the point of despair, before eventually they reached a temperate land peopled by a primitive people of strange appearance.\n\nThey were apparently much interested in the sailors trinkets and exchanged a considerable deal of food for a minor bronze votive, securing the expedition. Asking as to whether a sea lay west beyond the land the locals replied there was none, the continent being vast and endless. [SCOPE.sChar('pytheas_scope').GetPraenomen] asserts [SCOPE.sChar('pytheas_scope').GetSheHe] then completed [SCOPE.sChar('pytheas_scope').GetHerHis] enquiries into [ROOT.GetCountry.Custom('get_pytheas_study_subject')] and turned home by the same line of the islands, spirited by a divine wind."
 dhe_massalia.8.desc_12:0 "$dhe_massalia.8.desc_opener_fail$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] alarmingly states that Carthaginian vessels descended on [SCOPE.sChar('pytheas_scope').GetHerHis] vessel as they approached the Pillars of Heracles, and realising the nature of the voyage refused to permit our ship to pass. They escorted the vessel to our port under menace of open battle.\n\n$dhe_massalia.8.desc_closer_fail$"
 dhe_massalia.8.desc_13:0 "$dhe_massalia.8.desc_opener_fail$\n\nIt seems the incompetence of either the crew or [SCOPE.sChar('pytheas_scope').GetPraenomen] [SCOPE.sChar('pytheas_scope').GetHerselfHimself], whether at the helm, mapboard, or lines, lead swiftly to undermine the vessels seaworthiness. The crew were picked up by passing merchants as they drifted somewhere in the internal sea...\n\n$dhe_massalia.8.desc_closer_fail$"
 dhe_massalia.8.desc_14:0 "$dhe_massalia.8.desc_opener_fail$\n\n[SCOPE.sChar('pytheas_scope').GetPraenomen] reports that soon after departing port a sudden squall descended on the vessel, all but destroying the mast and hurling half the crew overboard. They limped to the nearest harbour and secured passage home, defeated. It seems we did not manage to propitiate hardy [ROOT.GetCountry.Custom('get_sea_god')]\n\n$dhe_massalia.8.desc_closer_fail$"
 dhe_massalia.9.desc:0 "It has been numerous months and we have yet to hear any word of the explorer [SCOPE.sChar('pytheas_scope').GetPraenomen] or [SCOPE.sChar('pytheas_scope').GetHerHis] journey [ROOT.GetCountry.Custom('get_pytheas_destination')]. Numerous in [ROOT.GetCountry.GetName] have already given up hope, so much time having already passed.\n\nThe sea is a treacherous place, and we can only hope that [SCOPE.sChar('pytheas_scope').GetPraenomen] and [SCOPE.sChar('pytheas_scope').GetHerHis] crew will be treated with kindness by the gods..."
 dhe_massalia.10.t:0 "The [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective]-[SCOPE.sC('dhe_massalia_carthage_scope').GetAdjective] Armed conflict"
 dhe_massalia.10.desc:0 "It has come to our attention that the Carthaginians, our long time rivals in commerce and colonisation, have come into conflict with the nascent power of [SCOPE.sC('dhe_massalia_rome_scope').GetName] - a fledgling but successful state in [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetArea.GetRegion.GetName].\n\nSome shrewd ministers have suggested that this could be a perfect opportunity to both undermine the Carthaginians and ingratiate ourselves with a potential regional power by supplying the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective]s with warships.\n\nOur shipyards are quite capable, and as we will not need to worry concerning training crews or officers we could complete construction of a reasonable number of vessels fairly quickly."
 dhe_massalia.10.b:0 "We have no desire to assist [SCOPE.sC('dhe_massalia_rome_scope').GetName]..."
 dhe_massalia.11.desc:0 "The shrewd Greek traders of Massilia have approached us with an offer. They will supply us with the use of their shipyards to aid in the inevitable victory over the Carthaginians, their own rivals of old, in exchange for reasonable compensation.\n\nCarthage's power derives from their fleet, and having more vessels to challenge them would surely assist our cause. However, some ministers are wary of incurring a debt of goodwill with a foreign power, however weak they may appear to be..."
 dhe_massalia.11.c:0 "We have no necessity of aid."
 dhe_massalia.12.desc_1:0 "Our trade envoy has returned from the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective] capital of [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName] with the news that their leaders rejected our generous offer out of hand, apparently wary of falling into a debt of good-will.\n\nWe can only hope the fools can defeat Carthage without our assistance..."
 dhe_massalia.12.desc_2:0 "Our trade envoy has returned from the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective] capital of [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName] with the news that their leaders not only accepted our offer, but have requested double the originally offered number of vessels!\n\nThis will no doubt ensure victory over the Carthaginians as well as fund our shipwrights for years to come!"
 dhe_massalia.12.desc_3:0 "Our trade envoy has returned from the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective] capital of [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName] with the news that their leaders have accepted our generous offer.\n\nMay [ROOT.GetCountry.Custom('get_sky_god')], [ROOT.GetCountry.Custom('get_sea_god')], and all the gods bring them victory versus the Carthaginian menace."
 dhe_massalia.13.desc:0 "We have not forgotten the favours we offered the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective]s in their armed conflict against the Carthaginians. We now find ourselves at war [SCOPE.sC('dhe_massalia_war_scope').GetName], and the more anxious members of our government are advocating calling [SCOPE.sC('dhe_massalia_rome_scope').GetName] to our aid.\n\nThere is naturally no guarantee that they would accept, indeed they may even be insulted at our presumption. Then again, perhaps we are better off saving any potential good will for a future conflict that we have no chance of winning on our own."
 dhe_massalia.13.a:0 "Dispatch word to [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName]."
 dhe_massalia.13.b:0 "We don't require assistance, this time."
 dhe_massalia.13.bt:0 "The favours owed by [SCOPE.sC('dhe_massalia_rome_scope').GetName] may be called upon later."
 dhe_massalia.14.desc:0 "The Greeks of Massilia who aided us in our armed conflict against Carthage have proven the sceptical ministers of our government right. They have approached us asking for aid in their armed conflict against the [SCOPE.sC('dhe_massalia_war_scope').GetAdjective]s in payment of the debt we incurred.\n\nHaughty voices say there is no debt, that the vessels were paid for and that these Massilians should be crucified for their gall. However, the overwhelming feeling is that Massilia have been faithful friends to [SCOPE.sC('dhe_massalia_rome_scope').GetName], and that we should ensure this special relationship, no matter the cost."
 dhe_massalia.14.b:0 "They dispatched vessels. We'll dispatch bodies."
 dhe_massalia.15.desc_1:0 "Our envoy has returned from the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective] capital of [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName] with the bitter news that their leaders have decided to not aid us in our armed conflict against [SCOPE.sC('dhe_massalia_war_scope').GetName].\n\nClearly they fail to comprehend or value our friendship and the assistance rendered unto them versus Carthage."
 dhe_massalia.15.desc_2:0 "Our envoy has returned from the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective] capital of [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName] with the bitter-sweet news that their leaders have decided to not aid us directly in our armed conflict against [SCOPE.sC('dhe_massalia_war_scope').GetName], but instead to direct volunteers and conscripts to our military.\n\nWe can hardly complain, they value our friendship sufficient to aid us, and we are unable to comprehend the problems they face internally..."
 dhe_massalia.15.desc_3:0 "Our envoy has returned from the [SCOPE.sC('dhe_massalia_rome_scope').GetAdjective] capital of [SCOPE.sC('dhe_massalia_rome_scope').GetCapital.GetName] with the joyous news that their leaders have decided to aid us in our armed conflict against [SCOPE.sC('dhe_massalia_war_scope').GetName]!\n\nClearly they comprehend the value of our friendship and the assistance rendered unto them versus Carthage."
 dhe_massalia.15.b:0 "An equitable exchange for vessels..."
 dhe_massalia.16.desc:0 "The Greeks of Massilia have once again launched an expedition to explore beyond the Pillars of Heracles, no doubt searching for commercial opportunities with the barbarians.\n\nTheir previous expedition seems to have yielded minor in the way of results beyond some ravings concerning the tides and spurious tales of mythical islands, but the ports are alive chattering sailors spinning their yarns of the captain's record and how to manage the various horrific beasts that conceal in the considerable ocean."
 dhe_massalia.17.desc:0 "Our scouts and merchants have brought word that a lone vessel of strange but beautiful construction has been spotted off the coast of [ROOT.GetCountry.GetName]. There are reports that brown skinned men in outlandish clothes have bartered for supplies at various points in their journey, asserting that they are explorers from a far off land looking wealth and learning of the rest of the world."
 dhe_heraclea_pontica.1.desc:0 "As Alexander overthrew the ancient Persian empire and acquired control of its ancient areas, the dynasty of King Darius was married to the numerous generals and satraps serving Alexander to secure his novel rule.\n\nOne of his nieces, [ROOT.GetCountry.GetRuler.GetPraenomen], ended up being married to the Macedonian general Crateus. The marriage was shortlived as Craterus desired an alliance with Antipater just a couple of years later, after the demise of Alexander, and dispatched [ROOT.GetCountry.GetRuler.GetPraenomen] to the tyrant of Heraclea Pontica, Dionysus.\n\nAfter the aged tyrant Dionysus passed on, [ROOT.GetCountry.GetRuler.GetPraenomen] has been left in charge of their two sons and the rulership of Heraclea Pontica, and become quite popular among the populace. Though some argued versus Persian rulership at first, they are now quickly becoming used to the idea."
 dhe_heraclea_pontica.1.b:0 "We will bring in [ROOT.GetCountry.GetRuler.GetHerHis] aged countrymen to rule this nation."
 dhe_thrace.1.desc:0 "The despotate of [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetName] lies in the route of future expansion into Bithynia and would create a useful staging point in our conflict with the [SCOPE.sChar('dhe_thrace_antigonus_scope').GetFamilyDisplayAdjective]s to the south.\n\nThe kingdom is ruled by [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_amastris_scope').GetName], niece of the defeated Darius III of Persia. She first married Alexandros' general Krateros, who, changing his mind, arranged her marriage to Dionysios, the fat king of [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetName]. She bore him two sons prior to he ate himself into untimely demise, and now rules the land herself.\n\nMarriage has perpetually been the surest method of forming alliances, and a well placed nuptial could bring their lands into our domain - not to mention the prestige of wedding a princess of Persia."
 dhe_thrace.1.bt:0 "#Y [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName]#! (@[SCOPE.sChar('dhe_thrace_lysimachus_scope').GetCountry.GetFlag]!) will obtain Claims on #Y [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetName]#! (@[SCOPE.sChar('dhe_thrace_amastris_scope').GetCountry.GetFlag]!)"
 dhe_thrace.2.desc:0 "The ongoing conflict between the diadochi kingdoms of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName] and [SCOPE.sChar('dhe_thrace_antigonus_scope').GetEmployer.GetName] has brought the vulnerability of our location between the two warring states to the fore.\n\nNumerous in [ROOT.GetCountry.GetName] fear we will be consumed by a rampaging army or forced to surrender our freedom to the victor once they have esablished their rule over the area. However, it seems the shrewd politics of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen] of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName] may offer a solution.\n\nWhether because of the prestigious breeding of [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_amastris_scope').GetPraenomen] - a niece of the defeated Darius III of Persia - or our strategic position on the [SCOPE.sChar('dhe_thrace_antigonus_scope').GetEmployer.GetAdjective] side of the Bosporos straits, [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen] has asked for the hand of [SCOPE.sChar('dhe_thrace_amastris_scope').GetPraenomen].\n\nShe seems quite taken with the idea, though there are numerous at court who argue this is merely a poorly veiled attack on our sovereignty."
 dhe_thrace.2.bt:0 "#Y [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName]#! (@[SCOPE.sChar('dhe_thrace_lysimachus_scope').GetCountry.GetFlag]!) will obtain Claims on #Y [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetName]#! (@[SCOPE.sChar('dhe_thrace_amastris_scope').GetCountry.GetFlag]!)"
 dhe_thrace.3.desc_1:0 "[SCOPE.sChar('dhe_thrace_oxyathres_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_amastris_scope').GetPraenomen] accepted the proposal of Lysimachos, travelling to [ROOT.GetCountry.GetCapital.GetName] where a lavish ceremony and banquet were held.\n\n[SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen] seems quite taken with his bride, and there were numerous speeches, toasts, and proclomations of the everlasting friendship that has been forged between our two magnificent states.\n\nHowever, with [SCOPE.sChar('dhe_thrace_amastris_scope').GetPraenomen] now in [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetName] now by the side of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen], the direct administration of [SCOPE.sChar('dhe_thrace_oxyathres_scope').GetEmployer.GetName] has fallen to [SCOPE.sChar('dhe_thrace_oxyathres_scope').GetName], and we would be wise to ensure that [SCOPE.sChar('dhe_thrace_oxyathres_scope').GetSheHe] is not tempted by patriots of [SCOPE.sChar('dhe_thrace_oxyathres_scope').GetHerHis] land to disavow the subordinate relationship of [SCOPE.sChar('dhe_thrace_oxyathres_scope').GetEmployer.GetName]..."
 dhe_thrace.3.desc_2:0 "[SCOPE.sChar('dhe_thrace_oxyathres_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_amastris_scope').GetPraenomen] has foolishly declined the proposal of Lysimachos, no doubt the victim of delusions encouraged by [SCOPE.sChar('dhe_thrace_amastris_scope').GetEmployer.GetAdjective] patriots and [SCOPE.sChar('dhe_thrace_antigonus_scope').GetEmployer.GetAdjective] snakes.\n\nWhat a shame that such a prestigious female has decided to hurl her lifes labour in the gutter..."
 dhe_thrace.4.desc:0 "The demise of the ambitious one-eyed general Antigonos must surely herald the beginning of the conclusion for his realm. We have received word that the authority of [SCOPE.sChar('dhe_thrace_demetrias_scope').GetPraenomen], his successor, commences to dissolve in Asia even now, where a defecting general with some knowledge of the area named [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetPraenomen] attempts to carve out a base of power for [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetHerselfHimself] in [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetEmployer.GetCapital.GetName].\n\nBy offering to protect [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetPraenomen] we may achieve our long desired expansion into Asia without tedious battles and sieges. Then again, [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetHerHis] fledgling state is weak - a swift invasion may bear fruit before [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetPraenomen] can assemble [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetHerHis] forces and establish [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetHerHis] rule..."
 dhe_thrace.4.bt:0 "#Y [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName] (@[SCOPE.sChar('dhe_thrace_lysimachus_scope').GetCountry.GetFlag]!)#! obtains Claims on every #Y [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetEmployer.GetAdjective]#! Territory in the Provinces of #Y Mysia#!, #Y Mysia Abrettene#!, and #Y Aeolia#!."
 dhe_thrace.5.desc:0 "The diadochos [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen] - former bodyguard of Megas Alexandros, long time rival of Antigonos, and self proclaimed [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetRulerTitle] of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName] - has dispatched an envoy offering us their protection in exchange for tribute."
 dhe_thrace.5.a:0 "An equitable deal."
 dhe_thrace.5.b:0 "[ROOT.GetCountry.GetName] is liberated."
 dhe_thrace.5.bt:0 "#R #Y [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName] (@[SCOPE.sChar('dhe_thrace_lysimachus_scope').GetCountry.GetFlag]!)#! will obtain Claims on us.#!"
 dhe_thrace.6.desc_2:0 "Our envoy has returned from the court of [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetPraenomen] with dire news: the foolish [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetName] has declined our offer of protection, asserting that [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetSheHe] and [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetHerHis] people are liberated and will not be cowed by the menaces of petty kings."
 dhe_thrace.7.desc:0 "Our spies bring word that the contemptible dotard [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen], self-proclaimed [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetRulerTitle] of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName], spared no time in exploiting our misfortunes and has convinced [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetPraenomen], ruler of the novel state of [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetEmployer.GetName], to accept [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetHerHis] protection as a nominal governor under [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetHerHis] thumb."
 dhe_thrace.8.desc:0 "Our expansion into Asia has encouraged the defection of numerous Phrygian notaries who see the writing on the wall for Antigonos' kingdom.\n\nOne such [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetWomanMan] is [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetName], a well regarded member of the ancient court. Taking advantage of the turbulent situation, [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetPraenomen] has attempted to establish [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetHerselfHimself] in Asia as governor, or even king, of the ancient city of Pergamon.\n\n[SCOPE.sChar('dhe_thrace_philaeterus_scope').GetSheHe|U] approaches us now, offering to govern the region on our behalf and pay tribute to us in exchange."
 dhe_thrace.8.at:0 "#Y Pergamon#! will obtain all our Territory in the Region of #Y Asia#!.\n#Y Pergamon#! will become a #Y Client State#! of #Y [THIS.GetCountry.GetName]#!.\n#Y [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetName]#! will become the ruler of #Y Pergamon#!."
 dhe_thrace.8.b:0 "We can manage it."
 dhe_thrace.9.desc:0 "The lands we call home were carved out of the barbarian wastes of Thrace relatively recently by the vigour and tenacity of Philippos II and his son Alexander the Great. We should not neglect how much blood was spilled, nor how much remains to be done.\n\nPrior, the Odrysian kingdom was the dominant power in the area, and they did not go quietly. The savage Seuthes III has been a constant thorn in Macedonian sides, dispatching raiding parties into the hinterlands and dividing our attention when it could be spent in another location, even in spite of his promised subservience.\n\nAt long last, [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetRulerTitle] [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetPraenomen] has convened a council to discuss our policy towards these brutes..."
 dhe_thrace.9.a:0 "It is time to conclude them."
 dhe_thrace.9.bt2:0 "Some #Y Tribesmen#! pops in these Territories will depart for #Y [SCOPE.sChar('dhe_thrace_seuthes_scope').GetEmployer.GetName]#!."
 dhe_thrace.10.t:0 "[SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetAdjective] Manoeuvres"
 dhe_thrace.10.tt2:0 "#Y [THIS.GetCountry.GetName]#! obtain Claims on the Provinces of #Y Rhodope#! and #Y Haemimontus#!."
 dhe_thrace.10.desc:0 "Our valorous feats of arms and successful raids have demonstrated the invaders of [SCOPE.sChar('dhe_thrace_lysimachus_scope').GetEmployer.GetName] that we are not defeated yet - [SCOPE.sChar('dhe_thrace_seuthes_scope').GetEmployer.GetAdjective]s do not roll over to be conquered like cowards, or accept being forced to serve foreigners as their slaves.\n\nAs we expected, the dogs have once again struck out, no doubt accusing us our past victories as aggression."
 dhe_thrace.10.desc_2:1 "They have treacherously dispatched soldiers to seize the cities along our shared border, demonstrating the true value of their vows and destroying any obligations we might have owed them.\n\nNumerous loyal tribesmen have fled with their families to our stronghold of [SCOPE.sChar('dhe_thrace_seuthes_scope').GetEmployer.GetCapital.GetName], they will unite our banners and defend [SCOPE.sChar('dhe_thrace_seuthes_scope').GetEmployer.GetName] to the last."
 dhe_thrace.10.desc_3:0 "Casting aside any pretense of benevolence, they have dispatched administrators into our lands and the very hall of our [SCOPE.sChar('dhe_thrace_seuthes_scope').GetEmployer.GetRulerTitle] to ensure our compliance with their diktats."
 dhe_thrace.10.ct:0 "[SCOPE.sUnit('dhe_thrace_army_scope').GetName] obtains 6 units of #Y Light Infantry#! @light_infantry!"
 dhe_thrace.11.desc:0 "Heralds bring news from [dhe_thrace_lysimachus_scope.GetEmployer.GetName], where diadochos [dhe_thrace_lysimachus_scope.GetPraenomen] has taken the Persian princess [dhe_thrace_amastris_scope.GetPraenomen], niece of the Persian king of kings Darius III who was defeated by Alexander the Great, as his bride.\n\nSome say [dhe_thrace_lysimachus_scope.GetPraenomen] has been bewitched by folious dreams of barbarian aggrandizement, and desires to legitimize [dhe_thrace_lysimachus_scope.GetHerHis] claim to Alexander's empire. Others, that it is merely a ploy to obtain control of the widowed princess's holdings in Heraclea Pontica - after which [dhe_thrace_lysimachus_scope.GetPraenomen] will cast her aside..."
 dhe_mithridates.9.desc_2:0 "$dhe_mithridates.9.desc_intro$ Now the demise of our king has emboldened them to attempt to overthrow our city's government."
 dhe_mithridates.9.desc:0 "\n\nOur forefathers ruled here before these petty usurpers first sucked air; we must now look to the survival of the Mithridatic dynasty. Some argue we head into the disputed regions of Paphlagonia and collect a following there."
 dhe_mithridates.9.dt:0 "[GetCountry('PRY').GetName|Y] obtains claims on [GetCountry('KIO').GetName|Y]."
 dhe_mithridates.12.desc_1:0 "[mithridates_refuge.GetRuler.GetName] wisely agreed to permit us use of fortress of Kimiata and freedom to raise a host!"
 dhe_mithridates.12.desc_2:0 "[mithridates_refuge.GetRuler.GetName] has arrogantly refused to aid us, fearful of our menace to [mithridates_refuge.GetRuler.GetHerHis] realm."
 dhe_mithridates.12.tt:0 "[GetProvince('(int32)245').GetName|Y] will be abandoned.\nWe will obtain claims in the vicinity of our novel home."
 dhe_mithridates.13.bt:0 "#R Owned territory now bordering the novel [mithridatic_kingdom.GetName|Y] will also defect to them!#!"
