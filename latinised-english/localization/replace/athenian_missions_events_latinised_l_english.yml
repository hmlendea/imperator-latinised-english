l_english:
 me_athens_01_foreign_rulership.1.desc:0 "The Assembly is divided in two, with [independence_head.GetName] leading those looking to return to the ancient days of an independent [ROOT.GetCountry.GetName], and [loyalist_head.GetName] in charge of those who think we should forge a closer bond to [mission_overlord_scope.GetName].\n\nThough the discussions started peacefully, the two sides have grown hostile to one another, leaving the Assembly in a constant state of disarray. Rumours are flourishing about both sides, and neither are willing to back down at this point."
 me_athens_01_foreign_rulership.2.desc:0 "Under the leadership of [loyalist_head.GetPraenomen] and the loyalist faction, a delegate will be dispatched to [mission_overlord_scope.GetName] to see if an embassy can be set up to improve our diplomatic relations. Those who seek independence from our suzerain are up in arms and arguing loudly concerning the loyalist faction ignoring the Assembly."
 me_athens_01_foreign_rulership.2.a.tt:0 "A delegate will be dispatched to [mission_overlord_scope.GetCapital.GetName]."
 me_athens_01_foreign_rulership.3.desc:0 "We have received a delegate from Athens, who wish to establish a minor embassy in [ROOT.GetCountry.GetCapital.GetName] in an attempt to build a closer bond with our nation. To appease and convince us, they brought a significant amount of gold and silver for our ruler."
 me_athens_01_foreign_rulership.4.desc:0 "We have received news from our delegate in [mission_overlord_scope.GetCapital.GetName], who have finally gained permission to start building a delegate in the city. It seems [mission_overlord_scope.GetRulerTitle] [mission_overlord_scope.GetRuler.GetPraenomen] was very approachable and welcoming to our envoys, particularly after [mission_overlord_scope.GetRuler.GetSheHe] received a minor gift."
 me_athens_01_foreign_rulership.5.desc:0 "As the three supervisors the loyalist faction requested from [mission_overlord_scope.GetName] arrive in [ROOT.GetCountry.GetCapital.GetName] with their retinues, the independence faction starts a minor revolt in opposition to their appearance. The chaotic melee is quickly ended by one of the supervisors, [overlord_general_overseer.GetName], a man of some military renown, as [overlord_general_overseer.GetHerHis] men engage the independence faction."
 me_athens_01_foreign_rulership.5.a:0 "We appreciate their assistance with this minor problem."
 me_athens_01_foreign_rulership.6.desc:0 "After a particularly convincing speech by [loyalist_head.GetName], the loyalist faction have managed to convince a majority of the Assembly to start voting in favour of tighter relations with [mission_overlord_scope.GetName], to the chagrin of the independence faction."
 me_athens_01_foreign_rulership.6.a:0 "The commencement of the conclusion of a divided [ROOT.GetCountry.GetName]."
 me_athens_01_foreign_rulership.7.desc:0 "With the independence faction shaken to its core, and quickly losing most of its seats in the Assembly, the loyalist faction has dispatched another minor delegate to [mission_overlord_scope.GetName]. They are looking to have soldiers dispatched to [ROOT.GetCountry.GetCapital.GetName], so they can permanently terminate their rivals, and secure the leadership of the future of [ROOT.GetCountry.GetName] for themselves."
 me_athens_01_foreign_rulership.7.a.tt:0 "A minor delegate is dispatched to [mission_overlord_scope.GetCapital.GetName] in [mission_overlord_scope.GetName]."
 me_athens_01_foreign_rulership.8.desc:0 "Though we have grown closer to [mission_overlord_scope.GetName], our diplomats are politely told they are unable to freely dispatch aid to [ROOT.GetCountry.GetCapital.GetName]. If we desire something from our suzerain, we will have to pay for it."
 me_athens_01_foreign_rulership.8.b:0 "Military expertise, is what we require."
 me_athens_01_foreign_rulership.8.c:0 "We desire nothing, only to offer up a gift to our suzerain."
 me_athens_01_foreign_rulership.10.desc:0 "Under the leadership of the loyalist faction, we have signed a novel treaty with [mission_overlord_scope.GetName], binding us to them more permanently. As the treaty is being signed, the independence faction tries to intervene one last time, with a massive chaotic fight suddenly taking place in the Assembly.\n\nAfter everything has settled down a large part of the independence faction lies dead at our feet, and the [independence_family.GetName] family has either ran off or perished in the melee."
 me_athens_01_foreign_rulership.10.a:0 "A novel course has been charted for our country."
 me_athens_01_foreign_rulership.11.desc:0 "The two sides in the Assembly are once again at each other's throats, until our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetPraenomen], finally manages to sit them down for a debate concerning our dependency on [mission_overlord_scope.GetName]."
 me_athens_01_foreign_rulership.11.a.tt:0 "The independence faction will make a case for a liberated [SCOPE.GetRootScope.GetCountry.GetName]."
 me_athens_01_foreign_rulership.12.desc:0 "After an extended discussion and speech from the independence party, the loyalists are finally about to get their turn. [loyalist_head.GetName] is about to take the stage, waiting for [ROOT.GetCountry.GetRuler.GetName] to announce the next orator."
 me_athens_01_foreign_rulership.12.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] will speak at length concerning the benefits of a liberated [SCOPE.GetRootScope.GetCountry.GetName], stopping the loyalists from making their case.\n\n"
 me_athens_01_foreign_rulership.13.desc:0 "After both sides have made their case, there is a clear bias for the independence side in the Assembly. It seems their speech and case has made an impact on the listeners, and not only those who were yet to decide, but also on some of the loyalists.\n\nSome supervisors from [mission_overlord_scope.GetName] have been watching the discussion, and how it has evolved, and will most probably report back to their [mission_overlord_scope.GetRulerTitle] how things are progressing in [ROOT.GetCountry.GetName]."
 me_athens_01_foreign_rulership.13.a:0 "We will discover who is correct, eventually."
 me_athens_01_foreign_rulership.14.desc:0 "With [loyalist_head.GetName] imprisoned, the head of the loyalist faction, the supervisors of [mission_overlord_scope.GetName] have been run out off [ROOT.GetCountry.GetName], and with them numerous restrictions put on our country.\n\nAfter the independence faction made their move, a large group of young men have flocked to our banners, and independence has become the most interesting topic among the gossip-mongers of the city."
 me_athens_01_foreign_rulership.14.a:0 "A taste of liberty."
 me_athens_01_foreign_rulership.15.desc:0 "Our relationship with [mission_overlord_scope.GetName] has deteriorated noticeably lately, as the people of [ROOT.GetCountry.GetName] yearn for liberty from foreign suzerains once more. The independence faction finds numerous willing followers these days, as people discuss the glory days of ancient times."
 me_athens_01_foreign_rulership.16.desc:0 "If we are ever to live without the protection of [mission_overlord_scope.GetName], we need to be able to assemble our people for the protection of our home. Once [ROOT.GetCountry.GetName] was the most powerful of the Greek city-states, and it could become so once again with the correct mindset and motivation."
 me_athens_01_foreign_rulership.16.a:0 "One day, [ROOT.GetCountry.GetName] will be liberated once more."
 me_athens_01_foreign_rulership.17.a:0 "And so commences the restoration of a greater [ROOT.GetCountry.GetName]."
 me_athens_01_foreign_rulership.18.desc:0 "With a rapid and surprising move, the people of [mission_country.GetName] have decided to throw out every [ROOT.GetCountry.GetAdjective] supervisor and declare themselves independent. They have an extended history of trying to weasel their way out of subservience, and it seems like we need to make an example of these traitors."
 me_athens_02_attica.1.desc:0 "We have completed the first step in restoring some of our ancient power, as all of Attica once again is under our rule. The numerous towns, urban centres, and villages of the region look to us for guidance in these trying times."
 me_athens_02_attica.2.desc:0 "The people of Attica are flourishing, the ancient towns populated, numerous farms restored, and relations improving between the different villages and urban centres. A new Athenian golden age has been the talk of the Assembly lately, as things are improving all around us."
 me_athens_02_attica.2.a:0 "And yet this is just the outset."
 me_athens_02_attica.3.desc:0 "People are flocking to Athens, as we have focused our efforts on improving the city and returning it to the glory of ancient times. No longer is it a vacant reflection of what Athens once was."
 me_athens_02_attica.5.desc:0 "The rich mines of Attica were once at the heart of the Athenian treasury, via the conflicts with Persia and the rise of the Delian League. As we return to our role as one of the major exporters of silver in the Aegean Sea, we will recapture our wealth and importance of ancient times."
 me_athens_02_attica.6.desc:0 "The port city of Piraeus plays an essential role for Athenian commerce and power, as it is the home of our navy and merchants. Without access to its ports, we would not be able to project our power beyond Attica, one of the reasons why the long walls between our two urban centres were constructed in the ancient past.\n\nNow we have set aside wealth to expand upon these ports, so they can be re-established with the rest of Attica."
 me_athens_02_attica.6.a:0 "As Athens develops, so must Piraeus."
 me_athens_02_attica.7.desc:0 "One of our supervisors return with the news that the reconstruction of the Piraen port has finally been completed, and that there were no notable issues or problems that arose as we worked on it."
 me_athens_02_attica.8.desc:0 "The Academy was active through all of our years under the subjugation of others, a home for numerous intellectuals in Greece. As our city is being restored, it makes sense to assist the intellectuals in maintaining their Academy up to modern standards."
 me_athens_02_attica.8.a:0 "A minor tax to pay for the services they provide."
 me_athens_02_attica.9.desc:0 "As the Academy is refurbished and repaired, one of the supervisors suggests that we might expand upon it. If these are the smartest minds of Greece, why not have them assist more actively in the matter of state, he reckons."
 me_athens_02_attica.9.a:0 "They can assist with something that really matters - the state of our military."
 me_athens_02_attica.10.desc:0 "With the Academy restored, now we only need to populate its ancient hallways with novel minds. Once it was the home of people from all across the Mediterranean, and it could be once more."
 me_athens_02_attica.11.a:0 "We consider that [new_intellectual_1.GetName] will fit the Academy perfectly."
 me_athens_02_attica.13.desc:0 "The Academy has been restored to its former glory, and the halls are populated with individuals from throughout the Mediterranean. Hopefully we will be able to get some of these intellectuals to aid us in the governing of [ROOT.GetCountry.GetName] occasionally, after we provided so much assistance in restoring their home."
 me_athens_02_attica.13.a:0 "It seems like an equitable deal, does it not?"
 me_athens_02_attica.15.a:0 "An honour."
 me_athens_02_attica.16.b:0 "It is an honour."
 me_athens_03_political.1.desc:0 "With the assistance of our [GetOffice('office_praetor').GetCulturalName(ROOT.GetCountry)], [thesmothete_scope.GetName], we have been able to return the Council of 500 to its former glory. No longer will the Council be rife with corruption and secrecy."
 me_athens_03_political.2.desc:0 "We have cleared up numerous problems that had arisen between the Council and Assembly, shoring up numerous differences and disagreements between the two, and smoothened the process of passing statutes. Now we can start making the changes we need, to improve our nation, just like Solon once did in ages past."
 me_athens_03_political.2.a:0 "He would be proud of our effort."
 me_athens_03_political.3.a:0 "The threats to our democracy appears in numerous shapes and forms."
 me_athens_03_political.4.desc:0 "The numerous stains on our institutions and history have finally been rectified, as we are returning to older models of our government. No longer will ambitious barbarian kings be able to influence our internal politics."
 me_athens_03_political.4.a:0 "We advise according to the statutes what is best for our people."
 me_athens_03_political.5.desc:0 "We are holding large scale festivals throughout our nation to celebrate the considerable strides we have taken in restoring our democracy to its former glory. Our people will remember this as the start of a novel golden age for [ROOT.GetCountry.GetAdjective] democracy, and [ROOT.GetCountry.GetRuler.GetPraenomen] as another Cleisthenes."
 me_athens_03_political.5.a:0 "Let the festivities commence."
 me_athens_03_political.6.desc:0 "The festivities completed, it is time to return to the more serious matters at hand. A democracy is not the end goal, it is only the outset, and something we will have to actively work to maintain."
 me_athens_03_political.7.a:0 "Charisma comes in numerous forms."
 me_athens_03_political.8.desc:0 "Lately we have seen that the leading elite have become very apt at removing elements of the society they do not care for, some times via outright ostracism, but more often via trials. In particular [ROOT.GetCountry.GetRuler.GetPraenomen] has become known for removing [ROOT.GetCountry.GetRuler.GetHerHis] enemies via political machinations."
 me_athens_03_political.8.a:0 "Superior to murder, is it not?"
 me_athens_03_political.9.a:0 "A conundrum, undoubtedly."
 me_athens_03_political.11.a:0 "If the people do not desire liberty, why offer it to them?"
 me_athens_04_delian_league.1.desc:0 "Almost every voice in the Assembly voted in favour of re-establishing our ancient frontiers after [ROOT.GetCountry.GetRuler.GetName], our [ROOT.GetCountry.GetRulerTitle], concluded [ROOT.GetCountry.GetRuler.GetHerHis] passionate speech. There is no doubt that the people are backing our campaign into the east and north, even though it will be quite an endeavour to take back what was once ours."
 me_athens_04_delian_league.1.a:0 "Prepare the men for conflict."
 me_athens_04_delian_league.2.desc:0 "As we complete the final preparations to commence our campaign, our priests return with good omens from every rite they have held. All of them claim Athena has backed our campaign, and ensured us of victory."
 me_athens_04_delian_league.2.a:0 "Time to re-establish the league."
 me_athens_04_delian_league.3.desc:0 "Our men have convinced the urban centres of [chalkis_province.GetName] and [eretria_province.GetName] to fall under our rule once more. As central Euboea reports back to [ROOT.GetCountry.GetCapital.GetName], it is only a matter of time before the rest of the island will get used to our rule as well, like they did during the golden age of the first Delian League."
 me_athens_04_delian_league.4.desc:0 "Our men have taken control of the area, and we have established a garrison of loyalists to secure the island. Though we saw some opposition at the start, the people quickly quieted down and seem to have gotten used to the idea of the return of their ancient suzerain."
 me_athens_04_delian_league.5.desc:0 "Our soldiers have taken the city-state of [GetProvince('(int32)470').GetName], once the last Delian polis before you left the frontiers of the league. It lays at the crossroads of Greece, Illyria and Magna Graecia, and it is an important trade port that we will surely benefit from controlling."
 me_athens_04_delian_league.6.desc:0 "Our shipwrights have worked to construct a notable navy, and the recruitment of oarsmen to populate these novel ships has gone according to plan. As they get used to their novel jobs, we are starting to see the return of the famous navy of the past, one which could threaten even the Persian Empire."
 me_athens_04_delian_league.6.a:0 "With these vessels we will take control of the Aegean Sea."
 me_athens_04_delian_league.8.desc:0 "As the Diadochi and their kingdoms struggled for supremacy throughout Anatolia and Greece, there was an intense naval arms race taking place between them. Now larger ships are more commonplace, and not having access to them would leave us at the mercy of those who do."
 me_athens_04_delian_league.9.desc:0 "Naxos was the first city-state that dared rebel against the original Delian League, trying to break free from our hegemony. As we continue to spread our influence throughout the Aegean Sea, it is important to keep in mind who to trust and who we need to dominate."
 me_athens_04_delian_league.10.desc:0 "As we continue our campaign to re-establish the ancient Delian League, we have seen the necessity for another treasury. The original treasury was located at Delos, an island recently reacquired by our soldiers - the namesake of the league. Re-establishing the treasury on the island would go a long way to legitimise the restoration of the league."
 me_athens_04_delian_league.10.a.tt:0 "We will start building the novel treasury in Delos."
 me_athens_04_delian_league.11.desc:0 "The construction of the treasury in Delos has been completed, and earlier than we had hoped. We have seen a large influx of gold being dispatched by all the city-states under our control, as they are more willing to part with their gold when it is being dispatched somewhere that is not a direct part of Athens or Attica."
 me_athens_04_delian_league.11.a:0 "Hopefully the treasury will be able to fund our future endeavours."
 me_athens_04_delian_league.12.desc:0 "Our suzerain in Athens has given us the honour to oversee the treasury of all the city-states under their control, and helped us elevate the massive structures where the riches will be set aside."
 me_athens_04_delian_league.12.a:0 "What an honour!"
 me_athens_04_delian_league.13.desc:0 "With some labour, the quarries in Naxos have been restored and expanded upon, making it easier and more rapid for the slaves working there to carve out the marble from the rich deposits in the area."
 me_athens_04_delian_league.13.a:0 "A valuable endeavour."
 me_athens_04_delian_league.14.desc:0 "With the aid of our suzerain, we have managed to expand upon the numerous quarries surrounding Naxos. Now our slaves will be able to extract the marble more efficiently than ever before, and we will be able to export a larger amount of the valuable minerals."
 me_athens_04_delian_league.15.desc:0 "We have finally retaken our ancient colony by the Strymon river, an important city-state in Thracian lands. With the restoration of Amphipolis to our hands, we will be able to project our influence upon the area, and can start returning some of the other colonies in the area to our league."
 me_athens_04_delian_league.16.desc:0 "The people of Samos have finally been emancipated from their oppression, and are now under Athenian control. Few have been as loyal to our cause as the Samians, and we will return their reliability and support with newfound friendship between our two cities."
 me_athens_04_delian_league.16.a:0 "We are just happy we can assist our ancient allies."
 me_athens_04_delian_league.17.desc:0 "With our assistance several shipwrights have been dispatched to Samos to assist them in re-establishing the vessel construction capacity of the city, so they can take the first step in becoming an important military port in the Aegean Sea once more."
 me_athens_04_delian_league.17.a:0 "Whatever we can do, for our ancient friends in Samos."
 me_athens_04_delian_league.18.desc:0 "We have received several shipwrights from Athens, in an attempt to re-establish the shipbuilding trade in Samos. With their aid, we will take our first step in the direction of becoming one of the stronger naval powers of the Aegean Sea once more."
 me_athens_04_delian_league.20.desc:0 "Under our supervision, the walls and infrastructure of the city of Sestos have been greatly expanded, providing even greater control and protection from the Hellespont. As long as we maintain Sestos under control, we should be able to influence the rest of the Thracian city-states as well."
 me_athens_04_delian_league.20.a:0 "An expensive venture, but hopefully a valuable one."
 me_athens_04_delian_league.21.desc:0 "With the aid of our suzerain in Athens, we have been able to expand upon the infrastructure of Sestos, particularly the defences. Though they probably have ulterior motives, it works out well for us as well."
 me_athens_04_delian_league.21.a:0 "We are grateful for their assistance nonetheless."
 me_athens_04_delian_league.22.desc:0 "Messengers bring back news that the mines beyond Amphipolis have come across novel deposits of silver while they were working on expanding and restoring the ancient site."
 me_athens_04_delian_league.22.a:0 "Let the silver circulate."
 me_athens_04_delian_league.23.desc:0 "After we received helped from our suzerain in Athens, we have been able expand upon the local mines greatly. During one of these excavations, our men came across a whole new rich deposit of silver that we will be able to make use of."
 me_athens_04_delian_league.24.desc:0 "We have captured the city of Halikarnassos on the Carian coast, and our soldiers have taken control of the area and established a minor garrison. The legacy of the Hekatomnid dynasty can be seen all around the city, even though they have not been in charge since the demise of their last ruler, Ada."
 me_athens_04_delian_league.25.desc:0 "Like the Hekatomnids before us, we have prioritised our resources on expanding upon the magnificent monuments and structures in Halikarnassos. As we continue to improve upon the city, we see novel methods in which we can continue our progress further."
 me_athens_04_delian_league.26.desc:0 "Before us ruled the Hekatomnids, magnificent builders and magnificent commanders. To live up to their legacy, we have sought the assistance of our suzerain in Athens to improve the city infrastructure and layout. With their aid, things have noticeably changed in a short amount of time, and we have started to see potential for yet greater changes."
 me_athens_04_delian_league.27.desc:0 "We have finally convinced Rhodes to take part in our novel league, and taken control of most important members of the past. We are starting to see the semblance of our hegemony of ancient times, and we have heard the excited gossip in the streets of [ROOT.GetCountry.GetCapital.GetName]."
 me_athens_04_delian_league.28.desc:0 "After we have worked tirelessly to assemble our ancient allies and subjects for numerous years, we have finally managed to secure sufficient political clout to officially re-establish the Delian League. It is time for us to look beyond the frontiers of the original league, as we no longer need to be limited by the ambitions of the past."
