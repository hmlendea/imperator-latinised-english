l_english:
 climate_MAPMODE_DESC:0 "#T Climate Mapmode#!\nThis will colour each territory according to its #Y Climate Type#!."
 simple_terrain_MAPMODE_DESC:3 "#T Simple Terrain Mapmode#!\nThis will colour each territory according to its #Y Terrain Type#!."
 political_MAPMODE_DESC:1 "#T Political Mapmode#!\nThis will colour each #Y Country#! in its unique colour."
 culture_MAPMODE_DESC:2 "#T Culture Mapmode#!\nThis will colour the map according to the dominant #Y Culture #! in each territory."
 religion_MAPMODE_DESC:3 "#T Religion & Sacred Site Mapmode#!\nThis will colour the map according to the dominant #Y Religion #! in each territory and will display all #Y Sacred Sites#! in the currently selected Religions territories."
 area_MAPMODE_DESC:2 "#T Provinces Mapmode#!\nThis will colour the map with a unique shade for each #Y Province#!, so you can see which territories belong together."
 tradegoods_MAPMODE:0 "Barter Goods"
 tradegoods_MAPMODE_DESC:3 "#T Barter Goods Mapmode#!\nThis will colour each territory with a unique shade for each #Y Trade Good#!."
 diplomacy_MAPMODE_DESC:1 "#T Diplomacy Mapmode#!\nThis mapmode shows the selected nation in #G green#!, and colour all countries with whom they have diplomatic relations, according to the relation type."
 population_MAPMODE_DESC:2 "#T Population Mapmode#!\nThis will colour each territory according to its relative #Y Population#!. A brighter green indicates a higher population."
 MAPACTION_FIND_PROVINCE:2 "#T Discover a Location#!\n#I Click to open a menu to search for a country, province or territory!#!"
 barbarian_power_MAPMODE_DESC:0 "#T Barbarian Power Mapmode#!\nThis mapmode will highlight locations liable to spawn #Y Barbarians#!, as well as the strength and development thereof."
 trade_routes_MAPMODE_DESC:0 "#T Trade Route Mapmode#!\nThis mapmode will colour #Y Provinces#! with no spare import routes in white, and #Y Provinces#! with spare import routes in varying shades of #G green#!. The darker the colour, the more unused trade routes are present in the province."
 players_MAPMODE_DESC:0 "#T Player Mapmode#!\nThis will colour all #Y Countries#! currently played by humans, in their unique colour, and will grey out those ruled by AI."
 region_MAPMODE_DESC:2 "#T Region Mapmode#!\nThis will colour the map with a unique shade for each #Y Region#!."
 supply_MAPMODE_DESC:3 "#T Supply Mapmode#!\nThis will colour the map according to the relative #Y Supply Limit#! of each territory. Select an army to see which territories are capable of supporting it."
 civilization_MAPMODE:0 "Civilisation"
 civilization_MAPMODE_DESC:1 "#T Civilisation Mapmode#!\nThis will colour the map according to the relative #Y Civilisation Value#! of each territory."
 holdings_mm_MAPMODE_DESC:0 "#T Holdings Mapmode#!\nSee which characters possess controlling stakes in territories."
