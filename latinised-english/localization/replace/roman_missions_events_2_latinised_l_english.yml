l_english:
 me_roman_8_greece.1.a.tt:0 "#Y [SCOPE.sCountry('negotiate_illyria_country').GetName]#! will become a #Y Tributary#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! if they accept our requirements."
 me_roman_8_greece.1.desc:0 "We have sent an emissary to the pirates of Illyria, to a so-called [SCOPE.sCountry('negotiate_illyria_country').GetRulerTitle] who seems to be in charge of the wild tribes. Our messenger seems to have been poorly treated, and reports back that there is not much point in continuing peaceful discussions with these barbarians, unless we attempt to force them into submission."
 me_roman_8_greece.1.a:0 "Strength is the only thing these pirates comprehend."
 me_roman_8_greece.2.desc:0 "We have received an emissary from the warlike arrogant people of [SCOPE.sCountry('mission_country').GetName], demanding our immediate subjugation to their rule. They are threatening our people with conflict, unless we are willing to pay them regular tributes and show deference to their rules.\n\nThe rest of the council look to [ROOT.GetCountry.GetRuler.GetPraenomen] for [ROOT.GetCountry.GetRuler.GetHerHis] wise leadership, though it seems most of them take it for granted that we will decline this insulting offer."
 me_roman_8_greece.2.a:0 "'Conflict? Hah! Let the pathetic dogs of [SCOPE.sCountry('mission_country').GetName] attempt if they dare.'"
 me_roman_8_greece.2.b:0 "A minor tribute is better than being attacked by the legions of [SCOPE.sCountry('mission_country').GetName]."
 me_roman_8_greece.3.desc:0 "It seems the people of [SCOPE.sCountry('mission_country').GetName] were more civilised than we originally thought, as they have accepted to become tributaries of [ROOT.GetCountry.GetName], and pay their dues. With this, we will hopefully see less of their insulting pirate attacks across the Adriatic Sea."
 me_roman_8_greece.4.desc:0 "Not only was our peaceful emissary to [SCOPE.sCountry('negotiate_illyria_country').GetName] threatened and insulted, but the barbarians mocked our great nation as well. It is time to teach these wild beasts what a precarious situation they have place themselves in."
 me_roman_8_greece.5.desc:0 "As we are looking for potential allies and friends among the Greek republics, our advisors have suggested approaching [SCOPE.sCountry('greek_ally_country').GetName]. As a robust republic with friendly relations with [ROOT.GetCountry.GetName], they seem like a good option."
 me_roman_8_greece.5.a:0 "What greater honour is there, than to be a client of [ROOT.GetCountry.GetName]?"
 me_roman_8_greece.6.desc_1:0 "We have received an emissary from Rome, the great power in the Italian peninsula. They have repeatedly tried to demand and guile us into becoming clients of their growing republic, giving up on our independence to commence providing tribute to their conflict hungry rulers."
 me_roman_8_greece.6.c:0 "We accept their offer, as we require their protection in these trying times."
 me_roman_8_greece.9.desc:0 "The city of Athens used to be the most important city in Greece, a centre for learning, sagacity and thought. After the Peleponnesian conflict and the ravages of time, [SCOPE.sP('current_province').GetName] has been left destitute and the philosophers who once walked its streets are long gone."
 me_roman_8_greece.10.desc:0 "The Lacedaemonians were known far and wide for their expertise in conflict and all things military, but their state slowly dwindled as the Macedonians grew in the north."
 me_roman_8_greece.10.a:0 "It is time to restore [SCOPE.sP('current_province').GetName] as the centre of the Peleponnese."
 me_roman_8_greece.11.desc:0 "[SCOPE.sP('current_province').GetName|U] used to be one of the greatest of the city-states of Greece, standing at the frontier between Attica and the Peleponnese. When the other city-states banded into leagues and alliances to fight one another, Corinth stubbornly stuck to its independence. With the conquerors of Macedon, the ancient city-state was turned into nothing major than a glorified fortification for the Macedonian troops."
 me_roman_8_greece.12.desc:0 "Before the rise of Alexander, Thebes was the most important of the Boeotian urban centres, and played an important role across Greece. After the Thebans stubbornly revolted versus the young conqueror, they were brutally enslaved and the city was torched to the ground. Though restored some decades later, it never quite rose to the power and prominence it once had."
 me_roman_8_greece.13.desc:0 "The strength of [ROOT.GetCountry.GetName] has finally conquered most of Greece, our eyes now focused on the kingdoms of the Successors and ancient Persian territories. As we are continuing our campaigns further eastwards it is important that we know our conquests in Greece have been secured, and with some concessions given to the Greeks it seems that will be the case."
 me_roman_8_greece.13.a.tt.crete:1 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! gains claims on all territories in the Province of #Y Crete#! neither they nor a subject of theirs possess"
 me_roman_8_greece.13.a.tt.aegean_islands:1 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! gains claims on all territories in the Province of #Y $aegean_islands_area$#! neither they nor a subject of theirs possess"
 me_roman_9_eastern_glory.1.t:0 "Client Requirements - [SCOPE.sCountry('possible_ionian_client').GetName]"
 me_roman_9_eastern_glory.1.desc:0 "Now that we have started to look eastwards to the Ionian urban centres of Anatolia for possible clients, our advisors have suggested we dispatch some emissaries to the people of [SCOPE.sCountry('possible_ionian_client').GetName]. An offer of protection should be well appreciated by someone in a precarious position like theirs."
 me_roman_9_eastern_glory.2.t:0 "Roman Requirements"
 me_roman_9_eastern_glory.4.desc:0 "The arrogant people of [SCOPE.sCountry('possible_ionian_client').GetName] have rudely rejected our gracious offer of protection. The insults hurled at our friendly emissaries and our nation is unable to be overlooked, they will have to be punished for their follies."
 me_roman_9_eastern_glory.5.desc:0 "We have had several long and arduous campaigns through the Anatolian plains, over the hills and mountains of Cilicia and all the way to Syria. Our generals have fought bravely, as have the men in their armies, bringing victories to [ROOT.GetCountry.GetName].\n\nLarge triumphs are held in [ROOT.GetCountry.GetCapital.GetName] where the generals parade their treasures and prisoners through the streets, giving them the greatest honours available in [ROOT.GetCountry.GetName]."
 me_roman_9_eastern_glory.5.a.tt.1:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will divide into two pieces, with the Republic taking over the western part and a novel Dictatorship rising in the east.\nCivil conflict starts between the #Y Western Roman Republic#! and the #Y Eastern Roman Dictatorship#!"
 me_roman_9_eastern_glory.6.desc:0 "The people rejoice as the popular ruler celebrates [ROOT.GetCountry.GetRuler.GetHerHis] victory versus the traitors in the west with several large triumphs in our capital of [ROOT.GetCountry.GetCapital.GetName]. With the few retainers of the ancient republic finally gone, we can remove the shackles of the past and move forward with a robust empire led by [ROOT.GetCountry.GetRuler.GetName], our [ROOT.GetCountry.GetRulerTitle]."
 me_roman_9_eastern_glory.7.desc:0 "As we are expanding our influence across the world, and we find our urban centres ever more populous, there is an increasing require for more grain, olives and wine to maintain our people happy.\n\nThe stories say that the rich fertile flood plains of the Nile delta grow more grain than any other place known to man, and our advisors suggest setting up some trade relations with [SCOPE.sCountry('egyptian_country').GetName] to get access to some of this excess."
 me_roman_9_eastern_glory.7.a:0 "We will dispatch a delegation to [SCOPE.sCountry('egyptian_country').GetCapital.GetName]."
 me_roman_9_eastern_glory.9.desc:0 "Our delegation has sent us a messenger to inform us that the people of [SCOPE.sCountry('egyptian_country').GetName] agreed to our offer, and will commence shipping grain to [ROOT.GetCountry.GetCapital.GetName] as soon as they can."
 me_roman_9_eastern_glory.11.desc:0 "Our advisors have started to look towards the minor kings in Anatolia for potential allies or assistance. In particular, [SCOPE.sCountry('asian_kingdom_country').GetRuler.GetPraenomen] of [SCOPE.sCountry('asian_kingdom_country').GetName] seems like an interesting option, and one that might be interested in an alliance or friendship with [ROOT.GetCountry.GetName]."
 me_roman_9_eastern_glory.11.a:0 "Dispatch a diplomatic delegation to [SCOPE.sCountry('asian_kingdom_country').GetCapital.GetName]."
 me_roman_9_eastern_glory.12.desc:0 "[SCOPE.sCountry('rome_country').GetAdjective] delegates have arrived in [ROOT.GetCountry.GetCapital.GetName] seeking the friendship of our people. Though suspicious at first, it seems they are genuinely just looking to construct closer relations with the people of Anatolia, seeking allies and friends they can interact and trade with. How dangerous could a friendship pact with [SCOPE.sCountry('rome_country').GetName] really be?"
 roman_conquest_2.1.desc:0 "With our recent conquest along the eastern Adriatic coastline we have managed to subdue some of the Illyrian and Greek menaces in the area. A Roman colony in the area will secure our conquests for the foreseeable future."
 roman_conquest_2.2.desc:0 "Taking control of the homeland of the Illyrian pirates is only the first step in pacifying the menaces of the east. With the warlike Macedonians to the east, Illyria proper to the north and the arrogant Greeks to the south, there is a lot of labour that remains. Having a safe haven for Romans will be essential to continue our campaigns."
 roman_conquest_2.3.desc:0 "[ROOT.GetProvince.GetName] has finally fallen to our rule, and the question of what we will do with the island has come up repeatedly. Well situated to be our major port in the area, we could either expand on the local walls in the area, or commence structure a fleet to protect it."
 roman_conquest_2.3.b:0 "Dispatch our shipwrights."
 roman_conquest_2.4.desc:0 "The Dardanians have long been a thorn in the side of all their neighbours, no matter who they might be. Though they have been subjugated and place under [ROOT.GetCountry.GetName] rule, we should found a local colony to civilise the region, and introduce [ROOT.GetCountry.GetAdjective] culture and traditions to the tribesmen."
 roman_conquest_2.4.b:0 "At the frontier to Macedonian territory lies [SCOPE.sP('province_two').GetName]."
 roman_conquest_2.5.desc:0 "The mountainous coastline of western Greece have been a difficult region to capture, but the people have finally given up and accepted Roman overlordship. The Epirotes are notoriously difficult to handle, but with a Roman colony adjacent we will have make sure they are not causing too many issues after our armies move on to novel campaigns."
 roman_conquest_2.5.b:0 "[SCOPE.sP('province_two').GetName] located up in the mountains, the ancient capital of the Epirotes."
 roman_conquest_2.6.desc:0 "Once a backwater province, Macedonia rose to prominence under Philip II and Alexander the Great, as the home of the conquerors of the known world. Finally the region has fallen to our troops, and we can secure the last remains of the once great empire. We should settle a colony in the area, to repress any thoughts of trying to raise ancient glories once more."
 roman_conquest_2.7.desc:0 "Finally we have been able to take control of the Peleponnese, home of great urban centres such as [SCOPE.sP('province_one').GetName], [SCOPE.sP('province_four').GetName] and [SCOPE.sP('province_two').GetName]. Once the heart of the civilised world, the arrogant Greeks have fallen upon harsh times, now reduced to subjects of our great nation. A Roman colony in the Peleponnese will remind them of that."
 roman_conquest_2.7.b:0 "The city of [SCOPE.sP('province_two').GetName], one of the greatest harbours of the Peleponnese."
 roman_conquest_2.8.t:0 "Home of Civilisation"
 roman_conquest_2.8.desc:0 "Once at the forefront of civilisation, the heartland of Greece was ravaged and ruined by the Macedonian conquerors, left as nothing more than a shade of what it once was. Though their glory days are long gone, we see the potential development of the area now that we have taken control of it, and a Roman colony is the first step in the right direction."
 roman_conquest_2.8.d:0 "Foremost of the Boeotian urban centres, [SCOPE.sP('province_four').GetName], by Lake Kopaida"
 roman_conquest_2.9.t:0 "The Thracian Territories"
 roman_conquest_2.9.desc:0 "Thrace used to be the terror of northern Greece, home of raiders and origin of the peltasts who became so commonplace in Greek armies. After Alexander conquered the tribes of northern Greece, and the rise of Lysimachos' kingdom, the territory has become more civilised, developed, and used to Greek culture."
 roman_conquest_2.9.c:0 "[SCOPE.sP('province_three').GetName] will protect our newfound Thracian territories from northern aggression."
 roman_conquest_2.10.desc:0 "Bithynia was one of the few regions which stayed independent when Alexander started conquering the Persian empire. After his death, the Bithynians grew more powerful and initiated talks with the Diadochi, independent-minded city-states and minor kingdoms."
 roman_conquest_2.10.a:0 "Structure a colony in [SCOPE.sP('province_one').GetName] close to the Bosphorus seems like a good idea."
 roman_conquest_2.10.b:0 "The rich city-state of [SCOPE.sP('province_two').GetName] will bring newfound affluence to [ROOT.GetCountry.GetName]."
 roman_conquest_2.10.c:0 "[SCOPE.sP('province_three').GetName] is in a fortified important location, with a large valuable harbour."
 roman_conquest_2.11.t:0 "The Pontic Menace"
 roman_conquest_2.11.a:0 "[SCOPE.sP('province_one').GetName] is an ancient rich city-state."
 roman_conquest_2.11.c:0 "Deep in the hinterlands lies the ancient capital of the Pontics, [SCOPE.sP('province_three').GetName]."
 roman_conquest_2.12.desc:0 "The Ionian coastline is the home of many ancient Greek city-states, from rich [SCOPE.sP('province_four').GetName] in the south to the great city [SCOPE.sP('province_one').GetName] in the north. Often succumbing to the danger of the Persian empire to the east, or the greedy Greek kings and autocrats following in Alexander's footsteps, they are now safely under the protection of [ROOT.GetCountry.GetName]."
 roman_conquest_2.12.a:0 "The ancient city of [SCOPE.sP('province_one').GetName] seems a good choice."
 roman_conquest_2.12.b:0 "The temple to Diana in [SCOPE.sP('province_two').GetName] deserves a Roman colony raised in its honour."
 roman_conquest_2.13.t:0 "Urban centres of Syria"
 roman_conquest_2.13.desc:1 "The urban centres of Syria stretch back as far as our stories go, often mixed with the novel Hellenistic urban centres of Alexander and the Diadochi. Ancient cultures and traditions have met novel syncretic ideas and innovations, and creating a population that has often been difficult to control. With our recent conquests, it is time to settle a Roman colony and make our own mark on the area, like so many others have once done."
 roman_conquest_2.13.b:0 "The important harbour of [SCOPE.sP('province_two').GetName]."
 roman_conquest_2.14.desc:0 "$roman_mission_09_eastern_glory_task_10_DESC$ Now that the area has fallen to Rome, we should find a good location for a novel Roman colony."
 roman_conquest_2.14.a:0 "[SCOPE.sP('province_one').GetName] is the greatest of their urban centres, and the only logical choice."
 roman_conquest_2.15.desc:0 "Cilicia has long been a haven for the pirates of the eastern Mediterranean, as the mountainous rocky territory makes it difficult for anyone to be able to track them down and place an end to them. Though we have conquered the territories of Cilicia, controlling the region will be difficult, and we should commence settling some of our citizens across the area to spread our influence over the people who live there."
 roman_conquest_2.16.desc:0 "The rich plains of Anatolia stretch as far as the eye can see, a haven for all kinds of cultures, be it Greek, Persian or the local Anatolians. Trying to control this newfound territory will be difficult, and we should settle some colonies to bring Roman and Latin traditions to the local people."
 roman_conquest_2.16.a:0 "[SCOPE.sP('province_one').GetName] at the centre of Galatia."
 me_roman_6_africa.7.desc:0 "Our advisors have started to look outwards for potential allies or assistance. Particularly [SCOPE.sCountry('cyrenaica').GetRuler.GetPraenomen] of [SCOPE.sCountry('cyrenaica').GetName] seems like an interesting option, and one that might be interested in an alliance or friendship with [ROOT.GetCountry.GetName]."
 me_roman_6_africa.7.a:0 "Dispatch a diplomatic delegation to [SCOPE.sCountry('cyrenaica').GetCapital.GetName]."
 me_roman_6_africa.8.desc:0 "[SCOPE.sCountry('rome_country').GetAdjective] delegates have arrived in [ROOT.GetCountry.GetCapital.GetName] seeking the friendship of our people. Though suspicious at first, it seems they are genuinely just looking to construct closer relations with the people of Africa, seeking allies and friends they can interact and trade with. How dangerous could a friendship pact with [SCOPE.sCountry('rome_country').GetName] really be?"
 me_roman_6_africa.11.desc:0 "Our advisors have started to look towards the minor tribal nations in Numidia for potential allies or assistance. Particularly [SCOPE.sCountry('numidian_tribe_country').GetRuler.GetPraenomen] of [SCOPE.sCountry('numidian_tribe_country').GetName] seems like an interesting option, and one that might be interested in an alliance or friendship with [ROOT.GetCountry.GetName]."
 me_roman_6_africa.11.a:0 "Dispatch a diplomatic delegation to [SCOPE.sCountry('numidian_tribe_country').GetCapital.GetName]."
 me_roman_6_africa.12.desc:0 "[SCOPE.sCountry('rome_country').GetAdjective] delegates have arrived in [ROOT.GetCountry.GetCapital.GetName] seeking the friendship of our people. Though suspicious at first, it seems they are looking for allies and friends in their fight versus Carthage. We must consider their proposal carefully."
 me_roman_6_africa.12.a:0 "We would love to join [SCOPE.sCountry('rome_country').GetName] versus the Carthaginians!"
 me_roman_6_africa.13.desc:0 "Our delegates to [SCOPE.sCountry('numidian_tribe_country').GetName] have sent a messenger back to [ROOT.GetCountry.GetCapital.GetName], bringing good news finally. It seems the people of [SCOPE.sCountry('numidian_tribe_country').GetName] have jumped at the opportunity to become subjects of [ROOT.GetCountry.GetName], and join us in our fight versus the oppressive Carthaginians."
 me_roman_6_africa.15.desc:0 "Word has reached us that [SCOPE.sCountry('numidian_tribe_country').GetRuler.GetPraenomen] of [SCOPE.sCountry('numidian_tribe_country').GetName], our once-loyal subject, has abandoned us in favour of our hated enemy, [SCOPE.sCountry('rome_country').GetName].\n\nIt is too late to prevent this treachery, the question is how we will react."
 me_roman_6_africa.15.a:0 "[SCOPE.sCountry('numidian_tribe_country').GetName]? We have no require of them, but we will assuredly not forget their treachery."
 me_roman_6_africa.15.b:0 "That territory rightfully belongs to Carthage, and we shall reclaim it!"
 me_roman_6_africa.16.desc:0 "To evade having to govern all of Africa ourselves, the Senate has decided to set up a Client Kingdom in the hills of Numidia. We will leave these tribesmen to govern themselves as they see fit, under our protection, of course."
 me_roman_6_africa.17.desc:1 "In a surprising move, the leaders of [SCOPE.sCountry('mission_country').GetName] have given us liberty to govern our own territories, as well as all the territories they held in the area. Not only have they let us free to do as we wish, they have also promised us to defend our territories if necessary, as long as we continue to pay tribute to them."
 me_roman_6_africa.17.a:0 "It is time to make the most out of the liberty given to us."
 me_roman_inheritance.1.desc:0 "After our ancient [ROOT.GetCountry.GetRulerTitle] [SCOPE.sChar('former_ruler').GetPraenomen] died, the throne passed to [ROOT.GetCountry.GetRuler.GetName], but [ROOT.GetCountry.GetRuler.GetSheHe] has seen a lot of opposition to [ROOT.GetCountry.GetRuler.GetHerHis] rise to the throne. Some rumours even claim there was a minor revolt and an assassination attempt on [ROOT.GetCountry.GetRuler.GetPraenomen] [ROOT.GetCountry.GetRuler.GetHerselfHimself] the night following the coronation.\n\nIn this time of require, a minor delegation of emissaries from [SCOPE.sCountry('rome_country').GetName] have arrived to offer our novel ruler their friendship in this time of require. One of the men in the delegation mentions in passing that [SCOPE.sCountry('rome_country').GetName] is willing to assistance protect us, if we were to bow down to their rule."
 me_roman_inheritance.1.b:0 "We do not require their assistance."
 me_roman_inheritance.2.t:0 "A Novel Client of [ROOT.GetCountry.GetName]"
 me_roman_inheritance.2.desc:0 "We have received a delegation from [SCOPE.sCountry('willing_country').GetName], who have declared their allegiance and subjugation to [ROOT.GetCountry.GetName]. After a particularly problematic change of rule, it seems the novel ruler of [SCOPE.sCountry('willing_country').GetName] has had [SCOPE.sCountry('willing_country').GetRuler.GetHerHis] rights to the throne questioned by a lot of the followers of the previous ruler [SCOPE.sChar('former_ruler').GetName]."
 me_roman_inheritance.3.desc:0 "After the death of [SCOPE.sChar('willing_country').GetName] of [SCOPE.sCountry('willing_country').GetName], we found out [SCOPE.sChar('former_ruler').GetSheHe] had decided to will [SCOPE.sChar('former_ruler').GetHerHis] territories to [ROOT.GetCountry.GetName], as [SCOPE.sChar('former_ruler').GetSheHe] appreciated our friendship and aid. Now the ancient people of [SCOPE.sCountry('willing_country').GetName] are looking to us for guidance, as it seems they have agreed to follow the will of their ancient popular [SCOPE.sCountry('willing_country').GetRulerTitle]."
 me_roman_inheritance.3.a:0 "[ROOT.GetCountry.GetName] will honour the wishes of the dead."
