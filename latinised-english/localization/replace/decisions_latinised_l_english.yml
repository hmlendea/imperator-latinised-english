l_english:
 become_democracy_tribal_desc:0 "The Chiefs, Elders, and Magistrates of [COUNTRY.GetName] believe that adopting a more constitutional form of democracy will permit us to prosper fully."
 become_despotic_monarchy_plutocrat_desc:0 "[COUNTRY.GetName] requires a firm hand to direct her through these dark times. [COUNTRY.GetRuler.GetName] would make a fine KINGY/QUEENY."
 proclaim_theocratic_republic_desc:0 "By the assistance of the divine, and with the zeal of her people, [COUNTRY.GetName] shall endure for all eternity!"
 become_tribal_kingdom_desc:0 "We have found a good home, it is time we establish ourselves and adopt a more sedentary lifestyle. Let us proclaim ourselves a kingdom, separating ourselves from the migratory tribes with which we were once affiliated."
 become_elective_monarchy_desc:0 "An Elective Monarchy would ensure that power invariably rests in the hands of the meritorious. Ideally."
 become_stratocratic_monarchy_desc:0 "The [COUNTRY.GetAdjective] people yearn to demonstrate to the world their power. By stratifying our very society in a militarized hierarchy, we shall display the glory of [COUNTRY.GetName] to all!"
 proclaim_aristocratic_republic_desc:0 "The ability to rule clearly runs in the family. Whilst democracy serves us adequately, perhaps we might ensure that the plebeian masses are prevented from interfering in government."
 proclaim_dictatorship_desc:0 "It is becoming increasingly apparent that power cannot be trusted in the hands of the many. Absolute security requires absolute authority."
 create_empire_desc:0 "[COUNTRY.GetRuler.GetName], resplendent in the glory of conquest, has eclipsed all other petty Kingdoms; a new title is required for the ruler of the [COUNTRY.GetAdjective] Empire."
 deify_emperor_desc:0 "Few are in denial that [COUNTRY.GetRuler.GetName] is blessed. It follows, consequently, that such divine heritage can only be the property of a divine entity."
 found_the_museion_desc:0 "As the natural centre of the Post-Alexandrine world the city of Alexandria already attracts many of the best and the brightest Hellenistic minds. We must embrace this role as the carrier of Greek culture and philosophy, and create a temple to the Muses themselves. In this Museion all texts ever written in Greek would be assembled, and any texts yet unknown to Greek scholarship translated.\nWhile it has been the ambition of many a magnificent monarch to assemble a personal library deserving of admiration and envy, few have dared aim as high as this. Should we succeed our memory will live on for centuries, if not millennia."
 construction_of_the_pharos_desc:0 "Maritime journeys are never entirely safe, from pirates and wreckers to storms and tempests the Mediterranean is a dangerous place to be. Nonetheless it is the quickest way to travel for a grand city such as Alexandria on the Nile it is imperative that we are able to guarantee the safety of all vessels and sailors.\nThe small island of Pharos just outside our port would be the perfect location for a magnificent lighthouse to direct all shipping. This venture would also eliminate the infamous wreckers that frequently roam the island."
 construction_of_the_colossus_desc:0 "Many say we were blessed by Helios himself when we managed to stop Demetrios I the Besieger from taking our island and city. We fought valiantly to beat back the oppressing Antigonids, and with the assistance of the Ptolemies of Egypt we managed to secure our independence.\n\nIt is time to thank the god for his assistance in protecting the island, and celebrate our victory. Our architects have prepared the necessary documents for a massive statue in the honour of the god, that will forever protect the ports of Rhodes."
 fix_volcanic_area_vesuvius_desc:0 "Huge swaths of land surrounding Vesuvius was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_aetna_desc:0 "Huge swaths of land surrounding Aetna was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_ararat_desc:0 "Huge swaths of land surrounding Ararat was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_methana_desc:0 "Huge swaths of land surrounding Methana was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_aragats_desc:0 "Huge swaths of land surrounding Aragats was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_argaeus_mons_desc:0 "Huge swaths of land surrounding Argaeus Mons was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_argaios_mons_desc:0 "Huge swaths of land surrounding Argaios Mons was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_ausara_desc:0 "Huge swaths of land surrounding Ausara was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_bamni_desc:0 "Huge swaths of land surrounding Bamni was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_qarqar_desc:0 "Huge swaths of land surrounding Qarqar was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_caucasus_mons_desc:0 "Huge swaths of land surrounding Caucasus Mons was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 fix_volcanic_area_iberia_mons_desc:0 "Huge swaths of land surrounding Iberia Mons was destroyed as the volcano erupted. It is time we set aside the funds to start restoring the land so we can use it more efficiently yet again."
 negotiate_with_slaves_desc:0 "We must terminate the current unrest among the slaves quickly and at any price. If we permit them to reside in peace, promising them that no injury will come to them and assisting them start new lives, we may convince them to lay down their arms."
 allow_slaves_to_settle:1 "All Rebel controlled territories will revert to our control.\nAny revolting slaves will be established in your capital Region as Freemen."
 found_carthago_nova_desc:0 "Hispania is a land of magnificent riches. In order to continue to build a robust presence there it is advisable to endeavour to locate a magnificent new port on its southern coastline, a second capital on the other side of the sea. This new city, Qadr Hasht, will be to Hispania what our own capital was to the Punic settlers of Africa, a focal point for all colonies on the coastline and a clear leader for all Punic urban centres."
 carthage_claims_hispania:0 "Carthage will acquire claims on the Hispanian coastline."
 desc_carthago_nova_modifier:0 "This is the site of Qadr Hasht, a novel Carthage, far away from the squabbling politics of Africa, on the coastline of the rich peninsula of Hispania."
 restructure_military_port_of_carthage_desc:0 "The Carthaginian harbour has invariably been one of the most magnificent in the Punic world but as our Empire has grown, along with the city itself, a need has been born for a restructured and re-imagined harbour. We must spare no expense and expand the capabilities of our capital as a naval base and shipbuilding centre."
 carthage_mercenary_overlord_desc:0 "Our history with the local mercenary companies is a prolonged one, where we have frequently turned to their assistance to secure our goals. Particularly in the numerous drawn out wars in Sicily, they played an essential part in protecting our interests.\n\nAs we are already close friends with some of the mercenary warlords, we should be able to convince them to establish themselves in Carthage. With our patronage, the companies will flourish and we will secure their loyalty at a cheaper price in future conflicts."
 expand_the_campus_martius_desc:0 "The Campus Martius plays an essential role in training our troops and inspire them to greatness. By expanding the training site we will have a greater capacity for recruiting and preparing new soldiers for warfare.\n\nIn addition we will construct new temples that will make the Campus a place worth recalling. As they train, our men will be able to look to these places for valour and vigour."
 embellish_jupiter_optimus_maximus_desc:0 "The Temple of Jupiter Optimus Maximus stands at the centre of our faith and city. At the Capitoline Hill it stands as a testament to our rule, and the blessing of the heavens.\n\nEmbellishing and improving the temple further is sure to be a popular move among our people, and what better way to secure the boons of the gods?"
 religion_conversion_tooltip:1 "Every Character not pursuing the new faith will lose #R 20#! Loyalty."
 big_religion_in_capital_tooltip:1 "At least 50% of the free people in the territory of [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] (#Y [SCOPE.ScriptValue('majority_of_free_men_in_capital_svalue')|0] #! Non-Slave Pops) pursue this religion."
 big_religion_in_country_tooltip:0 "At least 20% of the people in [SCOPE.GetRootScope.GetCountry.GetName] pursue this religion."
 heretic_high_priest_monarchy_tooltip:0 "The [GetOffice('office_high_priest_monarchy').GetCulturalName(SCOPE.GetRootScope.GetCountry)] must pursue our novel faith."
 heretic_high_priest_republic_tooltip:0 "The [GetOffice('office_pontifex').GetCulturalName(SCOPE.GetRootScope.GetCountry)] must pursue our novel faith."
 heretic_high_priest_tribe_tooltip:0 "The [GetOffice('office_high_priest').GetCulturalName(SCOPE.GetRootScope.GetCountry)] must pursue our novel faith."
 convert_to_buddhist_desc:0 "The teachings of Buddha are disseminating rapidly in our lands. It is time to embrace his philosophy ourselves and start promoting these words among our subjects."
 convert_to_jainism_desc:0 "Jain teachings are disseminating rapidly in our land and among the characters of our court. The time has come to embrace these profound philosophies and incorporate them into the very fabric of our state itself."
 unite_the_dahae_desc:0 "For too long the Dahae tribes have been squabbling between themselves. We have been disunited and weak, open to the whims of the magnificent empires that surround us.\nLet us unite the Dahae tribes into a powerful tribal federation, only then will we be masters of our own faith."
 unite_dahae_claims_tooltip:0 "Dahae will acquire Claims on the Province of #Y Parthia#!."
 pan_hellenic_league_desc:0 "During the days of Argead domination the League of Corinth united all Greek urban centres in one league. The goal of this organization was invariably to control them, and to deny them the independence that they are due. But the idea of a Pan-Hellenic League has not perished with the oppressive actions of the Argeads and Antipatrids, it could also be the ultimate guarantor of Greek Independence.\nLet us unite one and all and form a League to encompass all the free urban centres of Greece. Together we will become the dominant force of the Greek world, leaving the kingdoms of would be successors, or usurpers, behind us."
 formable_not_hellenic_league_exists:0 "The Hellenic League must not previously exist."
 reunite_alexanders_empire_desc:0 "For too long parasites and scavengers have made a feast of the Great Empire that Alexander spent a lifetime constructing. It is time we do away with all claimants, usurpers and delusional provincial strongmen. There can be only one authority within the empire of Alexander the Great, one upholder of the magnificent Hellenistic legacy that this great man founded.\nThat one power could not possibly come from any dynasty but our own. Only a family that respects the Argead traditions can legitimately assert its legacy."
 argead_empire_tooltip:3 "The Argead Empire will acquire Claims on the Regions of #Y $macedonia_region$#!, #Y $greece_region$#!, #Y $thrace_region$#!, #Y $asia_region$#!, #Y $galatia_region$#!, #Y $cappadocia_region$#!, #Y $cappadocia_pontica_region$#!, #Y $cilicia_region$#!, #Y $bithynia_region$#!, #Y $assyria_region$#!, #Y $mesopotamia_region$#!, #Y $persis_region$#!, #Y $media_region$#!, #Y $gedrosia_region$#!, #Y $parthia_region$#!, #Y $bactriana_region$#!, #Y $ariana_region$#!, #Y $palestine_region$#!, #Y $syria_region$#!, #Y $gandhara_region$#!, #Y $upper_egypt_region$#!, and #Y $lower_egypt_region$#!."
 macedonian_empire_tooltip:0 "The Macedonian Empire will acquire Claims on the Regions of #Y $macedonia_region$#!, #Y $greece_region$#!, #Y $thrace_region$#!, #Y $asia_region$#!, #Y $galatia_region$#!, #Y $cappadocia_region$#!, #Y $cappadocia_pontica_region$#!, #Y $cilicia_region$#!, #Y $bithynia_region$#!, #Y $assyria_region$#!, #Y $mesopotamia_region$#!, #Y $persis_region$#!, #Y $media_region$#!, #Y $gedrosia_region$#!, #Y $parthia_region$#!, #Y $bactriana_region$#!, #Y $ariana_region$#!, #Y $palestine_region$#!, #Y $syria_region$#!, #Y $gandhara_region$#!, #Y $upper_egypt_region$#!, and #Y $lower_egypt_region$#!."
 form_egypt_desc:0 "Egypt is perhaps the oldest civilization of all, and yet she is not free. Instead pretenders have usurped the kingdom and play at honoring the ancient gods. This cannot be tolerated. We must unite Upper and Lower Egypt once again under a dynasty that truly comprehends and cherishes the legacy of the Pharaohs."
 egypt_claims_tooltip:1 "Egypt will acquire Claims on the Regions of #Y Upper Egypt#! and #Y Lower Egypt#!."
 form_assyria_desc:0 "Prior to being crushed by hostile powers Assyria was the thriving centre of a magnificent Empire. Let us once again unite these lands and form the greater country of Assyria, honoring the ancient gods and traditions of our people."
 assyria_claims_tooltip:2 "Assyria will acquire Claims on the Regions of #Y $assyria_region$#! and #Y $mesopotamia_region$#!."
 armenia_claims_tooltip:2 "Armenia will acquire Claims on the Region of #Y $armenia_region$#!, and the Provinces of #Y $armenia_maior_area$#!, #Y $armenia_minor_area$#!, #Y $sophene_area$#!, and #Y $corduene_area$#!."
 form_armenia_desc:0 "The lands of Armenia require able and robust leadership. Let us unite the Armenian people and forge a stronger and more durable Armenian empire."
 galatia_claims_tooltip:2 "Galatia will acquire Claims on the Regions of #Y $galatia_region$#! and #Y $cappadocia_region$#!."
 form_galatia_desc:0 "While we are far from the ancestral homeland of our people this is still a good land. Let us create a novel state here, and teach these local peoples concerning the capabilities of the Celtic peoples."
 phrygia_claims_tooltip:2 "Phrygia will acquire Claims on the Regions of #Y $galatia_region$#! and #Y $cappadocia_region$#!."
 pontus_claims_tooltip:2 "Pontus will acquire Claims on the Regions of #Y $bithynia_region$#! and #Y $cappadocia_region$#!."
 form_pontus_desc:0 "Once a proud kingdom of its own Pontus was reduced to a Satrapy under the Achaemenids and later devolved into a no mans land under the Successors. We must reinstate the magnificent state that once was and create a new Pontic Kingdom."
 form_macedon_desc:0 "The Barons of Macedon have invariably favoured the robust and able over the weak and feeble. Let us seize the kingdom away from those that are leading it to ruin and create a novel, more robust state for the Macedonians to serve."
 dravida_claims_tooltip:1 "Dravida will acquire Claims on the Regions of #Y Dravida#! and #Y Karnata#!."
 form_dravida_desc:0 "By uniting the peoples of all Dravidian lands we can create a robust counterpart to the magnificent empires of the north. A nation to safeguard the ancient traditions of our ancestors and protect the rich soils of the south."
 unite_india:0 "Must own all urban centres in the regions of Gandhara, Maru, Avanti, Madhyadesa, Pracya, Dravida and Vindhyaprstha."
 rebuild_corinth_desc:0 "Our conflicts in Greece have exacted a heavy toll on the area. A show of magnanimity is required to build confidence in our rule, and our advisors suggest that Corinth would be the ideal place for a concerted effort to implement a programme of public works."
 abolish_social_equity_desc:0 "The traditionalists whisper in dark corners, and the bearded ancients pour scorn on us. Our attempts at progressive governance must come to a conclusion."
 social_equity_tooltip:0 "You are unable to switch #Y Gender Equality#! policy for #Y 20#! years after changing it."
 persian_claims_tooltip:1 "Persia will acquire Claims on the Regions of #Y Persis#!, #Y Media#!, #Y Parthia#!, #Y Ariana#!, #Y Mesopotamia#!, #Y Bactriana#!, #Y Gedrosia#! and #Y Assyria#!."
 move_capital_antioch_desc:0 "For too long the rightful heirs of Alexander's empire have been disconnected from the Macedonian heartland which bore the greatest conquest of history and all the fortunes of our people. Fertile Babylonia has served us satisfactorily, but we must re-establish our ties with the lost lands to the west and establish a central point of governance on the Mediterranean if we are to succeed in re-claiming the lands of Megas Alexandros."
 move_capital_antioch_claims:0 "The Seleukid Empire will acquire claims on Palestine and Syria."
 desc_antioch_orontes_modifier:1 "Antioch on the Orontes was established as the new capital for the Seleukid Empire, far closer to the Macedonian heartland than the old capital in Babylonia and with access to the trade routes of the Mediterranean via its natural harbour."
 form_super_etruria_desc:0 "For centuries, the developing rivalry with our Roman neighbours has dominated our politics. Once and for all, it is time to reclaim our birthright, and restore the wrongs visited upon our ancestor's magnificent ally, Tarquinius."
 country_rename.3.desc:0 "When the Romans deposed Tarquinius, he knew of only one people mighty enough to shelter him. While we were not able to reinstate Tarquinius himself to his birthright, we have now finally avenged the slight upon his character, and our own heritage.\n\nWith that 'mighty' city of Rome finally in our hands, [ROOT.GetCountry.GetRuler.GetName] has devised a most amusing exchange, designed to let the world know of Rome's failures - and our own successes."
 country_rename.3.a:0 "Require a new Tarquinius."
 keep_rome:0 "We will not offer to exchange #Y Roma#!."
 country_rename.4.desc:0 "The Etruscans, using wicked, conniving tricks, have occupied our legendary walled city of Roma. Keen to humiliate us, they offer us the return of all their owned land in the Province of Latium, in exchange for the installation of a puppet King, whom they insist must be named Tarquinius.\n\nAn insult grave, this most assuredly is - but can we really afford to refuse when Roman people languish under foreign rule?"
 country_rename.4.b:0 "There shall be no agreement of that nature."
 country_rename.5.desc:0 "The nation of Roma, in their foolishness, has refused our kind requirement of subservience. Their refusal, however, has damaged their reputation throughout our peninsula, such that even their own people are unable to bear to consider themselves Roman without possession of their magnificent walled city.\n\nLet them forever be known as cowards."
 country_rename.6.desc:0 "The Romans - in their defeat - at least comprehend humility. Agreeing to our proposal, we are to return our owned territories in the Province of Latium, in exchange for their servitude and loyalty.\n\nA King once again rules in Rome... albeit in our name."
 country_rename.7.desc:0 "In a curious turn of events, a foreign merchant arrived at our [ROOT.GetCountry.Custom('get_court_type')] three days hence, relating the subjugation of the Italic tribe of the Romans.\n\nIt seems the Etruscans took it upon themselves to install a puppet King named Tarquinius, no less..."
 restore_the_monarchy:0 "If they still exist, we will be able to dispatch an offer to the Romans, potentially leading to them becoming our subject."
 found_seleukia_pieria_desc:0 "With a new focus towards the Mediterranean and the moving of the Seleukid capital to Syria the need for a magnificent new port in Syria has grown ever more urgent. Let us pool our resources to expand the port of Seleuika Pieria and work for the establishment of Seleukid hegemony in the west."
 indo_greek_decision_desc:0 "The lure of friends, empires, and riches to the East leads numerous of our people to the realization that fighting over the scraps of Alexander's Empire, may not be a goal worth pursuing. Greater glory lies in tying our destiny to the land beyond the Indus."
 convert_to_kemeticism_desc:0 "The followers of Isis have become a prominent part of our society, and our people are looking to them for guidance in their daily lives. It is time we put our ancient traditions behind and accept their teachings."
 convert_to_hellenic_desc:0 "We have seen temples and shrines to the numerous deities of the Greek Pantheon being raised in [COUNTRY.GetCapital.GetName] lately, and our citizens turning to their priests and oracles for their sagacity. Maybe it is time we all started looking to them for guidance?"
 convert_to_canaanite_desc:0 "Melqart and his followers have been commonplace in [COUNTRY.GetCapital.GetName] since we first met those who venerated him, but now we have seen a newfound interest in Ba'al, Astarte and the other deities as well. Traditions that was once an important part of our identity are being left behind as foreign exotic rituals are becoming a matter of course. It is time to accept the Canaanite Pantheon as our own."
 convert_to_shamanism_desc:0 "The teachings of great Zalmoxis has become more apparent and important among our young these last years. They look to his words on how to live their lives, and even some of our elders have been affected by this shift to the new faith. It is time the rest of us pursue his ideas as well."
 convert_to_caucasian_religion_desc:0 "Be it the stories of the mystical Tir, the truth of Mihr or the greatness of Aramazd, we have heard it all lately. It seems all our ancient temples and shrines have been replaced by those of the Armazic pantheon, and similarly have our priests and priestesses. "
 convert_to_mesopotamian_religion_desc:0 "The ancient myths and legends of Ishtar and Gilgamesh have filled our halls and inspired our people. No longer do we listen to the priests of the [COUNTRY.GetReligion.GetName] faith, and their traditions, devoid of value, are put aside and replaced by the ancient rituals of the Babylonians, Sumerians and Akkadians."
 convert_to_armenian_religion_desc:0 "Our soldiers were the first to pick up the ancient Khaldic traditions, proving invaluable for morale and discipline as they were sent off to conflict. Now the rest of our people are looking to the ancient pantheon, picking up the traditions of old once more."
 convert_to_anatolian_religion_desc:0 "The conviction in the Mother Goddess has long been an important one next to all the other deities in our faith, but more recently the rest has seen a clear decline of interest. Cybelene, the Mother Goddess, has become the most important figure in our religious traditions and practices."
 convert_to_druidism_desc:0 "Though the Druids have yet to become an official part of our faith, they have long played the informal role as advisors and shown guidance to our people. Maybe it is time to rid ourselves of our ancient shackles of traditions and faith, and truly welcome them into our society?"
 convert_to_animism_desc:0 "It seems the prophets and oracles of Endouellicus has foreseen a magnificent future for our nation if we turn to his worship. The Iberic pantheon is already revered among our people, and our court officials advise us to embrace this novel faith."
 convert_to_judaism_desc:0 "We have lately seen a large swathe of our people turn to the veneration of only one god, the Judean one. Defying the polytheistic teachings of other faiths, the vigour of their conviction have convinced many of the lower class to turn their prayers to the Judean god."
 convert_to_zoroastrianism_desc:0 "The teachings of Zoroaster has permeated Persian society since he was given the sagacity of Ahura Mazda. The truth and inherent benevolence of the faith quickly disseminates throughout [COUNTRY.GetName], and it is time for us to devote ourselves entirely to the one path."
 convert_to_berber_religion_desc:0 "Though the people of the Megalithic faith were once inspired and affected by their neighbours, they now in turn have affected us. Our people have started picking up the convictions of the desert tribes, looking to Nanna Tala and Shaheded as much as they do any local deity."
 convert_to_indo_iranian_religion_desc:0 "The seven deities of the Scythian horsemen have become popular in our lands lately. Particularly the ancient Targitaos have seen large shrines built in his honour, and our people have turned to him as if he was our ancestor, similar to how the Scythians treat the deity."
 convert_to_arabian_pantheon_desc:0 "The caravans has brought the Arabic pantheon with them into [COUNTRY.GetName], and now we see our people look to the guidance of the oracle of Ta'lab or requesting Manat to turn the tides of fate in their favour. It is time for us to take up their veneration."
 convert_to_eastern_animism_desc:0 "Animism and ancestor veneration have become an important part of the [COUNTRY.GetAdjective] religious ceremonies lately, and we have seen old rituals and traditions flourish in addition to our [COUNTRY.GetReligion.GetName] faith. Maybe it is time to put aside some of these newer ideas and revert back to our ancient heritage?"
 convert_to_matrist_religion_desc:0 "The Aestuian Mother Goddess has found a home in [COUNTRY.GetName], and our people are putting aside all our ancient rituals in favour of those in her honour. It is time we do the same."
 secure_phrygian_position_desc:0 "To ensure the vigour of Antigonos' novel eastern kingdom and the liberty of the Greeks; Kassandros' occupiers in Korinthos must be cast out, our southern gains kept safe from jealous Ptolemaic schemes, and the new capital of Antigoneia defended from Seleukid ambition."
 secure_phrygian_position_tt:2 "$PRY_DYN$ will not splinter upon Antigonos' demise if #Y [GetProvince('(int32)418').GetName]#!, #Y [GetProvince('(int32)660').GetName]#!, #Y [GetProvince('(int32)790').GetName]#!, #Y [GetProvince('(int32)407').GetName]#!, #Y [GetProvince('(int32)331').GetName]#!, and #Y [GetProvince('(int32)1936').GetName]#! are still held."
 form_epirus_desc:0 "The Epirote tribes found magnificent glory when they united under the leadership of the Molossians, whose kings led them to prominence in the conflicts for control of Greece and Magna Graecia. Under our leadership, the glorious legacy of the Epirotes will be re-established once more, and our past feats eclipsed by future victories."
 form_boeotia_desc:0 "The Boeotian League was at one time the main power in northern Greece, reaching its apex under the leadership of the Theban commanders Epaminondas and Pelopidas, who led the Boeotians to defeat Sparta and Macedon in pitched battles."
 patronize_literature_and_arts_desc:1 "This culture has a rich and ancient heritage, a magnificent treasure trove of literature and aesthetics that many in the capital find captivating. Let us patronize their scholars, writers, poets and artists, bringing our two peoples closer together."
 create_honor_guard_desc:0 "This is a people renowned for their fierce martial prowess. Let us create an honour guard for our ruler composed only of their finest warriors. This will provide us the protection we require and will demonstrate to the people itself how much we appreciate what they do for our country."
 protected_land_rights_desc:0 "By ensuring that the property and land of our culture is protected from the state and its avaricious citizens we can be sure that they will feel a deeper sense of affiliation."
 right_of_trial_desc:1 "By ensuring that our citizens have the right to have their grievances tried in a court, rather than just decided by the local governor, we can provide them a sense of safety and fairness."
 right_of_contract_desc:0 "Extending the right to enter into legally binding contracts with our citizens and nobles will tie this culture closer to ours and permit them to participate in the economic life of our country."
 right_to_commission_desc:0 "By opening up lower officer positions in units composed of their own people we can bring novel opportunities and a sense of hope to the masses of this culture."
 city_self_rule_desc:0 "Confidence and loyalty go hand in hand. By sanctioning the rights of one of the greater communities of this culture, giving them their own elected bodies, taxation rights, and even their own army, we can earn the loyalty of even those that remain outside of the municipal boundaries."
 municipium_feoderati_tt:0 "Considering that [THIS.GetProvince.GetCulture.GetName] is in our culture group, #Y [THIS.GetProvince.GetName]#! will become our #Y Feudatory#!."
 feoderati_tribes_tt:0 "Considering that this area has a low Civilization Rating, #Y [THIS.GetProvince.GetName]#! will become our #Y Tribal Vassal#!."
 municipium_client_state_tt:0 "Considering that [THIS.GetProvince.GetCulture.GetName] is NOT in our culture group, #Y [THIS.GetProvince.GetName]#! will become our #Y Client State#!."
 culture_group_boosted_tt:0 "Cultures that are currently in our country and that are affiliated with the #Y [SCOPE.sCountryCulture('target_culture').GetCulture.GetCultureGroup.GetName]#! Culture Group acquire #G 5%#! Happiness until the end of the game (Currently there are #Y [SCOPE.ScriptValue('num_of_pops_in_country_cultures_in_same_group_svalue')|0]#! Pops that would be affected)."
 revoke_exemption_from_census_tax_desc:0 "The liberty from Census taxes is a hated and expensive reform. Revoking it will have us face the ire of our privileged classes but will surely assist the treasury."
 allow_citizenship_by_adoption_desc:0 "While Citizenship is restricted by birth it is possible for some to earn the right to be considered citizens. It is advisable to lighten these restrictions and rules and admit more methods through which someone might aspire to the honour of citizenship."
 non_state_culture_adoption:0 "\nThis decision will permit families to adopt Characters of cultures other than #Y [SCOPE.sCountryCulture('target_culture').GetCulture.GetName]#!.\n"
 no_current_honor_guard:1 "Cannot have an existing Honour Guard. Currently this is #Y [THIS.GetCharacter.GetName]#!."
 desc_honor_guard_character:0 "This character is at our court as a representative of their people, and occupies the position of honour guard for our ruler."
 cultural_integration.10.desc:0 "The [honor_guard.GetCulture.GetName] have sent us a [honor_guard.GetWomanMan] to fulfil the role of Honour Guard in [ROOT.GetCountry.GetCapital.GetName].\n\nOnly time will tell if we can genuinely put this novel warrior to use, or if this appointment was a mere formality to please his cultural kin."
 found_colonia_cultural_decision_desc:0 "The best method to ensure lasting loyalty in a region will invariably be to dispatch those we rely upon to rule it for us.\nLet us dispatch a number of trusted [COUNTRY.GetAdjective] men and women to construct a new life deep in foreign territory."
 cultural_integration.11.desc:0 "The arrival of [ROOT.GetProvince.GetOwner.GetPrimaryCulture.GetName] settlers has hardly endeared the local population to us, but the foundation of a colony in this area is without a doubt the best method to exert control here in the long run.\n\nSoon even the local [ROOT.GetProvince.GetCulture.GetName] inhabitants will see how our city will prosper and surpass any previous outposts they may have had in this area prior to the land being confiscated."
 explain_colonia_tt:0 "Must possess a province where [SCOPE.sCountryCulture('target_culture').GetCulture.GetName] is dominant and which has room for our settlers."
 requires_more_cultures_tt:0 "There must be at least 2 other cultures with at least 100 pops between them in the identical culture group as [SCOPE.sCountryCulture('target_culture').GetCulture.GetName]."
 must_not_already_have_a_municipal_subject_of_this_culture_tt:0 "Must not have previously granted Municipal Self Rule to a #Y [SCOPE.sCountryCulture('target_culture').GetCulture.GetName]#! subject country."
 panoply_of_alexander_the_great_desc:0 "In his absence, Alexander's arms and armour were present at the council of Babylon, and numerous continue to attribute magnificent things to the objects that were close to this man. Should we be able to reassemble Alexander's panoply, we will be seen as credible custodians of his legacy."
 philosophike_anthologia_desc:0 "In time people will speculate concerning the events of our age - let us collect the greatest written words of our era and preserve them for posterity."
 tribal_civilization_desc:0 "The division of land and property in our capital remains muddled and impenetrable. Key plots must be ceded to the chief, and their collective proprietorship codified."
 install_eunostos_egypt_desc:0 "Our attempts to control the island of Cyprus were foiled by Antigonus the One-Eyed, but the ancient city-state of our Pasikratid allies may be resurrected - a kindness that will no doubt be generously recompensed."
