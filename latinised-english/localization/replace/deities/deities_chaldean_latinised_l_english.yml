l_english:
 omen_ashshur_desc:3 "Ashshur, the mighty god, the one whom by his furious eyes make foreign people and adversaries shake in fear and despair, again and again saved the country. Strong and exhilarated, his furor can be appeased only by the blood of battle, and by the honour and glory of the kings revering him in his temples.\n\nIn the ancient days, Ashshur permitted his kings and his princes to expand his power, and when he had settled upon their fate to be reversed, invariably did he restore them to their former glory. Assuredly, if he reaches his hand over us, we are certain to expand once again; to bring back from foreign lands their wealth, their men, women and children to labour for re-establishing our former glory and our former power!"
 omen_ninurta_desc:3 "Ninurta is robust, powerful and exalted in the fight. He is the one that defeated the demons with his mallet Sharur, like he did to Anzu and his army of stones. Ninurta alone could fight him, retaining his resolve in the battle.\n\nIf Ninurta looks with favour at our armies, assuredly we will prevail. If the magnificent god favours us, we are certain our troops will push back those that drove us once, and we will submit to the tribute any of those people that surround us and that wished to create chaos in the country. Then, his sanctuaries at Nippur in Babylonia and at Kalhu in Assyria will be reinstated to their former glory, and the people once again will live in peace when our victory is achieved."
 omen_ishtar_desc:3 "Ishtar is the warlike goddess, the one that drive men insane with her seven magical fineries. She may force them into the most profound despair, as well as oblige them to exert themselves for reaching the most magnificent glory. So did she with her lover Tammuz, whom she abandoned into Hell, as well as with Gilgamesh, who had to fight versus her savage bull to bring peace back in Uruk.\n\nIshtar is double-faced, being both the patron of physical love, this one driving men and women to have numerous sons; but she he also the conflict goddess, the one pushing men to flock into the armies for the battle. With her favour, assuredly our armies will be filled with young and robust men, able to push away the frontiers of the Country."
 omen_ea_desc:4 "Ea is the patron god of learned and sagacious men, of craftsmen and creators. His knowledge and his comprehension frequently saved the country from disaster. Is he not the one that terminated this strike by minor gods, by creating mankind so that they could release them with their labour? Is he not the one who saved those same men from the Flood, by ordering Uta-Napishti to construct a magnificent wooden ark?\n\nWith Ea's favour, scholars, scribes and lettered will obtain sagacity and knowledge, insight and comprehension. With their inventions, they will make the country the heart of the world again, and of our urban centres the seat of a robust rule, dispenser of both peace and profusion."
 omen_nabu_desc:3 "Nabu is the most sagacious of the sages, the one who by his stylus bestow knowledge to everyone, from the king to the lower of those scribes learning the exploits of ancient rulers as well as the good ways to administer the country, by managing the palm groves, the fields, the temples and the canals.\n\nThanks to his favour, scribes of both the gods and the king will be sedulous; they will write rapidly and well their tablets and their scrolls, will retain the accounts well and will allow the country to thrive. Our prosperity will be assured then, and the treasures of gods and king alike will be filled thanks to the god's favour and his knowledge and insight."
 omen_enlil_desc:3 "Enlil created everything here below. He is the father of the gods, the one who made mankind and the country. His robust words do and undo empires, and he is the one who decide the fate of everyone.\n\nIf Enlil looks down at us with favour, assuredly he will provide us all those lands surrounding the country. He will permit the return of powerful kings, and will provide them the rulership over far and away territories. Be it by our powerful troops or by those scourges that in the ancient days carried off mortals, very soon the country will expand to the rims of the world, to the places that his breath the wind reaches: to the banks of the bitter Apsu encircling Earth."
 omen_shamash_desc:3 "The radiant god, the Sun brings warmth and joy to the country. Up from the skies, he sees everything, knows everything in the hearts of men. He is the one chastising anyone daring to violate their oath, are incapable of retaining their promises, infringe the laws and display dishonesty.\n\nShamash will look down on us, he will assure that our merchants going into faraway mountain lands and bringing their wealth back to the country-be they woods, gemstones or metals-will continue to honour their contracts and the words they swore by. Thanks to him, the riches of the whole world will converge to bedeck the sanctuaries and the palaces, and the god will make sure the return of our prosperity like in the days of those powerful kings of ancient times."
 omen_marduk_desc:3 "Marduk is Bel, the Lord and the scheduler of everything down on Earth. He maintains law and order in the country; he is the one that defeated the Sea, Tiamat, when she wanted to create chaos; he is the one who, when Erra came into Babylon to sow discord and disarray, came back to reinstate order and prosperity.\n\nWith Marduk's favour, the country will be alive again; thanks to the gods that pursue him and obey his powerful words, peace, lawfulness and well-being will be assured, and everyone will lean down in front of both the king of gods and the king of kings."
 omen_sin_desc:3 "Sin, the illuminating moon god, is frequently revered by mankind as he watches over them from his temples in Ur, Harran or Tayma of the Arabs. What would they be without his favor, him who oversees the expansion of crops and the fertility of herds and women?\n\nWith Sin looking with favour over the country, then the harvest will be plentiful, the cattle will multiply and the population will develop, until overflowing-like the magnificent rivers flooding the plain prior to assaulting up the mountains."
