l_english:
 omen_diwali_desc:4 "There will be a grand Festival of Light to inspire our troops and soldiers as they move to conflict. Though it is unfavourable to be forced into conflict and violence, it is a necessary evil to protect our way of life."
 omen_satya_desc:4 "Truth is an important vow in Jainism, and we will be honest and truthful as we recruit the young men of the nation to support our struggles in conflict. As they flock to our banners, we will have a greater potential manpower than we have had in a prolonged time."
 omen_paryushana_desc:4 "We will hold a grand Paryushana festival, inspiring our people to take vows of study so our whole society can acquire greater insight and sagacity. Our nation and community is sure to come to innovations as we move forward with novel focus."
 omen_aparigraha_desc:4 "Non-possession is an important vow in Jainism, and we will convey the importance of the vow to our people. As our people develop more accustomed to letting go off their material wealth, we will be able to collect greater taxes for the good of our nation."
 omen_ahimsa_desc:4 "Non-violence is an important vow in Jainism, and we will make a grand ceremony to commemorate the conclusion of violence for our nation. It is time for our people to find peace, and depart behind the struggles of conflict."
 omen_roth_teej_desc:4 "A grand Roth Teej ceremony will be held to convey the importance of non-possession among our followers. The gold will circulate between the different parties as they depart the avarice for material value behind and care about what is good for our people."
 omen_arghya_desc:4 "The Arghya ritual is one where we have our followers venerate with different items to fracture free from the cycle of rebirth. Our people will live securely with the knowledge they are developing ever closer to nirvana, and liberty from samsara."
 omen_mahavir_jayanti_desc:5 "The sagacious teachings of Mahavira proved the difficulties of beholding the complexities of reality, and the necessity to refrain from violence and worldly pleasures to comprehend its mysteries.\nMahavira was the 24th Tirthankara and a contemporary of Buddha who reorganized Jainism. He is said to have achieved moksha, salvation, near the city of Malini."
 omen_bhadrabahu_desc:2 "The last to indirectly receive the teachings of Jainism through the tirthenkaras, Bhadrabahu's extensive learning has shaped contemporary Jainism.\nBhadrabahu migrated with multitudes of followers to Belgola from the north and established a major school and temple."
 omen_rishabhanatha_desc:2 "The magnificent ford maker's guidance continues to aid our people towards escaping interminable reincarnation, inspiring adherence to his sagacious teachings and discipline.\nThe 1st tirthenkara, Rishabhanatha is said to spoken his first sermon on the hill of Shatrunjaya."
 omen_rishabhanatha_moksha_desc:2 "Rishabhanatha's stunning example of renuncation in order to acquire sagacity and moksha inspires our people to live good and peaceful lives.\nThe 1st tirthenkara, Rishabhanatha is said to have attained moksha, salvation, on Mount Kailash."
 omen_neminatha_desc:2 "The cousin of Krishna shows us that even the divine must pursue the teachings of Jainism if they are to be liberated from the cycle of demise.\nThe 22nd tirthenkara, Neminatha is said to have attained moksha, salvation, on Mount Girnar."
 omen_parshvanatha_desc:2 "Parshvanatha teaches us to restraint is required to live a good life, refraining from owning possessions, stealing, and lying.\nThe 24th tirthenkara, Parshvanatha is said to have attained moksha, salvation, on Parasnath hill in Jharkhand."
