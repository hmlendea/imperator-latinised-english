l_english:
 omen_tuisto_desc:3 "Tuisto is the supreme deity of our pantheon, and the ancestor of our tribe and people. Born of the earth, he had several sons who became the rulers of what would later become the Germanic tribes. Our people look to him for guidance and assistance in all things, aned celebrate him profoundly in our ceremonies."
 omen_alcis_desc:3 "Despite all appearances, Alcis is in fact the name for two brotherly deities counted as one, a set of Divine Twins. Venerated for their youth and their brotherly love, they are occasionally portrayed as horses or chariots pulling the sun transversely across the sky."
 omen_tamfana_desc:3 "Tamfana is venerated at some of the most sacred sites of Germania, and an important deity for the sacred groves there. In addition as she is one of the patron goddesses of the harvest, we frequently leave her offerings when our men are about to go out into the fields."
 omen_baduhenna_desc:3 "As one of the matrons of our pantheon, Baduhenna is frequently called upon and invoked when going to armed conflict. Our men and soldiers look to her for guidance, and hope she will direct their hand while they fight for the tribes."
 omen_vagdavercustis_desc:3 "For some of our people Vagdavercustis is the primary deity of war, military insight, and virtue. Her numerous stories inspire our men and soldiers on how to act, and some assert she directs their hands in battle after offering up their prayers to her."
 omen_nehalennia_desc:3 "Nehallenia, the patron goddess of commerce, horticulture and commerce. She is usually portrayed as a seated deity with a dog at her side, as well as wares that would fall under her domain. Merchants frequently invoke her as they make a deals in foreign lands or with people hailing from strange exotic cultures, so do people who desire her assistance in the production of wares and goods."
 omen_nerthus_desc:3 "As one of our major fertility goddess, as well as one of the most popular fertility deities among the Germanic tribes in general, Nerthus is a familiar sight and an admired deity in our nation. Stories say Nerthus has a particular interest in human affairs, and frequently travels among her followers and people."
