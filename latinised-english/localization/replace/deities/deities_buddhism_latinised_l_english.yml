l_english:
 omen_viriya_parami_desc:4 "The people of our nation will discover their vigour, fortitude and diligence in battle. Though battle in itself is inadvisable, some times one must fight for the common good, and it is important that one does so with honour and discipline.\n\nViriya Parami is one of our Buddhist perfections, with a focus on teaching people to be dutiful, observant and display effort in their labour. "
 omen_adhitthana_parami_desc:4 "Though it is normal to be worried in the face of adversity, we inspire determination in our young men in these times of necessity. It is important for the community to come together and unite their efforts to reach their goals, be it armed conflict or other community projects.\n\nAdhitthana Parami is one of our Buddhist perfections, with a focus on teaching people to be resolute and determined in their actions."
 omen_panna_parami_desc:4 "Our academics and scholars, as well as our people as a whole, will discover sagacity and insight in their lives. With this knowledge, we will be more advantageously advised to make decisions that will benefit and support our people.\n\nPanna Parami is one of our Buddhist perfections, with a focus on teaching people to be sagacious and possess insight into things greater than themselves."
 omen_upekkha_parami_desc:4 "We require calm and serenity as the chaos of war rages around us, discovering the correct path for our people to take. Even during hardships of war and fatigue, it is important that the society manages to come to an agreement concerning the paths you will take as a collective, be it to continue the warfare or not.\n\nUpekkha Parami is one of our Buddhist perfections, with a focus on teaching people to be serene and to purify their mental states."
 omen_khanti_parami_desc:4 "Our people need endurance of hardships, and forbearance and patience with those coming from afar. Only then can we come to learn their secrets and accept their difference, rather than meeting them with affront or censure. By coming to comprehend them, we can discover value in their company, and bring affluence to all of us.\n\nKhanti Parami is one of our Buddhist perfections, with a focus on teaching people to be patient, tolerant and have acceptance for others."
 omen_sila_parami_desc:4 "We will inspire in our people the correct path forward, with virtue and the proper conduct in the way of things. By acting with virtue, our people will be able to come together into larger collectives that can cooperate and labour together.\n\nSila Parami is one of our Buddhist perfections, with a focus on teaching people to be virtuous, harmonious and act with self-restraint."
 omen_metta_parami_desc:4 "It is a goal for our nation to be known for their caring, benevolent manner. It is one method for our people and culture to develop and expand beyond our current limitations.\n\nMetta Parami is one of our Buddhist perfections, with a focus on teaching people to be kind and friendly to one another."
 omen_trapusa_and_bahalika_desc:2 "Buddha's first lay disciples, the merchants Trapusa and Bahalika, brought his teachings over the Hindu Kush and into the west where they constructed the first stupa in Baktra.\nThey represent the universal sagacity of his teachings in every part of the world, and the vindicating ease by which they disseminate."
 omen_sigiriya_desc:2 "While Buddha eschewed extreme asceticism as weakening one to the point of losing sight of the world, peace and quiet are necessary to contemplate his teachings.\nThe magnificent rock of Sigiraya has housed Buddhist monks seeking nirvana in its caves for numerous years."
 omen_bamyan_desc:2 "The Buddha was generous in his teachings, wandering transversely across the country to disseminate his divine sagacity among the people.\nThe stupas of monasteries far from Buddha's birthplace are a testament to the tradition of disseminating his teachings."
 omen_bodh_desc:2 "The sagacious teachings of Buddha will direct our people to live an ethical and pleasant life, free from the distractions and mistaken doctrines of other faiths.\nThe city of Gaya is known as the place where Gautama Buddha attained enlightenment under the Bodhi tree on the Buddha Purnima after renouncing both luxury and asceticism, developing the middle way."
 omen_kusinagara_desc:2 "Only by following Gautama Buddha's sagacious and sacred way of life can one attain Parinirvana and be liberated from the punishment of the eternal cycle of reincarnation.\nBuddha achieved this state upon his demise in the city of Kusinagara, which has become a pilgrimage site for all who see the truth of his teachings."
