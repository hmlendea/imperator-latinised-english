l_english:
 omen_baal_qarnaim_desc:3 "We will make magnificent offerings to the Lord of the Two Horns, ensuring his blessing and acceptance of our recent conflicts. With his guidance, we will easily be able to justify our expansion into enemy lands, to our people who tire of battle and conflicts.\n\nAs another face of great Ba'al, we venerate Ba'al Qarnaim in times of necessity and conflict, and he inspires our people."
 omen_attar_desc:3 "He who is Bold in Battle will aid and protect our brothers at arms, ensuring their discipline and morale. With our soldiers fighting to prove themselves, victory is considerably more likely to be ours."
 omen_tanit_desc:3 "Our lady goddess will observe us in battle, ensuring our victory as we conquer our adversaries. There are few deities who inspire our soldiers like Tanit, and it will be proven once more what an impact she has in our conflicts.\n\nUnlike the Phoenician Pantheon as a whole, Tanit is more of a local Carthaginian goddess. She plays an important role in our rites as both a lunar goddess as well as a war goddess. Tanit is so favourable, that even some of the Libyans and Mauretanians have started venerating her, following our example."
 omen_baal_hammon_desc:3 "The young men of our nation will flock to our banners with the knowledge that Ba'al Hammon has sanctified our conflicts. With more recruits at our hands, we are sure to be able to force our adversaries to agree to our requirements with our superior manpower.\n\nUnlike the more generic worship of Ba'al in the other Phoenician areas, we have the favour of Ba'al Hammon himself, foremost of the pantheon in Carthaginian lands. As a god of harvest, he is occasionally likened to the Greek Kronos, though he plays a more important active role than their Greek version."
 omen_anat_desc:3 "The feral warrior goddess will fight alongside our men, guiding their hands in battle and fortifying their morale. Anat is known for her brutal slaughter of her adversaries; we are more likely to win our conflicts with her at our side.\n\nAs a war goddess, Anat was well known among many Canaanite cultures along the Levant. She played an important role in avenging her brother and lover Ba'al after his supposed demise at the hands of Mot."
 omen_el_desc:3 "All the young men will flock to our banners under the guidance of the supreme god. We are sure to be able to win our conflicts now that we have an elevated number of potential recruits than prior to this.\n\nAt the head of the pantheon, El is the first among equals as far as most are concerned. He is the king and father of most deities, and is the creator of the land."
 omen_kothar_desc:3 "The magnificent knowledge of Kothar-wa-Khasis will shine down upon our craftsmen, blessing with them insight. As we progress forward under his guidance, we are sure to be able to compete with our neighbours and move beyond the capabilities of our adversaries.\n\nKothar is well known as the patron of metalworking and magic, having made numerous notable weapons and gifts to the other deities with his unique skill. Stories say even the Egyptians learnt of the god, and named him Ptah in their own language."
 omen_yam_desc:3 "Yam is one of the gods of the sea, in its most feral form. From his palace in the obscure depths of the ocean he controls the raging waves and tumultuous winds with which our vessels have to contend with as they navigate transversely across the seas.\n\nThough he is one El's chosen champions, he is a menace to those who dare offend him, and many a sailor has felt his indignation as they are shattered against reefs or have their vessels mercilessly ripped apart by the waves."
 omen_melqart_desc:3 "The magnificent wandering Lord Melqart will bring wealth to all our realm. With greater riches comes greater prosperity for our people; ensuring our security for the time being.\n\nEven though the god was originally the patron god of the Phoenician city Tyre, he has become well known in every part of the Phoenician world, as well as with all their commercial partners and relations."
 omen_baal_desc:3 "The magnificent Ba'al will justify our expansion into enemy lands, and secure the continued success of such campaigns. There are some who have tired of conflict, this blessing will convince them of the necessity of continued warfare.\n\nAs the patron of harvests, storms, weather and sailors, the Great Ba'al is the most venerated of our deities. In times of struggle and necessity, Ba'al is the deity who brings salvation and assistance."
 omen_dagon_desc:3 "Dagon will provide our merchants with lavish amounts of resources to exchange. With his assistance, our merchants see greater abundance and they are sure to be able to expand their operations and continue their pursuit of wealth for a long time to come.\n\nKnown to the Greeks as Zeus Arotrios, Dagon is the Father of Ba'al and a fertility god in his own right."
 omen_shapash_desc:3 "The justice of Shapash will shine down upon our nation like the sun, blessing our people with peace and integrity. Under her scrutiny, only the most unruly of people will continue their struggle contrary to our society, and we will finally eliminate any internal menace.\n\nAs one of the daughters of El, she is known as a sun goddess and a judge among gods. Her justice decides the faith of other gods, and can hinder their actions if necessary."
 omen_astarte_desc:3 "Our people will develop and expand under the loving eye of the goddess. With her blessing over our people, our young ones are sure to develop healthily, and our harvests will be abundant for numerous years to come.\n\nAstarte is known as a fertility goddess all across Phoenician lands, occasionally celebrated together with the healing god Eshmun. The Greeks often compare her to their Aphrodite."
 omen_eshmun_desc:1 "The sagacity and benevolence of Eshmun will bring health and happiness to our people. With his vast knowledge of nature's feral and varied gifts, the god will protect our people from the ravages of disease and time.\n\nVenerated from Phoenicia to Carthage and called by the Greeks Asklepios, Eshmun is a famous and much appreciated god in every part of the Canaanite world."
 omen_atargatis_desc:2 "Atargatis, thrice sanctified bringer of plenty and protector of the needful will see that the necessities of our people remain sated.\n\nAtargatis is a combination of the three magnificent Canaanite godesses - 'Atirat, 'Anat, and 'Attart - whose veneration remained popular for centuries after the Hellenization of Syria, particularly in Bambyke."
 omen_baalat_desc:0 "Ba'alat is a deity hailing from the city-state of Byblos in Phoenicia, and she has had an impressive sanctuary in the city since time immemorial.\n\nThe deity is frequently associated with the earth and other fertility goddesses like Astarte and Ishtar, while the Egyptians know her as Hathor and the Greeks refer to her as Baaltis."
 omen_gad_desc:0 "Gad is an ancient god, or occasionally a goddess, of fortune and chance. Unlike many of the other deities of Phoenicia and Palestine, Gad is universally invoked and honoured in every part of the eastern Mediterranean. Other deities are occasionally also invoked with the name Gad, more as a title than being a specific deity in itself."
 omen_hadad_desc:0 "Hadad is a tempest deity who originally hails from northern Syria and lower Armenia, where he was frequently venerated alongside the syncretic deity Atargatis. Despite his origins, one of his most magnificent temples was raised in Askalon, a city where he was considered the most important deity out of all."
