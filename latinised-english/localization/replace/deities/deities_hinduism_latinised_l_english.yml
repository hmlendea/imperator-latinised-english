l_english:
 omen_shiva_desc:3 "We will offer up our prayers to Shiva in the hopes he will direct our men in battle and fortify their morale. With our soldiers' discipline and resolve bolstered, we are sure to achieve numerous victories in the coming years."
 omen_prajapati_desc:3 "We hope Prajapati will inspire and take care of our young men as they prepare to give their lives for our people. With our army reinforced by so many novel recruits, we are unlikely to see any issues with a lack of manpower anytime soon."
 omen_saraswati_desc:3 "Our scholars, academics and artists have a lot to learn from Saraswati. We hope she will look to our people with favour, and gift us with her knowledge. With this gift, we will make sure to disseminate novel technological wonders in every part of our society, for all our people to benefit."
 omen_kubera_desc:3 "We request of Kubera assistance in assembling as much wealth for our nation as possible. After all, what other god could assist us in such an endeavour?"
 omen_brahma_desc:3 "The universal truths of Brahma guide our people as they expand transversely across the lands. With Brahma at our side, our adversaries are sure to relent in the face of their opposition, letting our men prepare for armed conflict once more."
 omen_samudra_desc:3 "We look to the magnificent deity for aid in protecting our merchants as they navigate transversely across distant oceans in pursuit of wealth. With these newfound riches, they are sure to construct the commercial network needed to increase our affluence substantially. "
 omen_vishnu_desc:3 "Prayers will be offered up to Vishnu in the knowledge that he will look out for our people, guiding those who are lost and protecting those in times of hardship and necessity. With his assistance, our society is sure to be safer and more loyal than ever, letting us focus some of our resources out towards foreign adversaries rather than inwards."
 omen_indra_desc:3 "We look to Indra for the rain and water needed to bring life to our harvests. As our crops develop more securely and robustly than ever, our people are sure to flourish as well."
 omen_soma_desc:1 "The beautiful shining one presides over the night sky and will bring health and happiness to our people even as they slumber.\nThe ancient temple at Prabhasa marks the spot where the lunar god bathed to regain his lustre after a curse, creating the lunar cycles."
 omen_kanya_devi_desc:1 "The adolescent goddess of penance and virginity will temper the passions of our people and lead them to the divinity of renunciation and calm.\nKanya Devi is an incarnation of the goddess Parvati, and has been venerated at the southern tip of the Indian subcontinent from the earliest times."
 omen_samba_desc:1 "The mischievous son of Krishna, granted in return for penance, is a reminder of the dangers of profligacy and passion, bringing about the destruction of the Yavada dynasty and the wounding of his father.\nSamba built the great sun temple of Mulasthanapura where he venerated for twelve years to redeem his curse of leprosy."
 omen_krishna_desc:1 "The obscure eight avatar of Vishnu will bless our people with love and compassion and lead them on the path to holiness.\nKrishna is one of main Hindu deities, and named the sacred Indian site of Dvaraka."
 omen_rama_desc:1 "The hero Ramachandra, avatar of Vishnu, will inspire our people with the epic tales of his exploits and moral feats.\nThe Ramayana tells of his construction of the bridge to the island Lanka to extricate his wife Sita from the demon Ravana."
 omen_lakshmi_desc:1 "The goddess of objectives will direct our people to divine knowledge, wealth in all things, and the patience required to achieve them."
 omen_bhrigu_desc:1 "The great sage, begat by Brahma, is one of the most sagacious to have ever lived, and their learning has brought magnificent progress to all India.\nThe sage Bhrigu's importance outshone even Lakshmi, replacing her as the main object of pilgrimages to Barygaza."
