l_english:
 omen_sinifere_desc:3 "Under the guidance of Sinifere our warriors will be infused with vigour and discipline. As the god aids our cause, our men are sure to conquer and beat our enemies, bringing us victory."
 omen_gurzil_desc:3 "Under the sanctified warrior Sun-god Gurzil, our young and ancient will flock to the banners to fight our adversaries. With all these men suddenly coming to aid our people in armed conflict, we are sure to bolster our ranks beyond imagining. We will be prepared for any potential danger coming our way."
 omen_tannit_desc:3 "The magnificent weaver Tannit will sanctify us with her sagacity, granting gifts of insight to our wise-men, academics and scholars. With this newfound knowledge, we are sure to be able to progress and bring our people greater innovations and ideas.\n\nThough originally a goddess of Carthaginian descent, she has become an important part of religion all the way from Libya to Mauretania."
 omen_shaheded_desc:3 "The magnificent goddess of the sea will protect and look out for our merchants as they depart our home in pursuit of wealth for our people. With novel riches and treasures in distant lands, they are sure to bring greater affluence back home to our nation.\n\nShahaded is a Sea goddess originally venerated around Libya, but her devotees have disseminated her name as time has passed."
 omen_nanna_tala_desc:3 "The magnificent Spring-goddess will bring salvation and prosperity to our people, calming our internal conflicts and disagreements. As our lands are pacified, we can focus our efforts out towards the adversaries at our frontiers rather than the adversaries within.\n\nThere are numerous myths concerning the woman who now is known as the goddess Nanna Tala. The stories say she and her children sacrificed their lives to find water for their people, and that equitable people can still call upon her to provide them water in times of necessity."
