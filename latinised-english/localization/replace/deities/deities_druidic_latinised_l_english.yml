l_english:
 omen_nemetona_desc:3 "Our patron goddess will sanctify our men with her favour, making our victory at conflict certain. With her at our side our men are sure to fight more disciplined to protect our tribe and the goddess, who look down upon us favourably.\n\nNemetona is the most important goddess of the pantheon for the Nemeti, but less known among the Celtic Pantheon as a whole. She is venerated as a goddess for sacred groves and religious areas."
 omen_sucellus_desc:3 "Our patron god Sucellus will sanctify our people with protection in these times of necessity, ensuring safety and concord among our peers. With this god at our side, only the worst and most troublesome would be willing to continue their disturbances."
 omen_eki_desc:3 "We will offer up our veneration to the sun goddess in the hope that she will continue to protect us. With her blessing at our side, our people will assuredly calm down and it will quell the dissenters before they can cause more issues to our society."
 omen_mari_desc:3 "We will venerate the Lady of Storms with the hope that she will bring storms of fertility rather than devastation to our fields. With our harvests seeing life and expansion, we are sure to have our people develop securely for numerous years to come."
 omen_andraste_desc:0 "Andraste is a local conflict deity usually venerated by the Pretani tribes residing in $britain_region$, with the Iceni in particular calling upon her as a goddess of victory. Supposedly the hare is a sacred animal to Andraste, as it plays an important part in the religious rites and rituals in her honour.\n\nAmong the Romans she is known as Victoria, and the Greeks call her Nike."
 omen_belatucadros_desc:0 "This deity is a horned war-god of the Pretani tribes of the north, with several variants being called upon by the local tribes of the Votadini in particular. Though he is a conflict god, the deity is also associated with nature, flora, and alder-trees.\n\nAmong the Greeks and Romans he is known as Ares and Mars, and he is occasionally venerated as Toutatis among the Gallic tribes."
 omen_coventina_desc:0 "Coventina is a goddess of wells and springs encircling a minor sacred grove in the lands of the Briganti tribes. Supposedly the goddess has brought life to the harsh lands of the area, and her veneration has started migrating beyond the immediate vicinity of where she was originally venerated."
 omen_nodens_desc:0 "Nodens is a conflict and healing deity of the Pretani tribes, with a focus on warfare at sea and hunting. As a hunting deity, his sacred animal is the dog, which plays an important role in the day-to-day life of those who venerate him as well as in the rituals venerating him.\n\nHis veneration has started appearing external to the frontiers of $britain_region$, and he has been related to the worship of other deities like Silvanus among the Romans and Papposilenus among the Greeks."
 omen_sulis_desc:0 "Sulis is a local goddess of the thermal springs in southern $britain_region$, partly as a mother goddess figure and partly as a ward against curses. Even people from afar have started travelling to the springs to offer up their prayers to the goddess, requesting help versus curses that might have afflicted them.\n\nIn foreign lands they have named her Minerva or Athena, relating her to their Goddess of Sagacity."
 omen_camulus_desc:0 "Camulus is a conflict god for the Belgae of Gaul, venerated among all of their tribes. He is usually associated with a feral boar, which is occasionally considered a sacred animal among those who honour the deity.\n\nAmong the Greeks he is known as Ares, and Mars among the Romans."
 omen_lenus_desc:0 "Lenus is a conflict god among some of the smaller Treveri tribes at the frontiers between Germania and Gaul. He is frequently associated with the more prevalent Gallic god Toutatis, as a protector of the tribes, but also has numerous unique elements of his own.\n\nIn addition to being a protecting conflict deity, he is venerated as a god of springs and health among the Treveri. In many cases, he is portrayed with the goddess Ancamna, usually as her husband."
 omen_intarabus_desc:0 "Intarabus is one of the most important deities for some of the Treveri tribes of Gaul, as one of their numerous protectors. He is usually portrayed as a man in the prime of his life, with a wolf skin draped across his shoulders and a spear in his hand."
 omen_ancamna_desc:0 "Among the Treveri tribes, Ancamna is a fertility goddess of the springs and one of the primary deities in their local pantheon. She is frequently portrayed with her husband, Lenus, as divine protectors of the local tribes."
 omen_taranis_desc:4 "Our men require to stand firm in the face of adversity, knowing that the god of the sky looks at our cause with favour. With his blessing and aid, our people are sure to win versus adversaries and neighbours as we struggle for supremacy.\n\nTaranis is one of the Sacred Triad, together with Esus and Toutatis, and well known as a god of thunder. When meeting with the Latin merchants from the Italian Peninsula, the god is frequently interpreted as their Jupiter."
 omen_toutatis_desc:3 "The protector of the tribe will inspire our men to take up arms and fight for the tribe in times of necessity. With all these novel potential recruits, we are sure to be able to bring more men to conflict than we have had the potential of doing in a prolonged time.\n\nToutatis is one of the three in the Sacred Triad, together with Esus and Taranis, and well known as a conflict god. In addition he is usually seen as a magnificent protector of the tribes, taking up a more defensive role than numerous of the conflict gods in other nations. Often interpreted as the Roman Mars, though the two have fairly different natures."
 omen_gobannus_desc:3 "The patron of smiths will bring us the knowledge and technology required to advance our society beyond our current limitations. As we surpass our ancestors, we are sure to be able to compete with our neighbours and adversaries."
 omen_cernunnos_desc:3 "We beseech the Horned god to share some of the wealth he carries with our people. With newfound wealth in our hands, our people are sure to prosper for a prolonged time to come.\n\nCernunnos is the Caretaker of the Dead, and a god of life, beasts and wealth. Despite his somewhat feral look and element of demise, the god is usually seen as peaceful and an important part of the pantheon."
 omen_ogmios_desc:3 "Ogmios binds our people to his cause, and justifies the necessary actions of his followers. As our people are convinced of the necessities of the wars we have taken part in, they will be more willing to take up arms for future battles as well.\n\nThe magnificent warrior hero Ogmios is known for his numerous travels transversely across our lands, binding the people he meets to his causes. In addition he is known as a psychopomp, guiding the souls of the dead to the afterlife. Often interpreted as the Roman Hercules or Greek Herakles, though the hero stories are different to one another."
 omen_lugus_desc:3 "The three-faces of the god will bring us affluence and implore merchants from far and wide to open their coffers for our goods. As our merchants are aided by the magnificent god, our people are sure to see more wealth passing via our realm.\n\nAs one of the primary gods of our faith, Lugus plays an important role when it comes to the arts, as well as being considered a composite of the Sacred Triad; Taranis, Toutatis and Esus. Occasionally interpreted as the Roman Mercury despite their differences."
 omen_icovellauna_desc:3 "The rivers of the earth will be directed such as to provide for our people, and bring peace and prosperity to those who pursue the goddess. With the deity at our side, only the most troublesome of dissenters will continue causing problems in our society, letting us focus more of our attention outwards to the adversaries at our frontiers."
 omen_rosmerta_desc:3 "The goddess of Fertility will sanctify our people with a bountiful harvest and life for our young ones. As our people are blessed, we are sure to see fewer of the years of poor harvests and for more of our people to develop healthily in the years to come.\n\nShe is the goddess of fertility and abundance, as well as the consort of Lugus."
 omen_brigantia_desc:1 "Our brave warriors will storm to victory under the guidance of the goddess of battle and glory, inspired to improve their feats of arms and place confidence in the inevitable triumph of our people.\nBrigantia is a Celtic warrior goddess attested mainly in the British Isles, and who was interpreted by the Romans as a parallel to Nike or Victoria in the Hellenic pantheon."
 omen_glanis_desc:1 "The divine healing power of the spring god circulates through the numerous pilgrims who flock to share of his goodwill and bath in the sacred pools. It is heartening to know there is hope for the ill as long as they pay the proper respects to the gods.\nGlanis was a Gallic healing deity associated with the springs at Glanum, whose cult lasted until the rise of Christianity."
 omen_berobreo_desc:1 "At the western boundary of the world Berobreo's underworld domain swallows the indeterminate places and mysteries of the earth. We must be reminded of the fleeting nature of life and the immensity of our ignorance if we are to live happily and appreciate the god's blessings in this world.\nA famous sanctuary jutting into the sea in western Gallicia was dedicated to Berobreo."
 omen_cichol_desc:0 "This deity is one of the conflict deities that is venerated in every part of the Gallic world, from the Belgae in the north to the people of Transalpine Gaul in the south. Unlike numerous of the other conflict deities venerated in Gaul, he is usually not portrayed as a protector, but rather as a robust warrior unattached to any one tribe."
 omen_nantosuelta_desc:0 "Nantosuelta is a mysterious deity venerated far and wide in Gaul, Britannia and Iberia, frequently associated with either conflict or abundance. The goddess is frequently portrayed as a crow, or with a crow at her side, an animal that is considered sacred among those who venerate her."
 omen_maponos_desc:0 "Maponos is a god of youth venerated in Gaul and Britannia both, frequently depicted with an instrument of some kind. The deity is associated with poetry or love, two attributes frequently shown in most of the stories he takes part in.\n\nAmong the Greeks and Romans he is known as Apollo, the closest thing they have to a god of youth of their own."
 omen_belisama_desc:0 "Belisama is a solar goddess venerated in every part of Gaul and Britannia. She is the female form of the even more famous Belinus, a god occasionally said to be her husband, both known as the one who moves the sun transversely across the sky.\n\nAmong the Romans, she is occasionally associated with their goddess of sagacity, Minerva."
 omen_belinus_desc:0 "Belinus is a solar god among the people of Gaul and Britannia, with several notable myths making him the bringer of the sun. He is one of the most venerated deities in every part of Gaul, also occasionally as the female variant known as Belisama, which some say is his wife.\n\nAmong the people of the Mediterranean he is usually referred to as Helios or Apollo, their own solar deities."
 omen_artio_desc:0 "Artio is a fertility goddess of life and abundance venerated far and wide. The bear is considered a sacred of animal of hers, and this association runs deep, to a point where some call her a bear goddess and depict her with a bear head or skin."
 omen_cissonius_desc:0 "Cissonius is a god of travellers and commerce for numerous of the tribes in Gaul and Brittania, unique and quite different to the numerous war-like and healing deities that are usually venerated in these lands. He is usually depicted as an aged man riding a ram and drinking wine, and seen as an equivalent to the Greek Hermes or the Roman Mercury."
