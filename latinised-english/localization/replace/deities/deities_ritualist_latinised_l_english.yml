l_english:
 omen_infusion_of_war_desc:3 "The spirits will infuse our warriors and soldiers with vigour and discipline. We are certain to see numerous victories in our near future, with the aid of the spirits."
 omen_rites_adult_desc:3 "Our numerous young men and boys will undertake rites to become adults, and join the ranks of our soldiers. With our ranks bolstered, our armies are ready for any adversary that might challenge our nation."
 omen_moon_guidance_desc:3 "Mother of the Moon will direct our scholars, academics and wise-men into greater insights and gift them with hidden knowledge. With our newfound sagacity, we are sure to bring greater purpose to all our people."
 omen_wealth_earth_desc:3 "We request of the numerous spirits of the earth to reveal the rich minerals buried beneath our feet. With the blessing of the spirits, we will develop rich beyond imagining, preparing our society for any challenge that might arise in the near future."
 omen_war_ceremony_desc:3 "We will hold a grand ceremony to prepare our people for conflict, and for them to comprehend and accept the necessities of our current conflicts. With the ceremony, we are sure to convince some of the nay-sayers and bring them to our side, and our allies will share our convictions even more than they previously did."
 omen_guidance_of_the_wind_desc:3 "Our merchants will be directed by the winds to distant lands. With the spirits at their side, they will pursue greater riches to bring back home."
 omen_guidance_of_the_sun_desc:3 "All of our people will bask in knowledge of our safety in the world, directed by the sun itself. Conflicts will be quelled and disagreements will be put aside, as our society seeks stronger unity in the face of adversity."
 omen_blessing_life_desc:3 "We offer up sacrifices to the spirits of the earth, requesting that they provide growth and harvest for numerous years to come. With our crops safe from weather, devastation and poor harvest years, our people will be able to develop more comfortably than we have in a while."
