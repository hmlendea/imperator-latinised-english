l_english:
 omen_targitaos_desc:3 "Targitaos is the progenitor of all our tribes, and an ancestor that we still revere. Besides his role as a forefather of our people, he also plays a role as a patron of the skies and partly as a fertility deity."
 omen_goitosyrus_desc:3 "We will request of the god insight and knowledge into matters of the indeterminate. As we receive the gift of sagacity, we hope our scholars and scribes can bring our nation into greater prosperity and vigour."
 omen_papaios_desc:3 "The magnificent Papaios will bring our people the wealth and resources we require. This novel influx of wealth will bring happiness and fortune to our people."
 omen_thagimasadas_desc:3 "The royal Thagimasadas will approve of our expansion into foreign lands. With this god at our side, our people are sure to pick up their weapons and ready for conflict once more, for who can deny the sagacity of the gods?"
 omen_api_desc:3 "Api will sanctify our merchants with an abundance of resources for exchange. Newfound trade goods, home and abroad, will surely enhance our mechants on all their endeavours."
 omen_tabiti_desc:3 "We will beseech the queen of the gods with our veneration, requesting blessings of peace and prosperity for our people. With Tabiti at our side, our lands will be pacified and calm, letting us focus our efforts and resources outwards."
 omen_argimpasa_desc:3 "The magnificent goddess of the heavens will sanctify our harvests and people with life and expansion. As we receive the gift of life, our crops will flourish and our young will be sure to develop robust and healthy."
