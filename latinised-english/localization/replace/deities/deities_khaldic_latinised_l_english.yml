l_english:
 omen_theispas_desc:3 "Our men will be inspired by Theispas himself, their discipline and morale infused with the vigour of tempests. As our soldiers struggles for supremacy versus our adversaries, we are certain to win more victories than ever prior to this."
 omen_shivini_desc:3 "All our young men will flock to our banners as we call upon Shivini to shine his illumination down upon our armies. With our armies swelling with novel recruits, we are sure to have the manpower required for ours armed conflicts for quite some time."
 omen_arubani_desc:3 "The wife of the Supreme god will light the path for our scholars and wisemen in their search for sagacity. As our academics bring home this gift of sagacity, they are sure to labour more efficaciously into making the technological advances our people have been looking for."
 omen_khaldi_desc:3 "The supreme god, foremost of them all, will sanctify our people as we expand transversely across the lands. With Khaldi himself at our side, our people will assuredly set their apprehensions aside, and pick up their weapons for our nation once more. "
 omen_dsvininaue_desc:3 "We request of the goddess of the sea and rivers to protect our merchants as they traverse the lands in pursuance of their duties. With Dsvininaue aiding our merchants, we hope see their skills and commercial networks flourish, bringing home wealth and riches."
 omen_bagvarti_desc:3 "The wife of the supreme god will bring peace and prosperity to our nation, resolving the conflicts of our countrymen. Only fools would dare oppose the magnificent Bagvarti and her justice, and dissenters are sure to put down their weapons and depart their resentment behind as we move forward."
 omen_huba_desc:3 "The mother of all living will bring life and prosperity to our nation, ensuring our harvests and secure childbirths. With her blessing, we are sure to see a conclusion to the years of desolation and for our young ones to develop safe and healthy."
 omen_nane_desc:3 "We request of the sagacious Nane to sanctify our soldiers with discipline in battle, so we can win our armed conflicts and protect our nation. With her at our side, we are certain our men will be inspired to go to greater lengths than any have prior to this."
 omen_mihr_desc:3 "With illumination and truth at our side, the blessing of Mihr will inspire our young men to defend our lands from foreign adversaries. As they flock to our banners, there will be more recruits than we will possibly require for quite some time."
 omen_tir_desc:3 "We beseech the mystical Tir to sanctify our artists and craftsmen with gifts of knowledge and insight. Having been granted this gift of sagacity, our country will flourish like never prior to this."
 omen_vahagn_desc:3 "We offer up our veneration to Vahagn in the hope that he will protect our nation. With his protection, we will be able to assemble the wealth of our people and expand into greater prosperity than prior to this."
 omen_aramazd_desc:3 "The magnificent Aramazd will stand by our people as we expand into foreign territory for the glory of our gods. Our people will accept the necessities of war, as few can oppose the will of the gods."
 omen_tsovinar_desc:3 "We request of the ferocious Tsovinar to protect our merchants as they navigate the seas, pursuing fortune for our people. When such faraway wealth is brought home our people are sure to prosper in abundance."
 omen_anahit_desc:3 "We hope the caring Anahit will sanctify our nation with protection for our young, her followers live comfortably with the knowledge that their children can now be brought to the world securely."
 omen_spandaremet_desc:3 "Spandaramet will bring newfound life to our harvests, securing food and supplies for our people. As the goddess of demise, we request of her to provide us respite from her powers so we can develop and expand once more."
