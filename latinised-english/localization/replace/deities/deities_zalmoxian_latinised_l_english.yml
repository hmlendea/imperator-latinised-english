l_english:
 omen_pleistoros_desc:4 "Pleistoros is a brutal conflict god revered and venerated by the tribes of Dacia. They regularly sacrifice slaves and war-prisoners in his honour, hoping for his continued blessing as they wage their numerous conflicts."
 omen_zalmoxis_desc:4 "Zalmoxis, or Gebeleizis as some call him, was a sagacious man that convinced the Dacians to pursue his convictions and faith. Though he was supposedly a human at some point, the tribes now venerate him as a divine entity that guides the dead, effectively working as their psychopomp."
 omen_sabazios_desc:4 "Sabazios is one of the numerous conflict deities venerated by the tribes of Thrace, but he is the only Thracian deity to have become popular far from their homeland, as cults in his honour has sprung up in the lands of the Phrygians and Lydians as well. In some stories Sabazios is portrayed as the Thracian Horseman, a figure famous far beyond the coasts of Thrace."
 omen_derzelas_desc:4 "Derzelas is a revered deity among the Thracians, who believe he is the god of the underworld, abundance, and health. He is frequently portrayed with a cornocupia by his side, a symbol of his role as provider for the tribes. His worshippers hold games in his honour, similar to the more famous games of the Greeks."
 omen_zibelthiurdos_desc:4 "Zibelthiurdos is a god of the heavens, lightning, and rain, and is by numerous Greeks perceived to be the Thracian Zeus. He is frequently portrayed with thunderbolts by his side, and is one of the primary deities for the tribes of Thrace."
 omen_bendis_desc:4 "Bendis is a Thracian goddess of the hunt and abundance, usually accompanied and portrayed with satyrs or maenads. Among the Greeks she is occasionally associated with their goddess Artemis, another hunting deity, but lately Bendis has become a popular goddess in her own right in their lands. There is a festival in her honour called the Bendideia."
 omen_semele_desc:4 "Semele is a mother-goddess revered in every part of Thrace, and the mother of Bassareus. Some say her cult originated in Phrygia, but she has since taken on numerous more Greek and Thracian elements, the lands in which she is now popular. She is usually venerated together with her son, Bassareus among the Thracians or Dionysos among the Greeks, as the foci of their own cult."
