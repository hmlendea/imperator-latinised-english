l_english:
 omen_deborah_desc:4 "Just as Deborah were once guided by God to attack the King of Canaan, we must be certain of the battles we wage and not listen to false prophets or take their counsel. However, when we are certain that a battle must be fought, our men must engage with vigour and discipline so our people will be victorious."
 omen_children_of_god_desc:2 "#Y Jewish Aspect of Faith#!\nwe will call upon all of God's children, be they young or aged, to come together and fight in defence of our people. With recruits from all across our nation coming to arms, our forces are sure to be bolstered and reinforced."
 omen_samuel_desc:4 "As the magnificent Samuel once led and inspired the people of God, we must lead our people with sagacity and knowledge. Pursuing the teachings of God, we will move forward with greater insight to the benefit of everyone under our care."
 omen_david_desc:5 "Like magnificent David himself, legendary for his riches and treasures, we will pursue wealth. To protect and care for the followers of God, it is important that we have the funding necessary to compete with our neighbours, adversaries and foes."
 omen_solomon_desc:5 "Though we do not seek to bring armed conflict and famine to our adversaries, sometimes it is a necessary evil for the sake of our people. In times like these we emulate the sagacity of Solomon himself, so we can knowingly resolve these crises with the best type of results."
 omen_caleb_joshua_desc:4 "As Caleb and Joshua once saw opportunity where most of their peers only saw adversaries, our people need to attempt to locate solutions where others will not. For as long as we have God on our side, and pursue his words, we are sure to succeed."
 omen_moses_desc:4 "As Moses once guided the people of Israel out of Egypt, we must direct our people with a clear mind, pursuing the words of God. If our rule is to succeed, our people must believe in our power to locate the best possible outcome for them, and only then will they calm down and truly pursue us."
 omen_abraham_desc:5 "Abraham is well known for being blessed by God with children, when nobody believed such a marvel could occur. We will pray to God to receive blessings akin to that, so our people may flourish once more."
 omen_joseph_desc:2 "The tenacity and competence of Joseph in all things exemplify the value of arduous labour and perseverance in the face of adversity.\nJoseph rests in Shekhem, in the shadow of Mount Gezerim."
 omen_esther_desc:2 "Esther's diplomacy and deviousness won over the Persian king Xerxes I and saved our people from persecution, a true example for the Jewish diaspora.\nEsther's tomb is said to reside in the old Persian capital of Ekbatana."
 omen_daniel_desc:2 "The competence of Daniel in interpreting the precepts of Yahweh inspire our people with the confidence of God's guidance.\nDaniel served in the Persian court and believed to be buried in Sousa."
 omen_ezekiel_desc:2 "The dedication of Ezekiel in cautioning the Jewish people of impending perils reminds our people to be resolute and vigilant.\nEzekiel served in the court of Babylon as is believed to be buried nearby."
 omen_ezra_desc:2 "The adherence of Ezra the Scribe is a shining example of ensuring that God's sacred statutes are pursued by the community.\nEzra served in the court of Artaxerxes I of Persia and is said to be buried near Apologos."
