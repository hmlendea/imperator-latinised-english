l_english:
 omen_zadeni_desc:2 "Zadeni is the patron god of conflict and fruitfulness that our men frequently call upon prior to going into battle. He is usually seen with a flower or a hatchet in his hands, accompanied by a winged lion. He is known among the Greeks as Herakles."
 omen_armazi_desc:2 "Armazi is the patron god of rain, thunder, weather, and abundance. Dressed in a suit of armour with sword in hand, he is an inspiration to those who pursue him. Among the Zoroastrians he is known as Ahura Mazda, whereas among the Greeks he is known as Zeus."
 omen_kopala_desc:2 "A magnificent hero who is revered by a large number of our people for his numerous magnificent heroic deeds. The most magnificent of these were his vanquishment of devebi from the realm, sealing them underground after besting them in a contest as well as in a battle."
 omen_gacim_desc:2 "Gacim is the companion of Ga, and a fertility god in his own right. The two of them are frequently seen as deities who govern all the mysteries of the world, as well as fate spinners. Some equate Gacim with the Anatolian Attis."
 omen_ghmerti_desc:2 "Ghmerti is a head of our pantheon, first of all our deities, and lord of the universe. He is the father of the sun and the moon, in addition to several of the other deities of our pantheon. As the creator of everything, the lives of men and beasts rest in his hands."
 omen_ga_desc:2 "Ga is the companion of Gacim, and a mother goddess in her own right. The two of them are frequently seen as deities who govern all the mysteries of the world, as well as fate spinners. Some equate Ga with the Anatolian Cybele."
 omen_adgilis_deda_desc:2 "Adgilis Deda is a goddess of fertility and livestock. She guides the harvest and the cattle of our farmers, and shelters the travellers who come to our lands. She is frequently seen as the chief goddess of the people who reside in the harsh mountainous lands of Iberia."
 omen_dali_desc:2 "Dali is the patron goddess of the hunt, a beautiful deity that dwells up in the mountains of Caucasus. Among hunters she is the chief goddess they call upon to be permitted into her realm, and only with her assistance will they locate the prey they are seeking."
 omen_ainina_and_danina_desc:2 "Ainina and Danina is a pair of goddesses introduced into the Armazic pantheon at a later date. They are frequently associated with fertility, healing, and sagacity, and possess a cult following. They are occasionally identified with Anahit or Inanna."
