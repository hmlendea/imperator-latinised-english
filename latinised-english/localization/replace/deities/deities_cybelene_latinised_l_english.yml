l_english:
 omen_agdistis_desc:3 "The feral, and androgynous, god Agdistis will bring our men and warriors into battle with their frenzy. With the god at our side, our people will be undefeatable in battle."
 omen_dactyl_desc:3 "We offer up our sacrifices to the ten Dactyls, hoping they will sanctify our craftsmen with their knowledge and insight. As we move forward, we hope this sagacity will assist our society compete with the adversaries at our frontiers, and protect our friends and allies."
 omen_dindymene_desc:3 "This face of the magnificent mother will assist us assemble the resources of the nation, fortifying our capabilities. With newfound prosperity in our hands, we are sure to be able to expand efficaciously."
 cybele_description:0 "The mother of our people approves of our plans to expand our empire and bring more people into the fold. Under the guiding eyes of Cybele, only the most fatigued of our people will oppose more armed conflicts."
 omen_kakasbos_desc:3 "We offer up our veneration to the Lycian Kakasbos, hoping for his blessing in retaining our merchants safe as they traverse the world. In their pursuit of wealth, our merchants are sure to bring home more riches to our communities."
 men_description:0 "We request of the lunar god to sanctify our people with safety and protection. Under his watchful eye, the dissenters will be quelled."
 omen_attis_desc:3 "The castrated Attis will disseminate his blood across our harvest and bless it with an expansion unlike any seen prior to this. As the harvests flourish from his gift, we are certain to see our people develop greatly once more."
 omen_sandon_desc:0 "Sandon is a weather god of Anatolia, frequently associated with and invoked in times of war. As one of the most important gods of Cilicia, he has several shrines and temples in his honour, particularly around Tarsus.\n\nThe deity is associated with weapons, flowers, and lions. The Greeks relate the god with their own Herakles, the god of heroes."
 omen_bagaios_desc:0 "Bagaios is a tempest and weather god of Phrygia, usually believed to be the giver of good times and things. Also associated with fertility, the god is frequently invoked in times of necessity and trouble, to protect our people.\n\nAmong the Greeks he usually associated with their own Zeus, first in their pantheon."
