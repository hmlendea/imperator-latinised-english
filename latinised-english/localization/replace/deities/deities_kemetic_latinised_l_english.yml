l_english:
 omen_osiris_desc:3 "Osiris has long been one of the more important of the deities of our pantheon. He is known as "The Beautiful One", "King of Living", "The Lord of Love", and "Eternal Lord", and is the patron god of the underworld, as well as the afterlife and rebirth.\n\nThe god is associated with the lifegiving Nile, the harvest and eternal life. It is said he will one day rise, bringing with him all those deserving, be it commoners or the ancient Egyptian kings."
 omen_sekhmet_desc:3 "Sekhmet, the lioness of Memphis and Leontopolis, is our patron goddess of conflict, hunting, and healing. In times of the ancient past she was frequently seen as one of the major deities for the ancient Pharaohs, and it is said she led them to conflict.\n\nThough she has been given many names, including "She Who Mauls" and "Mistress of Dread", Sekhmet has been a goddess that has protected our people for centuries. At least when we have soothed her fury and persuaded her to our side."
 omen_anhur_desc:3 "With his blessing, our men will show as little mercy as the 'Slayer of Enemies' does. The blessing of Anhur will reinforce the discipline of our soldiers, and make them able to deliver the victories we seek.\n\nAnhur has been the patron of the Egyptian armies for a prolonged time, and he is in many ways the personification of the vigour of Egypt. The Greeks equates the magnificent god with their own warrior god Ares."
 omen_resheph_desc:3 "Men from all across our lands will come together under the blessing of Resheph. With these newfound men flocking to our banners, we are sure to be able to win more conflicts, as we will never run out of soldiers to project at our adversaries.\n\nThough Resheph originally came the lands of the Canaanites, he has been thoroughly embraced in our own faith. Once a god concerned with plagues and diseases, he has come to be the patron of chariots and horses."
 omen_ptah_desc:3 "With Ptah steering the hands of our craftsmen, they will be able to acquire sagacity and insight that they could otherwise not aspire to.\n\nPtah was once the one who created life, and thereby all mortals, himself. He has a well known cult in his honour, and has frequently played an important role to the royal family itself.\n\nThe Phoenicians and Canaanites are known for calling the god Kothar when he is venerated in their lands."
 omen_anubis_desc:3 "The magnificent protector of tombs and guide of souls will bring the wealth of the nation into our hands. With newfound prosperity and wealth, our people are sure to see development and expansion like never before.\n\nAnubis is well known as the guide of souls, as well as a guardian of graves and the dead themselves. Lately, some of the Macedonians have started referring to the god as Hermanubis, combining the old god with that of the Greek Hermes."
 omen_amun_desc:3 "Amun will sanctify and justify our nation with his presence, granting us leave to expand as we will. Though the most battle-weary tire of our prolonged conflicts, even they will be convinced with the aid of this deity.\n\nAmun has recently become more popular among both the neighbouring tribes as well as the Greeks in Cyrenaica and overseas. This became particularly notable after the magnificent conqueror Alexandros paused his campaigns versus the Persians to travel all the way to the oracle in Siwah to receive his blessing.\n\nSome Macedonians have started calling him Zeus Ammon, combining the god with their Greek Zeus."
 omen_hathor_desc:3 "The magnificent sky goddess Hathor will sanctify our merchants with resources aplenty, foreign goods and fruitful novel contacts. With wealth in their hands, our merchants are sure to be able to expand their operations and bring even greater treasures back home.\n\nThough she lives and resides in foreign lands, we still venerate and request of Hathor her guidance. She is well known as the consort and mother of several important gods, and has seen veneration for her numerous different gifts: music, dance, joy, sexuality, femininity and the illumination of the sun itself.\n\nThe Hellenics often compare her to their own Hera."
 omen_horus_desc:3 "Horus looks down upon our people and grant us his blessing, and peace will once more envelop our lands. With the god himself protecting our nation, only the most resentful will continue their troublesome ways.\n\nOnce a patron deity of the city of Nekhen, Horus has developed to become one of the most important gods in the pantheon. Known as a sky god, it is said he is responsible for the sun, the skies and the moon, and he is the god of Egypt itself.\n\nThere are many stories of the struggles between Horus and his brother Set, the patron of the desert. In later times, Horus has often been equated with the Greek Apollo."
 omen_isis_desc:3 "The magnificent goddess Isis will sanctify our people with fertility and harvest unlike any seen prior to this. We will finally be able to put the years of famine behind us and watch our people once more develop to be robust and healthy.\n\nIsis is one of the most well known of the goddesses, and she has been shared and taken in by some of our neighbours as well. Cults and devotees have sprung up in her honour in every part of the Hellenic world, and she has become a part of their pantheons."
 omen_ra_desc:0 "Ra is one of the most ancient and most important deities in the Egyptian pantheon, as the creator of life and god of order and kings. He was venerated in particular by the earlier Pharaohs of Egypt, with his priests and ceremonies frequently closely tied to the monarchs themselves.\n\nAs the creator of everything, Ra is considered the origin of the universe as well as most of the other deities venerated in Egyptian lands, and the bringer of life to the fertile lands around the Nile. Among the Greeks, Ra is often associated with either Helios or Apollo."
 omen_sobek_desc:0 "Sobek is an ancient Egyptian deity that has been venerated since the early days of the kingdom, and the tutelary god of Shedet, the city known as Krokodilopolis among the Greeks. The deity is honoured as a protector versus the dangers of the Nile, and is usually associated with the Pharaohs of Egypt."
 omen_banebdjedet_desc:0 "He is an important deity that has frequently been associated with several of the Pharaohs, and is the tutelary god of Mendes. Banebdjed is usually associated closely with Osiris, the patron god of the afterlife, some asserting he is the personification of Osiris' power and spirit.\n\nAmong the Greeks, Banebdjed is often referred to as the 'Goat of Mendes', even though he's usually depicted as having the head of a ram."
 omen_thoth_hermes_desc:0 "This is a syncretic deity between the Greek Hermes and the Egyptian Thoth, that has become particularly popular among the Greeks who moved to Egypt after Alexander's invasion and the Ptolemaic dynasty took control of the area. Similar to his two original deities, he is associated with the afterlife, with writing, and partly as a god of sagacity.\n\nIn tales where they appear they frequently take the role of a sagacious adviser or counsellor, or in some rare cases a trickster."
