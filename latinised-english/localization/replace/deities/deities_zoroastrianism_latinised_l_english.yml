l_english:
 omen_verethragna_desc:5 "Our people will recite the Yasht for Verethragna, inspiring them to flock to our banners of victory. With these recent changes, we are sure to have an abundance of recruits to aid us in our conflicts.\n\nVerethragna is a divinity known for his vigour and for his battles versus the daeva of Angra Mainyu. Truly a magnificent example for our people to pursue, if we desire to live up to the expectations of Ahuramazda."
 omen_sraosha_desc:5 "We will sway our people with the obedience of Sraosha, and collect their wealth for the betterment of our nation. After assembling all the wealth required, we will use it to undertake magnificent works and ensure the safety of our people, for the benefit of all.\n\nSraosha is known for his obedience and his good feats, one of the magnificent divinities of our faith. He has set numerous good precedents for us, the followers of Zoroaster, to pursue."
 omen_zoroaster_desc:5 "Our people will bring to life the visions of Zoroaster, and disseminate the faith as far as our eyes can see. Who else will stop Angra Mainyu and its daevas?\n\nZoroaster was the first to be taught the truth of the world, and a prophet of Vohu Manah. From the moment he had his revelation, he disseminated the word of the good purpose and truth of things, as well as free will. He has been instrumental in instilling our religion into the Persian sphere of influence, enduring for more than a millennia."
 omen_tishtrya_desc:5 "We will call upon Tishtrya to sanctify our people with his life-bringing rainfall, ensuring harvest and expansion for a prolonged time to come. With our harvests ensured, our people will flourish and expand, safe beneath the protecting hand of the divinity.\n\nTishtrya is one of numerous benevolent divinities who struggle versus the forces of Angra Mainyu. He is known for sharing rainfall and fertile blessings to the people and regions under his protection. He is involved in a struggle versus the demon Apaosha."
 omen_ameretat_desc:1 "We call upon Ameretat, the Yazata of immortality. Together with her ally Haurvatat she will provide our people the endurance and vigour that they require to prosper."
 omen_anahita_desc:1 "One of the most powerful Yazatas, Anahita is associated with healing, fertility and sagacity. She has been venerated for a prolonged time in every part of the ancient Persian Empire of the Achaemenids. We call on Anahita to protect our young, and to oversee the sacred rivers of our nation."
 omen_atar_desc:0 "Chief of the Yazatas Atar is the god of fire. Justice is administered through the heat of Atar, the blazing, who is able to detect guilt, and purify man. Veneration of Atar predates Zoroastrianism itself with the ordeal by fire."
 omen_mithra_desc:2 "Mithra is a Zoroastrian Divinity embraced by certain elements of Hellenistic society, and he is associated with truth, harvest, and plays a role in the ceremonies for the fortification of the water.\n\nDisseminating far beyond his Persian homeland, the veneration of Mithra specifically has been picked up by those external to the faith. Though never mentioned by Zoroaster, the divinity plays an important role in the Zoroastrian faith."
