l_english:
 omen_gekho_desc:0 "Gekho is the foremost of the numerous $tibetan$ deities, a god of the heavens and the stars. Most of the other gods called upon by the locals bow down prior to him, and he is known for vanquishing malevolent spirits that might trouble his faithful. He is usually venerated with the sacrifice of yaks, sheep, or gold, gifts offered as thanks for his assistance."
 omen_tingnam_gyalmo_desc:0 "Tingnam Gyalmo is a blue-cloaked goddess of the ocean, and the consort of Kuchi Mangke. As a protector of oceans and rivers, she plays an important role for the $bon_religion$ faithful and is profoundly venerated."
 omen_drablai_gyalmo_desc:0 "Drablai Gyalmo is one of the most important of the deities of the $bon_religion$ faith, the consort of Gekho, and a goddess of the heavens in her own right. The goddess takes on many aspects, be it a calm white goddess of life or terrifying black hag of demise, and is frequently associated with the heavenly bodies and natural phenomena."
 omen_kuchi_mangke_desc:0 "Kuchi Mangke is a fertility god associated with Gekho, and the consort of Tingnam Gyalmo. He is usually portrayed as a tiny god, some say his body is as small a spindle, and is tasked with sheltering children from malevolent spirits that might injure them."
 omen_ati_muwer_desc:0 "Ati Muwer is a conflict god in her own right, and an important member of the circle of deities associated with Gekho. She is frequently portrayed in golden or gilded armour, with a bow in hand, riding transversely across the sky."
 omen_phuwer_desc:0 "Phuwer is a god of divination and astrology, and a member of Gekho's circle. The deity is usually portrayed as an impressive figure dressed in white robes, together with three female companions. The $bon_religion$ faithful venerate the god with lamb fleece, coloured ribbons, and the dried hearts of a bat, a crane, and a cuckoo."
 omen_traphu_desc:0 "Traphu is a smaller deity among the $bon_religion$ faithful, usually associated with the more northern regions whence he originally hails: the mythical lands of Drugu. It is said he was born in a crystal castle, encircled by birds, moonbeams and sun rays."
 omen_the_elements_desc:0 "The four elements play an important role in the $bon_religion$ faith, even being personified as minor deities themselves. Out of the four elements: wind, earth, water, and fire; air was usually the most important, and depicted as riding a white deer in every part of the land."
