l_english:
 deity_flavor.1.desc:0 "We have received news that our people in [hunting_province.GetShortName] have seen a considerable rise in hunting game these last months, almost as if game are being driven to our territories intentionally. Some assert our recent veneration of [hunting_deity.GetName] is the cause, whereas others think this is just the last of numerous blessings [ROOT.GetCountry.GetRuler.GetPraenomen] has received by the gods."
 deity_flavor.1.b:0 "Well, time to make the most of this minor blessing then."
 deity_flavor.1.c:0 "We will make sure these animals flourish and prosper in [hunting_province.GetShortName]."
 deity_flavor.2.desc:0 "We receive news that a brief and intense tempest was ravaging the [port_province.Custom('get_city_status_lloc')] of [port_province.GetName], but miraculously none of the people, vessels, nor structures in the area have been damaged. After the tempest passed, the waters seem surprisingly calm, and apparently the local fishermen have been able to catch several times what they usually do."
 deity_flavor.2.c:0 "If this port is that safe, maybe it can be our new military harbour."
 deity_flavor.3.desc:0 "Messengers arrive from [port_province.GetName], bringing news that the fishermen have been unable to catch anything recently. It seems the local fish stocks have been entirely ruined after we proclaimed these waters blessed by [sea_deity.GetName] and the local fishermen zealously caught as much as they could."
 deity_flavor.4.desc:0 "The minor spring to [spring_deity.GetName] in [spring_province.GetName] has become a lot more popular in recent days, as novel stories have been circulating concerning the deity. Even people from afar are travelling all the way to the [spring_province.Custom('get_city_status_lloc')] to take part in the rites that take place there, hoping to be blessed."
 deity_flavor.4.c:0 "A public gesture in honour of [spring_deity.GetName] will look good for [ROOT.GetCountry.GetRuler.GetPraenomen]."
 deity_flavor.5.desc:0 "A travelling healer has come to [ROOT.GetCountry.GetName], supposedly brought here by rumours of our veneration of [healing_deity.GetName]. This [healer_character.GetName] has been seen travelling around in [healing_province.GetState.GetShortName], assisting the locals."
