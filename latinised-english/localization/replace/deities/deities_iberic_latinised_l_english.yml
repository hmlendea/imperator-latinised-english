l_english:
 omen_semnocosus_desc:4 "Semnocosus is an Iberian conflict god venerated by numerous of the tribes in the area. He is particularly popular with soldiers and warriors, who occasionally sacrifice prisoners and slaves in his honour."
 omen_candamius_desc:4 "Candamius is a local sky god among the Iberian tribes, and one of their primary deities. Among the Romans he is frequently associated or conflated with their own sky god, Jupiter, and in some cases even used as an epithet to create the syncretic Jupiter Candamius."
 endouellicus_description:0 "The god is known as an earth deity who has prophetic visions of the future, some that he is willing to share with his numerous followers. In addition, many call upon his blessing when they hope to receive enhanced health, bountiful fields or a better afterlife for their loved ones.\n\nThe deity is occasionally associated with the Graeco-Egyptian Serapis, or the Roman Asclepius."
 omen_dercetius_desc:4 "Dercetius is a mountain god venerated by some of the tribes in Iberia, particularly those around Gallaecia and Lusitania. He is frequently associated with rich minerals and the wealth one might discover in the earth."
 omen_eacus_desc:4 "Eacus is a weather god among the numerous tribes of Iberia, called upon for rain and abundance. He is frequently associated with the weather gods of other faiths, be it Jupiter, Zeus, or Ba'al."
 omen_ataecina_desc:4 "Ataecina is considered the goddess of the underworld by the people of Iberia, and is closely related to the seasons. She is frequently called upon as spring approaches, as the tribes believe she is the one who brings vitality at the start of every year. Among the Greeks she is known as Persephone, their own goddess of seasons and the underworld."
 omen_duillae_desc:4 "These deities are several mother-goddesses venerated together by the people of Iberia. The goddesses are associated with fertility, foliage, and vegetation, and frequently portrayed as several women seated together. They are at times associated with the mother-goddesses of Gaul and Germania."
 omen_cariocecus_desc:0 "Cariocecus is a conflict god venerated by numerous of the Iberian tribes. He is associated with human and animal sacrifice both, and it is said his priests can make predictions based on the way the intestines fall out of the body."
 omen_betatun_desc:0 "Betatun is one of the numerous goddesses of the Iberian people, venerated in every part of the peninsula. She is a healing deity with her own oracles, who can supposedly see the future for her worshippers, and popular even external to her native lands."
