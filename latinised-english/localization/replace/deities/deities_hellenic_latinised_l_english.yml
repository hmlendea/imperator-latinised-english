l_english:
 omen_serapis_desc:4 "The worship of Serapis is the meeting point between Egyptian and Hellenic cults. The name Serapis comes from "Osorapis", under which the Egyptian Greeks knew the local Osiris-Apis. Serapis is meant to collect as many divine functions (both Egyptian and Greek) as possible: he inherits the power to legitimize the Pharaoh from Apis and Osiris on the Egyptian side, but also demonstrates Greek traits that liken him to Zeus Soter, the fertility god Dionysos, the healing god Asklepios and, in particular, the god of the Underworld Hades/Plouton.\n\n\n\nThe worship of Serapis ensures success and good fortune to the Pharaoh-Basileus and to the country, but he is also an oracular deity with Mysteries undertones, who grants fertility to the land.\n\nAs the husband of Isis and the caretaker of the afterlife, it is said the souls of the dead are brought to Serapis by the Graeco-Egyptian psychopomp Hermanubis, where they will face judgement."
 omen_harpocrates_desc:4 "Harpokrates is the son of Serapis and Isis, taking elements from the Egyptian deity Horus the Child. He is the patron god of silence, secrets, and hope, and he symbolizes the sun's victory over the obscurity of night.\n\nThe Greeks have almost entirely integrated Harpokrates into their pantheon as a god of secrets, while the Egyptians look more to his heritage as the Younger Horus. For both sides he plays the role of a bringer of hope for his followers."
 omen_demeter_potnia_desc:1 "$demeter_description$\n\n#Y Potnia#!: This is one of the epithets given to Demeter, frequently used in her role as one of the deities of the Elusinian Mysteries. These mysteries have long played an important role for Athenians and Attic politics, even though they take place in the proximate city of Eleusis."
 omen_helen_desc:1 "It is said Helen was the most beautiful female in Greece, and married to king Menelaos of Sparta, when Prince Paris of Troy spirited her away to his homeland. This was the start of a ten year long siege, followed by the destruction of the city at the hands of Greeks.\n\nAs the city burned around them, Menelaos forgave his wife, and decided to bring her back home to Sparta. The two of them, and Helen in particular, have been the focus of a cult in Laconia ever since."
 omen_artemis_orthia_desc:1 "$artemis_description$\n\n#Y Orthia#!: This specific epithet of the deity has strong connections to fertility and the harvest, and a focal point for many of the local celebrations and festivals in Sparta. Particularly the children of our nation tend to take part in the honouring of Artemis Orthia."
 omen_apollo_karneios_desc:1 "$apollo_description$\n\n#Y Karneios#!: Apollo Karneios is a version of the deity that is related to the harvest and herds, and has been venerated in Sparta for centuries. The stories say Apollo punished Sparta after the demise of one of his beloved seers, until they started offering up sacrifices to the deity in a manner of which would later be formalized as the Karneia festival."
 omen_athena_polioukhos_desc:1 "$athena_description$\n\n#Y Polioukhos#!: Athena Polioukhos is the protector of the city-state, and associated with warfare and metallurgy both. She has been in the centre of Spartan veneration for as long as anyone can recall, and is frequently invoked when our home has been threatened."
 omen_arethousa_desc:1 "Arethousa was a nymph who fled her home in Arcadia and the river god Alpheios, a deity in love with her, and begged the goddess Artemis to protect her. She was turned into a spring under the island of Ortygia just off the coasts of Sicily, and became an important focal point of religious veneration in the city of Syracuse."
 omen_athena_nikephoros_desc:1 "$athena_description$\n\n#Y Nikephoros#!: This epithet of the deity is one of the numerous reflections of her warlike side, as the bringer of victory. As the orderly conflict deity in Greece, she is frequently invoked by numerous Greeks prior to a fight or a campaign."
 omen_apollo_didymaios_desc:1 "$apollo_description$\n\n#Y Didymaios#!: This epithet, the Twin, is frequently used for Apollo in cases where he is referred to as the twin brother of Artemis. In certain city-states, like the city of Syracuse, Artemis plays a more important role than her brother, but both of them are venerated by the populace."
 omen_zeus_naios_desc:1 "The unmatched vigour of the most magnificent of the god will remind our people of their unmatched superiority and their blessings as patrons of the most ancient incarnation of the thunderer.\nDodona is the original centre of the Hellenic pantheon, home to the once peerless oracle of Zeus of the Spring."
 omen_dione_desc:0 "The She-Zeus brings life and observes all men, spurring them to battle and ensuring the next generation of warriors is as robust as the last.\nDione is a mysterious god from the most ancient day of the Hellenic religion whose veneration was maintained at the ancient religious centre of Dodona in the Epirote mountains."
 omen_apollo_aktiakos_desc:0 "Apollo Aktiakos observes the sailors of the Ambrakian gulf and Ionian Sea, and unites the faithful regardless of their origins or mother tongue with his lyre.\nThe shrine of Apollo at Actium was founded by Corinthian settlers and quickly became a regional religious centre, spawning its own games and the famous Actia festival."
 omen_achilles_desc:0 "Achilles, the magnificent hero of the Iliad, rests outside the city of Ilion, where his heel was pierced by Paris' arrow. His shining example of martial excellence will inspire our soldiers to surpass even his victories.\nThe hero cult of Achilles attracts devotees from in every part of the Hellenic world who assemble at his grave near the ancient ruins of Troy."
 omen_zeus_olympios_desc:0 "Zeus has been venerated by the Macedonians at Dion beneath Mount Olympos for eons, sanctioning the victories of our kings from the distant past to Alexander the Great and beyond. His sanctuary will rival that at Olympos in Elis, outshine that of Apollo at Delphi, and put to shame the Parthenon of Athens."
 omen_apollo_nabu_desc:0 "Apollo-Nabu is a syncretic deity venerated by Greek emigrants to Babylonia and Mesopotamia, who saw the local Nabu and merged it with their own Apollo. With the rulers of the Seleukid Empire asserting to be descendants of the Greek Apollo, they in particular have promoted the syncretic deity in lands they have ruled."
 omen_zeus_belos_desc:0 "Zeus Belos is a syncretic deity venerated in Babylonia and Mesopotamia in some of the flourishing Greek urban centres in the area. After the syncretic Apollo-Nabu started becoming more popular in Seleukid lands, the locals started treating the two fathers of Apollo and Nabu, Zeus and Marduk, as a syncretic deity as well."
 omen_dionysos_kathegemon_desc:0 "$dionysus_description$\n\n#Y Kathegemon#!: The epithet 'the Leader' is given to Dionysos in the region encircling Aeolia and Pergamon in Asia, where he takes on a more prominent role as the chief deity of some urban centres."
 omen_telephos_desc:0 "As the son of Herakles, and a demi-god in his own right, Telephos has long been a popular figure in Greek myths and stories. However in certain parts of Asia and Arcadia, notably in Pergamon and Tegea in particular, he is treated with special rites and veneration as the mythical founder and the ancestor of many of the people living there."
 omen_leto_desc:0 "Leto is the mother of Apollo and Artemis, two famous gods in every part of most of Greece, and an immortal entity in her own right. Though rarely as popular as her offspring, nor venerated in as numerous places, she has some rare cults in her honour in Lycia in Anatolia, and on the island of Crete."
 omen_hekate_desc:0 "Hekate is a goddess of magic, crossroads, and the night, particularly popular among the people of Caria and Thessaly, with shrines in Aigina, Byzantion, and close to the city of Chrysaoris. Some myths claims she originally hailed from the east, or from Egypt far to the south, but she has long since made her own identity in Greek culture. The goddess is usually depicted as three female deities in one, though not uniquely so, and frequently accompanied by a dog."
 omen_alexander_desc:0 "Alexander was a Macedonian general and king who invaded Persia, and conquered the whole empire in a mere thirteen years. After his demise, his newfound empire was ripped apart as his numerous old friends and allies tried to take the crown for themselves.\n\nOne of his ancient generals, Ptolemaios, brought Alexander's body to Egypt and started a cult in his honour. They considered Alexander much more than simply a mortal monarch, and revered him as an equal to the Gods of Olympus."
 deity_deified_ruler_desc:1 "Though [CHARACTER.GetPraenomen] was once a mere mortal, [CHARACTER.GetSheHe] is now considered a god. [CHARACTER.GetHerHis|U] veneration resembles that of [DEITY.GetDeityType.GetName], but will grant additional benefits when [CHARACTER.GetSheHe] is invoked."
 omen_aphrodite_euploia_desc:0 "$aphrodite_description$\n\n#Y Euploia#!: This epithet means 'Aphrodite of Good Navigation' and identifies the goddess' protection of sailors. Born from the sea and worshipped mainly on islands, such as Cyprus and Kythera, Aphrodite has invariably shown a particular proclivity for the sea; however, this specific cult has caught on only recently. Aphrodite Euploia grants smooth sailing to those who pray to her on land, and calms the stormy sea for those who call upon her amidst the waves. She also ensures naval victory to the admirals who honour her."
