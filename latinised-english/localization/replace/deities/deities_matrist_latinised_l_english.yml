l_english:
 omen_medeine_desc:3 "Medeine is known as the patron goddess of all things related to hunting, forests and feral life. Our warriors frequently call upon her aid when they depart home, be it for simple foraging purposes, her protection while they stay in her domain to aid them in battle."
 omen_mother_goddess_desc:4 "The Mother Goddess is the quintessential deity of our pantheon, being the earth we live on, as well as the progenitor of our tribes. Our people look to her for guidance, as well as protection and sustenance, hoping for bountiful harvests and assistance."
 omen_perkunas_desc:4 "Bravery, the skies, and fire, they all pertain to the realm of Perkunas. He is an inspiration to our heroes and soldiers, with the numerous tales of his feats. The other deities of our pantheon looks to him as a judge and arbiter, and rely upon his decisions."
 omen_divine_twins_desc:3 "The Divine Twins draw Saulia transversely across the sky as morning turns to day, and day turns to night. They play an important part of our cosmology, and protect our homes and people."
 omen_deivas_desc:3 "Deivas is one of the supreme gods of our pantheon, the skyfather who passed down his tasks to those that came after him. Progenitor of all, we still pray to him for guidance and assistance, as the strongest entity of our pantheon."
 omen_governing_goddesses_desc:3 "It is said the seven Governing Goddesses craft fate itself. Spinning the threads of life, weaving together armed conflicts and peace, as well the destiny of our people. We look to them to be aware of the future, and know what it will be well."
 omen_saulia_desc:3 "Saulia lights up the world as she pass transversely across the sky. Once married to the moon, the two have long split apart to create the day as we know it. Every day she is helped by the Divine Twins to pass transversely across the sky, and visit her daughter."
