l_english:
 omen_alilat_desc:3 "The great Aililat will remain among our men and sanctify them with knowledge of conflict, to secure their loyalty and morale. With their discipline reinforced, we are sure to win numerous conflicts and discover victories where we never could previously."
 omen_al_uzza_desc:3 "With the blessings of Al-Uzza, our young men will readily prepare for conflict, aware that the goddess will watch over and protect them. With these newfound recruits, our armies are sure to overflow with men to overcome our adversaries."
 omen_al_kutbay_desc:3 "The scribe will teach our scholars in matters of prophecy and writing. As we are taught novel things, it is sure to be used for the betterment and benefit of our society as a whole."
 omen_talab_desc:3 "Ta'lab is a lunar deity who have a definite influence over the earth, fertility, and the harvest. We frequently call upon his oracle to provide us counsel concerning how to proceed in times of necessity."
 omen_ailiah_desc:3 "The supreme god will observe and aid us in conflicts, justifying our expansion into foreign lands. Only our most fierce rivals will oppose our continued campaigns now that we have Ailiah on our side, endorsing our conflicts."
 omen_al_qaum_desc:3 "We request of the god of caravans to watch over our merchants as they traverse the world for the good of our nation. The richer our merchants and caravans become, the more prosperity they will bring to our community."
 omen_manat_desc:3 "We offer up our blessings to magnificent Manat, hoping she will turn the fates of our people in a favourable direction. With the great goddess at our side, we shall assuredly see fewer struggles and internal disagreements for the time being."
 omen_orotalt_desc:3 "Sacrifices will be made to Orotalt as to convince the god to sanctify our harvests with life for numerous years to come. Our crops are sure to develop robustly as long as we have the support and aid of the god. "
