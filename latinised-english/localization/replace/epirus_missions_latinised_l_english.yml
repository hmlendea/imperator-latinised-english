l_english:
 me_epi_1_16_demand_rejected:0 "Requirements Rejected"
 me_epi_1_16_wounded_opmod:0 "Insulted by Requirements"
 desc_me_epi_1_12_pmod:0 "The renovation of this city has attracted novel settlers and improved the living standards of its population."
 desc_me_epi_1_5_cmod:0 "Increased central control over the numerous villages of Epirus has permitted greater oversight but upset some of the aristocracy."
 desc_me_epi_1_end_cmod:0 "United under robust leadership, Epirus is once again ready to turn its attention to the numerous opportunities abroad."
 desc_me_epi_1_3_cmod:0 "Expanding control over the military will assist ensure their loyalty and improve the efficiency of recruitment, but upsets local power holders."
 desc_me_epi_1_6_cmod:0 "Expanding the breeding and training of the vicious Molossian hounds has brought boons in all sorts of methods."
 desc_epirus_1_1_cmod:0 "Turning ones back on a close friends does not lend itself to the building of confidence."
 desc_me_epi_1_11_cmod:0 "With the court united under the leadership of the Basileus, Epirus is a minor further from the fractious past decades."
 desc_me_epi_1_8_pmod:0 "The foundation of a novel city promises opportunity and abundance for those willing to risk a novel life."
 desc_me_epi_1_10_pmod:0 "The ancient colonies of Illyria can once again flourish under the leadership of civilised Greeks."
 desc_me_epi_1_17_pmod:0 "Our novel capital has much that aged lacked, from access to the sea to an abundance of arable land."
 desc_epirus_2_8_cmod:0 "Increasing our experience in the organisation and handling of vessels has given our sailors a newfound confidence."
 desc_epirus_2_1_cmod:0 "We have at last taken suitable retribution on the pitiful and dishonourable hill tribes of Italia, who slew our magnificent king Alexandros I. Clearly the gods sanction our vengeance and will lead our armies to glory in Magna Graecia."
 desc_me_epi_2_4_smod:0 "Being governed by the robust hand of the Epirotes may not be ideal for the Italiotians, but it beats being ruled by Italics."
 desc_me_epi_2_7_cmod:0 "Our victories over the Punic barbarians have proven the superiority of the Greeks in the west, and that the gods favour us still."
 desc_me_epi_2_5_cmod:0 "We will not tolerate Italic treachery, their armies must be driven from the field and their urban centres turned to dust."
 desc_epirus_3_greece_7_pmod:0 "This city will now serve as the centre of the Epirote kingdom of Macedonia - the rightful reclaimers of Alexander's legacy."
 desc_epirus_3_greece_13_pmod:0 "This city is a testament to the vigour and cultivation of the once 'backward' Epirote people."
 desc_me_epi_3_12_smod:0 "Our conquest of the unruly Aetolians has brought their fighters into our ranks, but they remain bitter concerning their defeat."
 desc_me_epi_3_4_cmod_2:0 "Our friendship with the Thessalian people brings numerous valiant volunteers into the ranks of our cavalry."
 me_epi_2_27_cmod_desc:0 "The Italiote cities have grown impatient with the severity of our leadership."
 loyalty_pyrrhus_travelling:0 "Pursuing Support"
 loyalty_centralize_court:0 "Centralise Court"
 epirus_1_epirus_BUTTON_TOOLTIP:0 "Epirus requires robust leadership to prevail."
 epirus_1_epirus_DESCRIPTION:0 "If Epirus is to become a feared power once again she must be robust within and without. The Molossian's petulant division has driven her into chaos - now all must bow to the king and respect his wishes if Epirus is to survive."
 epirus_1_epirus_CRITERIA_DESCRIPTION:0 "Secure the throne of Epirus and fortify her position."
 epirus_1_epirus_REWARD_DESCRIPTION:0 "Development of Epirus and claims on her neighbours."
 epirus_1_epirus_1_reward_tt:0 "Epirus obtains claims on Taulantian territories in the Areas of #Y Epirus#! and #Y Illyria Graeca#!."
 epirus_1_epirus_2_DESC:1 "The Taulantians have been friends to the Epirote people and kingdom, but some say their kindnesses are self-serving and argue the frontier cities of Illyria are rightfully ours. Will we permit our prior debts to bar our way?"
 epirus_1_epirus_2_else_tt:0 "If they refuse we will obtain claims on #Y Taulantian#! territories in the Areas of #Y Epirus#! and #Y Illyria Graeca#!."
 epirus_1_epirus_2_rival_tt:0 "#R They are less probable to accept because our rulers are historic rivals.#!"
 epirus_1_epirus_2_friend_tt:0 "#G They are more probable to accept because our rulers are historic friends.#!"
 epirus_1_epirus_3_allow_tt_4:0 "Any character is alive in Epirus who conforms to the current succession legislation."
 epirus_1_3_req_tt:0 "The #Y [GetOffice('office_marshal').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! of [SCOPE.GetRootScope.GetCountry.GetName] needs to fulfil the following requirements:\n    [SCOPE.GetRootScope.GetCountry.Custom('me_epi_1_3_loyalty')]"
 epirus_1_epirus_4_reward_tt:0 "[me_epirus_scope.GetName] obtains Claims on the Territories of #Y [GetProvince('(int32)465').GetName]#!, #Y [GetProvince('(int32)462').GetName]#!, and #Y [GetProvince('(int32)463').GetName]#!."
 epirus_1_epirus_5_DESC:0 "The Molossians still hold far too much influence in the country, both at court and in the management of land. If we are to compete with our neighbours we must continue to centralise power under the crown."
 epirus_1_5_req_tt:0 "The #Y [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! of [SCOPE.GetRootScope.GetCountry.GetName] needs to fulfil the following requirements:\n    [SCOPE.GetRootScope.GetCountry.Custom('me_epi_1_5_loyalty')]"
 epirus_1_epirus_8_DESC:0 "Our main centres remain inland, excluding us from commercial enterprises and naval expansion. If we are to again attain the heights achieved by Alexandros I, we must construct a coastal centre that matches our aims in ambition."
 epirus_1_epirus_9_DESC:0 "The island of Korkyra, settled by Corinthian settlers, remains a disputed territory. Over the years numerous have laid claim to her, being strategically placed along the Adriatic coast and large enough to support a noteworthy settlement."
 epirus_1_epirus_10_DESC:0 "The Greek colonies along the Taulantian coast have had a rough time of it, swapped between tribes and Diadochi as each tries to expand its influence. These cities deserve superior, and will receive it under our benevolent rule..."
 epirus_1_epirus_11_DESC:0 "Epirus has been racked by internal strife; the throne constantly changing hands between the two main branches of the Aiakid dynasty for decades. We must place these childish disputes to bed once and for all."
 epirus_1_epirus_11_allow_tt_1:0 "[GetCharacter('(int32)70').GetFullName] has removed the menace of pretenders."
 epirus_1_epirus_12_DESC:0 "Our people are still looked down on as backward dolts on the fringes of civilisation. We must ensure the ancient tribal centres rival the cities of Greece if we are to compete and defend our reputation."
 epirus_1_epirus_13_DESC:0 "The origins of Dione are shrouded in mystery, some asserting she is a foreign god imported from Phoenicia, others that she is a vestige of the most ancient Pelasgian traditions of our faith - but either way she should be honoured."
 epirus_1_epirus_14_allow_tt_2:0 "Has at least #Y 10#! military edifices in the country. ([SCOPE.Custom('epi_mis_1_14_cus_loc_2')]/#Y 10#!)\n     Barracks count as #Y 2#!, Training Camps count as #Y 1#!."
 epirus_1_epirus_15_DESC:0 "The upheaval of recent years has placed power over the Hellenic world into the hands of monarchic diadochi powers. A royal marriage would be an excellent method to exert influence and build friendships with these fellow kingdoms."
 epirus_1_epirus_16_DESC:0 "The villages and tracts along the frontier with our Taulantian friends have been fluid in changing hands depending on circumstances. There are lands they hold which even they must see should now be returned to Epirus."
 epirus_1_epirus_16_reward_tt:0 "#Y [me_epirus_scope.GetName]#! may negotiate with #Y Taulantia#! over control of their frontier territories."
 epirus_1_epirus_17_DESC:0 "The ancient mountain capital of the Molossians has served her kings well, but the changing tides call for a modern urban city on the coast if we are to rival our neighbours in pomp and scale."
 epirus_1_epirus_18_DESC:1 "Consecrated by the Corinthians who founded the settlement of Anaktorion, the sanctuary of Apollo Aktiakos has become perhaps the foremost religious centre of the Ambrakia gulf. Restoring its edifice will sit well."
 epirus_2_magna_BUTTON_TOOLTIP:0 "The rich lands of Magna Graecia await for any robust enough to claim them."
 epirus_2_magna_DESCRIPTION:0 "It is time for Epirus to live up to the aspirations of King Alexandros I, who fell while campaigning in Magna Graecia, and reclaim her lost possessions across the Ionian ocean prior to the Greek colonies fall to Italic barbarians."
 epirus_2_magna_1_DESC:0 "The death of one of our most glorious kings at the hand of an Italic barbarian has weighed heavily on Epirotes reputation and pride. We should resolve our ancient scores with the Lucanians and Bruttians."
 epirus_2_magna_2_DESC:0 "The ancient Italiotian colonies are assailed on all sides by the rising Italian powers and unable to defend themselves due to their soft ways. We should offer them protection as a means to expand our influence."
 epirus_2_magna_2_allow_tt:0 "A liberated Italiotian country in the Regions of #Y $magna_graecia_region$#! or #Y $central_italy_region$#! with less than #Y 6#! territories is not allied or at war with, and has more than #R -25#! Opinion of, [me_epirus_scope.GetName]."
 epirus_2_magna_3_DESC:0 "The rising menace of the Italics must be countered, and the assailed Italote cities of Magna Graecia are perpetually willing to accept assistance from those who will protect them from the barbarian menace."
 epirus_2_magna_3_2_allow_2:0 "Is at war with a liberated non-allied #Y $hellenic$#! culture group country in the Region of #Y $magna_graecia_region$#!."
 epirus_2_magna_3_reward_tt:0 "May offer #Y $hellenic$#! culture group countries in the Regions of #Y $central_italy_region$#! or #Y $magna_graecia_region$#! to accept our leadership in defence of the Greeks of Italy.\nObtain claims on the aggressor's territories in the Region of #Y $magna_graecia_region$#!."
 epirus_2_magna_5_DESC:0 "There is no requirement to fight costly armed conflicts if an equitable division of interests can be agreed upon - we should treat with the Italics as Alexandros I did and thereby make the Italics recognise our legitimate hold on the region."
 epirus_2_magna_5_allow_tt:0 "A liberated #Y $latin$#! culture group country in the Regions of #Y $central_italy_region$#! or #Y $magna_graecia_region$#! who owns territory in #Y $magna_graecia_region$#! and has at least #Y 20#! territories is at peace with [me_epirus_scope.GetName]."
 epirus_2_magna_6_DESC:0 "The Italics have grown ever more audacious, emulating the culture of the Greek colonists who they have pitifully emulated. We must demonstrate them that Magna Graecia is a land for the Greeks, ruled by Greeks."
 epirus_2_magna_7_DESC:0 "It has been the dream of many a Greek king to plunder the wealth of Carthage, that most proud and mighty city, which for so long has been a thorn in the side of Greek colonists and merchants. Epirus can fulfil this dream."
 epirus_2_magna_9_DESC:0 "The lazy Italiotian cities have embroiled us in their ancient disputes, and it is only right that we should obtain payment for services rendered and the preservation of their father's arduous work."
 epirus_2_magna_2_allow_tt_2:0 "At least one liberated #Y $italiotian$#! country with less than #Y 5#! territories exists in the Regions of #Y $magna_graecia_region$#! or #Y $central_italy_region$#! and is not allied to, at war with, and has more than #R -25#! Opinion of, [me_epirus_scope.GetName]."
 epirus_2_magna_11_reward_tt:0 "[me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] may obtain a nickname."
 epirus_2_magna_11_reward_tt_2:0 "Obtain claims on all unowned territories in the Region of #Y $magna_graecia_region$#!."
 epirus_2_magna_12_DESC:0 "The fractious cities of Sicily are all but in turmoil, facing internal divisions and the menace of a Punic resurgence while they are divided. We should respond to the Syracusan's calls for aid in exchange for authority."
 epirus_2_magna_12_reward_tt_1:0 "Obtain claims on #Y $carthaginian$#! held territories in mainland Sicily."
 epirus_2_magna_13_DESC:0 "The Siceliotes lack robust leadership and continue to bicker amongst themselves while their people cry out to be delivered from the Punic menace and civil strife. Only we can provide the requisite will and resolve."
 epirus_2_magna_13_allow_tt_2:0 "A liberated #Y $syracusan$#! country with less than #Y 10#! territories exists in Sicily which is not at war with and has more than #R -50#! opinion of [me_epirus_scope.GetName]."
 epirus_2_magna_13_reward_tt:0 "Epirus obtains claims on all territories in Sicily."
 epirus_2_magna_15_DESC:0 "The Italic tribes fight each other as frequently as the Greeks, and are distrustful of the most powerful and aggressive nascent powers. We should use this to our advantage and sway a tribe to our cause."
 epirus_2_magna_15_allow_tt_1:0 "A liberated #Y Italic#! nation with less than #Y 10#! territories exists in the Regions of #Y $magna_graecia_region$#! or #Y $central_italy_region$#! which is not allied or at war with the main #Y Italic#! power and is in Diplomatic Range of [me_epirus_scope.GetName]."
 epirus_3_greece_DESCRIPTION:1 "With internal divides resolved, the Epirotes are poised to become one of the foremost Greek powers in the wake of Alexander's demise if they can make the most of their strengths and the weaknesses of their neighbours."
 epirus_3_greece_1_reward_tt:1 "[me_epirus_scope.GetName] obtains claims on all diadochi or non-#Y $hellenic$#! non-ally owned territories and subjects in Hellas."
 epirus_3_greece_2_DESC:1 "It is said that the enemies of one's enemies are one's friends, and there are perpetually those willing to pounce on a surrounded foe if the opportunity presents itself."
 epirus_3_greece_2_allow_tt:1 "A neighbouring non-ally #Y $macedonian$#! country with at least #Y 10#! territories is bordered by another non-ally non-tribal #Y $macedonian$#! or #Y $hellenic$#! country with at least #Y 10#! territories."
 epirus_3_greece_2_reward_tt_1:0 "We will approach a country to ally with us versus [me_epi_3_2_enemy_scope.GetName]."
 epirus_3_greece_2_reward_tt_2:0 "We will approach a country to ally with us versus a common threat."
 epirus_3_greece_4_DESC:1 "The decaying monarchies of Greece face as much menace from ambitious pretenders seeking to emulate the magnificent men of our age as they do from domineering diadochi."
 epirus_3_greece_4_reward_tt:1 "Epirus may invite a claimant to a Greek monarchy, obtaining claims on them."
 epirus_3_greece_6_reward_tt:0 "[me_epirus_scope.GetName] obtains claims on Macedon (Areas of #Y $macedonia_area$#!, #Y $chalkidiki_area$#!, #Y $upper_macedonia_area$#!, and #Y $thessaly_area$#!.)\nAll Macedonian countries will forfeit #R -50#! opinion of Epirus."
 epirus_3_greece_7_reward_tt:0 "[me_epirus_scope.GetName] will obtain claims on the Region of #Y $macedonia_region$#!."
 epirus_3_greece_10_DESC:1 "It is time our great founding hero Achilles, known to the Epirotes as Aspetos, was properly honoured and his cult brought into our official pantheon. The first step must be to secure the site of his body on the slopes of Ilion."
 epirus_3_greece_11_DESC:1 "We must take our rightful place as the dominant Greek power now that the age of the Argeads has come to a close. Only Epirus can unite and lead the Hellenic world versus the menaces to east and west."
 epirus_3_greece_11_allow_tt_1:0 "[me_epirus_scope.GetName] owns at least #Y [SCOPE.ScriptValue('epirus_3_greece_11_target_svalue')|0]#! territories, directly or via #Y $hellenic$#! subjects, in the Region of #Y Greece#!. ([SCOPE.Custom('epi_mis_3_11_cus_loc')]/#Y [SCOPE.ScriptValue('epirus_3_greece_11_target_svalue')|0]#!)"
 epirus_3_greece_11_reward_tt:0 "Obtain claims on all unowned territories in the Region of #Y $greece_region$#!."
 epirus_3_greece_13_DESC:1 "Our king Tharrhypas, father of Alketas I, is said to have been the first to bring civilisation from southern Greece into the Epirote heartland. It is time we completed what he started, and placed the petty city states to shame."
