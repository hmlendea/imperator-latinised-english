l_english:
 egypt_mission_1_sea_task_1_DESC:0 "With her two harbours, [GetProvince('(int32)516').GetName] was founded in an ideal position to control the sea. We should maximise her potential by developing her port infrastructures."
 egypt_mission_1_sea_task_2_DESC:0 "For too long have pirates plagued the Nile and all Egyptian coasts. It is time to ensure the safety of travellers and merchants."
 egypt_mission_1_sea_task_4_DESC:0 "To dominate the sea, we require an adequate fleet!"
 egypt_mission_1_sea_task_6_DESC:0 "Imposing our control over the main islands of the Eastern Mediterranean and some ports in Asia Minor will considerably fortify our power in the area and support the movements of our fleets."
 egypt_mission_1_sea_task_7_DESC:0 "Since Alexander's death, Greece has been in turmoil. Athens, impoverished and disappointed by one sovereign after the other, now looks to us as her new liberator."
 egypt_mission_1_sea_task_8_DESC:0 "Rhodes is in an ideal position to become the cultural and economic centre of our maritime domains - a second capital far from Egypt."
 egypt_mission_1_sea_task_9_DESC:0 "For centuries, Cyprus has been the melting pot where Greek culture met the East and Egypt, where gods were born, and trade goods were encountered for the first time. \nCyprus and her glorious past are under our influence now, but, if we want to make her a vital centre of our economy, we will need to invest in her infrastructures."
 egypt_mission_1_sea_task_10_DESC:0 "Controlling Caria is an important step to ensure our dominion over the Aegean Sea. However, Caria's inland expanses and her position at the faraway frontiers of our empire may present a challenge to our power."
 egypt_mission_1_sea_task_11_DESC:0 "After Alexander's death, Greece has become fragmented and weak, each city trying to please now a Macedonian overlord, now another. It is time for a Liberator to unite Greece once again and to offer the Greek people a taste of (well-controlled) liberty."
 egypt_mission_1_sea_task_13_DESC:0 "For the liberty of all Greeks, it is time for us to expel all the (other) Diadochi from Greece!"
 egypt_mission_1_sea_task_15_DESC:0 "Rhodes has always had close ties with Egypt, but her position, in an area long contended among the Diadochi, has left the island in a delicate situation. The Rhodians resisted strenuously to Demetrios' siege some years ago, and the ensuing peace treaty ensured their neutrality. However, if we do not want to forfeit such a formidable base, we need to act first and formalise our relationship with Rhodes as soon as possible. We should dispatch an embassy offering our protection."
 egypt_mission_1_sea_task_15.tt:0 "Depending on Rhodes' political situation, we will receive an answer to our offer of protection. Remember that, if Rhodes belongs to another country, an armed conflict might ensue."
 egypt_mission_2_pharaoh_DESCRIPTION:0 "Pharaohs have reigned over Egypt for millennia. Deputy of the gods among mortals and holders of a divine office, the pharaohs owned all the lands of Egypt, officiated religious ceremonies, enacted the laws, and were directly responsible for the maintenance of cosmic balance. During his reign, Alexander showed himself to be increasingly attracted by the Eastern idea of divine royalty, which was foreign and loathed by his Macedonian collaborators. Among those was Ptolemaios I. \n\nHowever, times are changing. We now rule over a country rich in ancient traditions and a people mostly made up of Egyptian natives.\n\nThe Macedonian sovereigns will have to strike a balance between the expectations of their people and the reality of a Macedonian kingdom to create a solution that will be truly and uniquely theirs: a Ptolemaic Egypt."
 egypt_mission_2_pharaoh_BUTTON_TOOLTIP:0 "Making [GetCountry('EGY').GetName] robust and prosperous and presenting our kings as divine Pharaohs will ensure the happiness and loyalty of our people."
 egypt_mission_2_pharaoh_task_1_DESC:0 "Alexander founded Alexandria as a beacon of Greek civilisation in Egyptian land. It is our duty to realise his dream and transform the city into a capital worthy of pharaohs and gods."
 egypt_mission_2_pharaoh_task_2_DESC:0 "The Egyptian civilisation was built on the regular floodings of the Nile, which made the land fertile. However, much can be done to improve the food production of this land."
 egypt_mission_2_pharaoh_task_3_DESC:0 "The Delta of the Nile is where the Egyptian inland meets the Greek Mediterranean. It is vital to our economy that we transform this area into a platform for our international commerce, starting from the ports surrounding Alexandria."
 egypt_mission_2_pharaoh_task_4_DESC:0 "Since Alexander's days, more and more Greeks and Macedonians have been employed long-term in the Successors' armies far away from their countries of origins. A plot of land in the novel country where they spent most of their lives is a favourable solution for the requirements of our veterans."
 egypt_mission_2_pharaoh_task_7_DESC:0 "The Delta is where Egyptian and Mediterranean goods and merchants meet. Alexandria is its beating heart, but there are other ports and cities that could be developed to enhance our commerce potential."
 egypt_mission_2_pharaoh_task_8_DESC:0 "The Macedonian origin and Mediterranean interests of [ROOT.GetCountry.GetRuler.GetName] oriented our attention mainly to the Delta. However, a Pharaoh is King of both Lower and Upper Egypt, and the frontier with Nubia has perpetually been an area of particular commercial (and military) interest for Egypt."
 egypt_mission_2_pharaoh_task_10_DESC:0 "To fill the hearts of both our subjects and enemies with awe, we shall construct a wonder in Alexandria to last the ages!"
 egypt_mission_3_empire_DESCRIPTION:0 "While the wars of the Diadochi rage on, [GetCountry('EGY').GetName] sits in a relatively safe position - protected by deserts, seas, and neutral countries. Our founder, Ptolemy, was wise in his choice. \n\nHowever, [GetCountry('EGY').GetName] has much more to offer. We are the last heirs of a millennia-old empire, and we inherited their dreams and potential. In particular, Egypt has perpetually had a turbulent and checkered story with its closest neighbours - the Nubians and the Cyrenaicans. They pose no immediate threat to our survival, but these frontiers need to be pacified before we can safely move forward, and acquiring the riches from their lands would ensure our people's lasting prosperity. A bold Basileus might even use this opportunity as a stepping stone to the reunification of the Western Greeks!"
 egypt_mission_3_empire_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have asserted our dominance over the neighbouring people of Nubia and Cyrenaica, exploited the possibilities offered by our Southern frontiers and set our relationship with the powers of the Western Mediterranean."
 egypt_mission_3_empire_task_1_DESC:0 "The Red Sea: few Greeks have ever navigated it, but the riches coming via it from the wondrous lands of Arabia and India are renowned and desired everywhere. Expanding our ports is the first step to monopolise the commerce flowing towards the Mediterranean."
 egypt_mission_3_empire_task_3_DESC:0 "Merchants from faraway lands come to us via the Red Sea and the Mediterranean, but many of these lands are nothing more than legends to us. Alexander has taught us that the only limit is our willingness to traverse to the very end of the world, and explorers and intellectuals from our court have been aching to go where no Greek has gone previously."
 egypt_mission_3_empire_task_5_DESC:0 "The people of Africa have long traded in ivory, but Alexander's wars in India have taught us that elephants are also a formidable weapon, one that we can't permit our rivals to monopolise."
 egypt_mission_3_empire_task_7_DESC:0 "Egyptian relations with their Western neighbour have perpetually been problematic; now that a Hellenic pharaoh sits on the throne, it is time to take these astray Greeks under our protection."
 egypt_mission_3_empire_task_9_DESC:0 "We cannot place confidence in the Cyrenaicans - they have betrayed us too numerous times previously. We shall deal with them with an iron fist and make sure that they never defy us again."
 egypt_mission_3_empire_task_10_DESC:0 "The Cyrenaicans are Greeks like us and are our closest neighbours. We should create the preconditions for mutual confidence."
 egypt_mission_3_empire_task_11_DESC:0 "Our main interests are located in the Eastern Mediterranean. Ensuring a peaceful coexistence with our most powerful Western neighbour will considerably benefit our commerce and the security of our frontiers."
 egypt_mission_3_empire_task_12_DESC:0 "The Western Mediterranean is weak, chaotic and fragmented. We should take the opportunity to pursue our commerce interests aggressively and seize some conveniently placed ports. The waves shall be our kingdom and the roots of our power."
 egypt_mission_4_border_DESCRIPTION:0 "Since remote times, the lands beyond the Sinai have represented the farthest reach of Egyptian interests. The most glorious pharaohs of the past fought numerous battles in this land and extended their dominion to the North, along the coast. More recently, all invaders came from this side: first, the Persians, then, Alexander himself. \n\nAfter Alexander's death, this area was divided and contended until it was unified under Antigonos. Ptolemy stood on the side and waited; however, this policy proved to be too risky when Demetrios, Antigonos' son, invaded Egypt and was barely warded off. \n\nIt is time for us to meet the enemies from the East with a robust, preemptive initiative to demonstrate Egyptian superiority and to pacify the most dangerous frontier of our country."
 egypt_mission_4_border_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when the eastern frontier of the Egyptian kingdom will be have been secured, via the conquest of Palaestina, Phoenicia, Syria and coastal Asia Minor, long contended by the Diadochi."
 egypt_mission_4_border_task_1_DESC:0 "Sidon is a fundamental part of our plan of Eastern conquests. By installing a subject monarchy, we shall ensure our control of her considerable port and famous cedars."
 egypt_mission_4_border_task_2_DESC:0 "The Phoenicians are renowned for their vessels and seafaring talents. By controlling the main Phoenician ports, we are bound to obtain an advantage on our adversaries for the dominion on the Mediterranean."
 egypt_mission_4_border_task_3_DESC:0 "Philistia is, historically, a highly contested area. Asserting our dominion over her urban centres and fortresses would grant us a steadier stepping stone for our Eastern conquests."
 egypt_mission_4_border_task_5_DESC:0 "The coastal cities of Phoenicia host some of the largest and richest commerce harbours in the Mediterranean. If we support their growth and commerce, they will provide our economy and naval power a considerable boost."
 egypt_mission_4_border_task_6_DESC:0 "When Antigonos was at the peak of his power in Syria, his son Demetrios led an army versus [GetCountry('EGY').GetName], and he was barely repelled prior to he marched on Alexandria. As an act of symbolic revenge for this dishonour, we shall now conquer Antigonos' historical capital, Antigoneia!"
 egypt_mission_4_border_task_7_DESC:0 "Telmessos is the richest port in Lycia. By controlling the city, we shall ensure a robust position for our troops and fleets in the heart of Asia Minor, while keeping an interested eye on the Aegean Sea."
 egypt_mission_4_border_task_8_DESC:0 "The fame of Cilician pirates has long obscured any Cilician favourable quality. Once we control the area, we should root out all pirates and re-address the Cilicians' traditional sailing proficiency towards commerce."
 egypt_mission_4_border_task_9_DESC:0 "Cilician pirates have been the scourge of any power sailing the Eastern Mediterranean - including ourselves. It should be clear by now that piracy can't be eradicated from this area; if you cannot defeat them, you might as well create them your friends."
 egypt_mission_4_border_task_12_DESC:0 "Our expansion along the coasts of Asia has brought us to the gates of Thrace. If we manage to set up some robust bases in Europe, our position in the Aegean Sea will be considerably more solid."
 egypt_mission_4_border_task_13_DESC:0 "The lands of the Hebrews are renowned for being turbulent. We can't afford to leave a potentially rebellious area immediately behind our advancing frontier in the East, so we need to ensure their loyalty before moving on with our conquests."
 egypt_mission_4_border_task_final_DESC:0 "Our advance along the coasts of the Mediterranean has been unstoppable, just like Alexander's. Our rivals, the other Successors, are a more resilient adversary than the Persians, though, and our dream of a reunited empire of Alexander is still far - albeit a step closer today."
