l_english:
 dhe_body.5.desc:0 "After the recent conquest of [SCOPE.sP('body_province').GetName], our warriors spent much time prowling the streets for spoils.\n\nDuring this predatory but tolerated activity, one of our loyal officers reported coming across a sombre edifice shrouded in an atmosphere of majesty, the likes of which he had never previously experienced. On closer inspection, this mighty structure contained naught but a single sarcophagus, which the we believe pertained to [ROOT.GetCountry.Custom('get_knowledge_of_alexander')]. [SCOPE.sP('body_province').Custom('why_is_there_a_body_here')]\n\nPossessing the tomb of this great warrior is bound to bring us great prestige, not to mention the jealousy of our peers. It is true, however, that this great man commanded such respect that others may seek to wrest his body from us."
 dhe_body.5.desc_hellenic:0 "After the conquest of [SCOPE.sP('body_province').GetName], our soldiers, as usual, sacked the city, making off with all manner of spoils. There was, however, one area of the city that remained largely intact despite the looting.\n\nA grand edifice, looming over the densely packed districts of [SCOPE.sP('body_province').GetName], stood proud throughout our conquest. In it, lies the body of the most revered of men: Alexander. His victories almost innumerable, this man had a vision the likes of which has not been seen since. [SCOPE.sP('body_province').Custom('why_is_there_a_body_here')]\n\nSuch a man deserves to be left in peace for his eternal slumber, but various voices in our armies cry out for differing treatment of the remains of this hero, once feared and admired in equal measure."
 dhe_body.5.d:0 "To overlook Rome is recompense indeed."
 dhe_body.5.j:0 "A new commencement for the greatest among us, seems appropriate."
 dhe_body.5.o:0 "No more, shall we venerate the memory of a tyrant."
 body_in_alexandria:0 "It seems that he has been buried with the honour and respect that he must have deserved; in a great city, overlooking a sea he once called home."
 dde_build_mausoleum_desc:0 "Now that we have triumphantly returned the body of the great conqueror, Alexander, to our lands, it is advisable that we construct a mausoleum deserving of the memory of this great man."
 dhe_body.6.desc:0 "The sarcophagus of Alexander the Great was carried into our city, attended by great crowds. All fell silent at the sight; perhaps awed by the sobriety of the fate of such a great and honourable man.\n\nIt would become us to prepare a great mausoleum, deserving of laying this paragon of virtue to his final rest."
 desc_final_resting_place_alexander:0 "Reinstated once more, to his final resting place, Alexander's legacy lives on by inspiring the citizens of Alexandria to reach greater intellectual and philosophical heights."
 desc_burial_of_kings:0 "The Macedonian kings have been interred at Aegeai for many hundreds of years. It is only correct that Alexander has found his way back here, to slumber amongst kin, and to provide a place of pilgrimage for all Greeks."
 desc_alexander_in_babylon:0 "With Alexander's remains now securely interred in this most ancient of urban centres, the local population feel a strong sense of connection to the man who both conquered and uplifted them."
 desc_alexander_in_kafir:0 "Interred securely, near the very extent of his conquests, the presence of the remains of Alexander the Great, inspire strong feelings in those close by."
 desc_alexander_in_lysimacheia:0 "The first of our kind, Alexander, is now securely interred in the newly built city of Lysimacheia. All free men have doubled their efforts to align with the almost divine presence of such a prestigious memorial."
 desc_alexander_in_shushan:0 "Alexander is interred once more, in a location that held considerable meaning to him. The site of great nuptials; contracted to maintain peace and concord in a recently conquered realm, this site seems appropriate for the resting place of a great man."
