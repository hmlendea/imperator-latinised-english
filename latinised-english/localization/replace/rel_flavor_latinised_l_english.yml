l_english:
 rel_flavor_hellenic.1.desc:0 "A man some say is [ROOT.GetCountry.Custom('get_medicine_god')] himself has been seen in [SCOPE.sP('randomized_country_province').GetName]. Rumours says he brings back people from the brink of death, no matter the disease or injury they might have. Though the man is probably not a living god as some rumours suggests, there might be benefits to bringing him to court."
 rel_flavor_hellenic.1.b:0 "We will convince him to continue roaming through our territories."
 rel_flavor_hellenic.1.c:0 "And yet we have no require for his services."
 rel_flavor_hellenic.3.desc:0 "The Oracle of Delphi has been the rise and fall of many legendary heroes. Ill tidings arrive from the Oracle with a messenger, bearing news of the bad times to come, unless [ROOT.GetCountry.GetName] is to get a novel leader.\n\nThe nobles of our society commence looking at [ROOT.GetCountry.GetRuler.GetName] with sceptical eyes, as the Oracle herself has said [ROOT.GetCountry.GetRuler.GetSheHe] is ill-befitting a leader. Maybe it is time to change our leadership?"
 rel_flavor_hellenic.3.b:1 "We need to convince everyone that the Oracle is erroneous."
 rel_flavor_hellenic.7.desc:0 "Our men in [SCOPE.sP('randomized_country_province').GetName] woke up to find large massive olives unlike any ever seen before. The local priests declare it a blessing of [ROOT.GetCountry.Custom('get_wisdom_goddess')], some say it is even a show of preference to the rest of the world.\n\nOur [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] suggests structure a minor shrine to celebrate the goddess, to thank her for the gifts she has given to us."
 rel_flavor_hellenic.8.desc:0 "Our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] have suggested an offering to one of the gods, to bless us in our continuing conflict efforts. All the gods have their domains, and we should make sure we know what arrange of benefits we are looking for in battle."
 rel_flavor_hellenic.8.b:0 "Our armies will be prepared with the assistance of [ROOT.GetCountry.Custom('get_forge_god')]."
 rel_flavor_hellenic.8.c:0 "We require the guidance of [ROOT.GetCountry.Custom('get_wisdom_goddess')]. "
 rel_flavor_hellenic.8.e:0 "We do not require the assistance of the gods."
 rel_flavor_hellenic.9.a:0 "The soldiers will place an end to these bandits."
 rel_flavor_hellenic.10.desc:0 "[SCOPE.sP('randomized_country_province').GetName] has seen a huge influx of visitors lately, and a reputation for being one of the urban centres [ROOT.GetCountry.Custom('get_hero_god')] passed through on his way to Eurystheus back from Erytheia. Though it is impossible to say if he truly passed through the city or not, the stories have flourished lately.\n\nThis is a prime opportunity to construct upon the myth, to honour the Hero and increase the potential commerce in [SCOPE.sP('randomized_country_province').GetName]. "
 rel_flavor_hellenic.10.b:0 "We will hold a minor festival in his honour."
 rel_flavor_hellenic.11.desc:0 "A man approaches us with the request for a room and some assistance to write a grand tale for the ages. He promises us he will make sure to include [ROOT.GetCountry.GetName] into the tale, so it will be beneficial for us as well as himself.\n\nIf he manage to write this epic, we will receive the goodwill of the common folk as well as showing everyone what wise beneficial rulers we are."
 rel_flavor_hellenic.11.a:0 "We will make sure all his requirements are fulfilled while he writes this epic."
 rel_flavor_hellenic.11.c.tt:0 "We will dispatch the writer away."
 rel_flavor_hellenic.12.desc:0 "After months of writing, the man we hired to write an epic seems to have fallen into some monetary issues. Not only does he owe people money, but he requirements more money for his study as well.\n\nHe assures us that with a little bit of aid, everything will be finished in practically no time at all. Considering what little we have seen so far, it seems somewhat far-fetched."
 rel_flavor_hellenic.13.desc.a:0 "The grand tale of the Argonautica have been completed, with [ROOT.GetCountry.GetName] playing an important role in the tale of the hunt for the Golden Fleece. People from far and wide come to our territories, to hear the original tale of Jason and the Argonauts. Some people claim a novel Homer has been born, while others lay the honour at our feet for supporting the arts."
 rel_flavor_hellenic.13.desc.c:0 "The epic has finally been completed, with [ROOT.GetCountry.GetName] playing an important role in the tale. Not only did it not prove to be popular outside of our borders, but it became highly unpopular at home as well. Despite the assistance we gave the writer, he simply could not write a decent tale after all. Shortly after the failure became apparent, the man fled the court, not to be seen again."
 rel_flavor_hellenic.13.a:0 "Fantastic labour."
 rel_flavor_hellenic.13.b:0 "We appreciate the labour he did."
 rel_flavor_hellenic.14.desc:0 "One of our soldiers has the reputation of a man blessed by the god of war himself, fighting with a frenzy unlike any other. Some of our other soldiers question why he has not been promoted after all his heroic deeds during armed conflict, while others treat him as some arrange of demigod."
 rel_flavor_hellenic.15.desc:0 "[SCOPE.sP('randomized_country_province').GetName] has seen a huge influx of traders and travellers from far and wide recently. One of our advisors jokingly suggests we must have been blessed by [ROOT.GetCountry.Custom('get_commerce_god')] himself.\n\nIt might have been a joke, but paying our dues to the god might be a good idea nonetheless. It could only be a boost in long term business, right?"
 rel_flavor_hellenic.16.desc:0 "We have received news from [plague_city_scope.GetName] that the city has been ravaged by a disease; a significant proportion of the inhabitants have fallen ill. They have asked our leaders in general, but also entreated [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] in particular, to dispatch them some form of aid. Our advisors, jealously taken aback by the direct appeals to [ROOT.GetCountry.GetRuler.GetPraenomen], have started mutterings, implying that [plague_city_scope.GetName] must have somehow offended the gods and deserve divine punishment."
 rel_flavor_hellenic.16.b:0 "We will call upon whoever we can to place an end to this plague."
 rel_flavor_canaanite.1.desc:0 "For eons we have sent donations to the great temple of Melqart in Tyrus, as an honour to our ancestors and the god. Our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] claims some of our recent issues might stem from our lack of faith.\n\n[SCOPE.sCharacter('randomized_priest').GetSheHe|U|] has raised an issue that will surely not be forgotten by the rest of the court any time soon. As is tradition, maybe it is time to dispatch another gift to Tyrus after all? "
 rel_flavor_canaanite.1.b:0 "We have nothing to dispatch to Tyrus."
 rel_flavor_canaanite.2.desc:1 "We have recently had an influx of believers from [SCOPE.sCountry('neighbor_country').GetName] visit our [randomized_country_province.Custom('get_city_type_loc')] of [SCOPE.sP('randomized_country_province').GetName], as it is apparently part of their beliefs about the demigod Herakles and his travels. Many have started seeing the similarities between the Hellenic demigod and our own Melqart.\n\nLooking into this line of dialogue might help us better comprehend our neighbours, and grow a closer friendship with them. "
 rel_flavor_canaanite.3.desc:0 "Our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] claims our future is bleak unless we appease [ROOT.GetCountry.Custom('get_harvest_god')], as [SCOPE.sCharacter('randomized_priest').GetSheHe] has had terrible visions about things to come. [SCOPE.sCharacter('randomized_priest').GetSheHe|U|] has set aside a cadre of male animals for sacrifice, as is custom, and is asking us for the funds for a massive ceremony.\n\nThough we have nothing more than [SCOPE.sCharacter('randomized_priest').GetHerHis] word to go by, it is unquestionably a good idea to attempt to appease the god in one way or another."
 rel_flavor_canaanite.3.b:0 "A minor ceremony to appease the god will be fitting."
 rel_flavor_canaanite.4.desc:1 "Lately our ruler's fertility has come into question at court, as [ROOT.GetCountry.GetRuler.GetSheHe] has no children to speak of as of yet. It is said [ROOT.GetCountry.Custom('get_love_goddess')] can bless one with fertility if one is truly deserving of her favour. Setting aside some sacrifices for the goddess might be enough to convince her to give [ROOT.GetCountry.GetRuler.GetName] the boost [ROOT.GetCountry.GetRuler.GetSheHe] requirements to assuage the rumours."
 rel_flavor_canaanite.6.desc:0 "Among the populace of [SCOPE.sP('randomized_country_province').GetName], there is a growing cult to the local god of Shadrafa. Supposedly a healing mystic who has been seen travelling through the territories with a scorpion in his hands.\n\nThough the god is somewhat foreign to the rest of our people, this could be a great opportunity to show favour to this specific local faith. "
 rel_flavor_canaanite.6.a:0 "A shrine in his honour is the least we can do."
 rel_flavor_canaanite.8.desc:1 "The territory of [SCOPE.sP('randomized_country_province').GetName] has seen a huge surprising development in their grain production this year. The yearly festival in honour of [ROOT.GetCountry.Custom('get_harvest_god')] must have paid off, as he has clearly given this area his blessing. Our advisors wonder if it is better if we shared this bountiful blessing with the rest of our nation as well, all taking part in the gift."
 rel_flavor_canaanite.9.desc:0 "A novel shrine is being built in [ROOT.GetCountry.GetCapital.GetName], and the local priest has asked us to be the one to decide which god it will honour. All the gods play important roles in our daily lives, and it is important to make sure we know which god would fit this specific shrine."
 rel_flavor_druidic.1.desc:0 "Some of our druids in [SCOPE.sP('randomized_country_province').GetName] have gotten into a conflict with our neighbours in [SCOPE.sCountry('neighbor_country').GetName], a conflict based on the local beliefs of the tribes in [SCOPE.sP('randomized_country_province').GetName] and [SCOPE.sP('random_neighbor_province').GetName]. We have received a messenger from the druids asking for proper support in their conflicts versus our neighbours, though that would place us at odds with the [SCOPE.sCountry('neighbor_country').GetAdjective]."
 rel_flavor_druidic.2.desc:0 "Though the druids of [ROOT.GetCountry.GetName] usually stay passive in the matters of war, we have received their outright support in our current conflict efforts versus [SCOPE.sCountry('war_country').GetName]. If we so wish, we could have the druids either inspire our troops, or to galvanize our people to ready for armed conflict."
 rel_flavor_druidic.2.a:0 "Our troops could require the inspiration."
 rel_flavor_druidic.3.desc:0 "After several minor conflicts with the druids of [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] have unceremoniously been told [ROOT.GetCountry.GetRuler.GetSheHe] will no longer be permitted to take part in the religious ceremonies of our nation. These types of banishments can end up with a person being a complete social outcast.\n\nMaybe it is time to attempt and appease the druids and their caste, to get our ruler back in their good graces?"
 rel_flavor_druidic.4.desc:0 "Several of the druids in [ROOT.GetCountry.GetCapital.GetName] has foreseen the terrible rule and future of [SCOPE.sCharacter('heir_character').GetName]. Supposedly [SCOPE.sCharacter('heir_character').GetSheHe] will end the great era for [ROOT.GetCountry.GetName] and bring our nation to ruination.\n\nAll our druids advise and demand that we find a novel successor, before [SCOPE.sCharacter('heir_character').GetName] puts an end to us. We need to decide if we should stand by [SCOPE.sCharacter('heir_character').GetHerHim], or commence looking for a novel successor."
 rel_flavor_druidic.5.desc:0 "A female druid coming from the outskirts of [SCOPE.sP('randomized_country_province').GetName] has recently become a hot topic in [ROOT.GetCountry.GetCapital.GetName], supposedly going versus all kinds of traditions. Our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] seems to have taken a particular dislike to the girl, often and viciously mocking her person and ways around court.\n\nSome suggest removing the girl quietly, whereas others would like to give her more space to show her ideas and affect our religion. Maybe we could both get rid of [SCOPE.sCharacter('randomized_priest').GetName] and become more favourable among this girl's followers at once?"
 rel_flavor_druidic.5.c:0 "Get the woman out of our territories."
 rel_flavor_druidic.7.desc:0 "[SCOPE.sCharacter('female_druid').GetName] was a controversial and disputed choice from the commence, and nothing has changed much since [SCOPE.sCharacter('female_druid').GetSheHe] became [SCOPE.sCharacter('female_druid').GetOffice.GetName]. Though we had hoped for things to settle down between [SCOPE.sCharacter('female_druid').GetName] and the rest of the druids, it never really did. If anything, there has constantly been more of a struggle no matter what we wanted done, and it has seriously hampered our religious ceremonies and authority."
 rel_flavor_druidic.8.desc:0 "Our neighbours from [SCOPE.sCountry('neighbor_country').GetName] have started travelling through our territories, lately being seen causing trouble in [SCOPE.sP('randomized_country_province').GetName]. Trying to equate our gods and faiths with their own, they are trying to learn more about countrymen and druids.\n\nWelcoming the foreigners could make us somewhat unpopular among our people, or it could be an opportunity to learn more about the foreigners and our neighbours."
 rel_flavor_druidic.8.b:0 "Let us push them out before they commence affecting our populace."
 rel_flavor_druidic.9.desc:0 "The signs of the stars have been clear according to our druids, and proclaim our many victories to come. No matter who our enemies may be, our triumph will be certain as we move to take our rightful place as the rulers of [ROOT.GetCountry.GetName].\n\nNow to find somewhere to lead our troops, and fulfil our destiny."
 rel_flavor_druidic.12.desc:0 "Lately some of our leaders have started to take advantage of the druids and their role in society, even going as far as to expect them to contribute monetarily to the nation. They are the pride and centre of our faith, and it is clear this is a taxing situation for them.\n\n[SCOPE.sCharacter('randomized_priest').GetName] is speaking for the druids and demand an end to this abuse of power. Otherwise, how will our relations with the gods pay off?"
 rel_flavor_kemetic.1.desc:0 "Our [ROOT.GetCountry.GetRuler.GetCulture.GetName] ruler [ROOT.GetCountry.GetRuler.GetName] qualities as a leader has come into question among some of our Egyptian populace in [SCOPE.sP('randomized_country_province').GetName]. Their ancient belief of 'Maat', with its thoughts on justice and morality, and our leader's lack of these aspects.\n\nThough the locals have little to say in the grand scheme of things, these mutterings could turn into proper rebellions if we do not respond to them."
 rel_flavor_kemetic.1.a:0 "Our soldiers will place an end to the mutterings."
 rel_flavor_kemetic.2.t:0 "Times of Require"
 rel_flavor_kemetic.2.desc:0 "As our nation faces an internal crisis, with unrest and instability all across our territories, many look to [ROOT.GetCountry.GetRuler.GetName] for a solution and to lead us out of this disaster. Our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] has suggested visiting a local oracle living at the outskirts of [ROOT.GetCountry.GetCapital.GetName], to find the guidance needed to bring us back from the brink of chaos."
 rel_flavor_kemetic.3.desc:0 "Our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] are seeking funds for the construction of a novel temple in [ROOT.GetCountry.GetCapital.GetName], dedicated to the great goddess [ROOT.GetCountry.Custom('get_love_goddess')] herself. Though [SCOPE.sCharacter('randomized_priest').GetSheHe] has not asked us specifically, this is an opportunity for us to secure the loyalty of our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] and show our philanthropic qualities as a leader."
 rel_flavor_kemetic.5.desc:0 "A massive chaos ensues happen at one of our local shrines to [ROOT.GetCountry.Custom('get_sky_god')], after the sacred bird of the shrine has been lost. Not only was it one of the foci of the shrine, but without it, they fear they have lost a certain connection to the god.\n\nSome of our advisors point out we could just get a novel bird, but our [SCOPE.sCharacter('randomized_priest').GetOffice.GetName] [SCOPE.sCharacter('randomized_priest').GetName] requirements appeasement to the god. [SCOPE.sCharacter('randomized_priest').GetSheHe|U] claims that without the right steps, the god will punish us for our lack of piety."
 rel_flavor_kemetic.5.a:0 "Let us just find a novel bird."
 rel_flavor_cybelene.1.desc:0 "In the [SCOPE.sP('randomized_country_province').GetTerrain.GetName|l] of [SCOPE.sP('randomized_country_province').GetName], our [SCOPE.sCharacter('randomized_character').GetOffice.GetName] [SCOPE.sCharacter('randomized_character').GetName] has taken part in the carving of a huge statue of the Mother Goddess herself. Sadly, the funding for the statue has dried up, and [SCOPE.sCharacter('randomized_character').GetSheHe] is asking us for assistance to shore up the last parts needed. "
 rel_flavor_cybelene.1.b:0 "Sadly we is unable to afford such an endeavour."
 rel_flavor_cybelene.2.desc:0 "In recent years we have seen struggles with the harvest in [SCOPE.sP('randomized_country_province').GetName], and it is clear something requirements to be done. A ceremony and festival in the honour of the Mother Goddess would assuredly bring back the crops.\n\nSome at court questions why we would use our resources on that one city when we could hold such a festival in [ROOT.GetCountry.GetCapital.GetName] for all of [ROOT.GetCountry.GetName] instead."
 rel_flavor_cybelene.2.a:0 "They require our assistance in [SCOPE.sP('randomized_country_province').GetName]."
 rel_flavor_cybelene.2.b:0 "Kimiata is the centre of our nation, and where we hold our rites."
 rel_flavor_cybelene.3.desc:0 "A large cult to [ROOT.GetCountry.Custom('get_harvest_goddess')] is growing in [ROOT.GetCountry.GetCapital.GetName], and more people are entering their ranks by the day. With their mystical initiation ceremony and cult rites, they are somewhat different than the normal ceremonies to the Mother Goddess.\n\nBy taking part in this mystical cult, we could assuredly make these cultists more loyal to the nation as well as get an understanding of their inner-workings."
 rel_flavor_cybelene.4.desc:0 "The populace of [ROOT.GetCountry.GetCapital.GetName] wakes up to our ruler [ROOT.GetCountry.GetRuler.GetName] gathering people in one of the town squares. In a speech [ROOT.GetCountry.GetRuler.GetSheHe] announces that [ROOT.GetCountry.GetRuler.GetSheHe] is certain [ROOT.GetCountry.GetRuler.GetSheHe] in fact the reborn Attis, consort of the Mother Goddess.\n\nWith a dramatic flourish with a knife in one hand, [ROOT.GetCountry.GetRuler.GetSheHe] suddenly undresses and castrates [ROOT.GetCountry.GetRuler.GetHerselfHimself] publicly, to the shock of the onlookers. [ROOT.GetCountry.GetRuler.GetSheHe|U] loudly pronounces that this is how [ROOT.GetCountry.GetRuler.GetSheHe] is meant to be, before [ROOT.GetCountry.GetRuler.GetSheHe] faints from the sudden blood loss.\n\nMiraculously the physicians manage to maintain [ROOT.GetCountry.GetRuler.GetName] alive, but they did not manage to save the parts [ROOT.GetCountry.GetRuler.GetSheHe] had cut off so brutally."
 rel_flavor_zoro.1.desc:0 "Supposedly the people of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], are struggling with their faith in the doctrine of Zoroaster. Our [SCOPE.sCharacter('random_advisor').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_advisor').GetName] suggests convincing the peasantry with purification ceremonies, once more turning them to the righteous path following Ahuramazda.\n\nSurely it would be a popular move among our subjects to turn more people versus the false malevolent ideas of the polytheists."
 rel_flavor_zoro.2.desc:0 "Our people question the leadership of our [ROOT.GetCountry.GetRuler.GetOffice.GetCulturalName(ROOT.GetCountry)] [ROOT.GetCountry.GetRuler.GetName], and [SCOPE.sCharacter('random_advisor').GetName] in particular has been a long-time opponent of ours. Maybe it is time to set aside our resources to follow the doctrine of Zoroaster more properly. After all, the magi are sure to be happy to help us out if we request them to guide us in this matter."
 rel_flavor_zoro.3.desc:0 "Under the leadership of our [SCOPE.sCharacter('random_advisor').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_advisor').GetName], the magi of [ROOT.GetCountry.GetName] has started seeking more political power and independence from our control. As they have tried to push for statutes to grant them more power, they have gotten at odds and into disputes with [SCOPE.sCharacter('random_advisor_2').GetName] and [SCOPE.sCharacter('random_advisor_2').GetHerHis] group. With the two groups vying for religious power in [ROOT.GetCountry.GetName], we should make a decision quickly to end this conflict before it gets bloody."
 rel_flavor_zoro.4.desc:0 "As the pious ruler [ROOT.GetCountry.GetRuler.GetSheHe] is, our leader [ROOT.GetCountry.GetRuler.GetName] knows there are avenues for improvement, and has been seeking the counsel and counsel of [SCOPE.sCharacter('random_advisor').GetName] and the magi. Though their doctrine are well meant, [ROOT.GetCountry.GetRuler.GetFirstName] are sure to lose [ROOT.GetCountry.GetRuler.GetHerHis] authority over the group if [ROOT.GetCountry.GetRuler.GetSheHe] follows their every whim."
 rel_flavor_zoro.4.a:0 "Please, share your sagacity with us."
 rel_flavor_zoro.5.desc:0 "Be it in battle or at home, it is important that our people know we are guided by Ahuramazda and the sagacity of Zoroaster. [SCOPE.sCharacter('random_advisor').GetName] has suggested supporting our magis and priests in spreading our doctrine to the people, and in turn have their blessing in a religiously supported message that would reinforce our subjects for a long time to come."
 rel_flavor_zoro.5.b:0 "Our nation will be strengthened with his doctrine."
 rel_flavor_eastern.2.a:0 "Let us attempt to find compromises everyone can agree on."
 rel_flavor_eastern.3.desc:0 "Our [SCOPE.sCharacter('random_advisor').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_advisor').GetName] has asked us to aid [SCOPE.sCharacter('random_advisor').GetHerHim] in raising a shrine to [ROOT.GetCountry.Custom('get_harvest_goddess')] in [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName]. It is [SCOPE.sCharacter('random_advisor').GetHerHis] hope that the city will grow into a robust essential part of [ROOT.GetCountry.GetName] under the blessing of [ROOT.GetCountry.Custom('get_harvest_goddess')], and that we will support the endeavour."
 rel_flavor_eastern.4.desc:0 "As the followers of Zoroaster has spread into our territories, more people have begun following his doctrine and structure their minor fire shrines in the honour of their deity Ahuramazda. The latest of these large conversions has been in [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], as a large group of people has taken up the doctrine of the Persian prophet.\n\nThe strongest opponent to the Zoroastrians is [SCOPE.sCharacter('random_advisor').GetName], who has often talked about the Persian faith twisting our people. If we want to place an end to these sudden groups of people turning to Zoroastrianism, we would do well by convincing the latest converts to return to their ancient faith."
 rel_flavor_northern.1.desc:0 "After some of the seers went through a ritual to speak to the ancestors, our [SCOPE.sCharacter('random_advisor').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_advisor').GetName] claims the ancestors decreed more liberty to the priests. To convince the masses, several of the priests have used some of their own funds to support several large festivals across [ROOT.GetCountry.GetName].\n\nFollowing this charade would probably make us more popular among our people, though at the expense of our control over the religious elements of our society."
 rel_flavor_northern.1.a:0 "We will follow our ancestors' sagacity."
 rel_flavor_northern.2.desc:0 "It seems our [SCOPE.sCharacter('random_advisor').GetOffice.GetCulturalName(ROOT.GetCountry)], [SCOPE.sCharacter('random_advisor').GetName], is dead set on making [SCOPE.sCharacter('prisoner_character').GetName] a sacrifice to our gods and ancestors. We are not entirely sure why [SCOPE.sCharacter('random_advisor').GetSheHe] has become so obsessed with putting the prisoner out of [SCOPE.sCharacter('prisoner_character').GetHerHis] misery, but it has become annoying how often [SCOPE.sCharacter('random_advisor').GetFirstName] has brought the issue up lately.\n\nMaybe we should just give [SCOPE.sCharacter('random_advisor').GetHerHim] [SCOPE.sCharacter('prisoner_character').GetFirstName] to place an end to this discussion? It would assuredly make the seers more loyal if we fulfil their wish."
 rel_flavor_northern.3.desc:1 "Some of the youth in the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], have started partaking in ancient fertility rites, to the chagrin of some of our seers and elders. [SCOPE.sCharacter('random_advisor').GetName] has demanded that we place an end to this, and make sure the youth starts respecting the wishes of their elders once more.\n\nThe rites assuredly seem effective though, and the youth seems happier than they used to be."
 rel_flavor_northern.3.b:0 "[SCOPE.sCharacter('random_advisor').GetFirstName] is right, let us place an end to this."
 rel_flavor_northern.5.desc:0 "As we prepare for another festival here in [ROOT.GetCountry.GetCapital.GetName], we have heard rumours of a similar festival over in [SCOPE.sCountry('neighbor_country').GetName]. As our two nations get along with one another, this could be a chance for us to come together and celebrate a festival together, and get to know each other better."
 rel_flavor_northern.5.a:0 "Let us see if they want to labour together."
 rel_flavor_northern.5.a.tt:0 "We dispatch an invitation to [SCOPE.sCountry('neighbor_country').GetName] to join us for a religious festival."
 rel_flavor_northern.5.b:0 "No, it has invariably been a festival for just our people."
 rel_flavor_northern.6.desc:0 "Our friendly neighbour of [SCOPE.sCountry('original_country').GetName] has asked us if we want to hold a religious festival with them, to bring our two people together to get to know one another better. This would be a good chance to learn more about their nation and people, and perhaps grow the friendship between the two of us."
 rel_flavor_northern.8.desc:0 "The days passes without any response from the [SCOPE.sCountry('neighbor_country').GetName]. In the end, we hold the festival on our own as we invariably have, and our people seem to have fun with the festivities.\n\nEven after the festival has been concluded, we wonder why they did not even bother answering our invitation."
 rel_flavor_hindu.2.a:0 "Place an end to this little revolt."
 rel_flavor_hindu.3.desc:0 "Though the Buddhists living in [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], has been mostly peaceful in their interactions with the other people living in the city, we have seen the rise of minor conflicts between the different groups. Though we usually attempt to inspire tolerance and agreement between our people, even those of different faiths, maybe it is time to attempt to convince these Buddhists to turn to our faith and assimilate better with our people? Then again, if we do not show compassion and tolerance ourselves, how can we expect it of others?"
 rel_flavor_hindu.4.desc:0 "The least years we have seen a huge influx of pilgrims travelling to [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], as it has become known as a sacred site among the Hindus living adjacent. If we so wish, this seems like a great opportunity to make a lot of money on these pilgrims dropping by, or we could attempt and garner some popularity among the populace by making sure [SCOPE.sP('country_province').GetName] is as inviting and well-taken care of as can be."
 rel_flavor_hindu.4.a:0 "Let us make sure this will be a worthwhile endeavour."
 rel_flavor_buddhist.1.desc:0 "The people of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], have barely any Buddhists amongst them even if they are a part of [ROOT.GetCountry.GetName]. We have set up a plan to have some of our locals from the capital to move to the city, to spread the doctrine of Buddha."
 rel_flavor_buddhist.1.a:0 "Dispatch some of our locals to teach them."
 rel_flavor_buddhist.2.desc:0 "In the obscure hinterlands of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], a guru has started to grow famous among the locals for his sagacity and discernment. As a teacher of Buddhist dogma, he would surely be able to teach the people of the city more about the faith, and convince them of the true way to enlightenment. Or we could bring the man to our court, and have him teach our people instead."
 rel_flavor_buddhist.3.desc:0 "Unlike a lot of the other urban centres under our rule, the people of [SCOPE.sP('country_province').GetName] in [SCOPE.sP('country_province').GetState.GetShortName] seems to have good relations between the people of all the different faiths living there. Both Buddhists and non-Buddhists seems to get along surprisingly well, and the city is flourishing because of it.\n\n[SCOPE.sCharacter('random_priest').GetName] wants us to support the populace, and help them to continue structure upon the communication between the diverse faiths of the city. Or maybe we have something to learn from these people?"
 rel_flavor_buddhist.3.a:0 "Let us support and construct upon these friendly relations."
 rel_flavor_buddhist.4.desc:0 "Lately our heir [SCOPE.sCharacter('reborn_heir').GetName] has claimed to remember a previous life, and talked about the deeds [SCOPE.sCharacter('reborn_heir').GetSheHe] did in the past. Though some of these memories sounds like some of the ancient rulers of our territories, it is probably just an attempt to attempt and get out of [SCOPE.sCharacter('reborn_heir').GetHerHis] studies."
 rel_flavor_buddhist.6.desc:0 "These last weeks [SCOPE.sCharacter('reborn_heir').GetName] has started to recount several tales of battles and armed conflicts from the ancient past. Either [SCOPE.sCharacter('reborn_heir').GetSheHe] has been inspired and finally started learning something from [SCOPE.sCharacter('reborn_heir').GetHerHis] history lessons, or [SCOPE.sCharacter('reborn_heir').GetSheHe] actually took part in these armed conflicts.\n\nIn the middle of telling one of these stories, [SCOPE.sCharacter('reborn_heir').GetFirstName] stops and request one of [SCOPE.sCharacter('reborn_heir').GetHerHis] teachers how they consider the ancient general in the story won the battle."
 rel_flavor_buddhist.7.t:0 "Stories of Ancient"
 rel_flavor_buddhist.7.c:0 "[SCOPE.sCharacter('reborn_heir').GetSheHe|U] requirements to comprehend the bureaucracy of our nation."
 rel_flavor_buddhist.9.b:0 "A reformer could be just what we require."
 rel_flavor_buddhist.15.desc:0 "Through conversations with many great wisemen, outsmarting [SCOPE.sCharacter('reborn_heir').GetHerHis] teachers and generally showing great promise as a leader, most people are now convinced [SCOPE.sCharacter('reborn_heir').GetName] does in fact remember previous lives [SCOPE.sCharacter('reborn_heir').GetSheHe] lived.\n\nWith the sagacity of previous lives at [SCOPE.sCharacter('reborn_heir').GetHerHis] fingertips, [SCOPE.sCharacter('reborn_heir').GetSheHe] is sure to be an experienced and wise leader for our people in the coming years."
 rel_flavor_arabian.2.desc:0 "The ancestor cult has spread their influence all the way to [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], and has started to influence the citizens living in the city, enticing and threatening them to leave their urban lives and settle down in the countryside.\n\nIf we let this cult run wild, they will surely continue to push out citizens from all across [ROOT.GetCountry.GetName], decentralizing governance in all our urban centres."
 rel_flavor_arabian.2.b:0 "The cult is doing good labour."
 rel_flavor_arabian.2.d:0 "Enough of this cult. Let us place an end to it."
 rel_flavor_arabian.3.desc:0 "As most of the citizens of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], have left the city, the urban districts has started to decay. The people of the city are desperately seeking assistance in trying to attract citizens to the city, to revitalize the once great town again.\n\nIt would make us less popular among the tribes and ancestor veneration cult, but more popular among the newfound citizens of the city."
 rel_flavor_arabian.4.desc:0 "The people of [SCOPE.sP('country_province').GetName] in [SCOPE.sP('country_province').GetState.GetShortName] have been living relatively free from the doctrine of our gods. With as few following the doctrine of the Arabic pantheon as there are, our religious authority in the city is deficient, and we have been starting to look for ways to introduce the locals to our traditions and ideas.\n\n[SCOPE.sCharacter('random_priest').GetName] has prepared a plan to resettle some of the people of [ROOT.GetCountry.GetCapital.GetName] to the city, as well as sending a contingent of our priests to teach them more about our pantheon."
 rel_flavor_arabian.5.desc:0 "Out of the obscure countryside of [SCOPE.sP('country_province').GetName] in [SCOPE.sP('country_province').GetState.GetShortName], rumours of an exceptional travelling wiseman have been spread. Apparently he has been teaching some of the locals a warped version of our own faith, turning some of those who had previously not believed in the Arabic pantheon.\n\nAs the peoples faith is already changing, this could be a good opportunity to reassert our own authority in the area, though it would be an expensive effort."
 rel_flavor_judaism.1.desc:0 "With the temple in Jerusalem and the Temple Mount held by the faithless polytheists, all the true followers of God are looking for a novel centre for the faith. Our [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_priest').GetName] has made plans to construct a novel grand temple for the faith, a place for all the followers to gather in their worship of God.\n\nIt would be a massive effort for our people, but it would surely inspire our populace for a long time to come."
 rel_flavor_judaism.1.a:0 "Construct the temple."
 rel_flavor_judaism.2.desc:0 "As is custom, we had prepared a large sacrifice for the next Sabbath. At least until our [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_priest').GetName] informs us that a lot of the sacrifices have gone missing, and that we need to get our hands on novel sacrifices before the Sabbath.\n\nNot finding the replacement needed, we are sure to get unpopular among our vassals and the priesthood. Is it really that necessary though?"
 rel_flavor_judaism.3.t:0 "A City of Deficient Prayers"
 rel_flavor_judaism.3.desc:1 "It seems our [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName] in [SCOPE.sP('country_province').GetState.GetShortName] has shown a lack of faith and prayers lately. Dropping up to several of the prayers of the day, they are starting to show the faithlessness of our polytheistic neighbours, as well as an interest in their religions.\n\n[SCOPE.sCharacter('random_priest').GetName] wants us to dispatch a emissaries to the city, to get them back on track. After all, we all know what happens to the urban centres who leave the hand of God to commence worshiping false idols."
 rel_flavor_judaism.3.b:0 "God will arrange them out."
 rel_flavor_judaism.4.desc:0 "We have seen a lot of interactions between our people and our Hellenistic neighbours in [SCOPE.sCountry('neighbor_country').GetName], and that some of our citizens have started bringing back the [SCOPE.sCountry('neighbor_country').GetAdjective] traditions home to [ROOT.GetCountry.GetName]. With newfound knowledge at our hands, conflicts has started to rise up between those who want to stick to our traditions and those who want to look forward and attempt the novel ways.\n\nAs we move forward, we should place an end to the conflict and decide what path we should follow, if we should accept these novel doctrine or not."
 rel_flavor_judaism.4.a:0 "Let us use their doctrine to improve our own society."
 rel_flavor_judaism.4.b:0 "Our own traditions are all we require."
 rel_flavor_judaism.5.desc:0 "We have heard our neighbours in [SCOPE.sCountry('neighbor_country').GetName] has treated the Jewish populace in [SCOPE.sP('neighbor_country_province').GetName], [SCOPE.sP('neighbor_country_province').GetState.GetShortName], terribly and unjustly. Mistreating them just because of their different faith.\n\nAs a Jewish state adjacent, our people expect us to be a safe haven for these Jewish refugees. It would assuredly make us unpopular among the leadership of [SCOPE.sCountry('neighbor_country').GetName] though, and [SCOPE.sCountry('neighbor_country').GetRuler.GetName] expects us to leave [SCOPE.sCountry('neighbor_country').GetRuler.GetHerHis] people alone."
 rel_flavor_judaism.5.b:0 "We is unable to afford to risk our relationship with [SCOPE.sCountry('neighbor_country').GetName]."
 rel_flavor_judaism.6.desc:1 "Some of our Jewish citizens in [SCOPE.sP('neighbor_country_province').GetName], [SCOPE.sP('neighbor_country_province').GetState.GetShortName], have left the city to travel to the [original_country.GetCapital.Custom('get_city_type_loc')] of [SCOPE.sCountry('original_country').GetCapital.GetName] in the territories of our neighbour [SCOPE.sCountry('original_country').GetName].\n\n [SCOPE.sCountry('original_country').GetRuler.GetName] has become an infamous name at our court, and quickly grown unpopular among our peers. Why do they consider they can take our citizens from our territories anyways?"
 rel_flavor_judaism.6.a:0 "Well, we did not require them anyways."
 rel_flavor_thracian.1.desc:0 "Our [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_priest').GetName] has prepared a great ceremony to request for the blessing of [ROOT.GetCountry.Custom('get_hero_god')] in our current armed conflict. The blessing of the god would inspire our troops to greater deeds and martial prowess than we have ever seen before, ensuring our victory.\n\nSupporting the [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] would make [SCOPE.sCharacter('random_priest').GetHerHim] more prominent in [ROOT.GetCountry.GetName], but less so than we would grow unpopular if we opposed [SCOPE.sCharacter('random_priest').GetHerHis] ritual."
 rel_flavor_thracian.1.b:0 "No, we will not assistance [SCOPE.sCharacter('random_priest').GetFirstName] in [SCOPE.sCharacter('random_priest').GetHerHis] ritual."
 rel_flavor_thracian.2.desc:0 "The people of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], has long opposed our faith and questioned our rule. At our court, a conflict has risen between our [SCOPE.sCharacter('random_marshal').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_marshal').GetName] who wants to convert the city by force, and our [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_priest').GetName] who wants to take the process step by step. A conversion by force is sure to leave casualties and unrest, but it will most probable be more effective as well."
 rel_flavor_thracian.3.desc:0 "The people in [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], claims a special relationship to [ROOT.GetCountry.Custom('get_hero_god')], and asks for our aid in structure a shrine dedicated to the god in the city. Structure the shrine is sure to calm the locals, as well as proving to them why they are accepting our rule and what a benevolent ruler [ROOT.GetCountry.GetRuler] really is."
 rel_flavor_thracian.3.a:0 "Construct the shrine, so the populace can look to it for inspiration."
 rel_flavor_thracian.4.desc:0 "As is custom, we are holding a ceremony to celebrate the great Thagimasadas and to make sure the god continue to look at us with favour. Though the god is one that is only celebrated by the royal family itself, he would most probable look at us with more favour if we made more of an effort to celebrate the god. What kind of ceremony should we hold?"
 rel_flavor_thracian.5.desc:1 "Those with similar faiths to our own, particularly the Hellenics and Cybelenes, have a tendency to pick up our faith easier than many of our other subjects. It seems they equate our gods and pantheon with some of their own, making the conversion easier.\n\nAfter our [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_priest').GetName] visit the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], we have seen a large group of conversions to our faith. Should we dispatch [SCOPE.sCharacter('random_priest').GetFirstName] for another trip to the city?"
 rel_flavor_jainism.1.t:0 "Avarice and Avarice"
 rel_flavor_jainism.1.desc:1 "It is said the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], has become the very symbol of avarice and corruption these last years. Just outside of the city proper, ascetics are trying to teach the people to let go off their material obsession, to no assistance. It is time for someone to step up and turn this city of avarice once and for all. If we let this rot spread to other provinces, who knows how we will stop it?"
 rel_flavor_jainism.1.a:0 "They do not require the gold, unlike us."
 rel_flavor_jainism.2.desc:0 "One of the urban centres under our rule, [SCOPE.sP('country_province').GetName] in [SCOPE.sP('country_province').GetState.GetShortName], has become known for its misconduct and corruption. Our [SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)] [SCOPE.sCharacter('random_priest').GetName] asks us to attempt and use some of our resources to fix the city, and help it return to traditions more fitting of a nation under our rule. Though it is hard to disregard that the city is surprisingly well run, compared to what one would expect from such a corrupt place."
 rel_flavor_jainism.2.a:0 "We will dispatch some emissaries to get [SCOPE.sP('country_province').GetName] back in line."
 rel_flavor_jainism.3.desc:0 "An ascetic Jain has become prominent in the outskirts of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], for aiding and guiding those seeking his counsel. Several of the locals who asked for his counsel has started growing an interest in our faith, and this would be a great opportunity to finally commence turning the city towards our traditions."
 rel_flavor_jainism.3.a:0 "Some assistance will be provided to the wiseman."
 rel_flavor_jainism.3.b:1 "We should encourage the man to spread his doctrine in other adjacent territories as well."
 rel_flavor_jainism.5.desc:1 "A group of Jains from the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetShortName], has been planning to settle down in the [country_province_2.Custom('get_city_type_loc')] of [SCOPE.sP('country_province_2').GetName], [SCOPE.sP('country_province_2').GetState.GetShortName]. Bringing our national traditions and faith to the city, they are hoping to revitalize a Jain faith they believe once inhabited the city.\n\nWe could force them to stay in [SCOPE.sP('country_province').GetName], but that would assuredly make us somewhat unpopular among them."
 rel_flavor_jainism.5.b:0 "No, we require them in [SCOPE.sP('country_province').GetName]."
