l_english:
 GOVPOL_FOR_PROVINCES:1 "Every territory in the province obtains the subsequent effects:\n$DATA$"
 GOVPOL_FOR_CAPITAL:0 "The Province Capital obtains the subsequent effects:\n$DATA$"
 GOVPOL_FOR_NON_CAPITAL:1 "Every territory that is not the Province Capital obtains the subsequent effects:\n$DATA$"
 GOV_POLICY_MONTHLY_CHANCE:0 "A monthly chance of the subsequent:"
 GOVPOL_CAPITAL_PROVINCE:2 "#T Governor Policy#!\nClick to select a novel policy for $NAME|Y$. This will cost you $COST$"
 GOVPOL_NOT_OWNED_BY_YOU:0 "You require to possess the Province in order to change its policy."
 GOVPOL_NO_GOV_PRESENT:0 "You require to have a Governor assigned to $NAME$ before you could change its policy."
 GOVPOL_DO_IT:1 "#T Governor Policy#!\nClick to select a novel policy for $WHERE|Y$. This will cost $COST$."
 acquisition_of_wealth_desc:1 "This policy will increase the entire province's tax and commerce revenue, at the cost of enriching the presiding Governor. Some nefarious characters are only interested in lining their own pockets."
 religious_conversion_desc:2 "This policy will increase the rate at which Pops in the province's territories are converted to our country's Religion. Disseminating our faith makes it easier to assimilate Pops into the country's dominant Culture."
 bleed_them_dry_desc:1 "This policy will considerably increase the revenue of a province, at the cost of generating unrest and lowering its food output. There is a limit to how much the people can tolerate and get by on, after all."
 borderlands_desc:1 "This policy will increase the manpower contributions of a province's Pops as well as harden its defensiveness. Ensuring a steady supply of recruits and robust fortifications are key to victory."
 encourage_trade_desc:2 "This policy will increase a province's commerce income and food output by encouraging foreign traders to do business in the area. There is invariably money to be obtained if one can spot the opportunity."
 local_autonomy_desc:1 "This policy will increase the happiness of a province's Pops at the cost of considerably reducing their production in all areas. By relieving the people of their burdens, we are sure to boost their contentment."
 civilization_effort_desc:2 "This policy will increase the rate at which a province is civilised and slowly pacify any neighbouring barbarian strongholds. Only infrastructure, cultural dissemination, and learning can bring enlightenment."
 gov_pol.4.t:1 "Downgrade or Eliminate Barbarian Stronghold in adjacent territories."
 harsh_treatment:0 "Severe Treatment"
 harsh_treatment_desc:1 "This policy will increase a province's Loyalty at the cost of reducing its production and encouraging Pops to emigrate away. Though it may have its costs, sometimes the best method to deal with dissent is a show of force."
