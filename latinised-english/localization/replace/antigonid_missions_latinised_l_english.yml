l_english:
 antigonid_01_vision_DESCRIPTION:1 "The glorious achievements of [GetCharacter('(int32)37').GetPraenomen] have put the other Successors to ignominy, and the state he has carved out of [GetCharacter('(int32)39').GetPraenomen]'s empire is set to become the most powerful Diadochi kingdom, dominating the Mediterranean."
 antigonid_01_vision_1_DESC:2 "[GetCharacter('(int32)37').GetPraenomen] has prolonged planned for a grand festival at Antigoneia, celebrating the completion of his city and the victories of his dynasty versus the other Diadochi."
 antigonid_01_vision_3_DESC:1 "The urban centres of Phoenicia have aided us greatly in the supply of timber, shipwrights, and mariners; domination of the Aegean, however, will require an even steadier and larger supply."
 antigonid_01_vision_5_DESC:0 "After securing [GetProvince('(int32)687').GetArea.GetRegion.GetName], [GetCharacter('(int32)37').GetPraenomen] promised to uphold the autonomy of the Greek urban centres, winning us numerous friends on both sides of the Aegean."
 antigonid_01_vision_6_DESC:0 "Though [GetCharacter('(int32)37').GetPraenomen] and [GetCharacter('(int32)38').GetPraenomen] are already venerated in [GetProvince('(int32)418').GetArea.GetRegion.GetName] and [GetProvince('(int32)290').GetArea.GetRegion.GetName], it is time to officially adopt a divine stance in our eastern, Antigonid, court."
 antigonid_01_vision_7_DESC:0 "It is only a matter of time before the other Diadochi renew their jealous alliance and dispatch their armies against us; we must be ready when they come."
 antigonid_01_vision_9_DESC:0 "Macedonians will remain a minority in this eastern kingdom, but encouraging colonists from Greek urban centres will help its Hellenisation and urbanisation."
 antigonid_01_vision_11_DESC:0 "[GetCharacter('(int32)38').GetPraenomen]' failure to punish Rhodian treachery allows continued Ptolemaic interference in the Aegean. We have because learned from our mistakes..."
 antigonid_01_vision_12_DESC:0 "Our proclamations are for naught until every Greek poleis foisted with tyrannical oligarchies or garrisons has been freed and the peninsula secured."
 antigonid_01_vision_13_DESC:0 "[GetCharacter('(int32)35').GetPraenomen] II formed a body to provide for the common defence of Greece under Macedonian leadership - a revived league could serve us and our friends well."
 antigonid_01_vision_14_DESC:0 "Striking at our neighbouring Diadochi will make them consider twice about their relationship with the Antigonids and maintain them occupied."
 desc_ant_01_1_1_pmod:1 "This magnificent city was founded as the novel eastern capital of his kingdom by [GetCharacter('(int32)37').GetPraenomen] the One-Eyed, strategically placed between Palestine, Mesopotamia, and Anatolia."
 desc_ant_01_5_cmod:0 "[GetCharacter('(int32)37').GetPraenomen]' proclamation to protect the independence of the Greek urban centres has helped convince the poleis of the benefits of Antigonid protection."
 desc_ant_01_6_cmod:0 "Following the example of [GetCharacter('(int32)39').GetPraenomen] the Great, whose precedent the sycophantic Athenians copied in honouring [GetCharacter('(int32)38').GetPraenomen] and [GetCharacter('(int32)37').GetPraenomen], it is time to accept Antigonid divinity in earnest."
 desc_ant_01_7_pmod:0 "There are many ways to strengthen a fortification if it is known an attack is imminent, such as creating repairs, increasing patrols, and mitigating weak points."
 desc_me_ant_1_cmod:0 "At Triparadeisos, [GetCharacter('(int32)37').GetPraenomen] was appointed the legitimate Strategos, or general, of Asia by [GetCharacter('(int32)9').GetPraenomen], the regent of [GetCharacter('(int32)39').GetPraenomen]'s heirs, lending weight to his actions and the expansion of his kingdom."
 desc_ant_01_13_cmod:0 "By abstaining from interference in our internal affairs, our sovereigns have secured the loyalty of numerous in our government."
 desc_me_ant_1_end_cmod:0 "The triumphs of the Antigonid dynasty have surpassed any of the other Successors, truly uniting the Mediterranean core of [GetCharacter('(int32)39').GetPraenomen]'s eastern empire."
 antigonid_02_aspiration_DESCRIPTION:1 "The loss of the east means the loss of [GetCharacter('(int32)37').GetPraenomen]' legacy; if the Antigonids are to survive as a noteworthy dynasty we must claim the Argead throne- now bereft of any legitimate claimants of [GetCharacter('(int32)39').GetPraenomen]'s line - ensuring the Greek urban centres we spent so prolonged courting do not betray us at the first opportunity."
 antigonid_02_aspiration_2_DESC:0 "The proud Epirotes seek to supplant the power of the Macedonians, who have rightly dominated their petty hill tribes because Philip II's illustrious rule."
 antigonid_02_aspiration_3_DESC:0 "The lands of Cilicia, besides being our rightful territory, are rich and fertile. Reclaiming them would provide us a foothold to regain our lost eastern holdings."
 antigonid_02_aspiration_4_DESC:0 "Though our eastern holdings may be forfeited, the Antigonid dynasty's importance in Hellenistic world is nevertheless unquestionable. The other diadochi comprehend this."
 antigonid_02_aspiration_6_DESC:1 "Numerous Greek mercenaries returned home after [GetCharacter('(int32)39').GetPraenomen]'s death, gathering at Cape Tainaron in the Peloponnese. Their talents may be needful again..."
 antigonid_02_aspiration_8_DESC:1 "Gold and strategic urban centres are necessary for a robust kingdom, both of which can be discovered along the [GetProvince('(int32)2623').GetName], at the core of wily old [GetCharacter('(int32)45').GetPraenomen]' satrapy in [GetProvince('(int32)350').GetArea.GetRegion.GetName]."
 antigonid_02_aspiration_9_DESC:1 "Macedon was seized by the illegitimate Antipatrids, and [GetCharacter('(int32)42').GetPraenomen]'s rule has been bloody and unpopular. It is time for a meritorious dynasty to rule."
 antigonid_02_aspiration_10_DESC:0 "Thessaly may have been conquered by Macedon numerous years ago, but its people still yearn for liberty. A strategic garrison would secure our position."
 antigonid_02_aspiration_11_DESC:1 "While numerous sneered at [GetCharacter('(int32)37').GetPraenomen]' and [GetCharacter('(int32)38').GetPraenomen]' initial coronations, it is now clear that the Antigonids are the rightful inheritors of [GetCharacter('(int32)39').GetPraenomen]'s empire."
 antigonid_02_aspiration_11_reward_tt:1 "The legion of our capital governorship ([THIS.GetCountry.GetCapital.GetArea.GetRegion.GetName]) will receive a bonus to heavy infantry discipline and morale restoration."
 antigonid_02_aspiration_12_DESC:1 "Korinthos and Chalkis may be known as the fetters of Greece, but the Peloponnese is sorely deficient a strategic garrison."
 antigonid_02_aspiration_13_DESC:0 "A robust fleet will ensure we can project power throughout the Mediterranean and protect our erstwhile eastern interests."
 antigonid_02_aspiration_14_DESC:1 "The legitimacy of our rule over Macedon derives from the dynasty's founder, [GetCharacter('(int32)37').GetPraenomen] the One-Eyed, and the noble blood marked by his glorious actions."
 desc_me_epi_2_cmod:0 "Though [GetCharacter('(int32)37').GetPraenomen] kingdom has been divided, many still pledge loyalty to his descendants, recognising the legitimacy and nobility of his dynasty."
 desc_me_epi_2_8_cmod:1 "Like [GetCharacter('(int32)45').GetPraenomen] once did, we grow rich from the Bosporan commercial routes passing via the Hellespont, whose urban centres grow rich from the collection of dues and influx of visitors. "
 desc_me_ant_02_2_cmod:0 "The Epirotes are a haughty people and share much in common with the Macedonians. We must turn their love of warfare to our advantage and ensure their continued obeisance."
 desc_me_ant_02_13_cmod:0 "Ensuring a naval presence will be vital to maintaining our remote holdings across the waves, focusing on velocity and tactical supremacy."
 desc_me_ant_02_3_cmod:0 "The coastal plain of Cilicia is famous for its pirates and natural defence, both of which will aid in reclaiming our lost territories."
 desc_me_ant_2_6_1_cmod:0 "Though our soldiers are not lacking courage or sense, the leadership of experienced mercenary officers may provide them an edge."
 desc_me_ant_2_6_2_cmod:0 "Negotiating with mercenaries is never a simple or inexpensive assignment, but building connections among the notable captains may make their demands less dear."
 desc_ant_2_12_pmod:0 "A sturdy bastion has been established on the apex of Mount Ithome above the Peloponnesian city of Messenia, providing a strategic garrison in southern Greece."
 desc_me_ant_2_end_cmod:0 "We have proven the merit of our dynasty's bloodline, meeting each disaster with untold determination, and inviting the immortal glory of [GetCharacter('(int32)39').GetPraenomen]."
 desc_ant_2_11_umod:0 "The victorious royal army of the Antigonid dynasty enjoys a prolonged military tradition and a reputation for effectiveness."
 antigonid_03_birthright_BUTTON_TOOLTIP:0 "Now that our dynasty is secure on the throne of Macedon, we can either content ourselves with Greece, or aspire to the reconquest of the holdings our founder held for decades!"
 antigonid_03_birthright_DESCRIPTION:0 "[GetCharacter('(int32)37').GetPraenomen], the greatest [GetCharacter('(int32)37').GetWomanMan] of [GetCharacter('(int32)37').GetHerHis] generation, ruled over vast swathes of [GetProvince('(int32)290').GetArea.GetRegion.GetName] and [GetProvince('(int32)790').GetArea.GetRegion.GetName], lands that were stolen from our dynasty. We have the means to reclaim our forfeited birthright, if we can only match [GetCharacter('(int32)37').GetHerHis] cunning and boldness."
 antigonid_03_birthright_CRITERIA_DESCRIPTION:0 "Reclaim the forfeited eastern holdings of [GetCharacter('(int32)37').GetName] and prove our dynasty the ultimate victor of the conflicts of the Diadochi."
 antigonid_03_birthright_1_DESC:0 "The cities of [GetProvince('(int32)334').GetArea.GetName] have prolonged been disputed, their kings taking Ptolamaic or Antigonid sides in our founders struggle for the island - let us ensure it is not forfeited again."
 antigonid_03_birthright_4_DESC:0 "The reclamation of the vast swathes of our lost holdings in [GetProvince('(int32)290').GetArea.GetRegion.GetName] is no minor assignment, let us commence by carving out a foothold on the western coasts."
 antigonid_03_birthright_7_DESC:0 "The urban centres of Mysia were once under our thumb, and with the fall of the Antipatrids and Lysimachids it is time to reclaim the Bosporos for ourselves."
 antigonid_03_birthright_8_DESC:0 "[GetCharacter('(int32)37').GetPraenomen]' magnificent city on the Orontes must be returned to our hands,  a symbol of the legacy of our founder and his vision for a Macedonian kingdom in Asia."
 antigonid_03_birthright_9_DESC:0 "[GetProvince('(int32)659').GetArea.GetName] was prolonged a sticking point between [GetCharacter('(int32)42').GetPraenomen] and [GetCharacter('(int32)37').GetPraenomen], who invaded each other repeatedly. Let us show that these disputes are now over, by making [GetProvince('(int32)659').GetArea.GetRegion.GetName] ours."
 antigonid_03_birthright_10_DESC:0 "The Ionian and Aeolian urban centres were the most willing Greek subjects of [GetCharacter('(int32)37').GetPraenomen] and marked the most successful fruits of his diplomatic efforts with the Greeks."
 antigonid_03_birthright_11_DESC:0 "[GetCharacter('(int32)37').GetPraenomen] considered [GetProvince('(int32)790').GetArea.GetRegion.GetName] to be an integral part of his kingdom, establishing numerous urban centres below the strategic [GetProvince('(int32)8021').GetName]. These lands our rightfully ours."
