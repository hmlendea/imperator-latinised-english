l_english:
 idea_elite_soldiers_desc:0 "Over-reliance on a reactionary militia leaves a nation at considerable risk of invasion, coup or collapse. A well trained standing army, is sure to protect against these menaces."
 idea_permanent_shipyards_desc:0 "Establishment of permanent shipyards capable of constructing vessels of conflict, will ensure that competent shipwrights are invariably at our beck and call."
 idea_retreat:0 "Ordered Withdrawal"
 idea_retreat_desc:0 "Withdrawal can be far from dishonorable. Ensuring that all our warriors have a plan of action in the event of having to fall back, will result in a much quicker recovery when they do."
 idea_siege_training_desc:0 "From oppida to forts, to walled urban centres, the world is full of fortified settlements. Adequately training our warriors to penetrate enemy walls will doubtlessly pay dividends."
 idea_standard_construction_desc:0 "As our nation begins to require more and more civic buildings, it has become apparent that a standardised method of planning and construction would considerably reduce the cost and time invested."
 idea_city_plan_desc:0 "Fitting structures within a walled city becomes considerably more of an issue as population sizes grow. Adopting a grid-based method for city planning will allow us to better account for available structure space."
 idea_forums_desc:0 "Enlargement and renovation of the central forum within our capital will provide for additional civic structure opportunities. It is of paramount importance that our subjects are proud of their capital."
 idea_trading_posts:0 "Patronised Trading Posts"
 idea_trading_posts_desc:0 "Keeping a firm financial interest in the various commercial outposts within our nation will allow us to exercise greater control over the flow of certain goods we deem valuable."
 idea_tariff_exceptions_desc:1 "Giving our territories greater leniency in tariff control will enable them to attract superior investments."
 idea_tax_farming_desc:0 "By shifting responsibility for tax collection to third parties, we can make considerably greater budget calculations, as well as refrain from certain unfortunate responsibilities."
 idea_land_appropriation:0 "Territory Appropriation Reform"
 idea_land_appropriation_desc:0 "Private ownership of territory is a necessity. However, it is clear that where the state requires the use of certain territories, it must possess the power to relocate those inhabiting them."
 idea_grain_admin_desc:0 "Nobody can predict an adverse harvest. We could, however, prepare for it. By invariably saving a surplus of grain, we would evade famine during particularly unfortunate seasons."
 idea_smear_desc:0 "By coordinating lines of communication with key members of the political, religious and civic spheres, we possess the perfect tool to manipulate popular opinion."
 idea_legislative_reform_desc:0 "The institution of a standardised code of practice, while not necessarily changing the method our government operates, will surely calm the dissenters in our nation."
 idea_mil_admin_desc:0 "By merging a clear, ordered bureaucratic framework into our military hierarchy, it becomes considerably easier to coordinate large military reforms."
 idea_functional_admin_desc:0 "We are unable to expect our citizens to simply become aware of changes in the method we operate our nation - instituting a framework of bureaucrats, representatives and messengers is vital to disseminate word of our decisions."
 idea_ambassadors_desc:0 "In definite diplomatic circumstances, it may benefit us to have a member of government installed as a permanent representative in the courts of our peers."
 idea_casus_belli_desc:0 "Whatever our true intent, foreign tolerance for our conflicts is invariably greater if we have a legitimate reason for conquest. Being seen as protectors of liberty is frequently reason enough."
 idea_hospitality_desc:0 "The duty of the host should be extended to all those who visit our nation. Especially those whom we wish to convince..."
 idea_state_religion_desc:0 "Incorporating our faith as a state entity will have notable political advantages."
 idea_haruspex_desc:0 "Reading the 'signs' in the entrails of animals has a prolonged history. With a willing haruspex, we could hold festival days at opportune moments, and further manipulate popular opinion at will."
 idea_tolerance_desc:0 "The number of pagan, hybrid, or purely foreign religions making their way into our territory is vast. Allowing individuals the entitlement to privately practice their own religion is sure to result in a more tolerant society."
 idea_proselytism_desc:0 "By amending our religious canon to mandate active proselytism, we should find that much of the labour in converting pagans is done for us."
 idea_origin_myth_desc:0 "It would provide our leadership considerably greater authority, if we were to suddenly discover that the origins of our nation can be traced back to the heroes of ancient times..."
