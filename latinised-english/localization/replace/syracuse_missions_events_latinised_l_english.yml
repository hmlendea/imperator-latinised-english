l_english:
 me_syracuse_1_democracy_leader_tt:0 "The leader is rated by their #T Powerbase#!, #T Martial#!, #T Affluence#!, and #T Popularity#!, each of which can increase the chance of a successful revolution."
 me_syracuse_1_democracy_base_tt:0 "The selected territory will serve as the revolution's capital in case of civil conflict, and receive a fort."
 me_syr_1_civil_war_ready:0 "A civil conflict can now be started."
 me_syr_tyrant_family_upset_tt:0 "Non-rebel members of the [tyrant_leader.GetFamily.GetName] family are distress."
 me_syracuse_1_democracy.1.desc:0 "Opposition to the tyrannical policies of [me_syracuse_scope.GetRuler.GetPraenomen] grows, and the influential [democracy_leader.GetPraenomen] has organised a meeting of disgruntled citizens.\n\n[democracy_leader.GetSheHe|U] calls upon those present to aid in the restoration of a republic, and is currently seen as the most capable proponent of change."
 me_syracuse_1_democracy.1.a:0 "We have to commence somewhere."
 me_syracuse_1_democracy.4.desc_11:0 "[new_democracy_leader.GetSheHe|U] argued that [new_democracy_leader.GetHerHis] possess connections and influence in the government were far more extensive and useful.\n\n"
 me_syracuse_1_democracy.4.desc_13:0 "[new_democracy_leader.GetSheHe|U] claimed that [new_democracy_leader.GetHerHis] personal popularity is needed to win over the people once the javelins commence to fly.\n\n"
 me_syracuse_1_democracy.4.desc_14:0 "[new_democracy_leader.GetSheHe|U] declared that if chosen to lead the revolution [new_democracy_leader.GetSheHe] would be able to place [new_democracy_leader.GetHerHis] vast financial resources to best use.\n\n"
 me_syracuse_1_democracy.4.desc_22:0 "citing [democracy_leader.GetHerHis] experience and understanding of military organisation. $me_syracuse_1_democracy.4.desc_26$"
 me_syracuse_1_democracy.5.desc:0 "Many have caught wind of the growing revolutionary cause, some manoeuvring to best profit from it, others wishing to ensure tyranny is defeated.\n\n[new_democracy_leader.GetPraenomen] has all but demanded the movement's reins, pointing to [new_democracy_leader.GetHerHis] position as head of the [new_democracy_leader.GetFamily.GetName] dynasty."
 me_syracuse_1_democracy.5.a:0 "We is unable to risk alienating [SCOPE.sChar('new_democracy_leader').GetPraenomen]..."
 me_syracuse_1_democracy.6.desc:0 "There are still republican urban centres left in Greece, despite the best efforts of the diadochi, and they may be willing to aid our liberation with a leader and soldiers.\n\nHowever, some argue that our founding metropolis Korinthos is the only city we should turn to, the favour shown by the gods to Timoleon being proof enough."
 me_syracuse_foreign_backer_tooltip:0 "The selected country will receive our request to dispatch aid and a leader for our revolution - #R this will lead to civil conflict#!."
 me_syracuse_cor_backer_tooltip:0 "Agents will search for a suitable Corinthian leader for our revolution - #R this will lead to civil conflict#!."
 me_syracuse_1_democracy.8.desc:0 "The [me_syracuse_foreign_request_character_scope.GetEmployer.GetAdjective] assembly voted [me_syracuse_foreign_request_character_scope.GetPraenomen], who they claim is an upstanding republican and experienced military commander, to lead the [me_syracuse_foreign_request_character_scope.GetEmployer.GetAdjective] contingent.\n\nIf we affirm, [me_syracuse_foreign_request_character_scope.GetPraenomen] will take command when the time is right for the insurrection to commence, trusted with whatever troops we and [me_syracuse_foreign_request_character_scope.GetEmployer.GetName] can muster."
 me_syracuse_1_democracy.10.bt:0 "[democracy_leader.GetPraenomen] will be very distress, and may undermine the revolution."
 me_syracuse_1_democracy.12.desc_2:0 "The tragic passing of [me_syracuse_old_foreign_request_character_scope.GetPraenomen] has place the leadership of the expedition to aid the Syracusan revolutionaries under question.\n\n"
 me_syracuse_1_democracy.14.desc:0 "Driven by personal animosity towards [democracy_leader.GetPraenomen], or an over-estimation of [new_democracy_leader.GetHerHis] possess abilities, a furious [new_democracy_leader.GetPraenomen] has demanded that [new_democracy_leader.GetSheHe] be leader of the revolution.\n\nIt's clear that, if not before, it is now personal, and [new_democracy_leader.GetPraenomen] will place [new_democracy_leader.GetHerHis] possess interests before the movement's if necessary..."
 me_syracuse_1_democracy.14.b:0 "'We must place aside our differences, [SCOPE.sChar('new_democracy_leader').GetPraenomen]!'"
 me_syracuse_1_democracy.15.desc:0 "Agents have arrived from [me_syracuse_scope.GetName] who claim to represent parties opposed to the rule of the tyrant [me_syracuse_scope.GetRuler.GetName].\n\nThey request our aid in the vein of Timoleon of Korinthos, who heroically deposed the tyrant Dionysius II and re-established a republic in Syracuse.\n\nWhile we will invariably support republican government, they request much of us..."
 me_syracuse_1_democracy.15.a:0 "They shall have our assistance, organise the expedition."
 me_syracuse_1_democracy.15.at:0 "We will dispatch a leader, gold, and manpower to aid the Syracusan revolutionaries."
 me_syracuse_1_democracy.16.desc_1:0 "They bring word that [me_syracuse_foreign_request_scope.GetName] has agreed to dispatch us what aid they can, and are currently deliberating on who should lead the expedition."
 me_syracuse_1_democracy.16.desc_2:0 "Their downcast eyes immediately reveal the [me_syracuse_foreign_request_scope.GetAdjective] response. [democracy_leader.GetPraenomen] is unable to hide his disappointment as they detail the platitudes and excuses."
 me_syracuse_1_democracy.17.desc:0 "[democracy_leader.GetPraenomen] has learned from those close to [bitter_leader.GetPraenomen] that [bitter_leader.GetSheHe] seeks to reveal the entire conspiracy to the tyrant, [syracuse_current_tyrant.GetPraenomen].\n\nIt seems that [bitter_leader.GetPraenomen], [bitter_leader.Custom('get_bitterness_tendency')], would rather reap the rewards of betraying the cause than permit any but [bitter_leader.GetHerselfHimself] to lead it!"
 me_syracuse_1_democracy.18.desc:0 "With the leadership decided, [democracy_leader.GetPraenomen] can now dedicate [democracy_leader.GetHerselfHimself] to the most important question - by what means will republican government be restored?\n\nSome suggest approaching ancient enemies or mercenaries, others the tyrant's heir, and some are adamant that we supplicate the motherland to render a second Timoleon..."
 me_syracuse_1_democracy.19.desc:0 "One of the most important things to consider is where the revolution should store its resources and meet - the capital being far too risky.\n\nMore importantly, if civil conflict breaks out, we require a defensible and strategic position from which to stand up to the tyrant's armies."
 me_syracuse_1_democracy.20.desc_1:0 "[deinokrates_scope.GetSheHe|U] is an ancient friend of the tyrant Agathokles, despite leading a revolt to take the throne himself when Agathokles seized power. The betrayal was forgiven, and [deinokrates_scope.GetPraenomen] appointed a general after Agathokles defeated [deinokrates_scope.GetHerHis] rebels.\n\n"
 me_syracuse_1_democracy.21.desc:0 "With our ancient headquarters no longer suitable, [democracy_leader.GetPraenomen] has elected to instead base the revolution out of [sm_rebel_base_scope.GetName].\n\nGods willing, this is only a temporary setback, and luckily our resources have been moved to the novel location in full."
 me_syracuse_1_democracy.22.desc_1:0 "The [me_syracuse_foreign_request_scope.GetAdjective] expedition was meticulously organised, with troops led by [me_syracuse_foreign_request_character_scope.GetPraenomen] arriving in [sm_rebel_base_scope.GetName], upon which [democracy_leader.GetPraenomen] formally declared [me_syracuse_foreign_request_character_scope.GetPraenomen] as interim leader of the republic.\n\n"
 me_syracuse_1_democracy.22.a:0 "Liberty or death!"
 desc_syr_foreign_levy_cmod:0 "Friendly forces from abroad have converged to aid our cause versus the tyrant."
 me_syracuse_1_democracy.24.t:0 "[democracy_leader.GetEmployer.GetAdjective] Civil Conflict Begins"
 me_syracuse_1_democracy.26.desc_12:0 "Republican revolutionaries have taken up arms versus our suzerain, tyrant [tyrant_leader.GetPraenomen], seeking to depose [tyrant_leader.GetHerHim] and restore popular government.\n\n"
 me_syracuse_1_democracy.26.at:0 "[democracy_leader.GetEmployer.GetName] is now at conflict with [tyrant_leader.GetEmployer.GetName]."
 me_syracuse_1_democracy.28.desc:0 "Our armies have triumphed under the leadership of [democracy_leader.GetPraenomen], driving the armies of [syracuse_current_tyrant.GetPraenomen] from the field!\n\nWe can now finally commence to establish the republic we have long yearned to recreate."
 me_syracuse_1_democracy.32.desc_2:0 "The republican revolutionaries have triumphed in [democracy_leader.GetEmployer.GetName] with the assistance of our expedition, driving the tyrant's armies from the field and establishing a novel government!\n\nThis is great day for free Greeks everywhere! May all tyrants quake at the news!"
 me_syracuse_1_democracy.35.desc:0 "Our agents have discovered a proud Corinthian commander still residing in the city, a fellow named [me_syr_3_cor_lead_scope.GetPraenomen].\n\nAfter explaining our cause, [me_syr_3_cor_lead_scope.GetSheHe] has offered to lead our armies and gather volunteers from the ancient Corinthian veterans."
 me_syracuse_1_democracy.38.desc:0 "Our agents in [democracy_leader.GetEmployer.GetCapital.GetName] have been hard at labour, trying to determine the best way to approach the tyrant's mercenaries without compromising secrecy.\n\nLuckily, a man named [me_syr_2_mer_deputy_scope.GetPraenomen] has a reputation as both a lovably honest rogue, and one of the brute's closest confidants.\n\nAlternatively, a straight-forward correspondence, sweetened with a gift, might get us access to [me_syr_2_mer_lead_scope.GetPraenomen]."
 me_syracuse_1_democracy.38.a:0 "Attempt to befriend this [me_syr_2_mer_deputy_scope.GetPraenomen]."
 me_syracuse_1_democracy.39.at:0 "Negotiations will commence soon."
 me_syracuse_1_democracy.40.desc:0 "A discrete meeting was arranged between [democracy_leader.GetPraenomen] and [me_syr_2_mer_lead_scope.GetPraenomen], deep in the slums of [democracy_leader.GetEmployer.GetCapital.GetName].\n\nIt quickly became clear that [me_syr_2_mer_lead_scope.GetPraenomen] is a astute fellow and faithful to his brothers in arms; he negotiates on behalf of his entire company of Italic mercenaries.\n\nWe will require to make some rather dear concessions if we are to secure his support, and we should not forget that he is now in a position to cause us quite a headache."
 me_syracuse_1_democracy.40.b:0 "We will grant them their own territories."
 me_syracuse_1_democracy.42.desc_1:0 "[me_syr_2_mer_lead_scope.GetPraenomen] requirements that, as agreed, a large sum be paid to compensate the mercenaries in payment for their services to the novel republic."
 me_syracuse_1_democracy.42.desc_2:0 "After our promise to grant them their own territories, [me_syr_2_mer_lead_scope.GetPraenomen] appraised several areas and has concluded that [me_syr_2_land_grant.GetName] would be a reasonable reward for his company."
 me_syracuse_1_democracy.43.desc:0 "[me_syracuse_foreign_request_character_scope.GetPraenomen] has been making suggestions based on the government of [me_syracuse_foreign_request_character_scope.GetHerHis] native [me_syracuse_foreign_request_scope.GetName].\n\nThis is an opportunity for a novel commence, especially given the poor record of our oligarchy."
 me_syracuse_1_democracy.44.desc:0 "[me_syr_heir_scope.GetPraenomen] has started gathering supporters, claiming that [me_syr_heir_scope.GetSheHe] is the rightful successor of the ancient tyrant and that the monarchy should be preserved."
 me_syracuse_1_democracy.44.a:0 "Then the [me_syr_heir_scope.GetWomanMan] must perish..."
 me_syracuse_1_democracy.45.desc:0 "Our deal with the mercenaries concluded, we are now ready to hatch a plan that will bring down the tyranny! It seems relying on mercenaries does have its shortcomings.\n\nIt should not be difficult to organise an appropriate deposition with the tyrant's guards on our side..."
 me_syracuse_1_democracy.47.desc_1:0 "With the mercenaries at our command, [tyrant_leader.GetPraenomen] was quickly dealt with and order restored on the streets of [democracy_leader.GetEmployer.GetCapital.GetName].\n\nThere will be a period of instability following such turbulent events, but [democracy_leader.GetPraenomen] will now lead [democracy_leader.GetEmployer.GetName] to liberty."
 me_syracuse_1_democracy.47.desc_3:0 "The tyrants of [tyrant_leader.GetEmployer.GetName] are blessed by Tyche, and it seems [tyrant_leader.GetPraenomen] was able to escape justice by bribing [tyrant_leader.GetHerHis] captors.\n\nRegardless, with the heir neutered it was easy to secure the city and place down the immediate menaces to the revolution."
 me_syracuse_1_democracy.47.desc_4:0 "Before [democracy_leader.GetPraenomen] can speak, [me_syr_heir_scope.GetPraenomen] draws a dagger and deftly slits the tyrant's throat.\n\n[democracy_leader.GetPraenomen] and [democracy_leader.GetHerHis] followers are stunned, turning to gauge the reaction of the sea of unfamiliar faces.\n\nIt dawns on [me_syr_heir_scope.GetPraenomen] too late that the gathered men were provided by [me_syr_heir_scope.GetPraenomen], as the novel king gives the command to execute the group."
 me_syracuse_1_democracy.48.desc:0 "The resentment of [bitter_leader.GetPraenomen] towards [me_syracuse_foreign_request_character_scope.GetPraenomen] has been quietly simmering.\n\nNow [bitter_leader.GetPraenomen] is stirring people versus our ruler, claiming that a true Syracusan should lead the republic."
 me_syracuse_1_democracy.49.desc_1:0 "We have fought the Carthaginians for control of the island of Sicily for countless decades, but they arguably have the most to gain by putting us into their debt.\n\nWith their assistance, we may be able to quickly destroy the tyranny by force."
 me_syracuse_1_democracy.51.desc:0 "The leadership has decided on ambassadors to dispatch to [me_syr_deal_with_devil_scope.GetName] to aid our case, but there is debate on whether we should dispatch a gift along with them.\n\nObviously, without access to the treasury, only our leader could afford such an expense, if it was deemed necessary..."
 me_syracuse_1_democracy.51.at:0 "We will not dispatch [me_syr_deal_with_devil_scope.GetName] a gift."
 me_syracuse_1_democracy.51.b:0 "Best dispatch a gift just in case."
 me_syracuse_1_democracy.52.desc_2:0 "A minor party of [democracy_leader.GetEmployer.GetAdjective] envoys have arrived in our capital, claiming to represent the true government of [democracy_leader.GetEmployer.GetName].\n\n"
 me_syracuse_1_democracy.52.desc:0 "They represent republicans who wish to overthrow the monarchy and request for our support in their endeavour, promising repayment once they are in power."
 me_syracuse_1_democracy.52.at:0 "We will select what to demand from the [democracy_leader.GetEmployer.GetAdjective] republicans if they win.\nIf they accept, we will dispatch manpower and funds to the rebels."
 me_syracuse_1_democracy.52.c:0 "[me_syr_deal_with_devil_scope.GetAdjective] soldiers perish only for [me_syr_deal_with_devil_scope.GetName]."
 me_syracuse_1_democracy.53.desc:0 "With the business of securing [me_syr_deal_with_devil_scope.GetAdjective] attention complete, the members debate how best to secure their support while not giving away too much in the process.\n\nSome advocate a simple payment, others ceding territory, and there are those who suggest paying tribute is a minor price to pay for freeing ourselves of a tyrant."
 me_syracuse_1_democracy.53.conditions_tt:0 "If they accept and we win the civil conflict,"
 me_syracuse_1_democracy.54.a:0 "[me_syr_deal_with_devil_scope.GetName] may assistance us..."
 me_syracuse_1_democracy.55.desc_2:0 "$me_syracuse_1_democracy.55.desc_starter$\n\nThey offer to reward us with a simple payment, though not a minor one, once the tyrant has been removed."
 me_syracuse_1_democracy.55.desc_3:0 "$me_syracuse_1_democracy.55.desc_starter$\n\nThey pledge that once liberty is restored in [democracy_leader.GetEmployer.GetCapital.GetName], the novel republic will pay us yearly tribute."
 me_syracuse_1_democracy.55.a:0 "We can labour with this."
 me_syracuse_1_democracy.55.at:0 "We will dispatch #Y manpower#! and #Y funds#! to the revolutionaries when the civil conflict begins, and #Y guarantee#! the novel government of [democracy_leader.GetEmployer.GetName].\nWe can expect the #Y promised payment#! if the rebels overthrow the tyrant successfully."
 me_syracuse_1_democracy.55.d:0 "We must demand territory."
 me_syracuse_1_democracy.55.conditions_tt:0 "We will demand that if they win the civil conflict,"
 me_syracuse_1_democracy.58.t:0 "$syracuse_1_4_deal_with_devil$: [me_syr_deal_with_devil_scope.GetAdjective] Requirements"
 me_syracuse_1_democracy.58.desc:0 "[me_syr_deal_with_devil_scope.GetAdjective] delegates sent a counter offer, demanding we [SCOPE.Custom('get_me_syr_demand_details')]\n\nIf we accept, they will dispatch us support versus the tyrant when we call upon them."
 me_syracuse_1_democracy.58.conditions_tt:0 "If we win the civil conflict,"
 me_syracuse_demand_money:0 "pay [me_syr_deal_with_devil_scope.GetName] a sizeable chunk of gold."
 me_syracuse_1_democracy.59.desc_1:0 "$me_syracuse_1_democracy.59_desc_start$ accepted our generous requirements, calling them a minor price to pay for liberty. They will dispatch for our troops when the time is right."
 me_syracuse_1_democracy.59.desc_2:0 "$me_syracuse_1_democracy.59_desc_start$ rejected our generous requirements, calling them outrageous. They will seek other avenues of support for their cause."
 me_syracuse_1_democracy.61.desc_2:0 "a sizeable sum of gold and silver."
 me_syracuse_1_democracy.61.desc_4:0 "\n\n[me_syr_deal_with_devil_scope.GetName] is clearly impatient to hear our response, and we must not maintain them waiting any longer."
 me_syracuse_1_democracy.61.a:0 "We will maintain our promises."
 me_syracuse_1_democracy.62.desc:0 "In the aftermath of their civil conflict, our envoys have approached the novel [me_syracuse_scope.GetAdjective] leader to request repayment."
 me_syracuse_1_democracy.62.desc_1:0 "They have wisely agreed to the maintain their promises and made the arrangements. They may turn out to be useful after all."
 me_syracuse_1_democracy.62.desc_2:0 "In flagrant contempt of our agreement, they have refused to honour their promises and laughed our envoys out of their capital."
 me_syracuse_1_democracy.63.t:0 "$syracuse_1_9_taking_stock$: The Ancient Feudatories"
 me_syracuse_1_democracy.63.desc:0 "In the chaos of the civil conflict, the Greek urban centres subdued by the ancient tyrant took the opportunity to throw off their shackles.\n\nNow that the conflict is settled, bringing these urban centres back under our control has been suggested..."
 me_syracuse_1_democracy.63.a:0 "Whatever happened in the past, we require them."
 me_syracuse_1_democracy.64.desc:0 "With the tyrant dealt with, [democracy_leader.GetPraenomen] has begun organising the novel government of [democracy_leader.GetEmployer.GetName] and ensuring a smooth transition to republican rule.\n\nSoon the stability of our novel state will be apparent, and we will move towards a brighter future in liberty."
 me_syracuse_1_democracy.64.a:0 "This is our chance to commence anew."
 me_syracuse_1_democracy.66.desc:0 "Believing the novel government to be weak, [me_syr_resurgent_tyrant_scope.GetPraenomen] has been stirring up wayward elements to support [me_syr_resurgent_tyrant_scope.GetHerHis] in-statement as king of [me_syr_resurgent_tyrant_scope.GetEmployer.GetName] - claiming the republic is an illegitimate farce.\n\nWe have the power to get rid of [me_syr_resurgent_tyrant_scope.GetHerHim], but it will not sit well with the public..."
 me_syracuse_1_democracy.68.desc_1:0 "[me_syr_heir_scope.GetPraenomen] has convinced the tyrant to attend a banquet in [tyrant_leader.GetHerHis] honour just outside the city. The guests will be loyal rebels ready to dispatch [tyrant_leader.GetHerHis] guards at the opportune moment."
 me_syracuse_1_democracy.69.desc:0 "With all the preparations complete and a deal struck with [me_syr_deal_with_devil_scope.GetName], we are at last ready to commence the bloody labour in earnest and restore popular government!\n\nA decent body of [me_syr_deal_with_devil_scope.GetAdjective] troops are ready to join our armies once the time is right."
 me_syracuse_1_democracy.69.a:0 "They better maintain their promises!"
 me_syracuse_1_democracy.70.at:0 "This is more probable to convince moral or modest characters."
 me_syracuse_1_democracy.70.bt2:0 "This is more probable to convince aspiring or conceited characters."
 me_syracuse_1_democracy.70.ct:0 "This is more probable to convince credulous or impulsive characters."
 me_syracuse_1_democracy.70.bt:0 "This option is available due to the personal affluence of [democracy_leader.GetPraenomen]."
 me_syracuse_1_democracy.71.desc_2:0 "[democracy_leader.GetPraenomen] persuaded [me_syr_heir_scope.GetPraenomen] of what will be gained in the novel age of liberty; promising women, the people's love, and everlasting glory as a liberator.\n\n[me_syr_heir_scope.GetPraenomen] has agreed to place the tyrant in a compromising position to bring this about."
 me_syracuse_1_democracy.71.desc_3:0 "[democracy_leader.GetPraenomen] convinced the gullible [me_syr_heir_scope.GetPraenomen] that [democracy_leader.GetSheHe] would like [me_syr_heir_scope.GetHerHim] to present some of [democracy_leader.GetHerHis] ideas for grand public works in the tyrant's honour to the ruler as a favour, at a secluded site away from the palace."
 me_syracuse_1_democracy.71.desc_5:0 "\n\nThis should provide us with the opportunity we require to seize the tyrant while they are vulnerable, and from there the rest will follow."
 me_syracuse_1_democracy.72.desc:0 "Thanks to the hard labour and abilities of [democracy_leader.GetPraenomen], [democracy_leader.GetEmployer.GetName] is at last safe from the whims of tyrannical rule, and the republic of ancient restored once more!"
 me_syracuse_1_democracy.74.desc:0 "In the confusion, the rebels were unable to effectively organise a novel government - a situation which [me_syr_abort_ruler.GetPraenomen] exploited by procuring mercenaries and installing [me_syr_abort_ruler.GetHerselfHimself] in the ancient tyrant's palace."
 me_syracuse_1_democracy.75.desc:0 "The first step is to arrange a meeting with [me_syr_heir_scope.GetPraenomen], or several - that the lay of the territory can be gathered before we move forward.\n\nUnfortunately, [me_syr_heir_scope.GetPraenomen] is quite picky about the company [me_syr_heir_scope.GetSheHe] keeps, and we must rely on the talents and resources of our leader, [democracy_leader.GetPraenomen], to impress [me_syr_heir_scope.GetHerHim]..."
 me_syracuse_1_democracy.75.bt:0 "This option is available due to the personal #T Affluence#! of #Y [democracy_leader.GetPraenomen]#!, which will also determine the size of gift #Y [democracy_leader.GetPraenomen]#! is able to afford."
 me_syracuse_1_democracy.76.desc_5:0 "A much embarrassed [democracy_leader.GetPraenomen] has returned empty handed, unable to secure a reasonable line of contact with [me_syr_heir_scope.GetPraenomen], claiming 'it was out of [democracy_leader.GetHerHis] hands.'\n\nAfter the censure has been heaped on [democracy_leader.GetPraenomen], we must find another means of attaining liberty..."
 me_syracuse_1_democracy.78.desc:0 "A dishevelled [tyrant_leader.GetWomanMan] claiming to be [tyrant_leader.GetPraenomen] of [democracy_leader.GetEmployer.GetPraenomen] has appeared.\n\n[tyrant_leader.GetSheHe|U] claims they only barely managed to escape a coup with their life."
 me_syracuse_1_democracy.79.desc_2:0 "[me_syr_heir_scope.GetPraenomen], the heir to [me_syr_heir_scope.GetEmployer.GetName], has seized power after hijacking a republican plot, ousting [me_syr_heir_scope.GetHerHis] ancient liege [tyrant_leader.GetPraenomen]."
 me_syracuse_1_democracy.79.desc_5:1 "[tyrant_leader.GetPraenomen] now languishes in [tyrant_leader.GetHerHis] ancient dungeons."
 me_syracuse_2_sicily.1.desc:0 "Between civil conflicts and Punic invasions, [me_syracuse_scope.GetName] has had a rough history, but under the guidance of [me_syracuse_scope.GetRuler.GetPraenomen] we have made great strides.\n\nIt is time to realise the dream of all Syracusan kings, and establish our rule over all the Greeks of Sicily in deed rather than merely word."
 me_syracuse_2_sicily.2.desc:0 "We have at last definitively secured the coasts and interior of eastern Sicily, encompassing the main Greek urban centres and most fertile territory.\n\nOne day soon perhaps, we will reconquer the colonies which fell to the Punic barbarians in our darkest hours..."
 me_syracuse_2_sicily.3.desc:0 "Our city has made and broken the fortunes of countless generations of Italic mercenaries seeking affluence and glory in Greek service.\n\nOnce more, we must gather our most reliable recruiters to offset our citizen soldier shortfall."
 me_syracuse_2_sicily.6.desc:0 "It is no longer possible or necessary to continue labour on restoring Syrakousai, and the project has been axed as a result."
 me_syracuse_2_sicily.7.desc:1 "Our envoys have returned from the free $syracusan$ urban centres, unburdened of their gifts but bearing the weight of vital news.\n\n"
 me_syracuse_2_sicily.7.desc_1:0 "They gladly report that each of the urban centres they visited assented to our leadership, following the [me_syr_sic_tag_1.GetAdjective] example it seems."
 me_syracuse_2_sicily.7.desc_2:0 "They had mixed success, but managed to win the pledges of [me_syr_sic_tag_1.GetName] at least. Others have cast their perish..."
 me_syracuse_2_sicily.7.desc_3:0 "Their stony faces make their message clear long before they open their mouths. Our brother urban centres will join the fold, one way or another."
 me_syracuse_2_sicily.8.desc:1 "Akragas, famed for its temples which outstrip even our own in number, has been, perhaps after only Gelas, our greatest $syracusan$ rival in Sicily.\n\nWith the city now under our control once more, it will act as a bulwark on our western frontier, and its religious revenues can be place to full use."
 me_syracuse_2_sicily.9.desc:1 "The loyalties of the $syracusan$ urban centres vacillate like the wind - though nominally subservient to our rule, many remain haughty and capricious.\n\nWith our changing fortunes we can no longer tolerate their delusions; they must submit to the common cause of all Siceliotes before our enemies take advantage."
 me_syracuse_2_sicily.9.at:1 "$me_syr_task_start_tt_1$ diplomacy with $syracusan$ urban centres."
 me_syracuse_2_sicily.10.desc:1 "Ready for any outcome, plans have been drafted for an aggressive campaign versus the $syracusan$ urban centres - a route many see as inevitable.\n\nHowever, there are still a stolid few who argue the merits of deft diplomacy, and the avoidance of needless bloodshed among kin when barbarians threaten us all."
 me_syracuse_2_sicily.11.desc:0 "The isle of Ortygia is the centre of religious and administrative life in [me_syracuse_scope.GetCapital.GetName], connected to the mainland by a narrow finger of earth.\n\nWe must restore the fortifications torn down by Timoleon if we are to ensure the city is kept safe from usurpers and invaders, and make Ortygia impregnable once more."
 me_syracuse_2_sicily.12.desc:0 "Our prudent agricultural efforts have ensured the production of our high quality grain is maintained and increased.\n\nWe require not worry about a lack of bread in Sicily, and foreign traders will flock to secure access to our goods."
 me_syracuse_2_sicily.13.desc:0 "Once again the approaches to Ortygia are formidable, with towering walls securing the approaches from the sea, and a large gatehouse blocking the canal bridge.\n\nIt is not dramatic to suggest the survival of our city depended on these astute fortifications, and will ensure our power for years to come."
 me_syracuse_2_sicily.13.a:0 "Who requirements an acropolis?"
 me_syracuse_2_sicily.14.desc:0 "Because our forefathers landed in Sicily, they have come to blows with the native Sikeloi and Sikanoi, uncivilized barbarians who resented their arrival.\n\nWith their confederation at last sundered, the Sikeloi, who aided the brazen Athenian invasion, must accept Greek dominance over eastern Sicily."
 me_syracuse_2_sicily.16.desc:0 "The debris of past sorrows has been cleared, and novel settlers enticed by the promise of prosperity and security behind our walls.\n\nThe temples and palaces of Ortygia shine brightly once more, and [me_syracuse_scope.GetCapital.GetName] will again be a city to compete with the likes of Athens and Corinth!"
 me_syracuse_2_sicily.17.desc:0 "Syracuse at last is hegemon of all the Siceliotes in eastern Sicily, and is ready to defend their interests versus the encroaching Punic and Italic menaces."
 me_syracuse_2_sicily.18.a:0 "Our coins will invariably bear her likeness."
 me_syracuse_2_sicily.19.t:0 "$syracuse_2_8$: Labour Begins"
 me_syracuse_2_sicily.20.t:0 "$syracuse_2_3$: Labour Halts"
 me_syracuse_3_punic.1.desc:1 "We have wrestled with the Carthaginians for control of Sicily for hundreds of years, every Greek victory followed by an equalizing defeat - an interminable stalemate.\n\nThey were given dominion over everything west of the Halkyos in the last treaty, and hunger for more. We must bring conflict before the Italics sniff blood in the water..."
 me_syracuse_3_punic.2.desc:0 "After countless conflicts, disagreements, deceptions, and reversals; Sicily is at last free of the Phoenician invaders who insinuated themselves into Siceliote conflicts.\n\nFrom now on, we shall be vigilant and protect this, the greatest Greek island of the world, from foreign ambitions."
 me_syracuse_3_punic.3.desc:0 "Working night and day bending planks and caulking hulls, our shipwrights have been invigorated by the construction of our proud novel fleet.\n\nWhile we may be unable to match the combined strength of the Phoenicians, astute deployment of our forces will still cause them trouble landing in Sicily."
 me_syracuse_3_punic.4.desc:0 "The audacious visions of Alexander and the naval campaigns of his successors in the east have shaken the ancient traditions of maritime warfare.\n\nWith ever larger vessels and a move towards firepower and boarding over ramming, lessons might be applied which will give us a better chance versus the Punic fleet."
 me_syracuse_3_punic.5.desc_1:0 "Besides experimenting with a large siege vessel design based on the fleet of Demetrios Poliorketes, we also unearthed an experienced ancient seaman named [odysseus_scope.GetPraenomen]."
 me_syracuse_3_punic.5.desc_2:0 "Our explorations into naval tactics have unearthed an experienced ancient seaman named [odysseus_scope.GetPraenomen]."
 me_syracuse_3_punic.5.desc_3:0 "\n\nHe studied under veterans of Alexander's campaigns, and cautions that specialising our tactics is the best way to make most use of our forces."
 me_syracuse_3_punic.6.t:0 "$syracuse_3_5$: Liberty Calls"
 me_syracuse_3_punic.6.desc:2 "The subjugated $syracusan$ urban centres of Sicily have had little choice but to accept their servitude in the face of overwhelming Punic numbers.\n\nHowever, they loyalties surely still lie with their fellow Greeks, and learning of our ambitions may inspire their defection."
 me_syracuse_3_punic.7.desc:0 "We will not make past mistakes again and permit the Punic forces to siege Syracuse without first sapping their strength.\n\nThe defences at [me_syr_3_3_final_scope.GetName] are complete, and it is hoped their contribution to our strategy will be realised."
 me_syracuse_3_punic.7.a:0 "[me_syr_3_3_final_scope.GetName] will maintain us safe."
 me_syracuse_3_punic.8.desc:1 "Our delegates have returned from the $syracusan$ urban centres, their negotiations at an end.\n\n"
 me_syracuse_3_punic.8.desc_1:0 "Their efforts were a unmitigated success; all of the free Siceliote urban centres have joined us in an alliance aimed at defending our island from Punic and Italic encroachment."
 me_syracuse_3_punic.8.desc_2:0 "Though not all the urban centres showed willing, apparently [me_syr_sic_tag_1.GetName] was convinced of the Punic menace and was the leading proponent of friendship with [me_syracuse_scope.GetName]."
 me_syracuse_3_punic.8.desc_3:0 "They did not manage to convince a single Siceliote city, their leaders evidently still distrustful of Syracuse and too shortsighted to see the true menace..."
 me_syracuse_3_punic.9.desc:1 "Our envoys have returned from their clandestine negotiations in the subjugated $syracusan$ urban centres.\n\n"
 me_syracuse_3_punic.10.t:0 "$syracuse_3_3$: Robust Point"
 me_syracuse_3_punic.10.desc:0 "Our strategists have suggested that after the initial push into western Sicily, it would be useful to have a point at which the Carthaginian forces may be delayed.\n\nThis would permit us room to breath if they territory an overwhelming force, and perhaps even draw their army into unfavorable terrain. They suggest one of these sites:"
 me_syracuse_3_punic.11.desc:0 "Selinous and Herakleia Minoa are at last free from foreign rule after over a hundred years of subservience to Carthage, and finally subject to Syracusan leadership.\n\nThese urban centres still retain a fair amount of their prior potential, and the people rejoice as families who fled to Greece long ago return to their ancestral homes..."
 me_syracuse_3_punic.12.desc:0 "There are still those Siceliote urban centres that have retained some degree of autonomy in the aftermath of the Sicilian conflicts.\n\nWe should unite these doubters to our cause, playing up the looming menace posed by Carthage and dispelling their fears of us."
 me_syracuse_3_punic.13.t:0 "$syracuse_3_8$: Labour Begins"
 me_syracuse_3_punic.13.desc:0 "The Punic savages slaughtered almost the entire population of Himera and leveled every structure in their rage, leaving only a few survivors who founded the Thermai adjacent.\n\nWith the site of the ancient city recovered, rebuilding the city will be a symbolic as much as economic victory for the Siceliotes."
 me_syracuse_3_punic.14.desc:0 "The blasted [me_syracuse_scope.GetAdjective] brigands have sent us an offer, suggesting that with our reversals in Sicily we should accept defeat and cut our losses.\n\nThey offer us a sizeable payment if we agree to give up our remaining territories on the island..."
 me_syracuse_3_punic.15.desc:0 "After countless years under the Carthaginian yoke, the Greek colonies of western Sicily are at last in Greek hands! Even Segesta, who brought Athens to our shores.\n\nWe must consolidate our grip on the island and ensure that our awe inspiring reconquests are not short lived, returning the territory to Siceliotes."
 me_syracuse_3_punic.15.a:1 "Centuries of longing realised..."
 me_syracuse_3_punic.16.at:0 "We will offer to purchase Carthage's remaining Sicilian territory for #Y [SCOPE.ScriptValue('me_syr_3_west_sicily_buy_svalue')|0]#! @gold!"
 me_syracuse_3_punic.17.desc:1 "Envoys from Syracuse have arrived, begging us to consider joining them as allies versus the menace of Carthage and any who would seek to destroy the $syracusan$ way of life."
 me_syracuse_3_punic.18.a:0 "Liberty at last!"
 me_syracuse_3_punic.19.desc:0 "Our workmen have at last completed their labour on the ancient site of Himera, constructing the necessary public buildings and homes for settlers.\n\nA great festival was held rededicating the town to Nike and begging her to bless the city."
 me_syracuse_3_punic.20.desc:0 "The ancient city of the Punic seafarers has at last, for the first time, fallen to foreign arms, a feat which Agathokles' never saw through.\n\nWith this stunning achievement, we have shown the world that the merchant empire is not as robust as they would have us consider, and their gods desert them!"
 me_syracuse_3_punic.22.desc:0 "News has spread across Greece that the ancient Greek city of Himera in Sicily, destroyed by the Carthaginians over a hundred years ago, is being re-founded.\n\nSettlers are flocking to the island after its recent reconquests of Greek urban centres, and some of our people have been convinced of the opportunities."
 me_syracuse_3_punic.22.c:0 "No, we require every man."
 me_syracuse_3_punic.23.desc:0 "Our envoys return from Carthage with news of the offer to purchase their Sicilian territories.\n\n"
 me_syracuse_3_punic.24.desc:0 "Novel of our reconquests and the re-founding of Himera have spread across Greece, bringing many settlers from the motherland hoping to construct novel lives here.\n\nIt seems we have inspired a novel hope in the Hellenic world!"
 me_syracuse_4_magna.1.desc:0 "Kings and empires from the motherland have sought dominion over the rich territories of southern Italia and Sicily, from Alexandros of Epirus to Athenai.\n\nNow we are in a position to fulfil the dream of a united Magna Graecia, and not as a subject to a Greek metropolis or diadochi!"
 me_syracuse_4_magna.3.desc:0 "The free Italiote urban centres are well cognisant of our rapid expansion, and the balance we can provide to Italic power.\n\nIf they are reasonable, they will consent to becoming our subjects for the greater good of Magna Graecia."
 me_syracuse_4_magna.3.at:0 "$me_syr_task_start_tt_1$ diplomacy with Italiote urban centres."
 me_syracuse_4_magna.4.desc:0 "Our envoys have returned from the free Italiote urban centres, bearing the responses of their leaders.\n\n"
 me_syracuse_4_magna.4.desc_1:0 "Every city assented to our suggestions, gratefully thanking us for liberating Magna Graecia and providing the leadership it requirements.."
 me_syracuse_4_magna.4.desc_2:0 "Some of the urban centres we approached were not convinced, but others have agreed to accept our protection and aid our cause."
 me_syracuse_4_magna.4.desc_3:0 "None of the urban centres we approached accepted our offer, it seems they consider they can protect themselves versus the Italic powers..."
 me_syracuse_4_magna.5.desc:0 "Some of the subjugated Italiote urban centres of Magna Graecia have fallen under assaults from their more numerous Italic neighbours.\n\nNow that we are in a position to protect them, they may be convinced to revolt from their masters and become our allies."
 me_syracuse_4_magna.5.a:0 "They must desire liberty."
 me_syracuse_4_magna.6.desc:0 "The envoys have returned from the subjugated urban centres of Magna Graecia with word of their meetings.\n\n"
 me_syracuse_4_magna.6.desc_1:0 "It seems all those approached were convinced, and have broken their treaties with their Italic suzerains in exchange for our protection!"
 me_syracuse_4_magna.6.desc_2:0 "They were reasonably successful, convincing some of those they approached to come under our protection and revolt versus their Italic suzerains!"
 me_syracuse_4_magna.8.desc:0 "Pythagoras' doctrine remain famous, foremost the many advancements in geometry and philosophy ascribed to him and his Krotine school in the mystic past.\n\nWe could foster a revival of his movement in order to promote learning in Kroton, but his more controversial moral lessons will probable rear their heads as well..."
 me_syracuse_4_magna.8.a:0 "We must all come to love sagacity."
 me_syracuse_4_magna.9.desc:0 "As we expected, the revival of Pythagorean communities has brought forth his eccentric doctrine, from the transmigration of souls to abstaining from beans...\n\n[pythagoras_scope.GetPraenomen], an ancient adherent, is encouraging experiments and discussion, but we should consider how much liberty we are really willing to give these crackpots..."
 me_syracuse_4_magna.10.t:0 "$syracuse_4_5$: Ancient Lessons"
 me_syracuse_4_magna.10.a:0 "All of Magna Graecia's sagacity must be place to use."
 me_syracuse_4_magna.11.desc:0 "The military school has been established, drilling our cavalry officers and horsemen in Tarentine techniques and deployment.\n\nWe must decide between integrating our cavalry into the army as seamlessly as possible, or specialising in putting their mobility to its full use."
 me_syracuse_4_magna.12.desc:0 "With the people of [me_syr_4_tribe_scope.GetName] answering to us, the Greeks of Magna Graecia require no longer be fearful of raids and frontier disputes with the tribe.\n\nWhat is more, many of the [me_syr_4_tribe_scope.GetAdjective] people flock to serve in the auxiliary light infantry of our armies, eager to please their rapacious gods."
 me_syracuse_4_magna.13.desc:0 "We have finally united the surviving Hellenic colonies of Italia and liberated the less fortunate from Italic subjugation.\n\nA novel era of peace and prosperity will commence under our watchful eye!"
 me_syracuse_4_magna.13.a:0 "A novel golden age for the Italiotes!"
 me_syracuse_4_magna.14.desc:0 "Our victories in Italia have brought the southern portion of the peninsula firmly under Greek control for the first time.\n\nWith their safety secured, the people and urban centres of Magna Graecia at last are a match for the metropolises of the motherland."
 me_syracuse_4_magna.16.desc:0 "We have been approached by envoys of [me_syracuse_scope.GetRulerTitle] [me_syracuse_scope.GetRuler.GetPraenomen] of [me_syracuse_scope.GetName], whose country has risen to great prominence in Magna Graecia.\n\nThey now set their sights on protecting the divided Greeks of Italia from rising local powers, and request for our aid in their struggle."
 me_syracuse_4_magna.16.at:0 "We will dispatch manpower and form an alliance with [me_syracuse_scope.GetName]."
 me_syracuse_4_magna.16.bt:0 "This option is available because we produce #Y Elephants#! @elephants!.\nWe will dispatch elephants and from an alliance with [me_syracuse_scope.GetName]."
 me_syracuse_4_magna.16.c:0 "Dispatch them some tokens of our sympathy."
 me_syracuse_4_magna.16.ct:0 "We will dispatch a minor gift to [me_syracuse_scope.GetName]."
 me_syracuse_4_magna.17.desc_2:0 "They generously sent us the makings of a conflict elephant stable as a testament to the strength of the novel [me_syr_response_scope.GetAdjective]-[me_syracuse_scope.GetAdjective] alliance!"
 me_syracuse_4_magna.21.desc:0 "Our envoys report that is it is no longer possible to approach the Italiote urban centres due to recent events before our control."
 me_syracuse_4_magna.22.desc:0 "The subjugation of the most powerful Italiote urban centres of Magna Graecia has confirmed our strength and the require for [me_syracuse_scope.GetAdjective] leadership.\n\nThe ancient agoras already fill with novel settlers encouraged by our successes in the region, hoping to construct a novel life of peace and plenty."
 me_syracuse_4_magna.24.desc:1 "Envoys from the growing $syracusan$ state of [me_syracuse_scope.GetName] have approached us, offering to protect our us from the encroaching Italic menace.\n\nThey request only that we contribute to their efforts and aid them in their struggles..."
 me_syracuse_4_magna.25.desc:0 "Envoys have been secretly meeting our officials to discuss revolt from our Italic suzerains.\n\nThey wish to liberate the ancient colonies of Magna Graecia and offer us their protection."
 me_syr_4_25_car_claims_tt:0 "Our suzerain will gain claims on our territory."
