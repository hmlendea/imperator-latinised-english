l_english:
 carthaginian_sicily_expansion_mission_DESCRIPTION:0 "Sicily has for an extended time been a battleground between different Greek factions, particularly the people of Syracuse, and ourselves. It has been a drain on our resources, and pushed us to the brink of destruction in the past, most recently under the warmonger Agathocles. It is time to put an end to these petty conflicts, and finally annex the island once and for all."
 carthaginian_sicily_expansion_mission_BUTTON_TOOLTIP:1 "It is time to put an end to the menaces coming from Sicily, and annex the island. No longer will our nation be placed in danger from ambitious Greek warlords."
 carthaginian_sicily_expansion_mission_1:1 "In Defence of [SCOPE.sP('acragas_province').GetName]"
 carthaginian_sicily_expansion_mission_2_DESC:1 "As loyal allies of [SCOPE.sCountry('mission_country').GetName], Acragas will be an important port in the direction of the Greek east. As they are often trading with their ancient homeland, they will be convinced to bring Greek goods and wealth into the Epikrateia."
 carthaginian_sicily_expansion_mission_3_DESC:0 "Dead centre between the Punic west and Syracusan east lies the city of Acragas, a strong independent city-state. If we want to ensure control of the island, we need access to the city one way or another."
 carthaginian_sicily_expansion_mission_5_DESC:0 "Our Epikrateia in western Sicily has for an extended time been the only bulwark against Syracusan aggression. Though often sacked and broken down in the numerous conflicts, we need to make sure that our cities are populous enough to guide those who rely on our protection."
 carthaginian_sicily_expansion_mission_6_DESC:0 "At the south-eastern tip of Sicily lies Syracuse, greatest of the Greek urban centres, and a thorn in our side. For an extended time have we fought their armies throughout the island, and most recently they had the audacity of landing in our heartland and causing havoc."
 carthaginian_sicily_expansion_mission_7_DESC:0 "Taking control of Syracuse will be the first of numerous steps in pacifying the island of Sicily, and finally putting an end to the numerous Sicilian conflicts."
 carthaginian_sicily_expansion_mission_10_DESC:1 "The Syracusans are known for their ingenuity, and numerous interesting experiments has come out of the city in the past. Taking a look through their plans, ideas and shipyards might provide military boons to our forces."
 carthaginian_sicily_expansion_mission_final_DESC:0 "Numerous conflicts have raged throughout Sicily, often bringing poverty and demise in its wake. With the entire region under our rule we will no longer have to fear Greek attacks, and the only thing that remains is to decide how we will govern the area."
 carthaginian_iberia_expansion_mission_DESCRIPTION:1 "The rich lands of Iberia are waiting for a mighty trade empire to take control of their many silver mines. The numerous Phoenician colonies there give us an entry point we should make use of, when we give our soldiers the orders to expand into this wild region."
 carthaginian_iberia_expansion_mission_task_2_DESC:1 "Obtaining control of the rich mines of Iberia will provide the wealth needed to support our campaigns and construct the necessary infrastructure to secure our rule in these newly conquered lands."
 carthaginian_iberia_expansion_mission_task_5_DESC:0 "Though we have an extended and valuable relationship with some of the coastal tribes, the rest of Iberia will not easily accept the rule of foreigners as they are known far and wide for their stubbornness and barbaric tendencies."
 carthaginian_iberia_expansion_mission_task_5_optional_DESC:0 "By fortifying the numerous passes into the Puno-Iberian heartland, we will ensure that our labour in the mines can continue unhindered."
 carthaginian_iberia_expansion_mission_task_6_DESC:2 "A beacon of civilisation in our novel territory, like Carthage once was when we settled Africa."
 carthaginian_iberia_expansion_mission_task_9_DESC:0 "Ancient Tartessos has been lost to the passage of time, but it seems we still have a chance to establish our ancient relations with the novel tribes who have settled in the area."
 carthaginian_iberia_expansion_mission_task_11_DESC:0 "Our people are looking to our exploits in Iberia with considerable interest, and we have seen numerous Punic settlers in the area. Maybe it is time to focus more actively on settling the lands?"
 carthaginian_iberia_expansion_mission_task_12_DESC:1 "With the numerous novel tribes of Iberia under our rule, we have seen an interest in Iberian culture spread in Carthage. It would be a gesture of goodwill to incorporate one of their deities into our pantheon, particularly since people are already growing used to the foreign culture."
 carthaginian_iberia_expansion_mission_task_13_DESC:0 "We have previously made our first steps into Baetica, with our small settlements in the area. It is time to advance and secure these lands so our settlers can live safely and expand our activity and presence in the region."
 carthaginian_iberia_expansion_mission_task_14_DESC:0 "The original Tartessos might have fallen, but given time and resources we can re-establish their ancient rule over the Lacus Ligustinus and Baetis."
 carthaginian_iberia_expansion_mission_task_final_1_DESC:1 "Carthage once left the control of Tyre to locate its own destiny. In a similar vein, we will leave a novel Carthage in Iberia to locate its destiny amongst hostile tribes and foreign lands."
 carthaginian_iberia_expansion_mission_task_final_2_DESC:1 "The rich lands of Iberia will be forced under our control, via any means necessary. With its rich mines and fertile plains, it will be essential in forging the future of our people."
 carthaginian_magna_graecia_expansion_mission_DESCRIPTION:0 "Magna Graecia is at the crossroads between the Italic north and the Greek east, and those in charge of it will be able to trade with both sides in their numerous conflicts."
 carthaginian_magna_graecia_expansion_mission_BUTTON_TOOLTIP:0 "We have for an extended time traded, interacted and fought the people of Magna Graecia. Expanding our interest in the area properly would prove beneficial for our expanding nation."
 carthaginian_magna_graecia_expansion_mission_task_1_DESC:2 "$croton_area$ was once settled by the Greeks from the east, but has lately seen a large incursion of Italics coming down from the north. Known for its valuable wine, fertile plains and numerous port urban centres, it could be a valuable endeavour to conquer the region."
 carthaginian_magna_graecia_expansion_mission_task_2_DESC:0 "Divided between the Greek ports and the Italic hinterlands, Lucania is a complicated region to govern. Though difficult it might be, pacifying the area is essential if we desire to make headway deeper into the Italian peninsula."
 carthaginian_magna_graecia_expansion_mission_task_3_DESC:0 "Tarentum and Metapontum are ancient urban centres along the southern coastline of Italy. Famous for their cavalry and art, they would provide quite the boon if we managed to bring them into the fold."
 carthaginian_magna_graecia_expansion_mission_task_4_DESC:2 "The rich ports of Magna Graecia have often been beyond our area of control, with the Greeks holding a monopoly across large parts of the northern Mediterranean. By obtaining control of some of those harbours, either via military or diplomatic means, we can gain access to the greater commercial network of the urban centres in the area."
 carthaginian_magna_graecia_expansion_mission_task_5:0 "Local Punic Centre"
 carthaginian_magna_graecia_expansion_mission_task_7_DESC:1 "We have an extended tradition of trading throughout the Mediterranean, bringing valuable goods from one aspect to the other. Be it the silver of Iberia, the copper in Cyprus or the grain of Egypt, we have invariably been an important actor between the different nations."
 carthaginian_magna_graecia_expansion_mission_task_8_DESC:1 "The cavalry of Tarentum is famous throughout the Mediterranean for their advanced skirmishing tactics, and their mercenaries have often been seen bolstering the Hellenistic armies of the east with their proficiency. Bringing some of these reputable horses and soldiers home to [SCOPE.sCountry('mission_country').GetName] would surely bring sought-after expertise to our armies."
 carthaginian_magna_graecia_expansion_mission_task_final_2_DESC:0 "We have had numerous treaties and agreements with the Greeks, be it in Magna Graecia, Gaul or Greece proper. As we have gained access to the lands of Magna Graecia, it is time to rewrite some of those ancient treaties to reflect modern realities."
 carthaginian_phoenicia_expansion_mission_DESCRIPTION:0 "For an extended time have the people of Phoenicia been forced into subjugation by one overlord or another. As descendants of Tyre, it is only correct that we return and dispatch them our aid."
 carthaginian_phoenicia_expansion_mission_BUTTON_TOOLTIP:0 "Our Phoenician brethren have been oppressed and mistreated for too long, it is time for us to assist them."
 carthaginian_phoenicia_expansion_mission_task_1_DESC:0 "We have traded with Cyprus for as long as we can recollect, and similarly we have had several colonies on the island. Obtaining control of the rich island once more would be beneficial if we desire to extend our influence eastwards in the direction of Assyria and Anatolia."
 carthaginian_phoenicia_expansion_mission_task_2_DESC:0 "Cyprus has for an extended time been known for its profound rich copper mines, and obtaining control of these mines is one method to fund our military campaigns in the eastern Mediterranean."
 carthaginian_phoenicia_expansion_mission_task_3_DESC:1 "Selling the large quantities of copper in Cyprus is sure to be enriching and popular amongst our neighbours."
 carthaginian_phoenicia_expansion_mission_task_5_DESC:0 "Freeing Tyre is only the first step in our campaign to re-establish Phoenician greatness, as there are still Phoenicians being oppressed in another location."
 carthaginian_phoenicia_expansion_mission_task_6_DESC:0 "Since time immemorial the magnificent Phoenician urban centres have been independent of one another, disseminated throughout the Phoenician coastline from Tyre in the south to Arados in the north."
 carthaginian_phoenicia_expansion_mission_task_7_DESC:1 "It is said that the early Phoenicians used these magnificent cedar trees to construct vessels and travel throughout the Mediterranean to trade with distant nations. Anyone with access to materials like these will be able to construct vessels of unparalleled quality."
 carthaginian_phoenicia_expansion_mission_task_7_optional_DESC:1 "The Phoenicians are some of the greatest shipbuilders the world has ever seen, constructing gigantic vessels for numerous of their overlords."
 carthaginian_phoenicia_expansion_mission_task_final_DESC:1 "The people of Phoenicia have been controlled by one warlord or another since as far back as we can recollect, and it is time that someone of Phoenician descent ensures that they are properly protected instead."
 carthaginian_phoenicia_expansion_mission_task_final_2_DESC:0 "The people of Phoenicia have invariably been independently minded, by focusing their efforts on trade and commerce throughout the Mediterranean. It is only correct that they will rule themselves, for once."
 carthaginian_africa_expansion_mission_DESCRIPTION:0 "As our trade empire expands, with more and more colonies and ports abroad, our ambitions in Africa have withered. We must secure our footing at home, protect our backs from uprisings and raids by unruly tribes, prior to turning our gaze across the sea once again."
 carthaginian_africa_expansion_mission_BUTTON_TOOLTIP:0 "Our back must be secured prior to turning our gaze outwards once more."
 carthaginian_africa_expansion_libyphoenician_settlement_DESC:2 "The lands of the Musulamian tribes borders us to the south-west. Although they nominally pay homage to us, the tribal Musulamii have come into conflict with our Punic settlers in the borderlands. It is time to introduce Punic civilisation to these barbaric tribes."
 carthaginian_africa_expansion_integrating_phoenicians_DESC:0 "The Phoenician urban centres of Utica and Kerkouane, our sister-cities, have for an extended time been staunch allies of Carthage. However, there have been recent rumblings that they may not be as loyal as they seem. Perhaps it would be best if they were no longer in control of their own fate."
 carthaginian_africa_expansion_ending_massaesylia_DESC:0 "The Massaesylian tribes to the west have been raiding our Punic settlements between Rusaddir and Qartan. They need to be brought to heel, and to feel the indignation of our displeasure."
 carthaginian_africa_expansion_securing_coastline_DESC:0 "While we previously control the northern coastline of Africa and Numidia, we must extend our seize to control the coastline of Mauretania as well, to ensure our domination of the western Mediterranean."
 carthaginian_africa_expansion_unruly_subject_DESC:0 "The Massylians, though ostensibly under our rule, are fickle subjects. We can never be assured if they will fight for their liege or defect to the enemy. Time will tell where Massylian allegiance truly lies."
 carthaginian_africa_expansion_massylian_hinterland_DESC:0 "With the Massylians put in their place, we require securing control over the Massylian hinterlands to the south. An influx of Punic settlers ought to provide us with the tools we require to cement our influence in the area."
 carthaginian_africa_expansion_eastern_coast_DESC:1 "The Phoenician urban centres to the south, on the coast of Bissytis, have for an extended time been close allies of ours. In order to fortify our hold on the area, it might be time to bring them even closer into the bossom of [SCOPE.GetRootScope.GetCountry.GetName]."
 carthaginian_africa_expansion_emporium_tripoli_DESC:0 "Our southern neighbours, Emporia and Tripolitania, are currently under our protection. In order to extend our seize southward and eastward, maybe we require taking direct control over their wealthy trading ports."
 carthaginian_africa_expansion_libyan_empire_DESC:1 "The coast of Africa is under our control, and the tribes of Numidia and Mauretania have submitted to the yoke of [SCOPE.GetRootScope.GetCountry.GetName], from the Pillars of Melqart to the deserts of Libya. Our homeland is now secure, the lands across the sea are ripe of the taking, and the glorious City of Dido will shine with a light of a thousand colours."
 carthage_africa_libyan_empire.tt:0 "Completing this task will provide a choice between two permanent boni."
 carthaginian_africa_expansion_libyphoenician_settlement_tt:0 "The tribes of the Musulamii will either submit and become a #Y Client State#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#!, or start a conflict of independence with #Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 carthage_mission_iberian_investments_DESCRIPTION:1 "Our conquest of Iberia has considerably expanded our influence in the area. However, most of our acquisitions are underdeveloped and poor. In order to take full advantage of the considerable wealth Iberia has to offer, we must invest in the area and its infrastructure."
 carthage_mission_iberian_investments_BUTTON_TOOLTIP:0 "Currently our holdings in Iberia are too poor to provide the wealth we had once hoped. With additional investments in the area, we will ensure that the silver will circulate freely back home to [ROOT.GetCountry.GetCapital.GetName]."
 carthage_mission_iberian_investments_ports_iberia_DESC:0 "With such an abundance of unprocessed materials being produced in Iberia, founding and establishing a trade network will secure the Barca family's influence on Iberian, and perhaps even Carthaginian, politics."
 carthage_mission_iberian_investments_iberian_riches_DESC:1 "Having obtained control of the supply, and arranging the export themselves, the Barcas have acquired a monopoly on the Iberian metal trade. Their gold exports are particularly lucrative. They have, naturally, offered to dispatch some back to Carthage herself."
 carthage_mission_iberian_investments_governing_iberia_DESC:0 "The Barcas have requested that they be given the governorship of Qart-Hadasht. They inform us that they have considerable ambitions for our Iberian colonies."
 carthage_mission_iberian_investments_loyal_iberia_DESC:0 "Prior to proceeding with their considerable ambitions, the Barcas must ensure the loyalty of the local population. Tanit unwilling, they will hopefully never succeed."
 carthage_mission_iberian_investments_iberian_civilization_DESC:0 "New Carthage, the Jewel of Iberia, is founded in a natural harbour and surrounded by mountain ranges and fertile plains. Its advantageous position has led to expansion and wealth to rival Carthage herself."
 carthage_mission_iberian_investments_old_carthage_DESC:0 "The riches of Carthage's colonies should benefit Carthage, first and foremost. The riches of Iberia will undoubtedly bring Carthage's prestige to novel heights."
 carthage_mission_iberian_investments_new_carthage_DESC:0 "The founders of Carthage once left the safety of Tyre to locate their own destiny. In a similar vein, we will leave a novel Carthage in the hands of the Barca family to locate its destiny among the hostile tribes and foreign lands."
 carthaginian_rome_expansion_mission_DESCRIPTION:0 "The Romans have for an extended time been on the rise, conquering their neighbours mercilessly. If we let them continue their insatiable expansion, it is only a matter of time before they come to the North African coast as well."
 carthaginian_rome_expansion_mission_BUTTON_TOOLTIP:1 "The Romans must be put down prior to becoming a menace to our nation."
 carthaginian_rome_expansion_mission_task_1_DESC:1 "For an extended time has the western Mediterranean been ours to dominate, and now the Romans think they have a right to start expanding into our territories. They need to be reminded why we had explored the whole Mediterranean before Rome even existed."
 carthaginian_rome_expansion_mission_task_2_DESC:0 "By obtaining control of their ports, the Romans will be unable to construct their vessels, so we can continue our naval domination and enforce our rule throughout the Mediterranean islands."
 carthaginian_rome_expansion_mission_task_3_DESC:0 "By researching and comprehending the tools of our opponents, we will be able to oppose them effectively and negate their effects. They took one of our ships to learn how to construct sea-worthy vessels, we will take one of theirs to make sure all of their new-found shipbuilding technology is for naught."
 carthaginian_rome_expansion_mission_task_4_DESC:0 "The war-like people of Gaul have raided all their way down to Rome before. Given the correct arguments, they are probably prepared to take up arms yet again."
 carthaginian_rome_expansion_mission_task_5_DESC:0 "The Greeks of Magna Graecia for an extended time opposed the Roman expansion, though they failed at every turn. They are sure to be willing to rise up against the arrogant Latins once more, with the correct incentives."
 carthaginian_rome_expansion_mission_task_6_DESC:0 "One outrageous requirement after another. It is time to put an end to the ridiculously haughty and arrogant people of Rome."
 carthaginian_rome_expansion_mission_task_7_DESC:0 "By obtaining control of the ancient tribal territories of the north, we will make sure to convince the locals to unite with us in the conflict against Rome."
 carthaginian_rome_expansion_mission_task_8_DESC:0 "By obtaining control of the ancient Greek territories of Magna Graecia, we will make sure to convince the locals to unite with us in the conflict against Rome."
 carthaginian_rome_expansion_mission_task_9_DESC:0 "Though the Romans are unimpressive in and of themselves, they are efficient thieves of the works of others. Their once pathetic villages have become powerful and impressive urban centres that even we would do good to learn from."
 carthaginian_rome_expansion_mission_task_10_DESC:0 "It is time to turn the well-known stubborn men and women of Rome into effective slaves in our fields, where they pertain."
 carthaginian_rome_expansion_mission_task_11_DESC:0 "Some claimed the grand city of Rome would remain the test of time, a sight to behold for millennia to come. They were incorrect."
 carthaginian_rome_expansion_mission_task_12_DESC:0 "The harbour at Ostia was the main port of the Roman Republic for an extended time, importing wares from throughout the known world for their ever more avaricious civilisation."
 carthaginian_rome_expansion_mission_task_13_DESC:1 "A conflict between [SCOPE.sCountry('mission_country').GetName] and Rome has for an extended time been inevitable, as the two powers have ascended far beyond any other in the region. The two powers will finally have to decide who will maintain the hegemony over the western Mediterranean."
 carthaginian_rome_expansion_mission_task_13_tt:1 "The Senate will be more probable to approve a declaration of conflict against Rome"
 carthaginian_rome_expansion_mission_task_final_2_DESC:1 "The people of Rome are not important enough to be provided special treatment. They are just another province in the burgeoning trade empire of [SCOPE.sCountry('mission_country').GetName], and will be treated that way."
 carthaginian_rome_expansion_mission_task_final_3_DESC:1 "As a long-standing rival of [SCOPE.sCountry('mission_country').GetName], Rome proved a powerful opponent. If we could turn this to our benefit, and make them one of our subjects, maybe we will be able to utilise their strengths in our own conflict in the future as well."
 carthaginian_mission_naval_dominance_DESCRIPTION:1 "From ancient times the Phoenician and Punic people have excelled at travelling, trading and settling throughout the sea. However, if we are to retain our dominance at sea, we will have to reinvent our naval methods."
 carthaginian_mission_naval_dominance_task_1_DESC:0 "The Carthaginian harbour has invariably been one of the greatest in the Punic world but as our Empire has developed, along with the city itself, a necessity has been born for a restructured and re-imagined harbour. We must spare no expense and expand the capabilities of our capital as a naval base and shipbuilding centre."
 carthaginian_mission_naval_dominance_task_2_DESC:0 "To be the most advanced naval power of our region, we require investing time and energy into our technology. Only by experimenting and testing out novel ideas will we be able to know what works and what does not."
 carthaginian_mission_naval_dominance_task_3_DESC:0 "The cedars of Phoenicia will be essential if we desire to construct the best vessels this aspect of the world. As the descendants of the region, we previously have relations with the people living there."
 carthaginian_mission_naval_dominance_task_4_DESC:0 "It is time for us to dominate the numerous ports of Africa, as they play an important role in the trade of the region. No longer will the untamed tribes of Numidia and Mauretania be in charge of important locations along the coastline."
 carthaginian_mission_naval_dominance_task_6_DESC:0 "By enacting specific policies, we can make a decision on how our ports will be utilised."
 carthaginian_mission_naval_dominance_task_7_DESC:0 "To be the power in charge of the Mediterranean, we require an unrivaled navy, one that can crush all opposition. It is time to start assembling the materials and shipwrights to reinforce our vessel capacity."
 carthaginian_mission_naval_dominance_task_8_DESC:0 "With a port in Gaul, we will finally be able to access the considerable markets that is hidden deep in the untamed hinterlands of the north. The trade in this area has been exclusively Greek for far too long."
 carthage_mission_trade_investments_DESCRIPTION:0 "From ancient times the Phoenician and Punic people have excelled at travelling, trading and settling throughout the sea. If we are to maintain our hold over the pan-Mediterranean trade, we must buttress our trade with control over more ports and redouble our trading efforts abroad."
 carthage_mission_trade_altar_philaeni_DESC:0 "Dispatch an envoy to meet with representatives from our eastern neighbours, there is the matter of a frontier dispute that needs to be cleared up."
 carthage_mission_trade_cyrene_relations_DESC:0 "It is considered fine statesmanship to dispatch gifts to potential friends and trade partners. It is advisable to improve our relations with the Greeks to the East."
 carthage_mission_trade_another_periplus_DESC:0 "It has been centuries since last we dispatched explorers to make contact with faraway peoples. The time has come to organise another expedition, but who would we dispatch? A suitable candidate must be discovered."
 carthage_mission_trade_into_unknown_DESC:0 "A volunteer has been discovered, and the expedition is ready to set sail. Astarte favours the bold, and we shall be boldest of all."
 carthage_mission_trade_partners_old_DESC:0 "We have over time lost touch with our ancient trading partner, Egypt. It is a rich and fertile land, with numerous resources of interest to our merchants, not to mention they control the naval route to the Red Sea and beyond. We must repair our neglected relationship so that trade between the nations can prosper once more."
 carthage_mission_trade_gateway_indus_DESC:0 "Alexander the Great's conquest eastward brought more and more lands into the Mediterranean sphere of influence, opening up novel markets and sources of goods. The Indus Valley far to the East, we hear, is extremely wealthy. The overland trade routes, however, go through the territory of the Empire of Seleukos, and we must first gain their permission to dispatch trade overland."
 carthage_mission_opinion_fallback_DESC:0 "Alexander the Great's conquest eastward brought more and more lands into the Mediterranean sphere of influence, opening up novel markets and sources of goods. The Indus Valley far to the East, we hear, is extremely wealthy. Access to those markets, however, are controlled by foreign powers, powers that need to be placated prior to our merchants reaching the Indus Valley."
 carthage_mission_trade_from_east_DESC:0 "Novel access routes to the Indus secured, it is time to dispatch merchants to establish trade relations. One resource we have heard of, which we are particularly interested in, are their elephants. We have heard that they are larger and more sturdy than ours. Bringing back some of these beasts, and settling them in the hinterlands of Carthage should be our first priority."
 carthage_mission_trade_ancient_nemesis_DESC:0 "Our extended-time nemeses, the Greek city-states, while individually weak, are robust together, and still hold a robust position in the pan-Mediterranean markets. In order to cement our position as the Masters of Mediterranean commerce, we must establish a trade-post in the Greek heartlands, and out-compete the local Greek merchants."
 carthage_mission_trade_metropolis_west_DESC:0 "Carthage, the radiant city of a thousand colours, the greatest city in Africa, the Metropolis of Commerce, now has the largest Cothon in the Mediterranean. The amount of goods which daily pass through the merchant port is staggering. The resources brought back from all over the known world make Carthage the wealthiest city in the western Mediterranean."
 carthage_mission_central_sardinia_DESC:0 "We have had numerous conflicts with the local Nuragic tribes of Sardinia, bringing uncertainty and problems to the region. It is time to put an end to their rebellious tendencies and secure the island for [SCOPE.GetRootScope.GetCountry.GetName]."
 carthage_mission_sardinian_mines_DESC:0 "With the mines of Sardinia expanded, we will be able to extract more of the rich minerals hidden profound in the ground throughout the island."
 carthage_mission_securing_the_island_DESC:1 "Though we have finally obtained control of the island, we have still seen that issues with the locals occasionally occur. Reinforcing some of the old Nuraghe of Sardinia to be used as fortified positions for our troops should put an end to these revolts once and for all."
 carthaginian_mission_bomilcars_revolution_DESCRIPTION:1 "After our disastrous conflict against Agathocles in Sicily, the traitorous Suffete Bomilcar tried to sell our lands to obtain tyrannical power for himself. Numerous were led astray by his ideas and plans, and even though they were pardoned there are still conflicts and disagreements lingering throughout our nation."
 carthaginian_mission_bomilcars_revolution_task_2_DESC:0 "If we are to reinstate the political system of Carthage to its glory days, we require sufficient seats in the Senate to make sure our policies can be forced through."
 carthaginian_mission_bomilcars_revolution_task_3_DESC:1 "The revolution once stood robust in Carthage, about to overthrow the entire nation. Though they were pardoned for their crimes, a lot of the revolutionaries both play an important role in, and oppose certain parts of, the Carthaginian system."
 carthaginian_mission_bomilcars_revolution_task_4_DESC:0 "The system does not require changing, it simply needs to be strengthened to a point where tyrants cannot obtain sufficient power to obtain control of the state on their own."
 carthaginian_mission_bomilcars_revolution_task_5_DESC:1 "Our merchants have for an extended time played an important part in the hierarchy of Carthage, bringing wealth to our urban centres and improving relations with potential subjects throughout the Mediterranean. Though the revolution fought for the tyrant Bomilcar, many were promised that the lower classes would be given more power in the rule of their urban centres. A plutocratic rule would undoubtedly be well received in both of these camps, as well as among some of our senators."
 carthaginian_mission_bomilcars_revolution_task_6_DESC:0 "The numerous judges of the Council of the 104 have previously planned and set up all the necessary labour to be able to change our political system to one where they are in charge. Together with our Suffete, they will be able to overthrow the rest of the bureacracy and obtain complete control of the government."
 carthaginian_mission_bomilcars_revolution_task_7_DESC:0 "The landed nobility, numerous of them working in our political systems already, will appreciate moving to a system where they are given even more power."
 carthaginian_mission_bomilcars_revolution_task_8_DESC:0 "Our history with the local mercenary companies is an extended one, where we have often turned to their assistance to secure our goals. Particularly in the numerous drawn out conflicts in Sicily, they played an essential part in protecting our interests.\n\nAs we are previously close friends with some of the mercenary warlords, we should be able to convince them to settle down in Carthage. With our patronage, the companies will flourish and we will secure their loyalty at a cheaper price in the coming conflicts."
 carthaginian_mission_bomilcars_revolution_task_final_DESC:0 "Finally we can rid ourselves of the shackles of the past, the lingering consequences of Bomilcar's revolution, and examine the future."
 gain_a_size_20_navy_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] obtains a size #Y 20#! Navy in [SCOPE.sP('syracuse_province').GetName]."
