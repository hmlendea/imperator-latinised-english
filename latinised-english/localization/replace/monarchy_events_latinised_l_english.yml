l_english:
 monarchy_events.2.t:0 "The Vessel of State"
 monarchy_events.2.desc:1 "The renowned philosopher [SCOPE.sCharacter('philosopher_king_educator').GetName] believes that the world will never be free of its evils until the kings and princes of this world have the spirit and power of philosophy. The vessel of state must be captained only by men of sagacity, benevolence, and authority.\n\n[SCOPE.sCharacter('philosopher_king_educator').GetName] has identified [ROOT.GetCountry.GetRuler.GetName] as one with the potential to learn the true virtues of a ruler under [SCOPE.sCharacter('philosopher_king_educator').GetHerHis] diligent tutelage."
 monarchy_events.2.a:0 "Permit [SCOPE.sCharacter('philosopher_king_educator').GetHerHim] to teach [ROOT.GetCountry.GetRuler.GetName]."
 monarchy_events.2.b:0 "Dispatch this raving lunatic on [SCOPE.sCharacter('philosopher_king_educator').GetHerHis] way."
 monarchy_events.3.desc.c:0 "[ROOT.GetCountry.GetRuler.GetName] has become an exemplary student of philosophy under the learned tutelage of [SCOPE.sCharacter('philosopher_king_educator').GetName].\n\nOver the course of the year [ROOT.GetCountry.GetRuler.GetName] has learned much about political discourse. A monarch is unable to rule unless the people are pacified, and it is surely better to achieve this through clever oration than through the sheer menace of violence.\n\n[SCOPE.sCharacter('philosopher_king_educator').GetName] is so pleased with [ROOT.GetCountry.GetRuler.GetName]'s progress that [SCOPE.sCharacter('philosopher_king_educator').GetSheHe] has agreed to remain permanently in [ROOT.GetCountry.GetName] to provide philosophical guidance. [ROOT.GetCountry.GetRuler.GetName] is well on [ROOT.GetCountry.GetRuler.GetHerHis] way to becoming a philosopher king."
 monarchy_events.4.desc:0 "While [ROOT.GetCountry.GetRuler.GetName] has learned some minor lessons from [ROOT.GetCountry.GetRuler.GetHerHis] year of philosophical tutelage under [SCOPE.sCharacter('philosopher_king_educator').GetName], it is clear that [ROOT.GetCountry.GetRuler.GetSheHe] is not the stuff of philosopher kings.\n\n[SCOPE.sCharacter('philosopher_king_educator').GetName] is not entirely dissuaded however, and would agree to remain in [ROOT.GetCountry.GetName] in exchange for the patronage of his labour."
 monarchy_events.6.desc:0 "High Priest [SCOPE.sChar('turbulent_priest').GetName] has made it clear to the priesthood that [SCOPE.sCharacter('turbulent_priest').GetSheHe] can no longer tolerate [ROOT.GetCountry.GetRuler.GetName]'s godless impiety.\n\nWithout the support of the priesthood, the people will commence to believe that [ROOT.GetCountry.GetRuler.GetName] does not have the support of [ROOT.GetCountry.Custom('get_god_gods')], which would harm our legitimacy."
 monarchy_events.7.desc:0 "The legitimacy afforded by having the support of the priesthood is unable to be underestimated. The piety of [ROOT.GetCountry.GetRuler.GetName] has not gone unnoticed by the devout High Priest [SCOPE.sCharacter('pious_high_priest').GetName]. The High Priest sings the praises of the [ROOT.GetCountry.GetRulerTitle] not only to [ROOT.GetCountry.Custom('get_god_gods')] but also to the priesthood, who reassure the people that [ROOT.GetCountry.GetName] is administered by godly hands."
 monarchy_events.8.desc:1 "The philosopher [SCOPE.sCharacter('monarchist_philosopher').GetName], inspired by the wise and just rule of [ROOT.GetRuler.GetName], has begun to speak passionately about the virtues of despotic rule. What government, [SCOPE.sCharacter('monarchist_philosopher').GetSheHe] says, can possibly be better than that of the very best citizen in the whole state? The counsels of such a man are like himself, and so he governs the mass of the people to their heart's content.\n\nIn a democracy however, there shall invariably be malpractices, and these malpractices will lead to evils being done unto the people."
 monarchy_events.8.b:0 "[SCOPE.sCharacter('monarchist_philosopher').GetPraenomen]' labour should be known throughout [ROOT.GetCountry.GetName]."
 monarchy_events.9.desc:0 "Angered by [ROOT.GetCountry.GetName]'s arbitrary rule, the philosopher [SCOPE.sCharacter('republican_philosopher').GetName] has spoken out against the evils of despotism.\n\n[SCOPE.sCharacter('republican_philosopher').GetSheHe|U|] proclaims that kings are jealous of the most virtuous among their subjects and wish their demise while they take delight in the meanest and basest of things, being ever ready to listen to the tales of slanderers. Able to set aside the statutes of the territory when it suits them, despots are to be universally condemned."
 monarchy_events.9.a:0 "Let [SCOPE.sCharacter('republican_philosopher').GetHerHim] speak, [SCOPE.sCharacter('republican_philosopher').GetSheHe] is no menace to us."
 monarchy_events.10.desc:0 "Morale was inception to waver at the camp when [SCOPE.sCharacter('royal_spouse').GetName] stood up before the assembled soldiers and gave an inspirational speech. [SCOPE.sCharacter('royal_spouse').GetSheHe|U|] convinced all who were present that the odds of battle were on their side using [SCOPE.sCharacter('royal_spouse').GetHerHis] extensive knowledge of military tactics. When the soldiers marched the next day, they did so with the confidence that their victory was assured."
 monarchy_events.11.desc:0 "[SCOPE.sCharacter('spouse_scope').GetName] has grown resentful that [SCOPE.sCharacter('non_spouse_child_pretender').GetName], a child of [ROOT.GetCountry.GetRuler.GetName] but not by [SCOPE.sCharacter('spouse_scope').GetName], has been designated as heir to [ROOT.GetCountry.GetName] over any of [SCOPE.sCharacter('spouse_scope').GetHerHis] possess children.\n\nWe have discovered that [SCOPE.sCharacter('spouse_scope').GetSheHe] plots to kill [SCOPE.sCharacter('non_spouse_child_pretender').GetName] to advance the position of [SCOPE.sCharacter('spouse_scope').GetHerHis] possess beloved child, [SCOPE.sCharacter('spouse_child_pretender').GetName]."
 monarchy_events.20.b:0 "Dispatch a small gift instead."
 monarchy_events.24.desc:1 "Whatever [SCOPE.sCharacter('deified_father_scope').GetHerHis] transgressions in life, many have begun to look to [SCOPE.sCharacter('deified_father_scope').GetName], [SCOPE.sCharacter('deified_father_scope').GetMotherFather] of [ROOT.GetCountry.GetRuler.GetName], as a god. [SCOPE.sCharacter('deified_father_scope').GetHerHis|U] cult is minor but growing. Some believe that leaving offerings to [SCOPE.sCharacter('deified_father_scope').GetHerHim] can heal the sick or grant good fortune. Regardless, [ROOT.GetCountry.GetRuler.GetName] can surely exploit this situation to enhance [ROOT.GetCountry.GetRuler.GetHerHis] possess power."
 monarchy_events.26.desc:0 "[ROOT.GetCountry.GetName] rules over the province of [SCOPE.sP('wrong_religion_culture_province').GetName], a territory populated by the [SCOPE.sP('wrong_religion_culture_province').GetCulture.GetName] people who follow the [SCOPE.sP('wrong_religion_culture_province').GetReligion.GetName] faith.\n\nRuling over foreign territories is invariably challenging, and gaining the favour of local elites is key to cementing our overlordship. But if these elites could be supplanted and replaced by [ROOT.GetCountry.GetReligion.GetName] [ROOT.GetCountry.GetRuler.GetCulture.GetName] men loyal to the [ROOT.GetCountry.GetRulerTitle], it would surely facilitate the integration of [SCOPE.sP('wrong_religion_culture_province').GetName] into our domain."
 monarchy_events.26.b:0 "Win the favour of local elites."
 monarchy_events.27.desc:0 "Our heir, [SCOPE.sCharacter('primary_heir').GetName], is well known for [SCOPE.sCharacter('primary_heir').GetHerHis] lack of loyalty to the nation. It recently peaked with [SCOPE.sCharacter('primary_heir').GetHerHim] insulting [ROOT.GetCountry.GetRuler.GetName]. If this keeps going for much longer, we are assuredly going to end up with a fight between [SCOPE.sCharacter('primary_heir').GetName] and our ruler, [ROOT.GetCountry.GetRuler.GetName].\n\nWe should find a solution to this issue, one way or another, before it comes to a confrontation between our ruler and our heir. Bloody or otherwise."
 monarchy_events.27.b:0 "Maybe it is time to place [SCOPE.sCharacter('primary_heir').GetHerHim] in [SCOPE.sCharacter('primary_heir').GetHerHis] place. "
 monarchy_events.27.c:0 "It will labour itself out, in time."
 monarchy_events.28.desc:0 "We have decided to attempt and sway [SCOPE.sCharacter('primary_heir').GetName] to our cause, to make [SCOPE.sCharacter('primary_heir').GetHerHim] more loyal to [ROOT.GetCountry.GetName]. We could either have our ruler shower some of [ROOT.GetCountry.GetRuler.GetHerHis] prominence on our heir, to make [SCOPE.sCharacter('primary_heir').GetHerHim] more popular at court. Alternatively we could make sure [SCOPE.sCharacter('primary_heir').GetName] gets a sizeable gift. "
 monarchy_events.28.a.tt:0 "We will attempt to sway [SCOPE.sCharacter('primary_heir').GetName] to our cause with gold."
 monarchy_events.28.b.tt:0 "We will attempt to sway [SCOPE.sCharacter('primary_heir').GetName] to our cause by extending some of our popularity to [SCOPE.sCharacter('primary_heir').GetHerHim]."
 monarchy_events.30.desc:0 "As planned, we spent a lot of our nation's gold on securing [SCOPE.sCharacter('primary_heir').GetName] loyalty to the state. And yet somehow, [SCOPE.sCharacter('primary_heir').GetSheHe] has not only squandered our gift, but it seems [SCOPE.sCharacter('primary_heir').GetName] blames us for [SCOPE.sCharacter('primary_heir').GetHerHis] losses. Though one would consider giving [SCOPE.sCharacter('primary_heir').GetHerHim] a gift of gold would be sufficient, it seems it was not.\n\nMaybe this has proven to us once and for all that [SCOPE.sCharacter('primary_heir').GetName] is not a fitting heir to [ROOT.GetCountry.GetName]. If one is so careless with the gold of the nation, how could one possibly rule the nation itself? "
 monarchy_events.31.desc:0 "We have made an effort into making [SCOPE.sCharacter('primary_heir').GetName] more popular at court in [ROOT.GetCountry.GetName], spending some political favours in the progress. It seems our heir has seen the effort we place into helping [SCOPE.sCharacter('primary_heir').GetHerHim], and [SCOPE.sCharacter('primary_heir').GetSheHe] has started to come around.\n\nWith our heir's popularity secured, we can only hope [SCOPE.sCharacter('primary_heir').GetHerHis] loyalty will follow. We need to maintain an eye on [SCOPE.sCharacter('primary_heir').GetHerHim] to make sure [SCOPE.sCharacter('primary_heir').GetSheHe] does not fall back to ancient attitudes. "
 monarchy_events.32.desc:0 "We have made an effort into trying to make [SCOPE.sCharacter('primary_heir').GetName] more popular at court in [ROOT.GetCountry.GetName], but no matter what we do [SCOPE.sCharacter('primary_heir').GetSheHe] manage to place [SCOPE.sCharacter('primary_heir').GetHerselfHimself] at shame. At first we thought [SCOPE.sCharacter('primary_heir').GetSheHe] tried to foil our plans, but it is becoming clear [SCOPE.sCharacter('primary_heir').GetSheHe] is just really incompetent.\n\nIf it was ever any doubt, it is not only loyalty [SCOPE.sCharacter('primary_heir').GetName] is deficient, but also the skills necessary to rule."
 monarchy_events.33.desc:0 "It is time to make sure [SCOPE.sCharacter('primary_heir').GetName] stops [SCOPE.sCharacter('primary_heir').GetHerHis] pathetic attempts at insulting the throne. Some of our advisors have suggested to find a novel heir to the throne, whereas others imply it is enough to simply ruin [SCOPE.sCharacter('primary_heir').GetHerHis] reputation at court.\n\nBoth would be extensive efforts, and could prove dangerous if we are not successful and careful. We should make sure we know which option we want to go for, as it could prove fatal to our heir."
 monarchy_events.33.a:0 "We will place [SCOPE.sCharacter('primary_heir').GetHerHim] to shame. "
 monarchy_events.33.a.tt:0 "We will attempt to undermine [SCOPE.sCharacter('primary_heir').GetName] fame at court."
 monarchy_events.33.b:0 "It is time to find a novel heir to groom. "
 monarchy_events.34.t:0 "Place to Shame"
 monarchy_events.34.desc:1 "A surprising amount of rumours have started to spread about [SCOPE.sCharacter('primary_heir').GetName] these last weeks, only some of them started by us. It seems others have used this opportunity to insult and mock [SCOPE.sCharacter('primary_heir').GetHerHim] as well.\n\nHopefully this will teach [SCOPE.sCharacter('primary_heir').GetHerHim] how precarious [SCOPE.sCharacter('primary_heir').GetHerHis] position as the heir is, and will treat it with the gratitude and respect that is expected of [SCOPE.sCharacter('primary_heir').GetHerHim]. "
 monarchy_events.35.desc:0 "No matter how much time and energy we have spent trying to mock [SCOPE.sCharacter('primary_heir').GetName], it has somehow been turned around on [ROOT.GetCountry.GetRuler.GetName] instead. It has gotten worse by the day, and [ROOT.GetCountry.GetRuler.GetName] can barely leave [ROOT.GetCountry.GetRuler.GetHerHis] home at this point.\n\nIt seems our heir is sufficient at dodging our attempts at shaming [SCOPE.sCharacter('primary_heir').GetHerHim], unless [SCOPE.sCharacter('primary_heir').GetSheHe] has some arrange of benefactor protecting [SCOPE.sCharacter('primary_heir').GetHerHim]. "
 monarchy_events.38.desc:0 "For a long time [ROOT.GetCountry.GetRuler.GetName] has had to deal with [ROOT.GetCountry.GetRuler.GetHerHis] spouse and [SCOPE.sCharacter('ruler_spouse').GetHerHis] overbearing attitude, particularly now that [ROOT.GetCountry.GetRuler.GetSheHe] has no proper heir to follow [ROOT.GetCountry.GetRuler.GetHerHis] rule. The latest of these are [SCOPE.sCharacter('ruler_spouse').GetHerHis] attempts at having [ROOT.GetCountry.GetRuler.GetName] pass a statute that allows daughters to be heirs to the nation.\n\nIt would surely secure the succession of [ROOT.GetCountry.GetRuler.GetName], but it could prove to be somewhat of an unpopular decision. "
 monarchy_events.39.desc:0 "A messenger has been sent by [SCOPE.sCharacter('character_marshal').GetName] from [SCOPE.sP('random_port_province').GetName]. A fleet of pirates has attacked the port, and it does not look like they are going to let up any time soon. [SCOPE.sCharacter('character_marshal').GetSheHe|U|] is asking for aid immediately, to place an end to this.\n\nSome of our other advisors at court has suggested making a more permanent change to our statutes, to make sure this problem will not resurface in a couple of years. "
 monarchy_events.39.a:0 "The system requirements to be changed to fix this."
 monarchy_events.40.desc:0 "Lately [SCOPE.sCharacter('character_master_guard').GetName] has proven to be an unreliable aid at court, time and time again. Having the Master of the Guards [SCOPE.sCharacter('character_master_guard').GetHerselfHimself] disloyal to the throne could prove fatal for our ruler, if we are not careful. It would not be the first time a ruler is brought down by their closest aides.\n\nWe could attempt to win the [SCOPE.sCharacter('character_master_guard').GetWomanMan] over with some gold, or maybe it is time to replace [SCOPE.sCharacter('character_master_guard').GetHerHim] with someone more loyal. "
 monarchy_events.41.desc:0 "We are informed that a group of citizens are preparing to move from [SCOPE.sP('randomized_country_province').GetName] to [SCOPE.sP('randomized_neighbor_province').GetName], one of the regions of our ally [SCOPE.sCountry('allied_neighbor').GetName]. It is said having a better understanding of our two cultures could bring us ever closer, but it would assuredly weaken us if all our people commence leaving [ROOT.GetCountry.GetName]."
 monarchy_events.42.desc:0 "A group of citizens from [SCOPE.sCountry('original_country').GetName] has appeared in [SCOPE.sP('randomized_neighbor_province').GetName], looking for novel homes. Apparently they have not only been permitted to leave [SCOPE.sCountry('original_country').GetName], but has been sent with the best wishes from their monarch [SCOPE.sCountry('original_country').GetRuler.GetName] to our ruler [ROOT.GetCountry.GetRuler.GetName].\n\nThis well meaning gesture should not go unnoticed, as they have clearly tried their best to bring our two nations closer."
 monarchy_events.44.desc:0 "The people of [SCOPE.sP('randomized_country_province').GetName] have raised a large statue of our esteemed ruler [ROOT.GetCountry.GetRuler.GetName]. Though the statue is deficient in certain important areas, it would not be taken well if we were to rip it down. If we leave the statue up, let us hope it does not get too well known, as it could be somewhat of an insult to the monarch."
 monarchy_events.44.a:0 "We are grateful for this honour to the nation."
 monarchy_events.45.desc:0 "As the ruler of the one true successor to the great empire of Alexander, [ROOT.GetCountry.GetRuler.GetName] steps up on a podium infront of our countrymen and court to deliver an inspiring speech. [ROOT.GetCountry.GetRuler.GetSheHe|U|] brings up the many empowering properties of the ancient conqueror, but [ROOT.GetCountry.GetRuler.GetSheHe] decides to bring up one topic in particular. "
 monarchy_events.45.b:0 "Many of the systems Alexander place into place."
