l_english:
 assassinate.1.desc:0 "Our advisors report that [SCOPE.sChar('foreign_agent').GetName], a trusted friend of our [ROOT.GetCountry.GetRulerTitle], has made contact with our agents in [SCOPE.sChar('target').GetEmployer.GetName]. The planned assassination of [SCOPE.sChar('target').GetName] is commencing to take form - however, [SCOPE.sChar('foreign_agent').GetPraenomen] has requested that we dispatch aid, that [SCOPE.sChar('foreign_agent').GetSheHe] might be better able to perform [SCOPE.sChar('foreign_agent').GetHerHis] covert duties."
 assassinate.1.a:0 "Anything. [SCOPE.sChar('target').GetPraenomen] must perish."
 assassinate.1.c:0 "Instruct [SCOPE.sChar('foreign_agent').GetHerHim] to use some initiative!"
 assassinate.2.desc:0 "Due to the convenient demise of [SCOPE.sChar('target').GetName], in circumstances not of our making, our attempted assassination is no longer required.\n\nWe have instructed our agents to return what resources they have not previously made use of, that we might regain some of our costs."
 assassinate.3.desc:0 "Our attempted assassination of [SCOPE.sChar('target').GetName], has come to a sudden halt. The agent that we entreated to assist us in this matter, has perished under dubious circumstances.\n\nFortunately, our contacts in [SCOPE.sChar('target').GetEmployer.GetName] have managed to regain some of the resources we committed to this scheme."
 assassinate.4.desc:0 "Seemingly, we were unwise to place our confidence in foreign friends. [SCOPE.sChar('foreign_agent').GetName], who our agents had contracted for use in our attempted assassination of [SCOPE.sChar('target').GetName], has been clapped in irons by the curs in [SCOPE.sChar('target').GetEmployer.GetName].\n\nFortunately, our involvement remains undetected, and our agents were able to regain some of the resources we had expended in this ill-fated endeavour."
 assassinate.5.t:0 "Murder is a Difficult Business"
 assassinate.5.desc:0 "Once more, our agents have received communication from our contact in [SCOPE.sChar('target').GetEmployer.GetName]. It would appear that [SCOPE.sChar('foreign_agent').GetSheHe] is having some trouble planning [SCOPE.sChar('foreign_agent').GetHerHis] escape, once [SCOPE.sChar('target').GetPraenomen] has been assassinated. [SCOPE.sChar('foreign_agent').GetSheHe|U] demands that we dispatch a scapegoat, in order that someone is able to take the fall without drawing suspicion.\n\nSuch a scapegoat would be unlikely to return from this assignment..."
 assassinate.6.desc:0 "Clearly beset by future concerns, our agent in [SCOPE.sChar('target').GetEmployer.GetName] has contacted us once more, requesting a promise of asylum once the action is accomplished.\n\nOur advisors are divided as to whether this would be a wise move."
 assassinate.6.b:0 "Undoubtedly not."
 assassinate.7.desc:0 "Our agent in [SCOPE.sChar('target').GetEmployer.GetName] has informed us that the attempted assassination targeting [SCOPE.sChar('target').GetName] will go ahead imminently. [SCOPE.sChar('foreign_agent').GetSheHe|U] only requests one additional instruction.\n\nIn what manner should we attempt to do away with [SCOPE.sChar('target').GetPraenomen]?"
 assassinate.7.b:0 "A rapid stabbing ought to suffice."
 assassinate.7.i:0 "Anything, as long as it's rapid."
 assassination_result_first_paragraph_failed:0 "We have received grave news from our agents in [SCOPE.sChar('target').GetEmployer.GetName]. The blundering fool we dispatched to slay [SCOPE.sChar('target').GetName], has failed entirely - [SCOPE.sChar('target').GetPraenomen] yet lives!"
 assassination_result_first_paragraph_succeeded:0 "Our agents in [SCOPE.sChar('target').GetEmployer.GetName] report that the court of [SCOPE.sChar('target').GetEmployer.GetName] is in turmoil! It appears that our brave assassin, [SCOPE.sChar('foreign_agent').GetName], has succeeded in [SCOPE.sChar('foreign_agent').GetHerHis] assignment to rid the world of [SCOPE.sChar('target').GetName]."
 assassination_result_second_paragraph_scapegoat_killed:0 "The poor [SCOPE.sChar('scapegoat').GetWomanMan] we dispatched to take the fall for the assassination, one [SCOPE.sChar('scapegoat').GetName], performed [SCOPE.sChar('scapegoat').GetHerHis] role most admirably; having been fallen upon in a frenzy, mere moments after the action was accomplished. An unwilling accomplice mayhap, but an effective one."
 assassination_result_second_paragraph_scapegoat_survived:0 "The poor [SCOPE.sChar('scapegoat').GetWomanMan] we dispatched to take the fall for the action, has apparently survived. Naturally, we have severed all connections with [SCOPE.sChar('scapegoat').GetHerHim] - [SCOPE.sChar('scapegoat').GetSheHe] shall have to make [SCOPE.sChar('scapegoat').GetHerHis] own way in life now."
 assassination_result_second_paragraph_generic:1 "We are informed that many were present at the scene of the attempted action."
 assassination_result_third_paragraph_asylum_promised_agent:0 "Our agent somehow managed to flee the scene, and at this very moment travels towards our frontiers, hoping to take advantage of our offer of asylum. It is not too late to change our minds, naturally..."
 assassination_result_third_paragraph_default:0 "Our agent appears to have decided to face [SCOPE.sChar('foreign_agent').GetHerHis] fate in [SCOPE.sChar('foreign_agent').GetEmployer.GetName] - whether [SCOPE.sChar('foreign_agent').GetSheHe] survives is entirely down to [SCOPE.sChar('foreign_agent').GetHerHis] own considerable competence."
 assassination_result_fourth_paragraph_discovered:0 "Lastly, and perhaps most unfortunately, it seems that sufficient evidence was discarded at the scene to link our proud nation to the assassination of [SCOPE.sChar('target').GetPraenomen]; we are sure to draw the ire of the [SCOPE.sChar('target').GetEmployer.GetAdjective] people."
 assassinate.8.a:0 "Provide [SCOPE.sChar('foreign_agent').GetPraenomen] a hero's welcome!"
 assassinate.8.b:0 "Excellent! But, concerning that matter of asylum..."
 assassination_culprit_discovered:0 "In the furious melee surrounding [SCOPE.sChar('target').GetHerHis] demise, a culprit was apprehended. After gruelling torture, [SCOPE.sChar('culprit').GetSheHe] identified [SCOPE.sChar('culprit').GetHerselfHimself] as [SCOPE.sChar('culprit').GetName], a [SCOPE.sChar('culprit').GetWomanMan] of minor notoriety, clearly acting on someone's behalf."
 assassination_culprit_undiscovered:0 "Despite desperate searching, questioning, and intimidation, the perpetrator of this vile action could not be located."
 discovered_ruler_para:0 "Despite the paranoia gripping our nation, evidence discovered at the scene, and our dire political situation point to [SCOPE.sChar('discovered_ruler').GetName] of [SCOPE.sChar('discovered_ruler').GetEmployer.GetName] as being the puppet master behind this action. We must surely punish them for this vile action."
 undiscovered_ruler_para:0 "No evidence could be found linking any one state to this terrible action - we are unable to identify who was behind it."
 assassinate.10.desc:0 "In a terrifying turn of events, an assassination attempt was made upon our dear [ROOT.GetCountry.GetRulerTitle], this very day. The gods themselves must have been smiling upon us, as [SCOPE.sChar('target').GetSheHe] managed to escape unharmed - and members of the [ROOT.GetCountry.Custom('get_court_type')] are calling for retribution.\n\n[SCOPE.Custom('enemy_discovered_10_para')]"
 enemy_discovered_10_para:0 "Via diligent interrogation, and shrewd tactics, we have identified [SCOPE.sChar('discovered_ruler').GetName], of [SCOPE.sChar('discovered_ruler').GetEmployer.GetName], as the author of this vile action. Our people remain ready to act."
 enemy_undiscovered_10_para:0 "Despite our best efforts, we could not identify the author of this vile action, and must let it go unpunished. Thankfully, our people have rallied about our [ROOT.GetCountry.GetRulerTitle], showing their best aspect in the face of adversity."
 assassinate.1.d:0 "How exciting! Notify everybody!"
