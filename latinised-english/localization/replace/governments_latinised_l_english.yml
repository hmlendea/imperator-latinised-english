l_english:
 GOV_HAS_CO_RULER:0 "- Possesses Co-Ruler"
 aristocratic_republic_desc:0 "Whilst outwardly democratic, an Aristocratic Republic limits leadership to those who enjoy elevated status."
 democratic_republic_desc:0 "This system of government gives all eligible citizens a voice, via the election of representatives to a senate, or council."
 athenian_republic_desc:0 "The Athenian republic is known far and wide for its integrity and vigour."
 theocratic_monarchy_desc:0 "A king is unable to possess true power unless supported by the priesthood, and invested with the power of the Divine."
 tribal_kingdom_desc:2 "Tribal leaders are elected for life, by a council of the clan leaders. This is a society that has come to establish itself permanently in its region, embracing a sedentary lifestyle."
 tribal_chiefdom_desc:0 "Elected by a council of tribesmen, a tribal chief rules for life, and is entrusted with the safety and security of his or her tribe. The most important authority vested in the Chief is the decision of when to establish and when to migrate to another, more favourable location."
 tribal_federation_desc:1 "Representing the sagacity of a considerable number of united clans, the council of a Federated Tribe resembles the beginnings of a democratic state."
 plutocratic_republic_desc:0 "Primarily concerned with the acquisition of wealth, Plutocratic Republics can be found ruling numerous of the coastal City States throughout the world."
 imperium_desc:0 "An Emperor employs absolute power over the state, and usually possesses sovereignty over lesser kings and nobles."
 plutocratic_monarchy_desc:0 "Largely focused on the acquisition of wealth, a plutocratic monarchy represents such nations as desire to refrain from sustained conflict."
 tyrannical_monarchy_desc:0 "Established via usurpation and constructed on violence and fear, leaders of Tyrannical Monarchys lack legitimacy and rely on foreign soldiers to cow their citizens."
 title_great_work_construction_leader_desc:0 "Leading the construction of a Magnificent Wonder"
