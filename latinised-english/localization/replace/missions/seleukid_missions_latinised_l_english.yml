l_english:
 seleukid_mission_01_babylonia_task_1_DESC:0 "Foremost in Babylon are the priests of Marduk, a robust caste of religious leaders that decides the day to day business of the city. Many a king has lost control over Babylonia after offending their order."
 seleukid_mission_01_babylonia_task_2_DESC:0 "When we win the priesthood over to our side, we can commence taking steps in binding their faith to the dynasty of [ROOT.GetCountry.GetRuler.GetPraenomen], and to our continued rule of Babylonia."
 seleukid_mission_01_babylonia_task_4_DESC:0 "As our rule has brought peace and prosperity to all of Babylonia, we have ensured the continued support of the nobles and citizens of its ancient urban centres."
 seleukid_mission_01_babylonia_task_5_DESC:0 "By the shores of the Euphrates lies Babylon, and by the shores of the Tigris we raised the great city of Seleukeia. Together they labour as barriers and fortification versus any who would attempt to pass via the lands of Babylonia."
 seleukid_mission_01_babylonia_task_7_DESC:0 "After Seleukos reconquered Babylonia and took back his satrapy, Antigonos sent armies to plunder and ruin what he had lost. Though much of Babylon have been restored under our revered rule, there are still steps to be taken to restore it to the glory of ancient."
 seleukid_mission_01_babylonia_task_9_DESC:0 "With the assistance of our [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)] we will sow the seeds of loyalty across the Babylonian satrapy, to ensure the continued support from one of the richest regions in the empire of the Persians and Alexander both."
 seleukid_mission_01_babylonia_task_final_DESC:0 "Though Babylonia was once taken by the troops of one-eyed Antigonos, it stayed loyal to Seleukos throughout the entire endeavour. Now the satrapy has been bound tightly to the [ROOT.GetCountry.GetRuler.GetFamily.GetName] dynasty, and we can depend on it for taxes and levies both."
 seleukid_mission_02_syria_DESCRIPTION:0 "Most of the Successor states have been by the Mediterranean, all connected one way or another, whereas we have been arrange of cut off as we were settled around Babylonia in the east. We have been looking to Syria as a possible novel port towards the west, a place frequently underrated by many of our rivals."
 seleukid_mission_02_syria_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have taken control of Syria, and constructed it up as a novel important region under our rule."
 seleukid_mission_02_syria_BUTTON_TOOLTIP:0 "We are looking to Syria as a novel possible port towards the west."
 seleukid_mission_02_syria_task_9:0 "Via the Syrian Gates"
 seleukid_mission_02_syria_task_1_DESC:0 "We need to prepare our troops for a campaign towards [GetProvince('(int32)789').GetArea.GetRegion.GetName], as we know just how dangerous the trek towards that area can be if we commence unprepared."
 seleukid_mission_02_syria_task_2_DESC:0 "Greek settlements and villages, and the ancient Antigonid capital, lie on the western shores. One of our first goals should be to take control of the lower parts of the Orontes river."
 seleukid_mission_02_syria_task_3_DESC:0 "On the eastern side of [GetProvince('(int32)789').GetArea.GetRegion.GetName] lie ancient Aramaic urban centres and villages, as well as the occasional novel Greek outpost. This is one of the regions that frequently stood as a barrier between us and the richer Antigonid regions, and is important if we want to construct a safe route from Babylonia to the shores of the Mediterranean."
 seleukid_mission_02_syria_task_4_DESC:0 "As we raise novel urban centres and settle people across [GetProvince('(int32)789').GetArea.GetRegion.GetName], we will ensure control of the adjacent rural areas as well. We will construct a network of urban centres via which we can administrate the entire region."
 seleukid_mission_02_syria_task_5_DESC:0 "We are looking to construct a novel royal city, akin to [GetProvince('(int32)911').GetName] in Babylonia, from which we can have our royal administration for the western parts of our nation."
 seleukid_mission_02_syria_task_6_DESC:0 "We are looking to expand upon [GetProvince('(int32)789').GetName], so it can rival the most important urban centres around the Mediterranean in scope and population. It will be a shining example of [ROOT.GetCountry.GetAdjective] might and affluence."
 seleukid_mission_02_syria_task_7_DESC:0 "Another goal of ours is to properly secure the region with a network of fortified urban centres and settlements, to make sure that any would be invader is going to struggle to discover safe passage."
 seleukid_mission_02_syria_task_8_DESC:0 "To truly construct up [GetProvince('(int32)789').GetArea.GetRegion.GetName] the way we would like to do, we are going to need to look for novel settlers that can populate its urban centres and settlements. We have long wanted more Greeks that we can levy into our armies, and with a Mediterranean port in our hands, it makes sense we can finally do that."
 seleukid_mission_02_syria_task_9_DESC:0 "To the west lies [GetProvince('(int32)1880').GetArea.GetRegion.GetName], another difficult region with a lot of potential, and in many ways similar to [GetProvince('(int32)789').GetArea.GetRegion.GetName]. Though we mostly focus our efforts around [GetProvince('(int32)789').GetArea.GetRegion.GetName] at the moment, we should consider looking into what we can do to obtain some influence in the region."
 seleukid_mission_02_syria_task_10_DESC:0 "[GetProvince('(int32)1880').GetName] is one of the places we are looking into, for a potential refounded city in honour of our ruling dynasty. It has a lot of potential to be an important city that can rule the eastern stretches of [GetProvince('(int32)1880').GetArea.GetRegion.GetName]."
 seleukid_mission_02_syria_task_11_DESC:0 "We have heard tales of an ancient oracle that lives in the area around [GetProvince('(int32)1881').GetName], though long since fallen to poverty and problems. If we were to restore the temples and sacred sites in the area, maybe we could convince the oracle to do our bidding?"
 seleukid_mission_02_syria_task_4_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! have at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_4_total')|0]#! urban centres in #Y [GetProvince('(int32)790').GetArea.GetName]#! and #Y [GetProvince('(int32)810').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_4_loc')]"
 seleukid_mission_02_syria_task_8_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will appeal to [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetCultureGroup.GetName] Pops in #Y [GetProvince('(int32)416').GetArea.GetRegion.GetName]#!, #Y [GetProvince('(int32)379').GetArea.GetRegion.GetName]#! and #Y [GetProvince('(int32)290').GetArea.GetRegion.GetName]#! to migrate to [SCOPE.GetRootScope.GetCountry.GetAdjective] urban centres in #Y [GetProvince('(int32)789').GetArea.GetName]#! and #Y [GetProvince('(int32)810').GetArea.GetName]#!."
 seleukid_mission_03_anatolia_DESCRIPTION:0 "Though we are the heirs of the Satrapy of Babylonia, we know that we will never be able to pick up Alexander's legacy if we are not the rulers of Macedon itself. To get there, we will need to secure the long Persian Royal Road first, all the way to Sardeis at the far conclusion of Anatolia."
 seleukid_mission_03_anatolia_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have taken complete control of the Persian Royal Road, and have constructed up an administration and defences around it in Anatolia."
 seleukid_mission_03_anatolia_task_8:0 "The Two Ancient Urban centres"
 seleukid_mission_03_anatolia_task_12:0 "At the Conclusion of the Persian Road"
 seleukid_mission_03_anatolia_task_1_DESC:0 "As we are looking at potential paths westwards, we are in particular looking at the region around the city of [GetProvince('(int32)1936').GetName], which used to be the ancient capital of [GetProvince('(int32)1936').GetArea.GetRegion.GetName]."
 seleukid_mission_03_anatolia_task_2_DESC:0 "We are looking at rebuilding the city of [GetProvince('(int32)1936').GetName] so it can serve as the capital for our governors in the area, and construct a bridge between the ancient satrapy of [GetProvince('(int32)1936').GetArea.GetRegion.GetName] and our current rulership."
 seleukid_mission_03_anatolia_task_3_DESC:0 "We have an interest in the minor city of [GetProvince('(int32)1928').GetName], with its local shrine and importance to the adjacent area."
 seleukid_mission_03_anatolia_task_4_DESC:0 "Structure up infrastructure around our newfound administration in [GetProvince('(int32)1936').GetArea.GetRegion.GetName] is going to be important, if we desire it to continue to be an important part of [ROOT.GetCountry.GetName]."
 seleukid_mission_03_anatolia_task_5_DESC:0 "Continuing our labour on [GetProvince('(int32)1936').GetName] could inspire the local populace to become more friendly and loyal to our rule, akin to all the labour [GetCharacter('(int32)37').GetPraenomen] once did as the Satrap of [GetProvince('(int32)1936').GetArea.GetRegion.GetName]."
 seleukid_mission_03_anatolia_task_6_DESC:0 "Just north of [GetProvince('(int32)1883').GetArea.GetRegion.GetName] lies [GetProvince('(int32)1799').GetArea.GetRegion.GetName] and the eastern stretches of [GetProvince('(int32)1936').GetArea.GetRegion.GetName], regions frequently left to their struggles as they are not quite as valuable as many of their neighbours."
 seleukid_mission_03_anatolia_task_7_DESC:0 "We have located a minor outpost that we believe can be refounded into a city of importance in [GetProvince('(int32)177').GetName], [GetProvince('(int32)177').GetArea.GetName], just north of the ancient city of [GetProvince('(int32)1934').GetName]."
 seleukid_mission_03_anatolia_task_8_DESC:0 "Our advisors believe that if we were to invest a lot of resources into the two ancient urban centres of [GetProvince('(int32)1934').GetName] in [GetProvince('(int32)1934').GetArea.GetName] and [GetProvince('(int32)1951').GetName] in [GetProvince('(int32)1951').GetArea.GetName], the rest of the region would follow suit."
 seleukid_mission_03_anatolia_task_9_DESC:0 "Though frequently less popular than it's western neighbours, the region is in robust need of a capable administration with the infrastructure needed to take care of everything. If we were to hand them that, it would be sure to pay off in the future."
 seleukid_mission_03_anatolia_task_10_DESC:0 "The lands of [GetProvince('(int32)1799').GetArea.GetRegion.GetName] have frequently been hard to securely control as an outsider, which is why most of our predecessors have set up fairly independent-minded satrapies to control the area."
 seleukid_mission_03_anatolia_task_11_DESC:0 "At the far western stretches of the royal road are the Greek shores and the lands of [GetProvince('(int32)292').GetArea.GetRegion.GetName], a region that has frequently seen rebellions and revolts versus their many distant rulers."
 seleukid_mission_03_anatolia_task_12_DESC:0 "One of the urban centres that has frequently played an important part in ruling these lands is [GetProvince('(int32)292').GetName] in [GetProvince('(int32)292').GetArea.GetName], an ancient city that has been inhabited by central Anatolians and Greeks both."
 seleukid_mission_03_anatolia_task_13_DESC:0 "If we are to secure this area, and make sure not to fall to the same issues as many of our predecessors, we would do well in setting up a network of urban centres and fortresses for our newfound administration in the region."
 seleukid_mission_03_anatolia_task_16_DESC:0 "Most of the grand Seleukeias that have been raised in the name of our founder, [GetCharacter('(int32)24').GetPraenomen], have played an important role in our nation. We hope to construct another one of these great urban centres in far western Anatolia."
 seleukid_mission_03_anatolia_task_final_DESC:0 "If we are to succeed in our dreams of taking control of the western parts of the ancient empire of [GetCharacter('(int32)39').GetPraenomen], we will have to secure the royal road all the way from [GetProvince('(int32)4799').GetName] to [GetProvince('(int32)292').GetName]."
 seleukid_mission_03_anatolia_task_4_cities_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_4_cities_total')|0]#! urban centres in #Y [GetProvince('(int32)1931').GetArea.GetName]#!, #Y [GetProvince('(int32)1942').GetArea.GetName]#!, and #Y [GetProvince('(int32)1928').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_4_cities_trigger_loc')]"
 seleukid_mission_03_anatolia_task_9_cities_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_9_cities_total')|0]#! urban centres in #Y [GetProvince('(int32)1920').GetArea.GetName]#!, #Y [GetProvince('(int32)1971').GetArea.GetName]#!, and #Y [GetProvince('(int32)1978').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_9_cities_trigger_loc')]"
 seleukid_mission_03_anatolia_task_13_cities_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_13_cities_total')|0]#! urban centres in #Y [GetProvince('(int32)1952').GetArea.GetName]#! and #Y [GetProvince('(int32)292').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_13_cities_trigger_loc')]"
 seleukid_mission_04_palestine_DESCRIPTION:0 "Controlling [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName] is essential if you want to be in charge of the crossroads of the ancient empire of [GetCharacter('(int32)39').GetPraenomen], as it brings people from Egypt to Anatolia, or from Anatolia to Babylonia.\n\nTaking control of those regions will enable us to commence taking control of the rest of the remnants of the ancient empire."
 seleukid_mission_04_palestine_BUTTON_TOOLTIP:0 "At the heart of the ancient empire lies [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName], two regions waiting for us to rule them."
 seleukid_mission_04_palestine_task_10:0 "The Southern Neighbours"
 seleukid_mission_04_palestine_task_1_DESC:0 "We should secure all of [GetProvince('(int32)789').GetArea.GetRegion.GetName] prior to we commence campaigning in [GetProvince('(int32)687').GetArea.GetRegion.GetName], to safely ensure a route southwards for our soldiers."
 seleukid_mission_04_palestine_task_2_DESC:0 "The many passes, hills, and mountains between [GetProvince('(int32)789').GetArea.GetRegion.GetName] and [GetProvince('(int32)687').GetArea.GetRegion.GetName] are treacherous areas to travel via, if they are not properly protected. Setting up some defensive measures will let us use those very same properties versus our enemies, should they arrive in the region, as well as protect our own people as they pass via."
 seleukid_mission_04_palestine_task_3_DESC:0 "The shipwrights of Phoenicia are well known far beyond the borders of their urban centres and provinces, as they are some of the best shipbuilders all around the Mediterranean. We are only the last in a long line of kings seeking their assistance in structure a navy in which we can control our local shores."
 seleukid_mission_04_palestine_task_4_DESC:0 "With [GetProvince('(int32)789').GetArea.GetRegion.GetName] almost entirely under our control, we are now looking to our southern borders for a novel campaign."
 seleukid_mission_04_palestine_task_5_DESC:0 "We are looking to expand our borders all the way down to the deserts of Egypt, and to incorporate the roads and Phoenician urban centres along the shores."
 seleukid_mission_04_palestine_task_10_DESC:0 "If we are to ever secure our hold on [GetProvince('(int32)687').GetArea.GetRegion.GetName], we need to come to grips with our southern Nabatean neighbours, one way or another."
