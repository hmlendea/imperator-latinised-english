l_english:
 anthology_which_does_not_exist_yet_tt:0 "Assemble the $treasure_anthology$ using the #Y $philosophike_anthologia$#! decision and place it in the Sacred Site of [GetDeityDefinition('omen_alexander').GetName]."
 panoply_which_does_not_exist_yet_tt:0 "Assemble the $treasure_alexander_panoply$ using the #Y $panoply_of_alexander_the_great$#! decision and place it in the Sacred Site of [GetDeityDefinition('omen_alexander').GetName]."
 own_or_control_treasure_in_alex_shrine:0 "Treasure is in the sacred site of [alexander_deity_scope.GetName], which is owned by [SCOPE.GetRootScope.GetCountry.GetName]."
 diadochi_empire_DESCRIPTION:0 "A devastating civil war has threatened to destroy the empire forged by [alexander_scope.GetPraenomen] and his generals. As we assert our control over an increasing amount of this fallen empire we must ask ourselves what type of Empire it is that we want to construct.\nIf our legacy is to be longer lasting than that of Alexander we must strive to realise the Hellenistic vision he had, structure an imperial culture that encompasses all the elites of the empire."
 diadochi_empire_CRITERIA_DESCRIPTION:0 "This mission will be considered complete after we have stabilised and united the Hellenistic World which was once ruled by [alexander_scope.GetName]."
 diadochi_empire_BUTTON_TOOLTIP:0 "A devastating civil war has threatened to destroy the empire forged by [alexander_scope.GetPraenomen] and his generals. As we assert our control over an increasing amount of this fallen empire we must ask ourselves what type of Empire it is that we want to construct.\nIf our legacy is to be longer lasting than that of Alexander we must strive to realise the Hellenistic vision he had, structure an imperial culture that encompasses all the elites of the empire."
 diadochi_hellenistic_empire_DESC:0 "Ambitious men have sundered what Alexander once united. In order to not risk losing our own grasp over an increasing amount of the lands Alexander ruled, we must create an imperial administration greater than the man himself ever had time to construct."
 diadochi_to_the_strongest_DESC:0 "The dying wish of Alexander is said to have been that his empire should go to the strongest - a challenge we have proven ourselves worthy of.\nTo control the empire we must be willing to project our military might quickly and efficiently. Let us construct up a novel permanent army, named after the famous Silver Shields of Alexander, tasked with the safe-keeping of our empire's territorial integrity."
 diadochi_two_rivers_DESC:0 "In centuries past, the fertile lands of Mesopotamia have frequently been the core of rising empires. As part of our imperial project we must assert our authority over the entire region between and around the Euphrates and the Tigris."
 diadochi_macedonian_barons_DESC:0 "Traditionally any Macedonian king has to be authorised by the barons of Macedon. While such approval not being given is more or less unheard of, it is an important element in Macedonian kingship.\nWe must control Macedon and its hinterlands if we are to have any credibility as an heir to Alexander's Legacy."
 diadochi_regional_rule_tt:0 "Upon completion of this mission we will be able to select in what manner we want to rule this region."
 diadochi_to_the_indus_DESC:0 "Having defeated Porus at the Hydaspes, Alexander gained control of the plains of Pentapotamia, the territory of the five rivers, only turning back because his soldiers would not continue additional. These eastern satrapies have since been lost to unruly satraps and Indian strongmen, and it is time to bring them back into our empire."
 diadochi_of_gods_and_men_DESC:0 "Our empire encompasses many peoples and many faiths. To be the rightful suzerain of all our subjects we need to honour the gods that they venerate endow their temples."
 diadochi_pantheon_deity_other:0 "State Pantheon must contain at least #Y 2#! non-state religion Deities, with their Sacred Sites under our control. ([SCOPE.Custom('get_diadochi_pantheon_ongoing')]/[SCOPE.ScriptValue('diadochi_pantheon_target_svalue')|Y0])"
 diadochi_pantheon_deity_other_effect:0 "Completing this mission will improve our standing with those that venerate these deities."
 desc_royal_shrine_modifier:0 "This location is the site of a Sacred Shrine to one of the gods worshiped by our dynasty."
 desc_venerated_deity_modifier:0 "We have gained the favour of the people of this culture by endorsing the venerate of one of the gods they hold dear."
 diadochi_center_of_art_and_culture:0 "Centre of Art and Culture"
 diadochi_center_of_art_and_culture_DESC:0 "An empire that is to stand the test of time must be one not only of soldiers, but also of letters and culture. Let us bring all the knowledge of the world to the shrine complex of Alexander the Great and make this the pearl of the Hellenistic world. Anyone wishing to partake of the collective sagacity of mankind should pursue to study it at our leisure and be provided with all things needed for such a noble pursuit."
 diadochi_philosopher_kings_DESC:0 "The scholarly world has greatly benefited from our patronage, so much so that the learned men of [ROOT.GetCountry.GetCapital.GetName] have begun to be seen as a school of philosophy in their own right. We must do our utmost to support this novel philosophical project, attracting the bright minds of the world and ensuring that they lack for nothing."
 diadochi_granary_of_the_mediterrenean_DESC:0 "It is no wonder that many philosophers describe utopia as a state where you are free of the burden of labour and desire for nothing. Ensuring lasting access to grain for all the urban centres of the Greek mainland as well as [ROOT.GetCountry.GetCapital.GetName] and the various other parts of the Empire is essential to create a novel era of peace and prosperity. Reoccurring food riots, famine, and starvation currently stand in the way of social progress, urbanization, and commercialization. We must free our subjects from these threats so that we may enter a novel golden era of prosperity and abundance."
 diadochi_pax_hellenica_DESC:0 "Let us usher in a novel era of stability, an imperial peace where a line of wise and robust monarchs vouch for the peace. Bandits, brigands, and those who would abuse power will be kept at bay by an administration that protects all subjects regardless of culture or creed.\n\nSome may well take offence at this notion, let us sweep them aside and deny them any influence over the future that belongs to [ROOT.GetCountry.GetRuler.GetName], [ROOT.GetCountry.GetRuler.GetHerHis] line and our people."
 diadochi_ends_of_the_world_DESC:0 "When Alexander died in Babylon, his arms and armour were initially shown the greatest respect, taking the highest seat at the table as the plans were drawn up for the succession. In the general chaos that ensued, however, they were lost, spread by the winds of change across his crumbling empire.\nWe must assemble the panoply of Alexander once again, and return it to his grave where it shall be properly honoured."
 diadochi_apotheosis_DESC:0 "It is time for [ROOT.GetCountry.GetRuler.GetName] to take [ROOT.GetCountry.GetRuler.GetHerHis] place as a deity in [ROOT.GetCountry.GetRuler.GetHerHis] possess right. Subsequent in the footsteps of [alexander_scope.GetName] [ROOT.GetCountry.GetRuler.GetSheHe] would be both [ROOT.GetCountry.GetRuler.GetWomanMan] and god, worshiped along the with other deities of the [ROOT.GetCountry.GetAdjective] pantheon."
 me_diadochi_empire_events.1.desc:0 "In order to properly display our veneration for the gods of all peoples within our empire, we are now ready to make a sizeable donation. The only question that remains is which god we will favour.\nWhile a choice like this should be motivated by faith it will most certainly also impress the followers of the god we select to patronise."
 me_diadochi_empire_events.1.c:0 "We will attempt to obtain favour with both."
 me_diadochi_empire_events.1.d:0 "We will attempt to obtain favour with both."
 me_diadochi_empire_events.3.desc:0 "While our kingdom was never minor, it has grown vastly as we progress towards reuniting the splintered state that Alexander left behind. This process must be tempered by a bureaucracy capable both of growing dynamically as we expand, and with carrying out our plans and designs as we commence to look to creating a durable and long lasting empire, capable to remain standing where Alexander's broke apart.\nOur recent expansion of our royal bureaucracy has been aimed at structure exactly such a structure. Only time will inform if it has been constructed to last."
 me_diadochi_empire_events.4.desc:0 "A lasting military effort is something that requires a robust standing army. By pooling the expertise and funds of all our military forces, we have now begun to create a novel 'Silver Shield' force to police and expand the empire. It will take time for them to live up to their namesakes, but it is merely the first step towards structure the true Successor empire that the Hellenistic world craves."
 claims_on_empire:0 "We will obtain claims on any parts of Alexander's Empire we still do not control."
 me_diadochi_empire_events.5.desc:0 "According to tradition, the king of the Macedonians is authorised by the Macedonian barons.\nThis is hardly an election in the sense of the Greek Republics, there is only ever one candidate, but that does not mean it is a meaningless gesture. An assembly of the influential families of Macedon get to display their loyalty to their novel ruler, and the ruler can affirm intentions to uphold the traditions, commitments, and legacy of those that came prior to [ROOT.GetCountry.GetRuler.GetHerHim].\n\nWith the barons assembled it is now time to confirm the rule of [ROOT.GetCountry.GetRuler.GetName]. There is hope among the barons that this will mean that [ROOT.GetCountry.GetRuler.GetSheHe] will appoint an influential Macedonian noble, [candidate.GetName], as an autonomous local deputy, leaving [ROOT.GetCountry.GetRuler.GetPraenomen] to focus on the greater empire."
 desc_prioritized_larger_empire:0 "Our willingness to put the good of our empire prior to that of individual provinces has resulted in a greater flow of silver to the imperial coffers."
 me_diadochi_empire_events.6.desc:0 "Our efforts to turn [alex_city.GetName] into the primary centre of learning in the world has resulted in a grand library where the ambition is to store all the knowledge of humankind. Scribes have been sent out to all corners of the world to discover procure, or copy, the written word in almost any form it exists. The result is a grand collection of works, known colloquially as the Anthologia Philosophike, which any subject of the empire can request to study. The library now employs enough copyists, translators and illuminators to fill a minor city, who are tasked with the dissemination of this newly collected knowledge to all corners of the empire."
 desc_center_of_art_and_culture_modifier:0 "By actively seeking to acquire all written works in the world, copying, compiling and cataloging their contents we have been able to create an environment where novel ideas can easily supplement the thoughts of those that have come prior to us."
 me_diadochi_empire_events.7.desc:0 "There is much to ponder for philosophers located in a capital that purports to become the centre of a universal empire, things beyond the grasp of mere rulers and administrators. Via painstaking labour, [royal_philosopher.GetName] has identified a group of people that could have valuable input on things like these. [royal_philosopher.GetSheHe|U] argues that this opportunity, with access to the greatest library known to mankind, should be enough for anyone to accept an invitation to [ROOT.GetCountry.GetCapital.GetName]."
 me_diadochi_empire_events.71.b:0 "Decline moving to  [philosopher_king_country.GetCountry.GetCapital.GetName]"
 desc_imperial_unity_school:0 "We are encouraging the idea in government philosophy that an empire requirements to be uniform when it comes to the rights and obligations of subjects as well as rulers."
 desc_imperial_diversity_school:0 "We are encouraging the idea in government philosophy that an empire is another word for a collection of kingdoms that all strive for a prevalent goal, under the leadership of a first among equals."
 me_diadochi_empire_events.11.desc:0 "A select group was called but not all answered. Nonetheless the philosophical school of [ROOT.GetCountry.GetCapital.GetName] has grown to be an increasingly vibrant centre of thinking and argumentation. Audacious thoughts about the nature of man, of governance, and of what it means to be a subject or a ruler in a universal empire, are being discussed daily by the great minds of our time."
 desc_lycaeum_of_capital:0 "Our country is home to a renowned school of philosophers based out of our capital, a group that has easy access to the collective works in our great library as well as a healthy access to funds for any practical endeavours."
 me_diadochi_empire_events.12.desc:0 "Many are called to do the labour of [ROOT.GetCountry.GetRuler.GetName] but not all are equally gifted. It has been suggested by [royal_philosopher.GetName] that we must create a testing process, whereby we can assess applicants based on their grasp of languages, mathematics, writing, and other relevant skills. Only then can they be granted admission to the novel school we are creating for the imperial cadres.\n\n[hof_of_power.GetName] argues that such a rigid system is quite expensive and time consuming, the great families have a vested interest in the realm and if they could personally vouch for suitable applicants that would save time and would avoid the risk of barring those of the right lineages from access to the halls of power."
 me_diadochi_empire_events.12.b:0 "Ancestry can prove what a test is unable to."
 desc_imperial_examination_system:0 "We have begun to recruit bureaucrats for central training based on an imperial examination system. Merit must go prior to birth."
 school_of_x_outcome_depends_on_choices:0 "The outcome of this task depends on your choices while it is continuing."
 me_diadochi_empire_events.13.desc:0 "There are many subjects that are relevant for those that would take part in the day to day rule of a continent-spanning empire, and perhaps [ROOT.GetCountry.GetCapital.GetName], with its great libraries and vibrant philosophical circles, is one of the best places to learn them. Where there is a multitude of great minds there is also disagreement, however.\nOn the matter of the curriculum for the novel imperial school there is one group, followers of [philopher_1.GetName], who argue that the primary focus should be on financial matters, as well as mediation and arbitration - things that will make our administrators ready to act as the voice of the crown.\nAnother group has a more radical approach, asking that we let them teach a much wider variety of subjects, many of whom are not directly applicable as an officer of the crown at all. Their ideal is that these officers will leave the school as enlightened ideal subjects, setting an example for others to follow."
 desc_administrative_education:0 "All clerks in our empire that go through central training are taught exactly what it is we desire them to know in order to best perform the labour at hand."
 desc_classical_education:0 "All clerks in our empire that go through central training are taught an expansive variety of subjects, from rhetoric and mathematics to poetry, history, and the finer points of philosophy."
 me_diadochi_empire_events.14.desc:0 "While the school and philosophers of [ROOT.GetCountry.GetCapital.GetName] are devoted to exploring the ideal way for a universal empire to be ruled, there are at present a number of competing ideas as to what this training should be like.\n\nSome, inspired by the ideas of [finesse_thinker.GetPraenomen], claim that the foremost responsibility of a king is to be educated in the details of government and administration itself. Others, followers of [zeal_thinker.GetPraenomen], centre on the great need to understand philosophy and liturgy, to be able to grasp divinity and to honour the divines in all actions. A third group, disciples of [charisma_thinker.GetPraenomen], argue that it is in fact the grasp of the spoken word that is the primary attribute of a great ruler, and that only rhetoric will let them convince their subjects of what is good and proper.\n\nThe choice is left to us to decide which group should be permitted to shape the education of future royalty."
 me_diadochi_empire_events.14.a.tt:0 "All children of our dynasty will from now on obtain #Y 2#! more Finesse."
 me_diadochi_empire_events.14.b.tt:0 "All children of our dynasty will from now on obtain #Y 2#! more Zeal."
 me_diadochi_empire_events.14.c.tt:0 "All children of our dynasty will from now on obtain #Y 2#! more Charisma."
 diadochi_imperial_lineage_reward:0 "All children of our dynasty will from now on be educated to obtain #Y 2#! more Finesse, Zeal or Charisma."
 me_diadochi_empire_events.15.desc:0 "During the last decades, Mesopotamia has been the battleground of Empires. Torn apart by conflicts between Achaemenids, Assyrians, Macedonians, and Seleukids. The once great network of royal roads and great irrigation systems has been under constant menace by brigands and lack of maintenance. Earning the confidence of the people here will require seeing to their immediate quality of life.\n\nOur officers inform us there are local structures already in place that could most probable handle the restoration of Mesopotamian infrastructure quite well, if we put our power and influence behind them.\nThe arrival of [ROOT.GetCountry.GetRuler.GetName] and our armies is an opportunity to return the region to days past, though such a project is probable to put great strain on the Royal Coffers."
 desc_mesopotamian_integration:0 "Via direct rule and a policy of cultural cross-pollination we have rapidly increased the pace at which our society can come to integrate the peoples of Mesopotamia."
 desc_mesopotamian_capital:0 "This is the capital of Greek Mesopotamia, the central hub from which the entire region is ruled by the novel Graeco-Mesopotamian elite."
 me_diadochi_empire_events.15.b:0 "Only via our own direct influence can they flourish."
 me_diadochi_empire_events.16.desc:0 "With the Lower Nile and the Egyptian Regalia firmly in our hands, the time has come to name [ROOT.GetCountry.GetRuler.GetName] Pharaoh of the kingdoms of Egypt. The support of the High Priest of Ptah is a guarantee that we are seen as legitimate in the same manner as any Greek Pharaoh in the past.\n\nA request has been made that we give the Egyptian priesthood some measure of self rule, and that they in turn support us - an important piece in the design of the greater Hellenistic Empire that we pursue to create.\n\nOur empire is one of many cultures and peoples however, and our Greek subjects in particular have a tendency to view any privilege granted to others with distrust."
 desc_egyptian_autonomy:0 "With Egypt firmly in our hands we have secured an important stepping stone to be seen as Alexander's true successors, as well as a never conclusion source of grain."
 desc_egyptian_integration:0 "The direct imperial rule of Egypt has increased the velocity at which the Egyptian people is integrating with ours greatly."
 me_diadochi_empire_events.17.desc:0 "While it was not without its price, there are now few places in the world that can measure up to [ROOT.GetCountry.GetCapital.GetName]. With its monumental architecture it is truly the capital of a universal empire, not just the seat of a royal dynasty.\n\nThe growing imperial bureaucracy, and ever increasing ranks of nobility, have given the city an increasingly cosmopolitan character. One sign of this is the particular dialect of this city, known as [ROOT.GetCountry.GetAdjective] proper, which seems to be made up of an ever increasing number of words and phrases from the various languages of the empire. Having received their education and titles here, there will soon be administrators all over the empire that have this imperial language in prevalent."
 me_diadochi_empire_events.18.desc:0 "Years of conflict have left fields fallow and roads open to brigands and robber barons - from Mesopotamia to Egypt there are calls for a police force to protect [ROOT.GetCountry.GetAdjective] farmers and the roads that are used to bring their produce to the needy.\n\n[helper.GetName] has presented us with a plan to construct up such a force, separate from the army, tasked only with upholding the imperial peace, enabling free travel and protecting those who labour the territory.\n\n[ROOT.GetCountry.GetRuler.GetName] controls the greatest grain producing regions in the world: there is no reason our subjects should ever need to go hungry, if we can only protect those who develop and transport the food within the [ROOT.GetCountry.GetAdjective] Empire."
 me_diadochi_empire_events.19.desc:0 "After the many wars of the successors there are abandoned fields and farmsteads throughout our empire. If we desire these to be put back in use we must ensure that those with the right skills reclaim the territory.\n[rich_family.GetName] has suggested that we could hand out this territory to the great families of our country, in exchange for a promise that they will use their fortunes to quickly reclaim abandoned farmland, creating great and efficient slave latifundia throughout the empire.\n[influential_person.GetName] on the other hand argue that we should give the territory for free to the veterans of the great wars, so that these soldiers may have a future as minor scale farmers in the territory which they have fought for."
 me_diadochi_empire_events.19.a:0 "We need to confidence in men of quality."
 family_food_holdings_loyalty:0 "Territory Windfall"
 food_holdings_loyalty:0 "All members of the [THIS.GetCharacter.GetFamilyDisplayName] family will obtain #G 5#! Loyalty for #Y 10#! years."
 desc_soldier_farmers:0 "We have granted a great deal of unoccupied territory to former soldiers to secure their retirement and to ensure the territory is being looked after."
 me_diadochi_empire_events.20.desc:0 "The process of restoring agricultural productivity after years of conflict could be much improved if we let natural philosophers and scribes document and ponder how the labour could be improved. This is at least what [researcher.GetName] and a group of other thinkers argue. They now implore [ROOT.GetCountry.GetRuler.GetName] to consider letting them survey and analyse the farming methods and the farms themselves. Creating a set of clearly delineated lots and providing the needy farmers with the latest technological inventions and methods they can offer. Of course such an undertaking would not be cheap."
 food_tech_officer:0 "Agricultural Study Grant"
 me_diadochi_empire_events.20.b:0 "A farmer knows his own territory best."
 me_diadochi_empire_events.21.desc:0 "One of the considerable challenges that our empire faces in terms of providing food to our great urban centres is the task of transporting it from one place to another. Much of the time this involves loading considerable quantities onto ships that then travel down rivers, across oceans, or even along canals, to where it requirements to go.\n\nWe have received an offer from [shipowner.GetName] who says he is willing to ensure that there are invariably ships ready to take these missions, as long as we are willing to guarantee that [shipowner.GetHerHis] kin are paid regularly for this service."
 family_food_transport_loyalty:0 "All [shipowner.GetFamilyDisplayName] family members will obtain #G 10#! Loyalty for #Y 10#! years."
 me_diadochi_empire_events.21.b:0 "We is unable to make such an undertaking."
 me_diadochi_empire_events.22.desc:0 "It is clear that our efforts to ensure that food is easily accessible throughout the empire has borne fruit. In all great urban centres there is now a great central supply of grain, as well as a steady stream of well protected food caravans. There is also an increasing number of people who have become very rich from this business, investors who are now reaping the rewards of what our farmers have sowed.\n\nQuite a contrast to the poor in the streets of [ROOT.GetCountry.GetCapital.GetName]. Those who possess no territory, and have no special skills, but who might still have debts and inescapable commitments, they still now both hunger and know poverty."
 desc_grain_secured:0 "We have complete our utmost to make sure that grain will invariably reach our major population centres, something our population is very thankful for."
 me_diadochi_empire_events.23.desc:0 "Our efforts to create a steady food supply within the empire has not been entirely without success. The grand plans of abolishing hunger and shortages were perhaps a bit overly ambitious however. Whether it is because of our efforts, or just because of a more lasting internal peace, it is clear that both the production and availability of food is much greater than it once was.\n\nThis is of minor concern to the poor in the streets of [ROOT.GetCountry.GetCapital.GetName], their life is one of toil and hard labour. Few of our subjects know what a grain scarcity can mean as well as these men, women and children."
 desc_grain_dole_worse_diadochi:0 "The state puts aside a certain amount of all grain to feed the poor, helping them maintain hunger at bay."
 me_diadochi_empire_events.24.desc:0 "Decades of war have turned Persia from the greatest menace to Greek sovereignty to a frontier region where local power mongers have repeatedly declared themselves independent of rulers in faraway Mesopotamia, or Syria.\n\nAs this piece of Alexander's empire is now once again united and in our hands we must decide our approach towards the Persian people and their institutions. We could entrust the administration of these lands to the Persian nobles that ruled the territory under the Achaemenids who to some extent have retained their power to this day.\nThere are those, especially among the Greeks who would much prefer direct rule from [alexandria.GetName]."
 desc_persian_capital_modifier:0 "This city is the main administrative node in this part of the empire. This is where the staff of Governors are appointed, and where the treasury resides prior to it is sent off to the central parts of the Empire."
 me_diadochi_empire_events.25.desc:0 "As our armies breached the Indian continent and restored Hellenistic influence over the plains of Pentapotamia, they have once again been reminded of what an alien territory India is. It is astoundingly rich, densely populated, and home to animals and plants that few have seen prior to. There is also an abundance of elephants, to the extent that petty kings frequently field more of them than would the greatest of the Successor kings in the west.\n\nThis is also where the armies of Alexander once turned home, leaving the Indian peoples to reclaim these satrapies."
 desc_indian_self_rule:0 "As the easternmost satrapy India provides the west with a never conclusion stream of spices, fine cloth and many other rare goods that our subjects desire."
 desc_to_the_indus:0 "We have pressed on where Alexander turned back. Imperial policy is to maintain expanding the Hellenistic Empire into the heart of the subcontinent."
 me_diadochi_empire_events.25.a:0 "The Indians should rule their own territory."
 me_diadochi_empire_events.26.desc:0 "From east to west Alexander is remembered, for his military exploits and charisma, and for the imperial project he dared aim for. With his empire increasingly united again, the cult around him has grown rapidly in popularity. [alex_temple.GetName] has grown to become one of the primary pilgrimage sites in the world, with an annual stream of visitors from the entire Hellenistic sphere.\n\nThe priests of [alex_temple.GetName] are therefore very grateful that his arms and armour has now been returned to them, and have no doubt that it will additional reinforce the cult and the shrine."
 desc_alex_pilgrimage_major:0 "Ever since his panoply was assembled and brought here this city has been the centre of a major pilgrimage for those who venerate Alexander the great."
 holy_site_which_does_not_exist_yet_tt:0 "Completing this task will significantly improve the Sacred Site of Alexander the Great. Currently there is no such sacred site."
 me_diadochi_empire_events.27.desc:0 "There are not many that have known what it is to be a living god. The deification of [ROOT.GetCountry.GetRuler.GetName] by the priests of the [alex_temple.GetName] Temple, otherwise focused on the venerate of [deity:deity_alexander.GetDeityDefinition('omen_alexander').GetName] has afforded our monarch a respect that few can compete with. Wherever there is a temple to Alexander, or an offering made, there are now also hymns sung to the great ruler of the [ROOT.GetCountry.GetAdjective]s."
 me_diadochi_empire_events.28.t:0 "A tempest brewing"
 me_diadochi_empire_events.28.desc:0 "Our painstaking construction of a universal empire is finally starting  bear fruit. A cadre of administrators from all corners of the empire is trained in [ROOT.GetCountry.GetCapital.GetName] to carry out the will the [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] dynasty. In the urban centres of the empire buds an imperial culture, with the seeds of a prevalent language thriving, replacing ancient notions of tribal, religious, or cultural loyalties. Most important is the imperial peace; there are now few in our empire who have known conflict in their lifetime.\n\nIt is therefore shocking that in our midst a tempest has been brewing. Last week [resistance_leader.GetPraenomen] left the capital for [resistance_leader.GetHerHis] country estates, leaving no explanation as to why. Today an emissary arrived with an ultimatum, demanding the immediate abdication of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] in favour of [resistance_leader.GetHerselfHimself], and that we reinstate the traditional privileges of the local nobility around the empire. This letter is signed by a long list of governors in our realm..."
 me_diadochi_empire_events.29.desc:0 "From East to West Alexander's empire is now once again united. It is ruled by an imperial line that has restored peace and stability to a world that was once plagued by armed conflict and pestilence. From the great urban centres of [GetProvince('(int32)516').GetName] or [GetProvince('(int32)918').GetName], to the simple villages of [GetProvince('(int32)1936').GetArea.GetRegion.GetName] or [GetProvince('(int32)379').GetArea.GetRegion.GetName], the #Y Heirs of [alexander_scope.GetName]#! now live their daily lives, united by a prevalent imperial culture fusing east and west, Greek and Persian, Egyptian and Babylonian, and many other cultures that were once divided.\n\nIn the wake of the civil war a novel peace has been established, one where the novel cosmopolitan imperial identity has blossomed into a full culture. Increasingly it is the case that at least in the urban centres and among the well to do or educated, the primary identity is now one as a subject of our Hellenistic Empire."
 heirs_of_alexander_tt:0 "This is the dawn of a novel era."
 desc_heirs_of_alexander:0 "In the wake of the great civil war subsequent Alexander's demise a novel Hellenistic identity emerged among the ruling classes. This was additional cemented after the reestablishment of the empire. All subjects of the universal empire have the same rights and responsibilities, and with that comes a certain sense of a prevalent identity."
