l_english:
 me_seleukid_01_babylon.2.desc:0 "Together with a minor group of retainers [babylonian_priest_character.GetPraenomen] arrives late in the evening to our court in [ROOT.GetCountry.GetCapital.GetName]. [babylonian_priest_character.GetSheHe|U] quickly settles in, and not many hours later gets into a discussion with [ROOT.GetCountry.GetRuler.GetPraenomen] about religion. It seems [babylonian_priest_character.GetPraenomen] will bring a novel perspective at our court, as the two do not see quite eye to eye."
 me_seleukid_01_babylon.3.desc:0 "With [babylonian_priest_character.GetPraenomen] settled into [babylonian_priest_character.GetHerHis] novel position at court, [babylonian_priest_character.GetSheHe] has made sure to secure the loyalty of the rest of the priesthood. With the leaders of the city at our side, our influence over it has expanded significantly, all thanks to [babylonian_priest_character.GetPraenomen]."
 me_seleukid_01_babylon.5.desc:0 "Finally, the sculptor that worked for [babylonian_priest_character.GetPraenomen] has appeared at our court with the finished product. When it is at last revealed, a large crowd gathers around it, astonished by the beautiful creation. It is sure to become popular no matter where we decide to maintain it."
 me_seleukid_01_babylon.6.desc:0 "With the restoration of the great city of [GetProvince('(int32)918').GetName], and the completion of [GetProvince('(int32)911').GetName], we have two barriers that will hinder any enemy that might pursue to plunder or traverse the lands of Babylonia. With the two capitals of the region completed, we now need to look to restore the rest of the satrapy."
 me_seleukid_01_babylon.7.desc:0 "Ever more of the population of Babylonia is becoming accustomed to our administration and leadership, as we spread civic rights to the many villages and towns cluttered around the region. Though we are rulers of a disparate population of many languages and cultures, we are finding novel ways to oversee all our subjects."
 me_seleukid_01_babylon.8.desc:0 "The entire region around Babylonia has been suffering since [GetCharacter('(int32)37').GetPraenomen] invaded our satrapy, until our esteemed [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] decided to commence restoring the ancient urban centres one by one. They are finally starting to resemble the glory of ancient, and becoming important centres of tax and levies for our government."
 me_seleukid_01_babylon.9.desc:0 "We have completed our reorganization of the administration surrounding the two great urban centres of [GetProvince('(int32)918').GetName] and [GetProvince('(int32)911').GetName], spreading out to the rest of the region of the ancient satrapy. Though there are still issues that occasionally appear because of the many people and cultures under our rule, we are learning to deal with them more effectively."
 me_seleukid_01_babylon.10.desc:0 "After a discussion with out current [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)] about how we can increase our popularity among the general populace, we have decided to send [current_steward.GetHerHim] to the local provinces to see what [current_steward.GetSheHe] can do. [current_steward.GetSheHe|U] claims to have some ideas on what can be complete to inspire our rural subjects, and simply requirements some time and resources to accomplish the task at hand."
 me_seleukid_01_babylon.11.desc:0 "Half a year has passed since we sent [current_steward.GetPraenomen] to the Babylonia to inspire loyalty in our subjects, and good news has finally reached our court. It seems like the effort we put into the task has started paying off, as we are becoming more popular across the entire region."
 me_seleukid_01_babylon.12.desc:0 "Peace brings prosperity and loyalty, and within even the most distant and rural parts of Babylonia under our control we have seen a huge ascend in our popularity and affluence. The exchange flows from [GetProvince('(int32)963').GetName] in the far south, all the way to [GetProvince('(int32)883').GetName] and [GetProvince('(int32)829').GetName] in the north, subsequent the great Euphrates and Tigris rivers."
 me_seleukid_01_babylon.12.a:0 "Another job well complete."
 me_seleukid_01_babylon.13.desc:0 "No longer are the support of the Babylonian citizens and nobles in doubt, as we have brought peace and stability to the entire region, and ensured their affluence. Though they are not invariably comfortable with a ruler of foreign stock, they know that we have provided for them, and respect their traditions and culture."
 me_seleukid_01_babylon.15.desc:0 "Babylonia has been restored to its former glory, with the ruinous campaign of [GetCharacter('(int32)37').GetPraenomen] long forgotten. All across the satrapy people are closely linking our dynasty with that of their local faith, and our popularity have risen to novel heights.\n\nWith Babylonia unquestionably loyal to our cause, we are looking to novel areas of interest."
 me_seleukid_01_babylon.16.c:0 "Inform them to stop sending any of their priests to [ROOT.GetCountry.GetCapital.GetName]."
 me_seleukid_02_syria.1.t:0 "$seleukid_mission_02_syria_task_1$ - Planning a Conflict"
 me_seleukid_02_syria.1.desc:0 "At the inception of our nation, we were a minor satrapy focused around Babylonia, shut off from the Mediterranean and many of our rivals and allies. We have since learned the importance of a western port, and settlers from Greece itself.\n\nWe have set our eyes on the region around Syria, oft forgotten by greater powers who looks to the richer regions of Alexander's ancient empire."
 me_seleukid_02_syria.2.t:0 "$seleukid_mission_02_syria_task_1$ - The Conflict Campaign"
 me_seleukid_02_syria.2.desc:0 "Our troops are ready to commence the campaign for Syria, a region we have long wanted under our own control. The ancient Antigonid capital of [GetProvince('(int32)790').GetName] awaits us."
 me_seleukid_02_syria.3.desc:0 "We have conquered the region of Syria closest to the sea, and the ancient Antigonid capital now lies under our rule, as well as the other villages and urban centres along the Orontes all the way down to the sea."
 me_seleukid_02_syria.4.desc:0 "We have taken control of the parts of Syria that frontier the great river Euphrates, as well as the most eastern parts of the Orontes river. [GetProvince('(int32)810').GetArea.GetName] is known for the many minor villages and towns settled by Greek settlers these last decades, as well as the ancient Aramaic urban centres that lie in the region."
 me_seleukid_02_syria.5.desc:0 "With our newly founded urban centres, we have begun working on a novel administration that will take care of the region. Though we are more accustomed to the idiosyncrasies of Babylonia, we will need to discover a way to govern Syria that the people will be comfortable with."
 me_seleukid_02_syria.6.desc:0 "People are now flocking to our newly founded city of [GetProvince('(int32)789').GetName] from the site of the ancient Antigonid capital. Just as [GetProvince('(int32)911').GetName] has functioned as a royal [ROOT.GetCountry.GetAdjective] city for the administration in Babylonia, [GetProvince('(int32)789').GetName] will function as one in Syria."
 me_seleukid_02_syria.6.a:0 "This is the inception of a novel great city."
 me_seleukid_02_syria.7.desc:0 "We have finally completed our labour on [GetProvince('(int32)789').GetName] in [GetProvince('(int32)789').GetArea.GetName], and now have a proper port in the Mediterranean. With an influx of novel settlers, and as this part has taken so much of our time recently, a lot of people have started treating it almost like a new capital of [ROOT.GetCountry.GetName]."
 me_seleukid_02_syria.7.b:0 "Yet our capital will invariably be [ROOT.GetCountry.GetCapital.GetName]."
 me_seleukid_02_syria.8.desc:0 "We have sent out emissaries to appeal to Greek settlers in [GetProvince('(int32)416').GetArea.GetRegion.GetName], [GetProvince('(int32)379').GetArea.GetRegion.GetName], and [GetProvince('(int32)290').GetArea.GetRegion.GetName]. They have a long history of setting up colonies across the Mediterranean, and we hope this latest offer will entice a lot of them to come settle down in our urban centres in [GetProvince('(int32)789').GetArea.GetRegion.GetName]."
 me_seleukid_02_syria.9.desc:0 "We have seen a large influx of novel settlers in several of our urban centres, ready to serve under our rule, providing taxes and levies both. With loyal Greek settlers interspersed between the locals, we are sure to remedy any potential unrest and revolts prior to they can take place."
 me_seleukid_02_syria.10.desc:0 "Our [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] have started working on a complicated set of fortifications all around the region, to protect it from any would be invaders. As it has become an important novel part of our empire, we are making sure it will stay safe and can become a productive region under our rule as quick as can be."
 me_seleukid_02_syria.11.desc:0 "To the west of [GetProvince('(int32)789').GetArea.GetName] lies [GetProvince('(int32)1880').GetArea.GetName], on the other side of the [GetProvince('(int32)8021').GetName] and [GetProvince('(int32)1870').GetName]. It has long been a region that has seen an influx of Greek settlers, with several ancient Greek urban centres and towns close to the fertile seaside.\n\nWith this area under our control, we will be able to levy more Greeks into our armies, and rely more on them if we are to fight any of the other Greek states."
 me_seleukid_02_syria.12.desc:0 "With our labour in [GetProvince('(int32)1880').GetName] finally about to be complete, people are starting to talk about us as a novel Mopsus, the mythical founder of the city. In many ways we have refounded the place to be an important modern city, one that we can rely on."
 me_seleukid_02_syria.13.desc:0 "With our restoration of the sacred sites around [GetProvince('(int32)1881').GetName], we have also made sure to reestablish the local oracle in the area. Supposedly the mystic used to be more important, but the title have since lost its prestige as the temples decayed and started falling apart.\n\nWith the area restored to former glory, the oracle promises us to send us good news if possible, and seems grateful for all our assistance."
 me_seleukid_02_syria.14.desc:0 "We have finally completed our goals in Syria, as it has become another important part of our empire. With newfound settlers and urban centres scattered across the area, we know that we have begun something that has not been seen for ages in this part of the world."
 me_seleukid_02_syria.15.desc:0 "As we look towards novel areas of conquest and interest, we know that we have left behind a capable administration that will maintain Syria secure for us. Though it is disparate from our people and interests in Babylonia, it has become just as important, if not even more so. As we have finally received ports in the Mediterranean, we can once again take part in the politics of the vestiges of Alexander's empire."
 me_seleukid_02_syria.15.a:0 "For better or for worse, it had to occur."
 me_seleukid_02_syria.17.desc:0 "A large number of our people have been fooled by the promises of a novel life in [GetProvince('(int32)789').GetArea.GetRegion.GetName], in one of the many urban centres that have been founded there recently. Leaving many of their belongings behind, as well as their homes, they are given novel homes and jobs when they settle down in the east."
 me_seleukid_02_syria.17.a:0 "Let us attempt to make some money off of what they left behind, at least?"
 me_seleukid_02_syria.18.desc.1:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for our capital, [ROOT.GetCountry.GetCapital.GetName] in [ROOT.GetCountry.GetCapital.GetArea.GetName], as the entire area will flourish and develop prosperously moving forward."
 me_seleukid_02_syria.18.desc.2:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen a large influx of novel soldiers from our capital, [ROOT.GetCountry.GetCapital.GetName] in [ROOT.GetCountry.GetCapital.GetArea.GetName], as the people in the area will be inspired by our leader and [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName]."
 me_seleukid_02_syria.18.desc.4:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for our nation, as it will flourish and develop prosperously moving forward."
 me_seleukid_03_anatolia.1.desc:0 "The core of the ancient Phrygian satrapy, once the base of [GetCharacter('(int32)37').GetPraenomen], was centred around the city of [GetProvince('(int32)1936').GetName]. It is an ancient Phrygian city lying deep in [GetProvince('(int32)1936').GetArea.GetRegion.GetName], and has been an important administrative centre for a long time.\n\nWith our conquest of the area, we are now looking to the ancient capital for our administration as well."
 me_seleukid_03_anatolia.2.desc:0 "With the ancient capital of [GetCharacter('(int32)37').GetPraenomen] under our rule, we have spent considerable time and effort into rebuilding the city as an administrative centre for us in [GetProvince('(int32)1936').GetArea.GetRegion.GetName]. Now that we are reaching the conclusion of the refounding of the city, we are looking for appropriate names that we might give it."
 me_seleukid_03_anatolia.3.desc:0 "In [GetProvince('(int32)1928').GetArea.GetName] is the ancient shrine to the moon deity [men_deity.GetName], in the minor city of [GetProvince('(int32)1928').GetName]. With such an important local shrine as our focus, we have refounded the city in the image of our royal urban centres, and have constructed up the local administration of the area."
 me_seleukid_03_anatolia.4.desc:0 "With a plethora of novel urban centres and fortresses lining the royal road westwards via [GetProvince('(int32)1936').GetArea.GetRegion.GetName], we have constructed up a novel administration that can take care of the entire region as it continues to flourish under our rule."
 me_seleukid_03_anatolia.5.desc:0 "We have spent considerable time and resources in structure up [GetProvince('(int32)1936').GetName] as a great royal city under our rulership, and integrated the local population into the process. Though they were foreigners to us when we first came to these lands, we have now gotten to know them quite well, and they have started taking an active role in our administration all across Anatolia."
 me_seleukid_03_anatolia.6.desc:0 "Just north of [GetProvince('(int32)1883').GetArea.GetRegion.GetName] lies [GetProvince('(int32)1799').GetArea.GetRegion.GetName] and the eastern stretches of [GetProvince('(int32)1936').GetArea.GetRegion.GetName], regions frequently left to their struggles as they are not quite as valuable as many of their neighbours. As we have taken control of the area, we are now starting to look for logical places to set up a novel administration under our rule."
 me_seleukid_03_anatolia.7.desc:0 "We set our eyes on [GetProvince('(int32)177').GetName], as a place of great potential for our administration of the area. With a proper city constructed up in the area, and the locals loyal to our cause, we are now looking for other areas of interest that can secure the region for us."
 me_seleukid_03_anatolia.8.desc:0 "In [GetProvince('(int32)1934').GetName] and [GetProvince('(int32)1951').GetName] we have two ancient urban centres that supposedly hail back to the days of myths and legends themselves. With these two great urban centres under our rule, the rest of the region will hopefully bend to our influence in due time."
 me_seleukid_03_anatolia.8.a:0 "We hope they will appreciate what we have complete for them."
 me_seleukid_03_anatolia.9.desc:0 "We have established a set of urban centres and fortresses around the eastern stretches of the Persian Royal Road in Anatolia, and have secured most of the region north of [GetProvince('(int32)1883').GetArea.GetRegion.GetName]. Our administration in the area is starting to discover their footing, letting us focus our efforts and resources elsewhere."
 me_seleukid_03_anatolia.9.a:0 "They are doing admirable labour."
 me_seleukid_03_anatolia.10.desc:0 "Though originally a satrapy under the Greek [GetCharacter('(int32)408').GetPraenomen], and then a kingdom under its own native rulers, [cappadocia_country.GetName] has since fallen on hard times. We are now working with the local populace in restoring their independence, as they construct a novel vassal kingdom of ours."
 me_seleukid_03_anatolia.12.desc:0 "[GetProvince('(int32)292').GetName] has been an important western capital for most empires who have ruled over Anatolia, be it the Persians, [GetCharacter('(int32)39').GetPraenomen], or [GetCharacter('(int32)37').GetPraenomen]. Continuing that trend, we have secured the loyalty of the local populace and expanded greatly upon the city, so it can labour as the home of our administration in the area as well."
 me_seleukid_03_anatolia.12.a:0 "We have reached the conclusion of the road, finally."
 me_seleukid_03_anatolia.13.desc:0 "We have constructed fortresses and urban centres around the far western stretches of the Persian Royal Road, close to the Greek shores of [GetProvince('(int32)1973').GetArea.GetRegion.GetName]. As they are much closer to ourselves and our own background, we have an easier time in administering them and integrating them into our empire than their eastern brethren."
 me_seleukid_03_anatolia.14.desc:0 "By [GetProvince('(int32)1973').GetName] in [GetProvince('(int32)1973').GetArea.GetName] lies Didyma, one of the greatest shrines to [apollo_deity.GetName], only dwarfed by the temples in [GetProvince('(int32)424').GetName] and [GetProvince('(int32)1835').GetName]. The oracle in Didyma have received several donations from us, as the [GetCharacter('(int32)24').GetFamily.GetName] family supposedly has descended from the god himself, as frequently claimed by [GetCharacter('(int32)24').GetPraenomen]."
 me_seleukid_03_anatolia.16.desc:0 "From [GetProvince('(int32)911').GetName] in Babylonia to [GetProvince('(int32)789').GetName] at the shores of the Mediterranean, urban centres with the name Seleukeia play an important part in our nation. We are now looking to found a novel one in [GetProvince('(int32)1966').GetArea.GetName], that will hopefully be just as central for that region as the others have been prior to it."
 me_seleukid_03_anatolia.17.desc:0 "We have finally secured a route all the way to [GetProvince('(int32)292').GetName], with a robust administration and defensive fortifications along the way. We have now opened the route to the Greek shores, and our ancient home of Macedon, if we should wish to attempt to continue our conquest westwards."
 me_seleukid_03_anatolia.17.a:0 "Though our labour is not over yet."
 me_seleukid_03_anatolia.18.desc:0 "Our dreams have finally have been achieved, as we have conquered all the way to the shores of [GetProvince('(int32)1973').GetArea.GetRegion.GetName]. With the most important parts of Anatolia under our rule, as well as the Persian Royal Road itself, we have opened up a path to every region of the ancient empire of [GetCharacter('(int32)39').GetPraenomen]."
 me_seleukid_04_palestine.1.desc:0 "Though we are looking southwards, towards the lands of [GetProvince('(int32)687').GetArea.GetRegion.GetName], we know we have to secure the route there prior to we can commence moving our troops in that direction. [GetProvince('(int32)789').GetArea.GetRegion.GetName] is almost entirely under our thumb already, now we just need to enforce control in the entire region."
 me_seleukid_04_palestine.2.desc:0 "Much of the commerce, exchange, and travel between [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName] happens in the many passes, hills, and mountains between the two regions. Now that we have secured those passes, our soldiers will safely be able to march northwards and southwards, and we have defensive fortifications and measures ready should the region ever be attacked."
 me_seleukid_04_palestine.3.desc:0 "We have kept in contact with the leaders of the Phoenician urban centres for quite some time now, as we have been looking to request a navy from them. Having finally gotten our hand on everything they will need, we have sent a messenger their way with the specifics."
 me_seleukid_04_palestine.4.desc:0 "We have received a messsenger from [GetProvince('(int32)779').GetName] that they have finished structure our ships, and that they are now waiting by the shores of [GetProvince('(int32)779').GetArea.GetName]. Our taskmasters have reported that the ships are of unpararelled quality, and quite unlike anything they have ever seen prior to."
 me_seleukid_04_palestine.5.desc:0 "With [GetProvince('(int32)789').GetArea.GetRegion.GetName] entirely under our control, we are now looking southwards to [GetProvince('(int32)687').GetArea.GetRegion.GetName]. Our armies are ready to march to armed conflict, to expand our borders, as we have long planned.\n\nNow all that awaits, is for us to declare war upon our southern neighbours, and commence the campaign."
 me_seleukid_04_palestine.6.desc:0 "We have secured the loyalty of the Phoenician shorelines and its many urban centres, from [GetProvince('(int32)747').GetName] in the north to [GetProvince('(int32)659').GetName] and [GetProvince('(int32)660').GetName] in the south. With vast swathes of the region under our control, we need to discover measures to properly secure the area prior to we can commence looking elsewhere."
 me_seleukid_04_palestine.6.a:0 "A success, though a lot of labour still remains to be complete."
 me_seleukid_04_palestine.7.desc:0 "The people of [GetProvince('(int32)659').GetName], and its surrounding area, appreciate the labour and effort we have put into improving the state of their local shrines and temples. One of their primary deities, the god [GetDeityDefinition('omen_hadad').GetName], has even started becoming somewhat popular with some of our own people at court."
 me_seleukid_04_palestine.9.desc:0 "With some of the major urban centres and settlements completely secured, our administration of the region has finally been set up in its entirety. Though they are still fairly novel to the job, it seems to be going fairly well by all reports."
 me_seleukid_04_palestine.9.a:0 "With all our efforts in the region, it better labour out well."
 me_seleukid_04_palestine.10.desc:0 "Our men have taken control of the provinces of [GetProvince('(int32)733').GetArea.GetName], [GetProvince('(int32)687').GetArea.GetName], and [GetProvince('(int32)681').GetArea.GetName], as part of our larger campaign for securing the entire region of [GetProvince('(int32)687').GetArea.GetRegion.GetName]. The areas are known for being particularly hard to control, and for being some of the most fertile provinces in the region."
 me_seleukid_04_palestine.11.desc:0 "As we have focused our efforts on securing the lands around [GetProvince('(int32)687').GetArea.GetName], it became abundantly clear we needed to come to some arrange of agreement with the Nabataeans to the south. A pact between our people is finally signed, as a group of younger Nabataeans arrives in [ROOT.GetCountry.GetAdjective] lands, to greet our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetPraenomen]."
 me_seleukid_04_palestine.12.desc:0 "We are preparing messengers to appeal to the people of [GetProvince('(int32)416').GetArea.GetRegion.GetName], [GetProvince('(int32)379').GetArea.GetRegion.GetName], and [GetProvince('(int32)290').GetArea.GetRegion.GetName] to come settle down in [GetProvince('(int32)732').GetArea.GetName]. With an influx of novel settlers in the province, we will be able to commence making use of its rich fertile lands more efficiently than what the current local population can."
 me_seleukid_04_palestine.13.desc:0 "We have been informed by our local administrators that they have seen an influx of several Greeks settle down all across [GetProvince('(int32)732').GetArea.GetName], as they took us up on the offer of homes, novel rights, and protection. Now maybe we will finally be able to make better use of the province moving forward."
 me_seleukid_04_palestine.14.desc:0 "Though we have spent a lot of effort and resources into structure up an administration in [GetProvince('(int32)687').GetArea.GetName], it has continually been struggling to come to grips with the governance of the local province. Many of our advisors claims it will labour itself out in time, though we are not so sure."
 me_seleukid_04_palestine.14.b:0 "A free state, is that what they desire? Let them have it, then."
 me_seleukid_04_palestine.15.a:0 "We will commence a novel campaign in due time."
 me_seleukid_04_palestine.16.desc:0 "We have finally completed our campaign to take control of all of [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName], and to secure the borders to [GetProvince('(int32)516').GetArea.GetRegion.GetName] and [GetProvince('(int32)1883').GetArea.GetRegion.GetName]. With the shipwrights of Phoenicia under our control, and the many ports of the region ready to serve our purpose, we can once again reinforce our influence over the parts of the empire of [GetCharacter('(int32)39').GetPraenomen] we have yet to be able to annex."
 me_seleukid_04_palestine.18.desc:0 "After messengers arrived in some of our urban centres from the east, a lot of our people were enticed to travel to the area known as [GetProvince('(int32)732').GetArea.GetName] after they were promised special rights and novel homes."
