l_english:
 stonehenge.2.a:0 "Naturally - let's not make a considerable thing of it."
 stonehenge.3.desc:0 "Just moments before the Stonhenge unveiling ceremony in the central market of [main_stage.GetName], it is reported that the hired musicians meant to provide merriment during the event have tragically perished in a freak accident in the Hanging Gardens of Babylon. Only [sthubbins.GetName] and [druid.GetName] are left to perform the act. After picking up a lyre, [sthubbins.GetName], in a novel pair of barbarian trousers, copies the stance of [druid.GetName] - legs as far apart as possible.\n\n"[sthubbins.GetName], lead lyre!" cries [druid.GetName], to the crowd composed of the garrison of [main_stage.GetName] forced to assemble around the tiny stone circle."
