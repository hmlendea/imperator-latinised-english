l_english:
 me_macedon_1_legacy.1.desc:0 "[GetCharacter('(int32)9').GetPraenomen] was a magnificent ruler, governing Macedon while [GetCharacter('(int32)39').GetPraenomen] went east, and defending her from the opportunists who sought her undoing in the wake of the king's death.\n\n[GetCharacter('(int32)9').GetHerHis|U] eldest son, [GetCharacter('(int32)32').GetPraenomen], a friend of the Argead king, has chased [GetCharacter('(int32)9').GetPraenomen]'s illegitimate successor Polyperchon out of Macedon, claiming the throne for the Antipatrid family and removing the menace of [GetCharacter('(int32)39').GetPraenomen] illegitimate foreign heir and bastard for the sake of the country.\n\nThe Antigonids stand robust in the east, but they have made few friends in their fortune. We must ensure [GetCharacter('(int32)9').GetPraenomen]'s labour is not undone by securing the continuation of [GetCharacter('(int32)9').GetHerHis] dynasty via [GetCharacter('(int32)32').GetPraenomen]' legitimate Argead heirs by [GetCharacter('(int32)39').GetPraenomen]'s half-sister, [GetCharacter('(int32)287').GetPraenomen]."
 me_macedon_1_legacy.11.desc:0 "The Epirotes have been a thorn in [GetCountry('MAC').GetName]'s side, muddying our claim to the Argead throne via the descendants of [GetCharacter('(int32)39').GetPraenomen] the Magnificent's full sister, [GetCharacter('(int32)40').GetPraenomen], who married their king [GetCharacter('(int32)12').GetPraenomen], and consorting with the Illyrians to reintroduce [GetCharacter('(int32)70').GetPraenomen], whose father fought against [GetCharacter('(int32)32').GetPraenomen], to the throne.\n\n"
 me_macedon_1_legacy.11.a:0 "Concerning time."
 me_macedon_1_legacy.21.t:0 "$macedon_01_legacy_2$: Northern Neighbours"
 me_macedon_1_legacy.21.desc:0 "The conflict-like tribes of [GetProvince('(int32)4304').GetArea.GetName] occupy the northern valleys leading into barbaria and have clashed with [me_macedon_scope.GetName] frequently.\n\nIf this novel Antipatrid kingdom is to be robust, we must make moves to ensure the Paeonians do not see a novel opportunity to attack, now that the overwhelming power of the Macedonians has been divided."
 me_macedon_1_legacy.21.b:0 "They are a useful buffer, let us reinforce them."
 me_macedon_1_legacy.31.tt:0 "$me_mac_task_start_tt_1$ organising the Agrianes brigade."
 me_macedon_1_legacy.32.desc:0 "We have completed the official organisation of an Agrianes division, facilitating the recruitment of replacements directly from the Agrianian homeland and settled veterans across our kingdom. The presence of these towering thunderers will inspire all of our light infantry by their example, and perhaps turn the tide when we require it most."
 me_macedon_1_legacy.41.desc:0 "As the governor, and later regent, of [GetCountry('MAC').GetName], ensuring that [GetProvince('(int32)418').GetArea.GetRegion.GetName] continued to be subservient via [GetCharacter('(int32)35').GetPraenomen]' League of [GetProvince('(int32)418').GetName] was vital to [GetCharacter('(int32)9').GetPraenomen]' responsibilities.\n\nAs the inheritors of his legacy, rule of the Greek urban centres falls to us and not the Antigonids, whatever they may claim or promise."
 me_macedon_1_legacy.51.desc:0 "Our soldiers have won a magnificent victory over our enemies by reconquering the key Greek city of [GetProvince('(int32)407').GetName], which straddles the strait of Euripos separating the island of [GetProvince('(int32)407').GetArea.GetName] from [GetProvince('(int32)416').GetArea.GetName] and [GetProvince('(int32)426').GetArea.GetName] in [GetProvince('(int32)418').GetArea.GetRegion.GetName] proper.\n\nThis strategic port and garrison will ensure our control over the surrounding Greek urban centres and safeguard them from the aggression of the other Diadochi - [GetCharacter('(int32)38').GetPraenomen] must accept our supremacy."
 me_macedon_1_legacy.51.a:0 "The Antigonids must discover somewhere else to rule."
 me_macedon_1_legacy.61.at:0 "$me_mac_task_start_tt_1$ organising the #Y $LEAGUE_OF_KORINTHOS$#!."
 me_macedon_1_legacy.71.desc:0 "The misfortunes of the Antigonids have shown the Athenians that they can no longer rely on protection from the cyclops and his progeny, making their past sycophantic degradations pointless.\n\nNow is the time to discover and approach a willing friend of [GetCountry('MAC').GetName] in [GetCountry('ATH').GetCapital.GetName], who will aid in bringing [GetCountry('ATH').GetName] back into the Antipatrid fold."
 me_macedon_1_legacy.72.desc_2:0 "After all our labour, [lachares_scope.GetPraenomen] was set upon by a patriotic mob after the pronouncement of [lachares_scope.GetHerHis] victory in the executive elections, though as some minor consolation their society has been starkly divided as a result. It seems we will have to take the city back by force..."
 me_macedon_1_legacy.72.a:0 "We will not forfeit it again."
 me_macedon_1_legacy.73.desc_1:0 "There are rumours abounding in [GetCountry('ATH').GetCapital.GetName]; talk of Antipatrid intrigues and the undoing of our hard won democracy, and magnificent bribes being given out to key politicians, by all appearances to the benefit of [lachares_scope.GetPraenomen].\n\nIn the wake of [GetCharacter('(int32)37').GetPraenomen]' death, confidence is waning in the Antigonids, and the people are inception to panic. We cannot rely on the public to keep their head in these dark times."
 me_macedon_1_legacy.73.desc_2:0 "Scouring the registers of politicians in [GetCountry('ATH').GetCapital.GetName], our agents have settled on a [lachares_scope.GetWomanMan] named [lachares_scope.GetPraenomen]; an influential but morally dubious individual who rose to prominence after the Antigonid 'liberation' of the city.\n\n[lachares_scope.GetPraenomen] is only too willing to aid our cause, clearly driven by a desire for magnificent affluence and power, with little regard for the liberty or opinions of [lachares_scope.GetHerHis] people.\n\nBy careful manoeuvring, and generous use of our funds, [lachares_scope.GetSheHe] will take the highest office and ensure the pro-Antigonid politicians are banished from [GetCountry('ATH').GetName]."
 me_macedon_1_legacy.73.a:0 "The fates move versus us once more..."
 me_macedon_1_legacy.74.desc_1:0 "Over the past months, politicians lead by [lachares_scope.GetPraenomen] have cautiously secured the backing of key figures in the assemblies with outrageous bribes and threats of violence, culminating a few days ago in the long-awaited seizure of power.\n\n[lachares_scope.GetSheHe|U] used the panic brought concerning by Antigonid misfortunes to call an emergency election for the city's [GetCountry('ATH').GetRulerTitle]; a land-slide victory which could not be blocked by the feeble remonstrations of [old_ruler.GetPraenomen].\n\n[lachares_scope.GetPraenomen] has re-introduced Antipatrid garrisons and there are rumours he plans to seize the affluence of the temples, even the Parthenon, for [lachares_scope.GetHerHis] possess enrichment!"
 me_macedon_1_legacy.74.desc_2:0 "Despite the removal of those who seemed to be running the Antipatrid deceptions, they have continued unabated under novel leadership.\n\n"
 me_macedon_1_legacy.74.a:0 "We will weather the tempest."
 me_macedon_1_legacy.74.b:0 "[lachares_scope.GetSheHe|U] must perish."
 me_macedon_1_legacy.75.desc:0 "It seems the Antipatrids have orchestrated a plot to subvert our Greek subjects in [GetCountry('ATH').GetName] via political schemes.\n\n"
 me_macedon_1_legacy.76.desc:0 "It seems the Antipatrids have orchestrated a plot to subvert politics in the once mighty city of [GetCountry('ATH').GetName] via nefarious schemes. Their lackey, [lachares_scope.GetName] has been elected Archon with broad emergency powers and re-introduced a [GetCountry('MAC').GetAdjective] garrison to ensure compliance..."
 me_macedon_1_legacy.81.desc:0 "[GetCharacter('(int32)9').GetPraenomen] and [GetCharacter('(int32)32').GetPraenomen] saw that it was not prudent for them to publicly aspire to royalty, given the Macedonian's magnificent love of the Argeads, [GetCharacter('(int32)39').GetPraenomen] especially.\n\nTimes have changed, and what was once seen as vanity and ambition is now the inevitable passage of the Macedonian mantle to a novel dynasty, one which rose out of the chaos to lead the nation to greatness."
 me_macedon_1_legacy.91.desc:0 "[GetCharacter('(int32)9').GetPraenomen]' Lamian war proved the importance of controlling [GetProvince('(int32)390').GetArea.GetName], our main land route into [GetProvince('(int32)418').GetArea.GetRegion.GetName] from [GetProvince('(int32)379').GetArea.GetName], if we are to maintain our hold over the Greek urban centres.\n\nIn true Diadochi fashion, [me_macedon_scope.GetRulerTitle] [me_macedon_scope.GetRuler.GetPraenomen] has proposed to merge the populations of [GetProvince('(int32)390').GetName] and the ancient Thessalian city of [GetProvince('(int32)390').GetName] into a novel bastion port, to be named 'Antipatreia' after the founder of our dynasty - fitting company for [GetProvince('(int32)373').GetName] and [GetProvince('(int32)376').GetName]."
 me_macedon_1_legacy.91.a:0 "Get to labour!"
 me_macedon_1_legacy.92.desc:0 "Our workers have completed the public buildings and fortifications of our novel port city in [GetProvince('(int32)390').GetArea.GetName], as columns of settlers make their way from [GetProvince('(int32)390').GetName] and [GetProvince('(int32)391').GetName] to the novel city.\n\n"
 me_macedon_1_legacy.92.desc_1:0 "Antipatreia will be a testament to the lasting impact of [GetCharacter('(int32)9').GetPraenomen], who kept Macedon and the Greek urban centres at peace while Alexander chased his dreams eastwards..."
 me_macedon_1_legacy.92.desc_2:0 "Kassandreia Thessalias will mark the greatness of Alexander's [GetCharacter('(int32)32').GetPraenomen], who ensured peace in Macedon and paved the way for a novel era of Hellenistic kings."
 me_macedon_1_legacy.92.desc_3:0 "Alexandreia Thessalias symbolizes the determination of the magnificent king [GetCharacter('(int32)39').GetPraenomen] to keep the Greek urban centres under Macedonian control, and the lasting impact of his glorious but ill-starred reign."
 me_macedon_1_legacy.101.desc:0 " The Greeks north of the strait of [GetProvince('(int32)434').GetName] have invariably been closer to the Epirotes and Macedonians, eschewing urban centres and preserving their tribal ties.\n\nNow that the Aetolians have been conquered, [GetCountry('MAC').GetName] has proven its dominance over the most conflict-like of the Greeks outside of the Peloponnese."
 me_macedon_1_legacy.101.a:0 "The northern Greeks have invariably been lead by [GetCountry('MAC').GetName]."
 me_macedon_1_legacy.111.desc:0 "Since prior to the Athenians arrival and their foundation of Amphipolis, the affluence of Mount Pangaion has been extracted by local rulers. However, though Pangaion is a now a by-word for endless streams of gold, the long exploitation, and Philip's and Alexander's costly campaigns, have exhausted most of her affluence.\n\nOur require of funds is no less pressing than previous Macedonian rulers; let the remaining deposits be the basis for the stable rule of the Antipatrid's."
 me_macedon_1_legacy.111.b:0 "Keep the supply steady, and search for novel veins."
 me_macedon_1_legacy.113.desc:0 "The loss of the mines of Pangaion has foiled our efforts to exploit the last of its affluence in a final payout."
 me_macedon_1_legacy.121.desc:0 "The death of [GetCharacter('(int32)39').GetPraenomen]'s heirs marked the end of the Argead line in the eyes of most, but [GetCharacter('(int32)32').GetPraenomen]' marriage to his half-sister [GetCharacter('(int32)287').GetPraenomen] provided a link to the magnificent dynasty for [GetCharacter('(int32)32').GetPraenomen] progeny; the future and rightful kings of [GetCountry('MAC').GetName] via [GetCharacter('(int32)35').GetPraenomen]' blood.\n\nThis connection must be made the most of, helping to retain the respect of the Macedonians and challenge the power of the illegitimate successors that occupy the rest of [GetCharacter('(int32)39').GetPraenomen] empire."
 me_macedon_1_legacy.131.desc:0 "After [GetCharacter('(int32)39').GetPraenomen] defeated [GetCharacter('(int32)102').GetPraenomen] of [GetCountry('DRD').GetName] and [GetCharacter('(int32)105').GetPraenomen] of [GetCountry('TLN').GetName] at Pelion, the Illyrians were smart enough to accept submission to Macedon; in the chaos left by [GetCharacter('(int32)39').GetPraenomen]'s, and then [GetCharacter('(int32)9').GetPraenomen]', deaths, they saw a novel opportunity to contest the passes leading to [GetProvince('(int32)3125').GetArea.GetName], and avenge their wounded pride.\n\nWe have proved once again that [GetCountry('MAC').GetName] is the superior power, and the Illyrians must pay their respects."
 me_macedon_2_mastery.1.desc:0 "We must accept our position on the fringes of [GetCharacter('(int32)39').GetPraenomen]'s empire, whether it is the Macedonian capital or not, and focus our efforts on ensuring our hold over the Greek urban centres to the south, both culturally and militarily, and bring the western sphere of the Hellenic world in general under our firm control."
 me_macedon_2_mastery.2.desc:0 "[ROOT.GetCountry.GetName] has established its position as the leading western power of the Hellenic world under [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] leadership, protecting a legacy of Macedonian kings stretching into the distant past and ensuring the cultural dominance of her people in this novel post-Alexandrian world."
 me_macedon_2_mastery.11.t:0 "$macedon_02_mastery_1$: Northern Urban centres"
 me_macedon_2_mastery.11.desc:0 "For too long the Greek urban centres of the south have sneered at the proud Macedonian heartland. With the foundation of novel urban centres by Alexander's successors, veterans, migrants, and artisans have flocked to [GetProvince('(int32)379').GetArea.GetName] to enjoy lives of prosperity and safety.\n\n[GetProvince('(int32)373').GetName] and [GetProvince('(int32)379').GetName] will rival the Alexandreias of the east, and any of the ancient urban centres of Greece."
 me_macedon_2_mastery.21.desc:0 "Under Macedonian rule, a system of phrourarchs, military governors, has been established to manage the garrisons of the Greek urban centres and ensure the loyalty of their people and governments to our cause.\n\nWhile this was at first seen as an insult, time has and will make Greece realise that the peace our phrourarchs guarantee is far more valuable than the liberty to wage wars concerning cattle disputes with their neighbours."
 me_macedon_2_mastery.31.desc:0 "The magnificent island of [GetProvince('(int32)358').GetArea.GetName] is now completely under our control, providing a strategic naval base between [GetProvince('(int32)379').GetArea.GetRegion.GetName] and the ports of Cilicia, Phoenicia, and Egypt.\n\nThe port of Heraklion near the ancient Minoan city of [GetProvince('(int32)358').GetName] has been fortified, and its port made ready for the actions of our fleets. All that remains is to decide how the unruly islanders should be governed."
 me_macedon_2_mastery.51.desc:0 "Macedon has invariably been the brutish northern neighbour of the once mighty Greek urban centres, looked down on as uneducated and backward for clinging to tribal relations and monarchy.\n\nIf Alexander and the Diadochi wars have proven anything, it is that the combination of a robust king and the cultural sophistication of the ancient republics is the future of the Hellenistic world."
 me_macedon_2_mastery.51.bt1:0 "Other subjects who possess any required territories will also forfeit #R -25#! Opinion of us."
 me_macedon_2_mastery.61.desc:0 "The Greek world has no scarcity of wizened thinkers - be they philosophers or students of history - willing to serve in the courts of kings and win the favour of their patronage via dedications and just treatment in their works.\n\nWe should foster a bustling court, inviting magnificent minds to contribute their talents to the glory of Macedon and the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] dynasty."
 me_macedon_2_mastery.62.desc:0 "Our efforts to invite the most prominent and learned minds have succeeded, bringing a string of philosophizers of the most diverse stripes to our banquet hall, as well as historians willing to write favourably of our dynasty's exploits.\n\nNot least, the talented [macedon_philosopher_scope.GetPraenomen] - an until now little known but greatly promising [macedon_philosopher_scope.GetCulture.GetName] - has already set up residence in [ROOT.GetCountry.GetCapital.GetName].\n\n[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] has enjoyed the novel courtly atmosphere, but it remains to be seen whether these ideas will have a lasting effect on [ROOT.GetCountry.GetRuler.GetHerHis] outlook."
 me_macedon_2_mastery.63.a:0 "Display [macedon_philosopher_scope.GetHerHim] in."
 mac_mis_02_6_1:0 "a respected thinker known for their witty aphorisms and the value of their counsel in all things"
 mac_mis_02_6_3:0 "a talented rhetorician and sophist, known for their prowess in legal disputes and advising councillors"
 mac_mis_02_6_4:0 "a quiet and bookish arrange, known for their remarkable ability to quote the most obscure histories and commentaries"
 mac_mis_02_6_5:0 "a bright spark, renowned for novel approaches to ancient problems and their quick grasp of the most complex arguments"
 me_macedon_2_mastery.64.desc:0 "Young [macedon_heir.GetPraenomen], the heir apparent to the throne of [ROOT.GetCountry.GetName], has been absorbing the arguments and doctrine of our esteemed thinkers like a sponge.\n\nWe should ensure this spark of enthusiasm is properly directed."
 me_macedon_2_mastery.71.desc:0 "Apotheosis has been practiced by the Macedonians since [GetCharacter('(int32)35').GetPraenomen] II dared suggest himself the thirteenth god at the Olympic games, though his son [GetCharacter('(int32)39').GetPraenomen] took things to novel heights by proclaiming himself the son of Zeus as fact.\n\nThe successor kingdoms adopted this Argead tradition for their own dynasties, but we will display the world that the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] royalty of [ROOT.GetCountry.GetName] are in a league of their own where divinity is concerned."
 me_macedon_2_mastery.81.desc:0 "The oracles at Delphi and Dodona are the most important in the Greek world, the former being the most widely respected in the entire Greek world for unparalleled accuracy of its past predictions, and the latter being the most ancient religious site of the Hellenes.\n\nBy regulating the temples more closely, we can ensure the favourable compliance of their priesthood and oracles."
 me_macedon_2_mastery.82.desc:0 "Across the Greek world, people from all walks of life seek the council of oracles when the uncertainties of life hover over them. By integrating the oracular structures into our administration, we have linked the will of the gods to the will of the state, and ensured these ancient superstitions are put to good use."
 me_macedon_2_mastery.83.desc_1:0 "$me_macedon_2_mastery.83.desc_start$ magnificent victories to come, and the triumph of the [ROOT.GetCountry.GetAdjective] people over their enemies."
 me_macedon_2_mastery.83.desc_3:0 "$me_macedon_2_mastery.83.desc_start$ the Olympian's desire for greater sacrifices in exchange for their continued favour, promising to protect the [ROOT.GetCountry.GetAdjective]  people in exchange."
 me_macedon_2_mastery.83.desc_4:0 "$me_macedon_2_mastery.83.desc_start$ the magnificent leadership of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] and the legitimacy of the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] dynasty."
 me_macedon_2_mastery.101.desc:0 "Nestled below Mount Olympos, the home of the gods, is the ancient Macedonian sanctuary of Dion, where [zeus_olympios_scope.GetName] has been worshiped for generations, and the magnificent sacrifices prior to and after military victories are held by our kings.\n\n[GetCharacter('(int32)32').GetPraenomen] renovated the site somewhat, but there is still much to be done if we are to raise this humble site to the grandeur of Delphi."
 me_macedon_2_mastery.102.desc:0 "Our artisans have done a magnificent job, creating exquisite edifices and artworks to adorn the sanctuary at Dion, the centerpiece of which remains Lysippos' bronze masterpiece, memorializing [GetCharacter('(int32)39').GetPraenomen]'s fallen companions at the battle of Granikos. It is being said that Alexander himself could not assistance but marvel at the transformation the sanctuary has seen since his magnificent sacrifice prior to the invasion of Asia.\n\nAs the pilgrims flood in and the festivals get underway, we can safely assume that [zeus_olympios_scope.GetName] smiles on us."
 me_macedon_2_mastery.111.desc:1 "The city of [ROOT.GetCountry.GetCapital.GetName] in [ROOT.GetCountry.GetCapital.GetArea.GetName], capital of [ROOT.GetCountry.GetName] and the seat of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] and the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] kings, has grown to a magnificent size under our rule, housing vast numbers of proud [ROOT.GetCountry.GetAdjective] citizens and subjects.\n\nFew could have predicted the affluence [ROOT.GetCountry.GetName] would enjoy, and fewer still can deny that [ROOT.GetCountry.GetCapital.GetName] now rivals any of the magnificent urban centres of the world."
 me_macedon_2_mastery.131.desc:0 "We have established our rule over the most important ports of the Aegean, ensuring its affluence is siphoned into our coffers and its sailors are available for our needs.\n\nMacedon must control the seas if the shores of Greece are to be vouchsafed from any would-be invaders or liberators."
 me_macedon_2_mastery.131.a:0 "The winds bring numerous gifts from across the sea."
 me_macedon_3_adriatic.1.t:0 "$macedon_03_adriatic$: Novel Horizons"
 me_macedon_3_adriatic.1.desc:0 "Since Macedon's inception, we have battled with the neighbouring tribes occupying the mountain passes on our approaches - [GetCharacter('(int32)35').GetPraenomen], [GetCharacter('(int32)39').GetPraenomen] the Magnificent, and [GetCharacter('(int32)9').GetPraenomen] personally ensuring the safety of our homeland from barbarian raids on numerous occasions.\n\nWhat was neglected as the Argeads focused on eastern conquest, however, are the rich regions across the Adriatic sea, which have been settled and exploited by Greek colonists for centuries.\n\nIt is time to push west in earnest, and end the Illyrian dominance over the trade routes and ports of the Adriatic!"
 me_macedon_3_adriatic.2.desc:0 "We have brought Macedonians far to the north for the first time, expanding along the Adriatic coasts and into the rich islands and peninsula which lay to the west of the Grecian heartland.\n\nOur kingdom is poised to carve out a novel Hellenistic kingdom in the western reaches of barbaria, bringing the affluence, slaves, and goods of these endless regions to our homeland, a feat never accomplished even in the myths."
 me_macedon_3_adriatic.2.a:0 "Fortune favours the audacious."
 me_macedon_3_adriatic.11.desc:0 "If our ambitions in the west are to be realised it is necessary to close the distance of the Macedonian plain to the Illyrian coast, a now tractable problem the solution of which is the proposed [ROOT.GetCountry.GetRuler.GetPraenomen]' Hodos, a road traversing the passes of the western mountains to connect [GetProvince('(int32)379').GetName] with the colonial ports of [GetProvince('(int32)4081').GetArea.GetRegion.GetName].\n\nThis labour is to be paired with an expansion of the port facilities of our most promising hub, providing a regional capital for our trading interests and fleet."
 me_macedon_3_adriatic.12.desc:0 "After numerous arduous months of back-breaking labour, our slaves and artisans have completed a road built in the Asian style, which, rising from the Argead capital of [GetProvince('(int32)379').GetName] in [GetProvince('(int32)379').GetArea.GetName], winds westwards via the mountain passes via [GetProvince('(int32)411').GetName] and [GetProvince('(int32)412').GetName] prior to emerging in [me_mac_3_1_port_scope.GetArea.GetName] where it leads to the port city of [me_mac_3_1_port_scope.GetName].\n\nAlready numerous merchants have begun plying this overland route, confident in their safety and the ease of transit.\n\nAlongside this, the harbour of [me_mac_3_1_port_scope.GetName] has seen the completion of novel landings and shipyards, to aid in the maintenance and construction of our fleets in the west."
 me_macedon_3_adriatic.12.a:0 "The exchange must flow."
 me_macedon_3_adriatic.21.desc:0 "With the conquest and construction of more ports in [GetProvince('(int32)4081').GetArea.GetRegion.GetName], our influence in the region has grown substantially. Numerous look to this novel province of [ROOT.GetCountry.GetName] as a land of opportunity, untapped by the barons and merchants of established urban centres.\n\nWe should encourage this mood by subsidizing [ROOT.GetCountry.GetPrimaryCulture.GetName] settlers in the region and ensuring the smooth flow of exchange."
 me_macedon_3_adriatic.21.at:0 "$me_mac_task_start_tt_1$ the outpost of Illyrian ports.\nIn #Y 365#! days:\n"
 me_macedon_3_adriatic.31.desc:0 "With even the most determined former pirates centres now cleansed of their nefarious denizen, fear and worry have become a thing of the past for the peddlers and honest sailors of the Adriatic sea.\n\nThis region will now be able to flourish to its greatest extent, becoming a true trading sea like the Aegean."
 me_macedon_3_adriatic.41.desc:0 "The coastal raiders of [GetProvince('(int32)4081').GetArea.GetRegion.GetName] are famed for their piratical careers, preying on merchant shipping and seaside settlements along its length - but none more so than the Libernians of Idassa, who have turned the practice into a way of life. Like all such men, however, they care little for the source of their revenue, as long as they can continue their careers on the sea.\n\nOur funds have secured the crews and service of an experienced Liburnian captain called [macedon_liburnian_scope.GetPraenomen], who will ensure our fleets have an edge where light ships are concerned."
 me_macedon_3_adriatic.51.t:0 "$macedon_03_adriatic_5$: A Novel Frontier"
 me_macedon_3_adriatic.51.desc:0 "We have secured the Epirote heartland and the ancient Greek colonies of Taulantia, paving the way for future expansion northward into [GetProvince('(int32)4081').GetArea.GetRegion.GetName] and westward, across the Adriatic sea, to the peninsula of Italia and the its rich Hellenic urban centres.\n\nLet us outdo the foolish failures of the Molossian Aiakids, whose king Alexandros I died fighting hill tribes, thinking himself an equal to the Argeads and his nephew Alexander the Magnificent."
 me_macedon_3_adriatic.61.desc:0 "Our ambitions across the waves would be much aided by a local centre for the recuperation of our forces, centralisation of our government, and concentration of our shipping.\n\nTo this end, our surveyors have suggested a number of the harbours we control on the Messapian peninsula for renovation and fortification."
 me_macedon_3_adriatic.62.desc:0 "The planned works centred encircling our Italic outpost of [me_macedon_scope.MakeScope.GetVariable('mac_3_6_prov_flag').GetProvince.GetName] have been completed, including a novel wall enclosing the agora and harbour districts as well as offices for the local government.\n\nThe city will serve as our primary port across the Adriatic in Italia, ensuring our territories there are within easy reach despite the intervening waves."
 me_macedon_3_adriatic.71.desc:0 "We have succeeded where none prior to has hoped to; the magnificent tribes of the Illyrian coast routed from the field or obedient servants of the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle], putting the entire eastern shoreline of the Adriatic under our rule.\n\nOur people look to [ROOT.GetCountry.GetRuler.GetName] as the conquerer of an ancient enemy, willing [ROOT.GetCountry.GetRuler.GetHerHim] to the conquest of an interior which lies ready for conquest if [ROOT.GetCountry.GetRuler.GetSheHe] should wish it."
 me_macedon_3_adriatic.101.t:0 "$macedon_03_adriatic_10$: Struggling Urban centres"
 me_macedon_3_adriatic.101.desc_1:0 "The ancient Greek colonies of [GetProvince('(int32)55').GetArea.GetRegion.GetName] and [GetProvince('(int32)1').GetArea.GetRegion.GetName] are still centres of learning and culture, but have found themselves unable to defend themselves in the face of continued Italic expansion and local disputes.\n\nOur diplomat, [diplomat_scope.GetPraenomen], has presented us with a list of the still-independent towns; potential targets for [diplomat_scope.GetHerHis] honeyed words."
 me_macedon_3_adriatic.102.desc:0 "Emissaries from [me_macedon_scope.GetName] lead by [diplomat_scope.GePraenomen] have arrived in [ROOT.GetCountry.GetCapital.GetName] seeking an audience with [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] and our [ROOT.GetCountry.Custom('get_court_type')].\n\nOn behalf of [me_macedon_scope.GetRulerTitle] [me_macedon_scope.GetRuler.GetPraenomen] of the [me_macedon_scope.GetRuler.GetFamilyDisplayAdjective] dynasty, they offer us friendship and protection in exchange for a strict alliance.\n\nOur councillors weigh up the decision, debating the various merits and flaws of signing up to an alliance at the cost of our diplomatic autonomy."
 me_macedon_3_adriatic.102.b:0 "If they desire our city, they must conquer it."
 me_macedon_3_adriatic.103.desc:0 "Our envoys, lead by a self-satisfied [diplomat_scope.GetPraenomen], have returned from their audience with [me_mac_3_10_scope.GetRulerTitle] [me_mac_3_10_scope.GetRuler.GetPraenomen] and the [me_mac_3_10_scope.Custom('get_court_type')] of [me_mac_3_10_scope.GetName], which formally accepted our gifts and offer of protection.\n\nThis is surely only the commencement of a fruitful relationship of mutual benefit, adding another Greek state to our magnificent symmachy."
 me_macedon_3_adriatic.111.desc:0 "Our glorious successes in the west have proven the needlessness of pursuing eastward expansion in conflict with the ancient Hellenic states and Diadochi kingdoms.\n\nWe will forge a novel HMacedonian kingdom, taking our culture west as Alexander himself bought it east."
 me_macedon_3_adriatic.131.desc:0 "From [GetProvince('(int32)422').GetName] to [GetProvince('(int32)3598').GetName] the sails of [ROOT.GetCountry.GetAdjective] vessels are seen and respected, protecting the arteries of exchange and defending from any who would covet their riches.\n\nWith our strength at sea none would dare challenge our operations in these waters, allowing us to reap the benefits of peaceful transact."
