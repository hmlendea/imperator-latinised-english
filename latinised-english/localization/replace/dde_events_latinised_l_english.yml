l_english:
 dde_hellenistic.1.desc:1 "The [alexander_province.Custom('get_city_type_loc')] of [SCOPE.sP('alexander_province').GetName] is one of the numerous urban centres that was founded by Alexander himself during his famous campaign through Persia. It has grown significantly since its founding, and has kept Alexander's conviction in having people from different faiths and cultures come together to form a new community.\n\nThough clashes, conflicts and miscommunication occasionally occur between the Greeks, Persians and others, they have learned to get along with one another. The city has started to build up infrastructure and administration better built to serve their diverse populace, to a greater degree than most of our other urban centres."
 dde_hellenistic.1.b:0 "The knowledge acquired in this city will spread beyond its walls."
 dde_hellenistic.2.a.desc:2 "A new wiseman has become renowned among our citizens in the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetName]. Now they have started to look to him for guidance in their daily lives, following his teachings and ideals.\n\nThe philosopher is specialising in teaching the minor nobles and rich citizens of the city concerning the virtues, and asserts that he provides them the education they need to lead our nation forward in the coming years."
 dde_hellenistic.2.b.desc:1 "A new wiseman has become renowned among our citizens in the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetName]. Now they have started to look to him for guidance in their daily lives, following his teachings and ideals.\n\nThe philosopher asserts pleasure is and should be the ultimate goal for everyone, debunking the relevancy of virtuous behaviour. We have seen a developing cult of hedonism in the wake of the philosopher, pursuing the physical pleasures of life."
 dde_hellenistic.2.c.desc:1 "A new wiseman has become renowned among our citizens in the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetName]. Now they have started to look to him for guidance in their daily lives, following his teachings and ideals.\n\nThe philosopher espouses a life of balance in all things, discovering the correct amount of diligence to slothfulness, temperance to hedonism or zeal to cynicism. In addition, the philosopher has shown respect and become friends with a lot of the researchers living in the city."
 dde_hellenistic.2.d.desc:1 "A new wiseman has become renowned among our citizens in the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetName]. Now they have started to look to him for guidance in their daily lives, following his teachings and ideals.\n\nThe philosopher asserts pleasure in the form of elimination of pain from our daily lives should be the goal for our society. Though they might come across as hedonistic, the philosopher has shown to be surprisingly ascetic and giving up a lot of the desires one usually see in their type."
 dde_hellenistic.2.e.desc:1 "A new wiseman has become renowned among our citizens in the [country_province.Custom('get_city_type_loc')] of [SCOPE.sP('country_province').GetName], [SCOPE.sP('country_province').GetState.GetName]. Now they have started to look to him for guidance in their daily lives, following his teachings and ideals.\n\nThe philosopher asserts people should live in accordance with nature, and that virtue is the only good ideal in anyone's lives. Tossing aside the avarice for material wealth, his followers has focused all their efforts on becoming truly exemplary individuals."
 dde_hellenistic.3.desc:1 "The legacy of Alexander still lingers in our nation, where the numerous Greco-$persia$ urban centres are struggling to find a way to deal with their culturally and religiously diverse populations. The latest of these issues has risen in [SCOPE.sP('country_province').GetName], where the Hellenic and [province_culture.GetName] populations refuse to interact with one another.\n\nIf we choose to invest our resources in attempting to fix the issues in [SCOPE.sP('country_province').GetName], perhaps it can prove to be an example for some of our other urban centres struggling with the same issues?"
 dde_hellenistic.3.a:0 "We will assist them in resolving these issues."
 dde_hellenistic.4.desc:0 "We have an increase in [SCOPE.sCountry('random_neighbor').GetAdjective] merchants visiting our urban centres, from the frontiers and all the way to [ROOT.GetCountry.GetCapital.GetName]. Bringing exotic wares and goods from afar, they have acquired some fame and repute among our own citizenry.\n\nCarrying a surprising amount of wealth with them, we could simply obtain what they have and be rid of them. Or this could be an opportunity to improve our relations with our neighbour."
 dde_hellenistic.4.b:0 "Acquire their valuables, then toss them out of [ROOT.GetCountry.GetName]."
 dde_hellenistic.5.desc:0 "There has been a lot of labour to prepare city games in our capital, [ROOT.GetCountry.GetCapital.GetName]. With only a few days left prior to it commencing, they have started looking to us for some aid in financially supporting them, so it could be even grander than originally planned. If we assist them, we are sure to acquire some fame among the general populace."
 dde_hellenistic.6.desc:0 "We have rumours that one of the fabled Silver Shields, the backbone of Alexander's army, has been seen travelling through [ROOT.GetCountry.GetCapital.GetName]. They have not frequently been seen after they betrayed Eumenes by handing him over to Antigonos, as the unit was divided up and dismissed by the general. They are renowned for their fighting spirit, experience and bravery. "
 dde_hellenistic.6.b:0 "We do not require any of these fossils in [ROOT.GetCountry.GetName]."
 dde_hellenistic.7.desc:0 "It seems some of our merchants was despoiled and murdered as they were travelling through [SCOPE.sCountry('original_country').GetCapital.GetName]. This is just the latest of a long list of insults from [SCOPE.sCountry('original_country').GetName], and our people are up in arms concerning it, requiring compensation.\n\nMaybe it is time to instill some respect in them?"
 dde_hellenistic.7.a:0 "We will recall this."
 dde_hellenistic.8.desc:0 "One of the fabled veterans from the Silver Shields, the backbone of Alexander's army, is requesting a place to stay in [ROOT.GetCountry.GetName]. They have not frequently been seen after they betrayed Eumenes by handing him over to Antigonos, as the unit was divided up and dismissed by the general. It seems [SCOPE.sCharacter('silver_shield_character').GetName] was banished from [SCOPE.sCountry('original_country').GetName]."
 dde_hellenistic.9.desc:0 "It seems our merchants have been treated surprisingly satisfactorily as they have been travelling through [SCOPE.sCountry('original_country').GetCapital.GetName]. Though we have had our shares of disagreements, it seems this is a chance for newfound friendship between our two nations."
