l_english:
 dip_friends_rivals.2.desc:0 "We have received an envoy sent by [SCOPE.sC('friend_asking_country').GetRulerTitle] [SCOPE.sC('friend_asking_country').GetRuler.GetName], ruler of our ally [SCOPE.sC('friend_asking_country').GetName]; [SCOPE.sC('friend_asking_country').GetRuler.GetSheHe] offers our ruler, [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen], [SCOPE.sC('friend_asking_country').GetRuler.GetHerHis] personal friendship.\n\nThere is no doubt that robust connections ensure dependable allies..."
 dip_friends_rivals.2.b:0 "We don't require their friendship."
 dip_friends_rivals.4.b:0 "We don't require their friendship."
 dip_friends_rivals.6.desc:0 "We have received an envoy sent by [SCOPE.sC('friend_asking_country').GetRulerTitle] [SCOPE.sC('friend_asking_country').GetRuler.GetName], ruler of our neighbour [SCOPE.sC('friend_asking_country').GetName]; [SCOPE.sC('friend_asking_country').GetRuler.GetSheHe] offers our ruler, [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], [SCOPE.sC('friend_asking_country').GetRuler.GetHerHis] personal friendship.\n\nPerhaps our interests are more closely aligned than we thought..."
 dip_friends_rivals.6.b:0 "We don't require their friendship."
 dip_friends_rivals.8.b:0 "We don't require their friendship."
 dip_friends_rivals.9.desc:0 "Our relationship with [SCOPE.sC('rival_ruler_country_scope').GetName] has been placed under a considerable deal of strain by the rivalry of our leader [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] with the [SCOPE.sC('rival_ruler_country_scope').GetAdjective] ruler [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nNeither potentate wants to give their adversary the satisfaction of having been forced to concede and defuse the situation for fear of looking weak, while our people pursue the insulting stance of [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetPraenomen] with growing fury.\n\nWe can either permit relations to fracture further under the requirements of the masses or purchase good will with some wounded pride and a silver tongue."
 dip_friends_rivals.10.desc:1 "The rivalry between our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] and [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName] of neighbouring [SCOPE.sC('rival_ruler_country_scope').GetName] is having rather more influence on our foreign policy than some in the government might have liked.\n\nLocal garrisons have been skirmishing along the frontier between our [border_friction_friendly_province.Custom('get_city_type_loc')] [SCOPE.sP('border_friction_friendly_province').GetName] and the [SCOPE.sC('rival_ruler_country_scope').GetAdjective] [border_friction_enemy_province.Custom('get_city_type_loc')] of [SCOPE.sP('border_friction_enemy_province').GetName] in [SCOPE.sP('border_friction_enemy_province').GetState.GetShortName]. No one knows who started the standoff, but all involved energetically defend their leadership with each side becoming more brazen and aggressive by the day.\n\nSome advisors argue we use this situation to justify an invasion of the [SCOPE.sC('rival_ruler_country_scope').GetAdjective] cities in the province of [SCOPE.sP('border_friction_enemy_province').GetState.GetShortName], while others urge the fervor displayed by our soldiers would be more useful channelled in another location..."
 dip_friends_rivals.10.at:0 "We will assert all territories in the [SCOPE.sP('border_friction_enemy_province').GetState.GetName] owned by [SCOPE.sC('rival_ruler_country_scope').GetName] (@[THIS.GetCountry.GetFlag]!)."
 dip_friends_rivals.11.desc:0 "Lately the attention of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] has been focused on [ROOT.GetCountry.GetRuler.GetHerHis] rival the [SCOPE.sC('rival_ruler_country_scope').GetAdjective] [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle], [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName]. Our shared frontier with [SCOPE.sC('rival_subject_country_scope').GetName], a subject state of [SCOPE.sC('rival_ruler_country_scope').GetName], gives us a unique opportunity to undermine the [SCOPE.sC('rival_ruler_country_scope').GetAdjective] position indirectly.\n\nThere are a number of ways we could approach this depending on what we want to achieve. [SCOPE.sC('rival_subject_country_scope').GetAdjective] security is sure to be far more relaxed than their overlord's, and we could feasibly infiltrate their capital. Once that is achieved, it shouldn't be difficult to incite the people's fury at being slaves to the will of [SCOPE.sC('rival_ruler_country_scope').GetName]. Alternatively, we could attempt to win over the [SCOPE.sC('rival_subject_country_scope').GetName] ruler, [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName] and turn [SCOPE.sC('rival_subject_country_scope').GetRuler.GetHerHim] against [SCOPE.sC('rival_subject_country_scope').GetRuler.GetHerHis] master, or simply reveal the laughable ease with which we can come and go as we please thereby provoking a crisis of confidence..."
 dip_friends_rivals.12.desc:1 "The rivalry between our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] and the overlord of neighbouring [SCOPE.sC('rival_subject_country_scope').GetName], [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName] of [SCOPE.sC('rival_ruler_country_scope').GetName], is having rather more influence on our foreign policy than some in the government might like.\n\nLocal garrisons have been skirmishing along the frontier between our [border_friction_friendly_province.Custom('get_city_type_loc')] [SCOPE.sP('border_friction_friendly_province').GetName] and the [SCOPE.sC('rival_subject_country_scope').GetAdjective] [border_friction_enemy_province.Custom('get_city_type_loc')] of [SCOPE.sP('border_friction_enemy_province').GetName] in [SCOPE.sP('border_friction_enemy_province').GetState.GetShortName]. No one knows who started the standoff, but all involved energetically defend their leadership with each side becoming more brazen and aggressive by the day.\n\nSome advisors argue we use this situation to justify an invasion of the [SCOPE.sC('rival_subject_country_scope').GetAdjective] cities in the province of [SCOPE.sP('border_friction_enemy_province').GetState.GetShortName], while others urge the fervor displayed by our soldiers would be more useful channelled in another location..."
 dip_friends_rivals.12.at:0 "We will assert all territories in the [SCOPE.sP('border_friction_enemy_province').GetState.GetName] owned by [SCOPE.sC('rival_subject_country_scope').GetName] (@[THIS.GetCountry.GetFlag]!)."
 dip_friends_rivals.13.desc:2 "The open hostility of our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] to [ROOT.GetCountry.GetRuler.GetHerHis] rival, the neighbouring [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName] of [SCOPE.sC('rival_ruler_country_scope').GetName] has opened up some avenues of diplomacy that might to the contrary escape contemplation.\n\nThe foreign leader has subjects in the hinterland [pop_friction_enemy_province.Custom('get_city_type_loc')] of [SCOPE.sP('pop_friction_enemy_province').GetName] who share our language and customs, and thus by rights should be subjects of [SCOPE.sC('from_rival_ruler_country').GetName]. If we were to dispatch some good men to steal across the frontier in [SCOPE.sP('pop_friction_enemy_province').GetState.GetShortName] there is no doubt that at least some of these communities could be persuaded to migrate to the proximate [ROOT.GetCountry.GetAdjective] [pop_friction_friendly_province.Custom('get_city_type_loc')] of [SCOPE.sP('pop_friction_friendly_province').GetName]..."
 dip_friends_rivals.14.desc:2 "The open hostility of our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] to [ROOT.GetCountry.GetRuler.GetHerHis] rival [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName] of [SCOPE.sC('rival_ruler_country_scope').GetName], the overlord of our neighbour [SCOPE.sC('rival_subject_country_scope').GetName], has opened up some avenues of diplomacy that might to the contrary escape contemplation.\n\nThere are communities in the [SCOPE.sC('rival_subject_country_scope').GetAdjective] hinterland [pop_friction_enemy_province.Custom('get_city_type_loc')] of [SCOPE.sP('pop_friction_enemy_province').GetName] who share our language and customs, and thus by rights should be subjects of [SCOPE.sC('from_rival_ruler_country').GetName]. If we were to dispatch some good men to steal across the frontier in [SCOPE.sP('pop_friction_enemy_province').GetState.GetShortName] there is no doubt that at least some of these communities could be persuaded to migrate to the proximate [ROOT.GetCountry.GetAdjective] [pop_friction_friendly_province.Custom('get_city_type_loc')] of [SCOPE.sP('pop_friction_friendly_province').GetName]..."
 dip_friends_rivals.16.b:0 "Have [SCOPE.sC('friend_asking_country').GetRuler.GetHerHim] share some sagacity with us."
 dip_friends_rivals.16.c:0 "Request [SCOPE.sC('friend_asking_country').GetRuler.GetHerHim] for funds."
 dip_friends_rivals.16.d:0 "We require nothing from [SCOPE.sC('friend_asking_country').GetRuler.GetHerHim]..."
 dip_friends_rivals.18.b:0 "Have [SCOPE.sC('friend_asking_country').GetRuler.GetHerHim] share some sagacity with us."
 dip_friends_rivals.18.c:0 "Request [SCOPE.sC('friend_asking_country').GetRuler.GetHerHim] for funds."
 dip_friends_rivals.18.d:0 "We require nothing from [SCOPE.sC('friend_asking_country').GetRuler.GetHerHim]..."
 dip_friends_rivals.20.desc:0 "[SCOPE.sC('friend_asking_country').GetRulerTitle] [SCOPE.sC('friend_asking_country').GetRuler.GetName], ruler of [SCOPE.sC('friend_asking_country').GetName] and personal friend of our leader [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], has approached us offering a gift assist us in our time of need.\n\n[SCOPE.sC('friend_asking_country').GetRuler.GetHerHis|U] envoy explains that we need only request and [SCOPE.sC('friend_asking_country').GetRuler.GetSheHe] will go to every effort to see our request delivered immediately."
 dip_friends_rivals.20.a:0 "We require men."
 dip_friends_rivals.20.b:0 "We require counsel."
 dip_friends_rivals.20.c:0 "We require funds."
 dip_friends_rivals.20.d:0 "We require nothing..."
 dip_friends_rivals.21.desc:2 "The rivalry between our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] and the [from_rival_ruler_country.GetAdjective] ruler [from_rival_ruler_country.GetRuler.GetName] has lead to a complete diplomatic breakdown between our nations.\n\nTheir hostility had already been causing issues for our diplomatic and commercial efforts with [from_rival_ruler_country.GetName] for some time, to the disadvantage of us both, but it seems that the ever petulant [from_rival_ruler_country.GetRuler.GetPraenomen] has decided to further exacerbate the situation with insults and menaces..."
 dip_friends_rivals.22.at:0 "[SCOPE.sC('from_rival_ruler_country').GetName] obtain claims on all our provinces in the [SCOPE.sP('border_friction_enemy_province').GetState.GetName].\nWe forfeit #R 50#! opinion of [SCOPE.sC('from_rival_ruler_country').GetName] (@[THIS.GetCountry.GetFlag]!)"
 dip_friends_rivals.23.desc_1:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our country. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our sovereign's ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents carefully and deliberately ensured the people discovered the ease with which they managed to penetrate our urban centres and even our very government, spreading information they could only have learned from the attendants of the [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetHerHim]self.\n\nThis has caused a crisis of confidence in the capital, with the incompetence of our security undermining confidence in the government..."
 dip_friends_rivals.23.desc_2:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our subject [SCOPE.sC('rival_subject_country_scope').GetName]. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents carefully and deliberately ensured the [SCOPE.sC('rival_subject_country_scope').GetAdjective] people discovered the ease with which they managed to penetrate their urban centres and even their very government, spreading information they could only have learned from the attendants of the [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetHerHim]self.\n\nThis has caused a crisis of confidence in the [SCOPE.sC('rival_subject_country_scope').GetName] capital, with the incompetence of their security undermining confidence in the government..."
 dip_friends_rivals.23.desc_3:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our country. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our sovereign's ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents planted countless, numerous unrepeatable, lies in the minds of the people, relating to the subjection of the submissive ruler [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName] and nation to the will and whims of [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetPraenomen].\n\nThis has stirred up a considerable deal of discontent within [SCOPE.sC('rival_subject_country_scope').GetName]; our citizens are complaining of the disgraceful situation into which their leaders have taken them, and which their ancestors would never have tolerated..."
 dip_friends_rivals.23.desc_4:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our subject [SCOPE.sC('rival_subject_country_scope').GetName]. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents planted countless, numerous unrepeatable, lies in the minds of their people, relating to the subjection of their submissive ruler [SCOPE.sC('rival_subject_country_scope').GetRuler.GetPraenomen] and nation to the will and whims of [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetPraenomen].\n\nThis has stirred up a considerable deal of discontent within [SCOPE.sC('rival_subject_country_scope').GetName]; their citizens are complaining of the disgraceful situation into which their leaders have taken them, and which their ancestors would never have tolerated..."
 dip_friends_rivals.23.desc_5:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our country. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our sovereign's ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope.')GetRuler.GetName].\n\nThe agents were weighed down with bribes and gifts for [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName], and entered into clandestine talks where they reportedly flattered and wooed our ruler with the aim of undermining [SCOPE.sC('rival_subject_country_scope').GetRuler.GetHerHis] loyalty to our overlord, [SCOPE.sC('rival_ruler_country_scope').GetName].\n\nIt seems to have accomplished the trick to say the least, and the [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] seems much convinced of the virtues and vices of [SCOPE.sC('from_rival_ruler_country').GetName] and [SCOPE.sC('rival_ruler_country_scope').GetName] respectively..."
 dip_friends_rivals.23.desc_6:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our subject [SCOPE.sC('rival_subject_country_scope').GetName]. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents were weighed down with bribes and gifts for [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName], and entered into clandestine talks where they reportedly flattered and wooed our subject's ruler with the aim of undermining [SCOPE.sC('rival_subject_country_scope').GetRuler.GetHerHis] loyalty to us.\n\nIt seems to have accomplished the trick to say the least, as reportedly the [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] seems much convinced of the respective virtues and vices of [SCOPE.sC('from_rival_ruler_country').GetName] and [SCOPE.sC('rival_ruler_country_scope').GetName]..."
 dip_friends_rivals.23.desc_7:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our country. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our sovereign's ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents were sent to affirm the personal friendship of [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetPraenomen] and [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName], and entered into clandestine talks where they reportedly discussed the necessity to break the [SCOPE.sC('from_rival_ruler_country').GetAdjective] yolk; clearly they aimed to undermine our loyalty to our overlord.\n\nIt seems to have accomplished the trick to say the least, as [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] seems much convinced of the respective virtues and vices of [SCOPE.sC('from_rival_ruler_country').GetName] and [SCOPE.sC('rival_ruler_country_scope').GetName]..."
 dip_friends_rivals.23.desc_8:0 "We have just learned that a group of spies from [SCOPE.sC('from_rival_ruler_country').GetName] successfully infiltrated our subject [SCOPE.sC('rival_subject_country_scope').GetName]. They were sent by [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], no doubt as a result of [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] rivalry with our ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName].\n\nThe agents were sent to affirm the personal friendship of [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetPraenomen] and [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName], and entered into clandestine talks where they reportedly discussed the necessity to break the [SCOPE.sC('from_rival_ruler_country').GetAdjective] yolk; clearly they aimed to undermine our subject's loyalty to us.\n\nIt seems to have accomplished the trick to say the least, as reportedly the [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] seems much convinced of the respective virtues and vices of [SCOPE.sC('from_rival_ruler_country').GetName] and [SCOPE.sC('rival_ruler_country_scope').GetName]..."
 dip_friends_rivals.24.desc_1:0 "Our overlord's ruler, [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName], and [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetHerHis] rivalry with the [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] of [SCOPE.sC('from_rival_ruler_country').GetName], [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], has embroiled us in clashes along our frontier with the [SCOPE.sC('from_rival_ruler_country').GetAdjective] menace.\n\nGarrisons from both sides have been involved in increasingly aggressive stand-offs in [SCOPE.sP('border_friction_enemy_province').GetState.GetShortName], between our city [SCOPE.sP('border_friction_enemy_province').GetName] and [SCOPE.sP('border_friction_friendly_province').GetName] in [SCOPE.sC('from_rival_ruler_country').GetName].\n\n[SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName] has used this situation to justify escalating the tension in the area, and has revealed [SCOPE.sC('from_rival_ruler_country').GetRuler.GetHerHis] aggressive intentions by claiming the province for [SCOPE.sC('from_rival_ruler_country').GetName]..."
 dip_friends_rivals.24.at:0 "[SCOPE.sC('from_rival_ruler_country').GetName] obtain claims on all our provinces in the [SCOPE.sP('border_friction_enemy_province').GetState.GetName].\nWe and [SCOPE.sC('rival_ruler_country_scope').GetName] forfeit #R 50#! opinion of [SCOPE.sC('from_rival_ruler_country').GetName] (@[THIS.GetCountry.GetFlag]!)"
 dip_friends_rivals.24.bt:0 "[SCOPE.sC('from_rival_ruler_country').GetName] obtain claims on all provinces of our subject [SCOPE.sC('rival_subject_country_scope').GetName] in the [SCOPE.sP('border_friction_enemy_province').GetState.GetName].\nWe and [SCOPE.sC('rival_subject_country_scope').GetName] forfeit #R 50#! opinion of [SCOPE.sC('from_rival_ruler_country').GetName] (@[THIS.GetCountry.GetFlag]!)"
 dip_friends_rivals.25.desc:1 "The brazen rival of our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen], neighbouring [SCOPE.sC('from_rival_ruler_country').GetAdjective] [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetPraenomen], has overseen a clandestine raid across our frontier in [SCOPE.sP('pop_friction_enemy_province').GetState.GetShortName].\n\nThe aim seems to have been to persuade [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName] communities in [SCOPE.sP('pop_friction_enemy_province').GetName] to migrate to [SCOPE.sP('pop_friction_friendly_province').GetName] in [SCOPE.sC('from_rival_ruler_country').GetName], so that they might be ruled by their own people rather than [ROOT.GetCountry.GetPrimaryCulture.GetName] foreigners.\n\nThe [SCOPE.sC('from_rival_ruler_country').GetAdjective] party managed to persuade a portion of the [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName] population, who have now abandoned their lives in [ROOT.GetCountry.GetName]..."
 dip_friends_rivals.25.at:0 "[SCOPE.ScriptValue('province_pop_friction_size_svalue_1')|0] #H [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName]#! pops have moved from #Y [SCOPE.sP('pop_friction_enemy_province').GetName]#! to #Y [SCOPE.sP('pop_friction_friendly_province').GetName]#! in [SCOPE.sC('from_rival_ruler_country').GetName].\nWe forfeit #R 50#! opinion of [SCOPE.sC('from_rival_ruler_country').GetName] (@[THIS.GetCountry.GetFlag]!)"
 dip_friends_rivals.26.desc_1:2 "The brazen rival of our overlord's ruler [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle] [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName], neighbouring [SCOPE.sC('from_rival_ruler_country').GetAdjective] [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetName], has overseen a clandestine raid across our frontier in [SCOPE.sP('pop_friction_enemy_province').GetState.GetShortName].\n\nThe aim seems to have been to persuade [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName] communities in our city [SCOPE.sP('pop_friction_enemy_province').GetName] to migrate to the [pop_friction_friendly_province.Custom('get_city_type_loc')] of [SCOPE.sP('pop_friction_friendly_province').GetName] in [SCOPE.sC('from_rival_ruler_country').GetName], so that they might be ruled by their own people rather than [ROOT.GetCountry.GetPrimaryCulture.GetName] foreigners.\n\nTheir party managed to persuade a portion of the [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName] population, who have now abandoned their lives in [ROOT.GetCountry.GetName]..."
 dip_friends_rivals.26.desc_2:1 "The brazen rival of our ruler [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen], [SCOPE.sC('from_rival_ruler_country').GetAdjective] [SCOPE.sC('from_rival_ruler_country').GetRulerTitle] [SCOPE.sC('from_rival_ruler_country').GetRuler.GetPraenomen], has overseen a clandestine raid across their frontier with our subject [SCOPE.sC('rival_subject_country_scope').GetName] in [SCOPE.sP('pop_friction_enemy_province').GetState.GetShortName].\n\nThe aim seems to have been to persuade [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName] communities in our subject's territory of [SCOPE.sP('pop_friction_enemy_province').GetName] to migrate to [SCOPE.sP('pop_friction_friendly_province').GetName] in [SCOPE.sC('from_rival_ruler_country').GetName], so that they might be ruled by their own people rather than [ROOT.GetCountry.GetPrimaryCulture.GetName] foreigners.\n\nTheir party managed to persuade a portion of the [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName] population, who have now abandoned their lives in [SCOPE.sC('rival_subject_country_scope').GetName]..."
 dip_friends_rivals.26.at:0 "[SCOPE.ScriptValue('province_pop_friction_size_svalue_1')|0] #H [SCOPE.sC('from_rival_ruler_country').GetPrimaryCulture.GetName]#! pops have moved from #Y [SCOPE.sP('pop_friction_enemy_province').GetName]#! to #Y [SCOPE.sP('pop_friction_friendly_province').GetName]#! in [SCOPE.sC('from_rival_ruler_country').GetName].\nWe and [SCOPE.sC('rival_ruler_country_scope').GetName] and forfeit #R 50#! opinion of [SCOPE.sC('from_rival_ruler_country').GetName] (@[THIS.GetCountry.GetFlag]!)"
