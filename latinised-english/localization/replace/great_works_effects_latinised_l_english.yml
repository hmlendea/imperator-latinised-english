l_english:
 gw_effect_army_breeding:0 "A Robust Population"
 gw_effect_civilization_builder_DESC:0 "A population without culture is merely a mockery of the splendour it tries to replicate. The substance that we find within our ways of life, our unique expression of arts, philosophy, science and faith, is what elevates us as a nation above beast and men. "
 gw_effect_culture_expansion_DESC:0 "Our civilisation is constructed on the unification of our beliefs and culture. Together as one people and one nation, we develop and prosper, and welcome those who wish to join in our midst to learn our way of life.  "
 gw_effect_civil_engineering_DESC:0 "Resting on the bedrock of our scientific advancements, we construct our urban centres with temples reaching for the sky, aqueducts carrying our life-giving water, and theatres to entertain our masses, as we etch ourselves into history of for generations to come."
 gw_effect_martial_science_doctrine_DESC:0 "A monument to our persistent scholars and their life achievements in advancing our insights into the art of conflict, conquest and glory."
 gw_effect_governing_doctrine_DESC:0 "A well-kept garden flourishes, and so too are our provinces kept thriving by the arduous labour of our seasoned governors and their endless toil, bringing our nation and people into prosperity and fortune."
 gw_effect_noble_pop_doctrine_DESC:0 "In honour of our glorious leaders: the role models of our cultural values, and the pinnacle of our civilisation, from which the ideals of our nation have sprung."
 gw_effect_citizen_pop_doctrine_DESC:0 "In honour of our exalted citizens: their acute intellects, pious minds and loyal demeanour, from which flows forth our culture and legend, which tower over our peers'."
 gw_effect_freemen_pop_doctrine_DESC:0 "In honour of our adamant freemen: their relentless courage, loyal demeanour, and proud ancestors: which our nation relies upon for our freedom and sovereignty."
 gw_effect_tribesmen_pop_doctrine_DESC:0 "In honour of our fearless tribesmen: their courageous demeanour, unyielding determination, and esteemed ancestry, from which we ascend, driving our adversaries before us, claiming their territories as we conquer."
 gw_effect_slaves_pop_doctrine_DESC:0 "In honour of our capable workforce: their unyielding determination, robust minds and obedient demeanour, from which our towns, temples and forts have risen to the admiration and awe of our subjects, allies, peers and rivals alike."
 gw_effect_expanding_population_DESC:0 "Our people remain robust and we are thriving; this is our home and where we belong. From here we will develop and prosper: to construct on our traditions and disseminate our legacy across the world."
 gw_effect_diplomatic_range_DESC:0 "Our reach shall extend beyond the horizon to be felt in every nook and corner of the world. All underneath our influence shall admire our magnificent nation, and fear our unstoppable power as we acquire control over our domains."
 gw_effect_overlord_boost_DESC:0 "May we remain united with those who assemble under our leadership: together we shall shape our nation into glory and legend, relying on our tireless devotion to the coalition from which our golden age is built."
 gw_effect_conquerer_doctrine_DESC:0 "Our path is laid out prior to us. Woe the enemy that stand in our way on our road to conquest. Shoulder to shoulder, shield linked to shield, men with iron in their hearts and victory before them will bring triumph to our glorious nation."
 gw_effect_siege_doctrine_DESC:0 "With the ingenious minds of our sappers, scientists and engineers, there are no walls we are unable to fracture, deserts we are unable to traverse or famine we will not be able to endure."
 gw_effect_army_breeding_DESC:0 "Our people remain robust, for we are numerous. From our masses we ascend as a nation and in our midst we flourish as we develop our vigour and power."
 gw_effect_army_logistics_DESC:0 "Logistics is the backbone of any army, for without it neither man nor beast shall reach the field of battle, as hunger and famine take their toll long prior to sword or arrow decides their fates."
 gw_effect_cohort_drill_doctrine_DESC:0 "A sword is only as good as the man who employs it, and a thousand men are only as good as the general who leads them. With our hard-earned experience and knowledge of shaping sheep into lions, we provide both."
 gw_effect_navy_drill_doctrine_DESC:0 "Hard-earned grit, from the unrelenting sea-salt, savage storms, and scorching sun, has shaped us into fearsome mariners and the chosen of the seas."
 gw_effect_defense_doctrine_DESC:0 "To those who maintain us secure from our enemies: we salute you! To those with intent to despoil, rob, and bring ruin to our territories: here you shall find naught but famine, demise, and defeat."
 gw_effect_retaliation_doctrine_DESC:0 "Select your battles wisely so that you may live to fight another day. "
 gw_effect_efficient_forts_DESC:0 "For those who remain guard via the night: we honour you and your vigilant watch against those who wish to bring us harm and suffering."
 gw_effect_omen_doctrine_DESC:0 "Studying the signs surrounding us, we comprehend the paths of fate, and learn how we can move in the direction of our brightest future."
 gw_effect_for_the_masses_DESC:0 "A nation is only as good as its people. We, having the most exceptional people of any nation, excel as a society: constructed by our capable workforce, protected by our adamant armies, cultivated by our scholars and led by our fearless leaders. Glory to us all!"
 gw_effect_strong_admirals_DESC:0 "To the protectors of our coasts, harbours and commerce: we owe an everlasting debt of gratitude for your loyal service and daring enterprises to keep our shorelines safe from foreign harm."
 gw_effect_resilient_at_sea_DESC:0 "In honour of our prolonged traditions of mastering the sea, shaping generations of seasoned men who tenaciously endure the hardships of raging storms and blistering sun. We remain humbled in gratitude."
