l_english:
 me_greek_1_black_sea.4.desc:0 "While Pontos Euxinos may have originally have been a jesting misnomer, our success has made this barbarian lake considerably safer and more prosperous than it has ever been.\n\nWith the pirates reined in and commerce booming, these waters finally live up to their name."
 me_greek_1_black_sea.5.desc:0 "The rapid expansion has put us in a position to dominate the entire Pontos Euxinos and transform it from a barbarian backwater into a Hellenic hub.\n\nWe must continue our momentum and ensure the success of all those urban centres we have spent so many resources acquiring."
 me_greek_1_black_sea.6.desc:1 "The merchants dispatched by [gm_family_head_1.GetPraenomen] have returned with a list of possible harbours we may be able to purchase the use of.\n\nThey also indicate what we would need to offer to whet the current owner's appetites, if it is possible at all."
 me_greek_1_black_sea.6.b:0 "We hear favourable things about [gm_1_bartering_scope_2.GetOwner.GetAdjective] [gm_1_bartering_scope_2.GetName]."
 me_greek_1_black_sea.6.h:0 "This is not meritorious."
 me_greek_1_black_sea.6.tt:0 "We will offer to buy #Y [gm_1_barter_target_territory.GetName]#! from [gm_1_barter_target_territory.GetOwner.GetName] for #R -[SCOPE.ScriptValue('gm_1_barter_territory_value')]#! @gold!\nThe chance of acceptance is influenced by the Charisma of #Y [gm_family_head_1.GetPraenomen]#!, the relative value of the port, and diplomatic opinion. [SCOPE.Custom('gm_1_chance_barter')]\nIf they refuse, we will obtain a Claim on #Y [gm_1_barter_target_territory.GetName]#!"
 gm_1_likely:0 "They are #G probable#! to accept."
 me_greek_1_black_sea.7.bt:0 "If #Y [gm_1_greek_scope.GetName]#! accept, we will receive double the currency in exchange for #Y [gm_1_barter_target_territory.GetName]#! (#G [SCOPE.ScriptValue('gm_1_barter_territory_double_value')]#! @gold!), else they will obtain a Claim."
 me_greek_1_black_sea.7.a:0 "What luck, the fools will make us wealthy!"
 me_greek_1_black_sea.7.ct:0 "[gm_1_greek_scope.GetName] obtains a Claim on #Y [gm_1_barter_target_territory.GetName]#!."
 me_greek_1_black_sea.8.desc_2:0 "with a counter offer presented by the barbarian [gm_1_barter_target_territory.GetOwner.GetRulerTitle], [gm_1_barter_target_territory.GetOwner.GetRuler.GetPraenomen].\n\nThey are prepared to sell us the territories and harbour encircling [gm_1_barter_target_territory.GetName], but require a considerably steeper price in exchange."
 me_greek_1_black_sea.8.desc_3:0 "with a flat refusal from the barbarian [gm_1_barter_target_territory.GetOwner.GetRulerTitle], [gm_1_barter_target_territory.GetOwner.GetRuler.GetPraenomen].\n\nThe letter claims the territory is ancient territory of the [gm_1_barter_target_territory.GetOwner.GetAdjective] people and merits considerably more than any shiny trinkets."
 me_greek_1_black_sea.8.b:0 "Very astute, for barbarous whelps..."
 me_greek_1_black_sea.8.c:0 "...but our original offer was more than equitable!"
 me_greek_1_black_sea.8.d:0 "We possess other, bloodier, means."
 me_greek_1_black_sea.9.desc_1:0 "It seems they were desperate to acquire the territory and the haven it offers to vessels, and accepted our requirements. Our treasury brims with the rewards of our confident dealings!"
 me_greek_1_black_sea.9.a:0 "Are they aware of something we don't?"
 me_greek_1_black_sea.9.b:0 "Those churls best forget all concerning it."
 me_greek_1_black_sea.10.desc:0 "With the acquisition of [gm_hellenic_reclamation_scope.GetName], the [gm_family_head_1.GetFamilyDisplayAdjective] family has sprung at the opportunity to increase its property portfolio.\n\nWhile they played a considerable part in encouraging expansion and ambition in the Pontos Euxinos, others have suggested we give the city its ancient autonomy."
 me_greek_1_black_sea.11.desc:0 "[gm_family_head_1.GetPraenomen] of the [gm_family_head_1.GetFamilyDisplayAdjective]s is organising merchant parties to survey the various barbarian urban centres, assessing their value and the current owner's amiability."
 me_greek_1_black_sea.12.desc_1:0 "We are in a position to extend our influence over the other Euxine colonies who found their own path previously.\n\n"
 me_greek_1_black_sea.12.desc:0 "We can rely upon [gm_family_head_1.GetPraenomen] [gm_family_head_1.GetFamilyDisplayAdjective] to provide us an honest appraisal of the various opportunities available to us - our interests align perfectly."
 me_greek_1_black_sea.13.t:0 "$greek_1_black_sea$: The Ascend of [gm_family_head_1.GetName]"
 me_greek_1_black_sea.13.desc_2:0 "[gm_old_family_head.GetPraenomen] has, via not entirely clear events, passed out of [gm_1_greek_scope.GetName] and is no longer able to conduct our operations.\n\n"
 me_greek_1_black_sea.13.desc_3:0 "It seems [gm_old_family_head.GetPraenomen] is out of luck, and no longer able to serve our cause as a result of being imprisoned.\n\n"
 me_greek_1_black_sea.13.desc_4:0 "[gm_old_family_head.GetSheHe|U] has been replaced by [gm_family_head_1.GetPraenomen], whose family has eclipsed their ancient rivals."
 me_greek_1_black_sea.13.desc_5:1 "[gm_old_family_head.GetSheHe|U] has been replaced by [gm_family_head_1.GetPraenomen], the novel patriarch of the [gm_old_family_head.GetFamilyDisplayAdjective]s."
 me_greek_1_black_sea.13.a:0 "A dependable breed."
 me_greek_1_black_sea.13.b:0 "Novel blood maintains things fresh."
 me_greek_1_black_sea.14.desc:0 "Our recent expansion into novel areas of the Pontos Euxinos has massively increased our ability to control the northern trade routes, just as [gm_family_head_1.GetPraenomen] hoped.\n\n"
 me_greek_1_black_sea.14.desc_1:0 "The ancient colonies of the Bithynian coast will serve as vital strongholds of Hellenic influence on the southern shores."
 me_greek_1_black_sea.14.desc_2:0 "The ancient colonies of Khersonesos are among the richest in the entire region and are sure to bring us magnificent affluence."
 me_greek_1_black_sea.14.desc_3:0 "The ancient colonies of the Getian coasts will ascend once again to prominence as centres of commerce and civilisation."
 me_greek_1_black_sea.14.desc_4:1 "The untapped affluence of Kolchis will at last be open to Hellenic exploitation once again; these ancient ports will be born anew."
 me_greek_1_black_sea.14.tt:0 "The states of the relevant territories have obtained bonuses to commerce and assimilation."
 me_greek_1_black_sea.15.desc:0 "Our sprawling maritime network requires an equally sprawling navy, capable of defending our merchants from raiders, reavers, and rivals.\n\nNow we must decide whether to specialise our squadrons for velocity or survivability."
 me_greek_1_black_sea.15.a:0 "We will render them a force to be reckoned with."
 me_greek_1_black_sea.16.desc:0 "Anyone striving to dominate maritime commerce in the Pontos Euxinos must accept that the Bosporos is key to achieving control.\n\nNow with Io's bridge in our hands, we are the unquestionable hegemons of all commerce flowing east of the Aegean."
 me_greek_1_black_sea.17.desc:1 "We have succeeded in turning [me_gre_1_argo_scope.GetName] into a city to rival any found in the west; a centre of culture; a hub of commerce; a bulwark against barbarians.\n\now there is an opportunity to set a precedent for the city, as either a centre of production or a military core for our far flung holdings."
 me_greek_1_black_sea.18.a:0 "Let us advance towards [gm_1_colony_scope_1.GetName]."
 me_greek_1_black_sea.18.h:0 "Forget it, they are not meritorious."
 me_greek_1_black_sea.18.tt:1 "We will approach #Y [gm_1_colony_target_scope.GetName]#! with an offer of #G [SCOPE.ScriptValue('gm_1_colony_value')]#! @gold! to become our Feudatory.\nThe chance of acceptance is influenced by the Charisma of #Y [gm_family_head_1.GetPraenomen]#!, the relative size of the country, and diplomatic opinion. [SCOPE.Custom('gm_1_chance_colony')]\nIf they refuse, we will obtain a Claim on all [gm_1_colony_target_scope.GetAdjective] territory."
 me_greek_1_black_sea.19.bt:0 "If #Y [gm_1_greek_scope.GetName]#! accept, we will receive double the currency in exchange for becoming their feudatory (#G [SCOPE.ScriptValue('gm_1_colony_double_value')]#! @gold!), else they will gain Claims."
 me_greek_1_black_sea.19.b:0 "We can request more."
 me_greek_1_black_sea.19.ct:0 "[gm_1_greek_scope.GetName] obtains Claims on all our territory."
 me_greek_1_black_sea.20.desc_2:0 "with a counter offer presented by their [gm_1_colony_target_scope.GetRulerTitle], [gm_1_colony_target_scope.GetRuler.GetPraenomen].\n\nThey are prepared to accept our protection and pay tribute, but require a considerably steeper price in exchange."
 me_greek_1_black_sea.20.desc_3:0 "with a flat refusal from their [gm_1_colony_target_scope.GetRulerTitle], [gm_1_colony_target_scope.GetRuler.GetPraenomen].\n\nThe letter claims they are quite capable of defending themselves and the [gm_1_colony_target_scope.GetAdjective] people will not exchange their liberty for lucre."
 me_greek_1_black_sea.20.d:0 "A crying dishonour."
 me_greek_1_black_sea.21.desc_1:0 "It seems they are eager to expand their hold on the Euxine, and accepted our dear requirements!"
 me_greek_1_black_sea.21.desc_2:0 "It seems the cheapskates were ruffled by our requirements, and have decided to retract their 'generous offer of friendship.'"
 me_greek_1_black_sea.21.a:0 "We merit it."
 me_greek_1_black_sea.23.desc:0 "It is to our ancestors and their audacious efforts that the Greeks of the Euxine owe their homes and lives.\n\nIt is to us that they will owe their future security, prosperity, and glory."
 me_greek_1_black_sea.23.a:0 "They will not neglect."
 me_greek_1_black_sea.25.desc:0 "Our brave soldiers and sailors have succeeded in completely destroying the centres of rapine pillage encircling the Pontos Euxinos.\n\nA novel era of peace, maintained by our vigilant navy, will ensure peace and prosperity in the region."
 me_greek_1_black_sea.25.a:0 "Demise to pirates."
 me_greek_1_black_sea.26.desc:0 "The pirates of the Pontos Euxinos were more than happy to accept our bribes, and have already departed for other waters.\n\nTheir novel neighbours might not appreciate it, but our merchants and landowners certainly will!"
 me_greek_1_black_sea.27.desc:0 "Our recruitment of the pirates encircling the Pontos Euxinos has gone swimmingly, with numerous attracted by our pardons and offers of salary.\n\nThere should be no scarcity of dreadful vessels when the need arises."
 me_greek_1_black_sea.27.a:0 "Will they share the spoils?"
 me_greek_1_black_sea.29.desc:0 "A large influx of ne'er do wells and brigands has descended on our ports, establishing themselves in the local area and basing their fleets here.\n\nIt seems the ascending power of [gm_1_greek_scope.GetName] has paid numerous of them to move from the Pontos Euxinos to other waters, and they have found ours suitable..."
 me_greek_1_black_sea.31.desc:0 "Our close contact with our barbarian neighbours has encouraged the resettlement of numerous tribesmen within our borders, who are eager to enrich themselves under our protection."
 me_greek_1_black_sea.31.a:0 "They possess their uses."
 me_greek_2_greece.1.desc_1:0 "For an extended period Greece has been dominated by foreign kings or suffered the menace of invasion by the forces of larger, unified, adversaries."
 me_greek_2_greece.2.desc:0 "For the first time in the history of Greece, all Hellenes are united in one state and the divisions of the past nothing more than a retrogressive memory.\n\nThough there may be struggles ahead, every Greek must see that unity is a vigour we have too long neglected."
 me_greek_2_greece.3.desc:0 "Dispute between democratic, monarchic, and oligarchic governments continues across Greece, each enforcing its traditions on their neighbours and vanquished adversaries.\n\nTo unite Greece the divisions must conclude, by force or by diplomacy, that we can ascend above the chaos caused by Alexandros and his generals."
 me_greek_2_greece.3.at:0 "$me_gre_task_start_tt_2$ policies to disseminate oligarchy."
 me_greek_2_greece.4.desc:0 "[gm_2_family_head_scope.GetPraenomen] has surfaced as the most magnificent proponent of oligarchy, and volunteers [gm_2_family_head_scope.GetHerHis] efforts to advancing our cause.\n\n$me_greek_2_stoke_desc$"
 me_greek_2_greece.4.at:1 "All oligarchies and monarchies in Greece obtain #G 25#! Opinion of [gm_2_greek_scope.GetName].\nThere is a minor chance that $hellenic$ nations may be convinced to change government or become our feudatory in future."
 me_greek_2_greece.5.at:0 "$me_gre_task_start_tt_2$ policies to disseminate democracy."
 me_greek_2_greece.6.desc:0 "[gm_2_family_head_scope.GetPraenomen] has surfaced as the most magnificent proponent of democracy, and volunteers [gm_2_family_head_scope.GetHerHis] efforts to advancing our cause.\n\n$me_greek_2_stoke_desc$"
 me_greek_2_greece.6.at:1 "All non-oligarchic republics in Greece obtain #G 25#! Opinion of [gm_2_greek_scope.GetName].\nThere is a minor chance that $hellenic$ nations in Greece may be convinced to change government or become our tributary in future."
 me_greek_2_greece.7.desc:0 "With the recent reconquests of all parts of the formerly Greek territories, numerous point to [gm_2_greek_scope.GetRuler.GetPraenomen] as the instigator.\n\nAlready the people have begun calling [gm_2_greek_scope.GetRuler.GetHerHim] '$NICKNAME_ELEUTHERIOS$' - the Liberator - and [gm_2_greek_scope.GetRuler.GetHerHis] fame has disseminated throughout [gm_2_greek_scope.GetName] and all Greece."
 me_greek_2_greece.8.desc_4:0 "Our government now debates whether the city should be permitted to continue as our subject, or under our more direct protection..."
 me_greek_2_greece.8.a:0 "[me_gre_2_3_scope.GetName] is secure now."
 me_greek_2_greece.8.c:0 "We will observe [me_gre_2_3_scope.GetName]."
 me_greek_2_greece.8.g:0 "The relationship requires work, that is all."
 me_greek_2_10_op_tt:1 "$hellenic$ countries in Greece will obtain #G 10#! Opinion of [gm_2_greek_scope.GetName]."
 me_greek_2_20_op_tt:1 "$hellenic$ countries in Greece will obtain #G 20#! Opinion of [gm_2_greek_scope.GetName]."
 me_greek_2_greece.9.desc:0 "[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen] grows more brazen in [gm_2_greek_scope.GetRuler.GetHerHis] determination to bring Greece under the leadership of [gm_2_greek_scope.GetName].\n\nIndeed, it is so necessary that [gm_2_greek_scope.GetRuler.GetSheHe] has begun drafting speeches attacking the retrogressive governments of Greece to assemble public support for their invasion."
 me_greek_2_greece.9.a:0 "Robust government must prevail."
 me_greek_2_greece.10.desc:0 "Our emboldened leader, [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen], has prepared a scathing polemic versus the Hellenic governments who stand in the way of Greek unification."
 me_greek_2_greece.10.desc_1:0 "[gm_2_greek_scope.GetRuler.GetHerHis|U] biting words have stirred the populace with a conviction in the necessity for robust government, and the reduction or replacement of the Hellenic democracies."
 me_greek_2_greece.10.desc_2:0 "[gm_2_greek_scope.GetRuler.GetHerHis|U] biting words have stirred the populace with a conviction in the necessity for the liberation of all Greeks, and the destruction of the tyranny and inequality among citizens."
 me_greek_2_greece.10.claim_tt_1:1 "[gm_2_greek_scope.GetName] has obtained claims on all $hellenic$ oligarchies and monarchies in Greece."
 me_greek_2_greece.10.claim_tt_2:1 "[gm_2_greek_scope.GetName] has obtained claims on all $hellenic$ non-oligarchic republics in Greece."
 me_greek_2_greece.10.a:0 "We will fracture them."
 me_greek_2_greece.11.desc:0 "There are other Greek states who share our values and would fit easily into our growing organisation of urban centres.\n\nLike all Greeks they are proud and must be convinced, but it is clear the Greeks are more robust together, even if some must surrender direct control."
 me_greek_2_greece.12.desc:0 "Our diplomatic efforts are over, with our most charismatic delegates being dispatched throughout Greece to attempt to convince the Hellenes of our leadership qualities.\n\n"
 me_greek_2_greece.12.desc_1:0 "The arguments of [gm_2_greek_scope.GetRuler.GetPraenomen] have found some success - we have received a pledge of support from the downtrodden urban centres."
 me_greek_2_greece.12.b:0 "The fools will have to see reason, one method or another."
 me_greek_2_greece.13.desc:0 "While preparing to stir popular support for movements versus the strongholds of poor government, we received word that the last of these imposters had fallen already."
 me_greek_2_greece.14.a:0 "There is invariably something..."
 me_greek_2_greece.17.desc:0 "We have at last managed to recreate something of the Delian naval supremacy, the bases of our allies spanning the Aegean and securing her waters from incursions.\n\nIf we are to remain powerful, we must render our navy as important as our army, maintaining constant vigilance over her quality and readiness."
 me_greek_2_greece.18.desc:0 "The historic urban centres of Greece have been secured, ensuring our paternal position over Greek culture and tradition.\n\nFrom Plato's olive groves to the gates of Thebes; from the Pythia's sanctuary to the hetaira houses of Korinthos."
 me_greek_2_greece.19.desc:0 "Delegates from [gm_2_greek_scope.GetName] have descended on the courts of Greece, entreating all who will hear them to unite their efforts to unify Greece versus common menaces.\n\nThey request a contribution to the defence in Greece in exchange for protection and friendship, though numerous distrust their motives..."
 me_greek_2_greece.19.b:0 "Such arrogance!"
 me_greek_2_greece.20.tt:1 "$hellenic$ countries in Greece have obtained #G 20#! Opinion of [gm_2_greek_scope.GetName]"
 me_greek_2_greece.21.desc:0 "The importance of robust leadership in these trying times cannot be understated, and the Hellenes are sanctified to have [gm_2_greek_scope.GetRuler.GetPraenomen] fighting their corner.\n\n"
 me_greek_2_greece.21.desc_body:0 "The [gm_2_greek_scope.GetRulerTitle] has gone from vigour to vigour, driving the adversaries of [gm_2_greek_scope.GetName] from the field"
 me_greek_2_greece.22.desc:0 "The necessity for soldiers to serve in the Hellenic armies and protect the frontiers and interests of all Greece has never been greater.\n\nNow our politicians put forward a suggestion to better integrate our brother urban centres into our military, to ensure a steady supply of recruits."
 me_greek_2_greece.23.desc:0 "[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen] has completed legislation that will require larger contributions of manpower from our Hellenic subject states.\n\n$me_greek_2_greece_own_good_desc$"
 me_greek_2_greece_own_good_desc:0 "They may not appreciate it, but it is for their own benefit and that of Greeks everywhere."
 me_greek_2_greece.23.a:0 "It is merely the price of liberty..."
 me_greek_2_greece.24.desc:0 "The ever closer integration of our tributaries markets and their contributions to the shared treasury we preside over have led to closer ties than expected.\n\nIt is only natural that we render this cement the novel status quo in order to protect the revenue streams which guarantee our liberties."
 me_greek_2_greece.25.desc:0 "[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen] has completed a novel system of standardised weights and measures that will increase the value obtained from our Greek brothers markets.\n\n$me_greek_2_greece_own_good_desc$"
 me_greek_2_greece.26.desc:0 "The leaders of [gm_2_greek_scope.GetName] have looked to the example of Athens and her maritime empire of tributaries as an example to direct their ambitions.\n\nTheir successes have outstretched even the Delian League, paving the way for future integration and bringing magnificent boons."
 me_greek_2_greece.26.a:0 "Liberty and commerce."
 me_greek_2_greece.27.desc:0 "The leaders of [gm_2_greek_scope.GetName] have looked to the stratagems of the Lacedaemonians and their dominance of the Greek urban centres as an example to direct their ambitions.\n\nOur network of garrisoned urban centres and subjects outstretches any Spartan accomplishments, ensuring the safety of Greece and bringing magnificent boons."
 me_greek_2_greece.28.desc:0 "Our men excitedly advanced on the ancient palace complex of the Argead dynasty, eager to take a share of the lavish spoils.\n\nWith this symbolic gesture, we have demonstrated to the Hellenic world that the time of the savage Macedonian kings is over, and [gm_2_greek_scope.GetName] is the undisputed master of Greece."
 me_greek_2_greece.29.desc_2:0 "They clearly mean to rile the diadochi, and demonstrate to the people of Greece that they are to be trusted as defenders versus foreign monarchs."
 me_greek_2_greece.29.desc_3:0 "It seems the days of Macedonian hegemony in Greece are well and truly over, and [gm_2_greek_scope.GetName] has stepped in to assert their bloodied mantle."
 me_greek_2_greece.29.b:0 "Are we exchanging one cruel master for another?"
 me_greek_2_greece.29.c:0 "The glory they give, in they conclude they take away..."
 me_greek_2_greece.30.desc_1:0 "They offer us their protection in exchange for an alliance and a minor contribution of our countries volunteers to serve in the united armies of Hellas."
 me_greek_2_greece.30.desc_2:0 "They offer us their protection in exchange for a minor tribute which will be remitted into a shared treasury to remit for the defence of all Hellas."
 me_greek_2_greece.31.desc:0 "We have been approached by envoys of the ambitious [gm_2_greek_scope.GetAdjective] state, who seek to unite the Greeks by mending the ancient divisions and disagreements.\n\n"
 me_greek_2_greece.31.b:0 "They should remain out of our affairs!"
 me_greek_2_greece.32.desc:0 "The diplomatic efforts of [gm_2_family_head_scope.GetPraenomen] have paid off! [gm_2_family_head_scope.GetSheHe|U] reports that the [me_gre_2_convinced_scope.GetAdjective] state has agreed to accept our protection in exchange for contributing to the vigour of a united Hellas!"
 me_greek_2_greece.32.a:0 "Very satisfactorily done."
 me_greek_2_greece.33.desc:0 "[gm_2_family_head_scope.GetPraenomen] has brought word that [gm_2_family_head_scope.GetHerHis] efforts to convince Hellenic governments have succeeded in [me_gre_2_convinced_scope.GetName].\n\nAfter much debate, they were convinced that moving in the direction of our style of governance was to the benefit of all Hellas."
 me_greek_2_greece.34.desc:0 "At last all of Greece is united under [gm_2_greek_scope.GetAdjective] leadership, from the island of Kythera to the plains of Thessaly.\n\nThe government has assembled to celebrate this momentous occasion, and decide how the Hellenic world is to be governed..."
 me_greek_2_greece.34.b:0 "The ancient tribes will govern themselves, under our leadership."
 me_greek_2_greece.35.desc:0 "All the necessary administrative preparations are complete, and the novel Hellenic government has taken assumed control of the entirety of Greece.\n\n"
 me_greek_2_greece.35.desc_1:0 "The subject urban centres of Hellas submitted peacefully to our requirements for annexation, integrating their populations under our leadership."
 me_greek_2_greece.35.desc_2:0 "The historic areas of Greece, separated by dialect and culture, have been granted self-government, under the overall leadership of [gm_2_greek_scope.GetName]. In return their armies will serve alongside ours and they will contribute soldiers to the defence of all Greece."
 me_greek_2_greece.35.desc_3:0 "The people of Greece have had to come to terms with the total dominance of our state, bringing each and every city of Greece under the rule of [gm_2_greek_scope.GetName]."
 me_greek_2_greece.35.tt2:0 "[gm_2_greek_scope.GetName] has obtained claims on all Hellenic Areas in the vicinity of Greece."
 me_greek_3_italiote.1.desc:0 "The Greek world has watched the spiraling diadochi conflicts with trepidation, and now Syracuse has revealed its Alexandrine pretensions.\n\nEncouraged by [gm_family_head_3.GetPraenomen], [gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] has grown increasingly passionate concerning [gm_3_greek_scope.GetAdjective] survival and sees themselves as the rallying figure of a novel age for [gm_3_greek_scope.GetName]."
 me_greek_3_italiote.2.desc:0 "Our minor city has succeeded, spurred on all those years ago by the inspirational words of a few patriots, to become the leading power in Magna Graecia and the uniter of the Italiotes. Perhaps this is only the inception, who is aware of what lies ahead for such a robust and wily people?"
 me_greek_3_italiote.3.desc_1:0 "[gm_3_greek_scope.GetName] has seen superior days, and the rapid changing times have revealed the necessity for radical action if our city is to survive."
 me_greek_3_italiote.3.desc_2:0 "For an extended period [gm_3_greek_scope.GetName] has suffered under the rule of [gm_3_greek_scope.GetOverlord.GetName], if our city is to survive we must take radical action."
 me_greek_3_italiote.4.desc_1:0 "[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] was widely praised for [gm_3_greek_scope.GetRuler.GetHerHis] speeches calling [gm_3_greek_scope.GetName] to arms, and has won the support of numerous across the political divide."
 me_greek_3_italiote.4.desc_2:0 "[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] has inspired much discontent versus our overlord with [gm_3_greek_scope.GetRuler.GetHerHis] speeches, and the people cry out for self-government."
 me_greek_3_italiote.4.b:0 "[gm_3_greek_scope.GetName] will be liberated."
 me_greek_3_italiote.5.desc:0 "As in all Italiote urban centres, the heady days of our grandfathers were long forgotten after turmoil and the ascend of the Italic barbarians.\n\nWith our novel initiative, we have at last reinstated our city to magnificence - as far as can be expected - and attracted novel settlers the area."
 me_greek_3_italiote.6.desc:0 "In these turbulent times we are in necessity of a robust unifying idea to assemble our resources and efforts behind as a means of survival.\n\nThe Italiote colonies have seen the mixing of numerous ideas both native and local, and there will be no scarcity of arguments in the coming days."
 me_greek_3_italiote.7.desc:0 "A magnificent debate has been sparked, with all sides arguing the future of the nation relies on a different path.\n\n"
 me_greek_3_italiote.7.desc_1:0 "Our city is known, and quite rightfully, for the skirmishing cavalry tactics we pioneered, and which have been adopted throughout the Hellenic world.\n\n"
 me_greek_3_italiote.7.desc_2:0 "At heart we are a band of wandering sailors, our ancestors fleeing from Ionian, then Corsica, seeking to make a home on the waves.\n\n"
 me_greek_3_italiote.7.desc_6:0 "$me_greek_3_italiote_some_point_desc$ Athens, and encourage mastery of ship building and naval conflict."
 me_greek_3_italiote.7.desc_8:0 "$me_greek_3_italiote_some_point_desc$ Achaea, and encourage aggressive tactics and encouraging recruitment via unity."
 me_greek_3_italiote.7.desc_10:0 "$me_greek_3_italiote_some_point_desc$ Chalkis, and encourage improving our ship building and relying on the vigour of our walls."
 me_greek_3_italiote.7.desc_11:0 "$me_greek_3_italiote_some_point_desc$ Phocis, whose other colonies do well by emphasising ship building living closely with foreign populations."
 me_greek_3_italiote.7.b:0 "We rely upon our wandering navies."
 me_greek_3_italiote.7.e:0 "Our military must be robust."
 me_greek_3_italiote.7.f:0 "The sea is our vigour."
 me_greek_3_italiote.8.desc:0 "The original founders of our city are said to have come principally from [SCOPE.Custom('get_gre_3_metropolis_1')], and in these trying times it has been suggested we attempt to use these ancient connections to our advantage.\n\nOur envoys are ready to depart on their prolonged journey to Greece."
 me_greek_3_italiote.9.desc_1:0 "They happily report that [me_gre_3_13_target.GetName] enthusiastically assented, sending a gift of silver and even agreeing to an alliance! What's more, settlers hearing of our plight have come to locate novel lives in Italia!"
 me_greek_3_italiote.9.desc_2:0 "They report that [me_gre_3_13_target.GetName] sent us a gift in kind, including some settlers eager to start a novel life in Italia, but there was not the outpouring of friendship we might have hoped for."
 me_greek_3_italiote.9.desc_3:0 "They glumly report that [me_gre_3_13_target.GetName] dismissed them brusquely, scorning our requirements for handouts when they are so arduous pressed themselves..."
 me_greek_3_italiote.10.desc:0 "Envoys have arrived from the city [gm_3_greek_scope.GetCapital.GetName], calling on our ancient ties as their mother city. They request aid in these trying times, entreating that we lend whatever assistance we can to our colonial brethren."
 me_greek_3_italiote.10.b:0 "Dispatch them a gift, that is all."
 me_greek_3_italiote.11.desc:0 "[gm_3_greek_scope.GetCapital.GetName], the capital of [gm_3_greek_scope.GetName], is now a bustling city of countless residents, easily a match for any of the ancient urban centres of Greece and numerous other once magnificent urban centres throughout the world."
 me_greek_3_italiote.12.desc:0 "Menaced as [gm_3_greek_scope.GetName] is by outright invasion, [gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] has begun advocating we call on the aid of our Greek brothers, as the Italiote urban centres were wont to do previously.\n\nDebates now discuss which country should be approached."
 me_greek_3_italiote.12.h:0 "We must remain alone."
 me_greek_3_italiote.12.tt:0 "We will request #Y [gm_3_foreign_aid_target.GetName]#! to aid us with troops, funds, and an alliance."
 me_greek_3_italiote.13.desc:0 "The Italiote city state of [gm_3_greek_scope.GetName] has approached us with a message from their [gm_3_greek_scope.GetRulerTitle], [gm_3_greek_scope.GetRuler.GetPraenomen]. The letter entreats us to aid them as fellow Greeks under the menace of destruction."
 me_greek_3_italiote.13.a:0 "Dispatch them all we can."
 me_greek_3_italiote.14.a:0 "Sanctify you, [gm_3_foreign_aid_target.GetRuler.GetPraenomen]!"
 me_greek_3_italiote.14.c:0 "Neglect it, it is hopeless."
 me_greek_3_italiote.14.ct:0 "We will relinquish our requests."
 me_greek_3_italiote.14.d:0 "We must attempt again."
 me_greek_3_italiote.14.dt:0 "We will advance towards another country."
 me_greek_3_italiote.15.desc:0 "There was once an Italiote League in practice rather than on paper; city states who aided each other and acted in common cause.\n\nWith our ascending influence [gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] believes it is time this league became the core of our identity, embracing all Italiotes as fellow citizens."
 me_greek_3_italiote.16.desc:0 "We have succeeded in establishing the Italiote League, though in a considerably more unified version than has ever existed.\n\nWith this step, we lay claim to the leadership of all Italiote Greeks, and thus all Magna Graecia."
 me_greek_3_italiote.16.tt:0 "[gm_3_greek_scope.GetName] obtains claims on all Italiote urban centres."
 me_greek_3_italiote.17.desc:0 "We have at last overcome the Italic tribes of the interior, whose ascend to power shook the Italiote supremacy of our ancestors. May [SCOPE.Custom('gre_mission_3_5_custom_loc')] never ascend again!"
 me_greek_3_italiote.18.desc:0 "We have accomplished the impossible, driving the Italic governments out of southern Italia and securing all of Magna Graecia under Greek rule. We must ensure that Italia remains Greek, for our children, and our children's children."
 me_greek_3_italiote.19.desc:0 "The Greek urban centres in Italia have never been able to develop their native populations to support armies as found in Greece. Instead, a lively commerce in mercenary contracts exists, with numerous Italic fighters pledging their services for glory and spoils."
 me_greek_3_italiote.19.a:0 "We require every man we can obtain."
 me_greek_3_italiote.21.desc:0 "We have played a key role in expanding the power of the Hellenic colonies of Magna Graecia to the point where they need no longer fear the domination of barbarians. Italiotes throughout Magna Graecia rejoice at knowing they are liberated at last!"
 me_greek_3_italiote.22.desc:0 "We have at last staked a claim to the leadership of all Magna Graecia having united, most of its urban centres under our leadership. Already our leader, [gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] is being called 'Omagyrios', the assembler, for uniting the squabbling urban centres of Magna Graecia.\n\nWith a united purpose, the Italiote urban centres can finally contend with the novel menaces of the age by pooling their resources."
 me_greek_3_italiote.24.desc_1:0 "With the strategic connection to Sicily secured, we have deprived the Siceliotes of one of their foremost urban centres and obtained much in the way of commercial opportunities and taxes."
 me_greek_3_italiote.24.desc_2:0 "Our city was originally founded by Iapygians, and we have successfully reconquered the core territories of this Italic tribes-people. By integrating their traditions with our own, we will be able to reap the benefits of their cooperation."
 me_greek_3_italiote.24.desc_3:0 "The Illyrian coastline has been secured in places, providing us with novel avenues for commerce and piracy. The revenues alone should be substantial, and numerous see this as a brave novel era for our people across the waves."
 me_greek_3_italiote.25.desc:1 "The turbulent era of Syracuse is at last over, along with the invasions she inflicted on the Italiote urban centres of $croton_area$. Under our rule, the Siceliotes will come to despise those days as a bitter past compared to our benevolent rule."
 me_greek_3_italiote.25.a:0 "The Siceliotes merited superior."
 me_greek_3_italiote.26.t:0 "$greek_3_italiote$: The Ascend of [gm_family_head_3.GetName]"
 me_greek_3_italiote.26.desc_2:0 "[gm_old_family_head.GetPraenomen] has, via not entirely clear events, passed out of [gm_3_greek_scope.GetName] and is no longer able to conduct our operations.\n\n"
 me_greek_3_italiote.26.desc_3:0 "It seems [gm_old_family_head.GetPraenomen] is out of luck, and no longer able to serve our cause as a result of being imprisoned.\n\n"
 me_greek_3_italiote.26.desc_4:0 "[gm_old_family_head.GetSheHe|U] has been replaced by [gm_family_head_3.GetPraenomen], whose family has eclipsed their ancient rivals."
 me_greek_3_italiote.26.desc_5:0 "[gm_old_family_head.GetSheHe|U] has been replaced by [gm_family_head_3.GetPraenomen], the novel patriarch of the [gm_old_family_head.GetFamilyDisplayAdjective]s."
 me_greek_3_italiote.27.desc:0 "With the creation of a Magna Graecian state, our dreams of becoming the uniter of the Greeks of Italia have been dashed. We will have to locate some other avenue of maintaining our vigour and independence."
 me_greek_3_italiote.27.a:0 "That is not equitable..."
 me_greek_4_west.1.desc:0 "Hellenic fortunes in the west have waned, with more and more colonies falling to local tribes and Punic competition.\n\nIn this climate of gloom, [gm_family_head_4.GetName] has taken the fore as an advocate of an audacious novel age of expansion that will safeguard our city and reverse our luck."
 me_greek_4_west.2.desc:0 "We have done the impossible, surviving the aggressions of both the savages at the gates and the astute Punic merchants. Our empire stretches across the Mediterranean, where countless urban centres depend on our commercial networks for their very survival. Who would have thought we could come so far?"
 me_greek_4_west.3.t:0 "The Ascend of [gm_family_head_4.GetName]"
 me_greek_4_west.3.desc_2:0 "[gm_old_family_head.GetPraenomen] has, via not entirely clear events, passed out of [gm_1_greek_scope.GetName] and is no longer able to conduct our operations.\n\n"
 me_greek_4_west.3.desc_3:0 "It seems [gm_old_family_head.GetPraenomen] is out of luck, and no longer able to serve our cause as a result of being imprisoned.\n\n"
 me_greek_4_west.3.desc_4:0 "[gm_old_family_head.GetSheHe|U] has been replaced by [gm_family_head_4.GetPraenomen], whose family has eclipsed their ancient rivals."
 me_greek_4_west.3.desc_5:0 "[gm_old_family_head.GetSheHe|U] has been replaced by [gm_family_head_4.GetPraenomen], the novel patriarch of the [gm_old_family_head.GetFamilyDisplayAdjective]s."
 me_greek_4_west.5.desc:0 "Lucre tumbles into our laps and the Hellenic commercial outposts flourish under our initiatives, turning the west from a dreary uncivilised frontier into a thriving Hellenic bulwark.\n\nThere is still much to do, and much currency to be made, but it is clear we were correct to take this path at least."
 me_greek_4_west.6.desc:0 "The merchants dispatched by [gm_family_head_4.GetPraenomen] have returned with a list of possible harbours we may be able to purchase the use of.\n\nThey also indicate what we would need to offer to whet the current owner's appetites, if it is possible at all."
 me_greek_4_west.6.b:0 "We hear favourable things about [gm_4_bartering_scope_2.GetOwner.GetAdjective] [gm_4_bartering_scope_2.GetName]."
 me_greek_4_west.6.tt:0 "We will offer to buy #Y [gm_4_barter_target_territory.GetName]#! from [gm_4_barter_target_territory.GetOwner.GetName] for #R -[SCOPE.ScriptValue('gm_4_barter_territory_value')]#! @gold!\nThe chance of acceptance is influenced by the Charisma of #Y [gm_family_head_4.GetPraenomen]#!, the relative value of the port, and diplomatic opinion. [SCOPE.Custom('gm_4_chance_barter')]\nIf they refuse, we will obtain a Claim on #Y [gm_4_barter_target_territory.GetName]#!"
 me_greek_4_west.7.desc:0 "We have been approached by merchants claiming to represent [gm_4_greek_scope.GetName], a city of Hellenic merchants in [gm_4_greek_scope.GetCapital.GetArea.GetRegion.GetName] on the Mediterranean coast.\n\nThey wish to acquire the landing at [gm_4_barter_target_territory.GetName] in exchange for a 'reasonable outlay.'"
 me_greek_4_west.7.bt:0 "If #Y [gm_4_greek_scope.GetName]#! accept, we will receive double the currency in exchange for #Y [gm_4_barter_target_territory.GetName]#! (#G [SCOPE.ScriptValue('gm_4_barter_territory_double_value')]#! @gold!), else they will obtain a Claim."
 me_greek_4_west.7.ct:0 "[gm_4_greek_scope.GetName] obtains a Claim on #Y [gm_4_barter_target_territory.GetName]#!."
 me_greek_4_west.8.desc_2:0 "with a counter offer presented by the barbarian [gm_4_barter_target_territory.GetOwner.GetRulerTitle], [gm_4_barter_target_territory.GetOwner.GetRuler.GetPraenomen].\n\nThey are prepared to sell us the territories and harbour encircling [gm_4_barter_target_territory.GetName], but require a considerably steeper price in exchange."
 me_greek_4_west.8.desc_3:0 "with a flat refusal from the barbarian [gm_4_barter_target_territory.GetOwner.GetRulerTitle], [gm_4_barter_target_territory.GetOwner.GetRuler.GetPraenomen].\n\nThe letter claims the territory is ancient territory of the [gm_4_barter_target_territory.GetOwner.GetAdjective] people and merits considerably more than any shiny trinkets."
 me_greek_4_west.10.desc:0 "With the acquisition of [gm_hellenic_reclamation_scope.GetName], the [gm_family_head_4.GetFamilyDisplayAdjective] family has sprung at the opportunity to increase its property portfolio.\n\nWhile they played a considerable part in encouraging our expansion and ambitions, others have suggested we give the city some autonomy."
 me_greek_4_west.11.desc:0 "[gm_family_head_4.GetPraenomen] of the [gm_family_head_4.GetFamilyDisplayAdjective]s is organising merchant parties to survey the various barbarian urban centres, assessing their value and the current owner's amiability."
 me_greek_4_west.12.desc_1:0 "We are in a position to extend our influence over the other Massalian colonies who found their own path previously.\n\n"
 me_greek_4_west.12.desc:0 "We can rely upon [gm_family_head_4.GetPraenomen] [gm_family_head_4.GetFamilyDisplayAdjective] to provide us an honest appraisal of the various opportunities available to us - our interests align perfectly."
 me_greek_4_west.14.desc:0 "The recent acquisition of novel commercial outposts along the Mediterranean coast has buoyed the aspirations of [gm_family_head_4.GetPraenomen], who is considerably pleased by the increased revenues.\n\n"
 me_greek_4_west.14.desc_2:0 "The outposts of the northern Iberian coast are among the richest in the entire region and are sure to bring us magnificent affluence."
 me_greek_4_west.14.desc_3:0 "The outposts of the eastern Iberian coast will ensure Hellenic influence in the area and a robust commercial network."
 me_greek_4_west.14.desc_4:0 "The outposts of southern Iberia are at last open to Hellenic exploitation and out of Punic hands; these ancient ports will be born anew."
 me_greek_4_west.14.desc_5:0 "Securing the rich Punic outposts of the western Mediterranean will weaken their treasury, and reinforce Hellenic influence in the region."
 me_greek_4_west.14.a:0 "Things are turning about."
 me_greek_4_west.15.desc:0 "Our sprawling maritime network requires an equally sprawling navy, capable of defending our merchants from raiders, reavers, and rivals.\n\nNow we must decide whether to specialise our squadrons for velocity or survivability."
 me_greek_4_west.15.a:0 "We will render them a force to be reckoned with."
 me_greek_4_west.16.desc:0 "We have secured the Pillars of Herakles from the Punic menace and are now the undisputed masters of commerce in the far west. Never again will the Carthaginians dictate who can sail via the straits to their own benefit."
 me_greek_4_west.16.a:0 "We will see how they appreciate it."
 me_greek_4_west.17.desc:0 "The hub of [me_gre_4_hub_scope.GetName] is a thriving commercial port, where merchants from throughout the Mediterranean assemble to barter and peddle their wares.\n\nThis city rivals any found in the east, and could become one of the most important Greek urban centres in the world."
 me_greek_4_west.18.desc:0 "Our merchants bring appraisals from the remaining Massalian colonies who would be anywhere near willing to accept our protection.\n\nHowever, they will probably only accept if they are considerably weaker and trust us."
 me_greek_4_west.18.a:0 "Let us advance towards [gm_4_colony_scope_1.GetName]."
 me_greek_4_west.18.tt:0 "We will approach #Y [gm_4_colony_target_scope.GetName]#! with an offer of #G [SCOPE.ScriptValue('gm_4_colony_value')]#! @gold! to become our Feudatory.\nThe chance of acceptance is influenced by the Charisma of #Y [gm_family_head_4.GetPraenomen]#!, the relative size of the country, and diplomatic opinion. [SCOPE.Custom('gm_4_chance_colony')]\nIf they refuse, we will obtain a Claim on all [gm_4_colony_target_scope.GetAdjective] territory."
 me_greek_4_west.19.bt:0 "If #Y [gm_4_greek_scope.GetName]#! accept, we will receive double the currency in exchange for becoming their feudatory (#G [SCOPE.ScriptValue('gm_4_colony_double_value')]#! @gold!), else they will gain Claims."
 me_greek_4_west.19.ct:0 "[gm_4_greek_scope.GetName] obtains Claims on all our territory."
 me_greek_4_west.20.desc_2:0 "with a counter offer presented by their [gm_4_colony_target_scope.GetRulerTitle], [gm_4_colony_target_scope.GetRuler.GetPraenomen].\n\nThey are prepared to accept our protection and pay tribute, but require a considerably steeper price in exchange."
 me_greek_4_west.20.desc_3:0 "with a flat refusal from their [gm_4_colony_target_scope.GetRulerTitle], [gm_4_colony_target_scope.GetRuler.GetPraenomen].\n\nThe letter claims they are quite capable of defending themselves and the [gm_4_colony_target_scope.GetAdjective] people will not exchange their liberty for lucre."
 me_greek_4_west.21.desc_1:0 "It seems they are eager to expand their influence over all the Phocaeans, and accepted our dear requirements!"
 me_greek_4_west.22.desc:0 "The legendary port of Olisipo has been a far off dream of merchants for centuries; an enigmatic place believed by some to not exist at all, but known to others as a centre for imports of rare minerals and other goods from the north.\n\nAs a Hellenised port, this city will form our core presence in western Iberia."
 me_greek_4_west.22.a:0 "The route north lays open."
 me_greek_4_west.23.desc:0 "The dastardly attack by the Etrurian and Punic barbarians on our ancient Corsican colony has finally been reversed in a just act of vengeance. This colony will once again be an important Massalian centre."
 me_greek_4_west.23.a:0 "We will not forfeit it again."
 me_greek_4_west.23.tt:0 "All #Y Massalian#! countries obtain #G 25#! opinion of [gm_4_greek_scope.GetName]."
 me_greek_4_west.24.desc:0 "By conquering the Balearic islands and Sardinia we have settled a centuries old rivalry which saw our people humiliated by the Punic dogs. Now they will have to appreciate our vigour as they lick their wounds for the next round."
 me_greek_4_west.25.desc:0 "Through astute management and the bravery of our military we have seized control of numerous of the Carthaginian's most ancient and most important commercial outposts in the western Mediterranean.\n\nThere can no longer be any doubt that we are set to replace the decaying husk of Punic hegemony as masters of the internal ocean."
 me_greek_4_west.26.desc:0 "We have, after numerous trials and much toil, united the Phocaean diaspora which was set adrift by the Persian barbarians so long ago, and in the process established a Hellenic mercantile empire in the western Mediterranean.\n\nOur people rejoice, as do Massalians everywhere, to be so sanctified by the gods. The ills of the past are made easier by Tyche's recent gifts. Now our leader [gm_4_greek_scope.GetRulerTitle] [gm_4_greek_scope.GetRuler.GetPraenomen] is being affectionately referred to as 'Omagyrios' - the uniter."
 me_greek_4_west.27.desc:0 "Against all odds we have returned to re-found the destroyed city of Phocaea, laid low by Persian torches and still a deeply mournful place in the history of our people.\n\nWith the efforts of a novel generation of settlers, Phocaea will ascend from the ashes and become a city of note once again."
 me_greek_4_west.29.desc:0 "It seems another Massalian colony shared our dreams and has already taken on the mantle of defender of the western Hellenes. We will have to locate some other avenue in securing our defence."
 me_greek_4_west.29.a:0 "Favourable, but adverse..."
