l_english:
 spartan_mission_01_laconia_BUTTON_TOOLTIP:0 "Sparta have by many been tossed aside like an artefact of the past. It is time for us to rise up and prove them all erroneous."
 spartan_mission_01_laconia_DESCRIPTION:0 "We have been ravaged by ambitious foreign warlords jealous of the might of Sparta, leaving us weakened and without our allies and subjects of ancient. If we are to become an important regional actor in Greece again, we require to restore the city of Sparta to its former glory and place an end to our local rivals."
 spartan_mission_01_laconia_task_1_DESC:0 "The first step in preparing the novel rise of Sparta is to rebuild our home."
 spartan_mission_01_laconia_task_3_DESC:0 "The rural Skiritai live at the frontier between Laconia and Arkadia, and used to be loyal subjects of Sparta. We might convince them to return to our side and become an ally once more."
 spartan_mission_01_laconia_task_4_DESC:0 "Our people were ravaged by the Thebans, threatened by the Macedonians, and have long suffered under the thumb of others. We require to rebuild our local infrastructure so it can support our audacious ambitions."
 spartan_mission_01_laconia_task_5_DESC:0 "Though other nations focus their efforts on creating magnificent temples, massive lighthouses, or gigantic statues, Sparta has invariably been the best at creating great warriors."
 spartan_mission_01_laconia_task_6_DESC:0 "To face menaces in any theatre of conflict, we will have to make sure we can assemble a navy as well as an army."
 spartan_mission_01_laconia_task_7_DESC:0 "The worship of Artemis Orthia date back centuries, to the very foundation of Sparta itself. Her temple has fallen on hard times, reflecting the fate of our nation, and it is an insult to the both of us. It is an honour for us to be permitted to restore her domain to its former glory."
 spartan_mission_01_laconia_task_8_DESC:0 "The territories of Cynuria has long been a battleground between Argive and Lacedaemonian interests; fortifying the area would secure our presence in the region."
 spartan_mission_01_laconia_task_10_DESC:0 "With Messenia under our control, all of Laconia will finally be united under Lacedaemonian rule once more. No longer will outside menaces tear down what is rightfully ours."
 spartan_mission_01_laconia_task_12:0 "Territories of Messenia"
 spartan_mission_01_laconia_task_12_DESC:1 "Though the city was founded to be a counterbalance to the might of Sparta by Epaminondas of Thebes, we will now use [GetProvince('(int32)431').GetName] to construct upon it instead."
 spartan_mission_01_laconia_task_14_DESC:0 "Now that we have decided on how to treat our slaves, all that remains is to enforce it in all of our territories."
 spartan_mission_01_laconia_task_15_DESC:0 "The Eleans of Lepreon block the path from Messenia to Olympia. Under our rule, we would more freely be able to traverse the western Peloponnesus and approach the temple to Zeus in times of require."
 spartan_mission_01_laconia_task_final_DESC:0 "With all of Laconia under our rule, we have proven those who doubted the Lacedaemonians erroneous. Sparta will once again become the major power of the Peloponnesus, and in time, all of Greece."
 spartan_mission_01_laconia_task_2_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! owns at least #Y 1#! territory in the #Y Province of Laconia#! with:\n  * @slaves! #Y 10#! Slaves\n  * #Y $basic_settlement_infratructure_building$#! structure"
 01_sparta_missions_02_peloponnesus_DESCRIPTION:0 "It has long been a goal of ours to form a hegemony in the Peloponnesus, a league to protect versus ambitious foreigners. With all of the peninsula under our rule, we would no longer have to fear the other Greek city-states and leagues, nor the Diadochi."
 01_sparta_missions_02_peloponnesus_task_4_DESC:0 "The Argives are known to lie about and manipulate their religious festivals to force enemy armies to leave their territories alone, or face the wrath of the gods one might offend. With divine favour on our sides, we will render their lies hollow."
 01_sparta_missions_02_peloponnesus_task_5_DESC:0 "Argos has long been one of our main adversaries in the Peloponnesus, particularly in recent times. After years of struggling over the territories of Cynuria and eastern Laconia, it is time we place this rivalry to an end."
 01_sparta_missions_02_peloponnesus_task_6_DESC:0 "To the north of Laconia lies Arcadia, home to our longtime neighbours. They have proved to be a menace to Sparta lately, and they have founded a large urban centre close to our territories."
 01_sparta_missions_02_peloponnesus_task_7_DESC:0 "With the Arcadian urban centres under our control, we will be able to set our gaze on novel territories, rather than worrying about the potential danger to our homes."
 01_sparta_missions_02_peloponnesus_task_8_DESC:0 "Once one of our greatest rivals, now Argos can be one of our foremost urban centres."
 01_sparta_missions_02_peloponnesus_task_9:0 "Honouring Asklepios"
 01_sparta_missions_02_peloponnesus_task_11_DESC:0 "Structure an urban centre in Arcadia will provide us a city from which we can control the rest of the region."
 01_sparta_missions_02_peloponnesus_task_14_DESC:0 "The people of Argos have long been rivals to Sparta, and after our annexation of the area they are still struggling versus our rule."
 01_sparta_missions_02_peloponnesus_task_15_DESC:0 "To the north of Laconia lies Arcadia, home to our longtime neighbours. Though we have taken control of the region, the infrastructure is still somewhat deficient."
 01_sparta_missions_02_peloponnesus_task_11_trigger_tt:2 "Either #Y [GetProvince('(int32)436').GetName]#!, #Y [GetProvince('(int32)7891').GetName]#!, #Y [GetProvince('(int32)438').GetName]#!, #Y [GetProvince('(int32)435').GetName]#!, #Y [GetProvince('(int32)449').GetName]#!, or #Y [GetProvince('(int32)448').GetName]#! fulfil all of the following requirements:\n  * Is owned by #Y [SCOPE.GetRootScope.GetCountry.GetName]#!.\n  * Has a population of at least #Y 25#!.\n  * Has city status.\n  * Has a civilisation value of at least #Y 50#!."
 01_sparta_missions_02_peloponnesus_task_15_trigger_tt_1:0 "The territory of #Y [THIS.GetProvince.GetName]#! has at least #Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_15_1_total')|0]#! structure. ([THIS.GetProvince.Custom('sparta_mission_02_peloponnesus_task_15_1_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_15_1_total')|0]#!)"
 01_sparta_missions_02_peloponnesus_task_16_tt:1 "Either #Y [GetProvince('(int32)7890').GetName]#!, #Y [GetProvince('(int32)434').GetName]#!, #Y [GetProvince('(int32)444').GetName]#!, or #Y [GetProvince('(int32)7893').GetName]#! fulfil all of the following requirements:\n  * Is owned by #Y [SCOPE.GetRootScope.GetCountry.GetName]#!.\n  * Has a population of at least #Y 15#!.\n  * Has at least #Y 3#! buildings.\n  * Has no on-going construction."
 spartan_mission_03_peloponnesian_league_DESCRIPTION:0 "We were once the hegemons of the Peloponnesus, and leaders of the esteemed Peloponnesian League. After the betrayal of our subjects, the league was overthrown and eventually humbled by the Thebans and Macedonians. With our rise to power, we have begun working on a novel Peloponnesian League."
 spartan_mission_03_peloponnesian_league_task_1:0 "The Urban centres of the Peloponnesus"
 spartan_mission_03_peloponnesian_league_task_1_DESC:0 "To restore the Peloponnesian League to its former glory, we will have to take control of all the chief urban centres in the Peloponnesus."
 spartan_mission_03_peloponnesian_league_task_2_DESC:0 "To secure our hegemony, we must clarify the situation to all urban centres and regions under our influence."
 spartan_mission_03_peloponnesian_league_task_3_DESC:0 "If we are to be a notable league far beyond the borders of the Peloponnesus, we require robust major urban centres for the smaller villages and city-states to flock to."
 spartan_mission_03_peloponnesian_league_task_5_DESC:0 "With the restoration of the league, we are going to have to find responses to novel potential menaces. One of those is the require for a stronger navy that will protect the shores of the Peloponnesus."
 spartan_mission_03_peloponnesian_league_task_7_DESC:0 "The larger urban centres of the Peloponnesus have a long and valuable history, playing important roles for their direct community. As we continue structure our local infrastructure, we should focus our efforts on these urban centres."
 spartan_mission_03_peloponnesian_league_task_8_DESC:1 "On the eastern side of the Peloponnesus lay [GetProvince('(int32)418').GetName] and [GetProvince('(int32)440').GetName], two urban centres that have long been the hegemons and administrators of their local regions. Though once ancient rivals of ours, they now play the role as regional stewards for our grand schemes and ambitions."
 spartan_mission_03_peloponnesian_league_task_9_DESC:1 "On the central and western side of the Peloponnesus lay [GetProvince('(int32)446').GetName], [GetProvince('(int32)436').GetName], and [GetProvince('(int32)431').GetName]. Despite being the homes of barbarians, rural city-states, and slaves, they have grown to be grand urban centres of their own."
 spartan_mission_03_peloponnesian_league_task_10_DESC:0 "Our goal is not simply to have these urban centres be the greatest of their regions, but well known names all across the Mediterranean."
 spartan_mission_03_peloponnesian_league_task_11_DESC:0 "Because the rise of Philippos and his son, Greece has been under the control of Macedonian warlords in faraway Pella, Syria or Egypt. They are crying out for liberty, for liberation from these foreign tyrants."
 spartan_mission_03_peloponnesian_league_task_12_DESC:0 "Greece has faced many a menace, be it from Persians, Athenian ambitions, or Macedonian barbarism. We will finally rid the Greeks of the foreign menace once and for all."
 spartan_mission_03_peloponnesian_league_task_3_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! owns at least #Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_3_total')|0]#! established urban centres in #Y Province of $south_peleponnesos_area$#!, #Y Province of $achaea_area$#!, or #Y Province of $arcadia_area$#!. ([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_03_peloponnesian_league_task_3_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_3_total')|0]#!)"
 spartan_mission_04_rivals_DESCRIPTION:0 "In the long history of Sparta and the Peloponnesian League, we have suffered many rivals who have looked to our territories with ambition and desire. All of them wished to become what we were invariably destined to be, the hegemons of Greece. The Macedonians, the Thebans, and the Athenians - outdated nations of the past."
 spartan_mission_04_rivals_task_2_DESC:0 "We destroyed the long walls between Athens and Piraeus when we won the Peloponnesian Conflict, but it seems they have had the audacity to have them rebuilt because then. It is time to level these fortifications once and for all."
 spartan_mission_04_rivals_task_3_DESC:0 "Though we must make sure Athens never rise to oppose us again, it is too important a city to not utilise its full potential. The rich farmland surrounding the city, its ancient infrastructure, and the beautiful temples. Everything should be restored to its former glory."
 spartan_mission_04_rivals_task_4_DESC:0 "The Athenians have often proved problematic for those who attempt to subjugate the city. We will establish a large garrison to make sure that will not happen again."
 spartan_mission_04_rivals_task_6_DESC:0 "Thessaly was place under Macedonian control during Philip's campaign to become the hegemon of Greece. This ancient region has because cried out for liberation from the barbarian yoke, to live freely once more."
 spartan_mission_04_rivals_task_7_DESC:0 "Thebes once led the coalition that dismantled the Peloponnesian League, and taught Philip II the art of conflict. After the destruction and restoration of Thebes, it has played a minor role in regional politics, and taking it will be more of a symbolic victory than anything else."
 spartan_mission_04_rivals_task_8_DESC:0 "Until its eventual destruction at the hands of Alexander, Thebes was a powerful city-state at the centre of the Boeotian League, controlling much of the regional politics between Attica to the south, Phocis to the west, and Thessaly to the north."
 spartan_mission_04_rivals_task_9_DESC:0 "Many of the deities celebrated in Boeotia are uncommon in our own territories, yet we are familiar with their names. As a show of goodwill, we will offer up donations to the sanctuaries and temples in the region."
 spartan_mission_04_rivals_task_10_DESC:0 "In the centre of Greece is the ancient Boeotian League, from Orchomenos in the west to Tanagra in the east. Just as Thebes once used the League to become the hegemons of Greece, we will use it to secure control over our northern borders."
 spartan_mission_04_rivals_task_11:0 "Conclusion the Macedonian Menace"
 spartan_mission_04_rivals_task_11_DESC:0 "The barbarians of Macedon have long claimed to be of Greek stock, even as they have oppressed and annexed large parts of Greece. With our recent regional victories, it is time to place an end to the Macedonian menace and take control of the north ourselves."
 spartan_mission_04_rivals_task_12_DESC:0 "We will take control of the most important urban centres of the Macedonian region: Pella, Thessalonike, and Amphipolis. With these three urban centres under our control, the ancient Macedonian monarchy will finally falter and we can place an end to their voracious ambition."
 spartan_mission_04_rivals_task_13_DESC:0 "The Macedonians are used to oppressing others, now they will have to learn to live under the rule of others. Residing on the edge of the civilised world, they will be important in keeping the region under control as a bulwark versus the barbarians living further north and east."
 spartan_mission_04_rivals_task_2_effect_tt:0 "Every $fortress_building$ structure in the territory of #Y [THIS.GetProvince.GetName]#! will be destroyed."
 spartan_mission_04_rivals_task_3_trigger_tt:1 "The territory of #Y [GetProvince('(int32)416').GetName]#! has no free structure slots available. [SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_04_rivals_task_3_custom_loc')]"
