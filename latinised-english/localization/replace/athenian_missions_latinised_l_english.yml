l_english:
 athenian_mission_01_foreign_rulership_DESCRIPTION:0 "We have been one of the most important and powerful city-states of Greece since time immemorial, and yet these days we are struggling under the yoke of [mission_overlord_scope.GetName]. This subjugation of our great home has left our democracy in tatters, as our Assembly has divided into two political coalitions - one supporting the foreign suzerain and one vying for independence."
 athenian_mission_01_foreign_rulership_task_1_DESC:0 "#Y Loyalist Path#!\nIf we are to build a closer relationship with [mission_overlord_scope.GetName], it is advisable to establish an embassy in [mission_overlord_scope.GetCapital.GetName]. A delegate to their [mission_overlord_scope.GetRulerTitle], [SCOPE.GetRootScope.GetCountry.GetOverlord.GetRuler.GetPraenomen], seems like the logical first step in making that happen."
 athenian_mission_01_foreign_rulership_task_2_DESC:0 "#Y Loyalist Path#!\nIf we are to convince the rest of [SCOPE.GetRootScope.GetCountry.GetName] to follow suit, it would be helpful if [mission_overlord_scope.GetName] could dispatch us some supervisors that could assist in dealing with the more unseemly elements of our Assembly."
 athenian_mission_01_foreign_rulership_task_3:0 "Arranging the Assembly"
 athenian_mission_01_foreign_rulership_task_4_DESC:0 "#Y Loyalist Path#!\nNow that we have grown somewhat closer to [mission_overlord_scope.GetName], it is time for us to ask them to dispatch some soldiers that will let us put an end to the independence faction."
 athenian_mission_01_foreign_rulership_task_5:0 "Finalising the Treaty"
 athenian_mission_01_foreign_rulership_task_5_DESC:0 "#Y Loyalist Path#!\nWe will sign a treaty that makes us a permanent subject of [mission_overlord_scope.GetName], ending the independence party's numerous attempts at trying to misdirect our population."
 athenian_mission_01_foreign_rulership_task_7:0 "Ridding Ourselves of the Supervisors"
 athenian_mission_01_foreign_rulership_task_7_DESC:0 "#Y Independence Path#!\nThe supervisors of [mission_overlord_scope.GetName] are tightly bound to the loyalist faction, and without their support they are probably unlikely to stay in charge or have much power left in the city."
 athenian_mission_01_foreign_rulership_task_9_DESC:0 "#Y Independence Path#!\nIf we are ever to stand on our own two feet, we will have to prove to everyone that we can assemble our own armies and protect ourselves, and no longer be dependent on foreign suzerains like [mission_overlord_scope.GetName]."
 athenian_mission_01_foreign_rulership_task_11_DESC:0 "#Y Independence Path#!\nWith a final vote in the Assembly, we will shatter the [mission_overlord_scope.GetAdjective] chains once and for all. [ROOT.GetCountry.GetName] will be liberated once more."
 athenian_mission_01_foreign_rulership_task_11_effect_tt_2:1 "Every $PRY_DYN_ADJ$ supervisor will be killed."
 athenian_mission_01_foreign_rulership_task_final_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will receive a powerful boon when the mission is completed."
 athenian_mission_01_foreign_rulership_task_final_tt_2:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will become independent when the mission is completed."
 athenian_mission_02_attica:0 "Re-establishing Attica"
 athenian_mission_02_attica_DESCRIPTION:0 "The destruction of the Delian League, and Athens' relative fall in prominence in Greece, has left Attica less developed and efficient than it once was. Once it was the heart of Athenian power, and if we are ever to expand beyond Attica, it needs to be once more."
 athenian_mission_02_attica_BUTTON_TOOLTIP:0 "If we are ever to become more than a petty local power, we need to re-establish our ancient homeland."
 athenian_mission_02_attica_task_2_DESC:0 "Attica was once one of the richest regions of Greece, until it was devastated in the armed conflict between Sparta and ourselves, and then left in ruin since. If we are to ascend to power once more, we will have to re-establish our bountiful homeland."
 athenian_mission_02_attica_task_3:0 "Reinstated to Greatness"
 athenian_mission_02_attica_task_3_DESC:0 "The Athens of ancient times was a beautiful city at the heart of Greece, the stories of its magnificence travelling far and wide. If our aims are to become a regional power in the region, it is advisable to focus our efforts at home first."
 athenian_mission_02_attica_task_4:0 "Securing the Frontiers"
 athenian_mission_02_attica_task_4_DESC:0 "At the frontiers of Attica lay Corinth to the south, and Boeotia to the north-west. These city-states are quintessential for the protection of our homeland, and the Assembly requires that we either take control of them or ally ourselves with them."
 athenian_mission_02_attica_task_5_DESC:0 "Attica was once known as the location of some of the richest mines in Greece. If we want to take up the mantle of ancient times, it is advisable to refocus our efforts on these mines and become one of the wealthiest exporters of silver in the region once again."
 athenian_mission_02_attica_task_6_DESC:0 "The ports of Piraeus are Athens' centre of trade, from where we dispatch our merchants throughout the Mediterranean."
 athenian_mission_02_attica_task_7_DESC:0 "The Academy is an important institution in the cultural landscape of Athens, and the home to numerous intellectuals."
 athenian_mission_02_attica_task_8_DESC:0 "As the Academy is being restored to its former glory, it is advisable to search for individuals throughout the Mediterranean to populate its halls."
 athenian_mission_02_attica_task_final_DESC:0 "With Attica re-established to its former glory, our people will be able to look towards a bright future. The first of numerous steps to re-establish [ROOT.GetCountry.GetName] and its ancient league."
 athenian_mission_02_attica_task_8_effect_tt:0 "Novel characters might appear in Athens."
 athenian_mission_02_attica_task_10_effect_tt:0 "Characters in #Y [SCOPE.GetRootScope.GetCountry.GetName]#! will occasionally unite with the cult in Eleusis."
 athenian_mission_03_political_DESCRIPTION:0 "The republic in Athens was known far and wide for its strength and institutions, until we were conquered by foreign barbarian kings who started influencing our internal politics. As liberty has been returned to us, we will focus our efforts on re-establishing the republic of ancient times, and cleanse this stain upon our history."
 athenian_mission_03_political_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when the ancient Athenian republic has been re-established to the glory days of Cleisthenes, or shattered entirely."
 athenian_mission_03_political_BUTTON_TOOLTIP:0 "Our democracy has suffered under the leadership of foreign nations, and it is time to return it to the glory days of ancient times."
 athenian_mission_03_political_task_1_DESC:0 "The Council of 500 are in charge of our country's statutes, and have suffered as much as the rest of our political system when we were conquered and subjugated by barbarian suzerains."
 athenian_mission_03_political_task_3:0 "Re-establishing the Assembly"
 athenian_mission_03_political_task_3_DESC:0 "The Assembly has been suffering under the rule of ambitious politicians and foreign suzerains, first from Macedon, then later on from the Antigonids. We need to re-establish true democracy to Athens, for which we were once known throughout Greece."
 athenian_mission_03_political_task_4:0 "Organised Citizens"
 athenian_mission_03_political_task_7_DESC:0 "Ostracism is an ancient traditions in Athens, with unseemly elements being exiled from the city. Some politicians have shown more aptitude in getting rid of their rivals via ostracism, whereas others have been afflicted by their own ambition and been forced to depart themselves."
 athenian_mission_03_political_task_8_DESC:0 "Occasionally, ambitious orators will grow immensely powerful as they accumulate cults of personality around themselves. Rarely does this end well, for them or for the entire nation."
 athenian_mission_03_political_task_10:0 "A Conclusion to the Opposition"
 athenian_mission_03_political_task_10_DESC:1 "The last step for a tyrant in the making is to acquire complete control of the [SCOPE.GetRootScope.GetCountry.Custom('get_court_type')] and get rid of any would be rivals."
 athenian_mission_03_political_task_1_trigger_tt:0 "The #Y [GetOffice('office_praetor').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! needs to fulfil the following requirements:\n   [SCOPE.GetRootScope.GetCountry.Custom('athenian_mission_01_political_task_1_statesmanship')]\n   [SCOPE.GetRootScope.GetCountry.Custom('athenian_mission_01_political_task_1_loyalty')]"
 athenian_mission_03_political_task_2_effect_tt:0 "Political parties in #Y [SCOPE.GetRootScope.GetCountry.GetName]#! will be more likely to support novel statutes."
 athenian_mission_03_political_task_10_effect_tt:0 "\nWhen you complete the mission, you will receive the following effect:"
 athenian_mission_04_delian_league:0 "Re-establishing the Delian League"
 athenian_mission_04_delian_league_DESCRIPTION:0 "In the golden age of Athens we controlled the Aegean Sea and were the hegemons of the Delian League, bringing wealth and riches from one side of the sea to the other. After the league was shattered, the relations between ancient members decayed, and were eventually replaced by obedience to Theban or Macedonian tyrants.\n\nIt is time to pick up the pieces of the past, and re-establish the Delian League to its former glory. A league where every city-state is liberated, headed by Athenian power and democracy.\n"
 athenian_mission_04_delian_league_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have re-established the Delian League."
 athenian_mission_04_delian_league_BUTTON_TOOLTIP:0 "It is time to re-establish our ancient hegemony over the Aegean Sea."
 athenian_mission_04_delian_league_task_1_DESC:0 "At one point, most of the Aegean Sea was under the control of our Delian League, until it was shattered by our envious neighbours. It is time to pick up the pieces."
 athenian_mission_04_delian_league_task_2:0 "Northern Neighbours"
 athenian_mission_04_delian_league_task_2_DESC:0 "Our ancient neighbours to the north were important members of the original Delian League, and should be once more. As they are located as closely as they are to Attica, it makes sense to start our campaign by convincing the city-states on Euboea."
 athenian_mission_04_delian_league_task_3_DESC:0 "The island of Kephalos lay far to the west, distant from the rest of the ancient capitals of the Delian League. If we are ever to expand the rule of the Delian League beyond those ancient frontiers, be it to Illyrian or Magna Graecian lands, we require ports like this."
 athenian_mission_04_delian_league_task_4_DESC:0 "Korkyra was the final bastion to the west of the ancient Delian League, the last stop one would make before entering Illyrian or Magna Graecian lands. As it lays at an important crossroads between Greece, the west, and the north, it is advisable to attempt to retake the island once more."
 athenian_mission_04_delian_league_task_5_DESC:0 "The Delian League were known for its navy, constructing vessels and recruiting oarsmen throughout the entire Aegean Sea to serve its purpose. If we are to control the city-states that lays inside the ancient frontiers of the league, we will have to construct a navy of similar size."
 athenian_mission_04_delian_league_task_6_DESC:0 "The island of Delos was the home of the treasury, and the namesake of the original Delian League. If we are to justify a novel league, acquiring Delos is essential to justify its existence."
 athenian_mission_04_delian_league_task_7:0 "Modernising the Navy"
 athenian_mission_04_delian_league_task_7_DESC:0 "With the rise of the Diadochi and their kingdoms, we have seen the introduction of even larger vessels in the naval engagements that take place between them. It is time for us to embrace these grander vessels in our own navy as well, so we can challenge any would be invader of Greece."
 athenian_mission_04_delian_league_task_8_DESC:0 "Naxos is at the heart of the Cyclades, and an important centre for the Aegean islands. Controlling it will effectively make us the supervisors of the other islands as well."
 athenian_mission_04_delian_league_task_9_DESC:0 "Placing the treasury in Delos proved problematic with the original Delian League, but reflecting the original intention would go a long way to prove that the league is more than just Athenian hegemony of the Aegean Sea."
 athenian_mission_04_delian_league_task_11_DESC:0 "Amphipolis was a city we raised in the north to gain better control of our allies in Thrace, until it was acquired by Sparta and Macedon. If we want to re-establish a semblance of influence in the area, it is advisable to finally retake our ancient colony."
 athenian_mission_04_delian_league_task_12_DESC:0 "In one of the darker moments of the history of Athens, Samos was a loyal ally and friend of our city. It is time to re-establish their liberty, and the friendship between our two cities, we owe them that much."
 athenian_mission_04_delian_league_task_13_DESC:0 "Samos was famous for having the strongest navy of the Aegean Sea, and assisting them in re-establishing a semblance of that ancient reputation seems an appropriate reward for their long-standing loyalty to Athens."
 athenian_mission_04_delian_league_task_14_DESC:0 "Sestos is one of the ancient members of the original Delian League, and is located at the entrance to the Hellespont. Controlling the city-state would give us access to the strait, and influence over anyone desiring to pass through."
 athenian_mission_04_delian_league_task_15_DESC:0 "By expanding upon the local infrastructure in Sestos, we can utilise the city as an urban centre for our influence in Thrace, as well as securing the Hellespont."
 athenian_mission_04_delian_league_task_17_DESC:0 "It is said Mausolos was so beloved by his sister, that she started constructing the massive Mausoleum after his demise to honour him. Though numerous years have passed since [GetProvince('(int32)1981').GetName] was under the rule of the Hekatomnids, their legacy still lives on."
 athenian_mission_04_delian_league_task_18_DESC:0 "The Hekatomnids have a legacy of grand monuments, particularly the magnificent Mausoleum. Continuing their legacy would surely make us popular among the locals."
 athenian_mission_04_delian_league_task_19_DESC:0 "Rhodes is an island that single-handedly repelled Demetrios as he tried to siege the city, and it has an extended, prestigious history. It is time to convince the city to become a member or ally of our league once more, as it used to be in the past."
 athenian_mission_04_delian_league_task_final:0 "Re-establishing the League"
 athenian_mission_04_delian_league_task_5_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has a navy size of at least #Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_5_total')|0]#! vessels. ([SCOPE.GetRootScope.GetCountry.Custom('athenian_mission_04_delian_league_task_5_custom_loc')]/#Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_5_total')|0]#!)"
 athenian_mission_04_delian_league_task_7_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_7_total')|0]#! light vessels in #Y [GetProvince('(int32)416').GetName]#!. ([SCOPE.GetRootScope.GetCountry.Custom('athenian_mission_04_delian_league_task_7_custom_loc')]/#Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_7_total')|0]#!)"
 athenian_mission_04_delian_league_task_7_tt:0 "#Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_7_total')|0]#! light vessels in #Y [GetProvince('(int32)416').GetName]#! will be destroyed and replaced by larger vessels."
 athenian_mission_04_delian_league_task_13_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_13_total')|0]#! vessels in #Y [GetProvince('(int32)1974').GetName]#!. ([SCOPE.GetRootScope.GetCountry.Custom('athenian_mission_04_delian_league_task_13_custom_loc')]/#Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_13_total')|0]#!)"
 athenian_mission_04_delian_league_task_13_effect_tt:0 "#Y [SCOPE.ScriptValue('athenian_mission_04_delian_league_task_13_total')|0]#! vessels in the territory of #Y Samos#! will be destroyed."
