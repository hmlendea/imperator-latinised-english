l_english:
 game_concept_country_desc:1 "Countries are the diplomatic entities that you will interact with during play. They can represent anything from minor nation-states, to vast empires or migratory hordes.\n\nCountries draw their revenue and resources directly from the [pops|E] within the [territories|E] that they possess, and each contain a court of [characters|e], led by a [ruler|e]."
 game_concept_ruler_desc:0 "Every [country|E] has a character as its ruler. The vigour of a ruler can be measured by their four primary attributes, each of which has highly beneficial effects upon a [country|e]."
 game_concept_territory_desc:1 "A territory is the smallest administrative division, pertaining to a [province|E], which itself pertains to a [governorship|E]. Territories contain [pops|E], produce [tradegoods|E], and have a [province_rank|E].\n\nMost territories will be owned by a [country|E], though they can also be uncolonised, offering up an opportunity for those cunning enough to exploit it."
 game_concept_family_desc:0 "A Family is a group of important [people|E] related to each other, and usually living in the same [country|E].\n\nA [country|E] can contain a number of Great Families - increased by nation rank - which will each vie for dominance in an ever-changing political terrain. It is important to maintain great families happy by fulfilling their expected job quota - failure to do this will probably reduce the loyalty of the entire family."
 game_concept_character_desc:1 "Characters represent the influential people who are directly involved with the running of a [country|E]. They possess a number of relevant statistics, the principal of which are @loyalty_icon!#Y Loyalty#! and @power_base! #Y Powerbase#!. A disloyal character can cause all manner of issues for a country, from poor job performance to outright civil war."
 game_concept_government_desc:0 "Governments represent the type of ruling body that every [country|E] possesses. A government can pertain to one of the three archetypes; Republic, Monarchy, or Tribe, and can contain a futher specialisation within that archetype. Each type of government possesses access to different statutes, mechanics, or modifiers."
 POPTYPE_CONCEPT_DESCRIPTION:1 "[PopType.GetFullDescription]\n\nThis [poptype|E] possesses a Political Weight of [PopType.GetPoliticalWeight|Y]."
 game_concept_poptype_desc:0 "Poptypes represent the various domestic classes of inhabitant within a realm. Different poptypes produce different resources, and will respond in differing ways to their living situation. Some poptypes also possess a Political Weight - this represents the influence they possess, and can mean that minor numbers of highly influential [pops|E] can have a huge impact on the unrest of a territory, should their happiness fall low enough."
 game_concept_culture_desc:1 "Cultures are an ethnic identity which [pops|E] or [characters|E] can pertain to. They represent a combination of language, tradition, and socio-economic hierarchy, and can be affected individually by [laws|E] or [culture_decisions|E]."
 CULTURE_LINK_TEXT:1 "The [Culture.GetNameWithNoTooltip] culture is a member of the [Culture.GetCultureGroup.GetName] culture group.\n\n[pops|EU] pertaining to this culture can raise the following levies:\n[Culture.GetLevyTemplate.GetLevyCompositionTooltip]"
 game_concept_religion_desc:1 "Religions represent a loose collection of religious habits and observances. Each religion is associated with a number of [deities|E], however the pantheon of each [country|E] following that religion can differ depending on the religious make-up of their population.\n\nAs with [cultures|E], both [pops|E] and [characters|E] will pertain to a religion, and their #Y Happiness#! or #Y Loyalty#! may be affected by a nation's treatment of their faith."
 game_concept_deity_desc:0 "Deities, or in the case of some monotheistic religions, Prophets, are significant figures that can be revered as part of a national pantheon. Each deity possesses a passive and an active effect when venerated in a pantheon, granting their nation a unique bonus."
 game_concept_culture_group_desc:1 "A culture group is a collection of similar cultures that share a historical origin, or share robust similarities. [pops||E] and [characters|E] are more likely to be content being ruled by a [country|E] sharing the same culture group as themselves."
 game_concept_law:0 "Statute"
 game_concept_laws:0 "Statutes"
 game_concept_law_desc:0 "Statutes are the framework by which a [country|E] can exert control over its territory and population. Statutes are different depending on which [government|E] archetype a nation belongs to, and can have positive, as well as negative effects. Different laws are often required in order to make changes relating to a government, for example, changing to an aristocratic government type might require you to first embrace statutes that favour the aristocracy."
 game_concept_tradegood_desc:2 "Different resources are produced in different [territories|E], and grant a variety of bonuses to their [province|E]. Trade goods can, as the name suggests, be exchanged between [provinces|E], both within your own empire, or by agreeing to or offering a trade deal with another [country|E].\n\nThe quantity of goods that a [territory|E] produces can be increased by constructing certain [buildings|E] or growing the population of slaves, which may be moved between owned [territories|E] at will."
 game_concept_horde_desc:0 "A horde is an accumulation of barbarian warriors, who exist to plunder and pillage. They will roam lands indiscriminately, until they are either defeated in combat, or have been convinced to depart in peace. Limited diplomacy is possible with a horde. For example, you can select to grant them settlement rights in your territory, ceding [territories|E] to them in exchange for their fealty."
 HORDE_LINK_TEXT:0 "The barbarian hordes of [Horde.GetNameWithNoTooltip] are led by [Horde.GetLeader.GetNameWithNoTooltip].\n\nThey have despoiled [Horde.GetOccupationCount|Y] territories so far. If we were to defeat them, [Horde.GetPossibleSlaves|Y] slaves would be settled at their location."
 game_concept_pop_desc:1 "Pops represent groups people living in a [territory|E]. They each possess a #Y Happiness#! value, which indicates their satisfaction with the leadership of their [country|E], and which contributes to their #Y Output#!, as well as causing #Y Unrest#! in their territory if their Happiness is low.\n\nPops all pertain to a [poptype|E], for example: @citizen! #Y Citizens#!."
 game_concept_treasure_desc:0 "Treasures are powerful artefacts capable of inspiring faith in those living near them. They can be stored in sacred sites, yielding considerable boons to the area surrounding them.\n\nTreasures can be looted by desecrating a holy site, and can occasionally be discovered via other means such as events or character interactions."
 game_concept_unit_desc:2 "Units represent the armies and navies of a [country|E] on the map. They each possess a varying number of [subunits|E] whose Morale, Experience, and Discipline will affect their performance in battle.\n\nUnits are led by a General or Admiral whose @military_icon! Martial skill will improve their fighting ability. Levy armies are invariably commanded by their [governor|E], while [legion|E] armies are commanded by its [legate|E] or [tribunes|E].\n\nArmies consume @food_capacity_icon! Food in [territories|E] with a @supply_limit! Supply Limit lower than their total number of Subunits. Without Food an army will suffer @attrition! Attrition, draining its vigour. This can be alleviated by ensuring the Unit gathers Food in owned territory before going into enemy lands. Food capacity can also be increased with @supply_train! Supply Train Subunits."
 game_concept_siege_desc:0 "Any [territory|E] can be placed under siege. Territories without fortifications will fall easily, however if one or more fort levels are present, the besieging army may be engaged in a lengthy wait.\n\nSiege progress requires at least 4,000 soldiers present per fort level in a territory, however, adding more men will not speed up a siege!"
 game_concept_province_desc:2 "A province is the medium sized administrative map division, below the [governorship|E]. It is the part of an [area|E] pertaining to a specific [country|E], and consists of one or more [territories|E].\n\nTrade is conducted on the province level, importing or exporting [tradegoods|E] produced by other domestic or foreign provinces.\n\nProvinces store a local food supply derived from local production and imports which is used to feed its [pops|E] and friendly [units|E] passing through who require supplies.\n\nGovernor Policies can be pursued to direct the development of a province, and are decided on a per-Province basis by the owning [country|E].\n\nIf a Province's loyalty falls to 0, it will rise in a local rebellion against its owning [country|E]."
 game_concept_governor_desc:2 "Every [governorship|E] possesses a [character|E] in charge of it.\n\nIn the capital Governorship of a [country|E] this will invariably be the [ruler|E], but for others a Governor will need to be appointed.\n\nGovernors act as the commander of their Governorship's Levy."
 game_concept_agenda_desc:0 "Every political [party|E] possesses their own [agenda|E], a particular goal for their current term.\n\nIf the ruling government succeeds in addressing their demands this will appease the party greatly. If not, some parties can attempt to force their agenda over time. Agendas are selected at the start of a novel term, or when a new ruling party has been established.\n\nA party can be driven by ideology, faith, relations or raw, unfettered conviction in their own cause when setting these goals."
 game_concept_building:0 "Structure"
 game_concept_buildings:0 "Structures"
 game_concept_building_desc:2 "Buildings can be raised in [territories|E], where they can each provide different benefits to the populace and production of the [territory|E] and/or [province|E].\n\nSpecialised production structures are available in [GetProvinceRank('settlement').GetName|E] rank territories, while urban buildings may be built in [GetProvinceRank('city').GetName|E] or [GetProvinceRank('city_metropolis').GetName|E] rank territories."
 GAME_BUILDING_TOOLTIP:0 "When constructed:\n[Building.GetModifier.BuildIconSummary|W]\n\n[Building.GetDescription]"
 game_concept_cultural_right_desc:0 "Cultural Rights represent the privileges granted to a certain culture within a given [country|E].\n\nCountries have a single [primary_culture|E], which will invariably enjoy full rights, but may also rule over [pops|E] of [integrated_cultures|E] and [non_integrated_cultures|E]."
 game_concept_primary_culture_desc:1 "Each [country|E] possesses a single [primary_culture|E]. [pops|E] of the [primary_culture|E] enjoy greater happiness, along with [integrated_cultures|E].\n\nOver time, [pops|E] of [non_integrated_cultures|E] will [assimilate|E] to the [primary_culture|E] of the [country|E] where they reside."
 game_concept_province_rank_desc:1 "Each [territory|E] possesses a rank, which determines its [buildings|E], population capacity, and the optimal ratio of [poptypes|E] within it. [territories|E] can be upgraded or demoted by the [country|E] which possesses them.\n\nThe lowest and most prevalent is the [GetProvinceRank('settlement').GetName|E], which can only construct rural [buildings|E] but serve as the main production centres of [tradegoods|E].\n\n[GetProvinceRank('city').GetName|E] and [GetProvinceRank('city_metropolis').GetName|E] rank territories can construct urban [buildings|E], house more [pops|E], and attract migrants."
 GAME_TERRAIN_TYPE_TOOLTIP_DEFENSIVE_BONUS:0 "Attackers obtain a [TerrainType.GetDefensiveBonus|R] dice penalty when in [siege|E]."
 game_concept_heritage_desc:1 "Each [country|E] possesses a heritage which grants specific bonuses and drawbacks.\n\nHistorically notable countries of the Hellenistic era will usually have an entirely unique heritage based on that nation's prized institutions or achievements, such as Rome."
 game_concept_innovation_desc:0 "Innovations represent key technologies that our populace will adopt without the necessity for additional roll-out costs. We will only obtain a limited number of these, so we must use them wisely!"
 game_concept_idea_desc:1 "Ideas permit a [country|E] to specialise by selecting from a variety of Military, Civic, Oratory, and Religious bonuses. Additional Ideas are unlocked by technological advances as the game progresses.\n\nEach government type and form possesses Idea slots of different categories, which when filled with Ideas from matching categories will grant the [country|E] an additional bonus, though they can be filled by Ideas of any category if desired. More advanced government forms, such as a Dictatorship, contain more Idea slots, while tribal government forms have less."
 game_concept_decision_desc:0 "Decisions are specific reforms or actions that can be enacted by a [country|E] under certain conditions, such as forming a novel nation or developing certain [territories|E]. Culture decisions may be enacted to influence the specific privileges and thus relative production and happiness of the cultures within a [country|E]."
 game_concept_distinctions_desc:1 "Time, effort, experience; rewards and commendations. A [legion|E] is many things, but their achievements will define them. This coloured history will be recorded, whether reflecting considerable [honors] such as [GetLegionDistinction('distinction_triumphalis').GetName], or marking past [dishonors], such as [GetLegionDistinction('distinction_dishonor_cowardly').GetName]. Whatever they do, it will echo in eternity."
 game_concept_legate_desc:0 "The primary acting commander of a [legion|E], a legate's burden can be eased by assigning them [tribunes|E], who will step up to assist them command [units|E] when needed. On their demise, their title carries on to the next [tribune|E] in line."
 game_concept_tribune_desc:0 "The next in line to a [legion|E]'s [legate|E]. They will assist in directing [units|E] in the legion outside of the legate's command. A tribune assigned to a [unit|E] may have different expectations of their conduct than their [country|E] has."
 game_concept_invention_desc:0 "Inventions represent the adoption of novel technologies and ideas by a [country|E] as time progresses. They can grant benefits to various aspects of its military, administration, and populace."
 GAME_GENERIC_DEPENDS_HEADER:0 "Requirements:"
 game_concept_military_bonus_desc:0 "Just as [countries|E] develop over time, so too do armies. Unlocked Military Bonuses grant a country's forces additional boons, such as the ability to construct certain [units|e], employ unique tactics, and so on forth. One such example is [GetMilitaryBonus( 'latin_roman_path_4' ).GetName|E], which unlocks a Unit ability which builds roads more efficiently."
 game_concept_legion_reassignment_desc:0 "Because coordination is critical to the success of a [legion|E], [Concept( 'legion_commanders', 'Commanders' )|E] without [units|E] may rise to the occasion and assume control of a unit on extraordinary occasions, such as the previous commander's demise, to ensure no units are left to their own devices."
 READ_MORE_ABOUT:0 "Read more regarding"
