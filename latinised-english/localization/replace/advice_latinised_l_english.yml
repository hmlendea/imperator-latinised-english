l_english:
 ADVICE_CHANGE_LAWS_BTN:0 "Enact Statute"
 ADVICE_FARM_BTN:0 "Construct Farm"
 ADVICE_DISLOYAL_CHAR_SUMMARY:0 "It is dangerous to distress important characters such as generals and governors. We should keep our friends close, but our enemies closer."
 ADVICE_DISLOYAL_CHAR_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_DISLOYAL_CHAR_DONOTHING:0 "We could simply wait for [SCOPE.sChar('target').GetName] to change their mind, or maybe even perish of old age."
 ADVICE_PRETENDER_SUMMARY:0 "There are ungrateful nobles hoping to place their puppet on the throne. We need to get them back in line!"
 ADVICE_PRETENDER_DONOTHING:0 "We could simply wait for [SCOPE.sChar('target').GetName] to change their mind, or maybe even perish of old age."
 ADVICE_PRETENDER_ALLEGIANCE_TITLE:0 "Require Oaths of Allegiance"
 ADVICE_PRETENDER_ALLEGIANCE_BTN:0 "Require Oaths"
 ADVICE_PRETENDER_ALLEGIANCE:0 "Demanding an oath of allegiance from our nobles is a good method of ensuring their support for our chosen heir."
 ADVICE_PRETENDER_SUPPORTHEIR_TITLE:0 "Require Support for Heir"
 ADVICE_PRETENDER_SUPPORTHEIR_BTN:0 "Require Support"
 ADVICE_PRETENDER_SUPPORTHEIR:0 "[SCOPE.sChar('target').GetName] is a loyal subject and just temporarily misguided. We only require to ask them for their support."
 ADVICE_PRETENDER_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_CIVILWAR_TITLE:0 "Risk of Civil Conflict: [SCOPE.sChar('target').GetName]"
 ADVICE_CIVILWAR_SUMMARY:0 "We have powerful people who are threatening to tear our nation apart. We must sway them, eliminate them or fight them."
 ADVICE_CIVILWAR_PREPARE_YOUR_ARMY:0 "Let us make preparations to encounter our foes on the field of battle."
 ADVICE_CIVILWAR_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_BRIBE:0 "Let us have [ROOT.GetCountry.GetRuler.GetName] provide a personal gift to [SCOPE.sChar('target').GetName] as a method to ensure their loyalty."
 ADVICE_GRANT_HOLDING:0 "Granting land is a good method to make a new friend, but also to make them more powerful. Consider this very carefully."
 ADVICE_BEFRIEND:0 "The greatest allies are frequently found amongst your worst enemies. Let us consequently turn [SCOPE.sChar('target').GetName] from adversary to friend."
 ADVICE_FREEHANDS_TITLE:0 "Provide Free Hands"
 ADVICE_FREEHANDS_BTN:0 "Provide Free Hands"
 ADVICE_FREEHANDS:0 "We can demonstrate our confidence in [SCOPE.sChar('target').GetName] by stopping watching them as closely. This would increase their corruption and could make them a greater problem in the future."
 ADVICE_DISLOYAL_CHAR_CHANGE_LAWS_TITLE:0 "Enact Statute"
 ADVICE_DISLOYAL_CHAR_CHANGE_LAWS_GEN:0 "Life is rough for soldiers, let us provide them some much needed liberties."
 ADVICE_DEFICIT_SUMMARY:0 "Our coffers are empty and discontent is spreading throughout the land! We need to acquire control over our finances before it controls us."
 ADVICE_DEFICIT_TAXES:0 "Economy does not lie in sparing money, but in spending it wisely. As we are losing money, we must consult the ledgers to balance our revenue and expenses."
 ADVICE_DEFICIT_DONOTHING:0 "Our wise decisions have provided us with a positive revenue. Though our treasury is currently empty, there is a steady stream of money coming in."
 ADVICE_DEFICIT_OMEN_TAX:0 "We can increase our revenue without raising taxes by asking for divine guidance."
 ADVICE_DEFICIT_OMEN_COMMERCE:0 "Commerce is our primary source of revenue and a blessing from the divine would grant us even greater riches."
 ADVICE_DEFICIT_DESTROY_BTN:0 "Go To Structure"
 ADVICE_DEFICIT_DESTROY:0 "If the situation is especially dire, we could dismantle some old useless forts. This would both reduce maintenance and fill up our treasury."
 ADVICE_DEFICIT_FALLBACK:0 "We may be out of available options, but the last thing we must forfeit is hope."
 ADVICE_DEFICIT_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_LOW_FOOD_SUMMARY:0 "Without food, the people of [SCOPE.sState('target').GetShortName] will starve and revolt. However, maintain their bellies full and they will grow strong and flourish!"
 ADVICE_LOW_FOOD_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_LOW_FOOD_FARM:0 "As we possess farmable land and able-bodied people, it would be wise to expand the farming settlements in [SCOPE.sP('result').GetName]."
 ADVICE_LOW_FOOD_FARM_TITLE:1 "Construct Farming Settlements"
 ADVICE_LOW_FOOD_MOVEARMY:0 "Our army is consuming huge amounts of the province's food. Consider moving it from the province, or divide it up in different provinces."
 ADVICE_LOW_FOOD_OMEN:0 "The people would labour harder knowing that our nation has divine favour. Let us prepare a ritual to remind them!"
 ADVICE_STARVING_POPS_SUMMARY:0 "The population is the backbone of any great civilisation, but the populace of [SCOPE.sP('target').GetName] is currently perishing!"
 ADVICE_STARVING_POPS_GRANARY:0 "Though granaries will not produce more food, they permit us to store any excess for times of need."
 ADVICE_STARVING_POPS_GRANARY_TITLE:0 "Construct Granaries"
 ADVICE_STARVING_POPS_GRANARY_BTN:0 "Construct Granaries"
 ADVICE_OCCUPIED_PROVINCE:1 "[SCOPE.sP('result').GetName] has been looted and is being occupied by hostile forces. If we can not reinstate peace and liberate the province, the people are sure to suffer."
 ADVICE_STARVING_POPS_FALLBACK:0 "These are dim times indeed when even our advisors have failed us. As we wait for a solution to appear, we have to let nature run its course."
 ADVICE_STARVING_POPS_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_ASSIGN_GOVERNOR:0 "Without a robust leader, the province will delve into anarchy and chaos. It is consequently vital that we assign it a governor."
 ADVICE_DISLOYAL_PROV_AUTONOMY:0 "We could accommodate some of the people's wishes and improve the happiness in the province if we permitted them some increased autonomy."
 ADVICE_DISLOYAL_PROV_HARSH:0 "It is better to be feared than loved. We may let our governor treat the agitators more harshly as a method to discourage more rebels."
 ADVICE_DISLOYAL_PROV_HARSH_TITLE:1 "Severe Governor Policy"
 ADVICE_DISLOYAL_PROV_OMEN:0 "The people will discover solace in knowing that their ruler is blessed. We only need to provide them a reason to believe so."
 ADVICE_DISLOYAL_PROV_TAXES:1 "Taxes burden the people, but are vital for our treasury. If the economy can manage it, our subjects would be most grateful if we could lessen their burden."
 ADVICE_IMPORT_METALS:0 "Our people ought to consider living in our great nation a luxury, but the current situation might require us to enhance their lives even further."
 ADVICE_DISLOYAL_PROV_FALLBACK_TITLE:0 "No Available Counsel"
 ADVICE_REVOLT_SUMMARY:0 "The people of [SCOPE.sState('target').GetShortName] have started to organise and a widespread rebellion may soon be at hand!"
 ADVICE_REVOLT_PREPARE_YOUR_ARMY:0 "Let us make preparations to encounter our foes on the field of battle."
 ADVICE_SETTING_INFO_DIALOG_TITLE:0 "Deactivate Counsel"
 ADVICE_SETTING_INFO_DIALOG_DESCRIPTION:0 "Highlights and counsel on alerts may be deactivated in the game settings menu."
