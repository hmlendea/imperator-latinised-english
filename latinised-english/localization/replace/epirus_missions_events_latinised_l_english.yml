l_english:
 me_epirus_1_epirus.110.desc:0 "Our recent past has been ignominious, tainted by constant civil conflict and military blunders. Many of our woes can be lain squarely at the Molossian's feet, who demand new leadership at a whim. We must bring control of the country into the hands of the monarch alone if we are to restore Epirus to magnificence."
 me_epirus_1_epirus.111.desc:0 "Our new rulers have brought Epirus out of the troubled years of recent times, and there is a novel feeling that our kingdom can weather the tempest of future uncertainty under the robust leadership of the [me_epirus_scope.GetRulerTitle]."
 me_epirus_1_epirus.2.desc:0 "The Taulantians proved their friendship to our kingdom when they took in Pyrrhos, though there are those who wish things might have gone differently for the boy...\n\nThe court is divided between those who argue we must preserve our sanctioned relationship to overcome our mutual enemies and detractors who assert the Taulantians may assist when we are most in need but only to collect interest on the favour!"
 me_epirus_1_epirus.2.b:0 "Epirus must be audacious in order to survive."
 me_epirus_1_epirus.3.a:0 "The ancient ways must make way."
 me_epirus_1_epirus.4.desc:0 "The efforts of our [me_epirus_scope.GetRulerTitle], [me_epirus_scope.GetRuler.GetPraenomen], have succeeded in convincing the court of [me_epirus_scope.GetName] of the requirement to make more audacious moves in order to protect our country from the ambitions of the diadochi and who ever else wishes to reduce us to slavery, starting with securing the Ambrakian and Akarnian cities."
 me_epirus_1_epirus.5.a:0 "The [me_epirus_scope.GetRulerTitle] must endure supreme."
 me_epirus_1_epirus.7.desc_1_2:0 "just request for the transfer of some of their territory in southern Illyria."
 me_epirus_1_epirus.7.desc_1_3:0 "requisite request that they accept us as their sovereign."
 me_epirus_1_epirus.7.desc_2_2:0 "\n\n[epirote_diplomat_scope.GetPraenomen] reports that the Taulantians wisely, but begrudgingly, accepted our requirements and make the requisite arrangements as we speak."
 me_epirus_1_epirus.7.at1:0 "We have obtained claims on all Taulantian territories south of #Y Epidamnos#! and #Y Parthos#!."
 me_epirus_1_epirus.7.at2:0 "We have obtained claims on all Taulantian territories."
 me_epirus_1_epirus.8.desc:0 "Our workers have finally finished establishing the major edifices and infrastructure of our novel city on the Ionian coast. Settlers from nearby settlements and across [me_epirus_scope.GetName] have begun to descend on their plots and begin their new lives in the city."
 me_epirus_1_epirus.8.a:0 "Even the most magnificent things have minor beginnings."
 me_epirus_1_epirus.9.desc:0 "We have made all the requisite diplomatic preparations for staking our claim to the island of Korkyra, and a delegation led by the charismatic [epirote_diplomat_scope.GetPraenomen] has already embarked to require the surrender of the island to an Epirote garrison."
 me_epirus_1_epirus.9.a:0 "There is no time to forfeit."
 me_epirus_1_epirus.9.tt:0 "#Y Korkyra#! will receive our requirement. If they accept they will become our feudatory subject, else we will gain claims on #Y Korkyra#!."
 me_epirus_1_epirus.10.desc:0 "The ancient Hellenic colonies of the Adriatic are once again in the hands of true Greeks, whatever the uppish southerners might say to the contrary. Settlers from the old metropoleis have arrived to be reunited with their distant families and it is clear these cities have a great deal of potential."
 me_epirus_1_epirus.11.desc:0 "The court has seemingly been convinced that Epirus is at last secure under the leadership of [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen]. With our internal affairs organised, we can at last turn our full attention elsewhere."
 me_epirus_1_epirus.12.desc:0 "Our efforts to transform the city of [me_epirus_scope.GetCapital.GetName] from a rural centre into a true capital of our kingdom are at last making dividends. The city is bustling as never before, and our people rejoice to live in such luxury."
 me_epirus_1_epirus.13.desc:0 "The ancient shrines in Dodona have been renovated, and a modest temple erected to the goddess that her cult might have a central priesthood. Her adherents have never been happier, and people across Epirus flock to hear the mysteries of her cult and offer their supplication."
 me_epirus_1_epirus.13.a:0 "The ancient gods are still mighty."
 me_epirus_1_epirus.14.desc:0 "Our generals have been studying the histories of Philip and Alexander with renewed vigour, comparing their tactics to those of the diadochi and examining reports from each novel conflict.\n\n[epi_general_scope.GetPraenomen] has become the doyen of strategy at court, and holds forth on the relative benefits of phalanx depth almost daily..."
 me_epirus_1_epirus.14.a:0 "Favourable..."
 me_epirus_1_epirus.15.desc:0 "If we are too arrange a marriage, we must first decide which of our illustrious family's eligible maidens will be offered to a foreign prince.\n\nTheir age, health, and temperament will require to be considered if we are to ensure a successful and long-lasting union..."
 me_epirus_1_epirus.16.desc:0 "Whatever the prestige and beauty of the bride we offer, only one will be gratified by the company and talents of [me_epi_royal_wedding_bride_scope.GetPraenomen]. We must decide which of the magnificent kingdoms shall be offered a daughter of such a prestigious line as ours..."
 me_epirus_1_epirus.17.et:0 "Marriage arrangements will be fractured off with [me_epi_royal_wedding_country_scope.GetName].\nA novel objective may be selected if eligible."
 me_epirus_1_epirus.18.desc:0 "We have obtained envoys from the kingdom of [me_epirus_scope.GetName], whose ruler, [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetName], desires to forge a royal marriage between the ruling families of [me_epirus_scope.GetRuler.GetHerHis] country and our own.\n\n[me_epirus_scope.GetRuler.GetSheHe|U] offers the hand of [me_epi_royal_wedding_bride_scope.GetPraenomen] to our [me_epi_royal_wedding_groom_scope.GetName], and naturally a not insignificant dowry."
 me_epirus_1_epirus.20.a:0 "Somewhere in another location, then."
 me_epirus_1_epirus.20.at:0 "Marriage arrangements will persist with other countries."
 me_epirus_1_epirus.20.b:0 "That is quite sufficient playing house..."
 me_epirus_1_epirus.20.bt:0 "Marriage arrangements will conclude."
 me_epirus_1_epirus.20.ct:0 "Marriage arrangements will conclude due to a lack of suitors."
 me_epirus_1_epirus.23.a:0 "For the favourable of the family."
 me_epirus_1_epirus.25.desc:0 "The regional administrations of Epirus are still dominated by local clans whose convoluted traditions and laws constrict our ability to administer our lands. Additional efforts must be made to ensure internal strictures do not get in the way of progress, and moves with the support of our [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)], [epi_steward.GetPraenomen]."
 me_epirus_1_epirus.25.at:0 "$me_epi_task_start_tt_1$ centralising power in [me_epirus_scope.GetName]."
 me_epirus_1_epirus.26.desc:0 "Our military, though on the way to central control, still divides its loyalties by region and blood bond. These ancient ties must be superseded by unwavering devotion to the king alone, and the clans taught that division only leads to weakness. Our [GetOffice('office_marshal').GetCulturalName(SCOPE.GetRootScope.GetCountry)], [epi_marshal.GetPraenomen] has some ideas for how to move forward..."
 me_epirus_1_epirus.27.at:0 "$me_epi_task_start_tt_1$ resolving affairs at court."
 me_epirus_1_epirus.28.desc:0 "Our most skilled workers are all but ready to establish a novel city on the Adriatic coast: one which will be worthy of the might of our kingdom and rival the urban centres of our fellow Greeks.\n\n"
 me_epirus_1_epirus.28.desc_1:0 "In honour of the support given to him after being deposed from the throne of Epirus, [SCOPE.GetRootScope.GetCountry.GetRulerTitle] Pyrrhos has elected to name the novel city after a notable maiden of his noble hosts in [SCOPE.Custom('get_me_epi_berenicis_country')], dubbing it [SCOPE.Custom('get_me_epi_berenicis_name')]."
 me_epirus_1_epirus.28.desc_3:0 "\n\nAll that remains is to select a suitable location along the Ionian coast."
 me_epirus_1_epirus.28.a:0 "We, too, can construct cities."
 me_epirus_1_epirus.28.e:0 "Dispatch the workers to [me_epi_1_8_city_4.GetName]."
 me_epirus_1_epirus.28.bt:0 "$me_epi_task_start_tt_1$ constructing a coastal city in #Y [berenicis_scope.GetName]#! called [SCOPE.Custom('get_me_epi_berenicis_name')]."
 me_epirus_1_epirus.29.desc:0 "The loss of the site of our novel city has undermined our construction, the materials for which have already been scavenged by bandits and thieves..."
 me_epirus_1_epirus.30.desc:0 "Our southern neighbours, the Epirotes, have dispatched us a delegation led by the talented speaker [epirote_diplomat_scope.GetPraenomen] offering us a pledge of friendship.\n\n"
 me_epirus_1_epirus.30.desc_3:0 "The kingdom is robust, and a friendship would secure our souther frontiers and permit us to focus our efforts in another location. Perhaps this is an opportunity to forge a lasting friendship with the heirs of Achilles..."
 me_epirus_1_epirus.30.b:0 "Times have modified."
 me_epirus_1_epirus.30.bt:0 "Epirus will obtain claims on Taulantian territories in the Areas of #Y Epirus#! and #Y Illyria Graeca#!."
 me_epirus_1_epirus.31.desc_2:0 "[epirote_diplomat_scope.GetSheHe|U] reports that they were given an icy reception, and the air was thick with distrust and recrimination. They are assuredly no longer our friends."
 me_epirus_1_epirus.32.desc:0 "Envoys from our Epirote neighbours on the mainland have arrived in our court, led by a [epirote_diplomat_scope.GetWomanMan] named [epirote_diplomat_scope.GetPraenomen]. Their honey veiled menaces hide a requirement that we bow down to Epirus as subjects and accept their garrison..."
 me_epirus_1_epirus.32.a:0 "We are unable to hope to defend ourselves."
 me_epirus_1_epirus.33.desc:0 "The isle of Korkyra has a storied past, settled by the Corinthians and reportedly the location of the first naval battle in history, which was fought versus their metropolis.\n\nThey are no longer a major naval power, but their location in command of our coasts is an intolerable potential menace. The island must come under our rule one method or another..."
 me_epirus_1_epirus.33.a:0 "It is a menace to our coasts."
 me_epirus_1_epirus.34.desc:0 "The shrine of Apollo Aktiakos at the mouth of the Ambrakian gulf is home to a major festival in the gods honour, where Akarnians assemble for games and feasts. We should renovate this famous place if we are to win the god's favour."
 me_epirus_1_epirus.35.desc:0 "Our renovations to the temple at Aktion are complete, and numerous worshipers and revelers from across Epirus have attended a grand inaugural festival in Apollo's honour. Each day Apollo takes on a novel importance in the prayers of our people."
 me_epirus_1_epirus.35.a:0 "We shall not let Apollo neglect our gratitude."
 me_epirus_1_epirus.36.desc:0 "Our recent efforts to modernise the city of [me_epirus_scope.GetCapital.GetName] with novel public edifices and initiatives have already seen a considerable deal of progress. All that remains is to repave the ancient roadways and ensure the rest of our infrastructure is well maintained."
 me_epirus_1_epirus.36.a:0 "It will be more than value it."
 me_epirus_1_epirus.37.desc_1:0 "The islanders have wisely acquiesced to our requirements, encouraged by the arguments of [epirote_diplomat_scope.GetPraenomen] and the more practical menace we pose to their lives..."
 me_epirus_1_epirus.37.desc_2:0 "The islanders have foolishly refused our requirements, and even thrust an insulting letter into the hands of [epirote_diplomat_scope.GetPraenomen] which questioned the legitimacy of our ruler!"
 me_epirus_1_epirus.37.b:0 "Then may the dim house welcome them."
 me_epirus_1_epirus.38.desc_1:0 "With the fall of Korkyra to other interested parties before we were able to make our intentions known, our claim to the island has obtained even more weight."
 me_epirus_1_epirus.38.desc_2:0 "With the acquisition of Korkyra complete, our diplomatic efforts are no longer requisite..."
 me_epirus_1_epirus.38.a:0 "Quite correct."
 me_epirus_1_epirus.39.desc:0 "Though we naturally look on the Taulantians as our friends and allies, the situation along their frontier with Epirus is far from ideal. The various villages and towns are fluid in their loyalties, and numerous in Taulantia would prefer to be governed by their ancient protectors: the Epirotes.\n\nIt has been suggested we prepare a delegation to the Taulantians, led by [epirote_diplomat_scope.GetPraenomen] naturally, to make some reasonable requirements without breaking our friendship."
 me_epirus_1_epirus.39.a:0 "[byllis_scope.GetName] is a just claim."
 me_epirus_1_epirus.39.at:0 "We will require the transfer of #Y [byllis_scope.GetName]#! to [me_epirus_scope.GetName]."
 me_epirus_1_epirus.39.b:0 "The entire frontier requires redressing."
 me_epirus_1_epirus.39.bt:0 "We will require the transfer of the territories south of #Y Epidauros#! and #Y Parthos#! to [me_epirus_scope.GetName]. (#Y [SCOPE.ScriptValue('me_epi_16_province_count_svalue')|0]#! Territories)"
 me_epirus_1_epirus.39.c:0 "Require their servitude."
 me_epirus_1_epirus.39.ct:0 "We will require Taulantia becomes our #Y Tribal Vassal#! subject."
 me_epirus_1_epirus.39.d:0 "We require no lands of theirs."
 me_epirus_1_epirus.39.tt2:0 "They will be more probable to accept a reasonable offer."
 me_epirus_1_epirus.40.desc:0 "Dodona is the most ancient site in the entire Hellenic religion, and home to the most ancient oracle of them all. There are numerous gods who have now been forgotten by the southerners but were once the foremost deities of our people. Among them is Dione, the She-Zeus, whose cult still attracts a minor but dedicated following."
 me_epirus_1_epirus.40.a:0 "We shall win her favour."
 me_epirus_1_epirus.41.desc:0 "We have obtained an insulting proclamation from the kingdom of [me_epirus_scope.GetName], whose leader [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetName] has declared our prior friendship a farce. They have laid claim to our frontier territories and make no effort to hide their aggressive aims!"
 me_epirus_1_epirus.42.desc:0 "The Ambrakian and Akarnian settlements on our southern frontiers have become little more than pawns to be traded between the bickering successors of Alexander. We must ensure their influence does not corner Epirus by pressing our claims on the entire Ambrakian gulf and beyond."
 me_epirus_1_epirus.43.desc:0 "Our ruler, [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetName] has announced an ambitious and divisive plan to relocate the entire court and administration of [me_epirus_scope.GetName] to the recently acquired city of Ambrakia, with plans to construct novel palaces and public edifices to reflect our vigour and glory."
 me_epirus_1_epirus.44.desc:0 "The administration has been successfully relocated to Ambrakia, where construction on the novel palace complex is set to persist for some time. From now on, all business will be conducted from the less defensible but more connected southern capital."
 me_epirus_1_epirus.46.desc_1:0 "Their diplomat, [epirote_diplomat_scope.GetPraenomen], explains that there is a considerable deal of tension in their court due to a dispute concerning the territory surrounding [byllis_scope.GetName] along our shared frontier. [epirote_diplomat_scope.GetSheHe|U] requests on behalf of [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] that the territory be moved under their jurisdiction."
 me_epirus_1_epirus.46.desc_2:0 "Their diplomat, [epirote_diplomat_scope.GetPraenomen], explains that there is a considerable deal of tension in their court due to a dispute concerning the territories north of their frontier. [epirote_diplomat_scope.GetSheHe|U] requests on behalf of [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] that all territories south of Epidamnos and Parthos be moved under their jurisdiction."
 me_epirus_1_epirus.46.desc_3:0 "Their diplomat, [epirote_diplomat_scope.GetPraenomen], explains that there is a considerable deal of tension in their court due to a dispute concerning our diplomatic relationship. [epirote_diplomat_scope.GetSheHe|U] requests on behalf of [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] that Taulantia become a protectorate of the kingdom of [me_epirus_scope.GetName] to resolve the issue."
 me_epirus_1_epirus.46.desc_4:0 "Their diplomat, [epirote_diplomat_scope.GetPraenomen] reports that despite numerous arguments in Epirus over the status of the frontier with Taulantia, their [me_epirus_scope.GetRulerTitle], [me_epirus_scope.GetRuler.GetPraenomen], decided that our friendship was worth too much to disturb."
 me_epirus_1_epirus.46.at2:0 "Our territories south of #Y Epidauros#! and #Y Parthos#! will be provided to [me_epirus_scope.GetName]. (#Y [SCOPE.ScriptValue('me_epi_16_province_count_svalue')|0]#! Territories)"
 me_epirus_1_epirus.46.bt1:0 "[me_epirus_scope.GetName] obtain claims on our territories south of #Y Epidauros#! and #Y Parthos#!. (#Y [SCOPE.ScriptValue('me_epi_16_province_count_svalue')|0]#! Territories)"
 me_epirus_1_epirus.46.bt2:0 "[me_epirus_scope.GetName] obtain claims on all our territories."
 me_epirus_1_epirus.46.c:0 "Very prudent of [me_epirus_scope.GetRuler.GetHerHim]."
 me_epirus_2_magna.111.desc:0 "Our western aims have been fulfilled, and then some. Who could have known that the Epirotes could so quickly rise from governing mountain tribes to a sea spanning empire in the rich lands of Italia. Tyche has been kind to us, and we will recall her in our prayers for all time."
 me_epirus_2_magna.1.desc:0 "We have succeeded in subduing the unruly Italics who, though it is arduous to believe, once managed to defeat our armies and slay our king, Alexandros I. With our position now established in Magna Graecia, we can move on to bigger and superior things."
 me_epirus_2_magna.2.desc:0 "The Italiote cities have grown weak; their citizens accustomed to soft lives of luxury and philosophizing while their spears lay forgotten in the dusty corners of their villas.\n\nWith the rise of Italic powers in the vacuum, even these sloths see the menace, and may be willing to exchange their autonomy for protection if it means the wine persists to flow. We should dispatch our most persuasive diplomat to secure the assent of one of their bloated assemblies."
 me_epirus_2_magna.3.desc:0 "Over time the Italiote cities have fallen into decadence, valuing a comfortable life above all else and neglecting their own defence, content to have others fight their conflicts for them.\n\n"
 me_epirus_2_magna.3.desc_1:0 "Now [italiote_threatened_scope.GetCapital.GetName] is under attack from the growing [italiote_threat_scope.GetAdjective] tribe, who pursue to supplant the Hellenic position in Magna Graecia."
 me_epirus_2_magna.3.desc_2:0 "Pathetic as this is, it provides us with a considerable opportunity to bring them under our protection and justify an invasion of Italia."
 me_epirus_2_magna.3.at:0 "If #Y [italiote_threatened_scope.GetName]#! accept, we will become their feudatory sovereign and declare conflict on #Y [italiote_threat_scope.GetName]#!.\n$me_epirus_2_magna.3.bt$"
 me_epirus_2_magna.3.tt:0 "We have obtained claims on all #Y [italiote_threat_scope.GetAdjective]#! territories in the Region of #Y $magna_graecia_region$#!."
 me_epirus_2_magna.4.desc:0 "We have succeeded in uniting the Italiotian colonies under our leadership and protecting Magna Graecia from the Italic menace. Epirus is once again a mighty realm that stretches across the sea and is feared and respected by her peers."
 me_epirus_2_magna.4.a:0 "A dream realised."
 me_epirus_2_magna.5.desc:0 "It is clear that the Italic barbarians will not surrender without a fight, but who is to say that there is not sufficient room for both Epirus and an Italic power in Italia?\n\n[epirote_diplomat_scope.GetPraenomen] could be dispatched to treat with the government of [epi_2_5_rome_scope.GetName] and locate a reasonable solution that benefits all."
 me_epirus_2_magna.5.b:0 "We will not endure a rival."
 me_epirus_2_magna.7.desc:0 "We have succeeded in prising some of the rich lands of Africa, dominated for hundreds of years by the miserly city of Carthage, from the Punic grasp. [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] has outdone Agathokles of Syracuse and fulfilled a Greek dream as ancient as the Peloponnesian Conflict!"
 me_epirus_2_magna.8.desc:0 "Our growing navy has drawn numerous experienced sailors into our ranks and brought numerous shipwrights a favourable deal of work and experience, creating a general mood of optimism and confidence in the vigour of Epirus and her fleet."
 me_epirus_2_magna.9.desc:0 "Our diplomatic efforts have seen some success in convincing the Italiotes of the necessity of our coming, but we can no longer tolerate the remaining sceptic's continued resistance. They must decide whether they are with us, or versus us."
 me_epirus_2_magna.9.at1:0 "The #Y [SCOPE.ScriptValue('epirus_2_magna_9_list_svalue')|0]#! remaining liberated #Y $italiotian$#! countries will receive a requirement to become Epirote feudatory subjects."
 me_epirus_2_magna.9.at2:0 "The #Y [SCOPE.ScriptValue('epirus_2_magna_9_list_svalue')|0]#! remaining liberated #Y $italiotian$#! country will receive a requirement to become an Epirote feudatory subject."
 me_epirus_2_magna.10.desc:0 "Epirote settlers are flocking to our ancient conquests in Magna Graecia, intent on ensuring these territories become integral and productive parts of our kingdom."
 me_epirus_2_magna.11.desc:0 "Epirus' position as the leading Greek power of the west can no longer be doubted, fulfilling Alexandros' ambition to carve out a realm to rival that of the Macedonians to the east.\n\nAlready the troops point to [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] as the liberator of Greece, calling [me_epirus_scope.GetRuler.GetHerHim], 'the Great' and comparing [me_epirus_scope.GetRuler.GetHerHis] achievements to Alexander of Macedon."
 me_epirus_2_magna.11.a:0 "Well, why not? [me_epirus_scope.GetRuler.GetSheHe|U] is pretty magnificent after all."
 me_epirus_2_magna.12.desc:0 "With our position in Magna Graecia established, [me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] looks to the rich island of Sicilia and the opportunities presented by the Greeks calls for aid versus the city of Carthage.\n\nBy putting ourselves forward as the protectors of the island we are sure to obtain much influence over the cities, and win glory over the barbarians."
 me_epirus_2_magna.12.tt:0 "$mission_task_completed_tt_1$$epirus_2_magna_12$$mission_task_completed_tt_2$\n[me_epirus_scope.GetName] obtains claims on all #Y $carthaginian$#! owned or dominated territories in Sicily."
 me_epirus_2_magna.12.at:0 "Other liberated #Y $syracusan$#! countries in Sicily may become our feudatories."
 me_epirus_2_magna.13.desc:0 "The island of Sicily has been wracked by constant warfare and strife for decades, if not centuries, and Agathokles, the latest in a long line of robust tyrants, has too been outlived by chaos.\n\n"
 me_epirus_2_magna.13.desc_2:0 "It falls to Epirus to rally the Siceliote cities and lead them versus the barbarians and into peace."
 me_epirus_2_magna.14.desc:1 "Our conquests in Sicily have proven that Epirus is no longer merely a shepherd, protecting ailing colonies from barbarian wolves, but a capable and fearsome power that can challenge the might of the magnificent city of Carthage."
 me_epirus_2_magna.15.desc:0 "While we represent the interests of the Greeks first and foremost, the Italic tribes can still be useful allies versus some of their more aggressive and organised brethren. Turning them versus each other can only benefit our position on the peninsula."
 me_epirus_2_magna.16.desc:0 "[me_epirus_scope.GetAdjective] diplomats have arrived led by their diplomat [epirote_diplomat_scope.GetPraenomen]. Under a veneer of honeyed words and metaphors they are requiring that we surrender our liberty to them and aid in their conflicts versus the barbarians of Italia and Africa."
 me_epirus_2_magna.16.a:0 "What selection do we have?"
 me_epirus_2_magna.17.desc:0 "[epirote_diplomat_scope.GetPraenomen] has delivered our requirements to the liberated Italiote cities of Magna Graecia."
 me_epirus_2_magna.17.desc_1:0 "It seems their reading and symposiums have done some favourable, as the wise among them have very reasonably accepted our will and come under our protection."
 me_epirus_2_magna.17.desc_2:0 "Our reasonable requirements were met with indignation and defiance, with not a singly city even feigning to contemplate our requests..."
 me_epirus_2_magna.17.a:0 "Prudent."
 me_epirus_2_magna.17.at:0 "We have obtained claims on #Y $italiotian$#! countries who refused our requirements."
 me_epirus_2_magna.17.bt:0 "We have obtained claims on every remaining liberated #Y $italiotian$#! country in the mainland Region of #Y $magna_graecia_region$#!."
 me_epirus_2_magna.18.desc:0 "Diplomats from [me_epirus_scope.GetName], the Greek invaders of southern Italia, led by a [epirote_diplomat_scope.GetWomanMan] named [epirote_diplomat_scope.GetPraenomen] have arrived to treat with us.\n\nLamenting our differences, [epirote_diplomat_scope.GetPraenomen] exhorts our assembly that common ground may be found and peace maintained with both [epi_2_5_rome_scope.GetAdjective] and [me_epirus_scope.GetAdjective] interests preserved.\n\nNumerous of our senators seem won over by the words of this sophist, that is, until [epi_2_5_caecus.GetPraenomen] is brought into the chamber and gives a scathing and rousing speech decrying their cowardice."
 me_epirus_2_magna.18.at:0 "We obtain claims on #Y [me_epirus_scope.GetAdjective]#! territories in #Y $central_italy_region$#! and #Y $magna_graecia_region$#!."
 me_epirus_2_magna.18.b:0 "Let us preserve our strength."
 me_epirus_2_magna.19.desc:0 "A party of envoys have arrived from Epirus across the Ionian sea, led by their diplomat [epirote_diplomat_scope.GetPraenomen]. It seems the ambitions of their ancient king Alexandros I, slain by the Bruttians and Lucanians, are not yet extinguished.\n\nOnce again they offer us their protection versus the rising Italic menace, and numerous on the senate floor would rather Epirotes did the arduous work of conflict and left them to their wine and reading."
 me_epirus_2_magna.19.bt:0 "#R [me_epirus_scope.GetName] will obtain claims versus us.#!"
 me_epirus_2_magna.20.desc_1:0 "It seems [epirote_diplomat_scope.GetSheHe] was able to persuade their leadership that receiving our protection was a worthwhile exchange for losing some autonomy over their foreign affairs."
 me_epirus_2_magna.20.desc_2:0 "[epirote_diplomat_scope.GetSheHe|U] reports that despite some very favourable made arguments, their leadership were not convinced that our motives were just or our protection warranted."
 me_epirus_2_magna.20.bt:0 "We may approach another Italiote country with the identical offer."
 me_epirus_2_magna.20.c:0 "Sufficient games, [epirote_diplomat_scope.GetPraenomen]."
 me_epirus_2_magna.20.ct:0 "We will relinquish approaching the Italiote cities."
 me_epirus_2_magna.20.tt:0 "We have obtained claims on #Y [me_epi_2_aid_scope.GetName]#!."
 me_epirus_2_magna.21.desc:0 "[epirote_diplomat_scope.GetPraenomen] has arrived, representing the [me_epirus_scope.GetAdjective] court. [epirote_diplomat_scope.GetSheHe|U] presents a compelling argument that we should accept [me_epirus_scope.GetAdjective] leadership and protection given the numerous menaces, internal and external, to the survival of our people."
 me_epirus_2_magna.21.a:0 "We require their vigour."
 me_epirus_2_magna.21.bt:0 "[me_epirus_scope.GetName] will obtain claims on us."
 me_epirus_2_magna.23.desc:0 "We have solicited support from any Greeks willing to aid us versus the barbarians, and an Epirote delegation led by [epirote_diplomat_scope.GetPraenomen] has arrived in [italiote_threatened_scope.GetCapital.GetName].\n\n"
 me_epirus_2_magna.23.desc_1:0 "They offer protection in exchange for command, but as our assembly debated the issue a male named Meton created a stir by declaring under the disguise of drunken farce:'take pleasure in your liberty now, Tarentines, for things will change under the [me_epirus_scope.GetAdjective] yolk.'"
 me_epirus_2_magna.23.desc_2:0 "They offer us protection and aid in our conflict versus [italiote_threat_scope.GetName] in exchange for acceding to their leadership in foreign affairs."
 me_epirus_2_magna.23.desc_3:0 "\n\nOur senate is divided, but numerous would rather have others go to conflict on our behalf and protect us from [italiote_threat_scope.GetName], who are a formidable foe and a menace to all of Megale Hellas..."
 me_epirus_2_magna.23.at:0 "#Y [me_epirus_scope.GetName]#! will declare conflict on #Y [italiote_threat_scope.GetName]#!."
 me_epirus_2_magna.23.tt2:0 "#Y [me_epirus_scope.GetName]#! has obtained claims on all #Y [italiote_threat_scope.GetAdjective]#! territories in the Region of #Y $magna_graecia_region$#!."
 me_epirus_2_magna.24.desc_1:0 "The debate was marked by the display of a male named Meton, who under the disguise of a drunken farce declared to all: 'take pleasure in your liberty now, Tarentines, for things will change under the [me_epirus_scope.GetAdjective] yolk.'"
 me_epirus_2_magna.24.desc_3:0 "In the conclusion however, their assembly voted to accept our leadership and devote recruits to the common cause of Greek victory over [italiote_threat_scope.GetName]."
 me_epirus_2_magna.24.desc_4:0 "Ultimately, they erred on the side of caution and rejected our generous proposal, fearing severe leadership..."
 me_epirus_2_magna.25.desc:0 "Envoys from [me_epirus_scope.GetName] have descended on the courts of Italia, from the pettiest chief to the most plump archon, to the decry our aggression versus the Greek city states of the peninsula."
 me_epirus_2_magna.26.desc_1:0 "In spite of our refusal to permit [me_epirus_scope.GetAdjective] meddling in our affairs, their declaration of opposition to the [italiote_threat_scope.GetAdjective] has dispatched a wave of fervor across the peninsula..."
 me_epirus_2_magna.26.desc_2:0 "The [me_epirote_scope.GetAdjective] declaration of opposition to the [italiote_threat_scope.GetAdjective] has dispatched a wave of fervor across the peninsula, convincing others to join the cause of redressing the balance of power in Italia."
 me_epirus_2_magna.27.desc:0 "Our Italiote subjects have been growing more and more disgruntled, decrying our leadership methods as severe and raging at our forced recruitment of their citizens.\n\nTheir leaders are now convinced that opposition to our rule is the only method to remain in power, and point to our failure to unite the region. It will be arduous to maintain these cities in line..."
 me_epirus_2_magna.27.a:0 "What do these schoolboys comprehend of conflict?!"
 me_epirus_2_magna.28.desc:0 "Our people and leaders have turned on their [me_epirus_scope.GetAdjective] leaders, unable to tolerate their severe requirements and forced drafting of the young males.\n\nIt seems a similar sentiment has arisen in all the Italiote cities under [me_epirus_scope.GetAdjective] guidance..."
 me_epirus_2_magna.29.desc_1:0 "It seems they are indeed worried about the Punic menace, and have asked for our assistance in the conflicts with the Punic barbarians."
 me_epirus_2_magna.29.desc_2:0 "They were reportedly cold and unreceptive to our diplomacy, claiming that they require no assistance and we should look to our security."
 me_epirus_2_magna.29.a:0 "Naturally they are."
 me_epirus_2_magna.30.b:0 "We can manage ourselves."
 me_epirus_2_magna.31.desc_1:0 "Our offer of assistance to the Siceliotes has been met with some very favourable responses, not least from cities who wish to come under our protection and leadership in the conflicts with barbarians."
 me_epirus_2_magna.31.desc_2:0 "The response to our offers of assistance has been lukewarm, with none of the surviving cities offering anything in the method of appreciation..."
 me_epirus_2_magna.31.a:0 "Dispatch overseers immediately."
 me_epirus_2_magna.31.b:0 "They make an error."
 me_epirus_2_magna.36.bt:0 "#R [me_epirus_scope.GetName] will obtain claims versus us.#!"
 me_epirus_2_magna.37.tt:0 "We have obtained claims on #Y [me_epi_2_15_ally_scope.GetName]#!."
