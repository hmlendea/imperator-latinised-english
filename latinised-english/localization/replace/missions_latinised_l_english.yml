l_english:
 centralization_desc:0 "is a region under our control with unrealised potential. We should send our administrators and procurators to this governorship to reinforce our hold over the area and develop the local economy."
 capital_mission_desc:0 "is our home as well as the centre of our country. We must develop the economy of our home region and renovate the capital itself to make it the shining centre of civilisation that it deserves to be."
 mission_colonia:0 "Stabilise and Develop"
 mission_centralization:0 "Development of"
 mission_centralization_goal:0 "Reinforce local authority in"
 mining_mission_prospecting:0 "Develop Local Mining and Prospect for novel Deposits\n"
 port_mission:0 "Develop Maritime Exchange\n"
 capital_branch_1_a_DESC:0 "While [SCOPE.sP('governorship_capital').GetName] has long been the capital of [SCOPE.sP('governorship_capital').GetState.GetShortName] it is being held back in its development by its lack of city rights. We should rectify this lack privileges immediately so that the outpost can develop into the provincial centre it requirements to be."
 capital_branch_1_b_DESC:0 "Our capital serves a great purpose to our country yet some would call it a mere village or hamlet. We must ensure that the city of [SCOPE.sP('governorship_capital').GetName] has the means to develop into the great central point for our country that it was invariably meant to be."
 capital_branch_1_c_DESC:0 "Anyone would concede that [SCOPE.sP('governorship_capital').GetName] is a great city, even one of the larger and more imposing that this region has ever seen. We must additional patronise this growing community and foster it into the Metropolis it is meant to be."
 capital_branch_2:0 "Expand Exchange in [SCOPE.sP('governorship_capital').GetState.GetShortName]"
 capital_branch_2_DESC:0 "The city of [SCOPE.sP('governorship_capital').GetName] and the entire surrounding province of [SCOPE.sP('governorship_capital').GetState.GetShortName] requires a greater number of imports in order to develop an thrive. We should entice merchants and traders to open novel routes to our province so that we may import more goods and food to its capital."
 fruits_of_the_land:0 "Fruits of the Territory"
 desc_fruits_of_the_land:0 "The Agricultural sector is booming in this Province after a concerted effort by the state to reinforce local farming estates."
 granary_of_x_DESC:0 "With the development of agricultural markets in [SCOPE.sState('food_province').GetShortName] it is quickly earning itself the nickname 'Granary of [SCOPE.sGovernorship('infra_governorship').GetName]'. This is an ideal spot for a state food depot. A place where our armies can restock prior to going on long campaigns."
 thriving_mining_sector:0 "Thriving Mining Centre"
 expand_work_force:0 "Expanding the Miner Labour Force"
 expand_work_force_DESC:0 "The growing affluence of [SCOPE.sState('mining_province').GetShortName] is not matched by its infrastructure. Voices are now being raised for furthering the development of the province so that more slaves can be brought in to man the mines."
 prospecting_mission_DESC:0 "It has come to our attention that there may well be more deposits of metals and minerals in [SCOPE.sState('mining_province').GetShortName] than those we have already found and developed. If we are willing to fund a large scale survey in the area we may well uncover novel finds that could be profitably developed."
 prospection_tooltip:0 "If Prospectors discover metals or minerals in #Y [SCOPE.sState('mining_province').GetShortName]#! you will be able to change Barter Goods produced here."
 no_thanks_prospector:0 "We will not persue any additional mining ambitions in [SCOPE.sP('find_struck_here').GetName]."
 generic_infra_mission.22.b:0 "We are not interested in developing this discover."
 generic_infra_mission.23.b:0 "We are not interested in developing this gold discover."
 generic_infra_mission.24.desc:0 "Our investigators have let us now that they have found a large deposit of gemstones in [SCOPE.sState('mining_province').GetShortName] near the outpost of [SCOPE.sP('find_struck_here').GetName]. If we are willing to spend the money to develop this discover it could be turned into a permanent source of revenue for the territory.\nShould we invest in this it means a very marked change to the local economy which is currently based around the export of [SCOPE.sP('find_struck_here').GetTradeGoods.GetName]."
 generic_infra_mission.24.b:0 "We are not interested in developing this Gemstone discover."
 generic_infra_mission.25.desc:0 "Our surveyors report finding sizeable deposits of Copper in the outpost of [SCOPE.sP('find_struck_here').GetName] in [SCOPE.sState('mining_province').GetShortName]. Should we select to develop this discover we could make the territory export the metal in short time.\nIf we invest in this it means a very marked change to the local economy which is currently based around the export of [SCOPE.sP('find_struck_here').GetTradeGoods.GetName]."
 generic_infra_mission.25.b:0 "We are not interested in developing this discover."
 generic_infra_mission.26.desc:0 "Our prospectors have sent word that they have struck some minor deposits of valuable metals in [SCOPE.sP('find_struck_here').GetName]. These are not sufficient to support large scale mining but via their investigation itself they have managed to secure enough of value to be able to send some to our state coffers."
 desc_cult_protector_religious_establishment:0 "Our support and patronization of a local cult has gained us robust support among the faithful of our nation."
 desc_cult_protector_king:0 "By working together with the religious establishment we have secured greater support for our royal dynasty and the kingdom as a entire."
 cult_protector_republic:0 "Favourable Omens"
 desc_cult_protector_republic:0 "The labour put in to support the religious establishment has borne fruit in the form of a great ascend in support for the state, and by extension those wielding executive power."
 desc_embelished_great_shrine_modifier:0 "Via continued patronization and investment by the state the shrines of this sacred place have been elevated to a national treasure. Pilgrims flock to this city and marvel at the greatness of its monuments."
 shrine_branch_2_DESC:0 "The great shrines of [SCOPE.sP('shrine_territory').GetName] are not living up to expectations of the divine gods that they honour. We must expand and renovate the temple complex, and make it worthy of our name."
 shrine_branch_3_DESC:0 "With the expansion of the [SCOPE.sP('shrine_territory').GetName] temple complex we need to ensure the priestly community has the means for continued support of the services there. A series of endowments is just what the sacred community requirements to maintain afloat over the centuries to come."
 shrine_branch_4_DESC:0 "It is not right that the men who venerate god in our name shall also serve temporal masters. We should grant autonomy to the priests of [SCOPE.sP('shrine_territory').GetName] so that they can devote themselves completely to sacred matters."
 shrine_branch_5_DESC:0 "With the expansion of the [SCOPE.sP('shrine_territory').GetName] temple complex we need to ensure the priestly community has the means for continued support of the services there. A great donation from the state treasury should be enough to maintain them afloat over the centuries to come."
 autonomous_shrine_tooltip:0 "The Novel Country will be a #G Feudatory#! of [THIS.GetCountry.GetName] (@[THIS.GetCountry.GetFlag]!) with a unique heritage."
 ceremony_event.tooltip:0 "The religious establishment will additional #G Reward#! [THIS.GetCountry.GetName] (@[THIS.GetCountry.GetFlag]!)."
 generic_infra_mission.1.desc:1 "The continuing renovations in [shrine_province.GetShortName] have attracted the attention of its governor, [shrine_province.GetGovernor.GetName]. According to our [religious_spokesman.GetOffice.GetCulturalName(ROOT.GetCountry)], [shrine_province.GetGovernor.GetPraenomen] has seen to it that some of the affluence is being funelled away from the project and into [shrine_province.GetGovernor.GetHerHis] possess pockets. When asked, the governor [shrine_province.GetGovernor.GetHerselfHimself] posits that [shrine_province.GetGovernor.GetSheHe] has simply been taking a fee for providing his services to the sacred project."
 generic_infra_mission.1.a:0 "We is unable to tolerate embezzlement!"
 generic_infra_mission.2.desc:1 "Word has gotten around about the renovations being complete in the [shrine_province.GetName] to the Shrines at [shrine_territory.GetName]. More labour means more people are seeking their fortune far away from home, among them a great group of masons who arrived today."
 generic_infra_mission.2.a:0 "We will construct a monument more lasting than bronze!"
 generic_infra_mission.3.desc:1 "The governor of [shrine_province.GetGovernorship.GetName] has taken an interest in the renovations that the shrine of [shrine_territory.GetName] is currently undergoing in his province of [shrine_province.GetShortName].\n\n[shrine_province.GetGovernor.GetSheHe|U] has offered to spend some of [shrine_province.GetGovernor.GetHerHis] personal affluence to aid the project, clearly expecting to share in some of the glory once the labour is complete."
 generic_infra_mission.5.desc:1 "The priests of [SCOPE.sP('shrine_territory').GetName] as well as the [SCOPE.sCharacter('religious_spokesman').GetOffice.GetCulturalName(ROOT.GetCountry)] have greeted our decision to renovate and expand on the sacred shrine of [SCOPE.sP('shrine_territory').GetName] with great joy and apprehension. In time it is their hope that the city and its sacred sites will become one of the great jewels of our nation and the [ROOT.GetCountry.GetPrimaryCulture.GetName] world."
 generic_infra_mission.5.desc2:1 "The priests of [SCOPE.sP('shrine_territory').GetName] have greeted our decision to renovate and expand on the sacred shrine of [SCOPE.sP('shrine_territory').GetName] with great joy and apprehension. In time it is their hope that the city and its sacred sites will become one of the great jewels of our nation and the [ROOT.GetCountry.GetPrimaryCulture.GetName] world."
 generic_infra_mission.5.tooltip:0 "The renovations of [SCOPE.sP('shrine_territory').GetName] will be continuing for a year."
 generic_infra_mission.6.t:0 "Renovations at an Conclusion"
 generic_infra_mission.6.desc:0 "Renovations of the shrines in the city of [SCOPE.sP('shrine_territory').GetName] are rapidly coming to a close. However, with the immediate expansion, repairs and embellishment of the city and its temple compound complete the question of how it will be maintained in the future still remains. The priests themselves clearly expect a large donation of either territory or money."
 generic_infra_mission.6.tooltip:0 "The future funding for the temples will be decided via which of the subsequent tasks you select."
 generic_infra_mission.7.t:0 "Shrine Renovations Attract Exchange"
 desc_pilgrim_traders:0 "With the construction of the great shrines in this province a great deal of merchants have come to pursue out novel business opportunities here."
 have_3_trade_goods_tooltip:1 "Invest in #Y 3#! Novel Exchange Routes in [SCOPE.sP('governorship_capital').GetState.GetShortName]. ([governorship_capital.Custom('get_trade_investment_mission_loc')]/#Y 3#!)"
 fortify_capital_DESC:0 "As the seat of our authority in all of [SCOPE.sGovernorship('infra_governorship').GetName] it is not tolerable that [SCOPE.sP('governorship_capital').GetName] lacks fortifications. We need to erect novel walls and ramparts to shield those who rely on us for protection."
 desc_capital_secured:0 "Finding recruits for our recently erected capital fortifications has proven very easy. There are many who will consider it an honour to serve, and even among influential families it has become fashionable to spend at least some time as officers for the city defences."
 found_colonia:0 "[ROOT.GetCountry.GetPrimaryCulture.GetName] Outpost"
 found_colonia_DESC:0 "The city of [SCOPE.sP('governorship_capital').GetName] is the centre of [ROOT.GetCountry.GetPrimaryCulture.GetName] power in [SCOPE.sGovernorship('infra_governorship').GetName] yet it is primarily a [SCOPE.sP('governorship_capital').GetCulture.GetName] city. By encouraging [ROOT.GetCountry.GetPrimaryCulture.GetName] outpost here we can construct a stable powerbase for our continued rule of the region."
 colonia_underway:0 "Outpost Policy"
 desc_colonia_underway:0 "Via various policies we are encouraging the outpost of our own people here, this will create a more stable powerbase and encourage the continued spread of our culture in the region."
 desc_migrants_stopped:0 "This territory is home to some who would dearly desire to leave it but the central authorities have complete what they can to stop them. This has led to a drop in morale and lessened efficiency."
 generic_infra_mission.8.desc:0 "Our [ROOT.GetCountry.GetPrimaryCulture.GetName] outpost policy in [SCOPE.sP('governorship_capital').GetName] has attracted the attention especially among some classes of soldiers in our army. Making use of the promise of free territory they have arrived in [SCOPE.sP('governorship_capital').GetName] seeking to make a novel life for themselves and their families."
 generic_infra_mission.9.t:0 "A Novel Life"
 generic_infra_mission.9.desc:1 "The promotion of [SCOPE.sP('governorship_capital').GetName] as a [ROOT.GetCountry.GetPrimaryCulture.GetName] has not only made it attractive to [ROOT.GetCountry.GetPrimaryCulture.GetName] settlers. A large number of families from elsewhere in [migrant_province.GetGovernorship.GetName] have begun to prepare for a novel life in the growing city of [SCOPE.sP('governorship_capital').GetName]."
 generic_infra_mission.9.b:0 "We is unable to support this."
 military_colonia_DESC:0 "The City of [SCOPE.sP('governorship_capital').GetName] has grown into an increasingly thriving centre of authority. A great number of loyal soldiers already live and labour here and the city itself would make an ideal centre for our military might in the region."
 desc_military_colony_mission_modifier:0 "In many ways this city is a military colony, populated to a great degree by soldiers and as a centre of the military establishment."
 trader_colony_DESC:0 "The city council of [SCOPE.sP('governorship_capital').GetName] has approached us asking for us to additional assistance the development of the city. It is already home to a number of wealthy merchants and it is the view of the council that this is the group we should additional reinforce in order for the city to develop to its full potential as our centre power in the region."
 colonia_finish:0 "Development of [SCOPE.sP('governorship_capital').GetName]"
 colonia_finish_DESC:0 "[SCOPE.sP('governorship_capital').GetName] now has all that is needed for it to be the centre of [SCOPE.sP('governorship_capital').GetOwner.GetAdjective] power that we desire. The only thing that is now still needed is an improvement of sanitation and the central food storage."
 desc_trade_city_mission_modifier:0 "Our labour to reinforce the merchant community in this city has turned it into a local commercial hub. This is not only an improvement for the state coffers but also strengthens the role of this city as a local cultural melting pot."
 governorship_success_char:0 "Up to #Y 3#! able #Y Minor Characters#! will ascend to serve their country."
 generic_infra_mission.28.desc:0 "By strengthening our auhtority in [SCOPE.sP('governorship_capital').GetName] and showing local society in [SCOPE.sGovernorship('infra_governorship').GetName] that our state is both powerful and willing to reward those that serve us, we have inspired a generation of Novel Men. Persons of ability that now pursue out opportunities to serve their country, hoping to win themselves affluence and influence."
 desc_well_cared_for_governorship_center:0 "Between the infrastructure and the strengthened local population this city has become an example for others to follow. In time it seems destined to be one of the greater urban centres of this part of the world."
 strengthen_governorship_capital:0 "Reinforce [SCOPE.sP('governorship_capital').GetName]"
 strengthen_governorship_capital_DESC:0 "As the capital of [SCOPE.sGovernorship('infra_governorship').GetName] [SCOPE.sP('governorship_capital').GetName] is the seat of power and the location of our high representatives. We must reinforce this city both as a defensive position and in its role as the centre of law and authority."
 desc_new_metropole:0 "This newly founded metropolis is attracting people and affluence from around our nation."
 generic_infra_mission.10.t:0 "Ascend of [SCOPE.sP('governorship_capital').GetName]"
 generic_infra_mission.11.desc:0 "Never prior to has the streets of [SCOPE.sP('governorship_capital').GetName] been as clean and its gardens so well kept. The [SCOPE.sP('governorship_capital').Custom('get_building_material_cloc')] [ROOT.GetCountry.Custom('get_fancy_buildings_cloc')] now make it immediately apparent that this is not just a city but also the very centre of a [ROOT.GetCountry.GetRankName], an urban expression of splendour and affluence."
 generic_infra_mission.12.t:0 "[SCOPE.sP('governorship_capital').GetName] Development"
 generic_infra_mission.12.d:0 "The Outpost policy in [SCOPE.sP('governorship_capital').GetName] has been fruitful. With a stream of [ROOT.GetCountry.GetPrimaryCulture.GetName] settlers moving in as well as the locals adopting to [ROOT.GetCountry.GetPrimaryCulture.GetName] culture, the city itself is increasingly emulating the great urban centres of our homeland."
 desc_royal_palaces_mission_modifier:0 "This is the very centre of our country, constructed to house the royal family. Over time this is also the district where all persons of importance have constructed their own homes, emulating the seat of power."
 desc_forum_mission_modifier:0 "This is the very centre of political power in our country, constructed to promote public political discussion and votes. Over time the district around this area has also come to house the influential elites as well as many official buildings and temples, emulating the style of the forum itself."
 desc_clan_council_compound_mission_modifier:0 "This is the centre of political power in our country, constructed to house all the major clans and the structure where the clan council itself meets. Over time the district around this area has grown to be where all people of importance construct their own homes, emulating the style of the main tribla compound."
 generic_infra_mission.13.desc:0 "Because time immemorial the great families of our country have also been prominently present in [SCOPE.sP('governorship_capital').GetName], close to the seat of power. With the currently continuing renovations however the geography of the city is rapidly changing. Entire novel blocks are being constructed of more durable materials, and with better sanitation, than ever prior to.\nIt is no surprise therefore that the families of [ROOT.GetCountry.GetName] have now begun to position themselves to acquire property close to and inside the novel quarters. They are offering us sizeable sums to be permitted access to the best plots."
 generic_infra_mission.13.ar_tooltip:0 "By favouring our ruling family so blatantly we are angering other #R Heads of Family#!.\n\n"
 generic_infra_mission.13.a:0 "Let us favour the [SCOPE.sChar('first_power_monger').GetFamilyDisplayName] Family."
 generic_infra_mission.14.desc:0 "It has been the hope of many that the structure of a new capital district in [SCOPE.sP('governorship_capital').GetName] will allow us to be free from ancient corruption and crime, things that have at times been seen as endemic to our ancient capital. Great structure projects such as ours can themselves bring out those who would pursue clandestine opportunities.\nA growing black market for government contracts have begun to construct up under our eyes, and local gangs are extorting workers and store owners alike in the novel districts."
 generic_infra_mission.14.a:0 "This [ROOT.GetCountry.Custom('get_base_government_type')] is constructed on pragmatism."
 generic_infra_mission.14.b:0 "We must root out this filth prior to it is too late!"
 desc_clean_slate:0 "With the renovations of this city, and the addition of novel districts to an already great city, the authorities have taken the opportunity to cleanse it of all the criminal elements that made life so hard to endure for its people prior to."
 building_corruption:0 "Ancient Sins"
 desc_building_corruption:0 "While this city has recently seen the addition of great works and entire novel districts of splendid architecture it has not managed to wash away the corruption and crime that have invariably been an integral part to life here."
 generic_infra_mission.15.desc:0 "The renovations of [SCOPE.sP('governorship_capital').GetName] is in some ways fundamentally reshaping the city, and not only via the addition of novel quarters in and around the novel buildings, every part of the city has been given a novel focus and a change of status. The commercial district has largely reoriented itself to support the novel class of artisans, scribes and administrators that now make up a much larger part of the city's fabric, and even in the slums a novel social order is slowly materializing.\nAs part of the wider works we are undertaking we could extend the renovations to another part of the city as well."
 generic_infra_mission.15.b:0 "The commercial district could use our assistance."
 generic_infra_mission.17.desc:0 "The continuing strengthening of our authority in [SCOPE.sP('governorship_capital').GetName] seems to have distress quite a few local strongmen in [SCOPE.sGovernorship('infra_governorship').GetName]. In name they have all sworn their allegiance to the [ROOT.GetCountry.Custom('get_base_government_type')] but with stone being added on stone for the local fortifications and with a growing cadre of local bureaucrats to support our Governor, there is worry in their ranks.\nWe could probable lessen the perceived menace of our more present authority if we invited some local potentates to settle in the city and take part in the institutions we are structure."
 desc_regional_magnates:0 "This territory is home to a number of local powerful magnates who hold power in this region. The privileges of these locals does reduce our revenue slightly but it also enables us to develop the city additional than we otherwise could."
 desc_alienated_local_elites:0 "Our efforts to create a novel and stronger centre of power in this region has had the side effect of alienating older elites. Them not settling here does have the added benefit of the city itself being easier to control."
 desc_growing_pains:0 "Our efforts to construct up a novel regional bureaucracy has been hampered slightly by a lack of local scribes educated to handle the task."
 generic_infra_mission.18.desc:0 "Strengthening our administration in [SCOPE.sP('governorship_capital').GetName] and thereby our rule in [SCOPE.sGovernorship('infra_governorship').GetName] has made it clear how among the local elite that are fit to labour in a proper [ROOT.GetCountry.GetPrimaryCulture.GetName] governor's office. It has been requested that we send some proper scribes from [ROOT.GetCountry.GetCapital.GetName] to support the struggling local Bureaucracy."
 generic_infra_mission.19.desc:0 "As part of the strengthening of the Governor's Office in [SCOPE.sP('governorship_capital').GetName] a great number of local officials have been sent out to measure, document and assess all territory in [SCOPE.sGovernorship('infra_governorship').GetName]. As invariably when such a survey is undertaken it can become clear how local records have been outdated, or even manipulated, to a large degree. As a reaction to this it turns out that [SCOPE.sChar('local_land_owner').GetName], whose family owns territory in the region, has now petitioned us to exempt some specific pieces of public territory from this examination..."
 generic_infra_mission.19.a.tooltip:0 "We will let the Cadastral Survey continue unhindered. Only time will inform if it uncovers something corrupt."
 generic_infra_mission.20.desc:0 "As our investigators cover more and more of the territory in [SCOPE.sGovernorship('infra_governorship').GetName] it has become quite clear why [SCOPE.sChar('local_land_owner').GetName] did not desire us to look too deeply into ownership. It is quite clear that the [SCOPE.sChar('local_land_owner').GetFamilyDisplayName] family has systematically helped itself to the public lands in the region, expanding their holdings far into it from their bordering private properties."
 generic_infra_mission.20.a:0 "This abuse of public territory must terminate immediately!"
 generic_infra_mission.21.desc:0 "Whether because there was no actual foul play or because the [SCOPE.sChar('local_land_owner').GetFamilyDisplayName] family also managed to bribe our officials we is unable to be sure, but the survey we undertook in [SCOPE.sGovernorship('infra_governorship').GetName] has not turned up any greater problems with ownership of territory or other assets. It is true that the [SCOPE.sChar('local_land_owner').GetFamilyDisplayName] family owns much property in the region, but none of it is suspect according to our scribes."
 port_branch_1:1 "[trade_sea.GetName] Exchange"
 port_branch_1_DESC:0 "Maritime Exchange has been the livelihood of the people in [SCOPE.sState('port_province').GetShortName] for generations. With the right encouragement we could make this develop into a wealthy urban area."
 desc_regional_center_of_trade:0 "The ports of this province makes it an ideal centre for maritime exchange, and a great entrepot of goods in general."
 expanded_shipyards_DESC:0 "The port of [SCOPE.sP('ship_building_center').GetName] would make a perfect naval base and centre for vessel production in [SCOPE.sGovernorship('infra_governorship').GetName], if we are willing to provide the necessary support."
 desc_ship_building_center_modifier:0 "This port is a major centre for vessel production."
 port_branch_2_DESC:0 "By expanding the commercial districts in [SCOPE.sState('port_province').GetShortName] we can create greatly expand its role as a major centre for overseas exchange."
 emporion_modifier:0 "Commercial Centre"
 desc_emporion_modifier:0 "This city is a capital not only in political terms, it is also a major exchange hub."
 generic_infra_mission.29.a.tooltip:0 "[SCOPE.sCharacter('religious_family_1').GetName] and [SCOPE.sCharacter('religious_family_1').GetHerHis] descendents will rule [SCOPE.sC('theocratic_enclave').GetName] in perpetuity.\nThe #Y [SCOPE.sCharacter('religious_family_1').GetFamilyDisplayAdjective]#! Family will be greatly honoured."
 generic_infra_mission.29.b:0 "We now honour [SCOPE.sCharacter('religious_family_2').GetName]!"
 generic_infra_mission.29.b.tooltip:0 "[SCOPE.sCharacter('religious_family_2').GetName] and [SCOPE.sCharacter('religious_family_2').GetHerHis] descendents will rule [SCOPE.sC('theocratic_enclave').GetName] in perpetuity.\nThe #Y [SCOPE.sCharacter('religious_family_2').GetFamilyDisplayAdjective]#! Family will be greatly honoured."
 generic_infra_mission.29.c.tooltip:0 "[SCOPE.sCharacter('religious_family_3').GetName] and [SCOPE.sCharacter('religious_family_3').GetHerHis] descendents will rule [SCOPE.sC('theocratic_enclave').GetName] in perpetuity.\nThe #Y [SCOPE.sCharacter('religious_family_3').GetFamilyDisplayAdjective]#! Family will be greatly honoured."
 desc_family_granted_temple_city:0 "This character is grateful due to the great honours bestowed on his family when they were made custodians of a theocratic subject state."
 holy_site_paphos_desc:0 "This is the centre of Aphrodite venerate, not only on Cyprus but in the entire Hellenic world."
 holy_site_asklepion_trikka_desc:0 "This is the oldest and most revered of all of Asklepius' sanctuaries. A centre of healing as well as of venerate."
 holy_site_kanopus_serapeion_desc:0 "This is one of the most prominent centres for Serapis venerate in Egypt, as well as a major centre of learning."
 holy_site_asklepion_kos_desc:0 "This Asklepion is one of the foremost in the Hellenic world, a centres where many of the most famous healers of our time, such as Hippocrates himself, were trained."
 holy_site_asklepion_epidauros_desc:0 "The Asklepion here was for a long time the most celebrated centre of healing in the Greek world."
 holy_site_halicarnassos_desc:0 "This was once one of the most prominent cultural and religious centres of the Greek world."
 holy_site_delos:0 "Sacred Island of"
 holy_site_dodona_oracle_desc:0 "The prophetic power of the voice of the sacred grove at Dodona has attracted pilgrims for centuries."
 holy_site_saqqara_serapeum_desc:0 "The burial place of Apis Bulls, has long a prominent centre for venerate of Ptah. It is now one of the most prominent centres for worshipping Serapis, and the Helleno-Egyptian syncretic pantheon."
 holy_site_babylon_desc:0 "This is the holiest sanctuary of Marduk and one of the oldest cultural centres in the Chaldean world."
 holy_site_ashur_desc:0 "This is the holiest sanctuary of Ashur and one of the most important sacred places in the Chaldean world."
 holy_site_niniveh_desc:0 "This is a centre of venerate for all the major Chaldean gods and was once the centre of the Neo-Assyrian Empire."
 holy_site_heliopolis_ra_desc:0 "This is the centre for venerate of Ra, the sun god."
 holy_site_shekhem_desc:0 "This is the final resting place of the Patriarch Joseph, his sons Ephraim and Manasseh as well as the location of the well of Jacob. A sanctuary most sacred to Samaritans and Jews alike."
 holy_site_ekbatana_desc:0 "This is said to be the location of the tomb of Esther, Queen of Xerxes, and her cousin Mordechai. Ever because it fell into our hands its importance as a Jewish pilgrimage has been growing."
 holy_site_susa_desc:0 "This is said to be the tomb of the Prophet Daniel. Ever because it came in our hands it is the home of a thriving Jewish priestly community."
 holy_site_taif_desc:0 "This city houses the sanctuary where the idol of Allat is kept, a religious centre for many of the Arabic faith."
 holy_site_tyre_desc:0 "This is one of the oldest and most revered urban centres in the Canaanite world and centre to the cult of Melqart."
 holy_site_hierapolis_bambyce_desc:0 "This is the centre of the cult of the godess of Atargatis and was for a long time the capital of a dynasty of priest kings ruling by her grace."
 holy_site_byblos_desc:0 "This is the most important sanctuary of the conflict god Resheph, and one of the oldest urban centres in the Canaanite world."
 holy_site_zenopolis_desc:0 "Zenopolis and the adjacent Mount Hermon is home to a great number of temples that honour the gods of our religion."
 holy_site_barygaza_desc:0 "This site is sacred to Hindus, Jains and Buddhists alike."
 holy_site_mathura_desc:0 "This is the birthplace of Krishna and one of the oldest sacred sites in India."
 holy_site_dvaraka:0 "Sacred City of"
 holy_site_dvaraka_desc:0 "This is a sacred city among all the Dharmic faiths."
 holy_site_taxila_desc:0 "This has been a noted centre of learning and religious piety for centuries, if not millennia."
 holy_site_mulasthanapura_desc:0 "Said to have been constructed by Samba, son of Krishna, the sun Temple here houses an idol that is said to be able to cure all sickness."
 holy_site_koti_desc:0 "It is said that the territory bridge between India and the island of Lanka was constructed by the god Rama to rescue his wife Sita from Ravanna. Today this city stradles that territory bridge and acts as one of the major pilgrimages for Rama."
 holy_site_kusinagara:0 "Sacred city of"
 holy_site_gaya_desc:0 "As the place where Buddha achieved enlightenment this city has grown into a major centre of learning, a religious pilgrimage and one of the most revered places in Buddhism."
 holy_site_adur_gusnasp_desc:0 "This is the place of the most sacred of all sacred fires, and which has been burning for centuries."
 holy_site_anglesey:0 "Sacred Island near"
 holy_site_anglesey_desc:0 "The island sanctuary here has been a centre for druidic venerate for centuries."
 holy_site_glanum_desc:0 "The healing spring at this site is the centre of a centre of venerate dedicated to the god Glanis."
 holy_site_bibracte_desc:0 "The sacred springs here have been a pilgrimage for our people for generations."
 holy_site_o_facho_de_donon_desc:0 "This is the centre of Berobreo venerate in our region and a pilgrimage to our people."
 temples_of_desc:0 "This is a major religious centre of our faith."
 generic_infra_mission.30.desc:0 "It is with great pride that the shipbuilders of [SCOPE.sP('ship_building_center').GetName] have let us know that our novel flagships are ready to be taken into use.\n\nThese novel titans of the sea will undoubtedly be very useful to our navy but prior to they are taken into service they will serve our purposes in internal politics.\nThe birthing ceremeony is unable to be held by anyone but our ruler himself, but the maiden voyage will require a commander. A great honour and a boon that many families would value highly."
 family_granted_naval_job:0 "Maritime Honour"
 desc_family_granted_naval_job:0 "As a sign of how much the state values the hard labour and ability of this family they bestowed the right to captain novel flagships for their maiden voyage on them. A gesture the family is unlikely to forget."
 desc_temples_built:0 "We have invested in enlarging the religious district of a sacred site under our care."
 desc_fortified_stronghold:0 "This city is home to an unusually robust set of fortifications."
 slave_city_modifier:0 "Production Centre"
 desc_slave_city_modifier:0 "This is a regional centre of production and mills. Renowned for being a comparatively good place to live for a slave."
 slave_city_task_DESC:0 "The city of [SCOPE.sP('urbanize_area_city').GetName] would make for an excellent centre of production if we could just provide the required infrastructure."
 build_barracks_DESC:0 "Our country requires more loyal soldiers and the people of [SCOPE.sP('urbanize_area_city').GetName] are ideally suited to supply us with novel men for the frontlines."
 expand_harbor:0 "[SCOPE.sP('urbanize_area_city').GetName] Harbour"
 expand_harbor_DESC:0 "The harbour of [SCOPE.sP('urbanize_area_city').GetName] could be an important exchange point in this province if we were willing to develop the commercial district."
 cultural_imperialism:0 "Colonisation of [SCOPE.sState('urbanize_area_province').GetShortName]"
 urbanize_city:0 "Development of [SCOPE.sP('urbanize_area_city').GetName]"
 urbanize_city_DESC:0 "The outpost of [SCOPE.sP('urbanize_area_city').GetName] has experiencing severe development pains. If given the rigth support it could probable become a thriving city in this area."
 tribal_reform_DESCRIPTION:0 "The time has come for our great country to transition into a more civilised sedentary state.\nOpinions differ greatly on how this can best be achieved even among our most ardent supporters. Some argue that we should adopt a representative mode of governance, while others feel that we a hereditary monarchy would be preferable."
 tribal_reform_BUTTON_TOOLTIP:0 "It is time for our people to consider novel methods of rule. Foreign ideals flood our country - can we truly remain a nomadic people?"
 generic_infra_mission.38.desc:0 "The developing situation in [mining_province.GetName] has undermined our continuing plans to expand the province's mining infrastructure."
