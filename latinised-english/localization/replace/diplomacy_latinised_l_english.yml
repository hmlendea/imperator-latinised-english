 OFFER_tributary_AT_WAR:1 "@trigger_no![COUNTRY.GetDescriptiveName] is at conflict!"
 OFFER_vassal_tribe_NEWDESC:0 "Do you wish to demand that [COUNTRY.GetName] that country remits $CASH$ each month in tribute for our protection? Our protection will also permit their civilization value to grow over time."
 BREAK_vassal_tribe_NEWDESC:0 "Do you wish to stop being a Tribal Vassal of [COUNTRY.GetName]?\nThis will cause our relations to worsen and they will obtain a Casus Belli versus us and will reduce the current maximum Civilization value in our country."
 OFFER_vassal_tribe_REQDESC:0 "[COUNTRY.GetName] is asking us to become a Tribal Vassal. We will be required to dispatch $CASH$ to them each month.\nThis will also increase our maximum Civilization value, and civilization growth over time."
 OFFER_vassal_tribe_AT_WAR:1 "@trigger_no![COUNTRY.GetDescriptiveName] is at conflict!"
 OFFER_satrapy_NEWDESC:0 "Do you wish to offer [COUNTRY.GetName] to become our Satrapy and remit $CASH$ each month? This considerable vassal will make us appear more legitimate to our subjects."
