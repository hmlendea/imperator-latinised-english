 OFFER_subject_colony_REQDESC:0 "[COUNTRY.GetName] is asking us to become a Colony. We will be required to dispatch $CASH$ to them each month and our citizens will be unhappier. We will however enjoy their protection and maintaining our armies will be cheaper."
 OFFER_subject_colony_AT_WAR:1 "@trigger_no![COUNTRY.GetDescriptiveName] is at conflict!"
 OFFER_subject_colony_FLAVOR:0 "A Colony is a subject nation that descended from a mother nation, who dispatches a portion of their monthly revenue to their old homeland in exchange for protection. Colonies do not cost a diplomatic slot, are unable to cancel the relationship and are unable to be integrated."
