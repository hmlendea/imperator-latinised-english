l_english:
 AIREASON_TRADEGOOD:0 "They desire a particular trade good from [COUNTRY.GetName]."
 AIREASON_MILITARYACCESS:0 "They desire to be provided military access."
 AIREASON_WAR:0 "They desire to provoke conflict."
 nation_rank_5:0 "Magnificent Power"
 CRANK_CAN_INTERVENE:0 " - Can Intervene in Conflicts.\n"
 CRANK_CAN_THREATEN_WAR:0 " - Can Threaten Conflict.\n"
 neutral_stance_desc:0 "A #Y Neutral#! diplomatic stance means there is no active focus towards any particular diplomatic end. This lack of direction limits efficiency in pursuing specific goals but it also permits greater flexibility in creating novel agreements and alliances."
 appeasement_stance_desc:0 "An #Y Appeasing#! stance is focused on presenting a more palatable image abroad while strengthening ties with existing friends. Some would say it a method of making amends for past sins."
 trading_stance_desc:0 "A #Y Mercantile#! diplomatic stance means that all efforts are focused on creating novel trade deals as well as increasing the profitability of existing ones."
 warmongering_stance_desc:0 "A #Y Bellicose#! diplomatic stance means that all diplomatic efforts are focused on justification for expansion and intimidation of proximate countries."
 DIPSTAOP_NEIGHBOUR:0 "The opinion of our #Y Neighbours#!: $VAL|+=0$"
 NO_DECAY_IN_OFF_WAR:0 "@trigger_no!There is no inherent decay of our current #Y Aggressive Expansion#!, as we are currently the aggressors in a conflict."
 WAR_TOOLTIP_HEADER:0 "Declare Conflict on $NAME$"
 WAR_FLAVOR:0 "While at conflict with a nation you can move your troops into its territory. By occupying its provinces and demanding them in return for a Peace you conquer enemy provinces. Unless you have a Casus Belli your Stability will suffer greatly from a declaration of conflict."
 INVITE_DEF_FLAVOR:1 "We will form a Defensive League as the leader or invite another member to join our existing league. A Defensive League is a multi-nation alliance for small nations which calls every member to the aid of any member who is attacked. Defensive Leagues are unable to refuse to aid each other and will not be called to each other's offensive wars. Only the leader of a Defensive League can invite members or accept requests to join."
 ASKJOIN_DEF_FLAVOR:1 "If accepted we will join the leader's Defensive League. A Defensive League is a multi-nation alliance for small nations which calls every member to the aid of any member who is attacked. Defensive Leagues are unable to refuse to aid each other and will not be called to each other's offensive wars. Only the leader of a Defensive League can invite members or accept requests to join."
 LEAVE_DEF_FLAVOR:1 "We will leave the Defensive League. A Defensive League is a multi-nation alliance for small nations which calls every member to the aid of any member who is attacked. Defensive Leagues are unable to refuse to aid each other and will not be called to each other's offensive wars. Only the leader of a Defensive League can invite members or accept requests to join."
 GUARANT_FLAVOR:0 "Guaranteeing a country will call you to their aid if they are attacked. This allows a robust nation to protect weaker countries without an alliance."
 ANNEX_FLAVOR:0 "Diplomatic annexation allows us to integrate a Client State, Feudatory, or Satrapy into our nation without declaring conflict. The cost and length of the process will depend on their relative power."
 OFFER_tributary_FLAVOR:0 "A Tributary is a loose subject who gives a portion of their monthly revenue to their overlord in exchange for protection. Tributaries do not use a diplomatic slot but cannot be integrated diplomatically and may cancel the relationship. Tributaries are not automatically called to their overlord's wars."
 OFFER_vassal_tribe_FLAVOR:0 "A Tribal Vassal is a tribal subject of a civilized nation who gives a portion of their monthly manpower revenue to their overlord in exchange for protection and bonuses to Civilization. Tribal Vassals do not use a diplomatic slot but cannot be integrated diplomatically and may cancel the relationship. Tribal Vassals are not automatically called to their overlord's wars. The overlord also receives a bonus to tribal population happiness."
 OFFER_satrapy_FLAVOR:0 "A Satrapy is a sizeable Persian subject of an appropriately powerful overlord who gives a large portion of their monthly revenue in exchange for protection. Satrapies use a diplomatic slot and cannot cancel the relationship, but may be integrated diplomatically under certain conditions. Satrapies are automatically called to their overlord's wars. Satrapies and their overlords must be Monarchies. The overlord also receives a bonus to their legitimacy."
 OFFER_client_state_FLAVOR:0 "A Client State is a small subject nation who gives a portion of their monthly revenue to their overlord and is under their control. Client States cost a diplomatic slot and cannot cancel the relationship, but may be integrated diplomatically under certain conditions. Client States are automatically called to their overlord's wars. Nations are unlikely to become Client States voluntarily."
 OFFER_feudatory_FLAVOR:0 "A Feudatory is a small subject nation who gives a portion of their monthly manpower revenue to their overlord and is under their control. Feudatories do not cost a diplomatic slot, cannot cancel the relationship, and may be integrated diplomatically under certain conditions. Feudatories are automatically called to their overlord's wars. Feudatories must be of the same culture group as their overlord and also receive cheaper army maintenance in exchange for less Citizen happiness."
 MILACC_FLAVOR:1 "Giving access will allow a country to peacefully move troops through and station ships in our territories. Without being granted access another country's armies are unable to move through your territory unless at conflict with you or exiled. This will also improve our relations."
 OFFERMILACC_FLAVOR:1 "Requesting access allows a country to peacefully move troops through and station ships in another country's territories. Without being granted access our armies are unable to move through another country unless at conflict with them or exiled. This will also improve our relations."
 INSULT_FLAVOR:0 "Insulting another country will purposefully damage their opinion of us, making them less likely to accept other diplomatic actions, and provide them a Casus Belli to declare conflict versus us."
 CALL_FLAVOR:0 "Calling an allied country to arms will request them to join our conflicts; if they reject the request the alliance will be broken."
 SUPPORTREB_FLAVOR:0 "Supporting rebels attempts to undermine another country without fighting them by increasing unrest among their Wrong-Culture population, increasing the possibility for revolts or civil conflicts, but provides them a Casus Belli on us while active."
 ASKTRADEACC_FLAVOR:0 "Trade access will permit our nations to exchange trade goods and generate commerce revenue."
 BARB_SURRENDER_FLAVOR:0 "Demanding surrender of the barbarians will return all our occupied territory to our control and disband their army, and provide us with slaves and revenue."
 BARB_CLIENT_FLAVOR:1 "The barbarians will be offered their own State as our Tribal Vassal, taking all the land they currently occupy with them in exchange for peace. The novel state will be a Tribe of the barbarian's religion and culture."
 BARB_PAYOFF_FLAVOR:1 "Paying off the barbarians will remove their armies and return all our occupied territory, in exchange for money. They will no longer invade our territories, and go hassle someone else, until someone else purchases them off."
 CANCEL_IMPROVE_RELATION_FLAVOR:0 "This will cease the improvement of this country's opinion of us."
 INTERVENE_IN_WAR_FLAVOR:0 "A power of appropriate rank may intervene in a conflict started by or involving another powerful country as their enemy."
 ENFORCE_PEACE_FLAVOR:0 "A power of appropriate rank may enforce peace in a conflict which does not involve another powerful nation."
 THREATEN_WAR_FLAVOR:1 "Threatening war allows a country to obtain a territory from another without fighting a conflict versus them. If accepted, the chosen territory will be transferred in exchange for Aggressive Expansion."
 DEMAND_ACCESSNEWDESC:0 "Is your intent to Demand Military Access? They will surely be agitated, and if they refuse there will be a conflict that pits us alone versus their alliances."
 DEMAND_ACCESS_IN_WAR:0 "We are already at conflict!"
 ABANDON_FLAVOR:0 "By abandoning this country we can make peace with both sides of their civil conflict and avoid involvement."
 INVITE_DEF:0 "Invite $NAME$ to unite a Defensive League with us, where will we defend together versus hostile nations."
 INVITE_DEFDESC:0 "Do you wish to invite $COUNTRY$ to a defensive league. Doing so will oblige us to defend them versus aggressors in a conflict."
 INVITE_DEFREQDESC:0 "$ACTOR$ offers to join with us in a Defensive League. By doing so we are promising to assist each other if we get attacked. $OTHER$"
 ASKJOIN_DEFDESC:0 "Do you wish to ask $COUNTRY$ to join their defensive league. Doing so will oblige us to defend them versus aggressors in a conflict, while they will protect us similarly."
 ASKJOIN_DEFREQDESC:0 "$ACTOR$ asks permission to join our Defensive League. By doing so we are promising to assist each other if we get attacked."
 ASKJOIN_DEF:0 "Ask $NAME$ to unite their defensive league with us, where will we defend together versus hostile nations. $OTHER$"
