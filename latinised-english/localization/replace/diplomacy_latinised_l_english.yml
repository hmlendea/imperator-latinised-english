 OFFER_feudatory_REQDESC:0 "[COUNTRY.GetName] is asking us to become a Feudatory. We will be required to dispatch $CASH$ to them each month and our citizens will be unhappier. We will however enjoy their protection and maintaining our armies will be cheaper."
