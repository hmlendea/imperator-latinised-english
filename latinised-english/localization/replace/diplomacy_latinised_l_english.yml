 SUBJECT_TYPE_CAN_JOIN_INDEPENDENCE_WARS:0 "[TARGET_COUNTRY.GetName] can opt to unite independence conflicts."
 OFFER_tributary_NEWDESC:0 "Do you wish to demand that [COUNTRY.GetName] that country remits $CASH$ each month in tribute for our 'protection'?"
 BREAK_tributary_NEWDESC:1 "Do you wish to stop paying tribute to [COUNTRY.GetName] \nThis will cause our relations to worsen and they will obtain a Casus Belli versus us for 5 years."
 OFFER_tributary_DESC:0 "Suggest that they remit tribute to us, and we will protect them."
 OFFER_tributary_REQDESC:0 "[COUNTRY.GetName] is requesting us to remit a tribute of $CASH$ to them each month. By accepting"
