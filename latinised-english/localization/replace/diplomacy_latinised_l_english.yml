 OFFER_client_state_REQDESC:0 "[COUNTRY.GetName] is asking us to become a Client State. We will be required to dispatch $CASH$ to them each month."
 OFFER_client_state_TOO_LOW:1 "@trigger_no!To make [COUNTRY.GetDescriptiveName] a Client State, their opinion of you must be at least $NEED|Y$, while it is currently only $VAL|Y$.\nA client state remits a minor amount of money in exchange for protection and commerce bonuses."
 OFFER_client_state_AT_WAR:1 "@trigger_no![COUNTRY.GetDescriptiveName] is at conflict!"
