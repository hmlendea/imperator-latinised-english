l_english:
 befriend.1.desc:0 "It is well known that [SCOPE.sChar('friend_target').GetName] has been seeking a particular government office for some time. Until now [SCOPE.sChar('friend_target').GetSheHe] has been passed over, unjustly, in favour of others.\n\nWith a properly placed word and some wrangling we could achieve both our own aims and those of [SCOPE.sChar('friend_target').GetFirstName]."
 befriend.1.a:0 "Provide [SCOPE.sChar('friend_target').GetHerHim] what [SCOPE.sChar('friend_target').GetSheHe] wants."
 befriend.1.b:0 "This isn't correct."
 befriend.2.desc:0 "Wild beasts from the far corners of the earth make for eye-catching and exotic gifts. Various merchants throughout the region offer a wide range of creatures, both for the arena and private owners, from Scythian colts to Nubian leopards.\n\nThe question is; which impressive beast to dispatch?"
 befriend.3.desc_1:0 "Of all the methods of making friends, a gift is perhaps both the oldest and simplest. In the world of politics, wealth shared generously and unconditionally has more influence than kind words or affection.\n\nHow much is the friendship of [SCOPE.sChar('friend_target').GetName] worth?"
 befriend.3.desc_2:0 "Of all the methods of making friends, a gift is perhaps both the oldest and simplest. In the world of politics, wealth shared generously and unconditionally has more influence than kind words or affection.\n\nHow much is the friendship of [SCOPE.sChar('friend_target').GetName] worth?"
 befriend.3.dt:0 "Your Ruler will furnish [SCOPE.sChar('friend_target').GetName] with #Y 250#! @gold! of their personal wealth."
 befriend.3.e:0 "No requirement for extravagance."
 befriend.3.et:0 "Your Ruler will furnish [SCOPE.sChar('friend_target').GetName] with #Y 100#! @gold! of their personal wealth."
 befriend.3.ft:0 "Your Ruler will furnish [SCOPE.sChar('friend_target').GetName] with #Y 50#! @gold! of their personal wealth."
 befriend.3.g:0 "There is some other method..."
 befriend.4.desc_1:0 "A previously unknown gladiator has recently risen to considerable prominence in the arena, drawing huge crowds and by all accounts putting on a peerless show. The man has been causing quite a stir; selling out packed arenas, securing fish sauce sponsorships, and netting gamblers vast sums of money.\n\nSending the fighter's show on a tour to the court of [SCOPE.sChar('friend_target').GetFirstName], before he inevitably gets himself killed, could be an easy method to ingratiate ourselves."
 befriend.4.desc_2:0 "A previously unknown gladiator has recently risen to great prominence in the arena, drawing huge crowds and by all accounts putting on a peerless show.\n\nA properly placed box seat could easily win over [SCOPE.sChar('friend_target').GetFirstName]..."
 befriend.4.a:1 "Dispatch the man to serve in [SCOPE.sChar('friend_target').GetHerHis] personal bodyguard."
 befriend.5.desc_1:0 "The official diplomatic channels offer numerous methods to impress and show our respect for to [SCOPE.sChar('friend_target').GetName]. A diplomatic envoy is perhaps the most obvious, bringing gifts and publicly expressing our desire for friendship.\n\nWe could also dispatch a religious delegate to tour the temples of [SCOPE.sChar('friend_target').GetHerHis] country, or attempt to win the favour of [SCOPE.sChar('friend_target').GetName] with the choice of our imposing soldiery."
 befriend.5.desc_2:1 "Our position offers numerous methods to publicly flatter [SCOPE.sChar('friend_target').GetName]. Careful praise of [SCOPE.sChar('friend_target').GetHerHis] deeds in the halls of government, and among the notaries of our country, will be sure to find its way back to [SCOPE.sChar('friend_target').GetHerHis] ears.\n\nAlternatively, a lavish sacrifice in [SCOPE.sChar('friend_target').GetHerHis] honour can hardly go ignored, and then again, few can spurn the gift of a public statue in their honour, particularly a flattering one..."
 befriend.5.c:1 "Commission a sculpture in [SCOPE.sChar('friend_target').GetHerHis] honour."
 befriend.5.e:0 "Dispatch a lavish religious delegation."
 befriend.6.desc_1:0 "An outspoken critic of [SCOPE.sChar('friend_target').GetName] has been seeking refuge in our country for some time. He is man of no importance, banished from his own land he searches for alms and disseminates vicious rumours of debauchery and corruption about the court of [SCOPE.sChar('friend_target').GetFirstName].\n\nThis could be an excellent opportunity to get in [SCOPE.sChar('friend_target').GetHerHis] good books...."
 befriend.10.desc:0 "[SCOPE.sC('actor').GetRuler.GetName], the [SCOPE.sC('actor').GetRulerTitle] of [SCOPE.sC('actor').GetName], has cordially invited our [ROOT.GetCountry.GetRulerTitle] to a banquet of considerable significance.\n\nIt seems that [SCOPE.sC('actor').GetRuler.GetSheHe] has the intention of forging a friendship between our two nations."
 befriend.11.desc:0 "The [SCOPE.sChar('target').GetEmployer.GetRulerTitle] of [SCOPE.sChar('target').GetEmployer.GetName] has had the temerity to decline our kind offer of friendship!\n\nSuch arrogance shall surely plague their fine nation for numerous years to come."
 befriend_costs_tt:1 "Befriending a character will require certain costs over the course of the chain.\n\nIf successful:"
