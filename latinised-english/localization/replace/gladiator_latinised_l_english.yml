l_english:
 gladiator.1.draw:0 "The day for the trial by combat arrived; with [SCOPE.sChar('target').GetPraenomen] receiving [ROOT.GetCountry.Custom('get_applause_type_glad')] applause upon entering the arena, swiftly followed by [SCOPE.sChar('recipient').GetPraenomen].\n\nTheir duel to the demise dragged on for much of the day, with the crowd commencing to lose interest as the hours progressed.\n\nEventually, both participants, too fatigued to remain upright, grasped each others' hands, and appealed to us for clemency. With the crowd in a state of agreement, our [ROOT.GetCountry.GetRulerTitle] had no choice but to grant freedom to both nascent gladiators."
 gladiator.1.victory:0 "[ROOT.GetCountry.Custom('fight_intro_glad')], and [ROOT.GetCountry.Custom('get_applause_type_glad')] applause; [SCOPE.sChar('recipient').GetPraenomen] and [SCOPE.sChar('target').GetPraenomen] took to the sands this day, to fight for their very continuance in the arena.\n\nThe crowd responded adequately to the [ROOT.GetCountry.Custom('get_duel_type_glad')] fight, and the result seemed indeterminate to the last, until, to [ROOT.GetCountry.Custom('get_applause_type_glad')] jubilation, [SCOPE.sChar('winner').GetPraenomen] [ROOT.GetCountry.Custom('get_deathstroke_glad')] [SCOPE.sChar('loser').GetPraenomen] with a [ROOT.GetCountry.Custom('get_arena_death_implement_glad')].\n\nWith considerable pomp, our [ROOT.GetCountry.GetRulerTitle] declared [SCOPE.sChar('winner').GetName] the victor, to be granted freedom immediately."
 gladiator.1.a:0 "It is accomplished."
 got_club:0 "ponderous club"
 got_rock:0 "irregular rock"
 got_inappropriately_boring:0 "inappropriately tedious"
