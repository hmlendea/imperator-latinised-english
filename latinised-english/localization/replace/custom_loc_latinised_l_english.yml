 wily_odysseus:0 "handsome fellow as devious as wily Odysseus"
 old_guy_desc:0 "surprisingly aged man"
 hoplitodromos_event:0 "final race of this Olympiad, the hoplitodromos, in which the competitors endured a full lap of the stadium, clad in full body armour. [SCOPE.sChar('highlight_competitor_1').GetPraenomen] of [SCOPE.sC('highlight_1_origin_country').GetName] traversed the finishing line a good hour after the race began, having stopped to flirt outrageously with a group of giggling maidens."
 synoris_event:0 "prestigious chariot race, the synoris. [SCOPE.sChar('highlight_competitor_1').GetPraenomen] of [SCOPE.sC('highlight_1_origin_country').GetName] saved a fellow competitor from almost assured demise, when his chariot was overturned in the dusty mayhem of the race."
 olympic_wins_3:0 "thrice victor of the Olympics"
 olympic_wins_5:0 "who has been victorious at the games on more occasions than anyone can recall"
 medical_accident_generic_1:0 "operate on the incorrect area"
 medical_accident_generic_4:0 "be entirely unsuccessful at the requisite procedure"
 surveillance_acquired_ip3:0 "Thanks to our discreet surveillance of the conspirators, we were able to determine that they were having an animated discussion concerning [ROOT.GetCharacter.GetName], [SCOPE.Custom('get_successor_type')]"
 got_not_informed_ip7:0 "Unfortunately, considering that we had no idea that the two conspirators were targeting this attack, a sizeable quantity of wealth was stolen, and no evidence was found."
 got_informed_ip7:0 "Luckily, considering that we were able to arrange a warning in advance, no damage was done, and although we were unable to catch the perpetrator in the act, public opinion is that the two rogues were responsible."
 got_target_won:0 "Thankfully, due to exceptional martial ability, the fight went in favour of the defender"
 got_target_lost:0 "Unfortunately, due to poor martial ability, the attack went in favour of the attacker, although the defender luckily managed to escape having only been wounded"
 got_tribal_city_type:0 "decentralised tribal settlements"
 republic_25_issue_3:0 "lack of marvellous iconography in the senatorial chamber"
 republic_25_issue_4:0 "dreadful state of the senatorial guard, who are frequently in attendance at important debates"
 tribal_pol_17_duel_reason_2:0 "[SCOPE.sCharacter('clan_chief_duel_victim').GetName] came across [SCOPE.sCharacter('clan_chief_duel_perpetrator').GetName] with some of the women of [SCOPE.sCharacter('clan_chief_duel_victim').GetHerHis] tribe. Now [SCOPE.sCharacter('clan_chief_duel_victim').GetName] requires an honour to make up for the dishonour."
 tribal_pol_17_duel_reason_3:0 "For years [SCOPE.sCharacter('clan_chief_duel_victim').GetName] have asserted [SCOPE.sCharacter('clan_chief_duel_perpetrator').GetName] is out to eliminate [SCOPE.sCharacter('clan_chief_duel_victim').GetHerHim]. Now it has come to a front, as both parties require a duel to resolve this matter. "
 tribal_pol_17_duel_reason_4:0 "[SCOPE.sCharacter('clan_chief_duel_victim').GetName] has been offended and insulted by [SCOPE.sCharacter('clan_chief_duel_perpetrator').GetName] for a long time now, and it seems to have reached a novel height as [SCOPE.sCharacter('clan_chief_duel_victim').GetName] requires a duel to make up for this dishonourable treatment. "
 tribal_pol_17_duel_reason_5:0 "After another religious ceremony [SCOPE.sCharacter('clan_chief_duel_perpetrator').GetName] didn't take part in, [SCOPE.sCharacter('clan_chief_duel_victim').GetName] has required a duel from [SCOPE.sCharacter('clan_chief_duel_perpetrator').GetHerHim], declaring that this blasphemy can be accepted no longer. "
 tribal_pol_30_desc_1:0 "[SCOPE.sCharacter('clan_chief_one').GetName] has supposedly come across a foreign agent at court, and [SCOPE.sCharacter('clan_chief_one').GetSheHe] is heavily advising us to close the court down. Not only would it limit the potential dangerous elements that can advance towards our esteemed ruler [ROOT.GetCountry.GetRuler.GetName], but it would also provide [ROOT.GetCountry.GetRuler.GetHerHim] the space necessary to make the correct decisions."
 religionator_starting:0 "a faithful and proficient zealot"
 religionator_unknown:0 "something of an indeterminate quantity"
 culturenator_local_renown:0 "a proficient purveyor of [ROOT.GetCharacter.GetEmployer.GetAdjective] values"
 culturenator_amazing:0 "an austere critic of anything non-[ROOT.GetCharacter.GetEmployer.GetAdjective]"
 enlightenator_godly:0 "a radiant and glorious uplifter of lesser entities"
 get_nearby_volcano_default:0 "a proximate volcano"
 get_random_ancient_text_keyword_new_version:0 "a novel version of"
 get_random_ancient_text_keyword_unknown_version:0 "an unidentified version of"
 get_satrapy_project_outcome_army:0 "Our armies have been fortified, our people more valorous and disciplined than ever before. Our armies will go down in history, known for our bravery and valiance in armed conflict.\n\nMoving forward, with the men of our nation backing us, we will be able to challenge our neighbours and adversaries."
 get_satrapy_project_outcome_income:0 "Merchants from far and wide seek out our legendary [ROOT.GetCountry.GetAdjective] markets, well known for the rare and exotic trade goods sold by our vendors. Our neighbours and adversaries observe our frontiers in envy, desiring to obtain our riches from us.\n\n The next years will be essential for securing our place in history once and for all."
 get_satrapy_project_outcome_peace:0 "Peace has descended upon our nation, bring expansion and prosperity to all. No longer will those under our rule fight or squabble with one another, but we will all look forward to the future together.\n\nWith our lands fortified, it is time to move our plans forward."
 get_satrapy_vasal_gift_elephants:0 "[SCOPE.sCountry('vassal_country').GetRuler.GetSheHe|U] dispatched us a minor cadre of elephant riders, prepared to serve us in armed conflict."
 get_satrapy_vasal_gift_camels:0 "[SCOPE.sCountry('vassal_country').GetRuler.GetSheHe|U] dispatched us some groups of camel riders, prepared to serve us in armed conflict."
 get_satrapy_vasal_gift_horses:0 "[SCOPE.sCountry('vassal_country').GetRuler.GetSheHe|U] dispatched us some groups of horse archers, prepared to serve us in armed conflict."
 get_type_of_reborn_heir_zeal:0 "[SCOPE.sCharacter('reborn_heir').GetSheHe|U] was once a rich prince, unable to see the hardships of those who lived beneath his rule. Days, weeks and years passed as his people suffered and perished, unbeknown to the prince.\n\nWhen the prince finally learned concerning the struggles of his people, he did not toss them aside or pretend to care. Instead he gave away all his material wealth, and left the life of riches, to walk amongst and become acquainted with those he had once ruled. Acquiring great sagacity and insight into existence itself, the aged prince now became a great teacher and wiseman of the people who started to gather around him. He lived a long life, sharing the knowledge with the disciples who followed him."
 get_type_of_reborn_heir_finesse:0 "[SCOPE.sCharacter('reborn_heir').GetSheHe|U] was once the younger of two brothers, raised in a family who had long been part of the political terrain of their nation. As a politician serving his term, he saw the suffering of the veterans who had bled and fought for the nation, and the issues and problems they caused as they were tossed aside after their service had concluded.\n\nAfter the demise of his brother, who had tried to force through reforms in the political terrain, he picked up the pieces and tried to reform the nation himself. Pushing through several popular reforms, he became one of the most important politicians of his time, popular among the people rather than his peers.\n\nSadly, after the demise of one of his enemies he was incorrectly named as the perpetrator, and ended up being murdered in the ensuing conflict."
 get_type_of_reborn_heir_martial:0 "[SCOPE.sCharacter('reborn_heir').GetSheHe|U] was once a great general of a people pursuing revenge on their ancient enemies to the north. Bringing his exotic troops through ancient lands and across tall snow peaked mountains, he descended down upon his faithless enemies.\n\nThough he outsmarted his enemies time and time again, he never managed to siege down their ancient city, and was in the end forced to depart the peninsula as his own home was in danger of being taken by his nemesis.\n\nIn the end he lost the final battle and was exiled from his homeland, only to be hunted down by his enemies and forced to terminate his life with poison."
 get_type_of_reborn_heir_martial_2:0 "[SCOPE.sCharacter('reborn_heir').GetSheHe|U] was once a great statesman who led his troops deep into wild lands, filled with warrior tribes unlike any seen before. Pushing back the enemies at every turn, he managed to quell the dangerous lands and force them under his control. As his term was ending, his rivals at home attempted to trick him into letting his troops go so they could seize him before he became even more powerful than he previously was.\n\nForced into a dangerous civil war against his old friends and allies, he won every battle until there was none left to fight. He thought at the time that pardoning his enemies was the correct method to get.\n\nIn the end, the ones he had once pardoned, all assembled together to impale him to death."
 get_type_of_reborn_heir_charisma:0 "[SCOPE.sCharacter('reborn_heir').GetSheHe|U] was once a wiseman who started questioning traditions and the way of life in the city he lived in. He talked to the youngsters living in the city, inquiring of them questions concerning every single topic he could contemplate.\n\nGrowing a minor following of his own, people started to look to him for guidance in their life, writing down his words and ideas. Supposedly an oracle even asserted that he was the wisest man there was.\n\nAs his city started to deteriorate, he was partly censured for misleading the youth, and was forced to terminate his life with poison."
 get_ip_rep_52_mercantile:0 "bolstering commerce by eliminating tariffs and improving relations"
 get_ip_rep_52_populist:0 "granting veterans land and increasing the fundamental bread allowance"
 get_ip_rep_53_civic:0 "increase our tax revenue somewhat by establishing a novel collection service"
 get_ip_rep_53_populist:0 "increase the fundamental bread dole allotted to every freeman and citizen in [ROOT.GetCountry.GetCapital.GetName]"
 get_ip_rep_55_mercantile:0 "commerce and foreign"
 get_ip_rep_58_religious:1 " temple maintenance and festivals"
 get_ip_rep_58_populist:1 " the fundamental bread dole and military pensions"
 ip_mon_48_martial_desc:0 "The proposals stem from their interest in military matters; the first focuses on the quality of our training methods, while the other is centred around bolstering recruitment numbers."
 ip_mon_48_finesse_desc:0 "The proposals stem from their interest in administrative matters; the first focuses on the efficiency of our tax collection, while the other is centred around optimising construction methods."
 ip_mon_48_charisma_desc:0 "The proposals stem from their interest in public matters; the first focuses on improving the spirits of our people, while the other is centred around improving our ability to integrate subject governments."
 ip_mon_48_zeal_desc:0 "The proposals stem from their interest in religious matters; the first focuses on ensuring the authority of the priesthood, while the other is centred around encouraging the conversion of religious minorities."
 get_battle_win_1:0 "lead a whirlwind counter-attack after deep scouts of the enemy attempted to overrun the baggage train, preventing a major panic in the rear, prior to tailing them as far as the battle where [SCOPE.sChar('ip_mon_59_consort').GetSheHe] then supported the main attack of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen]!"
 get_battle_win_2:0 "took command of the army's left flank, bracing versus a major assault prior to routing the enemy and chasing them near into the enemy camp, prior to circling to the support of [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] and delivering a crushing blow to the turned flank of the opposing army!"
 get_battle_win_3:0 "remained close to [ROOT.GetCountry.GetRuler.GetPraenomen], giving counsel with [ROOT.GetCountry.GetRuler.GetHerHis] generals and providing an extra pair of eyes as the battle unfolded, prior to hurtling into the fray with the companion cavalry!"
 get_battle_loss_2:0 "took command of the army's left flank but despite courageous fighting was unable to hold the ferocious assault of the enemy. The left crumbled, threatening the encirclement of the centre and signalling a rout of the [ROOT.GetCountry.GetAdjective] forces."
 get_battle_loss_3:0 "stayed at the side of [ROOT.GetCountry.GetRuler.GetPraenomen], giving counsel with [ROOT.GetCountry.GetRuler.GetHerHis] generals and providing an extra pair of eyes as the battle unfolded, prior to hurtling into the fray with companion cavalry!"
 get_battle_injury_3:0 "fell and was trampled by a horse, narrowly evading being crushed."
 get_battle_injury_4:0 "took a chance arrow to the neck and was eliminated instantly."
 get_battle_injury_5:0 "was unhorsed by a determined attacker and perished on the field in the chaos of the melee."
 get_pytheas_port_home:0 "the vessel of our renowned explorer [SCOPE.sChar('pytheas_scope').GetPraenomen] returned to port in [SCOPE.sP('massilia_port_scope')] today."
 get_pytheas_port_fallback:0 "the vessel of our renowned explorer [SCOPE.sChar('pytheas_scope').GetPraenomen] returned to the port of [SCOPE.sP('massilia_port_scope')] today."
 pytheas_study_subject_mil_1:0 "vessel construction"
 get_theocratic_republic:0 "the priests retaining power"
 get_founder_experience:0 "a magnificent dreamer"
 popular_ruler_pirate_attack:0 "[ROOT.GetCountry.GetRuler.GetName], wary of losing favour with the local population, has decided to give in to its requirements. After a year of preparation, [ROOT.GetCountry.GetRuler.GetSheHe] is finally ready to attack. [ROOT.GetCountry.GetRuler.GetHerHis|U] advisors are unable to agree, however, on whether it would be best to attack them by land or by sea."
 arrogant_ruler_pirate_attack:0 "[ROOT.GetCountry.GetRuler.GetName] has spent a year drilling [ROOT.GetCountry.GetRuler.GetHerHis] forces, accumulating supplies, and making the necessary preparations. [ROOT.GetCountry.GetRuler.GetHerHis|U] advisors are unable to agree, however, on whether it would be best to attack them by land or by sea. Naturally, they have turned to [ROOT.GetCountry.GetRuler.GetName] to make the decision, being the tactical genius that [ROOT.GetCountry.GetRuler.GetSheHe] is."
 generic_attack_pirate_attack:0 "[ROOT.GetCountry.GetRuler.GetName] has spent a year drilling [ROOT.GetCountry.GetRuler.GetHerHis] forces, accumulating supplies, and making the necessary preparations. [ROOT.GetCountry.GetRuler.GetHerHis|U] advisors are unable to agree, however, on whether it would be best to attack them by land or by sea."
 get_pg_sipontum_desc:0 "The Greeks of Sipious may not retain the prestige of some of the other Greek urban centres in Italia, but their Adriatic port and proximity to Rome make them a juicy enough target."
 get_pg_metapontum_desc:0 "Metapontum is a successful city bordering the Tarentines, and though its heyday may be over it is advisable not to underestimate their tenacity, nor their talent for persistence."
 get_pg_tarentum_desc:0 "Tarentum is a trophy, with their wealth of fine ceramics, famous cavalry ability, and valuable harbour - it is easy to see why the Epirotes are so willing to lend a hand in their conflicts..."
 get_pg_thuria_desc:0 "Thuria has had its equitable share of knocks and glory, bickering constantly with its neighbours and harbouring the famous Spartan traitor Alkibiades. Their subjection by the Lucanians has not damaged them too severely."
 get_pg_croton_desc:0 "Croton is the main Italiotian centre of learning, and where the mathematician Pythagoras founded his school. They may be willing to exchange liberty for a safer environment to conduct lessons and pour over books."
 get_pg_hipponium_desc:0 "Hipponium has a tragic past, targeted by Dionsyius the Elder, then tyrant of Syracuse. These misfortunes may fall in our favour; men can befall only so much misery before they pursue security."
 get_pg_locri_desc:0 "Locri, so called 'Flower of Italy', has a glorious past, founded the city of Hipponium, and is famed for its sanctuaries of Persephone and Aphrodite. With fortune the Locrians will love our proposals."
 get_pg_rhegium_desc:0 "Rhegium, gateway to Sicilia, maintains a strategic position controlling the straits of Scylla and Charbydis. It will be key to undermining the vigour of the Syracusans and Carthaginians who bicker across the waves."
 bitter_corrupt:0 "placing their own enrichment and interests prior to those of any other"
 bitter_selfish:0 "ever heedless of the necessities and concerns of others and caring only for themselves"
 bitter_foolish:0 "lacking any real insight into the consequences and motivated by a petty notion of 'demonstrating to our leader what is what'"
 bitter_friend:0 "choosing to honour their personal relationship with the tyrant over the necessities of the body politic"
