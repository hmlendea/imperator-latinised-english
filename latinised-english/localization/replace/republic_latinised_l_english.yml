l_english:
 optimates_party_description:0 "The Optimates are the elite of our nation, rich and powerful senators who want to divide the power of the Republic between themselves rather than letting the unwashed masses affect the rule of statute.\n\nThey approve of changes made for the established greater families and elite, and hold a deep disdain for any would be populist upstart."
 populares_party_description:0 "The Populares are the senators who labour for the common man, or at least claim so to get popular backing and make their own political platforms relevant. Popular generals and corrupt politicians have a tendency to join this party, as it lets them toss aside ancient traditions that might negatively affect their own rise to power.\n\nThey approve of actions that reduce the influence of the Optimates, and disagree with any moves to cement the control of the upper class."
 boni_party_description:0 "The Boni are aristocrats who believe in the ancient traditions of the nation, rather than taking parts in the conflicts between classes like the Optimates or Populares. They strive to find a balance between the requirements of the lower classes and upholding the stability of the nation, through gradual reform.\n\nThey approve of leaders who actively seek to preserve the peace and stability of the nation, and disapprove of anything that would break the current balance."
 oligarchic_party_description:0 "The Oligarchs are the ancient nobles of our nation, and their supporters, who seek to dominate the political life of the country to their own ends and benefit. As such they eschew, and at best tolerate, the participation of the general populace in politics, which is a menace to their privileged status."
 republic_button_empower_faction_desc_loc_optimates:0 "The Optimates are invariably trying to alter the assemblies in their favour in order to gain even greater influence over the Republic. By changing the numbers of electors in the different voting assemblies, the elite aristocracy will be able to secure a majority without the influence of the lesser classes.\n\nThis can be used once every 10 years, and only if you have not already used '$republic_button_empower_faction_loc_populares$'."
 republic_button_empower_faction_loc_populares:0 "Grant Public Territory"
 republic_button_empower_faction_desc_loc_populares:0 "The veterans and poorer parts of the population are an important base of support for the Populares, kept alive by the occasional concession of territory they can farm.\n\nThis can used once every 10 years, and only if you have not already used '$republic_button_empower_faction_loc_optimates$'."
 republic_button_empower_faction_desc_loc_boni:1 "The Boni are known for eschewing newer trends and ideas in favour of ancient ones, holding ancient [SCOPE.GetRootScope.GetCharacter.GetEmployer.GetPrimaryCulture.GetName] ways as a lofty standard with which few others can compete. They regularly set aside their affluence to support those who hold the identical ideals, often a popular move among the general populace who see them as philanthropists.\n\nThis can be used once every 10 years."
 democrats_party_empower_button_effect_tooltip:1 "This reform would make up to [SCOPE.ScriptValue('scripted_gui_country_rank_svalue')|0] #Y [player.GetReligion.GetName]#! #Y [player.GetPrimaryCulture.GetName]#! promote to #Y Citizen#! but there are no #Y [player.GetReligion.GetName]#! #Y [player.GetPrimaryCulture.GetName]#! majority urban centres in your country.\n\n"
 APPROVAL_MODIFIER_WAR:0 "[SCOPE.GetRootScope.GetCountry.GetName] is at conflict: $VALUE|+=$"
 APPROVAL_MODIFIER_WAR_EXHAUSTION:0 "[SCOPE.GetRootScope.GetCountry.GetName] is suffering from @war_exhaustion! Conflict Exhaustion: $VALUE|+=$"
