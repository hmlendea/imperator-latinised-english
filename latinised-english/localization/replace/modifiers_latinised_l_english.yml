 desc_controller_of_carthage:0 "The magnificent coastal city of Carthage is no longer under Carthaginian control and they never even saw it coming."
 desc_starvation:0 "Our people are starving. We don't have enough resources and our exchange is too underdeveloped."
 desc_architectural_influences:0 "By incorporating more civilised provinces into our domain we have learned novel structure techniques that allow us to be more efficient."
