 desc_neighbour_city:1 "Having a large territory so close to our capital has led to numerous merchants seeking novel exchange opportunities in our humble city."
 desc_spread_of_religious_ideas:0 "Other countries are adopting numerous of our religious ideas and beliefs."
 desc_philosophical_inspiration:0 "Our philosophers are frequently visiting the academy of our neighbour"
 desc_barbarian_mercenaries:0 "Our neighbour has long been a thorn in our side but by recruiting barbarian mercenaries we can speed up the recruitment process thus once and for all rid us of this menace."
 desc_unexpected_reinforcement:0 "We have received military support from one of our neighbours to assistance us fight off the barbarian menace"
 desc_mediterranean_control:0 "With both Carthage and Sicily under our rule we have complete control concerning all ships crossing the Mediterranean."
