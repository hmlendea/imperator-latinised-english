 desc_province_diminishment_druidic_conflict:0 "The druids residing here are currently in the middle of a conflict with their neighbours, and deeply disappointed in their ruler for not supporting them."
 desc_country_improvement_druids_troop_morale:0 "Our troops have been inspired for conflict by our druids."
 desc_country_improvement_druids_manpower:0 "Our populace have been inspired for conflict by our druids."
 desc_formable_crete_capital_mod:0 "The proud people of Crete have long been admired for their cultural, artistic, and administrative talent. This is the site of a unified Cretan administration, ushering in a novel era for this island of prosperity."
 desc_country_improvement_found_guidance:0 "Facing a national crisis, a local oracle helped us discover guidance."
 desc_cedars_of_lebanon:0 "These mountains are home to extensive and ancient forests of Cedars, some are said to be thousands of years ancient, while others have been replanted by the local woodcutters. The region's fabled forests have provided wood for magnificent ships for generations."
 desc_tyrian_purple:0 "Tyrian Purple is one of the most sought after dyes in the world and nowhere is the production of dyes such an integral part of the local economy as here. Every year thousands of sea snails are fermented in magnificent vats, in order to produce more of the deep red color."
 desc_rhodian_glass_workshops:0 "The workshops of Rhodes are not only famous for their productivity but also their inventiveness. Concerning the last 200 years much have been done to perfect the art of glass casting and the island is by far the biggest centre of Glass production in the Mediterranean."
 desc_nisean_horses:0 "Horses from the plain of Nisea, close to Bisitun, have been used by Persian nobles and nobility for hundreds of years and their fame has made them sought after from Macedonia to the edges of India. During Achaemenid times this region was home to a royal stable, that still housed 50 000 mares when Alexander the Magnificent passed via, en route to Ecbatana."
 desc_country_improvement_cybele_blessing:1 "We have been blessed with a magnificent harvest by the Mother Goddess."
 desc_formable_capital_modifier:0 "This city is the site of a concerted effort to administer an emergent civilisation."
