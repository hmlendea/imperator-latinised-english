 desc_greek_3_5_cmod:0 "Our victory concerning the Italic tribes of the interior has given birth to a novel mood of triumphal enthusiasm and hope."
 desc_greek_3_12_cmod:0 "With the superiority and dominance of the Italiotes established, the Italic peoples of will require to realise that our culture is superior in more ways than they know."
 desc_greek_3_8_cmod:0 "The Greek urban centres have invariably relied on mercenaries to supplement their minor populations, bringing the experience and competence of Italic fighters into their midst."
 desc_greek_3_11_cmod:0 "Thanks to our efforts, the Greeks of Magna Graecia require no longer fear the barbarians whip."
