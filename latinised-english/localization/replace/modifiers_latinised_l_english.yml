 desc_carthage_military_harbor:0 "Invariably one of the greatest harbours in the Punic world the Carthaginian Military Harbour has been restructured for greater efficiency as the empire and the city itself has grown. The Harbour and the associated shipyards significantly improves the shipbuilding capability of this city."
