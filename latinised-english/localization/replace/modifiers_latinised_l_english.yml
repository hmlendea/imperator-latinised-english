 desc_stunted_growth:0 "The population of state culture settlers in this city has run into considerable trouble with the locals. The unwillingness of the central government to assistance them means that this outpost is now struggling."
 desc_museion_of_alexandria:1 "This territory is home to a temple of the Muses. A magnificent sanctuary of learning with the ambition of collecting all literature in Greek ever written. Novel translations are also being made of any non Greek literature of quality for the benefit of the wider Greek audience."
 desc_alexandria:2 "This territory was founded by Alexander the Magnificent with the intention of solidifying the hold of Hellenic culture concerning the entire region. He also went to magnificent lengths to plan and fund the infrastructure to support a magnificent city in the future."
 pyramid_complex:0 "Magnificent Pyramids"
 desc_pyramid_complex:1 "Built thousands of years ago there are no works of construction that can measure up to the Magnificent Pyramids of Egypt. Ever since they were built they have continued to attract the attention of faraway travellers while also serving as a constant reminder of how ancient the native Egyptian Culture truly is."
 desc_gardens_of_babylon:1 "Babylon is a territory that is as ancient as it is famous. The fabled Gardens of Babylon were built along a grand palace known as 'The Marvel of Mankind' by Nebuchadnezzar II, hundreds of years ago. The gardens remain a testament to the Neo Babylonian Empire and impress noble and commoner alike encircling the world."
 desc_disenfranchised_greeks:0 "Greek settlers in this territory are distress that the state is not catering to them. They are accusing our state of having turned its back at the Greek world."
