 desc_athenian_mission_04_amphipolian_mines_modifier:0 "The rich mines close to Amphipolis have been expanded upon to bring greater affluence and riches to whoever controls the area."
 desc_me_gre_2_7_pmod:0 "We have established a cosmopolitan centre of Hellenic civilisation ensuring the dominance of our culture in Greece."
 desc_me_gre_2_16_cmod:0 "Our demands for integrated commercial practices and standardised measures have increased our tributary revenue."
 desc_me_gre_2_16_trib_cmod:0 "Our overlords dominance and influence concerning our markets sends more and more of our funds their way."
 desc_me_gre_2_11_cmod:0 "Our numerous feudatories across Greece have turned into something akin to the Spartans at the height of their power, dominating the urban centres of the region."
 desc_me_gre_2_18_cmod:0 "Our influence spreads across the Aegean like the tentacles of a sea creature, making the hard ways of the sea everyday life for numerous of our people."
 desc_greek_2_9_1_cmod:0 "The magnificent urban centres of Greece are all pulling in the identical direction for the first time under our leadership, driving our economy and vindicating our government."
 desc_greek_2_14_cmod:0 "We have shown the Macedonians once and for all that the time for honouring them is at an end."
 desc_me_gre_2_45_cmod:0 "The fervor and determination inspired by our leader has dismissed numerous of the concerns usually arising from aggressive conquests."
 desc_me_gre_2_12_cmod:0 "The people of Greece still remember the liberty enjoyed by their divided urban centres, and resent the imposition of central authority."
 desc_pythagoras_tomb_modifier:0 "After being driven out of Croton, the mathematician and sage Pythagoras settled in Metapontum and was well received. Upon his death a temple was dedicated to Demeter in his home, which still inspires the adherents of his doctrine and attracts visitors."
 desc_me_gre_3_9_pmod:0 "The redevelopment of this city has inspired its population and that of the Italiote urban centres with its grandeur and sophistication."
 desc_me_gre_3_6_cmod:0 "Our recent successes after so numerous years of stagnation have inspired a novel ambition amongst our people."
 desc_me_gre_3_19_1_cmod:0 "Our cavalry has proven its worth, and by keenly keeping pace with military advancements we can ensure it invariably will."
 desc_me_gre_3_19_2_cmod:0 "Our ancestors suffered fleeing concerning the waves, but it taught our people the value of the ocean and how to turn it to our advantage."
 desc_me_gre_3_19_3_cmod:0 "Pythagroas is a shining example of the possibilities offered by learning and inquisitiveness, and his school's followers adhere even now to his moral doctrine."
 desc_me_gre_3_19_7_1_cmod:0 "The discipline and training of Spartan soldiers is unmatched, we must make every male the best he can be. $me_gre_3_19_7_7_cmod_desc$"
 desc_me_gre_3_19_7_2_cmod:0 "The naval of empire of Athens made full use of developments in vessel structure and naval tactics to turn the tide. $me_gre_3_19_7_7_cmod_desc$"
 desc_me_gre_3_19_7_5_cmod:0 "Locrians, surrounded on all sides, know the value of defence and winning the gods favour. $me_gre_3_19_7_7_cmod_desc$"
 desc_me_gre_3_19_7_6_cmod:0 "The centre of Euboea, Chalkis is known for its robust naval heritage and defensive possibilities. $me_gre_3_19_7_7_cmod_desc$"
 desc_me_gre_3_19_7_7_cmod:0 "Phocaeans have a robust tradition of naval migration to novel lands and warfare at sea. $me_gre_3_19_7_7_cmod_desc$"
 me_gre_3_19_7_7_cmod_desc:0 "The sagacity and traditions of our mother city will guide us to victory."
