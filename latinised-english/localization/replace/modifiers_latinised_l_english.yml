 desc_school_of_athens:0 "Athens has long been a centre of culture and philosophy and numerous of our nation's greatest scholars call it their home."
 desc_scientific_supremacy:0 "We are the proud owners of the magnificent libraries of Alexandria and Pergamon and the cultural city of Athens that make us the predominant cultural and scientific power of the world."
