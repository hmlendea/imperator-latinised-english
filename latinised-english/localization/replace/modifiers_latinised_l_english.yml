 desc_hellespont:0 "Controlling the narrow Hellespont strait allows for more efficient taxation of maritime exchange as well as being an ideal place for defensive installations."
 desc_bosporus:0 "The importance of the Bosphorus strait has allowed its owner strategic control of maritime exchange for numerous generations."
 desc_civilized_tribe:0 "Your people have left their tribal past behind them and are now embracing a novel future. In time the changes to our society will be the novel status quo and novel conflicts will brew but right now most things in our society are pulling in the identical direction."
