l_english:
 desc_tribal_reform_law_modifier:0 "The ancient statutes are no longer enough to maintain our people secure. Whilst it may cause a period of instability, this is a tempest we must weather."
 tribal_reform.1.desc:0 "The proud heritage of our people has endured for generations, and yet the ever-changing fabric of our existence has brought greater knowledge of the world and people that surround us.\n\nIn an extraordinary council meeting, the heads of two of our greatest families, the [SCOPE.sFamily('republic_family').GetName] and the [SCOPE.sFamily('monarchy_family').GetName], have both suggested that is time for us to abandon our way of rule, in favour of a novel set of statutes.\n\nThe [SCOPE.sFamily('monarchy_family').GetName] favour the institution known as Monarchy; drawing inspiration from tales of the great Grecian Kings, whereas the [SCOPE.sFamily('republic_family').GetName] advocate for an equal system of rule, inspired by tales of the Carthaginian Empire and Athenians of whom we have heard much."
 desc_civilized_tribe_ppmod:0 "Once the site of a thriving tribal centre, the heritage of this site is not easily forgotten."
 desc_administrative_purge_rep:0 "Monarchist sentiment has no place in our great nation - we must strive to eliminate menaces from within."
 tribal_reform.2.desc:0 "In pursuit of our ideal government, many obstacles stand in the way. One of those obstacles goes by the name of [SCOPE.sChar('purge_target').GetPraenomen], who possesses a robust allegiance to a cause not aligned with our own.\n\nLogic dictates a certain amount of tolerance for opposing ideologies, however, our advisors recommend that the jarring notions of [SCOPE.sChar('purge_target').GetPraenomen] are simply too far-fetched to warrant a continued place in our government."
 tribal_reform.2.b:0 "We is unable to censure those who have served us well."
 tribal_reform_2_e:0 "Invoke the Novel Constitution"
 tribal_reform_decision_desc:0 "It is time for our people to consider novel methods of rule. Foreign ideals flood our country - can we truly remain a nomadic people?"
 grant_offices_monarchy_reform_tt:0 "Several members of the #Y [SCOPE.sFamily('monarchy_family').GetName]#! are granted office in our novel government."
 grant_offices_republic_reform_tt:0 "Several members of the #Y [SCOPE.sFamily('republic_family').GetName]#! are granted office in our novel government."
